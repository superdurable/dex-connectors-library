<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dex Connectors</title>
    <link rel="icon" href="/favicon.svg?v=pipe-d-tile" type="image/svg+xml" />
    <!-- Shared superdurable.io theme selection: cookie, then localStorage, then system preference. -->
    <script>
      (function () {
        try {
          var cookieMatch = document.cookie.match(/(?:^|; )superdurable-theme=(light|dark)(?:;|$)/);
          var cookieTheme = cookieMatch ? cookieMatch[1] : null;
          var storedTheme = window.localStorage.getItem("superdurable-theme");
          var systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var theme = cookieTheme || (storedTheme === "dark" || storedTheme === "light" ? storedTheme : systemTheme);
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          if (!cookieTheme && (storedTheme === "dark" || storedTheme === "light")) {
            var isSuperDurableDomain = window.location.hostname === "superdurable.io" ||
              window.location.hostname.endsWith(".superdurable.io");
            var sharedAttributes = isSuperDurableDomain ? "; Domain=.superdurable.io; Secure" : "";
            document.cookie = "superdurable-theme=" + storedTheme +
              "; Path=/; Max-Age=31536000; SameSite=Lax" + sharedAttributes;
          }
        } catch (_) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
