[project]
name = "dex-connectors-mcp-hackernews-agent-example"
version = "0.0.0"
description = "A Dex agent session that calls Hacker News through dex-connectors-mcp"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["dex-agents[mcp]==0.5.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
