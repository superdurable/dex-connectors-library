name: Release Connector Go SDK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: minor
        type: choice
        options:
          - minor
          - patch
          - major
      dry_run:
        description: Test and plan without creating a release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-connector-go-sdk
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdkgo/go.mod
          cache-dependency-path: sdkgo/go.sum
      - name: Test standalone SDK module
        working-directory: sdkgo
        env:
          GOWORK: "off"
        run: |
          go test -race ./...
          go vet ./...
      - name: Download the latest stable Dex CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/dex_compatibility.py install-dexcli --output ./dexcli
      - name: Test fixture connector with real Dex
        run: |
          ./dexcli dev -dex-port 18801 -web-port 18802 -open=false \
            -zd-data-dir /tmp/dex-connectors-sdk/zd \
            -server-log-folder /tmp/dex-connectors-sdk/logs > /tmp/dex-connectors-sdk-server.log 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/18801) 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then
              cat /tmp/dex-connectors-sdk-server.log
              exit 1
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then
            cat /tmp/dex-connectors-sdk-server.log
            exit 1
          fi
          cd sdkgo
          DEX_FLOW_SERVICE_ADDRESS=127.0.0.1:18801 GOWORK=off \
            go test -race -tags=integration ./integrationtest/... -count=1 -v
      - name: Plan SDK release
        id: plan
        run: |
          python3 script/release/component_release.py plan \
            --component-path sdkgo \
            --tag-prefix sdkgo/ \
            --bump "${{ inputs.bump }}" \
            --ref "${GITHUB_REF}" \
            --json-output /tmp/connector-sdk-release-plan.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Build path-scoped release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/release/component_release.py notes \
            --plan /tmp/connector-sdk-release-plan.json \
            --repository "${GITHUB_REPOSITORY}" \
            --output /tmp/connector-sdk-release-notes.md
      - name: Create SDK release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Go SDK ${RELEASE_VERSION}" \
            --notes-file /tmp/connector-sdk-release-notes.md
      - name: Verify published module
        if: inputs.dry_run != true
        env:
          MODULE_PATH: ${{ steps.plan.outputs.module_path }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          deadline=$((SECONDS + 120))
          until GOWORK=off GOPROXY=direct GONOSUMDB=github.com/superdurable/dex-connectors-library \
            go mod download "${MODULE_PATH}@${RELEASE_VERSION}"; do
            if (( SECONDS >= deadline )); then
              echo "Published SDK module did not become downloadable before the deadline" >&2
              exit 1
            fi
            sleep 2
          done

  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "SDK releases can run only from main" >&2
          exit 1
