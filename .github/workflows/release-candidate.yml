name: Release Connector Candidate
# The platform finds the run of its dispatched request by this name.
run-name: "RC ${{ github.event.client_payload.directory || inputs.directory }} ${{ github.event.client_payload.version || inputs.version }} ${{ github.event.client_payload.commit || inputs.commit }}"

# A release candidate publishes one connector from a commit that is not on main yet, with the same release assets as
# a release. The workflow runs from main, so a candidate branch cannot change it; only the verify job runs the
# candidate's code, and it holds a read-only token.
on:
  repository_dispatch:
    types: [connector-release-candidate]
  workflow_dispatch:
    inputs:
      directory:
        description: Registered Connector directory, such as connectors/superdurable/llm
        required: true
        type: string
      commit:
        description: Full SHA of the candidate commit
        required: true
        type: string
      version:
        description: Release candidate version, vX.Y.Z-rc.N, where vX.Y.Z is the manifest version
        required: true
        type: string
      language:
        description: python or typescript; leave empty for Go
        required: false
        type: string
      dry_run:
        description: Build and verify without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-connector-candidate-${{ github.event.client_payload.directory || inputs.directory }}
  cancel-in-progress: false

env:
  CANDIDATE_DIRECTORY: ${{ github.event.client_payload.directory || inputs.directory }}
  CANDIDATE_COMMIT: ${{ github.event.client_payload.commit || inputs.commit }}
  CANDIDATE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
  CANDIDATE_LANGUAGE: ${{ github.event.client_payload.language || inputs.language }}
  CANDIDATE_DRY_RUN: ${{ github.event.client_payload.dry_run || inputs.dry_run }}
  GOWORK: "off"

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      manifest_path: ${{ steps.candidate.outputs.manifest_path }}
      module_path: ${{ steps.candidate.outputs.module_path }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      display_name: ${{ steps.candidate.outputs.display_name }}
      language: ${{ steps.candidate.outputs.language }}
      package: ${{ steps.candidate.outputs.package }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate the candidate with main's tooling
        id: candidate
        run: |
          git fetch --no-tags origin "${CANDIDATE_COMMIT}"
          git worktree add --detach "${RUNNER_TEMP}/candidate" "${CANDIDATE_COMMIT}"
          go run ./cmd/connectorctl release-candidate \
            --catalog catalog.yaml \
            --candidate-root "${RUNNER_TEMP}/candidate" \
            --directory "${CANDIDATE_DIRECTORY}" \
            --commit "${CANDIDATE_COMMIT}" \
            --version "${CANDIDATE_VERSION}" \
            --language "${CANDIDATE_LANGUAGE}" \
            --github-output "${GITHUB_OUTPUT}"

  verify:
    needs: plan
    if: needs.plan.outputs.language == ''
    runs-on: ubuntu-latest
    env:
      MANIFEST_PATH: ${{ needs.plan.outputs.manifest_path }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            ${{ env.CANDIDATE_DIRECTORY }}/go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check generated Connector code
        run: go run ./cmd/connectorctl generate --check "${MANIFEST_PATH}"
      - name: Validate published SDK and connector dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 script/release/component_release.py validate-connector \
            --component-path "${CANDIDATE_DIRECTORY}/go" \
            --sdk-module github.com/superdurable/dex-connectors-library/sdkgo
      - name: Test standalone Connector module
        working-directory: ${{ env.CANDIDATE_DIRECTORY }}/go
        run: |
          go test -race ./...
          go vet ./...
      - name: Verify the Connector with the latest stable Dex CLI and Web
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/dex_compatibility.py current --connector-directories "${CANDIDATE_DIRECTORY}"
      - name: Build and test Connector Studio UI
        run: |
          if [ -f "${CANDIDATE_DIRECTORY}/ui/package-lock.json" ]; then
            npm ci --prefix sdk/react
            npm run build --prefix sdk/react
            npm ci --prefix "${CANDIDATE_DIRECTORY}/ui"
            npm test --prefix "${CANDIDATE_DIRECTORY}/ui"
            npm run build --prefix "${CANDIDATE_DIRECTORY}/ui"
            mkdir -p "${RUNNER_TEMP}/ui"
            go run ./cmd/connectorctl ui-artifact \
              --manifest "${MANIFEST_PATH}" \
              --ui-root "${CANDIDATE_DIRECTORY}/ui/dist" \
              --output "${RUNNER_TEMP}/ui/connector-ui.tgz" \
              --digest-output "${RUNNER_TEMP}/ui/connector-ui.tgz.sha256"
          fi
      - name: Keep the Studio UI artifact for publication
        if: hashFiles(format('{0}/ui/package-lock.json', env.CANDIDATE_DIRECTORY)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: connector-ui
          path: ${{ runner.temp }}/ui
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, verify]
    if: needs.plan.outputs.language == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      MODULE_PATH: ${{ needs.plan.outputs.module_path }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      MANIFEST_PATH: ${{ needs.plan.outputs.manifest_path }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: connector-ui
          path: ${{ runner.temp }}/ui
      - name: Build the release candidate artifact with main's tooling
        run: |
          git fetch --no-tags origin "${SOURCE_SHA}"
          git worktree add --detach "${RUNNER_TEMP}/candidate" "${SOURCE_SHA}"
          UI_ARGS=()
          if [ -f "${RUNNER_TEMP}/ui/connector-ui.tgz" ]; then
            UI_ARGS+=(--ui-artifact "${RUNNER_TEMP}/ui/connector-ui.tgz" --ui-digest "${RUNNER_TEMP}/ui/connector-ui.tgz.sha256")
          fi
          go run ./cmd/connectorctl release-artifact \
            --manifest "${RUNNER_TEMP}/candidate/${MANIFEST_PATH}" \
            --module-path "${MODULE_PATH}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-sha "${SOURCE_SHA}" \
            --output /tmp/connector-release.json \
            --digest-output /tmp/connector-release.json.sha256 \
            "${UI_ARGS[@]}"
      - name: Create or repair the pre-release
        if: env.CANDIDATE_DRY_RUN != 'true'
        env:
          RELEASE_DISPLAY_NAME: ${{ needs.plan.outputs.display_name }}
        run: |
          assets=(/tmp/connector-release.json /tmp/connector-release.json.sha256)
          if [ -f "${RUNNER_TEMP}/ui/connector-ui.tgz" ]; then
            assets+=("${RUNNER_TEMP}/ui/connector-ui.tgz" "${RUNNER_TEMP}/ui/connector-ui.tgz.sha256")
          fi
          printf 'Release candidate of %s %s from %s, which is not on main yet. A maintainer releases the reviewed version after its pull request merges.\n' \
            "${RELEASE_DISPLAY_NAME}" "${RELEASE_VERSION}" "${SOURCE_SHA}" > /tmp/connector-release-notes.md
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${assets[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${SOURCE_SHA}" \
              --prerelease \
              --title "${RELEASE_DISPLAY_NAME} ${RELEASE_VERSION}" \
              --notes-file /tmp/connector-release-notes.md \
              "${assets[@]}"
          fi
      - name: Verify the published Connector module
        if: env.CANDIDATE_DRY_RUN != 'true'
        run: |
          deadline=$((SECONDS + 120))
          until GOPROXY=direct GONOSUMDB=github.com/superdurable/dex-connectors-library \
            go mod download "${MODULE_PATH}@${RELEASE_VERSION}"; do
            if (( SECONDS >= deadline )); then
              echo "Published Connector module did not become downloadable before the deadline" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Mark the release candidate complete
        if: env.CANDIDATE_DRY_RUN != 'true'
        run: |
          printf '%s\n' "${RELEASE_TAG}" > /tmp/connector-release.complete
          gh release upload "${RELEASE_TAG}" --clobber /tmp/connector-release.complete

  verify-language:
    needs: plan
    if: needs.plan.outputs.language != ''
    runs-on: ubuntu-latest
    env:
      COMPONENT_PATH: ${{ github.event.client_payload.directory || inputs.directory }}/${{ needs.plan.outputs.language }}
      RELEASE_LANGUAGE: ${{ needs.plan.outputs.language }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
        if: needs.plan.outputs.language == 'python'
      - uses: actions/setup-node@v6
        if: needs.plan.outputs.language == 'typescript'
        with:
          node-version: 24
      - name: Validate released language SDK dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git show origin/main:script/release/component_release.py > "${RUNNER_TEMP}/component_release.py"
          python3 "${RUNNER_TEMP}/component_release.py" validate-language-package \
            --component-path "${COMPONENT_PATH}" --language "${RELEASE_LANGUAGE}"
      - name: Test and build Python candidate
        if: needs.plan.outputs.language == 'python'
        run: |
          test -f "${COMPONENT_PATH}/uv.lock" || { echo 'Python candidate lockfile is missing' >&2; exit 1; }
          uv sync --locked --project "${COMPONENT_PATH}"
          uv run --project "${COMPONENT_PATH}" ruff check "${COMPONENT_PATH}"
          uv run --project "${COMPONENT_PATH}" mypy --strict "${COMPONENT_PATH}/src"
          uv run --project "${COMPONENT_PATH}" pytest "${COMPONENT_PATH}/tests"
          version="${CANDIDATE_VERSION#v}"
          uv version --project "${COMPONENT_PATH}" --frozen "${version/-rc./rc}"
          python3 script/release/component_release.py stamp-language-candidate-manifest \
            --component-path "${COMPONENT_PATH}" --language python --version "${CANDIDATE_VERSION}"
          uv build "${COMPONENT_PATH}" --out-dir "${RUNNER_TEMP}/language-dist"
          rm -f "${RUNNER_TEMP}/language-dist/.gitignore"
      - name: Test and build TypeScript candidate
        if: needs.plan.outputs.language == 'typescript'
        run: |
          npm ci --prefix "${COMPONENT_PATH}"
          npm run typecheck --prefix "${COMPONENT_PATH}"
          npm run lint --prefix "${COMPONENT_PATH}"
          npm test --prefix "${COMPONENT_PATH}"
          npm version --prefix "${COMPONENT_PATH}" --no-git-tag-version "${CANDIDATE_VERSION#v}"
          python3 script/release/component_release.py stamp-language-candidate-manifest \
            --component-path "${COMPONENT_PATH}" --language typescript --version "${CANDIDATE_VERSION}"
          npm run build --prefix "${COMPONENT_PATH}"
          mkdir -p "${RUNNER_TEMP}/language-dist"
          npm pack "./${COMPONENT_PATH}" --pack-destination "${RUNNER_TEMP}/language-dist"
      - name: Verify candidate package archives with main's tooling
        env:
          RELEASE_PACKAGE: ${{ needs.plan.outputs.package }}
          RELEASE_LANGUAGE: ${{ needs.plan.outputs.language }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git show origin/main:script/release/component_release.py > "${RUNNER_TEMP}/component_release.py"
          if [ "${RELEASE_LANGUAGE}" = python ]; then
            assets=("${RUNNER_TEMP}"/language-dist/*.whl "${RUNNER_TEMP}"/language-dist/*.tar.gz)
          else
            assets=("${RUNNER_TEMP}"/language-dist/*.tgz)
          fi
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" verify-language-artifacts \
            --language "${RELEASE_LANGUAGE}" --package "${RELEASE_PACKAGE}" --version "${CANDIDATE_VERSION}" "${arguments[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: language-candidate
          path: ${{ runner.temp }}/language-dist
          if-no-files-found: error

  publish-language:
    needs: [plan, verify-language]
    if: needs.plan.outputs.language != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_LANGUAGE: ${{ needs.plan.outputs.language }}
      RELEASE_PACKAGE: ${{ needs.plan.outputs.package }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RELEASE_DISPLAY_NAME: ${{ needs.plan.outputs.display_name }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        if: needs.plan.outputs.language == 'python'
      - uses: actions/setup-node@v6
        if: needs.plan.outputs.language == 'typescript'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: language-candidate
          path: ${{ runner.temp }}/language-dist
      - name: Verify package archives before publication
        run: |
          if [ "${RELEASE_LANGUAGE}" = python ]; then
            assets=("${RUNNER_TEMP}"/language-dist/*.whl "${RUNNER_TEMP}"/language-dist/*.tar.gz)
          else
            assets=("${RUNNER_TEMP}"/language-dist/*.tgz)
          fi
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 script/release/component_release.py verify-language-artifacts \
            --language "${RELEASE_LANGUAGE}" --package "${RELEASE_PACKAGE}" --version "${CANDIDATE_VERSION}" "${arguments[@]}"
      - name: Inspect candidate publication state
        id: state
        run: |
          required=true
          if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq language-release.complete; then
            required=false
          fi
          if [ "${CANDIDATE_DRY_RUN}" = true ]; then required=true; fi
          echo "release_required=${required}" >> "${GITHUB_OUTPUT}"
      - name: Build language release manifest
        if: steps.state.outputs.release_required == 'true'
        run: |
          assets=("${RUNNER_TEMP}"/language-dist/*)
          manifest_args=()
          for asset in "${assets[@]}"; do manifest_args+=(--asset "${asset}"); done
          python3 script/release/component_release.py language-manifest \
            --output "${RUNNER_TEMP}/language-dist/language-release.json" \
            --language "${RELEASE_LANGUAGE}" --package "${RELEASE_PACKAGE}" \
            --version "${CANDIDATE_VERSION}" --tag "${RELEASE_TAG}" \
            --source-sha "${RELEASE_SOURCE_SHA}" "${manifest_args[@]}"
      - name: Publish Python pre-release
        if: steps.state.outputs.release_required == 'true' && needs.plan.outputs.language == 'python' && env.CANDIDATE_DRY_RUN != 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          test -n "${UV_PUBLISH_TOKEN}" || { echo 'PYPI_TOKEN is required' >&2; exit 1; }
          assets=("${RUNNER_TEMP}"/language-dist/*.whl "${RUNNER_TEMP}"/language-dist/*.tar.gz)
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 script/release/component_release.py verify-pypi-artifacts \
            --package "${RELEASE_PACKAGE}" --version "${CANDIDATE_VERSION}" "${arguments[@]}"
          uv publish --check-url https://pypi.org/simple/ "${RUNNER_TEMP}"/language-dist/*.whl "${RUNNER_TEMP}"/language-dist/*.tar.gz
          python3 script/release/component_release.py verify-pypi-artifacts \
            --package "${RELEASE_PACKAGE}" --version "${CANDIDATE_VERSION}" --require-all --wait-seconds 120 "${arguments[@]}"
      - name: Publish npm pre-release
        if: steps.state.outputs.release_required == 'true' && needs.plan.outputs.language == 'typescript' && env.CANDIDATE_DRY_RUN != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball=("${RUNNER_TEMP}"/language-dist/*.tgz)
          python3 script/release/npm_publish.py publish --package "${RELEASE_PACKAGE}" \
            --version "${CANDIDATE_VERSION}" --tarball "${tarball[0]}" --dist-tag next
      - name: Create or repair language pre-release
        if: steps.state.outputs.release_required == 'true' && env.CANDIDATE_DRY_RUN != 'true'
        run: |
          printf 'Release candidate of %s %s from %s.\n' \
            "${RELEASE_DISPLAY_NAME}" "${CANDIDATE_VERSION}" \
            "${RELEASE_SOURCE_SHA}" > "${RUNNER_TEMP}/language-notes.md"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${RUNNER_TEMP}"/language-dist/*
          else
            gh release create "${RELEASE_TAG}" --target "${RELEASE_SOURCE_SHA}" \
              --prerelease --title "${RELEASE_DISPLAY_NAME} ${RELEASE_LANGUAGE} ${RELEASE_VERSION}" \
              --notes-file "${RUNNER_TEMP}/language-notes.md" "${RUNNER_TEMP}"/language-dist/*
          fi
      - name: Mark language candidate complete
        if: steps.state.outputs.release_required == 'true' && env.CANDIDATE_DRY_RUN != 'true'
        run: |
          printf '%s\n' "${RELEASE_TAG}" > "${RUNNER_TEMP}/language-release.complete"
          gh release upload "${RELEASE_TAG}" --clobber "${RUNNER_TEMP}/language-release.complete"
