name: Release Connectors and Catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      connector_directory:
        description: Registered Connector directory to repair; leave empty to rebuild only the catalog site
        required: false
        type: string
      dry_run:
        description: Build and verify without tags, releases, or registry uploads
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-connectors-and-catalog
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      language_matrix: ${{ steps.matrix.outputs.language_matrix }}
      language_count: ${{ steps.matrix.outputs.language_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            connectors/**/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/react/package-lock.json
            connectors/**/ui/package-lock.json
      - name: Validate Connector catalog source and declared versions
        run: |
          GOWORK=off go run ./cmd/connectorctl catalog --check --catalog catalog.yaml
          GOWORK=off go run ./cmd/connectorctl release-matrix --catalog catalog.yaml
      - name: Build pending or targeted repair matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPAIR_DIRECTORY: ${{ inputs.connector_directory }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = workflow_dispatch ] && [ -z "${REPAIR_DIRECTORY}" ]; then
            printf 'matrix={"include":[]}\ncount=0\nlanguage_matrix={"include":[]}\nlanguage_count=0\n' >> "${GITHUB_OUTPUT}"
            exit
          fi
          arguments=(--catalog catalog.yaml --github-output "${GITHUB_OUTPUT}")
          if [ "${EVENT_NAME}" = workflow_dispatch ]; then
            arguments+=(--directory "${REPAIR_DIRECTORY}" --include-published)
          else
            arguments+=(--include-published-at "${SOURCE_SHA}")
          fi
          GOWORK=off go run ./cmd/connectorctl release-matrix "${arguments[@]}"

  release:
    permissions:
      contents: write
      pull-requests: read
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      COMPONENT_PATH: ${{ matrix.directory }}
      MANIFEST_PATH: ${{ matrix.manifest_path }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      RELEASE_VERSION: ${{ matrix.version }}
      RELEASE_DISPLAY_NAME: ${{ matrix.display_name }}
      RELEASE_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            ${{ matrix.directory }}/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Inspect published release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${TAG_PREFIX}${RELEASE_VERSION}"
          required_assets=(connector-release.json connector-release.json.sha256 connector-release.complete)
          if grep -q '^  studio:' "${MANIFEST_PATH}"; then
            required_assets+=(connector-ui.tgz connector-ui.tgz.sha256)
          fi
          if git show-ref --verify --quiet "refs/tags/${release_tag}"; then
            git merge-base --is-ancestor "${release_tag}" HEAD || {
              echo "Release tag is not reachable from main: ${release_tag}" >&2
              exit 1
            }
            source_sha="$(git rev-parse "${release_tag}^{commit}")"
          else
            source_sha="${GITHUB_SHA}"
          fi
          release_required=true
          if published_assets="$(gh release view "${release_tag}" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            release_required=false
            for asset in "${required_assets[@]}"; do
              if ! grep -Fxq "${asset}" <<<"${published_assets}"; then
                release_required=true
              fi
            done
          fi
          if [ "${RELEASE_DRY_RUN}" = true ]; then release_required=true; fi
          {
            echo "release_required=${release_required}"
            echo "source_sha=${source_sha}"
            echo "tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"
      - name: Verify current Connector with the latest stable Dex CLI and Web
        if: steps.state.outputs.release_required == 'true' && steps.state.outputs.source_sha == github.sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/dex_compatibility.py current --connector-directories "${COMPONENT_PATH}"
      - name: Restore tagged release source for recovery
        if: steps.state.outputs.release_required == 'true' && steps.state.outputs.source_sha != github.sha
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: git checkout --detach "${SOURCE_SHA}"
      - name: Check generated Connector code
        if: steps.state.outputs.release_required == 'true'
        env:
          GOWORK: "off"
        run: go run ./cmd/connectorctl generate --check "${MANIFEST_PATH}"
      - name: Validate published SDK and connector dependencies
        if: steps.state.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/release/component_release.py validate-connector \
            --component-path "${COMPONENT_PATH}" \
            --sdk-module github.com/superdurable/dex-connectors-library/sdkgo
      - name: Test standalone Connector module
        if: steps.state.outputs.release_required == 'true'
        working-directory: ${{ env.COMPONENT_PATH }}
        env:
          GOWORK: "off"
        run: |
          go test -race ./...
          go vet ./...
      - name: Build and test Connector Studio UI
        if: steps.state.outputs.release_required == 'true'
        run: |
          if [ -f "${COMPONENT_PATH}/ui/package-lock.json" ]; then
            npm ci --prefix sdk/react
            npm run build --prefix sdk/react
            npm ci --prefix "${COMPONENT_PATH}/ui"
            npm test --prefix "${COMPONENT_PATH}/ui"
            npm run build --prefix "${COMPONENT_PATH}/ui"
            go run ./cmd/connectorctl ui-artifact \
              --manifest "${MANIFEST_PATH}" \
              --ui-root "${COMPONENT_PATH}/ui/dist" \
              --output /tmp/connector-ui.tgz \
              --digest-output /tmp/connector-ui.tgz.sha256
          fi
      - name: Plan declared Connector release
        if: steps.state.outputs.release_required == 'true'
        id: release-plan
        run: |
          python3 script/release/component_release.py plan \
            --component-path "${COMPONENT_PATH}" \
            --tag-prefix "${TAG_PREFIX}" \
            --version "${RELEASE_VERSION}" \
            --ref "${GITHUB_REF}" \
            --json-output /tmp/connector-release-plan.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Build path-scoped release notes
        if: steps.state.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/release/component_release.py notes \
            --plan /tmp/connector-release-plan.json \
            --repository "${GITHUB_REPOSITORY}" \
            --output /tmp/connector-release-notes.md
      - name: Build versioned Connector artifact
        if: steps.state.outputs.release_required == 'true'
        env:
          GOWORK: "off"
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
          MODULE_PATH: ${{ steps.release-plan.outputs.module_path }}
          SOURCE_SHA: ${{ steps.release-plan.outputs.source_sha }}
        run: |
          UI_ARGS=()
          if [ -f /tmp/connector-ui.tgz ]; then
            UI_ARGS+=(--ui-artifact /tmp/connector-ui.tgz --ui-digest /tmp/connector-ui.tgz.sha256)
          fi
          go run ./cmd/connectorctl release-artifact \
            --manifest "${MANIFEST_PATH}" \
            --module-path "${MODULE_PATH}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-sha "${SOURCE_SHA}" \
            --output /tmp/connector-release.json \
            --digest-output /tmp/connector-release.json.sha256 \
            "${UI_ARGS[@]}"
      - name: Create or repair Connector release
        if: steps.state.outputs.release_required == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
          SOURCE_SHA: ${{ steps.release-plan.outputs.source_sha }}
        run: |
          assets=(/tmp/connector-release.json /tmp/connector-release.json.sha256)
          if [ -f /tmp/connector-ui.tgz ]; then
            assets+=(/tmp/connector-ui.tgz /tmp/connector-ui.tgz.sha256)
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_DISPLAY_NAME} ${RELEASE_VERSION}" \
              --notes-file /tmp/connector-release-notes.md
            gh release upload "${RELEASE_TAG}" --clobber "${assets[@]}"
          elif git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_DISPLAY_NAME} ${RELEASE_VERSION}" \
              --notes-file /tmp/connector-release-notes.md \
              "${assets[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${SOURCE_SHA}" \
              --title "${RELEASE_DISPLAY_NAME} ${RELEASE_VERSION}" \
              --notes-file /tmp/connector-release-notes.md \
              "${assets[@]}"
          fi
      - name: Verify published Connector module
        if: steps.state.outputs.release_required == 'true' && inputs.dry_run != true
        env:
          MODULE_PATH: ${{ steps.release-plan.outputs.module_path }}
        run: |
          deadline=$((SECONDS + 120))
          until GOWORK=off GOPROXY=direct GONOSUMDB=github.com/superdurable/dex-connectors-library \
            go mod download "${MODULE_PATH}@${RELEASE_VERSION}"; do
            if (( SECONDS >= deadline )); then
              echo "Published Connector module did not become downloadable before the deadline" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Verify the published Connector with the latest stable Dex CLI and Web
        if: steps.state.outputs.release_required == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTOR_RELEASE_TAG: ${{ steps.state.outputs.tag }}
        run: make test-dex-compat-released
      - name: Mark Connector release complete
        if: steps.state.outputs.release_required == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
        run: |
          printf '%s\n' "${RELEASE_TAG}" > /tmp/connector-release.complete
          gh release upload "${RELEASE_TAG}" --clobber /tmp/connector-release.complete

  build-language:
    needs: plan
    if: needs.plan.outputs.language_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.language_matrix) }}
    env:
      COMPONENT_PATH: ${{ matrix.directory }}/${{ matrix.language }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      RELEASE_VERSION: ${{ matrix.version }}
      PACKAGE_NAME: ${{ matrix.package }}
      LANGUAGE: ${{ matrix.language }}
      RELEASE_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        if: matrix.language == 'python'
      - uses: actions/setup-node@v6
        if: matrix.language == 'typescript'
        with:
          node-version: 24
      - name: Inspect language release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/language-work"
          cp script/release/component_release.py "${RUNNER_TEMP}/component_release.py"
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          source_sha="${GITHUB_SHA}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            git merge-base --is-ancestor "${tag}" HEAD || { echo "Release tag is not reachable from main: ${tag}" >&2; exit 1; }
            source_sha="$(git rev-parse "${tag}^{commit}")"
          fi
          required=true
          if published_assets="$(gh release view "${tag}" --json assets --jq '.assets[].name' 2>/dev/null)" &&
            grep -Fxq language-release.complete <<<"${published_assets}"; then
            required=false
          fi
          if [ "${RELEASE_DRY_RUN}" = true ]; then required=true; fi
          if [ "${required}" = false ]; then touch "${RUNNER_TEMP}/language-work/skip"; fi
          echo "release_required=${required}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
      - name: Restore tagged language source for repair
        if: steps.state.outputs.release_required == 'true' && steps.state.outputs.source_sha != github.sha
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: git checkout --detach "${SOURCE_SHA}"
      - name: Validate released language SDK dependency
        if: steps.state.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 "${RUNNER_TEMP}/component_release.py" validate-language-package \
            --component-path "${COMPONENT_PATH}" --language "${LANGUAGE}"
      - name: Test and build Python package
        if: steps.state.outputs.release_required == 'true' && matrix.language == 'python'
        run: |
          test -f "${COMPONENT_PATH}/uv.lock" || { echo 'Python lockfile is missing' >&2; exit 1; }
          uv sync --locked --project "${COMPONENT_PATH}"
          uv run --project "${COMPONENT_PATH}" ruff check "${COMPONENT_PATH}"
          uv run --project "${COMPONENT_PATH}" mypy --strict "${COMPONENT_PATH}/src"
          uv run --project "${COMPONENT_PATH}" pytest "${COMPONENT_PATH}/tests"
          uv build "${COMPONENT_PATH}" --out-dir "${RUNNER_TEMP}/language-work/dist"
          rm -f "${RUNNER_TEMP}/language-work/dist/.gitignore"
      - name: Test and build TypeScript package
        if: steps.state.outputs.release_required == 'true' && matrix.language == 'typescript'
        run: |
          test -f "${COMPONENT_PATH}/package-lock.json" || { echo 'TypeScript lockfile is missing' >&2; exit 1; }
          npm ci --prefix "${COMPONENT_PATH}"
          npm run typecheck --prefix "${COMPONENT_PATH}"
          npm run lint --prefix "${COMPONENT_PATH}"
          npm test --prefix "${COMPONENT_PATH}"
          npm run build --prefix "${COMPONENT_PATH}"
          mkdir -p "${RUNNER_TEMP}/language-work/dist"
          npm pack "./${COMPONENT_PATH}" --pack-destination "${RUNNER_TEMP}/language-work/dist"
      - name: Plan language release and notes
        if: steps.state.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: |
          python3 "${RUNNER_TEMP}/component_release.py" plan \
            --component-path "${COMPONENT_PATH}" --tag-prefix "${TAG_PREFIX}" \
            --version "${RELEASE_VERSION}" --ref "${GITHUB_REF}" \
            --json-output "${RUNNER_TEMP}/language-work/plan.json" --github-output "${RUNNER_TEMP}/language-plan-output"
          python3 "${RUNNER_TEMP}/component_release.py" notes \
            --plan "${RUNNER_TEMP}/language-work/plan.json" --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/language-work/notes.md"
          assets=("${RUNNER_TEMP}"/language-work/dist/*)
          manifest_args=()
          for asset in "${assets[@]}"; do manifest_args+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" language-manifest \
            --output "${RUNNER_TEMP}/language-work/dist/language-release.json" \
            --language "${LANGUAGE}" --package "${PACKAGE_NAME}" \
            --version "${RELEASE_VERSION}" --tag "${TAG_PREFIX}${RELEASE_VERSION}" \
            --source-sha "${SOURCE_SHA}" "${manifest_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: language-${{ strategy.job-index }}
          path: ${{ runner.temp }}/language-work
          if-no-files-found: error
          retention-days: 1

  publish-language:
    needs: [plan, build-language]
    if: needs.plan.outputs.language_count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.language_matrix) }}
    env:
      COMPONENT_PATH: ${{ matrix.directory }}/${{ matrix.language }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      RELEASE_VERSION: ${{ matrix.version }}
      PACKAGE_NAME: ${{ matrix.package }}
      LANGUAGE: ${{ matrix.language }}
      RELEASE_DISPLAY_NAME: ${{ matrix.display_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        if: matrix.language == 'python'
      - uses: actions/setup-node@v6
        if: matrix.language == 'typescript'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: language-${{ strategy.job-index }}
          path: ${{ runner.temp }}/language-work
      - name: Inspect language release state
        id: state
        run: |
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          release_complete=false
          if published_assets="$(gh release view "${tag}" --json assets --jq '.assets[].name' 2>/dev/null)" &&
            grep -Fxq language-release.complete <<<"${published_assets}"; then
            release_complete=true
          fi
          if [ -f "${RUNNER_TEMP}/language-work/skip" ] && [ "${release_complete}" != true ]; then
            echo "Build artifact requests a skip without a completed release: ${tag}" >&2
            exit 1
          fi
          if [ "${release_complete}" = true ]; then
            echo 'release_required=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'release_required=true' >> "${GITHUB_OUTPUT}"
          source_sha="${GITHUB_SHA}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            source_sha="$(git rev-parse "${tag}^{commit}")"
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
      - name: Verify package archives before publication
        if: steps.state.outputs.release_required == 'true'
        run: |
          if [ "${LANGUAGE}" = python ]; then
            assets=("${RUNNER_TEMP}"/language-work/dist/*.whl "${RUNNER_TEMP}"/language-work/dist/*.tar.gz)
          else
            assets=("${RUNNER_TEMP}"/language-work/dist/*.tgz)
          fi
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 script/release/component_release.py verify-language-artifacts \
            --language "${LANGUAGE}" --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" "${arguments[@]}"
      - name: Regenerate trusted release metadata
        if: steps.state.outputs.release_required == 'true'
        run: |
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          cp script/release/component_release.py "${RUNNER_TEMP}/component_release.py"
          cp script/release/npm_publish.py "${RUNNER_TEMP}/npm_publish.py"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            git merge-base --is-ancestor "${tag}" HEAD || { echo "Language tag is not reachable from main: ${tag}" >&2; exit 1; }
            git checkout --detach "$(git rev-parse "${tag}^{commit}")"
          fi
          python3 "${RUNNER_TEMP}/component_release.py" plan \
            --component-path "${COMPONENT_PATH}" --tag-prefix "${TAG_PREFIX}" \
            --version "${RELEASE_VERSION}" --ref "${GITHUB_REF}" \
            --json-output "${RUNNER_TEMP}/trusted-language-plan.json" \
            --github-output "${RUNNER_TEMP}/trusted-language-output"
          python3 "${RUNNER_TEMP}/component_release.py" notes \
            --plan "${RUNNER_TEMP}/trusted-language-plan.json" --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/language-work/notes.md"
          rm -f "${RUNNER_TEMP}"/language-work/dist/*.sha256 "${RUNNER_TEMP}/language-work/dist/language-release.json"
          if [ "${LANGUAGE}" = python ]; then
            assets=("${RUNNER_TEMP}"/language-work/dist/*.whl "${RUNNER_TEMP}"/language-work/dist/*.tar.gz)
          else
            assets=("${RUNNER_TEMP}"/language-work/dist/*.tgz)
          fi
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" language-manifest \
            --output "${RUNNER_TEMP}/language-work/dist/language-release.json" \
            --language "${LANGUAGE}" --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" \
            --tag "${tag}" --source-sha "$(git rev-parse HEAD)" "${arguments[@]}"
      - name: Publish Python package
        if: steps.state.outputs.release_required == 'true' && matrix.language == 'python'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          test -n "${UV_PUBLISH_TOKEN}" || { echo 'PYPI_TOKEN is required' >&2; exit 1; }
          assets=("${RUNNER_TEMP}"/language-work/dist/*.whl "${RUNNER_TEMP}"/language-work/dist/*.tar.gz)
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" verify-pypi-artifacts \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" "${arguments[@]}"
          uv publish --check-url https://pypi.org/simple/ "${RUNNER_TEMP}"/language-work/dist/*.whl "${RUNNER_TEMP}"/language-work/dist/*.tar.gz
          python3 "${RUNNER_TEMP}/component_release.py" verify-pypi-artifacts \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" --require-all --wait-seconds 120 "${arguments[@]}"
      - name: Publish npm package
        if: steps.state.outputs.release_required == 'true' && matrix.language == 'typescript'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_tarball=("${RUNNER_TEMP}"/language-work/dist/*.tgz)
          python3 "${RUNNER_TEMP}/npm_publish.py" publish --package "${PACKAGE_NAME}" \
            --version "${RELEASE_VERSION}" --tarball "${package_tarball[0]}"
      - name: Create or repair language release
        if: steps.state.outputs.release_required == 'true'
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: |
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" --clobber "${RUNNER_TEMP}"/language-work/dist/*
          else
            gh release create "${tag}" --target "${SOURCE_SHA}" \
              --title "${RELEASE_DISPLAY_NAME} ${LANGUAGE} ${RELEASE_VERSION}" \
              --notes-file "${RUNNER_TEMP}/language-work/notes.md" "${RUNNER_TEMP}"/language-work/dist/*
          fi
      - name: Mark language release complete
        if: steps.state.outputs.release_required == 'true'
        run: |
          printf '%s\n' "${TAG_PREFIX}${RELEASE_VERSION}" > "${RUNNER_TEMP}/language-release.complete"
          gh release upload "${TAG_PREFIX}${RELEASE_VERSION}" --clobber "${RUNNER_TEMP}/language-release.complete"

  build-catalog:
    needs: [plan, release, build-language, publish-language]
    if: always() && needs.plan.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (needs.build-language.result == 'success' || needs.build-language.result == 'skipped') && (needs.publish-language.result == 'success' || (needs.plan.outputs.language_count == '0' && needs.publish-language.result == 'skipped')) && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Generate public Connector catalog
        run: |
          mkdir -p dist/pages
          go run ./cmd/connectorctl catalog \
            --catalog catalog.yaml \
            --output dist/pages/catalog.yaml \
            --json-output dist/pages/catalog.json
      - name: Build directory site and preview card
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          npm ci --prefix site
          npm test --prefix site
          npm run build --prefix site
          node site/scripts/render-card.mjs \
            --catalog dist/pages/catalog.yaml \
            --repository . \
            --output dist/pages/card.png
          cp -a site/dist/. dist/pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy-catalog:
    permissions:
      pages: write
      id-token: write
    needs: build-catalog
    # always() so a skipped release (a push that changes no Connector) does not
    # skip the deploy too: without it the implicit success() fails on that
    # skipped ancestor and only Connector releases reach the catalog site.
    if: always() && needs.build-catalog.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Connector catalog
        id: deployment
        uses: actions/deploy-pages@v4

  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Connector releases can run only from main" >&2
          exit 1
