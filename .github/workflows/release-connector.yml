name: Release Connectors and Catalog

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      connector_directory:
        description: Registered Connector directory to repair; leave empty to rebuild only the catalog site
        required: false
        type: string
      dry_run:
        description: Build and verify without tags, releases, or registry uploads
        required: false
        default: false
        type: boolean
      first_publish_limit:
        description: Maximum new PyPI projects to try in this run
        required: false
        type: string
      github_first_release_limit:
        description: Maximum Python first releases to create on GitHub before their PyPI upload in this run
        required: false
        type: string
      go_release_limit:
        description: Maximum Go connector releases to start in this run (1-256); later runs release the rest
        required: false
        type: string
      drain_first_publishes:
        description: Drain pending language publishes and pending Go releases
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-connectors-and-catalog
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      language_matrix: ${{ steps.matrix.outputs.language_matrix }}
      language_count: ${{ steps.matrix.outputs.language_count }}
      updates_matrix: ${{ steps.matrix.outputs.updates_matrix }}
      updates_count: ${{ steps.matrix.outputs.updates_count }}
      first_matrix: ${{ steps.matrix.outputs.first_matrix }}
      first_count: ${{ steps.matrix.outputs.first_count }}
      github_first_matrix: ${{ steps.matrix.outputs.github_first_matrix }}
      github_first_count: ${{ steps.matrix.outputs.github_first_count }}
      pypi_pending_matrix: ${{ steps.matrix.outputs.pypi_pending_matrix }}
      pypi_pending_count: ${{ steps.matrix.outputs.pypi_pending_count }}
      pending_count: ${{ steps.matrix.outputs.pending_count }}
      connector_release_repair_matrix: ${{ steps.connector-release-repairs.outputs.connector_release_repair_matrix }}
      connector_release_repair_count: ${{ steps.connector-release-repairs.outputs.connector_release_repair_count }}
      dex_cli_tag: ${{ steps.dex-versions.outputs.cli_tag }}
      dex_cli_asset_url: ${{ steps.dex-versions.outputs.cli_asset_url }}
      dex_cli_sha256: ${{ steps.dex-versions.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            connectors/**/go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/react/package-lock.json
            connectors/**/ui/package-lock.json
      - name: Validate Connector catalog source and declared versions
        run: |
          GOWORK=off go run ./cmd/connectorctl catalog --check --catalog catalog.yaml
          GOWORK=off go run ./cmd/connectorctl release-matrix --catalog catalog.yaml
      - name: Resolve release inventory once for planning and release jobs
        id: release-inventory
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/release/github_release_inventory.py --output "${RUNNER_TEMP}/release-inventory.json" \
            --created-at-output "${RUNNER_TEMP}/release-created-at.json"
      - name: Defer language releases when the inventory is unavailable
        if: steps.release-inventory.outcome == 'failure'
        run: |
          printf '{"_inventory_unavailable":true}\n' > "${RUNNER_TEMP}/release-inventory.json"
          printf '{}\n' > "${RUNNER_TEMP}/release-created-at.json"
          echo '::warning::Release inventory unavailable; Go release jobs will check their tags directly and language releases will be deferred.'
      - name: Build pending or targeted repair matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPAIR_DIRECTORY: ${{ inputs.connector_directory }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_INVENTORY_PATH: ${{ runner.temp }}/release-inventory.json
          GH_RELEASE_CREATED_AT_PATH: ${{ runner.temp }}/release-created-at.json
          FIRST_PUBLISH_LIMIT: ${{ inputs.first_publish_limit || vars.PYPI_FIRST_PUBLISH_LIMIT || '3' }}
          PYTHON_GITHUB_FIRST_RELEASE_LIMIT: ${{ inputs.github_first_release_limit || vars.PYTHON_GITHUB_FIRST_RELEASE_LIMIT || '15' }}
          # Bounds GITHUB_TOKEN use; deferred Go versions stay untagged, so later runs select them again.
          GO_RELEASE_LIMIT: ${{ inputs.go_release_limit || vars.GO_RELEASE_LIMIT || '15' }}
          DRAIN_FIRST_PUBLISHES: ${{ inputs.drain_first_publishes }}
          LANGUAGE_SELECTION_PATH: ${{ runner.temp }}/language-selection.json
        run: |
          if [ -n "${REPAIR_DIRECTORY}" ] && [ "${DRAIN_FIRST_PUBLISHES}" = true ]; then
            echo 'Select either connector_directory or drain_first_publishes, not both' >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = workflow_dispatch ] && [ -z "${REPAIR_DIRECTORY}" ] && [ "${DRAIN_FIRST_PUBLISHES}" != true ]; then
            printf 'matrix={"include":[]}\ncount=0\ngo_deferred_count=0\nlanguage_matrix={"include":[]}\nlanguage_count=0\nupdates_matrix={"include":[]}\nupdates_count=0\nfirst_matrix={"include":[]}\nfirst_count=0\ngithub_first_matrix={"include":[]}\ngithub_first_count=0\npypi_pending_matrix={"include":[]}\npypi_pending_count=0\npending_count=0\n' >> "${GITHUB_OUTPUT}"
            exit
          fi
          arguments=(--catalog catalog.yaml --github-output "${RUNNER_TEMP}/release-matrix-output")
          # Every run repairs tagged Go versions whose release lacks connector-release.complete, at their tagged source.
          arguments+=(--release-inventory "${GH_RELEASE_INVENTORY_PATH}")
          select_arguments=()
          if [ "${EVENT_NAME}" = workflow_dispatch ] && [ -n "${REPAIR_DIRECTORY}" ]; then
            arguments+=(--directory "${REPAIR_DIRECTORY}" --include-published)
            # A targeted repair uploads only that connector's pending PyPI versions.
            select_arguments+=(--pending-upload-directory "${REPAIR_DIRECTORY}")
          elif [ "${EVENT_NAME}" = schedule ] || [ "${DRAIN_FIRST_PUBLISHES}" = true ]; then
            arguments+=(--include-published-languages)
          else
            arguments+=(--include-published-at "${SOURCE_SHA}")
          fi
          GOWORK=off go run ./cmd/connectorctl release-matrix "${arguments[@]}"
          python3 script/release/language_publish.py select \
            --matrix-output "${RUNNER_TEMP}/release-matrix-output" \
            --github-output "${GITHUB_OUTPUT}" \
            --go-release-limit "${GO_RELEASE_LIMIT}" \
            --first-publish-limit "${FIRST_PUBLISH_LIMIT}" \
            --github-release-limit "${PYTHON_GITHUB_FIRST_RELEASE_LIMIT}" \
            "${select_arguments[@]}"
      # A tag's source never changes, so tags that this tooling rejected stay rejected until the tooling changes.
      - name: Restore the tags that main's tooling cannot describe
        if: github.event_name == 'schedule' || inputs.drain_first_publishes == true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/connector-release-unsupported.json
          key: connector-release-unsupported-${{ hashFiles('go.mod', 'go.sum', 'cmd/connectorctl/**/*.go', 'schema/**/*.go', 'internal/**/*.go', 'script/release/language_publish.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: connector-release-unsupported-${{ hashFiles('go.mod', 'go.sum', 'cmd/connectorctl/**/*.go', 'schema/**/*.go', 'internal/**/*.go', 'script/release/language_publish.py') }}-
      - name: Select complete language releases that lack connector-release.json
        id: connector-release-repairs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPAIR_DIRECTORY: ${{ inputs.connector_directory }}
          DRAIN_FIRST_PUBLISHES: ${{ inputs.drain_first_publishes }}
          GH_RELEASE_INVENTORY_PATH: ${{ runner.temp }}/release-inventory.json
          GH_RELEASE_CREATED_AT_PATH: ${{ runner.temp }}/release-created-at.json
          CONNECTOR_RELEASE_REPAIR_LIMIT: ${{ vars.CONNECTOR_RELEASE_REPAIR_LIMIT || '20' }}
          CONNECTOR_RELEASE_CHECK_LIMIT: ${{ vars.CONNECTOR_RELEASE_CHECK_LIMIT || '100' }}
        run: |
          unsupported_cache="${RUNNER_TEMP}/connector-release-unsupported.json"
          repair_arguments=(--limit "${CONNECTOR_RELEASE_REPAIR_LIMIT}" --check-limit "${CONNECTOR_RELEASE_CHECK_LIMIT}")
          if [ "${EVENT_NAME}" = workflow_dispatch ] && [ -n "${REPAIR_DIRECTORY}" ]; then
            repair_arguments+=(--directory "${REPAIR_DIRECTORY}")
          elif [ "${EVENT_NAME}" = schedule ] || [ "${DRAIN_FIRST_PUBLISHES}" = true ]; then
            repair_arguments+=(--unsupported-cache "${unsupported_cache}"
              --unsupported-cache-output "${unsupported_cache}.next")
          else
            # Push runs leave the backfill to the hourly run.
            printf 'connector_release_repair_matrix={"include":[]}\nconnector_release_repair_count=0\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # A failed backfill selection never blocks Go releases, language releases, or the catalog.
          repair_output="${RUNNER_TEMP}/connector-release-repairs-output"
          if GOWORK=off go build -o "${RUNNER_TEMP}/connectorctl" ./cmd/connectorctl \
            && python3 script/release/language_publish.py select-connector-release-repairs \
              --connectorctl "${RUNNER_TEMP}/connectorctl" --github-output "${repair_output}" "${repair_arguments[@]}"; then
            cat "${repair_output}" >> "${GITHUB_OUTPUT}"
            if [ -f "${unsupported_cache}.next" ]; then
              mv "${unsupported_cache}.next" "${unsupported_cache}"
              echo 'unsupported_cache=written' >> "${GITHUB_OUTPUT}"
            fi
          else
            echo '::warning::Connector release metadata repair selection failed; a later run selects the repairs.'
            printf 'connector_release_repair_matrix={"include":[]}\nconnector_release_repair_count=0\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Save the tags that main's tooling cannot describe
        if: steps.connector-release-repairs.outputs.unsupported_cache == 'written'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/connector-release-unsupported.json
          key: connector-release-unsupported-${{ hashFiles('go.mod', 'go.sum', 'cmd/connectorctl/**/*.go', 'schema/**/*.go', 'internal/**/*.go', 'script/release/language_publish.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-inventory
          path: ${{ runner.temp }}/release-inventory.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: steps.matrix.outputs.language_count != '0' || steps.matrix.outputs.pending_count != '0'
        with:
          name: language-selection
          path: ${{ runner.temp }}/language-selection.json
          retention-days: 1
      - name: Resolve Dex CLI once for release shards
        id: dex-versions
        if: steps.matrix.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/dex_compatibility.py plan --github-output "${GITHUB_OUTPUT}"

  release:
    permissions:
      contents: write
      pull-requests: read
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GH_RELEASE_INVENTORY_PATH: /tmp/release-inventory.json
      DEX_CLI_RELEASE_TAG: ${{ needs.plan.outputs.dex_cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.plan.outputs.dex_cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.plan.outputs.dex_cli_sha256 }}
      COMPONENT_PATH: ${{ matrix.directory }}/go
      MANIFEST_PATH: ${{ matrix.manifest_path }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      RELEASE_VERSION: ${{ matrix.version }}
      RELEASE_DISPLAY_NAME: ${{ matrix.display_name }}
      RELEASE_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-inventory
          path: /tmp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            ${{ matrix.directory }}/go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Inspect published release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp script/release/github_release_inventory.py "${RUNNER_TEMP}/"
          release_tag="${TAG_PREFIX}${RELEASE_VERSION}"
          required_assets=(connector-release.json connector-release.json.sha256 connector-release.complete)
          if grep -q '^  studio:' "${MANIFEST_PATH}"; then
            required_assets+=(connector-ui.tgz connector-ui.tgz.sha256)
          fi
          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/${release_tag}"; then
            tag_exists=true
            git merge-base --is-ancestor "${release_tag}" HEAD || {
              echo "Release tag is not reachable from main: ${release_tag}" >&2
              exit 1
            }
            source_sha="$(git rev-parse "${release_tag}^{commit}")"
          else
            source_sha="${GITHUB_SHA}"
          fi
          release_required=true
          published_assets_json=null
          if [ "${tag_exists}" = true ]; then
            published_assets_json="$(python3 "${RUNNER_TEMP}/github_release_inventory.py" --tag "${release_tag}")"
          fi
          if [ "${published_assets_json}" != null ]; then
            published_assets="$(jq -r '.[]' <<< "${published_assets_json}")"
            release_required=false
            for asset in "${required_assets[@]}"; do
              if ! grep -Fxq "${asset}" <<<"${published_assets}"; then
                release_required=true
              fi
            done
          fi
          if [ "${RELEASE_DRY_RUN}" = true ]; then release_required=true; fi
          # Recovery checks out the tagged source, whose release tooling may predate release-title.
          release_title="$(python3 script/release/component_release.py release-title \
            --display-name "${RELEASE_DISPLAY_NAME}" --language go --version "${RELEASE_VERSION}")"
          {
            echo "release_required=${release_required}"
            echo "source_sha=${source_sha}"
            echo "tag=${release_tag}"
            echo "title=${release_title}"
          } >> "${GITHUB_OUTPUT}"
      - name: Verify current Connector with the latest stable Dex CLI and Web
        if: steps.state.outputs.release_required == 'true' && steps.state.outputs.source_sha == github.sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/dex_compatibility.py current --connector-directories "${{ matrix.directory }}"
      - name: Restore tagged release source for recovery
        if: steps.state.outputs.release_required == 'true' && steps.state.outputs.source_sha != github.sha
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: git checkout --detach "${SOURCE_SHA}"
      - name: Check generated Connector code
        if: steps.state.outputs.release_required == 'true'
        env:
          GOWORK: "off"
        run: go run ./cmd/connectorctl generate --check "${MANIFEST_PATH}"
      - name: Validate published SDK and connector dependencies
        if: steps.state.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/release/component_release.py validate-connector \
            --component-path "${COMPONENT_PATH}" \
            --sdk-module github.com/superdurable/dex-connectors-library/sdkgo
      - name: Test standalone Connector module
        if: steps.state.outputs.release_required == 'true'
        working-directory: ${{ env.COMPONENT_PATH }}
        env:
          GOWORK: "off"
        run: |
          go test -race ./...
          go vet ./...
      - name: Build and test Connector Studio UI
        if: steps.state.outputs.release_required == 'true'
        run: |
          if [ -f "${{ matrix.directory }}/ui/package-lock.json" ]; then
            npm ci --prefix sdk/react
            npm run build --prefix sdk/react
            npm ci --prefix "${{ matrix.directory }}/ui"
            npm test --prefix "${{ matrix.directory }}/ui"
            npm run build --prefix "${{ matrix.directory }}/ui"
            go run ./cmd/connectorctl ui-artifact \
              --manifest "${MANIFEST_PATH}" \
              --ui-root "${{ matrix.directory }}/ui/dist" \
              --output /tmp/connector-ui.tgz \
              --digest-output /tmp/connector-ui.tgz.sha256
          fi
      - name: Plan declared Connector release
        if: steps.state.outputs.release_required == 'true'
        id: release-plan
        run: |
          python3 script/release/component_release.py plan \
            --component-path "${COMPONENT_PATH}" \
            --tag-prefix "${TAG_PREFIX}" \
            --version "${RELEASE_VERSION}" \
            --ref "${GITHUB_REF}" \
            --json-output /tmp/connector-release-plan.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Build path-scoped release notes
        if: steps.state.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/release/component_release.py notes \
            --plan /tmp/connector-release-plan.json \
            --repository "${GITHUB_REPOSITORY}" \
            --output /tmp/connector-release-notes.md
      - name: Build versioned Connector artifact
        if: steps.state.outputs.release_required == 'true'
        env:
          GOWORK: "off"
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
          MODULE_PATH: ${{ steps.release-plan.outputs.module_path }}
          SOURCE_SHA: ${{ steps.release-plan.outputs.source_sha }}
        run: |
          UI_ARGS=()
          if [ -f /tmp/connector-ui.tgz ]; then
            UI_ARGS+=(--ui-artifact /tmp/connector-ui.tgz --ui-digest /tmp/connector-ui.tgz.sha256)
          fi
          go run ./cmd/connectorctl release-artifact \
            --manifest "${MANIFEST_PATH}" \
            --module-path "${MODULE_PATH}" \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-sha "${SOURCE_SHA}" \
            --output /tmp/connector-release.json \
            --digest-output /tmp/connector-release.json.sha256 \
            "${UI_ARGS[@]}"
      - name: Create or repair Connector release
        if: steps.state.outputs.release_required == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
          RELEASE_TITLE: ${{ steps.state.outputs.title }}
          SOURCE_SHA: ${{ steps.release-plan.outputs.source_sha }}
        run: |
          assets=(/tmp/connector-release.json /tmp/connector-release.json.sha256)
          if [ -f /tmp/connector-ui.tgz ]; then
            assets+=(/tmp/connector-ui.tgz /tmp/connector-ui.tgz.sha256)
          fi
          release_assets=null
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            release_assets="$(python3 "${RUNNER_TEMP}/github_release_inventory.py" --tag "${RELEASE_TAG}" --live)"
          fi
          if [ "${release_assets}" != null ]; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes-file /tmp/connector-release-notes.md
            gh release upload "${RELEASE_TAG}" --clobber "${assets[@]}"
          elif git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TITLE}" \
              --notes-file /tmp/connector-release-notes.md \
              "${assets[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${SOURCE_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes-file /tmp/connector-release-notes.md \
              "${assets[@]}"
          fi
      - name: Verify published Connector module
        if: steps.state.outputs.release_required == 'true' && inputs.dry_run != true
        env:
          MODULE_PATH: ${{ steps.release-plan.outputs.module_path }}
        run: |
          deadline=$((SECONDS + 120))
          until GOWORK=off GOPROXY=direct GONOSUMDB=github.com/superdurable/dex-connectors-library \
            go mod download "${MODULE_PATH}@${RELEASE_VERSION}"; do
            if (( SECONDS >= deadline )); then
              echo "Published Connector module did not become downloadable before the deadline" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Verify the published Connector with the latest stable Dex CLI and Web
        if: steps.state.outputs.release_required == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTOR_RELEASE_TAG: ${{ steps.state.outputs.tag }}
        run: make test-dex-compat-released
      - name: Mark Connector release complete
        if: steps.state.outputs.release_required == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
        run: |
          printf '%s\n' "${RELEASE_TAG}" > /tmp/connector-release.complete
          gh release upload "${RELEASE_TAG}" --clobber /tmp/connector-release.complete

  build-language:
    needs: [plan, release]
    if: always() && needs.plan.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && needs.plan.outputs.language_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.language_matrix) }}
    env:
      GH_RELEASE_INVENTORY_PATH: /tmp/release-inventory.json
      COMPONENT_PATH: ${{ matrix.directory }}/${{ matrix.language }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      RELEASE_VERSION: ${{ matrix.version }}
      PACKAGE_NAME: ${{ matrix.package }}
      LANGUAGE: ${{ matrix.language }}
      MANIFEST_PATH: ${{ matrix.manifest_path }}
      RELEASE_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-inventory
          path: /tmp
      - name: Include Go releases completed earlier in this run
        if: needs.plan.outputs.count != '0' && inputs.dry_run != true
        env:
          GO_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['GH_RELEASE_INVENTORY_PATH'])
          inventory = json.loads(path.read_text())
          for item in json.loads(os.environ['GO_MATRIX'])['include']:
              tag = item['tag_prefix'] + item['version']
              inventory.setdefault(tag, [])
              if 'connector-release.complete' not in inventory[tag]:
                  inventory[tag].append('connector-release.complete')
          path.write_text(json.dumps(inventory))
          PY
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: astral-sh/setup-uv@v7
        if: matrix.language == 'python'
      # Every language release builds the connector's Studio UI, so Python jobs need Node too.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Inspect language release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/language-work"
          cp script/release/component_release.py script/release/github_release_inventory.py "${RUNNER_TEMP}/"
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          source_sha="${GITHUB_SHA}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            git merge-base --is-ancestor "${tag}" HEAD || { echo "Release tag is not reachable from main: ${tag}" >&2; exit 1; }
            source_sha="$(git rev-parse "${tag}^{commit}")"
          fi
          required=true
          if jq -e --arg tag "${tag}" '.[$tag] | index("language-release.complete") != null' "${GH_RELEASE_INVENTORY_PATH}" >/dev/null; then
            required=false
          fi
          if [ "${RELEASE_DRY_RUN}" = true ]; then required=true; fi
          if [ "${required}" = false ]; then
            touch "${RUNNER_TEMP}/language-work/skip" "${RUNNER_TEMP}/language-work/completed-release"
          else
            # A repair restores the tagged source next, whose connectorctl may predate language release metadata.
            GOWORK=off go build -o "${RUNNER_TEMP}/connectorctl" ./cmd/connectorctl
          fi
          {
            echo "release_required=${required}"
            echo "source_sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"
      - name: Restore tagged language source for repair
        if: steps.state.outputs.release_required == 'true' && steps.state.outputs.source_sha != github.sha
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: git checkout --detach "${SOURCE_SHA}"
      - name: Validate released language SDK dependency
        if: steps.state.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          validation_args=()
          if [ "${RELEASE_DRY_RUN}" = true ]; then validation_args+=(--dry-run); fi
          python3 "${RUNNER_TEMP}/component_release.py" validate-language-package \
            --component-path "${COMPONENT_PATH}" --language "${LANGUAGE}" "${validation_args[@]}"
      - name: Test and build Python package
        if: steps.state.outputs.release_required == 'true' && matrix.language == 'python'
        run: |
          test -f "${COMPONENT_PATH}/uv.lock" || { echo 'Python lockfile is missing' >&2; exit 1; }
          uv sync --locked --project "${COMPONENT_PATH}"
          uv run --project "${COMPONENT_PATH}" ruff check "${COMPONENT_PATH}"
          uv run --project "${COMPONENT_PATH}" mypy --strict "${COMPONENT_PATH}/src"
          uv run --project "${COMPONENT_PATH}" pytest "${COMPONENT_PATH}/tests"
          uv build "${COMPONENT_PATH}" --out-dir "${RUNNER_TEMP}/language-work/dist"
          rm -f "${RUNNER_TEMP}/language-work/dist/.gitignore"
      - name: Test and build TypeScript package
        if: steps.state.outputs.release_required == 'true' && matrix.language == 'typescript'
        run: |
          test -f "${COMPONENT_PATH}/package-lock.json" || { echo 'TypeScript lockfile is missing' >&2; exit 1; }
          npm ci --prefix "${COMPONENT_PATH}"
          npm run typecheck --prefix "${COMPONENT_PATH}"
          npm run lint --prefix "${COMPONENT_PATH}"
          npm test --prefix "${COMPONENT_PATH}"
          npm run build --prefix "${COMPONENT_PATH}"
          mkdir -p "${RUNNER_TEMP}/language-work/dist"
          npm pack "./${COMPONENT_PATH}" --pack-destination "${RUNNER_TEMP}/language-work/dist"
      - name: Build and test Connector Studio UI
        if: steps.state.outputs.release_required == 'true'
        env:
          CONNECTOR_DIRECTORY: ${{ matrix.directory }}
        run: |
          # The UI tarball stays outside dist/, so language-release.json and registry uploads never list it.
          if [ -f "${CONNECTOR_DIRECTORY}/ui/package-lock.json" ]; then
            npm ci --prefix sdk/react
            npm run build --prefix sdk/react
            npm ci --prefix "${CONNECTOR_DIRECTORY}/ui"
            npm test --prefix "${CONNECTOR_DIRECTORY}/ui"
            npm run build --prefix "${CONNECTOR_DIRECTORY}/ui"
            mkdir -p "${RUNNER_TEMP}/language-work/connector-ui"
            "${RUNNER_TEMP}/connectorctl" ui-artifact \
              --manifest "${MANIFEST_PATH}" \
              --ui-root "${CONNECTOR_DIRECTORY}/ui/dist" \
              --output "${RUNNER_TEMP}/language-work/connector-ui/connector-ui.tgz" \
              --digest-output "${RUNNER_TEMP}/language-work/connector-ui/connector-ui.tgz.sha256"
          fi
      - name: Check connector release metadata before publication
        if: steps.state.outputs.release_required == 'true'
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: |
          # The publish job regenerates this file; failing here keeps a rejected manifest out of the registry.
          ui_arguments=()
          if [ -f "${RUNNER_TEMP}/language-work/connector-ui/connector-ui.tgz" ]; then
            ui_arguments+=(--ui-artifact "${RUNNER_TEMP}/language-work/connector-ui/connector-ui.tgz"
              --ui-digest "${RUNNER_TEMP}/language-work/connector-ui/connector-ui.tgz.sha256")
          fi
          mkdir -p "${RUNNER_TEMP}/connector-release-check"
          "${RUNNER_TEMP}/connectorctl" release-artifact \
            --manifest "${MANIFEST_PATH}" --language "${LANGUAGE}" --package "${PACKAGE_NAME}" \
            --version "${RELEASE_VERSION}" --tag "${TAG_PREFIX}${RELEASE_VERSION}" --source-sha "${SOURCE_SHA}" \
            --output "${RUNNER_TEMP}/connector-release-check/connector-release.json" \
            --digest-output "${RUNNER_TEMP}/connector-release-check/connector-release.json.sha256" \
            "${ui_arguments[@]}"
      - name: Plan language release and notes
        if: steps.state.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
        run: |
          python3 "${RUNNER_TEMP}/component_release.py" plan \
            --component-path "${COMPONENT_PATH}" --tag-prefix "${TAG_PREFIX}" \
            --version "${RELEASE_VERSION}" --ref "${GITHUB_REF}" \
            --json-output "${RUNNER_TEMP}/language-work/plan.json" --github-output "${RUNNER_TEMP}/language-plan-output"
          python3 "${RUNNER_TEMP}/component_release.py" notes \
            --plan "${RUNNER_TEMP}/language-work/plan.json" --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/language-work/notes.md"
          assets=("${RUNNER_TEMP}"/language-work/dist/*)
          manifest_args=()
          for asset in "${assets[@]}"; do manifest_args+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" language-manifest \
            --output "${RUNNER_TEMP}/language-work/dist/language-release.json" \
            --language "${LANGUAGE}" --package "${PACKAGE_NAME}" \
            --version "${RELEASE_VERSION}" --tag "${TAG_PREFIX}${RELEASE_VERSION}" \
            --source-sha "${SOURCE_SHA}" "${manifest_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: language-${{ strategy.job-index }}
          path: ${{ runner.temp }}/language-work
          if-no-files-found: error
          retention-days: 1

  publish-language:
    needs: [plan, release, build-language]
    if: always() && needs.plan.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && needs.build-language.result == 'success' && needs.plan.outputs.updates_count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.updates_matrix) }}
    env:
      COMPONENT_PATH: ${{ matrix.directory }}/${{ matrix.language }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      RELEASE_VERSION: ${{ matrix.version }}
      PACKAGE_NAME: ${{ matrix.package }}
      LANGUAGE: ${{ matrix.language }}
      RELEASE_DISPLAY_NAME: ${{ matrix.display_name }}
      GH_TOKEN: ${{ github.token }}
    steps: &publish_language_steps
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: astral-sh/setup-uv@v7
        if: matrix.language == 'python'
      - uses: actions/setup-node@v6
        if: matrix.language == 'typescript'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: language-${{ matrix.artifact_index }}
          path: ${{ runner.temp }}/language-work
      - name: Inspect language release state
        id: state
        run: |
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          if [ -f "${RUNNER_TEMP}/language-work/skip" ]; then
            if [ ! -f "${RUNNER_TEMP}/language-work/completed-release" ]; then
              echo "Build artifact requests a skip without a completed release: ${tag}" >&2
              exit 1
            fi
            echo 'release_required=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'release_required=true' >> "${GITHUB_OUTPUT}"
          source_sha="${GITHUB_SHA}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            source_sha="$(git rev-parse "${tag}^{commit}")"
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
      - name: Defer the first PyPI upload of a GitHub-first Python release
        id: first-limit
        if: steps.state.outputs.release_required == 'true' && matrix.first_publish == true && matrix.language == 'python'
        env:
          PYPI_DEFERRED_REASON: ${{ matrix.pypi_deferred_reason }}
        run: |
          if [ -n "${PYPI_DEFERRED_REASON}" ]; then
            printf 'status=deferred\nreason=%s\n' "${PYPI_DEFERRED_REASON}" >> "${GITHUB_OUTPUT}"
            echo "::notice::The GitHub release ships this package now; a later run uploads the same archives to PyPI."
            exit 0
          fi
          python3 script/release/language_publish.py check-project-limit \
            --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Verify package archives before publication
        if: steps.state.outputs.release_required == 'true'
        run: |
          if [ "${LANGUAGE}" = python ]; then
            assets=("${RUNNER_TEMP}"/language-work/dist/*.whl "${RUNNER_TEMP}"/language-work/dist/*.tar.gz)
          else
            assets=("${RUNNER_TEMP}"/language-work/dist/*.tgz)
          fi
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 script/release/component_release.py verify-language-artifacts \
            --language "${LANGUAGE}" --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" "${arguments[@]}"
      - name: Regenerate trusted release metadata
        if: steps.state.outputs.release_required == 'true'
        run: |
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          cp script/release/component_release.py script/release/github_release_inventory.py "${RUNNER_TEMP}/"
          cp script/release/npm_publish.py "${RUNNER_TEMP}/npm_publish.py"
          cp script/release/language_publish.py "${RUNNER_TEMP}/language_publish.py"
          GOWORK=off go build -o "${RUNNER_TEMP}/connectorctl" ./cmd/connectorctl
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            git merge-base --is-ancestor "${tag}" HEAD || { echo "Language tag is not reachable from main: ${tag}" >&2; exit 1; }
            git checkout --detach "$(git rev-parse "${tag}^{commit}")"
          fi
          python3 "${RUNNER_TEMP}/component_release.py" plan \
            --component-path "${COMPONENT_PATH}" --tag-prefix "${TAG_PREFIX}" \
            --version "${RELEASE_VERSION}" --ref "${GITHUB_REF}" \
            --json-output "${RUNNER_TEMP}/trusted-language-plan.json" \
            --github-output "${RUNNER_TEMP}/trusted-language-output"
          python3 "${RUNNER_TEMP}/component_release.py" notes \
            --plan "${RUNNER_TEMP}/trusted-language-plan.json" --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/language-work/notes.md"
          rm -f "${RUNNER_TEMP}"/language-work/dist/*.sha256 "${RUNNER_TEMP}/language-work/dist/language-release.json"
          if [ "${LANGUAGE}" = python ]; then
            assets=("${RUNNER_TEMP}"/language-work/dist/*.whl "${RUNNER_TEMP}"/language-work/dist/*.tar.gz)
          else
            assets=("${RUNNER_TEMP}"/language-work/dist/*.tgz)
          fi
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" language-manifest \
            --output "${RUNNER_TEMP}/language-work/dist/language-release.json" \
            --language "${LANGUAGE}" --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" \
            --tag "${tag}" --source-sha "$(git rev-parse HEAD)" "${arguments[@]}"
      - name: Build trusted connector release metadata
        if: steps.state.outputs.release_required == 'true'
        env:
          MANIFEST_PATH: ${{ matrix.manifest_path }}
        run: |
          # The previous step left the trusted release source checked out; main's connectorctl describes it.
          metadata="${RUNNER_TEMP}/connector-release"
          rm -rf "${metadata}"
          mkdir -p "${metadata}"
          ui_arguments=()
          if [ -f "${RUNNER_TEMP}/language-work/connector-ui/connector-ui.tgz" ]; then
            cp "${RUNNER_TEMP}"/language-work/connector-ui/connector-ui.tgz "${RUNNER_TEMP}"/language-work/connector-ui/connector-ui.tgz.sha256 "${metadata}/"
            ui_arguments+=(--ui-artifact "${metadata}/connector-ui.tgz" --ui-digest "${metadata}/connector-ui.tgz.sha256")
          fi
          "${RUNNER_TEMP}/connectorctl" release-artifact \
            --manifest "${MANIFEST_PATH}" --language "${LANGUAGE}" --package "${PACKAGE_NAME}" \
            --version "${RELEASE_VERSION}" --tag "${TAG_PREFIX}${RELEASE_VERSION}" --source-sha "$(git rev-parse HEAD)" \
            --output "${metadata}/connector-release.json" --digest-output "${metadata}/connector-release.json.sha256" \
            "${ui_arguments[@]}"
      - name: Publish Python package
        id: python-publish
        if: steps.state.outputs.release_required == 'true' && steps.first-limit.outputs.status != 'deferred' && matrix.language == 'python'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          test -n "${UV_PUBLISH_TOKEN}" || { echo 'PYPI_TOKEN is required' >&2; exit 1; }
          assets=("${RUNNER_TEMP}"/language-work/dist/*.whl "${RUNNER_TEMP}"/language-work/dist/*.tar.gz)
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" verify-pypi-artifacts \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" "${arguments[@]}"
          python3 "${RUNNER_TEMP}/language_publish.py" publish-pypi \
            --github-output "${GITHUB_OUTPUT}" \
            "${RUNNER_TEMP}"/language-work/dist/*.whl "${RUNNER_TEMP}"/language-work/dist/*.tar.gz
          if [ "$(sed -n 's/^status=//p' "${GITHUB_OUTPUT}" | tail -1)" != deferred ]; then
            python3 "${RUNNER_TEMP}/component_release.py" verify-pypi-artifacts \
              --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" --require-all --wait-seconds 120 "${arguments[@]}"
          fi
      - name: Publish npm package
        if: steps.state.outputs.release_required == 'true' && steps.first-limit.outputs.status != 'deferred' && matrix.language == 'typescript'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_tarball=("${RUNNER_TEMP}"/language-work/dist/*.tgz)
          python3 "${RUNNER_TEMP}/npm_publish.py" publish --package "${PACKAGE_NAME}" \
            --version "${RELEASE_VERSION}" --tarball "${package_tarball[0]}"
      - name: Describe the pending PyPI upload in the release notes
        if: steps.state.outputs.release_required == 'true' && matrix.language == 'python' && (steps.first-limit.outputs.status == 'deferred' || steps.python-publish.outputs.status == 'deferred')
        env:
          CONNECTOR_DIRECTORY: ${{ matrix.directory }}
        run: |
          wheels=("${RUNNER_TEMP}"/language-work/dist/*.whl)
          python3 "${RUNNER_TEMP}/language_publish.py" pending-pypi-notes \
            --notes "${RUNNER_TEMP}/language-work/notes.md" --repository "${GITHUB_REPOSITORY}" \
            --tag "${TAG_PREFIX}${RELEASE_VERSION}" --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" \
            --directory "${CONNECTOR_DIRECTORY}" --wheel "${wheels[0]}"
      - name: Check the live release before changing it
        id: guard
        if: steps.state.outputs.release_required == 'true'
        env:
          PYPI_STATUS: ${{ steps.python-publish.outputs.status || steps.first-limit.outputs.status }}
        run: |
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          release_assets="$(python3 "${RUNNER_TEMP}/github_release_inventory.py" --tag "${tag}" --live)"
          remote_tag_sha="$(git ls-remote origin "refs/tags/${tag}" "refs/tags/${tag}^{}" | tail -n 1 | cut -f 1)"
          python3 "${RUNNER_TEMP}/language_publish.py" check-release-mutation \
            --release-assets "${release_assets}" --built-plan "${RUNNER_TEMP}/language-work/plan.json" \
            --trusted-plan "${RUNNER_TEMP}/trusted-language-plan.json" --remote-tag-sha "${remote_tag_sha}" \
            --github-output "${RUNNER_TEMP}/guard-output"
          cat "${RUNNER_TEMP}/guard-output" >> "${GITHUB_OUTPUT}"
          if [ "${PYPI_STATUS}" = deferred ] && grep -qx 'release_state=incomplete' "${RUNNER_TEMP}/guard-output" \
            && grep -qx 'has_archives=true' "${RUNNER_TEMP}/guard-output"; then
            # A GitHub-first release has no registry copy, so its existing archives are the reference.
            existing="${RUNNER_TEMP}/existing-archives"
            mkdir -p "${existing}"
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir "${existing}" \
              --pattern '*.whl' --pattern '*.tar.gz'
            python3 "${RUNNER_TEMP}/language_publish.py" verify-existing-archives \
              --existing "${existing}" --dist "${RUNNER_TEMP}/language-work/dist"
          fi
      - name: Create or repair language release
        if: steps.state.outputs.release_required == 'true' && steps.guard.outputs.release_state != 'complete'
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
          PYPI_STATUS: ${{ steps.python-publish.outputs.status || steps.first-limit.outputs.status }}
          RELEASE_STATE: ${{ steps.guard.outputs.release_state }}
        run: |
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          title="$(python3 "${RUNNER_TEMP}/component_release.py" release-title \
            --display-name "${RELEASE_DISPLAY_NAME}" --language "${LANGUAGE}" --version "${RELEASE_VERSION}")"
          if [ "${RELEASE_STATE}" = incomplete ]; then
            edit_arguments=(--title "${title}")
            if [ "${PYPI_STATUS}" = deferred ]; then
              edit_arguments+=(--notes-file "${RUNNER_TEMP}/language-work/notes.md")
            fi
            gh release edit "${tag}" "${edit_arguments[@]}"
            gh release upload "${tag}" --clobber "${RUNNER_TEMP}"/language-work/dist/* "${RUNNER_TEMP}"/connector-release/*
          else
            # connector-release.json ships with the archives, so language-release.complete always follows it.
            gh release create "${tag}" --target "${SOURCE_SHA}" \
              --title "${title}" \
              --notes-file "${RUNNER_TEMP}/language-work/notes.md" "${RUNNER_TEMP}"/language-work/dist/* \
              "${RUNNER_TEMP}"/connector-release/*
          fi
      - name: Mark language release complete
        if: steps.state.outputs.release_required == 'true' && steps.guard.outputs.release_state != 'complete'
        id: complete
        run: |
          printf '%s\n' "${TAG_PREFIX}${RELEASE_VERSION}" > "${RUNNER_TEMP}/language-release.complete"
          gh release upload "${TAG_PREFIX}${RELEASE_VERSION}" --clobber "${RUNNER_TEMP}/language-release.complete"
      - name: Record the PyPI project-creation limit for this run
        if: matrix.first_publish == true && steps.python-publish.outputs.status == 'deferred'
        run: touch "${RUNNER_TEMP}/pypi-project-limit"
      - uses: actions/upload-artifact@v4
        if: matrix.first_publish == true && steps.python-publish.outputs.status == 'deferred'
        with:
          name: pypi-project-limit-${{ github.run_id }}
          path: ${{ runner.temp }}/pypi-project-limit
          retention-days: 1
          overwrite: true
      - name: Record language release result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PYPI_STATUS: ${{ steps.python-publish.outputs.status || steps.first-limit.outputs.status }}
          PYPI_DEFERRED_REASON: ${{ steps.first-limit.outputs.reason }}
          COMPLETE_STATUS: ${{ steps.complete.outcome }}
          RELEASE_REQUIRED: ${{ steps.state.outputs.release_required }}
          RELEASE_STATE: ${{ steps.guard.outputs.release_state }}
        run: |
          status=failed
          reason=""
          if [ "${JOB_STATUS}" = success ]; then
            if [ "${RELEASE_REQUIRED}" = false ]; then
              status=published
            elif [ "${RELEASE_STATE}" = complete ]; then
              status=published
              reason=already_complete
            elif [ "${COMPLETE_STATUS}" = success ] && [ "${PYPI_STATUS}" = deferred ]; then
              status=pypi_pending
              reason="${PYPI_DEFERRED_REASON:-project_creation_limit}"
            elif [ "${COMPLETE_STATUS}" = success ]; then
              status=published
            fi
          fi
          mkdir -p "${RUNNER_TEMP}/release-result"
          RESULT_STATUS="${status}" RESULT_REASON="${reason}" python3 -c 'import json,os; print(json.dumps({"tag":os.environ["TAG_PREFIX"]+os.environ["RELEASE_VERSION"],"status":os.environ["RESULT_STATUS"],"reason":os.environ["RESULT_REASON"]}))' \
            > "${RUNNER_TEMP}/release-result/release-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-result-${{ matrix.artifact_index }}
          path: ${{ runner.temp }}/release-result/release-result.json
          retention-days: 1

  publish-language-first:
    needs: [plan, release, build-language]
    if: always() && needs.plan.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && needs.build-language.result == 'success' && needs.plan.outputs.first_count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.first_matrix) }}
    env:
      COMPONENT_PATH: ${{ matrix.directory }}/${{ matrix.language }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      RELEASE_VERSION: ${{ matrix.version }}
      PACKAGE_NAME: ${{ matrix.package }}
      LANGUAGE: ${{ matrix.language }}
      RELEASE_DISPLAY_NAME: ${{ matrix.display_name }}
      GH_TOKEN: ${{ github.token }}
    steps: *publish_language_steps

  publish-language-github-first:
    needs: [plan, release, build-language]
    if: always() && needs.plan.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && needs.build-language.result == 'success' && needs.plan.outputs.github_first_count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Bounds GitHub content-creation bursts; the per-run count is capped in plan.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.github_first_matrix) }}
    env:
      COMPONENT_PATH: ${{ matrix.directory }}/${{ matrix.language }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      RELEASE_VERSION: ${{ matrix.version }}
      PACKAGE_NAME: ${{ matrix.package }}
      LANGUAGE: ${{ matrix.language }}
      RELEASE_DISPLAY_NAME: ${{ matrix.display_name }}
      GH_TOKEN: ${{ github.token }}
    steps: *publish_language_steps

  upload-pending-pypi:
    needs: [plan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.pypi_pending_count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.pypi_pending_matrix) }}
    env:
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      RELEASE_VERSION: ${{ matrix.version }}
      PACKAGE_NAME: ${{ matrix.package }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Defer after this run hits the PyPI project-creation limit
        id: first-limit
        if: matrix.first_publish == true
        run: |
          python3 script/release/language_publish.py check-project-limit \
            --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Download and verify the GitHub release archives
        if: steps.first-limit.outputs.status != 'deferred'
        run: |
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          git show-ref --verify --quiet "refs/tags/${tag}" || { echo "Language tag is missing: ${tag}" >&2; exit 1; }
          git merge-base --is-ancestor "${tag}" HEAD || { echo "Language tag is not reachable from main: ${tag}" >&2; exit 1; }
          dist="${RUNNER_TEMP}/pypi-work/dist"
          mkdir -p "${dist}"
          # Narrow patterns leave out connector-release.json.sha256 and connector-ui.tgz.sha256.
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir "${dist}" \
            --pattern '*.whl' --pattern '*.whl.sha256' --pattern '*.tar.gz' --pattern '*.tar.gz.sha256' \
            --pattern 'language-release.json' --pattern 'language-release.json.sha256'
          python3 script/release/language_publish.py verify-release-archives \
            --directory "${dist}" --tag "${tag}" --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" \
            --source-sha "$(git rev-parse "${tag}^{commit}")"
          python3 script/release/component_release.py verify-language-artifacts \
            --language python --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" \
            --asset "$(echo "${dist}"/*.whl)" --asset "$(echo "${dist}"/*.tar.gz)"
      - name: Upload the GitHub release archives to PyPI
        id: python-publish
        if: steps.first-limit.outputs.status != 'deferred'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          test -n "${UV_PUBLISH_TOKEN}" || { echo 'PYPI_TOKEN is required' >&2; exit 1; }
          dist="${RUNNER_TEMP}/pypi-work/dist"
          arguments=(--asset "$(echo "${dist}"/*.whl)" --asset "$(echo "${dist}"/*.tar.gz)")
          python3 script/release/component_release.py verify-pypi-artifacts \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" "${arguments[@]}"
          python3 script/release/language_publish.py publish-pypi \
            --github-output "${GITHUB_OUTPUT}" "${dist}"/*.whl "${dist}"/*.tar.gz
          if [ "$(sed -n 's/^status=//p' "${GITHUB_OUTPUT}" | tail -1)" != deferred ]; then
            python3 script/release/component_release.py verify-pypi-artifacts \
              --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" --require-all --wait-seconds 120 "${arguments[@]}"
          fi
      - name: Replace the pending PyPI text in the release notes
        if: steps.python-publish.outputs.status == 'published'
        # The pending text stays accurate after upload, so a failed edit only warns.
        continue-on-error: true
        run: |
          tag="${TAG_PREFIX}${RELEASE_VERSION}"
          notes="${RUNNER_TEMP}/pypi-work/notes"
          mkdir -p "${notes}"
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > "${notes}/current.md"
          python3 script/release/language_publish.py published-pypi-notes \
            --notes "${notes}/current.md" --output "${notes}/published.md" \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}"
          if ! cmp -s "${notes}/current.md" "${notes}/published.md"; then
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --notes-file "${notes}/published.md"
          fi
      - name: Record the PyPI project-creation limit for this run
        if: matrix.first_publish == true && steps.python-publish.outputs.status == 'deferred'
        run: touch "${RUNNER_TEMP}/pypi-project-limit"
      - uses: actions/upload-artifact@v4
        if: matrix.first_publish == true && steps.python-publish.outputs.status == 'deferred'
        with:
          name: pypi-project-limit-${{ github.run_id }}
          path: ${{ runner.temp }}/pypi-project-limit
          retention-days: 1
          overwrite: true
      - name: Record PyPI upload result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PYPI_STATUS: ${{ steps.python-publish.outputs.status || steps.first-limit.outputs.status }}
        run: |
          status=failed
          reason=""
          if [ "${JOB_STATUS}" = success ] && [ "${PYPI_STATUS}" = published ]; then
            status=published
          elif [ "${JOB_STATUS}" = success ] && [ "${PYPI_STATUS}" = deferred ]; then
            status=pypi_pending
            reason=project_creation_limit
          fi
          mkdir -p "${RUNNER_TEMP}/release-result"
          RESULT_STATUS="${status}" RESULT_REASON="${reason}" python3 -c 'import json,os; print(json.dumps({"tag":os.environ["TAG_PREFIX"]+os.environ["RELEASE_VERSION"],"status":os.environ["RESULT_STATUS"],"reason":os.environ["RESULT_REASON"]}))' \
            > "${RUNNER_TEMP}/release-result/release-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-result-pypi-${{ strategy.job-index }}
          path: ${{ runner.temp }}/release-result/release-result.json
          retention-days: 1

  repair-language-connector-release:
    needs: [plan]
    # Never gates the catalog: the catalog reads language-release.complete, which these releases already have.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.connector_release_repair_count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Bounds GitHub content-creation bursts; the per-run count is capped in plan.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.connector_release_repair_matrix) }}
    env:
      RELEASE_TAG: ${{ matrix.tag }}
      CONNECTOR_DIRECTORY: ${{ matrix.directory }}
      LANGUAGE: ${{ matrix.language }}
      RELEASE_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Restore the tagged release source beside main's tooling
        id: source
        run: |
          git merge-base --is-ancestor "${RELEASE_TAG}" HEAD || { echo "Release tag is not reachable from main: ${RELEASE_TAG}" >&2; exit 1; }
          GOWORK=off go build -o "${RUNNER_TEMP}/connectorctl" ./cmd/connectorctl
          git worktree add --detach "${RUNNER_TEMP}/source" "${RELEASE_TAG}^{commit}"
          echo "source_sha=$(git rev-parse "${RELEASE_TAG}^{commit}")" >> "${GITHUB_OUTPUT}"
      - name: Inspect the live release
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(python3 script/release/github_release_inventory.py --tag "${RELEASE_TAG}" --live)"
          jq -e 'type == "array" and index("language-release.complete") != null' <<< "${assets}" >/dev/null || {
            echo "Only a complete language release is repaired here: ${RELEASE_TAG}" >&2
            exit 1
          }
          has_ui_artifact=false
          if jq -e 'index("connector-ui.tgz") != null' <<< "${assets}" >/dev/null; then has_ui_artifact=true; fi
          echo "has_ui_artifact=${has_ui_artifact}" >> "${GITHUB_OUTPUT}"
      - name: Reuse the release's Studio UI artifact
        if: steps.state.outputs.has_ui_artifact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An earlier partial repair uploaded it; a rebuild could produce different bytes.
          ui="${RUNNER_TEMP}/connector-ui"
          mkdir -p "${ui}"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${ui}" --pattern connector-ui.tgz
          (cd "${ui}" && sha256sum connector-ui.tgz > connector-ui.tgz.sha256)
      - name: Build the Studio UI artifact at the tagged source
        if: steps.state.outputs.has_ui_artifact != 'true'
        working-directory: ${{ runner.temp }}/source
        run: |
          if [ -f "${CONNECTOR_DIRECTORY}/ui/package-lock.json" ]; then
            npm ci --prefix sdk/react
            npm run build --prefix sdk/react
            npm ci --prefix "${CONNECTOR_DIRECTORY}/ui"
            npm run build --prefix "${CONNECTOR_DIRECTORY}/ui"
            mkdir -p "${RUNNER_TEMP}/connector-ui"
            "${RUNNER_TEMP}/connectorctl" ui-artifact \
              --manifest "${CONNECTOR_DIRECTORY}/connector.yaml" \
              --ui-root "${CONNECTOR_DIRECTORY}/ui/dist" \
              --output "${RUNNER_TEMP}/connector-ui/connector-ui.tgz" \
              --digest-output "${RUNNER_TEMP}/connector-ui/connector-ui.tgz.sha256"
          fi
      - name: Build connector release metadata with main's tooling
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          metadata="${RUNNER_TEMP}/connector-release"
          mkdir -p "${metadata}"
          ui_arguments=()
          if [ -f "${RUNNER_TEMP}/connector-ui/connector-ui.tgz" ]; then
            ui_arguments+=(--ui-artifact "${RUNNER_TEMP}/connector-ui/connector-ui.tgz"
              --ui-digest "${RUNNER_TEMP}/connector-ui/connector-ui.tgz.sha256")
          fi
          "${RUNNER_TEMP}/connectorctl" release-artifact \
            --manifest "${RUNNER_TEMP}/source/${CONNECTOR_DIRECTORY}/connector.yaml" --language "${LANGUAGE}" \
            --version "${RELEASE_VERSION}" --tag "${RELEASE_TAG}" --source-sha "${SOURCE_SHA}" \
            --output "${metadata}/connector-release.json" --digest-output "${metadata}/connector-release.json.sha256" \
            "${ui_arguments[@]}"
      - name: Attach the missing connector release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Uploads only absent assets, the metadata digest last, and fails on any existing asset that differs.
          assets=()
          if [ -f "${RUNNER_TEMP}/connector-ui/connector-ui.tgz" ]; then
            assets+=("${RUNNER_TEMP}/connector-ui/connector-ui.tgz" "${RUNNER_TEMP}/connector-ui/connector-ui.tgz.sha256")
          fi
          assets+=("${RUNNER_TEMP}/connector-release/connector-release.json"
            "${RUNNER_TEMP}/connector-release/connector-release.json.sha256")
          python3 script/release/language_publish.py attach-missing-release-assets \
            --repository "${GITHUB_REPOSITORY}" --tag "${RELEASE_TAG}" "${assets[@]}"

  summarize-language:
    needs: [plan, build-language, publish-language, publish-language-first, publish-language-github-first, upload-pending-pypi]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.language_count != '0' || needs.plan.outputs.pending_count != '0') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.summary.outputs.result }}
      pending_count: ${{ steps.summary.outputs.pending_count }}
      published_count: ${{ steps.summary.outputs.published_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: language-selection
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.language_count != '0' || needs.plan.outputs.pypi_pending_count != '0'
        continue-on-error: true
        with:
          pattern: language-result-*
          path: ${{ runner.temp }}/language-results
      - name: Summarize published, deferred, and failed releases
        id: summary
        run: |
          mkdir -p "${RUNNER_TEMP}/language-results"
          python3 script/release/language_publish.py summarize \
            --selection "${RUNNER_TEMP}/selection/language-selection.json" \
            --results-directory "${RUNNER_TEMP}/language-results" \
            --github-output "${GITHUB_OUTPUT}"

  release-connectors-mcp:
    needs: [plan, release]
    # Runs after every Go release shard, also when none ran, and reconciles to the complete releases of this
    # moment. build-catalog waits for it so the index lists its release, but never requires its success.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Connector tags created minutes earlier come straight from GitHub, as the Go release check does.
      GONOPROXY: github.com/superdurable/dex-connectors-library
      GONOSUMDB: github.com/superdurable/dex-connectors-library
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          # The server's MCP SDK requires Go 1.25.
          go-version: '1.25'
          check-latest: false
          token: ''
          cache-dependency-path: |
            go.sum
            connectorsmcp/go.sum
      - name: Find the latest complete and an incomplete Connectors MCP release
        id: state
        run: |
          work="${RUNNER_TEMP}/connectors-mcp"
          # A repair checks out the tagged release commit, so the tooling runs from main's copy.
          mkdir -p "${work}/tooling"
          cp script/release/connectors_mcp_release.py script/release/github_release_inventory.py "${work}/tooling/"
          python3 "${work}/tooling/github_release_inventory.py" --output "${work}/release-inventory.json"
          python3 "${work}/tooling/connectors_mcp_release.py" state \
            --release-inventory "${work}/release-inventory.json" --github-output "${GITHUB_OUTPUT}"
      - name: Plan the Connectors MCP release from complete Go releases
        id: plan
        if: steps.state.outputs.repair_tag == ''
        env:
          PREVIOUS_TAG: ${{ steps.state.outputs.previous_tag }}
        run: |
          work="${RUNNER_TEMP}/connectors-mcp"
          GOWORK=off go run ./cmd/connectorctl connectors-mcp-inventory --catalog catalog.yaml \
            --release-inventory "${work}/release-inventory.json" --release-config connectorsmcp/release.yaml \
            --output "${work}/inventory.json"
          previous_arguments=()
          if [ -n "${PREVIOUS_TAG}" ]; then
            gh release download "${PREVIOUS_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern connectors-mcp-release.json --dir "${work}/previous"
            previous_arguments+=(--previous-tag "${PREVIOUS_TAG}" --previous-lock "${work}/previous/connectors-mcp-release.json")
          fi
          python3 "${work}/tooling/connectors_mcp_release.py" plan --inventory "${work}/inventory.json" \
            "${previous_arguments[@]}" --output "${work}/plan.json" --github-output "${GITHUB_OUTPUT}"
      - name: Build the connector set with the hold rule
        id: build
        if: steps.plan.outputs.release_required == 'true'
        run: |
          work="${RUNNER_TEMP}/connectors-mcp"
          python3 "${work}/tooling/connectors_mcp_release.py" build --plan "${work}/plan.json" \
            --module-directory connectorsmcp --work-directory "${work}/build" \
            --result "${work}/build.json" --github-output "${GITHUB_OUTPUT}"
      - name: Create the release commit off main and tag it
        if: steps.build.outputs.release_required == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          generated=(connectorsmcp/go.mod connectorsmcp/go.sum connectorsmcp/cmd/dex-connectors-mcp/zz_generated_registry.go)
          git add "${generated[@]}"
          unexpected="$(git diff --cached --name-only | grep -vxF "${generated[@]/#/-e}" || true)"
          if ! git diff --quiet || [ -n "${unexpected}" ]; then
            git status --porcelain --untracked-files=no >&2
            echo 'The release build changed files outside the registry and go.mod' >&2
            exit 1
          fi
          # A server-only change or the last withdrawal leaves the generated files equal to main's.
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --allow-empty -m "connectorsmcp: release v${RELEASE_VERSION}"
          git tag "${RELEASE_TAG}"
      - name: Check out the incomplete release for repair
        if: steps.state.outputs.repair_tag != ''
        env:
          REPAIR_TAG: ${{ steps.state.outputs.repair_tag }}
        run: git checkout --detach "${REPAIR_TAG}"
      - name: Build the release archives, lock, and checksums
        id: package
        if: steps.build.outputs.release_required == 'true' || steps.state.outputs.repair_tag != ''
        env:
          RELEASE_TAG: ${{ steps.state.outputs.repair_tag || steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.state.outputs.repair_version || steps.plan.outputs.version }}
        run: |
          work="${RUNNER_TEMP}/connectors-mcp"
          build_arguments=()
          if [ -f "${work}/build.json" ]; then build_arguments+=(--build-result "${work}/build.json"); fi
          python3 "${work}/tooling/connectors_mcp_release.py" package --module-directory connectorsmcp \
            --version "${RELEASE_VERSION}" --tag "${RELEASE_TAG}" --output-directory "${work}/dist" \
            --work-directory "${work}/package" "${build_arguments[@]}"
          printf 'tag=%s\nversion=%s\n' "${RELEASE_TAG}" "${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        if: steps.package.outcome == 'success' && inputs.dry_run == true
        with:
          name: connectors-mcp-dry-run
          path: |
            ${{ runner.temp }}/connectors-mcp/dist
            ${{ runner.temp }}/connectors-mcp/package/release-notes.md
          retention-days: 7
      - name: Push the release tag and create or repair the GitHub release
        if: steps.package.outcome == 'success' && inputs.dry_run != true
        env:
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          work="${RUNNER_TEMP}/connectors-mcp"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            # The release commit is on no branch, so only its tag is pushed.
            authorization="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
              push origin "refs/tags/${RELEASE_TAG}"
          fi
          remote_commit="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          if [ "${remote_commit}" != "$(git rev-parse "${RELEASE_TAG}^{commit}")" ]; then
            echo "The remote ${RELEASE_TAG} names another commit" >&2
            exit 1
          fi
          assets=("${work}"/dist/*.tar.gz "${work}/dist/checksums.txt" "${work}/dist/connectors-mcp-release.json")
          title="Connectors MCP v${RELEASE_VERSION}"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --title "${title}" \
              --notes-file "${work}/package/release-notes.md" --latest=false
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${assets[@]}"
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --latest=false \
              --title "${title}" --notes-file "${work}/package/release-notes.md" "${assets[@]}"
          fi
      - name: Verify the published server module
        if: steps.package.outcome == 'success' && inputs.dry_run != true
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          deadline=$((SECONDS + 120))
          until GOWORK=off GOPROXY=direct go mod download \
            "github.com/superdurable/dex-connectors-library/connectorsmcp@v${RELEASE_VERSION}"; do
            if (( SECONDS >= deadline )); then
              echo "The released server module did not become downloadable before the deadline" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Mark the Connectors MCP release complete
        if: steps.package.outcome == 'success' && inputs.dry_run != true
        env:
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          printf '%s\n' "${RELEASE_TAG}" > "${RUNNER_TEMP}/connectors-mcp-release.complete"
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${RUNNER_TEMP}/connectors-mcp-release.complete"

  build-catalog:
    needs: [plan, release, build-language, publish-language, publish-language-first, publish-language-github-first, upload-pending-pypi, summarize-language, release-connectors-mcp]
    if: always() && needs.plan.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (needs.build-language.result == 'success' || needs.build-language.result == 'skipped') && (needs.publish-language.result == 'success' || (needs.plan.outputs.updates_count == '0' && needs.publish-language.result == 'skipped')) && (needs.publish-language-first.result == 'success' || (needs.plan.outputs.first_count == '0' && needs.publish-language-first.result == 'skipped')) && (needs.publish-language-github-first.result == 'success' || (needs.plan.outputs.github_first_count == '0' && needs.publish-language-github-first.result == 'skipped')) && (needs.summarize-language.result == 'success' || (needs.plan.outputs.pending_count == '0' && needs.summarize-language.result == 'skipped')) && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      connectors_mcp_index: ${{ steps.connectors-mcp-index.outputs.outcome }}
      connectors_mcp_index_dropped: ${{ steps.connectors-mcp-index.outputs.dropped }}
      connectors_mcp_index_unverified: ${{ steps.connectors-mcp-index.outputs.unverified }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Generate public Connector catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/pages
          python3 script/release/language_publish.py completed-language-tags \
            --output "${RUNNER_TEMP}/completed-language-tags"
          go run ./cmd/connectorctl release-matrix --catalog catalog.yaml --include-published-languages \
            --github-output "${RUNNER_TEMP}/language-packages"
          python3 script/release/language_publish.py pypi-published-language-tags \
            --matrix-output "${RUNNER_TEMP}/language-packages" \
            --completed-language-tags "${RUNNER_TEMP}/completed-language-tags" \
            --output "${RUNNER_TEMP}/pypi-published-language-tags"
          go run ./cmd/connectorctl catalog \
            --catalog catalog.yaml \
            --completed-language-tags "${RUNNER_TEMP}/completed-language-tags" \
            --pypi-published-language-tags "${RUNNER_TEMP}/pypi-published-language-tags" \
            --output dist/pages/catalog.yaml \
            --json-output dist/pages/catalog.json
      - name: Generate the Connectors MCP release index
        id: connectors-mcp-index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The catalog never waits on this index; check-connectors-mcp-index turns a degraded outcome red.
          index=dist/pages/connectors-mcp/index.json
          deployed="${RUNNER_TEMP}/connectors-mcp-deployed-index.json"
          mkdir -p "$(dirname "${index}")"
          deployed_arguments=()
          if curl --fail --silent --show-error --location --retry 3 \
              https://connectors.superdurable.io/connectors-mcp/index.json --output "${deployed}" \
            && python3 -c 'import json,sys; index=json.load(open(sys.argv[1])); sys.exit(index.get("schemaVersion") != "dex-connectors-mcp/release-index/v1")' "${deployed}"; then
            deployed_arguments+=(--deployed-index "${deployed}")
          else
            rm -f "${deployed}"
            echo '::notice::No deployed Connectors MCP index is available'
          fi
          if ! python3 script/release/connectors_mcp_release.py index --output "${index}" \
              "${deployed_arguments[@]}" --github-output "${GITHUB_OUTPUT}"; then
            rm -f "${index}"
            if [ -f "${deployed}" ]; then
              cp "${deployed}" "${index}"
              echo '::warning::Connectors MCP index rebuild failed; republishing the deployed index'
              echo 'outcome=fell_back' >> "${GITHUB_OUTPUT}"
            else
              echo '::warning::Connectors MCP index rebuild failed and none is deployed; this catalog deploy omits it'
              echo 'outcome=omitted' >> "${GITHUB_OUTPUT}"
            fi
          fi
      - name: Build directory site and preview card
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          npm ci --prefix site
          npm test --prefix site
          npm run build --prefix site
          node site/scripts/render-card.mjs \
            --catalog dist/pages/catalog.yaml \
            --output dist/pages/card.png
          cp -a site/dist/. dist/pages/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy-catalog:
    permissions:
      pages: write
      id-token: write
    needs: build-catalog
    # always() so a skipped release (a push that changes no Connector) does not
    # skip the deploy too: without it the implicit success() fails on that
    # skipped ancestor and only Connector releases reach the catalog site.
    if: always() && needs.build-catalog.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Connector catalog
        id: deployment
        uses: actions/deploy-pages@v4

  check-connectors-mcp-index:
    needs: [build-catalog, deploy-catalog]
    # Runs after the catalog deploy, so a degraded index is visible without blocking the catalog.
    if: always() && needs.build-catalog.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when the Connectors MCP index fell back, was omitted, or dropped a version
        env:
          INDEX_OUTCOME: ${{ needs.build-catalog.outputs.connectors_mcp_index }}
          DROPPED_TAGS: ${{ needs.build-catalog.outputs.connectors_mcp_index_dropped }}
          UNVERIFIED_TAGS: ${{ needs.build-catalog.outputs.connectors_mcp_index_unverified }}
        run: |
          repair='See docs/versioning-and-releases.md#connectors-mcp-server-releases for the repair path.'
          case "${INDEX_OUTCOME}" in
            ok) echo 'The Connectors MCP index lists every complete release.' ;;
            fell_back) echo "::error::The newest Connectors MCP release could not be indexed; the deployed index was republished. ${repair}"; exit 1 ;;
            omitted) echo "::error::The Connectors MCP index could not be built and none was deployed. ${repair}"; exit 1 ;;
            dropped_versions) echo "::error::The Connectors MCP index left out ${DROPPED_TAGS}. ${repair}"; exit 1 ;;
            reused_unverified) echo "::error::The Connectors MCP index reused deployed entries it could not verify: ${UNVERIFIED_TAGS}. ${repair}"; exit 1 ;;
            empty) echo "::error::The Connectors MCP index lists no release although complete releases exist. ${repair}"; exit 1 ;;
            *) echo "::error::Unknown Connectors MCP index outcome '${INDEX_OUTCOME}'. ${repair}"; exit 1 ;;
          esac

  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Connector releases can run only from main" >&2
          exit 1
