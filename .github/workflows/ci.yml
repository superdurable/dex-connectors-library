name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            connectors/**/go.sum
      - name: Test standalone Connector Go SDK module
        working-directory: sdkgo
        env:
          GOWORK: "off"
        run: |
          go test -race ./...
          go vet ./...
      - name: Test component release planning
        run: python3 -m unittest script/release/component_release_test.py
      - name: Test every standalone Connector module
        run: |
          while IFS= read -r manifest; do
            module="${manifest%/connector.yaml}"
            (cd "${module}" && GOWORK=off go test -race ./... && GOWORK=off go vet ./...)
          done < <(find connectors -name connector.yaml -print | sort)
      - run: go test -race ./...
      - run: go vet ./...
      - name: Validate every manifest and generated Connector
        run: |
          while IFS= read -r manifest; do
            go run ./cmd/connectorctl validate "${manifest}"
            go run ./cmd/connectorctl generate --check "${manifest}"
          done < <(find connectors -name connector.yaml -print | sort)
      - run: go run ./cmd/connectorctl release-workflow --check connectors .github/workflows/release-connector.yml
      - run: go run ./cmd/connectorctl catalog connectors

  dex-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            connectors/**/go.sum
      - name: Download Dex and Temporal CLIs
        run: |
          curl --fail --location --output dexcli.tar.gz \
            https://github.com/superdurable/dex/releases/download/cli-v0.11.3/dexcli_v0.11.3_linux_amd64.tar.gz
          echo "91197aa7afb66468c1b8da8d662e3c321257664e0bd57dae11e4b78337509e34  dexcli.tar.gz" | sha256sum --check
          tar --extract --gzip --file dexcli.tar.gz
          curl --fail --location --output temporal.tar.gz \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  temporal.tar.gz" | sha256sum --check
          mkdir temporal-cli
          tar --extract --gzip --file temporal.tar.gz --directory temporal-cli
          echo "$PWD/temporal-cli" >> "$GITHUB_PATH"
          temporal-cli/temporal --version
      - name: Run real Dex integration suite
        run: |
          ./dexcli dev -dex-port 18801 -web-port 18802 -open=false \
            -blob-store-dir /tmp/dex-connectors/blobs \
            -sqlite-db-filename /tmp/dex-connectors/dex.sqlite.db \
            -server-log-folder /tmp/dex-connectors/logs > /tmp/dex-connectors-server.log 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/18801) 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then
              cat /tmp/dex-connectors-server.log
              exit 1
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then
            cat /tmp/dex-connectors-server.log
            exit 1
          fi
          cd sdkgo
          DEX_FLOW_SERVICE_ADDRESS=127.0.0.1:18801 GOWORK=off \
            go test -race -tags=integration ./integrationtest/... -count=1 -v

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/react
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/react/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test and build every Connector Studio UI
        working-directory: .
        run: |
          while IFS= read -r lock; do
            ui="${lock%/package-lock.json}"
            npm ci --prefix "${ui}"
            npm test --prefix "${ui}"
            npm run build --prefix "${ui}"
            manifest="${ui%/ui}/connector.yaml"
            go run ./cmd/connectorctl ui-artifact \
              --manifest "${manifest}" --ui-root "${ui}/dist" \
              --output /tmp/connector-ui.tgz --digest-output /tmp/connector-ui.tgz.sha256
          done < <(find connectors -path '*/ui/package-lock.json' -print | sort)
