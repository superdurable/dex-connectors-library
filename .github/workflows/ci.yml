      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site

  connectors-mcp:
    needs: [connector-plan, dex-version-plan]
    if: needs.connector-plan.outputs.connectors_mcp == 'true'
    runs-on: ubuntu-latest
    env:
      DEX_CLI_RELEASE_TAG: ${{ needs.dex-version-plan.outputs.cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.dex-version-plan.outputs.cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.dex-version-plan.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # The server's MCP SDK requires Go 1.25.
          go-version: '1.25'
          check-latest: false
          token: ''
          cache-dependency-path: |
            connectorsmcp/go.sum
            sdkgo/go.sum
      - name: Test the Connectors MCP server against this commit's sdkgo
        run: make test-connectors-mcp
      # The example runs a Dex engine, so pull requests skip it and the merge queue runs it.
      - uses: astral-sh/setup-uv@v7
        if: github.event_name != 'pull_request'
      - name: Install Dex CLI from the run's resolved release
        if: github.event_name != 'pull_request'
        run: python3 script/dex_compatibility.py install-dexcli --output .bin/dexcli
      - name: Run the Hacker News agent example on a private Dex engine and the released server
        if: github.event_name != 'pull_request'
        run: make test-connectors-mcp-example

  ci-summary:
    if: always()
    needs:
      - connector-plan
      - dex-version-plan
      - common-repository-checks
      - common-sdkgo
      - common-root-go
      - common-python-scripts
      - common-typescript-conformance
      - sdkpython
      - sdkpython-integration
      - sdkts
      - sdkts-integration
      - language-connectors
      - connector-conformance
      - python-connectors-latest-sdk
      - database-language-plan
      - database-language-integration
      - email-language-plan
      - email-language-integration
      - connectors
      - workspace-connector-dependents
      - dex-integration-sdk
      - dex-integration-connectors
      - dex-compat-current
      - dex-compat-released
      - dex-compat-latest-go-sdk
      - dex-compat-canary-issue
      - react
      - site
      - connectors-mcp
    runs-on: ubuntu-latest
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
      EVENT_NAME: ${{ github.event_name }}
      PLAN_COUNT: ${{ needs.connector-plan.outputs.count }}
      PLAN_COMMON_SDKGO: ${{ needs.connector-plan.outputs.common_sdkgo }}
      PLAN_COMMON_ROOT_GO: ${{ needs.connector-plan.outputs.common_root_go }}
      PLAN_COMMON_PYTHON_SCRIPTS: ${{ needs.connector-plan.outputs.common_python_scripts }}
      PLAN_COMMON_TYPESCRIPT_CONFORMANCE: ${{ needs.connector-plan.outputs.common_typescript_conformance }}
      PLAN_SDKPYTHON: ${{ needs.connector-plan.outputs.sdkpython }}
      PLAN_SDKTS: ${{ needs.connector-plan.outputs.sdkts }}
      PLAN_SDKGO_INTEGRATION: ${{ needs.connector-plan.outputs.sdkgo_integration }}
      PLAN_REACT: ${{ needs.connector-plan.outputs.react }}
      PLAN_SITE: ${{ needs.connector-plan.outputs.site }}
      PLAN_CONNECTORS_MCP: ${{ needs.connector-plan.outputs.connectors_mcp }}
      PLAN_DATABASE_LANGUAGE_COUNT: ${{ needs.database-language-plan.outputs.count }}
      PLAN_EMAIL_LANGUAGE_COUNT: ${{ needs.email-language-plan.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: script/ci_summary.py
          sparse-checkout-cone-mode: false
      - name: Require every selected CI job to pass
        run: python3 script/ci_summary.py
