      - name: Build and vet the Connector SDK and affected connectors with the latest stable Dex Go SDK
        run: make test-dex-compat-latest-go-sdk

  dex-compat-canary-issue:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [dex-compat-released, dex-compat-latest-go-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Update latest Dex compatibility issue
        uses: actions/github-script@v8
        env:
          RELEASED_CANARY_RESULT: ${{ needs.dex-compat-released.result }}
          LATEST_GO_SDK_CANARY_RESULT: ${{ needs.dex-compat-latest-go-sdk.result }}
        with:
          script: |
            const marker = "<!-- dex-compat-latest-canary -->";
            const issueTitle = "Dex compatibility canary: latest stable release";
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "all",
              per_page: 100,
            });
            const issue = issues.find((candidate) =>
              !candidate.pull_request &&
              candidate.title === issueTitle &&
              candidate.body?.includes(marker)
            );
            const canaryResults = [
              ["Released connectors with the latest stable Dex CLI and Web", process.env.RELEASED_CANARY_RESULT],
              ["Connector SDK and connector source with the latest stable Dex Go SDK", process.env.LATEST_GO_SDK_CANARY_RESULT],
            ];
            if (canaryResults.every(([, result]) => result === "success")) {
              if (issue?.state === "open") {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `Recovered in [scheduled run ${context.runId}](${runURL}).`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }
            const label = "dex-compatibility";
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "B60205",
                description: "Dex CLI, Web, and Go SDK compatibility failures",
              });
            }
            const body = [
              marker,
              "The scheduled compatibility canary against the latest stable Dex CLI, Web, or Go SDK failed.",
              "",
              `- Latest failed run: [${context.runId}](${runURL})`,
              `- Connector commit: ${context.sha}`,
              ...canaryResults.map(([check, result]) => `- ${check}: ${result}`),
              "",
              "Inspect the failed shard for the resolved Dex tag or Dex Go SDK version, connector tag, source commit, and artifact digest. Fix current source, publish a new SDK or connector release when required, then rerun the canary. This issue closes automatically after a successful scheduled run.",
            ].join("\n");
            if (issue) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [label] });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, title: issueTitle, body, state: "open" });
            } else {
              await github.rest.issues.create({ ...context.repo, title: issueTitle, body, labels: [label] });
            }

  react:
    needs: connector-plan
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.react == 'true'
    runs-on: ubuntu-latest
