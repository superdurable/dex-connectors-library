name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            sdk/go/go.sum
      - name: Test standalone Connector Go SDK module
        working-directory: sdk/go
        env:
          GOWORK: "off"
        run: |
          go test -race ./...
          go vet ./...
      - name: Test component release planning
        run: python3 -m unittest script/release/component_release_test.py
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/connectorctl validate connectors/http/connector.yaml connectors/openai/connector.yaml
      - run: go run ./cmd/connectorctl generate --check connectors/http/connector.yaml
      - run: go run ./cmd/connectorctl generate --check connectors/openai/connector.yaml
      - run: go run ./cmd/connectorctl catalog connectors

  dex-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Dex and Temporal CLIs
        run: |
          curl --fail --location --output dexcli.tar.gz \
            https://github.com/superdurable/dex/releases/download/cli-v0.11.1/dexcli_v0.11.1_linux_amd64.tar.gz
          echo "92ca91c5fec9cb1315c9e3f006f37e8f5f6711dd5d0ac1efb8d682da9ee64ac0  dexcli.tar.gz" | sha256sum --check
          tar --extract --gzip --file dexcli.tar.gz
          curl --fail --location --output temporal.tar.gz \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  temporal.tar.gz" | sha256sum --check
          mkdir temporal-cli
          tar --extract --gzip --file temporal.tar.gz --directory temporal-cli
          echo "$PWD/temporal-cli" >> "$GITHUB_PATH"
          temporal-cli/temporal --version
      - name: Run real Dex integration suite
        run: |
          ./dexcli dev -dex-port 18801 -web-port 18802 -open=false \
            -blob-store-dir /tmp/dex-connectors/blobs \
            -sqlite-db-filename /tmp/dex-connectors/dex.sqlite.db \
            -server-log-folder /tmp/dex-connectors/logs > /tmp/dex-connectors-server.log 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/18801) 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then
              cat /tmp/dex-connectors-server.log
              exit 1
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then
            cat /tmp/dex-connectors-server.log
            exit 1
          fi
          DEX_FLOW_SERVICE_ADDRESS=127.0.0.1:18801 \
            go test -race -tags=integration ./examples/customer-onboarding -count=1 -v

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/react
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
