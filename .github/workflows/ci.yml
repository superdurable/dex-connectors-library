name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    env:
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Plan affected Connector shards
        id: plan
        run: |
          make catalog-check
          arguments=(
            --catalog catalog.yaml
            --scope "${CONNECTOR_SCOPE}"
            --head "${CONNECTOR_HEAD}"
            --max-shards 256
            --github-output "${GITHUB_OUTPUT}"
          )
          if [ "${CONNECTOR_SCOPE}" = changed ]; then
            arguments+=(--base "${CONNECTOR_BASE}")
          fi
          GOWORK=off go run ./cmd/connectorctl test-matrix "${arguments[@]}"

  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
      - run: make test-common

  connectors:
    needs: connector-plan
    if: needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/react/package-lock.json
            connectors/**/ui/package-lock.json
      - name: Test affected standalone Connector modules
        run: make test-connectors studio-bundle-theme react-connectors

  dex-integration-sdk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
      - name: Download Dex and Temporal CLIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/dex_compatibility.py install-dexcli --output ./dexcli
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --output temporal.tar.gz \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  temporal.tar.gz" | sha256sum --check
          mkdir temporal-cli
          tar --extract --gzip --file temporal.tar.gz --directory temporal-cli
          echo "$PWD/temporal-cli" >> "$GITHUB_PATH"
      - name: Run shared SDK integration suite
        run: |
          ./dexcli dev -dex-port 18801 -web-port 18802 -open=false \
            -blob-store-dir /tmp/dex-connectors/blobs \
            -sqlite-db-filename /tmp/dex-connectors/dex.sqlite.db \
            -server-log-folder /tmp/dex-connectors/logs > /tmp/dex-connectors-server.log 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/18801) 2>/dev/null; then
              DEX_FLOW_SERVICE_ADDRESS=127.0.0.1:18801 make test-sdk-integration
              exit
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          cat /tmp/dex-connectors-server.log
          exit 1

  dex-integration-connectors:
    needs: connector-plan
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go.sum
      - name: Download Dex and Temporal CLIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/dex_compatibility.py install-dexcli --output ./dexcli
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --output temporal.tar.gz \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  temporal.tar.gz" | sha256sum --check
          mkdir temporal-cli
          tar --extract --gzip --file temporal.tar.gz --directory temporal-cli
          echo "$PWD/temporal-cli" >> "$GITHUB_PATH"
      - name: Run affected Connector integration suites
        run: |
          ./dexcli dev -dex-port 18801 -web-port 18802 -open=false \
            -blob-store-dir /tmp/dex-connectors/blobs \
            -sqlite-db-filename /tmp/dex-connectors/dex.sqlite.db \
            -server-log-folder /tmp/dex-connectors/logs > /tmp/dex-connectors-server.log 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/18801) 2>/dev/null; then
              DEX_FLOW_SERVICE_ADDRESS=127.0.0.1:18801 make test-connector-integration
              exit
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          cat /tmp/dex-connectors-server.log
          exit 1

  dex-compat-current:
    needs: connector-plan
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-dex-compat-current

  dex-compat-released:
    needs: connector-plan
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEX_CLI_VERSION: latest
      CONNECTOR_SCOPE: all
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-dex-compat-released

  dex-compat-canary-issue:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: dex-compat-released
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Update latest Dex compatibility issue
        uses: actions/github-script@v8
        env:
          CANARY_RESULT: ${{ needs.dex-compat-released.result }}
        with:
          script: |
            const marker = "<!-- dex-compat-latest-canary -->";
            const issueTitle = "Dex compatibility canary: latest stable release";
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "all",
              per_page: 100,
            });
            const issue = issues.find((candidate) =>
              !candidate.pull_request &&
              candidate.title === issueTitle &&
              candidate.body?.includes(marker)
            );
            if (process.env.CANARY_RESULT === "success") {
              if (issue?.state === "open") {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `Recovered in [scheduled run ${context.runId}](${runURL}).`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }
            const label = "dex-compatibility";
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "B60205",
                description: "Dex CLI and Web compatibility failures",
              });
            }
            const body = [
              marker,
              "The scheduled compatibility canary against the latest stable Dex CLI and Web failed.",
              "",
              `- Latest failed run: [${context.runId}](${runURL})`,
              `- Connector commit: ${context.sha}`,
              `- Result: ${process.env.CANARY_RESULT}`,
              "",
              "Inspect the failed shard for the resolved Dex tag, connector tag, source commit, and artifact digest. Fix current source, publish a new connector release when required, then rerun the canary. This issue closes automatically after a successful scheduled run.",
            ].join("\n");
            if (issue) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [label] });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, title: issueTitle, body, state: "open" });
            } else {
              await github.rest.issues.create({ ...context.repo, title: issueTitle, body, labels: [label] });
            }

  react:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/react/package-lock.json
      - run: make react-sdk

  site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
