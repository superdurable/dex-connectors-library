name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      common_sdkgo: ${{ steps.plan.outputs.common_sdkgo }}
      common_root_go: ${{ steps.plan.outputs.common_root_go }}
      common_python_scripts: ${{ steps.plan.outputs.common_python_scripts }}
      common_typescript_conformance: ${{ steps.plan.outputs.common_typescript_conformance }}
      sdkpython: ${{ steps.plan.outputs.sdkpython }}
      sdkts: ${{ steps.plan.outputs.sdkts }}
      sdkgo_integration: ${{ steps.plan.outputs.sdkgo_integration }}
      react: ${{ steps.plan.outputs.react }}
      site: ${{ steps.plan.outputs.site }}
      connectors_mcp: ${{ steps.plan.outputs.connectors_mcp }}
      # Connector jobs read the resolved scope and base, which fall back to all when the base is unknown.
      connector_scope: ${{ steps.plan.outputs.connector_scope }}
      connector_base: ${{ steps.plan.outputs.connector_base }}
    env:
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - name: Plan affected Connector shards
        id: plan
        run: |
          make catalog-check
          scope="${CONNECTOR_SCOPE}"
          base="${CONNECTOR_BASE}"
          if [ "${scope}" = changed ] && ! { [ -n "${base}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null &&
            git merge-base "${base}" "${CONNECTOR_HEAD}" > /dev/null 2>&1; }; then
            # Prefer the merge base with main, so the diff stays known; a head already on main tests everything.
            git rev-parse --verify -q origin/main > /dev/null ||
              git fetch -q --no-tags origin main:refs/remotes/origin/main 2> /dev/null || true
            main_base="$(git merge-base "${CONNECTOR_HEAD}" origin/main 2> /dev/null || true)"
            if [ -n "${main_base}" ] && [ "${main_base}" != "$(git rev-parse "${CONNECTOR_HEAD}")" ]; then
              echo "::warning title=Unknown base commit::Cannot resolve base '${base}'; using the merge base with main, ${main_base}."
              base="${main_base}"
            else
              echo "::warning title=Unknown base commit::Cannot resolve base '${base}'; testing every connector and CI job."
              scope=all
              base=''
            fi
          fi
          arguments=(
            --catalog catalog.yaml
            --scope "${scope}"
            --head "${CONNECTOR_HEAD}"
            --max-shards 256
            --github-output "${GITHUB_OUTPUT}"
          )
          if [ "${scope}" = changed ]; then
            arguments+=(--base "${base}")
          fi
          GOWORK=off go run ./cmd/connectorctl test-matrix "${arguments[@]}"
          printf 'connector_scope=%s\nconnector_base=%s\n' "${scope}" "${base}" >> "${GITHUB_OUTPUT}"
      - name: Resolve release inventory once for connector validation
        if: steps.plan.outputs.count != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/release/github_release_inventory.py --output "${RUNNER_TEMP}/release-inventory.json"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.count != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: ci-release-inventory
          path: ${{ runner.temp }}/release-inventory.json
          retention-days: 1

  dex-version-plan:
    needs: connector-plan
    if: needs.connector-plan.outputs.count != '0' || needs.connector-plan.outputs.sdkpython == 'true' || needs.connector-plan.outputs.sdkts == 'true' || needs.connector-plan.outputs.sdkgo_integration == 'true' || needs.connector-plan.outputs.connectors_mcp == 'true'
    runs-on: ubuntu-latest
    outputs:
      cli_tag: ${{ steps.versions.outputs.cli_tag }}
      cli_asset_url: ${{ steps.versions.outputs.cli_asset_url }}
      cli_sha256: ${{ steps.versions.outputs.cli_sha256 }}
      go_sdk_version: ${{ steps.versions.outputs.go_sdk_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - name: Resolve Dex versions once for this run
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/dex_compatibility.py plan --github-output "${GITHUB_OUTPUT}"

  # Repository-wide checks read every source file and manifest, so they run on every event and change.
  common-repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Go's test cache keys opened files by mtime; content-derived times let main's results apply.
      - name: Derive tracked file times from Git object IDs
        run: python3 script/set_mtimes_from_git_objects.py
      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: false
      # Every main run saves a new entry, so pull requests restore main's newest build and test results.
      - name: Restore the Go build, test, and module caches from main
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: common-repository-checks-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            common-repository-checks-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            common-repository-checks-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-
      # Scheduled and manual runs rerun every test; they keep only the build and module caches.
      - name: Drop cached test results for scheduled and manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: go clean -testcache
      - run: make test-common-repository-checks
      - name: Save the Go caches for later runs
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  common-sdkgo:
    needs: connector-plan
    if: needs.connector-plan.outputs.common_sdkgo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Go's test cache keys opened files by mtime; content-derived times let main's results apply.
      - name: Derive tracked file times from Git object IDs
        run: python3 script/set_mtimes_from_git_objects.py
      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: false
      # Every main run saves a new entry, so pull requests restore main's newest build and test results.
      - name: Restore the Go build, test, and module caches from main
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: common-sdkgo-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('sdkgo/go.sum') }}-${{ github.sha }}
          restore-keys: |
            common-sdkgo-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('sdkgo/go.sum') }}-
            common-sdkgo-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-
      # Scheduled and manual runs rerun every test; they keep only the build and module caches.
      - name: Drop cached test results for scheduled and manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: go clean -testcache
      - run: make test-common-sdkgo
      - name: Save the Go caches for later runs
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  common-root-go:
    needs: connector-plan
    if: needs.connector-plan.outputs.common_root_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            connectors/stripe/typescript/package-lock.json
            connectors/google/gmail/typescript/package-lock.json
      # Go's test cache keys opened files by mtime; content-derived times let main's results apply.
      - name: Derive tracked file times from Git object IDs
        run: python3 script/set_mtimes_from_git_objects.py
      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: false
      # Every main run saves a new entry, so pull requests restore main's newest build and test results.
      - name: Restore the Go build, test, and module caches from main
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: common-root-go-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'sdkgo/go.sum') }}-${{ github.sha }}
          restore-keys: |
            common-root-go-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'sdkgo/go.sum') }}-
            common-root-go-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-
      # Scheduled and manual runs rerun every test; they keep only the build and module caches.
      - name: Drop cached test results for scheduled and manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: go clean -testcache
      - run: make test-common-root-go
      - name: Save the Go caches for later runs
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  common-python-scripts:
    needs: connector-plan
    if: needs.connector-plan.outputs.common_python_scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # go_download_retry_test.py runs go, and the tests expect the same toolchains as the other jobs.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-common-python-scripts

  common-typescript-conformance:
    needs: connector-plan
    if: needs.connector-plan.outputs.common_typescript_conformance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: connectors/stripe/typescript/package-lock.json
      - run: make test-common-typescript-conformance

  sdkpython:
    needs: connector-plan
    if: needs.connector-plan.outputs.sdkpython == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: make test-sdkpython

  sdkpython-integration:
    needs: [connector-plan, dex-version-plan]
    if: github.event_name != 'schedule' && github.event_name != 'pull_request' && needs.connector-plan.outputs.sdkpython == 'true'
    runs-on: ubuntu-latest
    env:
      DEX_CLI_RELEASE_TAG: ${{ needs.dex-version-plan.outputs.cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.dex-version-plan.outputs.cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.dex-version-plan.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install Dex CLI from the run's resolved release
        run: python3 script/dex_compatibility.py install-dexcli --output .bin/dexcli
      - name: Run Python SDK against real Dex Flows
        run: |
          uv sync --locked --project sdkpython
          mkdir -p sdkpython/.dexcli-data/logs
          .bin/dexcli dev -dex-port 19881 -web-port 19882 -open=false -durability process-crash-safe \
            -zd-data-dir sdkpython/.dexcli-data/zd \
            -server-log-folder sdkpython/.dexcli-data/logs > sdkpython/.dexcli-data/server.log 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true; wait "$dex_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/19881) 2>/dev/null; then
              make test-sdkpython-integration
              exit
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          cat sdkpython/.dexcli-data/server.log
          exit 1

  sdkts:
    needs: connector-plan
    if: needs.connector-plan.outputs.sdkts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-sdkts

  sdkts-integration:
    needs: [connector-plan, dex-version-plan]
    if: github.event_name != 'schedule' && github.event_name != 'pull_request' && needs.connector-plan.outputs.sdkts == 'true'
    runs-on: ubuntu-latest
    env:
      DEX_CLI_RELEASE_TAG: ${{ needs.dex-version-plan.outputs.cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.dex-version-plan.outputs.cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.dex-version-plan.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dex CLI from the run's resolved release
        run: python3 script/dex_compatibility.py install-dexcli --output .bin/dexcli
      - name: Run TypeScript SDK against real Dex Flows
        run: |
          npm ci --prefix sdkts
          mkdir -p "$RUNNER_TEMP/sdkts-dex/logs"
          .bin/dexcli dev -dex-port 19891 -web-port 19892 -open=false -durability process-crash-safe \
            -zd-data-dir "$RUNNER_TEMP/sdkts-dex/zd" \
            -server-log-folder "$RUNNER_TEMP/sdkts-dex/logs" > "$RUNNER_TEMP/sdkts-dex/server.log" 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true; wait "$dex_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/19891) 2>/dev/null; then
              DEX_SERVER_ADDRESS=127.0.0.1:19891 npm run test:integration --prefix sdkts
              exit
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/sdkts-dex/server.log"
          exit 1

  language-connectors:
    needs: connector-plan
    if: needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_RELEASE_INVENTORY_PATH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '/tmp/release-inventory.json' || '' }}
      CONNECTOR_SCOPE: ${{ needs.connector-plan.outputs.connector_scope }}
      CONNECTOR_BASE: ${{ needs.connector-plan.outputs.connector_base }}
      CONNECTOR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: ci-release-inventory
          path: /tmp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-python-connectors test-typescript-connectors

  # Package tests (up to about 61 minutes) and replay (up to about 39) run in parallel so the
  # 120-minute merge queue waits for the longer one. The hours-long mutation self-test never runs there.
  connector-conformance:
    needs: connector-plan
    if: needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    env:
      CONNECTOR_SCOPE: ${{ needs.connector-plan.outputs.connector_scope }}
      CONNECTOR_BASE: ${{ needs.connector-plan.outputs.connector_base }}
      CONNECTOR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Replay Go-verified scenarios for every selected connector
        run: make test-connector-conformance
      - name: Prove connector conformance runners reject fixture mutations
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 script/connector_conformance.py --mutation-self-test

  python-connectors-latest-sdk:
    # Floor-range Python packages also pass against the newest sdkpython source; their uv.lock tests the floor.
    needs: connector-plan
    if: needs.connector-plan.outputs.count != '0' || needs.connector-plan.outputs.sdkpython == 'true'
    runs-on: ubuntu-latest
    env:
      # A Python SDK change, schedule, or manual run checks every package; other runs check affected connectors.
      CONNECTOR_SCOPE: ${{ needs.connector-plan.outputs.sdkpython != 'true' && needs.connector-plan.outputs.connector_scope || 'all' }}
      CONNECTOR_BASE: ${{ needs.connector-plan.outputs.connector_base }}
      CONNECTOR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: astral-sh/setup-uv@v7
      - run: make test-python-connectors-latest-sdk

  database-language-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select exempt database packages
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: |
          args=(--database-ci-matrix)
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            args+=(--base "$BASE_SHA")
          fi
          matrix="$(python3 script/connector_conformance.py "${args[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  database-language-integration:
    needs: database-language-plan
    if: github.event_name != 'pull_request' && needs.database-language-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.database-language-plan.outputs.matrix) }}
    services:
      database:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        env:
          POSTGRES_PASSWORD: connector_test
          POSTGRES_DB: connector_test
          MYSQL_ROOT_PASSWORD: connector_test
          MYSQL_DATABASE: connector_test
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Connector_test_123!
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run native-driver integration suites
        env:
          CONNECTOR: ${{ matrix.connector }}
          DATABASE_PORT: ${{ matrix.port }}
        run: |
          for _ in $(seq 1 120); do
            if [ "$CONNECTOR" = connectors/postgresql ]; then
              if docker exec "${{ job.services.database.id }}" pg_isready -h 127.0.0.1 -p 5432 -U postgres -d connector_test >/dev/null 2>&1; then break; fi
            elif [ "$CONNECTOR" = connectors/mongodb ]; then
              if docker exec "${{ job.services.database.id }}" mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -qx 1; then break; fi
            elif (echo > /dev/tcp/127.0.0.1/"$DATABASE_PORT") 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$CONNECTOR" = connectors/postgresql ]; then
            docker exec "${{ job.services.database.id }}" pg_isready -h 127.0.0.1 -p 5432 -U postgres -d connector_test
          elif [ "$CONNECTOR" = connectors/mongodb ]; then
            docker exec "${{ job.services.database.id }}" mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -qx 1
          else
            (echo > /dev/tcp/127.0.0.1/"$DATABASE_PORT") 2>/dev/null
          fi
          case "$CONNECTOR" in
            connectors/postgresql)
              export POSTGRESQL_CONNECTOR_TEST_HOST=127.0.0.1 POSTGRESQL_CONNECTOR_TEST_PORT=5432
              export POSTGRESQL_CONNECTOR_TEST_DATABASE=connector_test POSTGRESQL_CONNECTOR_TEST_USER=postgres
              export POSTGRESQL_CONNECTOR_TEST_PASSWORD=connector_test POSTGRESQL_CONNECTOR_TEST_SSL_MODE=disable
              ;;
            connectors/mysql)
              export MYSQL_CONNECTOR_TEST_HOST=127.0.0.1 MYSQL_CONNECTOR_TEST_PORT=3306
              export MYSQL_CONNECTOR_TEST_DATABASE=connector_test MYSQL_CONNECTOR_TEST_USER=root
              export MYSQL_CONNECTOR_TEST_PASSWORD=connector_test MYSQL_CONNECTOR_TEST_SSL_MODE=disabled
              for _ in $(seq 1 90); do
                if docker exec '${{ job.services.database.id }}' mysqladmin ping -h127.0.0.1 --protocol=tcp -uroot -pconnector_test --silent; then break; fi
                sleep 1
              done
              docker exec '${{ job.services.database.id }}' mysqladmin ping -h127.0.0.1 --protocol=tcp -uroot -pconnector_test --silent
              docker cp '${{ job.services.database.id }}:/var/lib/mysql/ca.pem' "$RUNNER_TEMP/mysql-ca.pem"
              export MYSQL_TLS_CA_FILE="$RUNNER_TEMP/mysql-ca.pem" MYSQL_SSL_CA="$RUNNER_TEMP/mysql-ca.pem"
              ;;
            connectors/mongodb)
              export MONGODB_CONNECTOR_TEST_URI=mongodb://127.0.0.1:27017
              ;;
            connectors/microsoft/sql-server)
              export SQLSERVER_CONNECTOR_TEST_HOST=127.0.0.1 SQLSERVER_CONNECTOR_TEST_PORT=1433
              export SQLSERVER_CONNECTOR_TEST_DATABASE=master SQLSERVER_CONNECTOR_TEST_USER=sa
              export SQLSERVER_CONNECTOR_TEST_PASSWORD='Connector_test_123!' SQLSERVER_CONNECTOR_TEST_ENCRYPT=disable
              ;;
          esac
          if [ -f "$CONNECTOR/python/pyproject.toml" ]; then
            test -d "$CONNECTOR/python/tests/integration"
            uv sync --locked --project "$CONNECTOR/python"
            uv run --project "$CONNECTOR/python" pytest "$CONNECTOR/python/tests/integration"
          fi
          if [ -f "$CONNECTOR/typescript/package.json" ]; then
            test -f "$CONNECTOR/typescript/test/integration.test.ts"
            npm ci --prefix "$CONNECTOR/typescript"
            npm run build --prefix "$CONNECTOR/typescript"
            "$CONNECTOR/typescript/node_modules/.bin/vitest" run test/integration.test.ts --root "$CONNECTOR/typescript"
          fi
          if [ "$CONNECTOR" = connectors/microsoft/sql-server ]; then
            tls_directory="$(mktemp -d)"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -keyout "$tls_directory/server.key" -out "$tls_directory/server.crt" \
              -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
              -addext 'extendedKeyUsage=serverAuth'
            database_container='${{ job.services.database.id }}'
            docker cp "$tls_directory/server.key" "$database_container:/var/opt/mssql/connector-server.key"
            docker cp "$tls_directory/server.crt" "$database_container:/var/opt/mssql/connector-server.crt"
            docker exec -u root "$database_container" chown mssql:mssql /var/opt/mssql/connector-server.key /var/opt/mssql/connector-server.crt
            docker exec -u root "$database_container" chmod 600 /var/opt/mssql/connector-server.key
            docker exec -u root "$database_container" /opt/mssql/bin/mssql-conf set network.tlscert /var/opt/mssql/connector-server.crt
            docker exec -u root "$database_container" /opt/mssql/bin/mssql-conf set network.tlskey /var/opt/mssql/connector-server.key
            docker exec -u root "$database_container" /opt/mssql/bin/mssql-conf set network.forceencryption 1
            docker restart "$database_container"
            login_ready=false
            for _ in $(seq 1 120); do
              if docker exec "$database_container" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SQLSERVER_CONNECTOR_TEST_PASSWORD" -Q 'SELECT 1' >/dev/null 2>&1; then
                login_ready=true
                break
              fi
              sleep 1
            done
            test "$login_ready" = true
            export SQLSERVER_CONNECTOR_TEST_ENCRYPT=mandatory
            export SQLSERVER_TLS_CA_FILE="$tls_directory/server.crt" SQLSERVER_TLS_HOST=127.0.0.1
            export SQLSERVER_SSL_CA="$SQLSERVER_TLS_CA_FILE"
            if [ -f "$CONNECTOR/python/pyproject.toml" ]; then
              uv run --project "$CONNECTOR/python" pytest "$CONNECTOR/python/tests/integration"
            fi
            if [ -f "$CONNECTOR/typescript/package.json" ]; then
              "$CONNECTOR/typescript/node_modules/.bin/vitest" run test/integration.test.ts --root "$CONNECTOR/typescript"
            fi
          fi

  email-language-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select exempt email packages
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: |
          args=(--email-ci-matrix)
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            args+=(--base "$BASE_SHA")
          fi
          matrix="$(python3 script/connector_conformance.py "${args[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  email-language-integration:
    needs: email-language-plan
    if: github.event_name != 'pull_request' && needs.email-language-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.email-language-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create trusted GreenMail certificate and start server
        run: |
          certificate_directory="$RUNNER_TEMP/email-certificates"
          mkdir -p "$certificate_directory"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=Dex email integration CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$certificate_directory/ca.key" -out "$certificate_directory/ca.crt"
          openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' \
            -keyout "$certificate_directory/server.key" -out "$certificate_directory/server.csr"
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\nextendedKeyUsage=serverAuth\n' > "$certificate_directory/server.ext"
          openssl x509 -req -days 1 -in "$certificate_directory/server.csr" \
            -CA "$certificate_directory/ca.crt" -CAkey "$certificate_directory/ca.key" \
            -CAcreateserial -extfile "$certificate_directory/server.ext" \
            -out "$certificate_directory/server.crt"
          openssl pkcs12 -export -inkey "$certificate_directory/server.key" \
            -in "$certificate_directory/server.crt" -certfile "$certificate_directory/ca.crt" \
            -out "$certificate_directory/greenmail.p12" -passout pass:changeit
          chmod 644 "$certificate_directory/greenmail.p12"
          echo "EMAIL_CONNECTOR_TEST_CA_CERT=$certificate_directory/ca.crt" >> "$GITHUB_ENV"
          docker run -d --name greenmail-email-integration \
            -p 3025:3025 -p 3143:3143 -p 3465:3465 -p 3993:3993 \
            -v "$certificate_directory/greenmail.p12:/certs/greenmail.p12:ro" \
            -e 'GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=connector:connector_test@example.com -Dgreenmail.tls.keystore.file=/certs/greenmail.p12 -Dgreenmail.tls.keystore.password=changeit' \
            greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
      - name: Run SMTP and IMAP integration suites
        env:
          CONNECTOR: ${{ matrix.connector }}
          EMAIL_CONNECTOR_TEST_SMTP_HOST: 127.0.0.1
          EMAIL_CONNECTOR_TEST_SMTP_PORT: '3025'
          EMAIL_CONNECTOR_TEST_SMTPS_PORT: '3465'
          EMAIL_CONNECTOR_TEST_IMAP_HOST: 127.0.0.1
          EMAIL_CONNECTOR_TEST_IMAP_PORT: '3143'
          EMAIL_CONNECTOR_TEST_IMAPS_PORT: '3993'
          EMAIL_CONNECTOR_TEST_USERNAME: connector
          EMAIL_CONNECTOR_TEST_PASSWORD: connector_test
          EMAIL_CONNECTOR_TEST_ADDRESS: connector@example.com
        run: |
          for protocol in smtp imap; do
            if [ "$protocol" = smtp ]; then
              port="$EMAIL_CONNECTOR_TEST_SMTP_PORT"
            else
              port="$EMAIL_CONNECTOR_TEST_IMAP_PORT"
            fi
            ready=false
            for _ in $(seq 1 120); do
              if exec 3<>/dev/tcp/127.0.0.1/"$port" 2>/dev/null; then
                if read -r -t 5 greeting <&3; then
                  if { [ "$protocol" = smtp ] && [[ "$greeting" == 220* ]]; } ||
                     { [ "$protocol" = imap ] && [[ "$greeting" == '* OK'* ]]; }; then
                    ready=true
                  fi
                fi
                if [ "$ready" = true ]; then
                  exec 3<&- 3>&-
                  break
                fi
                exec 3<&- 3>&-
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs greenmail-email-integration
              exit 1
            fi
          done
          for port in "$EMAIL_CONNECTOR_TEST_SMTPS_PORT" "$EMAIL_CONNECTOR_TEST_IMAPS_PORT"; do
            ready=false
            for _ in $(seq 1 120); do
              if timeout 5 openssl s_client -connect "127.0.0.1:$port" \
                -CAfile "$EMAIL_CONNECTOR_TEST_CA_CERT" -verify_return_error \
                -verify_ip 127.0.0.1 < /dev/null > /dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs greenmail-email-integration
              exit 1
            fi
          done
          if [ -f "$CONNECTOR/python/pyproject.toml" ]; then
            test -d "$CONNECTOR/python/tests/integration"
            uv sync --locked --project "$CONNECTOR/python"
            uv run --project "$CONNECTOR/python" pytest "$CONNECTOR/python/tests/integration"
          fi
          if [ -f "$CONNECTOR/typescript/package.json" ]; then
            test -f "$CONNECTOR/typescript/test/integration.test.ts"
            npm ci --prefix "$CONNECTOR/typescript"
            npm run build --prefix "$CONNECTOR/typescript"
            "$CONNECTOR/typescript/node_modules/.bin/vitest" run test/integration.test.ts --root "$CONNECTOR/typescript"
          fi

  connectors:
    needs: connector-plan
    if: needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      CONNECTOR_SCOPE: ${{ needs.connector-plan.outputs.connector_scope }}
      CONNECTOR_BASE: ${{ needs.connector-plan.outputs.connector_base }}
      CONNECTOR_HEAD: ${{ github.sha }}
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
      # make test-connectors checks each affected connector's published SDK and connector dependencies.
      GH_TOKEN: ${{ github.token }}
      GH_RELEASE_INVENTORY_PATH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '/tmp/release-inventory.json' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: ci-release-inventory
          path: /tmp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/react/package-lock.json
            connectors/**/ui/package-lock.json
      - name: Test affected standalone Connector modules
        run: make test-connectors studio-bundle-theme react-connectors

  workspace-connector-dependents:
    # Advisory: a dependency PR cannot also update its dependents under the one-released-module rule.
    needs: connector-plan
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CONNECTOR_SCOPE: ${{ needs.connector-plan.outputs.connector_scope }}
      CONNECTOR_BASE: ${{ needs.connector-plan.outputs.connector_base }}
      CONNECTOR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: false
          token: ''
          cache: true
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            connectors/**/go/go.sum
      - name: Generate the ignored go.work
        run: make workspace
      - name: Test connectors that require other connectors against workspace source
        run: |
          arguments=(--catalog catalog.yaml --scope "${CONNECTOR_SCOPE}" --head "${CONNECTOR_HEAD}" --shard-index 0 --shard-count 1)
          if [ "${CONNECTOR_SCOPE}" = changed ]; then arguments+=(--base "${CONNECTOR_BASE}"); fi
          selected_directories="$(GOWORK=off go run ./cmd/connectorctl test-matrix "${arguments[@]}")"
          failed=false
          while IFS= read -r directory; do
            [ -n "${directory}" ] || continue
            module="${directory}/go"
            if ! go mod edit -json "${module}/go.mod" | jq -e \
              --arg prefix github.com/superdurable/dex-connectors-library/connectors/ \
              'any(.Require[]?; .Path | startswith($prefix))' > /dev/null; then
              continue
            fi
            echo "Testing ${module} against workspace connector source"
            if ! (cd "${module}" && go vet ./... && go test ./...); then
              echo "::warning title=Workspace connector dependency::${module} fails against the current source of a connector it requires"
              failed=true
            fi
          done <<< "${selected_directories}"
          [ "${failed}" = false ]

  dex-integration-sdk:
    needs: [connector-plan, dex-version-plan]
    if: github.event_name != 'schedule' && github.event_name != 'pull_request' && needs.connector-plan.outputs.sdkgo_integration == 'true'
    runs-on: ubuntu-latest
    env:
