name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      common: ${{ steps.plan.outputs.common }}
      sdkpython: ${{ steps.plan.outputs.sdkpython }}
      sdkts: ${{ steps.plan.outputs.sdkts }}
      sdkgo_integration: ${{ steps.plan.outputs.sdkgo_integration }}
      react: ${{ steps.plan.outputs.react }}
      site: ${{ steps.plan.outputs.site }}
    env:
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - name: Plan affected Connector shards
        id: plan
        run: |
          make catalog-check
          arguments=(
            --catalog catalog.yaml
            --scope "${CONNECTOR_SCOPE}"
            --head "${CONNECTOR_HEAD}"
            --max-shards 256
            --github-output "${GITHUB_OUTPUT}"
          )
          if [ "${CONNECTOR_SCOPE}" = changed ]; then
            arguments+=(--base "${CONNECTOR_BASE}")
          fi
          GOWORK=off go run ./cmd/connectorctl test-matrix "${arguments[@]}"
      - name: Resolve release inventory once for connector validation
        if: steps.plan.outputs.count != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/release/github_release_inventory.py --output "${RUNNER_TEMP}/release-inventory.json"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.count != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: ci-release-inventory
          path: ${{ runner.temp }}/release-inventory.json
          retention-days: 1

  dex-version-plan:
    needs: connector-plan
    if: needs.connector-plan.outputs.count != '0' || needs.connector-plan.outputs.sdkpython == 'true' || needs.connector-plan.outputs.sdkts == 'true' || needs.connector-plan.outputs.sdkgo_integration == 'true'
    runs-on: ubuntu-latest
    outputs:
      cli_tag: ${{ steps.versions.outputs.cli_tag }}
      cli_asset_url: ${{ steps.versions.outputs.cli_asset_url }}
      cli_sha256: ${{ steps.versions.outputs.cli_sha256 }}
      go_sdk_version: ${{ steps.versions.outputs.go_sdk_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - name: Resolve Dex versions once for this run
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/dex_compatibility.py plan --github-output "${GITHUB_OUTPUT}"

  common:
    needs: connector-plan
    if: needs.connector-plan.outputs.common == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: true
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
      - run: make test-common

  sdkpython:
    needs: connector-plan
    if: needs.connector-plan.outputs.sdkpython == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: make test-sdkpython

  sdkpython-integration:
    needs: [connector-plan, dex-version-plan]
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.sdkpython == 'true'
    runs-on: ubuntu-latest
    env:
      DEX_CLI_RELEASE_TAG: ${{ needs.dex-version-plan.outputs.cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.dex-version-plan.outputs.cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.dex-version-plan.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install Dex CLI from the run's resolved release
        run: python3 script/dex_compatibility.py install-dexcli --output .bin/dexcli
      - name: Run Python SDK against real Dex Flows
        run: |
          uv sync --locked --project sdkpython
          mkdir -p sdkpython/.dexcli-data/logs
          .bin/dexcli dev -dex-port 19881 -web-port 19882 -open=false \
            -zd-data-dir sdkpython/.dexcli-data/zd \
            -server-log-folder sdkpython/.dexcli-data/logs > sdkpython/.dexcli-data/server.log 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true; wait "$dex_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/19881) 2>/dev/null; then
              make test-sdkpython-integration
              exit
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          cat sdkpython/.dexcli-data/server.log
          exit 1

  sdkts:
    needs: connector-plan
    if: needs.connector-plan.outputs.sdkts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-sdkts

  sdkts-integration:
    needs: [connector-plan, dex-version-plan]
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.sdkts == 'true'
    runs-on: ubuntu-latest
    env:
      DEX_CLI_RELEASE_TAG: ${{ needs.dex-version-plan.outputs.cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.dex-version-plan.outputs.cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.dex-version-plan.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dex CLI from the run's resolved release
        run: python3 script/dex_compatibility.py install-dexcli --output .bin/dexcli
      - name: Run TypeScript SDK against real Dex Flows
        run: |
          npm ci --prefix sdkts
          mkdir -p "$RUNNER_TEMP/sdkts-dex/logs"
          .bin/dexcli dev -dex-port 19891 -web-port 19892 -open=false \
            -zd-data-dir "$RUNNER_TEMP/sdkts-dex/zd" \
            -server-log-folder "$RUNNER_TEMP/sdkts-dex/logs" > "$RUNNER_TEMP/sdkts-dex/server.log" 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true; wait "$dex_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/19891) 2>/dev/null; then
              DEX_SERVER_ADDRESS=127.0.0.1:19891 npm run test:integration --prefix sdkts
              exit
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/sdkts-dex/server.log"
          exit 1

  language-connectors:
    needs: connector-plan
    if: needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_RELEASE_INVENTORY_PATH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '/tmp/release-inventory.json' || '' }}
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: ci-release-inventory
          path: /tmp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-python-connectors test-typescript-connectors
      - name: Replay Go-verified scenarios for directly changed connectors
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: make test-connector-conformance
      - name: Prove connector conformance runners reject fixture mutations
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python3 script/connector_conformance.py --mutation-self-test

  database-language-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select exempt database packages
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          args=(--database-ci-matrix)
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            args+=(--base "$BASE_SHA")
          fi
          matrix="$(python3 script/connector_conformance.py "${args[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  database-language-integration:
    needs: database-language-plan
    if: needs.database-language-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.database-language-plan.outputs.matrix) }}
    services:
      database:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        env:
          POSTGRES_PASSWORD: connector_test
          POSTGRES_DB: connector_test
          MYSQL_ROOT_PASSWORD: connector_test
          MYSQL_DATABASE: connector_test
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Connector_test_123!
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run native-driver integration suites
        env:
          CONNECTOR: ${{ matrix.connector }}
          DATABASE_PORT: ${{ matrix.port }}
        run: |
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/"$DATABASE_PORT") 2>/dev/null; then break; fi
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/"$DATABASE_PORT") 2>/dev/null
          case "$CONNECTOR" in
            connectors/postgresql)
              export POSTGRESQL_CONNECTOR_TEST_HOST=127.0.0.1 POSTGRESQL_CONNECTOR_TEST_PORT=5432
              export POSTGRESQL_CONNECTOR_TEST_DATABASE=connector_test POSTGRESQL_CONNECTOR_TEST_USER=postgres
              export POSTGRESQL_CONNECTOR_TEST_PASSWORD=connector_test POSTGRESQL_CONNECTOR_TEST_SSL_MODE=disable
              ;;
            connectors/mysql)
              export MYSQL_CONNECTOR_TEST_HOST=127.0.0.1 MYSQL_CONNECTOR_TEST_PORT=3306
              export MYSQL_CONNECTOR_TEST_DATABASE=connector_test MYSQL_CONNECTOR_TEST_USER=root
              export MYSQL_CONNECTOR_TEST_PASSWORD=connector_test MYSQL_CONNECTOR_TEST_SSL_MODE=disabled
              docker cp '${{ job.services.database.id }}:/var/lib/mysql/ca.pem' "$RUNNER_TEMP/mysql-ca.pem"
              export MYSQL_TLS_CA_FILE="$RUNNER_TEMP/mysql-ca.pem" MYSQL_SSL_CA="$RUNNER_TEMP/mysql-ca.pem"
              ;;
            connectors/microsoft/sql-server)
              export SQLSERVER_CONNECTOR_TEST_HOST=127.0.0.1 SQLSERVER_CONNECTOR_TEST_PORT=1433
              export SQLSERVER_CONNECTOR_TEST_DATABASE=master SQLSERVER_CONNECTOR_TEST_USER=sa
              export SQLSERVER_CONNECTOR_TEST_PASSWORD='Connector_test_123!' SQLSERVER_CONNECTOR_TEST_ENCRYPT=disable
              ;;
          esac
          if [ -f "$CONNECTOR/python/pyproject.toml" ]; then
            test -d "$CONNECTOR/python/tests/integration"
            uv sync --locked --project "$CONNECTOR/python"
            uv run --project "$CONNECTOR/python" pytest "$CONNECTOR/python/tests/integration"
          fi
          if [ -f "$CONNECTOR/typescript/package.json" ]; then
            test -f "$CONNECTOR/typescript/test/integration.test.ts"
            npm ci --prefix "$CONNECTOR/typescript"
            npm run build --prefix "$CONNECTOR/typescript"
            "$CONNECTOR/typescript/node_modules/.bin/vitest" run test/integration.test.ts --root "$CONNECTOR/typescript"
          fi

  connectors:
    needs: connector-plan
    if: needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
      # make test-connectors checks each affected connector's published SDK and connector dependencies.
      GH_TOKEN: ${{ github.token }}
      GH_RELEASE_INVENTORY_PATH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '/tmp/release-inventory.json' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: ci-release-inventory
          path: /tmp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/react/package-lock.json
            connectors/**/ui/package-lock.json
      - name: Test affected standalone Connector modules
        run: make test-connectors studio-bundle-theme react-connectors

  workspace-connector-dependents:
    # Advisory: a dependency PR cannot also update its dependents under the one-released-module rule.
    needs: connector-plan
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: true
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            connectors/**/go/go.sum
      - name: Generate the ignored go.work
        run: make workspace
      - name: Test connectors that require other connectors against workspace source
        run: |
          arguments=(--catalog catalog.yaml --scope "${CONNECTOR_SCOPE}" --head "${CONNECTOR_HEAD}" --shard-index 0 --shard-count 1)
          if [ "${CONNECTOR_SCOPE}" = changed ]; then arguments+=(--base "${CONNECTOR_BASE}"); fi
          selected_directories="$(GOWORK=off go run ./cmd/connectorctl test-matrix "${arguments[@]}")"
          failed=false
          while IFS= read -r directory; do
            [ -n "${directory}" ] || continue
            module="${directory}/go"
            if ! go mod edit -json "${module}/go.mod" | jq -e \
              --arg prefix github.com/superdurable/dex-connectors-library/connectors/ \
              'any(.Require[]?; .Path | startswith($prefix))' > /dev/null; then
              continue
            fi
            echo "Testing ${module} against workspace connector source"
            if ! (cd "${module}" && go vet ./... && go test ./...); then
              echo "::warning title=Workspace connector dependency::${module} fails against the current source of a connector it requires"
              failed=true
            fi
          done <<< "${selected_directories}"
          [ "${failed}" = false ]

  dex-integration-sdk:
    needs: [connector-plan, dex-version-plan]
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.sdkgo_integration == 'true'
    runs-on: ubuntu-latest
    env:
      DEX_CLI_RELEASE_TAG: ${{ needs.dex-version-plan.outputs.cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.dex-version-plan.outputs.cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.dex-version-plan.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: true
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
      - name: Download Dex CLI
        run: |
          python3 script/dex_compatibility.py install-dexcli --output ./dexcli
      - name: Run shared SDK integration suite
        run: |
          ./dexcli dev -dex-port 18801 -web-port 18802 -open=false \
            -zd-data-dir /tmp/dex-connectors/zd \
            -server-log-folder /tmp/dex-connectors/logs > /tmp/dex-connectors-server.log 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/18801) 2>/dev/null; then
              DEX_FLOW_SERVICE_ADDRESS=127.0.0.1:18801 make test-sdk-integration
              exit
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          cat /tmp/dex-connectors-server.log
          exit 1

  dex-integration-connectors:
    needs: [connector-plan, dex-version-plan]
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      DEX_CLI_RELEASE_TAG: ${{ needs.dex-version-plan.outputs.cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.dex-version-plan.outputs.cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.dex-version-plan.outputs.cli_sha256 }}
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: true
          cache-dependency-path: |
            go.sum
            connectors/**/go/go.sum
      - name: Download Dex CLI
        run: |
          python3 script/dex_compatibility.py install-dexcli --output ./dexcli
      - name: Run affected Connector integration suites
        run: |
          ./dexcli dev -dex-port 18801 -web-port 18802 -open=false \
            -zd-data-dir /tmp/dex-connectors/zd \
            -server-log-folder /tmp/dex-connectors/logs > /tmp/dex-connectors-server.log 2>&1 &
          dex_pid=$!
          trap 'kill "$dex_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/18801) 2>/dev/null; then
              DEX_FLOW_SERVICE_ADDRESS=127.0.0.1:18801 make test-connector-integration
              exit
            fi
            if ! kill -0 "$dex_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          cat /tmp/dex-connectors-server.log
          exit 1

  dex-compat-current:
    needs: [connector-plan, dex-version-plan]
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      DEX_CLI_RELEASE_TAG: ${{ needs.dex-version-plan.outputs.cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.dex-version-plan.outputs.cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.dex-version-plan.outputs.cli_sha256 }}
      GH_TOKEN: ${{ github.token }}
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-dex-compat-current

  dex-compat-released:
    needs: [connector-plan, dex-version-plan]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      GH_RELEASE_INVENTORY_PATH: /tmp/release-inventory.json
      DEX_CLI_RELEASE_TAG: ${{ needs.dex-version-plan.outputs.cli_tag }}
      DEX_CLI_ASSET_URL: ${{ needs.dex-version-plan.outputs.cli_asset_url }}
      DEX_CLI_SHA256: ${{ needs.dex-version-plan.outputs.cli_sha256 }}
      GH_TOKEN: ${{ github.token }}
      CONNECTOR_SCOPE: all
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: ci-release-inventory
          path: /tmp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: make test-dex-compat-released

  dex-compat-latest-go-sdk:
    needs: [connector-plan, dex-version-plan]
    if: needs.connector-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.connector-plan.outputs.matrix) }}
    env:
      DEX_GO_SDK_VERSION: ${{ needs.dex-version-plan.outputs.go_sdk_version }}
      CONNECTOR_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changed' || 'all' }}
      CONNECTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      CONNECTOR_HEAD: ${{ github.sha }}
      CONNECTOR_SHARD_INDEX: ${{ matrix.shard_index }}
      CONNECTOR_SHARD_COUNT: ${{ matrix.shard_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          check-latest: false
          token: ''
          cache: true
          cache-dependency-path: |
            go.sum
            sdkgo/go.sum
            connectors/**/go/go.sum
      - name: Build and vet the Connector SDK and affected connectors with the latest stable Dex Go SDK
        run: make test-dex-compat-latest-go-sdk

  dex-compat-canary-issue:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [dex-compat-released, dex-compat-latest-go-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Update latest Dex compatibility issue
        uses: actions/github-script@v8
        env:
          RELEASED_CANARY_RESULT: ${{ needs.dex-compat-released.result }}
          LATEST_GO_SDK_CANARY_RESULT: ${{ needs.dex-compat-latest-go-sdk.result }}
        with:
          script: |
            const marker = "<!-- dex-compat-latest-canary -->";
            const issueTitle = "Dex compatibility canary: latest stable release";
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "all",
              per_page: 100,
            });
            const issue = issues.find((candidate) =>
              !candidate.pull_request &&
              candidate.title === issueTitle &&
              candidate.body?.includes(marker)
            );
            const canaryResults = [
              ["Released connectors with the latest stable Dex CLI and Web", process.env.RELEASED_CANARY_RESULT],
              ["Connector SDK and connector source with the latest stable Dex Go SDK", process.env.LATEST_GO_SDK_CANARY_RESULT],
            ];
            if (canaryResults.every(([, result]) => result === "success")) {
              if (issue?.state === "open") {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: `Recovered in [scheduled run ${context.runId}](${runURL}).`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }
            const label = "dex-compatibility";
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "B60205",
                description: "Dex CLI, Web, and Go SDK compatibility failures",
              });
            }
            const body = [
              marker,
              "The scheduled compatibility canary against the latest stable Dex CLI, Web, or Go SDK failed.",
              "",
              `- Latest failed run: [${context.runId}](${runURL})`,
              `- Connector commit: ${context.sha}`,
              ...canaryResults.map(([check, result]) => `- ${check}: ${result}`),
              "",
              "Inspect the failed shard for the resolved Dex tag or Dex Go SDK version, connector tag, source commit, and artifact digest. Fix current source, publish a new SDK or connector release when required, then rerun the canary. This issue closes automatically after a successful scheduled run.",
            ].join("\n");
            if (issue) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [label] });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, title: issueTitle, body, state: "open" });
            } else {
              await github.rest.issues.create({ ...context.repo, title: issueTitle, body, labels: [label] });
            }

  react:
    needs: connector-plan
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.react == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/react/package-lock.json
      - run: make react-sdk

  site:
    needs: connector-plan
    if: github.event_name != 'schedule' && needs.connector-plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site

  ci-summary:
    if: always()
    needs:
      - connector-plan
      - dex-version-plan
      - common
      - sdkpython
      - sdkpython-integration
      - sdkts
      - sdkts-integration
      - language-connectors
      - connectors
      - workspace-connector-dependents
      - dex-integration-sdk
      - dex-integration-connectors
      - dex-compat-current
      - dex-compat-released
      - dex-compat-latest-go-sdk
      - dex-compat-canary-issue
      - react
      - site
    runs-on: ubuntu-latest
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
      PLAN_COUNT: ${{ needs.connector-plan.outputs.count }}
      RUN_COMMON: ${{ needs.connector-plan.outputs.common }}
      RUN_SDKPYTHON: ${{ needs.connector-plan.outputs.sdkpython }}
      RUN_SDKTS: ${{ needs.connector-plan.outputs.sdkts }}
      RUN_SDKGO_INTEGRATION: ${{ needs.connector-plan.outputs.sdkgo_integration }}
      RUN_REACT: ${{ needs.connector-plan.outputs.react }}
      RUN_SITE: ${{ needs.connector-plan.outputs.site }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require every selected CI job to pass
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = {name: job['result'] for name, job in json.loads(os.environ['JOB_RESULTS']).items()}
          failed = {name: result for name, result in results.items() if name != 'workspace-connector-dependents' and result in ('failure', 'cancelled')}
          expected = {'connector-plan'}
          event_name = os.environ['EVENT_NAME']
          connector_count = int(os.environ.get('PLAN_COUNT') or '0')
          for output, jobs in {
              'RUN_COMMON': ('common',),
              'RUN_SDKPYTHON': ('sdkpython',),
              'RUN_SDKTS': ('sdkts',),
              'RUN_SDKGO_INTEGRATION': ('dex-integration-sdk',),
              'RUN_REACT': ('react',),
              'RUN_SITE': ('site',),
          }.items():
              if os.environ[output] == 'true':
                  if event_name != 'schedule' or output not in ('RUN_SDKGO_INTEGRATION', 'RUN_REACT', 'RUN_SITE'):
                      expected.update(jobs)
          if event_name != 'schedule' and os.environ['RUN_SDKPYTHON'] == 'true':
              expected.add('sdkpython-integration')
          if event_name != 'schedule' and os.environ['RUN_SDKTS'] == 'true':
              expected.add('sdkts-integration')
          if connector_count or os.environ['RUN_SDKPYTHON'] == 'true' or os.environ['RUN_SDKTS'] == 'true' or os.environ['RUN_SDKGO_INTEGRATION'] == 'true':
              expected.add('dex-version-plan')
          if connector_count:
              expected.update(('language-connectors', 'connectors', 'dex-compat-latest-go-sdk'))
              if event_name != 'schedule':
                  expected.update(('dex-integration-connectors', 'dex-compat-current'))
              if event_name in ('schedule', 'workflow_dispatch'):
                  expected.add('dex-compat-released')
          if event_name == 'schedule':
              expected.add('dex-compat-canary-issue')
          for name in expected:
              if results[name] != 'success':
                  failed[name] = results[name]
          if failed:
              for name, result in sorted(failed.items()):
                  print(f'{name}: {result}', file=sys.stderr)
              sys.exit(1)
          print('All selected CI jobs passed; unselected jobs were skipped.')
          PY
