name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go run ./cmd/connectorctl validate connectors/http/connector.yaml connectors/openai/connector.yaml
      - run: go run ./cmd/connectorctl catalog connectors

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/react
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
