name: Release Connector TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: minor
        type: choice
        options: [minor, patch, major]
      repair_version:
        description: Existing tag version (vX.Y.Z) to repair without creating a new tag
        required: false
        type: string
      dry_run:
        description: Build and verify without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-connector-typescript-sdk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    env:
      BUMP: ${{ inputs.bump }}
      REPAIR_VERSION: ${{ inputs.repair_version }}
      PACKAGE_NAME: '@superdurable/connectors-sdk'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Plan SDK release or repair
        id: plan
        run: |
          arguments=(--component-path sdkts --tag-prefix sdkts/ --ref "${GITHUB_REF}" \
            --json-output "${RUNNER_TEMP}/sdk-plan.json" --github-output "${GITHUB_OUTPUT}")
          if [ -n "${REPAIR_VERSION}" ]; then
            arguments+=(--version "${REPAIR_VERSION}")
          else
            arguments+=(--bump "${BUMP}")
          fi
          python3 script/release/component_release.py plan "${arguments[@]}"
          cp script/release/component_release.py "${RUNNER_TEMP}/component_release.py"
      - name: Restore tagged SDK source for repair
        if: inputs.repair_version != ''
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: git checkout --detach "${SOURCE_SHA}"
      - name: Test and build SDK
        run: |
          test -f sdkts/package.json && test -f sdkts/package-lock.json || { echo 'TypeScript SDK package or lockfile is missing' >&2; exit 1; }
          npm ci --prefix sdkts
          npm run typecheck --prefix sdkts
          npm run lint --prefix sdkts
          npm test --prefix sdkts
          npm run build --prefix sdkts
          mkdir -p "${RUNNER_TEMP}/sdk-dist"
          npm pack ./sdkts --pack-destination "${RUNNER_TEMP}/sdk-dist"
      - name: Build release notes and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/sdk-release"
          python3 "${RUNNER_TEMP}/component_release.py" notes \
            --plan "${RUNNER_TEMP}/sdk-plan.json" --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/sdk-release/notes.md"
          assets=("${RUNNER_TEMP}"/sdk-dist/*)
          manifest_args=()
          for asset in "${assets[@]}"; do manifest_args+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" language-manifest \
            --output "${RUNNER_TEMP}/sdk-dist/language-release.json" --language typescript \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" --source-sha "${SOURCE_SHA}" "${manifest_args[@]}"
          cp -a "${RUNNER_TEMP}/sdk-dist" "${RUNNER_TEMP}/sdk-release/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-release
          path: ${{ runner.temp }}/sdk-release
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      PACKAGE_NAME: '@superdurable/connectors-sdk'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: sdk-release
          path: ${{ runner.temp }}/sdk-release
      - name: Verify package archives before publication
        run: |
          assets=("${RUNNER_TEMP}"/sdk-release/dist/*.tgz)
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 script/release/component_release.py verify-language-artifacts \
            --language typescript --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" "${arguments[@]}"
      - name: Create or repair SDK release
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${RUNNER_TEMP}"/sdk-release/dist/*
          else
            gh release create "${RELEASE_TAG}" --target "${SOURCE_SHA}" \
              --title "TypeScript SDK ${RELEASE_VERSION}" \
              --notes-file "${RUNNER_TEMP}/sdk-release/notes.md" "${RUNNER_TEMP}"/sdk-release/dist/*
          fi
      - name: Publish SDK to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball=("${RUNNER_TEMP}"/sdk-release/dist/*.tgz)
          python3 script/release/npm_publish.py publish --package "${PACKAGE_NAME}" --tarball "${tarball[0]}"

  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'SDK releases can run only from main' >&2; exit 1
