name: Release Connector Python SDK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: minor
        type: choice
        options: [minor, patch, major]
      repair_version:
        description: Existing tag version (vX.Y.Z) to repair without creating a new tag
        required: false
        type: string
      dry_run:
        description: Build and verify without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-connector-python-sdk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    env:
      BUMP: ${{ inputs.bump }}
      REPAIR_VERSION: ${{ inputs.repair_version }}
      PACKAGE_NAME: 'dex-connectors-sdk'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Plan SDK release or repair
        id: plan
        run: |
          cp script/release/component_release.py "${RUNNER_TEMP}/component_release.py"
          if [ -n "${REPAIR_VERSION}" ]; then
            repair_tag="sdkpython/${REPAIR_VERSION}"
            git merge-base --is-ancestor "${repair_tag}" HEAD || { echo "SDK tag is not reachable from main: ${repair_tag}" >&2; exit 1; }
            git checkout --detach "$(git rev-parse "${repair_tag}^{commit}")"
          fi
          arguments=(--component-path sdkpython --tag-prefix sdkpython/ --ref "${GITHUB_REF}" \
            --json-output "${RUNNER_TEMP}/sdk-plan.json" --github-output "${GITHUB_OUTPUT}")
          if [ -n "${REPAIR_VERSION}" ]; then
            arguments+=(--version "${REPAIR_VERSION}")
          else
            arguments+=(--bump "${BUMP}")
          fi
          python3 "${RUNNER_TEMP}/component_release.py" plan "${arguments[@]}"
      - name: Test and build SDK
        run: |
          test -f sdkpython/pyproject.toml && test -f sdkpython/uv.lock || { echo 'Python SDK package or lockfile is missing' >&2; exit 1; }
          uv sync --locked --project sdkpython
          uv run --project sdkpython ruff check sdkpython
          uv run --project sdkpython mypy --strict sdkpython/src
          uv run --project sdkpython pytest sdkpython/tests
          uv build sdkpython --out-dir "${RUNNER_TEMP}/sdk-dist"
          rm -f "${RUNNER_TEMP}/sdk-dist/.gitignore"
      - name: Build release notes and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/sdk-release"
          python3 "${RUNNER_TEMP}/component_release.py" notes \
            --plan "${RUNNER_TEMP}/sdk-plan.json" --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/sdk-release/notes.md"
          assets=("${RUNNER_TEMP}"/sdk-dist/*)
          manifest_args=()
          for asset in "${assets[@]}"; do manifest_args+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" language-manifest \
            --output "${RUNNER_TEMP}/sdk-dist/language-release.json" --language python \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" --source-sha "${SOURCE_SHA}" "${manifest_args[@]}"
          cp -a "${RUNNER_TEMP}/sdk-dist" "${RUNNER_TEMP}/sdk-release/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-release
          path: ${{ runner.temp }}/sdk-release
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      PACKAGE_NAME: 'dex-connectors-sdk'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with:
          name: sdk-release
          path: ${{ runner.temp }}/sdk-release
      - name: Verify package archives before publication
        run: |
          assets=("${RUNNER_TEMP}"/sdk-release/dist/*.whl "${RUNNER_TEMP}"/sdk-release/dist/*.tar.gz)
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 script/release/component_release.py verify-language-artifacts \
            --language python --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" "${arguments[@]}"
      - name: Regenerate trusted SDK release metadata
        run: |
          cp script/release/component_release.py "${RUNNER_TEMP}/component_release.py"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            git merge-base --is-ancestor "${RELEASE_TAG}" HEAD || { echo "SDK tag is not reachable from main: ${RELEASE_TAG}" >&2; exit 1; }
            git checkout --detach "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          fi
          python3 "${RUNNER_TEMP}/component_release.py" plan \
            --component-path sdkpython --tag-prefix sdkpython/ --version "${RELEASE_VERSION}" \
            --ref "${GITHUB_REF}" --json-output "${RUNNER_TEMP}/trusted-sdk-plan.json" \
            --github-output "${RUNNER_TEMP}/trusted-sdk-output"
          python3 "${RUNNER_TEMP}/component_release.py" notes \
            --plan "${RUNNER_TEMP}/trusted-sdk-plan.json" --repository "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/sdk-release/notes.md"
          rm -f "${RUNNER_TEMP}"/sdk-release/dist/*.sha256 "${RUNNER_TEMP}/sdk-release/dist/language-release.json"
          assets=("${RUNNER_TEMP}"/sdk-release/dist/*.whl "${RUNNER_TEMP}"/sdk-release/dist/*.tar.gz)
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" language-manifest \
            --output "${RUNNER_TEMP}/sdk-release/dist/language-release.json" --language python \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" --source-sha "$(git rev-parse HEAD)" "${arguments[@]}"
      - name: Publish SDK to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          test -n "${UV_PUBLISH_TOKEN}" || { echo 'PYPI_TOKEN is required' >&2; exit 1; }
          assets=("${RUNNER_TEMP}"/sdk-release/dist/*.whl "${RUNNER_TEMP}"/sdk-release/dist/*.tar.gz)
          arguments=()
          for asset in "${assets[@]}"; do arguments+=(--asset "${asset}"); done
          python3 "${RUNNER_TEMP}/component_release.py" verify-pypi-artifacts \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" "${arguments[@]}"
          uv publish --check-url https://pypi.org/simple/ "${RUNNER_TEMP}"/sdk-release/dist/*.whl "${RUNNER_TEMP}"/sdk-release/dist/*.tar.gz
          python3 "${RUNNER_TEMP}/component_release.py" verify-pypi-artifacts \
            --package "${PACKAGE_NAME}" --version "${RELEASE_VERSION}" --require-all --wait-seconds 120 "${arguments[@]}"
      - name: Create or repair SDK release
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${RUNNER_TEMP}"/sdk-release/dist/*
          else
            gh release create "${RELEASE_TAG}" --target "${SOURCE_SHA}" \
              --title "Python SDK ${RELEASE_VERSION}" \
              --notes-file "${RUNNER_TEMP}/sdk-release/notes.md" "${RUNNER_TEMP}"/sdk-release/dist/*
          fi

  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'SDK releases can run only from main' >&2; exit 1
