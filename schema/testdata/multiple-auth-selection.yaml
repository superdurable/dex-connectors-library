apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: multiple-auth-selection-fixture
  displayName: Multiple Auth Selection Fixture
  description: Deterministic fixture for one connection that holds several API-key providers.
  company: Example
  version: v0.1.0
spec:
  provider: example
  codegen: {go: {package: multipleauthselection}}
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: Default model written provider/model. Blank uses the first added provider's default model.
        required: false
        studioUnit: {unit: modelPicker, port: model}
  auth:
    selection: multiple
    methodLabel: Provider
    defaultMethod: openai
    methods:
      - id: openai
        displayName: OpenAI
        description: Use an OpenAI project API key.
        type: apiKey
        connectionKind: example-openai-api-key
        fields:
          - {name: openai_api_key, goName: OpenAIAPIKey, type: secretString, description: Secret OpenAI project API key., required: true}
        configuration:
          fields:
            - {name: openaiProjectId, goName: OpenAIProjectID, type: string, description: OpenAI project ID that owns usage., required: true}
        guide:
          startURL: https://platform.openai.com/api-keys
          steps: [Choose Create new secret key and copy the secret shown once.]
      - id: anthropic
        displayName: Claude
        description: Use a Claude Console API key.
        type: apiKey
        connectionKind: example-anthropic-api-key
        fields:
          - {name: anthropic_api_key, goName: AnthropicAPIKey, type: secretString, description: Secret Claude API key., required: true}
        configuration:
          fields:
            - {name: anthropicWorkspaceId, goName: AnthropicWorkspaceID, type: string, description: Claude workspace ID for a multi-workspace key., required: false}
        guide:
          startURL: https://platform.claude.com/settings/keys
          steps: [Choose Create key and copy the secret shown once.]
      - id: gemini
        displayName: Gemini
        description: Use a Google AI Studio API key.
        type: apiKey
        connectionKind: example-gemini-api-key
        fields:
          - {name: gemini_api_key, goName: GeminiAPIKey, type: secretString, description: Secret Gemini API key., required: true}
        configuration:
          fields:
            - {name: geminiApiVersion, goName: GeminiAPIVersion, type: enum, enum: [v1, v1beta], default: v1beta, description: Gemini API version path segment., required: false}
        guide:
          startURL: https://aistudio.google.com/api-keys
          steps: [Choose Create API key and copy the key.]
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, example.models-list]
      mockScenarios: [connected]
      icon: icon.svg
    units:
      - id: modelPicker
        goName: ModelPicker
        description: Choose one model from the providers this connection added.
        backendCapabilities: [example.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: getThing
      goName: GetThing
      inputType: GetThingInput
      outputType: GetThingOutput
      kind: query
      description: Get one thing.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: The thing was found.}
        - {id: defect, goName: Defect, description: The request was invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m}}
