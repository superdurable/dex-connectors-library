apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: single-auth-credentials-fixture
  displayName: Single Auth Credentials Fixture
  description: Deterministic single-method OAuth credential fixture.
  company: Example
  version: v0.1.0
spec:
  provider: example
  codegen: {go: {package: singleauthcredentialsfixture}}
  configuration: {fields: []}
  auth:
    refreshable: true
    type: oauth2
    connectionKind: example-oauth
    fields:
      - {name: oauth_client_id, goName: OAuthClientID, type: string, description: OAuth application client ID., required: false}
      - {name: oauth_client_secret, goName: OAuthClientSecret, type: secretString, description: OAuth application client secret., required: false}
      - {name: access_token, goName: AccessToken, type: secretString, description: Short-lived access token., required: true}
      - {name: refresh_token, goName: RefreshToken, type: secretString, description: Long-lived refresh token., required: false}
      - {name: environment, goName: Environment, type: enum, description: Login environment., required: false, enum: [production, sandbox]}
      - {name: login_url, goName: LoginURL, type: url, description: Login URL., required: false}
    guide:
      startURL: https://example.com/developers
      steps: [Create an OAuth application and copy its client credentials.]
    oauth2:
      authorizationEndpoint: https://example.com/authorize
      tokenEndpoint: https://example.com/token
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [read]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      pkce: true
  operations:
    - name: getThing
      goName: GetThing
      inputType: GetThingInput
      outputType: GetThingOutput
      kind: query
      description: Get one thing.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: The thing was found.}
        - {id: defect, goName: Defect, description: The request was invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async}
