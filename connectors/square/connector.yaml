apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: square
  displayName: Square
  description: "Read and manage Square payments and commerce resources through typed Dex Steps."
  company: Square
  categories: [finance-payments, ecommerce]
  version: v0.3.0
spec:
  provider: square
  languages:
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-square"
      operations: [listPayments, getPayment]
      triggers: []
    python:
      version: v0.1.0
      operations: [listPayments, getPayment]
      triggers: []
  codegen:
    go:
      package: square
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: "Use the provider HTTPS API URL. Blank uses the displayed default; override for a matching sandbox or local test server."
        default: https://connect.squareup.com/v2
      - name: timeout
        goName: Timeout
        type: duration
        description: "Maximum duration of one provider HTTP request as a positive Go duration, such as 15s or 1m. Blank uses the displayed default; override for slow network paths."
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum provider JSON response size in bytes as a positive integer. Blank uses the displayed default; raise only for larger result pages."
        default: 2097152
  auth:
    type: apiKey
    connectionKind: square-api-key
    fields:
      - name: access_token
        goName: AccessToken
        type: secretString
        description: "Secret Square production access token from https://developer.squareup.com/apps > application > Credentials > Production. It is an opaque bearer token; enable PAYMENTS_READ for reads and PAYMENTS_WRITE for payment writes. Blank prevents calls. Use the matching sandbox baseUrl with a sandbox token."
        required: true
    guide:
      startURL: https://developer.squareup.com/apps
      steps:
        - "At https://developer.squareup.com/apps create or choose an application, open Credentials > Production and copy the secret access token into access_token. Enable PAYMENTS_READ for reads and PAYMENTS_WRITE for writes. For sandbox testing use its Sandbox token and override baseUrl with https://connect.squareupsandbox.com/v2. Blank prevents calls."
        - "Set baseUrl, timeout, and maxResponseBytes only as described below; defaults appear in parentheses in Dex Web."
  operations:
    - name: listPayments
      goName: ListPayments
      inputType: ListPaymentsInput
      outputType: PaymentPage
      kind: query
      description: "List one page of Square payments."
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "List one page of Square payments."}
        - {id: notFound, goName: NotFound, description: The requested resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: listed
          description: "A realistic read-only listPayments response for a Meridian account."
          default: true
          output: {"payments":[{"id":"pay_101","status":"COMPLETED","amount_money":{"amount":2900,"currency":"USD"}}],"cursor":""}
    - name: getPayment
      goName: GetPayment
      inputType: GetPaymentInput
      outputType: Payment
      kind: query
      description: "Read one Square payment."
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "Read one Square payment."}
        - {id: notFound, goName: NotFound, description: The requested resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: found
          description: "A realistic read-only getPayment response for a Meridian account."
          default: true
          output: {"id":"pay_101","status":"COMPLETED","amount_money":{"amount":2900,"currency":"USD"}}
    - name: createPayment
      goName: CreatePayment
      inputType: CreatePaymentInput
      outputType: Payment
      kind: mutation
      description: "Charge or record a payment using a Square payment source; the call supplies a stable idempotency key."
      idempotency: required
      authorization: required
      branches:
        - {id: created, goName: Created, description: Square created the payment.}
        - {id: providerRejected, goName: ProviderRejected, description: Square conclusively rejected the payment., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Square returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - name: defaultAnswer
          branch: created
          description: A Square payment created from a test source.
          default: true
          output: {id: pay_102, status: COMPLETED, amount_money: {amount: 2900, currency: USD}}
    - name: updatePayment
      goName: UpdatePayment
      inputType: UpdatePaymentInput
      outputType: Payment
      kind: mutation
      description: "Update an approved Square payment amount with a stable idempotency key."
      idempotency: required
      authorization: required
      branches:
        - {id: updated, goName: Updated, description: Square updated the payment.}
        - {id: notFound, goName: NotFound, description: The payment was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Square conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Square returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - name: defaultAnswer
          branch: updated
          description: A Square payment with an updated amount.
          default: true
          output: {id: pay_101, status: APPROVED, amount_money: {amount: 3000, currency: USD}}
    - name: cancelPayment
      goName: CancelPayment
      inputType: CancelPaymentInput
      outputType: Payment
      kind: mutation
      description: "Void an approved Square payment."
      idempotency: required
      authorization: required
      branches:
        - {id: canceled, goName: Canceled, description: Square canceled the payment.}
        - {id: notFound, goName: NotFound, description: The payment was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Square conclusively rejected the cancellation., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Square returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - name: defaultAnswer
          branch: canceled
          description: A voided Square payment.
          default: true
          output: {id: pay_101, status: CANCELED, amount_money: {amount: 2900, currency: USD}}
    - name: completePayment
      goName: CompletePayment
      inputType: CompletePaymentInput
      outputType: Payment
      kind: mutation
      description: "Capture an approved Square payment."
      idempotency: required
      authorization: required
      branches:
        - {id: completed, goName: Completed, description: Square completed the payment.}
        - {id: notFound, goName: NotFound, description: The payment was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Square conclusively rejected the capture., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Square returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - name: defaultAnswer
          branch: completed
          description: A captured Square payment.
          default: true
          output: {id: pay_101, status: COMPLETED, amount_money: {amount: 2900, currency: USD}}
