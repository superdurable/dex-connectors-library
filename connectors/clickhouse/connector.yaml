apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: clickhouse
  displayName: ClickHouse
  description: Inspect ClickHouse databases, tables, and columns over the read-only HTTP interface.
  company: ClickHouse
  categories: [databases-storage, analytics]
  version: v0.2.0
spec:
  provider: clickhouse
  languages:
    python:
      version: v0.1.0
      package: dex-connector-clickhouse
      operations: [listTables]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-clickhouse"
      operations: [listTables]
      triggers: []
  codegen:
    go:
      package: clickhouse
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        required: true
        description: HTTPS root of the ClickHouse HTTP interface, typically https://your-service.region.aws.clickhouse.cloud:8443; find the host in ClickHouse Cloud > Services > service > Connect > HTTPS or ask your self-hosted administrator. Do not include credentials, query, database, or path. Blank prevents connection creation.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one metadata query as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow catalogs.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete metadata JSON response in bytes as a positive integer. Blank uses the displayed default; increase for large catalogs.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: clickhouse-http-password
    fields:
      - name: username
        goName: Username
        type: string
        required: true
        description: Non-secret ClickHouse database username from Cloud > Services > service > Connect > HTTPS, or from your self-hosted administrator. Enter the exact user with SELECT access to system.databases, system.tables, and system.columns; blank prevents calls. Dex sends it in X-ClickHouse-User.
      - name: password
        goName: Password
        type: secretString
        required: true
        description: Secret password for that ClickHouse database user from Cloud > Services > service > Connect > HTTPS, or from your self-hosted administrator. Enter the complete password; blank prevents calls. Dex stores it only as a credential and sends it in X-ClickHouse-Key. Rotate it in the database user settings.
    guide:
      startURL: https://clickhouse.cloud
      steps:
        - In ClickHouse Cloud open Services > select the service > Connect > HTTPS. Copy the HTTPS endpoint host and port into baseUrl, the database username into username, and its secret password into Dex Web password. For self-hosted ClickHouse, obtain the equivalent HTTPS endpoint and user from your administrator. The user needs SELECT permission on system.databases, system.tables, and system.columns. Blank values prevent connection or calls.
        - Leave timeout and maxResponseBytes blank for their displayed defaults. Find non-secret database and table names in the ClickHouse SQL console with SHOW DATABASES and SHOW TABLES. Pass their exact names to metadata operations; blank is invalid. Each operation returns at most 100 sorted entries and hasMore when more exist.
  operations:
    - name: listDatabases
      goName: ListDatabases
      inputType: ListDatabasesInput
      outputType: DatabasesPage
      kind: query
      description: Return up to 100 sorted database names and indicate whether more exist.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: ClickHouse returned the database names.}
        - {id: providerRejected, goName: ProviderRejected, description: ClickHouse conclusively rejected the metadata query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ClickHouse returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Two sample databases are returned.
          output: {names: [analytics, default], hasMore: false}
    - name: listTables
      goName: ListTables
      inputType: ListTablesInput
      outputType: TablesPage
      kind: query
      description: Return up to 100 sorted table names in one database and indicate whether more exist.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: ClickHouse returned the table names.}
        - {id: providerRejected, goName: ProviderRejected, description: ClickHouse conclusively rejected the metadata query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ClickHouse returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A database with two sample tables is returned.
          output: {database: analytics, names: [events, users], hasMore: false}
    - name: listColumns
      goName: ListColumns
      inputType: ListColumnsInput
      outputType: ColumnsPage
      kind: query
      description: Return up to 100 ordered column names and types for one table.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: ClickHouse returned the table columns.}
        - {id: providerRejected, goName: ProviderRejected, description: ClickHouse conclusively rejected the metadata query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ClickHouse returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: The events table has two sample columns.
          output: {database: analytics, table: events, columns: [{name: id, type: UInt64}, {name: event, type: String}], hasMore: false}
