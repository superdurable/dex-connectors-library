[package]
name = "dex-connector-caiyun"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Caiyun Current weather queries for Dex Flows"
repository = "https://github.com/superdurable/dex-connectors-library"

[dependencies]
dex-connectors-sdk = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
ring = "0.17"
base64 = "0.22"
ryu = "1"

[dev-dependencies]
form_urlencoded = "1.2.3"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
