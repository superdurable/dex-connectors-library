apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: harvest
  displayName: Harvest
  description: Read and manage Harvest records with a connection-owned API key.
  company: Harvest
  categories: [productivity, project-management]
  version: v0.3.0
spec:
  provider: harvest
  languages:
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-harvest'
      operations: [listProjects, listTimeEntries]
      triggers: []
    python:
      version: v0.1.0
      operations: [listProjects, listTimeEntries]
      triggers: []
  codegen:
    go:
      package: harvest
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: "Public Harvest HTTPS API root; blank uses the displayed default. Override only for a trusted compatible gateway or loopback test server, and never include a key in the URL."
        default: https://api.harvestapp.com/v2
      - name: timeout
        goName: Timeout
        type: duration
        description: "Maximum duration of one Harvest HTTP read, as a positive Go duration such as 15s or 1m. Blank uses the displayed default; raise it only for slow large reads."
        default: 30s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum bytes accepted from one Harvest JSON response, as a positive integer. Blank uses the displayed default; raise it for large pages or files. Oversized data selects invalidResponse."
        default: 4194304
      - name: accountId
        goName: AccountID
        type: string
        description: "Non-secret decimal Harvest account ID shown beside the personal access token at https://id.getharvest.com/developers. Copy the ID for the account to read; blank is invalid. It is sent in Harvest-Account-Id, never in a URL."
        required: true
  auth:
    type: apiKey
    connectionKind: harvest-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: "Secret Harvest API token from https://id.getharvest.com/developers (Harvest ID > Developers > Personal Access Tokens); copy the token when generated, paste it here, and keep it secret. Blank makes every operation select defect before a request."
        required: true
    guide:
      startURL: https://id.getharvest.com/developers
      steps:
        - "Open https://id.getharvest.com/developers and sign in; navigate to Harvest ID > Developers > Personal Access Tokens."
        - "Create a token for the identity that may read the desired resources and copy the secret value when shown."
        - "Paste it into secret api_key. Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults."
        - "Copy the decimal account ID shown with the personal token into accountId; this ID is not secret."
  operations:
    - name: listClients
      goName: ListClients
      inputType: ListClientsInput
      outputType: ClientPage
      kind: query
      description: List Harvest clients with cursor pagination.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Harvest returned the client page.}
        - {id: providerRejected, goName: ProviderRejected, description: Harvest rejected the client read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Harvest returned unusable JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: defaultAnswer
          branch: listed
          default: true
          description: One Meridian client.
          output: {clients: [{id: 2001, name: Meridian, isActive: true}]}
    - name: getClient
      goName: GetClient
      inputType: GetClientInput
      outputType: ClientRecord
      kind: query
      description: Retrieve one Harvest client by ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Harvest returned the client.}
        - {id: notFound, goName: NotFound, description: The client ID does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Harvest rejected the client read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Harvest returned unusable JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: defaultAnswer
          branch: found
          default: true
          description: The Meridian client.
          output: {id: 2001, name: Meridian, isActive: true}
    - name: createClient
      goName: CreateClient
      inputType: CreateClientInput
      outputType: ClientRecord
      kind: mutation
      description: Create a Harvest client; a lost response may need confirmation in Harvest before another send.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Harvest created the client.}
        - {id: providerRejected, goName: ProviderRejected, description: Harvest rejected the client creation., optional: true}
        - {id: uncertain, goName: Uncertain, description: A submitted create could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: defaultAnswer
          branch: created
          default: true
          description: A Meridian client was created.
          output: {id: 2001, name: Meridian, isActive: true}
    - name: updateClient
      goName: UpdateClient
      inputType: UpdateClientInput
      outputType: ClientRecord
      kind: mutation
      description: Set selected Harvest client fields with an idempotent PATCH.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Harvest updated the client.}
        - {id: notFound, goName: NotFound, description: The client ID does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Harvest rejected the client update., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: defaultAnswer
          branch: updated
          default: true
          description: A Meridian client was updated.
          output: {id: 2001, name: Meridian, isActive: true}
    - name: deleteClient
      goName: DeleteClient
      inputType: DeleteClientInput
      outputType: DeletedClient
      kind: mutation
      description: Delete a Harvest client without related projects, invoices, or estimates.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Harvest deleted the client.}
        - {id: notFound, goName: NotFound, description: The client ID does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Harvest rejected the client deletion., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: defaultAnswer
          branch: deleted
          default: true
          description: A Meridian client was deleted.
          output: {id: 2001}
