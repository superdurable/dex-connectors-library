apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: constantcontact
  displayName: Constant Contact
  description: Manage contacts, lists, and segments, and inspect bulk activity status through the Constant Contact V3 API.
  company: Constant Contact
  categories: [marketing]
  version: v0.2.0
spec:
  provider: constantcontact
  languages:
    python:
      version: v0.1.0
      package: dex-connector-constantcontact
      operations: [getContact]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-constantcontact'
      operations: [getContact]
      triggers: []
  codegen:
    go:
      package: constantcontact
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Constant Contact V3 API root as an absolute HTTPS URL. Blank uses the displayed public endpoint; override only for a trusted local test gateway.
        default: https://api.cc.email/v3
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete response in bytes as a positive integer. Blank uses the displayed default; raise only when contact responses are larger than expected.
        default: 1048576
  auth:
    type: oauth2
    refreshable: true
    connectionKind: constantcontact-user-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        required: true
        description: Non-secret API Key from https://app.constantcontact.com/pages/dma/portal/ > My Applications > select the V3 API app. Blank prevents authorization and refresh.
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        required: true
        description: Secret Client Secret from the same My Applications page. Copy it into this secret field only; blank prevents authorization and refresh.
      - name: access_token
        goName: AccessToken
        type: secretString
        required: true
        description: Secret access token produced by Constant Contact OAuth and refreshed by Dex. Never enter it manually; blank requires authorization.
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        required: true
        description: Secret refresh token produced by Constant Contact OAuth and rotated by Dex. Never enter it manually; blank requires reauthorization.
    guide:
      startURL: https://app.constantcontact.com/pages/dma/portal/
      steps:
        - Open the Constant Contact Developer Portal > My Applications > Create a New Application, choose Authorization Code Flow, and copy the API Key and Client Secret. The API Key is not secret; store the Client Secret only in Dex credentials.
        - In the application's Redirect URI settings, register the exact redirect URI displayed by Dex Web. Enable the contact_data scope for contact and list access and offline_access for refresh tokens; ask the account administrator for contacts read/write and contact-list read/write privileges if your user cannot grant access.
        - Save the two app credentials, choose Authorize in Dex Web, and approve Constant Contact consent. Dex stores and refreshes the returned access and refresh tokens. Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults.
        - To find a contact ID, open Constant Contact > Contacts, select a contact, and use the contact ID from its V3 API resource or an exported V3 contacts list. It is a non-secret UUID. Blank contact IDs are invalid.
        - To find a list ID, open Constant Contact > Contacts > Lists, select a list, and use its list_id from the V3 contact-lists API. It is a non-secret UUID. Blank list IDs are invalid; a blank contact page cursor starts a new search.
        - To inspect an asynchronous job, use the non-secret activity_id UUID returned by a V3 bulk activity response, such as deleteContactList, or find it through GET /activities in the API tester at https://developer.constantcontact.com/api_reference/index.html. Blank activity IDs are invalid; statuses expire after ten days.
        - To find a segment ID, open Constant Contact > Contacts > Segments, select a segment, and use the positive numeric segment_id from the V3 segments API at https://developer.constantcontact.com/api_guide/segments/segments-get-all. Blank IDs are invalid. Segment criteria is a JSON object encoded as a single string; derive it from the provider's segment-criteria examples and do not include contact secrets.
    oauth2:
      authorizationEndpoint: https://authz.constantcontact.com/oauth2/default/v1/authorize
      tokenEndpoint: https://authz.constantcontact.com/oauth2/default/v1/token
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [contact_data, offline_access]
      pkce: false
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      tokenEndpointAuthMethod: client_secret_basic
      refresh:
        tokenExchangeTimeout: 15s
        missingExpiry: reject
        storedMissingExpiry: refresh
        scopeSeparators: whitespaceAndComma
        requiredScopes: [contact_data]
        terminalErrorCodes: [invalid_grant, invalid_client, unauthorized_client]
  operations:
    - name: getSegment
      goName: GetSegment
      inputType: GetSegmentInput
      outputType: SegmentMetadata
      kind: query
      description: Read a segment and its complete selection criteria.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Constant Contact returned the segment.}
        - {id: notFound, goName: NotFound, description: The segment does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed segment JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample segment is returned.
          output: {segmentId: 30, name: Recent readers, segmentCriteria: '{"version":"1.0.0","criteria":{"type":"and","group":[]}}'}
    - name: listSegments
      goName: ListSegments
      inputType: ListSegmentsInput
      outputType: SegmentsPage
      kind: query
      description: Read a bounded page of segments.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Constant Contact returned a segment page.}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed segment JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample segment is returned.
          output: {segments: [{segmentId: 30, name: Recent readers}]}
    - name: createSegment
      goName: CreateSegment
      inputType: CreateSegmentInput
      outputType: SegmentMetadata
      kind: mutation
      description: Create a uniquely named segment with complete selection criteria.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Constant Contact created the segment.}
        - {id: uncertain, goName: Uncertain, description: An earlier segment creation could not be confirmed after the send cap., optional: true}
        - {id: alreadyExists, goName: AlreadyExists, description: A segment with this name exists., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected creation., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample segment was created.
          output: {segmentId: 30, name: Recent readers, segmentCriteria: '{"version":"1.0.0","criteria":{"type":"and","group":[]}}'}
    - name: updateSegment
      goName: UpdateSegment
      inputType: UpdateSegmentInput
      outputType: SegmentMetadata
      kind: mutation
      description: Replace one segment's name and complete criteria.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Constant Contact updated the segment.}
        - {id: notFound, goName: NotFound, description: The segment does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed segment JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: A sample segment was updated.
          output: {segmentId: 30, name: Recent readers, segmentCriteria: '{"version":"1.0.0","criteria":{"type":"and","group":[]}}'}
    - name: deleteSegment
      goName: DeleteSegment
      inputType: DeleteSegmentInput
      outputType: DeleteSegmentOutput
      kind: mutation
      description: Remove one segment from the active collection.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Constant Contact deleted the segment.}
        - {id: notFound, goName: NotFound, description: The segment does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected deletion., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: A sample segment was deleted.
          output: {segmentId: 30}
    - name: getActivity
      goName: GetActivity
      inputType: GetActivityInput
      outputType: ActivityMetadata
      kind: query
      description: Read the current state and progress of one recent bulk activity.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Constant Contact returned the activity.}
        - {id: notFound, goName: NotFound, description: The activity is absent or older than ten days., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed activity JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample list-deletion activity is complete.
          output: {activityId: "3d72da26-2115-11ea-9216-fa163e6b01c0", state: completed, percentDone: 100}
    - name: listActivities
      goName: ListActivities
      inputType: ListActivitiesInput
      outputType: ActivitiesPage
      kind: query
      description: Read recent bulk activity states retained for ten days.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Constant Contact returned recent activities.}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed activity JSON., optional: true}
        - {id: defect, goName: Defect, description: Credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One recent bulk activity is returned.
          output: {activities: [{activityId: "3d72da26-2115-11ea-9216-fa163e6b01c0", state: completed, percentDone: 100}]}
    - name: createContact
      goName: CreateContact
      inputType: CreateContactInput
      outputType: ContactMetadata
      kind: mutation
      description: Create an email contact with its documented permission and source.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Constant Contact created the contact.}
        - {id: uncertain, goName: Uncertain, description: An earlier contact creation could not be confirmed after the send cap., optional: true}
        - {id: alreadyExists, goName: AlreadyExists, description: A contact with this email exists., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the creation., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample email contact was created.
          output: {contactId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1", emailAddress: "reader@example.com", firstName: "Avery", lastName: "Reader", emailPermission: "implicit"}
    - name: listContacts
      goName: ListContacts
      inputType: ListContactsInput
      outputType: ContactsPage
      kind: query
      description: Search contacts by exact email or page through the contact collection.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Constant Contact returned a page of contacts.}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the search., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One contact is returned.
          output: {contacts: [{contactId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1", emailAddress: "reader@example.com"}]}
    - name: updateContact
      goName: UpdateContact
      inputType: UpdateContactInput
      outputType: ContactMetadata
      kind: mutation
      description: Update selected contact name and company fields while preserving other core fields.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Constant Contact updated the contact.}
        - {id: notFound, goName: NotFound, description: The contact does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed contact JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: A sample contact name was updated.
          output: {contactId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1", emailAddress: "reader@example.com", firstName: "Avery", lastName: "Reader", emailPermission: "implicit"}
    - name: deleteContact
      goName: DeleteContact
      inputType: DeleteContactInput
      outputType: DeleteContactOutput
      kind: mutation
      description: Delete one contact and its list memberships by contact UUID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Constant Contact deleted the contact.}
        - {id: notFound, goName: NotFound, description: The contact was already absent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: The contact was deleted.
          output: {contactId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1"}
    - name: getContact
      goName: GetContact
      inputType: GetContactInput
      outputType: ContactMetadata
      kind: query
      description: Read one contact's ID, optional email address, names, and current email permission when present.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Constant Contact returned the contact.}
        - {id: notFound, goName: NotFound, description: The contact does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample subscribed contact is returned.
          output: {contactId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1", emailAddress: "reader@example.com", firstName: "Avery", lastName: "Reader", emailPermission: "explicit"}
        - name: contactMissing
          branch: notFound
          description: The requested contact is absent.
          failure: {kind: NOT_FOUND, message: Constant Contact did not find the contact.}
    - name: getContactList
      goName: GetContactList
      inputType: GetContactListInput
      outputType: ContactListMetadata
      kind: query
      description: Read one contact list by UUID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Constant Contact returned the list.}
        - {id: notFound, goName: NotFound, description: The list does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample contact list is returned.
          output: {listId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1", name: Customers}
    - name: listContactLists
      goName: ListContactLists
      inputType: ListContactListsInput
      outputType: ContactListsPage
      kind: query
      description: Read a bounded collection of contact lists, optionally by exact name.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Constant Contact returned a page of lists.}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Constant Contact returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One contact list is returned.
          output: {lists: [{listId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1", name: Customers}]}
    - name: createContactList
      goName: CreateContactList
      inputType: CreateContactListInput
      outputType: ContactListMetadata
      kind: mutation
      description: Create one named contact list.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Constant Contact created the list.}
        - {id: uncertain, goName: Uncertain, description: An earlier list creation could not be confirmed after the send cap., optional: true}
        - {id: alreadyExists, goName: AlreadyExists, description: A list with this name exists., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample list is created.
          output: {listId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1", name: Customers}
    - name: updateContactList
      goName: UpdateContactList
      inputType: UpdateContactListInput
      outputType: ContactListMetadata
      kind: mutation
      description: Replace the name, description, and favorite state of one list.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Constant Contact updated the list.}
        - {id: notFound, goName: NotFound, description: The list does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: A sample list is renamed.
          output: {listId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1", name: Preferred Customers}
    - name: deleteContactList
      goName: DeleteContactList
      inputType: DeleteContactListInput
      outputType: DeleteContactListOutput
      kind: mutation
      description: Request asynchronous deletion of one contact list.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: accepted, goName: Accepted, description: Constant Contact accepted the list deletion.}
        - {id: notFound, goName: NotFound, description: The list does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Constant Contact rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: acceptedDefault
          branch: accepted
          default: true
          description: Deletion was accepted for a sample list.
          output: {listId: "1898ae62-4752-11e9-9c8a-fa163e6b01c1"}
