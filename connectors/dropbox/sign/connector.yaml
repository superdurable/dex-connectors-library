apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: dropbox-sign
  displayName: Dropbox Sign
  description: Inspect and manage signature requests, send documents or templates for signing, remind signers, and manage templates.
  company: Dropbox
  categories: [files-documents]
  version: v0.2.0
spec:
  provider: dropbox-sign
  languages:
    python:
      version: v0.1.0
      package: dex-connector-dropbox-sign
      operations: [getSignatureRequest]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-dropbox-sign"
      operations: [getSignatureRequest]
      triggers: []
  codegen:
    go:
      package: dropboxsign
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Dropbox Sign API v3 root as an absolute HTTPS URL. Blank uses the displayed public endpoint; override only for a trusted local test gateway.
        default: https://api.hellosign.com/v3
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow status reads.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete provider response in bytes as a positive integer. Blank uses the displayed default; increase for unusually large request metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: dropbox-sign-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret Dropbox Sign API key from Settings > API > API Keys at app.hellosign.com. Paste the complete opaque key into this secret field; blank prevents calls. Dex sends it as the Basic-auth username with an empty password.
    guide:
      startURL: https://app.hellosign.com/home/settings/api
      steps:
        - Sign in to Dropbox Sign, open Settings > API, then API Keys. Create an API key or reveal an existing one. Copy its complete opaque value into secret api_key in Dex Web; never put it in the Flow input. Revoke or replace the key from the same page.
        - Save the connection. Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults. After creating a signature request, copy its non-secret signature_request_id from the API response or locate a request in Dropbox Sign and use its request ID as signatureRequestId; blank is invalid.
  operations:
    - name: getSignatureRequest
      goName: GetSignatureRequest
      inputType: GetSignatureRequestInput
      outputType: SignatureRequestStatus
      kind: query
      description: Read one signature request's title, completion, declined, and error flags without signer or document data.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Dropbox Sign returned the signature request.}
        - {id: notFound, goName: NotFound, description: Dropbox Sign did not expose the request., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Dropbox Sign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One example signature request is returned.
          output: {id: fa5c8a0b0f492d768749333ad6fcc214c111e967, title: Example agreement, isComplete: true, isDeclined: false, hasError: false}
    - name: listSignatureRequests
      goName: ListSignatureRequests
      inputType: ListSignatureRequestsInput
      outputType: SignatureRequestPage
      kind: query
      description: Read one bounded page of accessible signature request titles and statuses.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Dropbox Sign returned a signature request page.}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign conclusively rejected the list request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Dropbox Sign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One example signature request is listed.
          output: {requests: [{id: fa5c8a0b0f492d768749333ad6fcc214c111e967, title: Example agreement, isComplete: false, isDeclined: false, hasError: false}], page: 1, totalPages: 1}
    - name: sendSignatureRequest
      goName: SendSignatureRequest
      inputType: SendSignatureRequestInput
      outputType: SignatureRequestStatus
      kind: mutation
      description: Send a signature request using a public HTTPS document URL and named signers.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3, dispatchFence: true}
      branches:
        - {id: sent, goName: Sent, description: Dropbox Sign returned the sent request.}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign conclusively rejected the send., optional: true}
        - {id: defect, goName: Defect, description: Document URL and signer input or credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The bounded send count ended without a confirmed request., optional: true}
      mocks:
        - {name: sentDocument, branch: sent, description: One example signature request was sent., default: true, output: {id: fa5c8a0b0f492d768749333ad6fcc214c111e967, title: Example agreement, isComplete: false, isDeclined: false, hasError: false}}
    - name: sendSignatureRequestWithTemplate
      goName: SendSignatureRequestWithTemplate
      inputType: SendSignatureRequestWithTemplateInput
      outputType: SignatureRequestStatus
      kind: mutation
      description: Send a signature request from a template with named signer roles.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3, dispatchFence: true}
      branches:
        - {id: sent, goName: Sent, description: Dropbox Sign returned the templated request.}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign conclusively rejected the templated send., optional: true}
        - {id: defect, goName: Defect, description: Template or signer input or credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The bounded send count ended without a confirmed request., optional: true}
      mocks:
        - {name: sentTemplate, branch: sent, description: One example templated request was sent., default: true, output: {id: fa5c8a0b0f492d768749333ad6fcc214c111e967, title: Example agreement, isComplete: false, isDeclined: false, hasError: false}}
    - name: cancelIncompleteSignatureRequest
      goName: CancelIncompleteSignatureRequest
      inputType: GetSignatureRequestInput
      outputType: CancellationQueued
      kind: mutation
      description: Queue cancellation of an incomplete signature request; the provider event confirms completion later.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: queued, goName: Queued, description: Dropbox Sign queued cancellation.}
        - {id: notFound, goName: NotFound, description: The request is unavailable., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign rejected cancellation., optional: true}
        - {id: defect, goName: Defect, description: Request ID or credentials are invalid., optional: true}
      mocks:
        - {name: cancellationQueued, branch: queued, description: Cancellation was queued., default: true, output: {signatureRequestId: fa5c8a0b0f492d768749333ad6fcc214c111e967, queued: true}}
    - name: remindSignatureRequest
      goName: RemindSignatureRequest
      inputType: RemindSignatureRequestInput
      outputType: SignatureRequestStatus
      kind: mutation
      description: Email one signer a request reminder with a bounded send count.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3, dispatchFence: true}
      branches:
        - {id: reminded, goName: Reminded, description: Dropbox Sign returned the request after sending the reminder.}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign conclusively rejected the reminder., optional: true}
        - {id: defect, goName: Defect, description: Request ID and signer email or credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The bounded send count ended without reminder confirmation., optional: true}
      mocks:
        - {name: reminderSent, branch: reminded, description: One signer reminder was sent., default: true, output: {id: fa5c8a0b0f492d768749333ad6fcc214c111e967, title: Example agreement, isComplete: false, isDeclined: false, hasError: false}}
    - name: updateSignerName
      goName: UpdateSignerName
      inputType: UpdateSignerNameInput
      outputType: UpdatedSignerName
      kind: mutation
      description: Replace one in-flight request signer's display name.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Dropbox Sign accepted the signer name update.}
        - {id: notFound, goName: NotFound, description: Dropbox Sign did not expose the signature request., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Dropbox Sign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One example signer name is updated.
          output: {signatureRequestId: fa5c8a0b0f492d768749333ad6fcc214c111e967, updated: true}
    - name: listTemplates
      goName: ListTemplates
      inputType: ListTemplatesInput
      outputType: TemplatesPage
      kind: query
      description: List one bounded page of accessible template IDs, titles, and signer roles.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Dropbox Sign returned a template page.}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign rejected template listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Dropbox Sign returned invalid template data., optional: true}
        - {id: defect, goName: Defect, description: Template page options or credentials are invalid., optional: true}
      mocks:
        - {name: templatePage, branch: listed, description: One template with a Client signer role is listed., default: true, output: {templates: [{id: template-1, title: Example agreement, signerRoles: [Client]}], page: 1, totalPages: 1}}
    - name: getTemplate
      goName: GetTemplate
      inputType: TemplateIdentityInput
      outputType: TemplateMetadata
      kind: query
      description: Read one template's ID, title, and signer roles.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Dropbox Sign returned the selected template.}
        - {id: notFound, goName: NotFound, description: The template is unavailable., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign rejected template retrieval., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Dropbox Sign returned invalid template data., optional: true}
        - {id: defect, goName: Defect, description: Template ID or credentials are invalid., optional: true}
      mocks:
        - {name: sampleTemplate, branch: found, description: One template with a Client signer role is returned., default: true, output: {id: template-1, title: Example agreement, signerRoles: [Client]}}
    - name: deleteTemplate
      goName: DeleteTemplate
      inputType: TemplateIdentityInput
      outputType: DeletedTemplate
      kind: mutation
      description: Permanently delete a template by ID; a missing template is already absent.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: The template is absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Dropbox Sign rejected template deletion., optional: true}
        - {id: defect, goName: Defect, description: Template ID or credentials are invalid., optional: true}
      mocks:
        - {name: sampleDeleted, branch: deleted, description: One template was deleted., default: true, output: {templateId: template-1, deleted: true}}
