apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: wave
  displayName: Wave
  description: Read and manage Wave customers and products within a business.
  company: Wave
  categories: [finance-payments]
  version: v0.2.0
spec:
  provider: wave
  languages:
    python:
      version: v0.1.0
      package: dex-connector-wave
      operations: [getCustomer]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-wave"
      operations: [getCustomer]
      triggers: []
  codegen:
    go:
      package: wave
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Wave GraphQL HTTPS root. Blank uses the displayed production root; override only for a trusted test gateway. Do not include /graphql/public, query, or credentials.
        default: https://gql.waveapps.com
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one customer query as a positive Go duration. Blank uses the displayed default; increase only for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete GraphQL JSON response in bytes as a positive integer. Blank uses the displayed default; increase only for large responses.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: wave-full-access-token
    fields:
      - name: accessToken
        goName: AccessToken
        type: secretString
        required: true
        description: Secret Full Access Token from Wave Developer Portal > Manage Applications > your own application > Full Access Token. Copy the complete token; blank prevents calls. Dex sends it only as a Bearer credential. This token can access the entire Wave account; rotate it in the portal when needed.
    guide:
      startURL: https://developer.waveapps.com
      steps:
        - In the Wave Developer Portal open Manage Applications, create or select an application for your own Wave account, and copy its Full Access Token into secret accessToken. Blank prevents calls. The token has broad account access and normally expires after several years; replace it before expiry. This connector does not perform the OAuth flow for other users.
        - Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults. In Wave's API Playground use list businesses and list customers to find the non-secret GraphQL business and customer IDs. Pass both exact IDs as businessId and customerId; blank is invalid.
  operations:
    - name: getCustomer
      goName: GetCustomer
      inputType: GetCustomerInput
      outputType: CustomerProfile
      kind: query
      description: Return one customer's ID and name within a Wave business.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Wave returned the customer.}
        - {id: notFound, goName: NotFound, description: The business or customer was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Wave conclusively rejected the query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Wave returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample customer is returned.
          output: {businessId: business-1, id: customer-1, name: Example Customer}
    - name: listCustomers
      goName: ListCustomers
      inputType: ListCustomersInput
      outputType: CustomerPage
      kind: query
      description: List one page of customers for a business.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Wave returned a page of customers.}
        - {id: notFound, goName: NotFound, description: The business was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Wave rejected the query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Wave returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: One example customer was listed., output: {businessId: business-1, customers: [{businessId: business-1, id: customer-1, name: Example Customer}], currentPage: 1, totalPages: 1, totalCount: 1}}
    - name: createCustomer
      goName: CreateCustomer
      inputType: CreateCustomerInput
      outputType: CustomerProfile
      kind: mutation
      description: Create a named customer in a business.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Wave created the customer.}
        - {id: providerRejected, goName: ProviderRejected, description: Wave rejected the customer input., optional: true}
        - {id: uncertain, goName: Uncertain, description: Creation may have succeeded but could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: One example customer was created., output: {businessId: business-1, id: customer-1, name: Example Customer}}
    - name: updateCustomer
      goName: UpdateCustomer
      inputType: UpdateCustomerInput
      outputType: CustomerProfile
      kind: mutation
      description: Replace a customer's name by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Wave updated the customer.}
        - {id: providerRejected, goName: ProviderRejected, description: Wave rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Wave returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: One example customer was updated., output: {businessId: business-1, id: customer-1, name: Updated Customer}}
    - name: deleteCustomer
      goName: DeleteCustomer
      inputType: DeleteCustomerInput
      outputType: DeletedCustomer
      kind: mutation
      description: Delete a customer by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Wave deleted the customer.}
        - {id: providerRejected, goName: ProviderRejected, description: Wave rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Wave returned malformed JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: One example customer was deleted., output: {id: customer-1}}
    - name: listProducts
      goName: ListProducts
      inputType: ListProductsInput
      outputType: ProductPage
      kind: query
      description: List one page of products and services for a business.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Wave returned a page of products.}
        - {id: notFound, goName: NotFound, description: The business was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Wave rejected the query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Wave returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: One example product was listed., output: {businessId: business-1, products: [{businessId: business-1, id: product-1, name: Example Product, unitPrice: '2.50'}], currentPage: 1, totalPages: 1, totalCount: 1}}
    - name: getProduct
      goName: GetProduct
      inputType: GetProductInput
      outputType: ProductProfile
      kind: query
      description: Read a product by business and product IDs.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Wave returned the product.}
        - {id: notFound, goName: NotFound, description: The business or product was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Wave rejected the query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Wave returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: One example product was found., output: {businessId: business-1, id: product-1, name: Example Product, unitPrice: '2.50'}}
    - name: createProduct
      goName: CreateProduct
      inputType: CreateProductInput
      outputType: ProductProfile
      kind: mutation
      description: Create a priced product in a business.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Wave created the product.}
        - {id: providerRejected, goName: ProviderRejected, description: Wave rejected the product input., optional: true}
        - {id: uncertain, goName: Uncertain, description: Creation may have succeeded but could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: One example product was created., output: {businessId: business-1, id: product-1, name: Example Product, unitPrice: '2.50'}}
    - name: updateProduct
      goName: UpdateProduct
      inputType: UpdateProductInput
      outputType: ProductProfile
      kind: mutation
      description: Replace a product's name and unit price.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Wave updated the product.}
        - {id: providerRejected, goName: ProviderRejected, description: Wave rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Wave returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: One example product was updated., output: {businessId: business-1, id: product-1, name: Updated Product, unitPrice: '3.00'}}
    - name: archiveProduct
      goName: ArchiveProduct
      inputType: ArchiveProductInput
      outputType: ProductProfile
      kind: mutation
      description: Archive a product by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: archived, goName: Archived, description: Wave archived the product.}
        - {id: providerRejected, goName: ProviderRejected, description: Wave rejected the archive request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Wave returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - {name: archivedDefault, branch: archived, default: true, description: One example product was archived., output: {businessId: business-1, id: product-1, name: Example Product, unitPrice: '2.50', isArchived: true}}
