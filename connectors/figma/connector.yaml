apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: figma
  displayName: Figma
  description: Read Figma records with a connection-owned API key.
  company: Figma
  version: v0.2.0
spec:
  provider: figma
  codegen:
    go:
      package: figma
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: "Public Figma HTTPS API root; blank uses the displayed default. Override only for a trusted compatible gateway or loopback test server, and never include a key in the URL."
        default: https://api.figma.com/v1
      - name: timeout
        goName: Timeout
        type: duration
        description: "Maximum duration of one Figma HTTP read, as a positive Go duration such as 15s or 1m. Blank uses the displayed default; raise it only for slow large reads."
        default: 30s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum bytes accepted from one Figma JSON response, as a positive integer. Blank uses the displayed default; raise it for large pages or files. Oversized data selects invalidResponse."
        default: 8388608
  auth:
    type: apiKey
    connectionKind: figma-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: "Secret Figma API token from https://www.figma.com/settings (Account menu > Settings > Security > Personal access tokens > Generate new token); copy the token when generated, paste it here, and keep it secret. Blank makes every operation select defect before a request. Choose file_content:read and file_comments:read scopes when generating the token."
        required: true
    guide:
      startURL: https://www.figma.com/settings
      steps:
        - "Open https://www.figma.com/settings and sign in; navigate to Account menu > Settings > Security > Personal access tokens > Generate new token."
        - "Create a token for the identity that may read the desired resources and copy the secret value when shown."
        - "Paste it into secret api_key. Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults."
        - "Choose the file_content:read and file_comments:read scopes before generating the Figma token."
  operations:
    - name: getFile
      goName: GetFile
      inputType: GetFileInput
      outputType: File
      kind: query
      description: Read Figma data from the documented getFile endpoint.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "Figma returned the requested data."}
        - {id: notFound, goName: NotFound, description: "Figma does not have the requested resource.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Figma conclusively rejected the read.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Figma returned malformed or oversized JSON.", optional: true}
        - {id: defect, goName: Defect, description: "Local input or connection credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 45s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: found
          description: "One Meridian sample record from the same example world."
          default: true
          output: {name: Meridian Design, lastModified: "2026-10-28T12:00:00Z", document: {id: "0:0", type: DOCUMENT, name: Root}}
        - name: invalidKey
          branch: providerRejected
          description: "The connection token is invalid."
          failure: {kind: AUTHENTICATION, message: "Figma rejected the token."}
    - name: getFileComments
      goName: GetFileComments
      inputType: GetFileCommentsInput
      outputType: FileComments
      kind: query
      description: Read Figma data from the documented getFileComments endpoint.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "Figma returned the requested data."}
        - {id: notFound, goName: NotFound, description: "Figma does not have the requested resource.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Figma conclusively rejected the read.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Figma returned malformed or oversized JSON.", optional: true}
        - {id: defect, goName: Defect, description: "Local input or connection credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 45s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: listed
          description: "One Meridian sample record from the same example world."
          default: true
          output: {comments: [{id: "1", message: Review the header.}]}
        - name: invalidKey
          branch: providerRejected
          description: "The connection token is invalid."
          failure: {kind: AUTHENTICATION, message: "Figma rejected the token."}
