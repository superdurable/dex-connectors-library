    - id: invalidResponse
      goName: InvalidResponse
      description: ListTemplates invalidResponse outcome.
      optional: true
    - id: defect
      goName: Defect
      description: ListTemplates defect outcome.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: listTemplatesDefault
      branch: listed
      description: Representative Postmark template response.
      default: true
      output:
        totalCount: 1
        templates:
        - templateId: 1234
          name: Welcome
          alias: welcome-v1
          active: true
  - name: getTemplate
    goName: GetTemplate
    inputType: GetTemplateInput
    outputType: Template
    kind: query
    description: GetTemplate through the Postmark server-token Templates API.
    idempotency: none
    authorization: required
    branches:
    - id: found
      goName: Found
      description: GetTemplate found outcome.
    - id: providerRejected
      goName: ProviderRejected
      description: GetTemplate providerRejected outcome.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: GetTemplate invalidResponse outcome.
      optional: true
    - id: defect
      goName: Defect
      description: GetTemplate defect outcome.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: getTemplateDefault
      branch: found
      description: Representative Postmark template response.
      default: true
      output:
        templateId: 1234
        name: Welcome
        alias: welcome-v1
        active: true
  - name: createTemplate
    goName: CreateTemplate
    inputType: CreateTemplateInput
    outputType: Template
    kind: mutation
    description: CreateTemplate through the Postmark server-token Templates API.
    idempotency: required
    authorization: required
    branches:
    - id: created
      goName: Created
      description: CreateTemplate created outcome.
    - id: providerRejected
      goName: ProviderRejected
      description: CreateTemplate providerRejected outcome.
      optional: true
    - id: uncertain
      goName: Uncertain
      description: CreateTemplate uncertain outcome.
      optional: true
    - id: defect
      goName: Defect
      description: CreateTemplate defect outcome.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: sync
      repeatOnUnknown: limited
      dispatchFence: true
      maxSends: 3
    mocks:
    - name: createTemplateDefault
      branch: created
      description: Representative Postmark template response.
      default: true
      output:
        templateId: 1234
        name: Welcome
        alias: dex-1234
        active: true
  - name: updateTemplate
    goName: UpdateTemplate
    inputType: UpdateTemplateInput
    outputType: Template
    kind: mutation
    description: UpdateTemplate through the Postmark server-token Templates API.
    idempotency: required
    authorization: required
    branches:
    - id: updated
      goName: Updated
      description: UpdateTemplate updated outcome.
    - id: providerRejected
      goName: ProviderRejected
      description: UpdateTemplate providerRejected outcome.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: UpdateTemplate invalidResponse outcome.
      optional: true
    - id: defect
      goName: Defect
      description: UpdateTemplate defect outcome.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
      repeatOnUnknown: safe
    mocks:
    - name: updateTemplateDefault
      branch: updated
      description: Representative Postmark template response.
      default: true
      output:
        templateId: 1234
        name: Welcome revised
        alias: welcome-v1
        active: true
  - name: deleteTemplate
    goName: DeleteTemplate
    inputType: DeleteTemplateInput
    outputType: DeletedTemplate
    kind: mutation
    description: DeleteTemplate through the Postmark server-token Templates API.
    idempotency: required
    authorization: required
    branches:
    - id: deleted
      goName: Deleted
      description: DeleteTemplate deleted outcome.
    - id: providerRejected
      goName: ProviderRejected
      description: DeleteTemplate providerRejected outcome.
      optional: true
    - id: defect
      goName: Defect
      description: DeleteTemplate defect outcome.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
      repeatOnUnknown: safe
    mocks:
    - name: deleteTemplateDefault
