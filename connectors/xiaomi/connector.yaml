apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: xiaomi
  displayName: Xiaomi MiMo
  description: List Xiaomi MiMo model IDs available to an API Key.
  company: xiaomi
  categories: [ai, developer-tools]
  version: v0.1.0
spec:
  provider: xiaomi
  codegen:
    go:
      package: xiaomi
  configuration:
    fields:
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one Xiaomi model-list HTTP request as a positive Go duration such as 5s or 1m. Blank uses the displayed default; increase only for a slow approved network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum model-list response size in bytes as a positive integer. Blank uses the displayed default; increase only if the provider adds more model metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: xiaomi-api-key
    fields:
      - name: apiKey
        goName: APIKey
        type: secretString
        required: true
        description: Secret sk- prefixed pay-as-you-go MiMo API Key from https://platform.xiaomimimo.com > Console > API Keys. Create and copy the Key into Dex Connections; blank prevents requests.
    guide:
      startURL: https://mimo.mi.com/docs/zh-CN/quick-start/faq/api-integration
      steps:
        - Sign in at https://platform.xiaomimimo.com with a Xiaomi account, open Console > API Keys, create a pay-as-you-go API Key in sk- format, and copy the secret into Dex Connections. The field is required; blank prevents requests.
        - Start ListModels with {}. The connector calls the fixed pay-as-you-go MiMo HTTPS API and returns at most the first 50 model IDs. It does not call inference or expose model metadata. Leave timeout and maxResponseBytes blank for displayed defaults.
        - Use a pay-as-you-go sk- Key, not a tp- Token Plan Key; Token Plan uses a separate base URL. Manage or revoke the sk- Key from Console > API Keys.
  operations:
    - name: listModels
      goName: ListModels
      inputType: ListModelsInput
      outputType: ListModelsOutput
      kind: query
      description: List up to 50 model IDs enabled for the API Key.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Xiaomi returned the available model list.}
        - {id: providerRejected, goName: ProviderRejected, description: Xiaomi rejected the Key or request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Xiaomi returned malformed or oversized model data., optional: true}
        - {id: defect, goName: Defect, description: The local API Key is invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: oneModel
          branch: found
          description: One available API model ID.
          default: true
          output: {total: 1, modelIDs: [mimo-v2.6-flash]}
        - name: noModels
          branch: found
          description: No models are enabled for the Key.
          output: {total: 0, modelIDs: []}
