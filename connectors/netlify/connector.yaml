apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: netlify
  displayName: Netlify
  description: "List and inspect Netlify sites and deploys, delete sites, and cancel deploys through typed Dex connector Steps."
  company: Netlify
  categories: [developer-tools]
  version: v0.3.0
spec:
  provider: netlify
  languages:
    python:
      version: v0.1.0
      operations: [listSites, listDeploys]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-netlify'
      operations: [listSites, listDeploys]
      triggers: []
  codegen:
    go:
      package: netlify
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: "Netlify REST API base URL. Leave blank for the displayed provider endpoint; override only for a compatible HTTPS gateway or loopback test server."
        default: https://api.netlify.com/api/v1
      - name: timeout
        goName: Timeout
        type: duration
        description: "Positive Go duration bounding one HTTP request; leave blank for the displayed default, or override for a slower network."
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Positive byte limit for one response; leave blank for the displayed default, or override for larger pages."
        default: 2097152
  auth:
    type: apiKey
    connectionKind: netlify-api-key
    fields:
      - name: access_token
        goName: AccessToken
        type: secretString
        description: "Secret Netlify personal access token from User settings > Applications > Personal access tokens at https://app.netlify.com/user/applications#personal-access-tokens. Generate a token, grant team access when required by SSO, and copy it. Blank prevents requests."
        required: true
    guide:
      startURL: https://app.netlify.com/user/applications#personal-access-tokens
      steps:
        - "Open https://app.netlify.com/user/applications#personal-access-tokens and under User settings > Applications > Personal access tokens choose New access token."
        - "Grant access to the intended team when SSO requires it, then copy the secret token into access_token. Leave baseUrl, timeout, and maxResponseBytes blank unless changing their displayed defaults."
  operations:
    - name: listSites
      goName: ListSites
      inputType: ListSitesInput
      outputType: SitesPage
      kind: query
      description: "List sites visible to the Netlify token."
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "List sites visible to the Netlify token."}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: listedDefault
          branch: listed
          description: "A Meridian example returns a representative SitesPage."
          default: true
          output: {"sites":[{"id":"site-meridian","name":"meridian-web","url":"https://meridian.netlify.app","admin_url":"https://app.netlify.com/sites/meridian-web"}]}
    - name: listDeploys
      goName: ListDeploys
      inputType: ListDeploysInput
      outputType: DeploysPage
      kind: query
      description: "List deploys for one Netlify site."
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "List deploys for one Netlify site."}
        - {id: notFound, goName: NotFound, description: The requested resource does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: listedDefault
          branch: listed
          description: "A Meridian example returns a representative DeploysPage."
          default: true
          output: {"deploys":[{"id":"deploy-meridian","site_id":"site-meridian","state":"ready","url":"https://meridian.netlify.app"}]}
    - name: getSite
      goName: GetSite
      inputType: GetSiteInput
      outputType: Site
      kind: query
      description: "Get one Netlify site by Project ID."
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: The site was found.}
        - {id: notFound, goName: NotFound, description: The site was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      mocks:
        - {name: foundDefault, branch: found, description: A Meridian example site., default: true, output: {id: site-meridian, name: meridian-web, url: "https://meridian.netlify.app"}}
    - name: getDeploy
      goName: GetDeploy
      inputType: GetDeployInput
      outputType: Deploy
      kind: query
      description: "Get one deploy for a Netlify site."
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: The deploy was found.}
        - {id: notFound, goName: NotFound, description: The deploy was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      mocks:
        - {name: foundDefault, branch: found, description: A Meridian example deploy., default: true, output: {id: deploy-meridian, site_id: site-meridian, state: ready}}
    - name: deleteSite
      goName: DeleteSite
      inputType: DeleteSiteInput
      outputType: DeletedSite
      kind: mutation
      description: "Delete one Netlify site by Project ID."
      idempotency: required
      authorization: required
      branches:
        - {id: deleted, goName: Deleted, description: The site was deleted.}
        - {id: notFound, goName: NotFound, description: The site was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      mocks:
        - {name: deletedDefault, branch: deleted, description: A Meridian example site deletion., default: true, output: {siteId: site-meridian}}
    - name: cancelDeploy
      goName: CancelDeploy
      inputType: CancelDeployInput
      outputType: Deploy
      kind: mutation
      description: "Cancel one Netlify deploy."
      idempotency: required
      authorization: required
      branches:
        - {id: cancelled, goName: Cancelled, description: The deploy was cancelled.}
        - {id: notFound, goName: NotFound, description: The deploy was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      mocks:
        - {name: cancelledDefault, branch: cancelled, description: A Meridian example cancelled deploy., default: true, output: {id: deploy-meridian, site_id: site-meridian, state: cancelled}}
