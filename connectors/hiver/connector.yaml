apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: hiver
  displayName: Hiver
  description: "List Hiver shared inboxes and their conversations, read one conversation, set its status, assignee, and tags, add internal notes, and create shared reply drafts, keeping Hiver's own open, pending, and closed statuses."
  company: Hiver
  version: v0.23.0
spec:
  provider: hiver
  codegen:
    go:
      package: hiver
  configuration:
    fields:
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Largest Hiver API response body, in bytes, that one request reads; a larger response selects invalidResponse, or uncertain for addNote and createSharedDraft. Leave blank to keep the displayed safety limit; enter a positive integer only to change it, for example for conversation pages that list unusually many messages."
        required: false
        default: 4194304
      - name: requestIntervalMilliseconds
        goName: RequestIntervalMilliseconds
        type: integer
        description: "Shortest time, in milliseconds, between two Hiver API requests from this connection in one Worker. Hiver limits every account to one request per second and answers 429 above it, as https://developer.hiverhq.com/hiver-api describes. Leave blank to keep the displayed spacing. Enter an integer from 1 to 60000: a larger value leaves room for other integrations on the same account, and a smaller one only makes sense after Hiver support has raised your account's rate limit."
        required: false
        default: 1000
  auth:
    type: apiKey
    connectionKind: hiver-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: "Secret Hiver API key that the connector sends as a bearer token to https://api2.hiverhq.com/v1. A Hiver admin creates it at https://v2.hiverhq.com/ > Admin Panel > Integrations > Developer APIs > Create an API key, turns on the app's toggle, and copies the key with the copy icon. It is an opaque string of letters, digits, and punctuation without spaces. Stored only in this credential field; after deleting a compromised key in Hiver, create a new one and paste it here."
        required: true
    guide:
      startURL: https://v2.hiverhq.com/
      steps:
        - "Sign in to Hiver at https://v2.hiverhq.com/, or open Hiver from Gmail, as a Hiver admin; only admins can create API keys, and every key acts with admin access to all shared inboxes of the account. The Pro and Elite plans include API access, as does the trial."
        - "Open Admin Panel > Integrations > Developer APIs and choose Create an API key; https://help.hiverhq.com/hiver-api/hiver-api shows the same steps."
        - "Enter an app name such as Dex, choose Create and generate API key, turn on the app's toggle to enable it, and copy the key with the copy icon into api_key below."
        - "Hiver allows one request per second and 5000 requests per day per account; the connector spaces its own requests, and a busier account asks Hiver support for a higher limit."
        - "To revoke access, delete the app's API key under Admin Panel > Integrations > Developer APIs; requests with a deleted key are rejected."
  operations:
    - name: listInboxes
      goName: ListInboxes
      inputType: ListInboxesInput
      outputType: ListInboxesOutput
      kind: query
      description: "List one page of the account's Hiver shared inboxes with their IDs, names, and email addresses, and the token of the next page."
      idempotency: none
      branches:
        - {id: listed, goName: Listed, description: "Hiver returned one page of shared inboxes; it may be empty."}
        - {id: providerRejected, goName: ProviderRejected, description: "Hiver conclusively rejected the request, such as an invalid or disabled API key or an account without API access.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Hiver returned a malformed or oversized page.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      pagination: {inputField: pageToken, nextField: nextPageToken}
      mocks:
        - name: listedDefaultAnswer
          branch: listed
          description: "For an empty pageToken or the following inbox token, returns three pages with support@acme.example.com on the last page."
          default: true
          pages:
            - {inboxes: [{id: "201", displayName: Billing, email: billing@acme.example.com, channelType: email, isAuthorized: true}], nextPageToken: inboxes-2}
            - {inboxes: [{id: "201", displayName: Billing, email: billing@acme.example.com, channelType: email, isAuthorized: true}, {id: "202", displayName: Sales, email: sales@acme.example.com, channelType: email, isAuthorized: true}], nextPageToken: inboxes-3}
            - {inboxes: [{id: "105902", displayName: Support, email: support@acme.example.com, channelType: email, isAuthorized: true}]}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "For an invalid API key, Hiver returns HTTP 401 before listing inboxes."
          failure: {kind: AUTHENTICATION, message: "Hiver rejected the request (HTTP 401)."}
        - name: invalidResponseFailure
          branch: invalidResponse
          description: "For an empty pageToken, Hiver returned malformed inbox JSON."
          failure: {kind: PROTOCOL, message: "Hiver returned malformed inbox JSON."}
    - name: listConversations
      goName: ListConversations
      inputType: ListConversationsInput
      outputType: ListConversationsOutput
      kind: query
      description: "List one page of up to 100 conversations of one shared inbox with their Hiver status, assignee, and tag IDs, and the token of the next page."
      idempotency: none
      branches:
        - {id: listed, goName: Listed, description: "Hiver returned one page of the inbox's conversations; it may be empty."}
        - {id: notFound, goName: NotFound, description: "The shared inbox does not exist or is not visible to the API key.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Hiver conclusively rejected the request, such as an invalid API key or an expired page token.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Hiver returned a malformed or oversized page.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      pagination: {inputField: pageToken, nextField: nextPageToken}
      mocks:
        - name: listedDefaultAnswer
          branch: listed
          description: "For inboxId 105902 and successive pageToken values, returns two filtered pages before one open unassigned conversation."
          default: true
          pages:
            - {conversations: [{id: "573741350", inboxId: "105902", status: closed, tagIds: []}], nextPageToken: conversations-2}
            - {conversations: [{id: "573741350", inboxId: "105902", status: closed, tagIds: []}, {id: "573741351", inboxId: "105902", status: open, assignee: {type: user, id: "456343"}, tagIds: []}], nextPageToken: conversations-3}
            - {conversations: [{id: "573741352", inboxId: "105902", status: open, tagIds: []}]}
        - name: notFoundFailure
          branch: notFound
          description: "The shared inbox does not exist or is not visible to the API key."
          failure: {kind: NOT_FOUND, message: "The shared inbox does not exist or is not visible to the API key."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "For an invalid API key, Hiver returns HTTP 401 before listing conversations."
          failure: {kind: AUTHENTICATION, message: "Hiver rejected the request (HTTP 401)."}
        - name: invalidResponseFailure
          branch: invalidResponse
          description: "For inboxId 105902, Hiver returned malformed conversation-page JSON."
          failure: {kind: PROTOCOL, message: "Hiver returned malformed conversation-page JSON."}
    - name: getConversation
      goName: GetConversation
      inputType: GetConversationInput
      outputType: ConversationDetails
      kind: query
      description: "Read one conversation of a shared inbox by Hiver conversation ID or Gmail thread ID, with its status, assignee, tag IDs, and message IDs."
      idempotency: none
      branches:
        - {id: found, goName: Found, description: "Hiver returned the conversation."}
        - {id: notFound, goName: NotFound, description: "The conversation or shared inbox does not exist or is not visible to the API key.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Hiver conclusively rejected the read, such as an invalid API key.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Hiver returned a malformed or oversized conversation.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: foundDefaultAnswer
          branch: found
          description: "For inboxId 105902 and conversationId 573741352, returns the still-open unassigned conversation and one source message."
          default: true
          output: {conversation: {id: "573741352", inboxId: "105902", status: open, tagIds: []}, messages: [{hiverMessageId: "834466048", gmailMessageId: "19cfee91188070f8"}]}
        - name: notFoundFailure
          branch: notFound
          description: "The conversation or shared inbox does not exist or is not visible to the API key."
          failure: {kind: NOT_FOUND, message: "The conversation or shared inbox does not exist or is not visible to the API key."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "For an invalid API key, Hiver returns HTTP 401 before reading the conversation."
          failure: {kind: AUTHENTICATION, message: "Hiver rejected the request (HTTP 401)."}
        - name: invalidResponseFailure
          branch: invalidResponse
          description: "For conversationId 573741352, Hiver returned malformed conversation JSON."
          failure: {kind: PROTOCOL, message: "Hiver returned malformed conversation JSON."}
    - name: updateConversation
      goName: UpdateConversation
      inputType: UpdateConversationInput
      outputType: UpdateConversationOutput
      kind: mutation
      description: "Set the Hiver status or assignee of one conversation and apply or remove tags by name, then read the conversation back; a repeated attempt sends the same absolute change again."
      idempotency: required
      branches:
        - {id: updated, goName: Updated, description: "The conversation, read back after the change, holds the requested status, assignee, and tags."}
        - {id: notFound, goName: NotFound, description: "The conversation or shared inbox does not exist or is not visible to the API key.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Hiver conclusively rejected the change, or the assignee email or a tag name was not found in the shared inbox; this attempt changed nothing, though an earlier attempt that ended unconfirmed may have applied the change.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Hiver returned a malformed or oversized user, tag, or conversation response, or rejected the read-back after accepting the change, so part or all of the change may have been applied.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 60s
        durability: async
      mocks:
        - name: updatedDefaultAnswer
          branch: updated
          description: "For the claim of conversation 573741352 by phoebe@acme.example.com with Claimed, returns the assigned tagged conversation."
          default: true
          output: {conversation: {id: "573741352", inboxId: "105902", status: open, assignee: {type: user, id: "456342"}, tagIds: ["784268"]}, assigneeUserId: "456342", appliedTags: [{id: "784268", name: Claimed}]}
        - name: notFoundFailure
          branch: notFound
          description: "The conversation or shared inbox does not exist or is not visible to the API key."
          failure: {kind: NOT_FOUND, message: "The conversation or shared inbox does not exist or is not visible to the API key."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "For an assigneeEmail absent from inbox users, the connector rejects the change before PATCH."
          failure: {kind: VALIDATION, message: "assigneeEmail matches 0 users of the shared inbox instead of one; the change was not sent"}
        - name: invalidResponseFailure
          branch: invalidResponse
          description: "For conversationId 573741352, Hiver returned malformed conversation JSON during read-back after accepting the change."
          failure: {kind: PROTOCOL, message: "Hiver returned malformed conversation JSON during read-back after accepting the change."}
    - name: addNote
      goName: AddNote
      inputType: AddNoteInput
      outputType: AddNoteOutput
      kind: mutation
      description: "Add one internal note, visible only to Hiver users, to a conversation. The shared single-dispatch fence requires sync durability so retry attempts can read its heartbeat checkpoint. Hiver documents no idempotency key or note read-back, so ambiguous sends remain uncertain."
      idempotency: required
      branches:
        - {id: added, goName: Added, description: "Hiver added the note and returned it."}
        - {id: notFound, goName: NotFound, description: "The conversation or shared inbox does not exist or is not visible to the API key; nothing was added.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Hiver conclusively rejected the note; nothing was added.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "The note may exist: Hiver's answer was lost, unreadable, 408, 409, another server error besides 503, or an earlier attempt may have sent it. The Step does not send it again.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 5, totalDuration: 5m, reason: {kind: duplicateWriteRisk, explanation: "Hiver has no provider key or note read-back by Call ID, and a lost checkpoint cannot prove that a repeat is safe."}}
      mocks:
        - name: addedDefaultAnswer
          branch: added
          description: "For a note on conversation 573741352, returns the internal note created by the claiming agent."
          default: true
          output: {note: {id: "35042650", conversationId: "573741352", authorId: "456342", authorEmail: phoebe@acme.example.com, createdAt: "2026-07-21T14:24:22Z"}}
        - name: notFoundFailure
          branch: notFound
          description: "The conversation or shared inbox does not exist or is not visible to the API key; nothing was added."
          failure: {kind: NOT_FOUND, message: "The conversation or shared inbox does not exist or is not visible to the API key; nothing was added."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "For invalid note content, Hiver returns HTTP 400 without adding a note."
          failure: {kind: VALIDATION, message: "Hiver rejected the request (HTTP 400)."}
    - name: createSharedDraft
      goName: CreateSharedDraft
      inputType: CreateSharedDraftInput
      outputType: SharedDraft
      kind: mutation
      description: "Create one shared reply draft for a Hiver user to review and send. The shared single-dispatch fence requires sync durability so retry attempts can read its heartbeat checkpoint. Hiver documents no idempotency key or draft read-back, so ambiguous sends remain uncertain."
      idempotency: required
      branches:
        - {id: created, goName: Created, description: "Hiver created the shared draft and returned its ID."}
        - {id: notFound, goName: NotFound, description: "The message or shared inbox does not exist or is not visible to the API key; no draft was created.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Hiver conclusively rejected the draft; no draft was created.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "The draft may exist: Hiver's answer was lost, unreadable, 408, 409, another server error besides 503, or an earlier attempt may have sent it. The Step does not send it again.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 5, totalDuration: 5m, reason: {kind: duplicateWriteRisk, explanation: "Hiver has no provider key or draft read-back by Call ID, and a lost checkpoint cannot prove that a repeat is safe."}}
      mocks:
        - name: createdDefaultAnswer
          branch: created
          description: "For the reply to message 834466048 in inbox 105902, returns a reviewable shared draft."
          default: true
          output: {id: "901", conversationId: "573741352", replyToHiverMessageId: "834466048"}
        - name: notFoundFailure
          branch: notFound
          description: "The message or shared inbox does not exist or is not visible to the API key; no draft was created."
          failure: {kind: NOT_FOUND, message: "The message or shared inbox does not exist or is not visible to the API key; no draft was created."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "For a draft body Hiver rejects, HTTP 400 leaves no shared draft."
          failure: {kind: VALIDATION, message: "Hiver rejected the request (HTTP 400)."}
