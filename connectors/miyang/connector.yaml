apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: miyang
  displayName: Miyang Model Catalog
  description: List the model IDs visible to a Miyang Gateway API Key.
  company: Miyang
  categories: [ai, developer-tools]
  version: v0.1.0
spec:
  provider: miyang
  codegen:
    go:
      package: miyang
  configuration:
    fields:
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one HTTPS model-list request as a positive Go duration such as 5s or 1m. Blank uses the displayed default; increase only for a slow approved network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum model-list response size in bytes as a positive integer. Blank uses the displayed default; increase only if the provider adds more model metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: miyang-api-key
    fields:
      - name: apiKey
        goName: APIKey
        type: secretString
        required: true
        description: Secret miyang- prefixed API Key from https://miyang.cn/model > API Keys. Create and copy a key in the console; blank prevents account-specific model discovery.
    guide:
      startURL: https://miyang.cn/model/docs
      steps:
        - Sign in at https://miyang.cn/model and open API Keys in the console. Create or copy the secret miyang- prefixed key into Dex Connections; blank prevents account-specific model discovery.
        - Start ListModels with {}. The connector calls the fixed HTTPS GET /api/v1/models endpoint and returns at most the first 50 model IDs visible to this Key. It does not call inference or expose model metadata.
        - Leave timeout and maxResponseBytes blank for their displayed defaults. The public endpoint is also callable without a Key, but the Key is needed to see account-specific internal or whitelisted models.
  operations:
    - name: listModels
      goName: ListModels
      inputType: ListModelsInput
      outputType: ListModelsOutput
      kind: query
      description: List up to 50 model IDs visible to the API Key.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Miyang returned the available model list.}
        - {id: providerRejected, goName: ProviderRejected, description: Miyang rejected the Key or request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Miyang returned malformed or oversized model data., optional: true}
        - {id: defect, goName: Defect, description: The local API Key is invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: oneModel
          branch: found
          description: One available API model ID.
          default: true
          output: {total: 1, modelIDs: [miyang/auto]}
        - name: noModels
          branch: found
          description: No models are enabled for the Key.
          output: {total: 0, modelIDs: []}
