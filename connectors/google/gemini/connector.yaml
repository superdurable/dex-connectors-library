apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: gemini
  displayName: Gemini
  description: Google Gemini API text generation with JSON Schema structured output, thinking budgets, token usage, and explicit safety outcomes.
  company: Google
  version: v0.2.0
spec:
  provider: google
  codegen:
    go:
      package: gemini
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "Gemini model for this connection, such as gemini-3.5-flash-lite or gemini-3.8-flash. Blank uses gemini-3.5-flash-lite. A request that names a model overrides it."
        required: false
        default: gemini-3.5-flash-lite
      - name: endpoint
        goName: Endpoint
        type: url
        description: Gemini API base endpoint. HTTPS is required except for loopback test servers.
        required: false
        default: https://generativelanguage.googleapis.com/v1beta
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum total provider response size. A larger response selects invalidResponse.
        required: false
        default: 8388608
  auth:
    type: apiKey
    connectionKind: gemini-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: Gemini API key from Google AI Studio, sent only in the x-goog-api-key header.
        required: true
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, gemini.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      # The OpenAI-compatible list accepts the API key as a bearer token, which
      # the Dex Web broker injects; the native list needs x-goog-api-key.
      - id: listModels
        capability: gemini.models-list
        request:
          method: GET
          url: https://generativelanguage.googleapis.com/v1beta/openai/models
          credential: {field: api_key, scheme: bearer}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: Choose one Step's Gemini model from Gemini's live model list.
        backendCapabilities: [gemini.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: generateContent
      goName: GenerateContent
      inputType: GenerateContentRequest
      outputType: GenerateContentResponse
      kind: query
      description: Generate text or JSON Schema structured output with a Gemini model through the stateless models.generateContent method.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: Gemini finished the first candidate normally and returned its text.}
        - {id: truncated, goName: Truncated, description: Gemini stopped the first candidate at the output token limit and returned any partial text., optional: true}
        - {id: blocked, goName: Blocked, description: "Gemini blocked the prompt or stopped the candidate for safety, recitation, or another content policy.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Gemini conclusively rejected the request, such as an invalid argument, a denied permission, or an unknown model.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Gemini returned a malformed, oversized, or unusable response, such as no candidate or an unrecognized finish reason.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        # A non-streaming generation is silent until Gemini returns, so the
        # heartbeat timeout covers the whole healthy attempt.
        executeMethodTimeout: 300s
        heartbeatTimeout: 300s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 5, totalDuration: 10m}
