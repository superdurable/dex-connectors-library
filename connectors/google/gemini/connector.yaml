apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: gemini
  displayName: Gemini
  description: "Google Gemini API models.generateContent as a native Query, with Gemini's own contents, JSON Schema structured output, thinking budget, token usage, and explicit safety outcomes. Provider-neutral text generation Steps use the llm connector."
  company: Google
  version: v0.21.0
spec:
  provider: google
  codegen:
    go:
      package: gemini
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "Gemini model ID from Google AI Studio's model list, such as gemini-3.5-flash-lite or gemini-3.8-flash, that generateContent uses when its request names none; a request's model overrides it. Blank uses the displayed default."
        required: false
        default: gemini-3.5-flash-lite
      - name: endpoint
        goName: Endpoint
        type: url
        description: Gemini API base URL; leave blank for Google's public v1beta endpoint. Enter an absolute HTTPS URL only for a compatible gateway, or a loopback URL for tests.
        required: false
        default: https://generativelanguage.googleapis.com/v1beta
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete provider response in bytes; enter a positive integer only when a gateway needs a different safety limit. Larger responses select invalidResponse.
        required: false
        default: 8388608
  auth:
    type: apiKey
    connectionKind: gemini-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: Secret Gemini API key from Google AI Studio > API keys; copy the generated key. It is sent only in the x-goog-api-key header.
        required: true
    guide:
      startURL: https://aistudio.google.com/api-keys
      steps:
        - Open Google AI Studio > API keys and select or import the Google Cloud project that should own usage.
        - Choose Create API key, finish any billing prompt required by the selected tier, and copy the generated secret.
        - Leave endpoint, model, and response-limit fields blank to use their displayed defaults unless a compatible gateway or pinned model is required.
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, gemini.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      # The native list reports supportedGenerationMethods. Dex Web through
      # cli-v0.13.8 rejects the header scheme before sending, so the bundle
      # falls back to the OpenAI-compatible list, which accepts a bearer key.
      - id: listModels
        capability: gemini.models-list
        request:
          method: GET
          url: https://generativelanguage.googleapis.com/v1beta/models
          credential: {field: api_key, scheme: header, header: x-goog-api-key}
          fixedQuery: {pageSize: "1000"}
          parameters:
            - {name: pageToken, location: query, target: pageToken}
      - id: listOpenAICompatibleModels
        capability: gemini.models-list
        request:
          method: GET
          url: https://generativelanguage.googleapis.com/v1beta/openai/models
          credential: {field: api_key, scheme: bearer}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: Select this Step's Gemini model; the picker loads Gemini's live models list and stores the selected model ID.
        backendCapabilities: [gemini.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: generateContent
      goName: GenerateContent
      inputType: GenerateContentRequest
      outputType: GenerateContentResponse
      kind: query
      description: Generate text or JSON Schema structured output with a Gemini model through the stateless models.generateContent method.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: Gemini finished the first candidate normally and returned its text.}
        - {id: truncated, goName: Truncated, description: Gemini stopped the first candidate at the output token limit and returned any partial text., optional: true}
        - {id: blocked, goName: Blocked, description: "Gemini blocked the prompt or stopped the candidate for safety, recitation, or another content policy.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Gemini conclusively rejected the request, such as an invalid argument, a denied permission, or an unknown model.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Gemini returned a malformed, oversized, or unusable response, such as no candidate or an unrecognized finish reason.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        # A non-streaming generation is silent until Gemini returns, so the
        # heartbeat timeout covers the whole healthy attempt.
        executeMethodTimeout: 300s
        heartbeatTimeout: 300s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 5, totalDuration: 10m}
