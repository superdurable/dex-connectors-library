apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: gmail
  displayName: Gmail
  description: Start and update Dex Flows from received Gmail messages, read messages, and send or reply to email.
  company: Google
  version: v0.21.0
spec:
  provider: google
  codegen:
    go:
      package: gmail
  configuration:
    fields:
      - name: endpoint
        goName: Endpoint
        type: url
        description: Gmail API base URL; leave blank for Google's public v1 API. Enter an absolute HTTPS URL only for an explicitly supported compatible gateway.
        required: false
        default: https://gmail.googleapis.com/gmail/v1
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete Gmail API response in bytes; enter a positive integer only to change the safety limit. Oversized responses select invalidResponse.
        required: false
        default: 1048576
      - name: maxMessageBytes
        goName: MaxMessageBytes
        type: integer
        description: Maximum base64url-encoded RFC 5322 message size in bytes accepted for send or reply operations; enter a positive integer only to change the safety limit.
        required: false
        default: 10485760
      - name: pollInterval
        goName: PollInterval
        type: duration
        description: Delay between local Gmail Trigger polls, using a positive Go duration such as 10s or 1m; shorter intervals increase Gmail API usage.
        required: false
        default: 10s
      - name: pollPageSize
        goName: PollPageSize
        type: integer
        description: Positive count of recent inbox messages inspected per Trigger poll; increase only when matching mail may fall outside the displayed default window.
        required: false
        default: 25
  auth:
    refreshable: true
    defaultMethod: google-oauth
    methods:
      - id: google-oauth
        displayName: Google OAuth
        description: Recommended for personal Gmail and ordinary Google Workspace users; Dex opens Google consent and refreshes short-lived access tokens automatically.
        recommended: true
        type: oauth2
        connectionKind: gmail-google-oauth
        fields:
          - name: oauth_client_id
            goName: OAuthClientID
            type: string
            description: Non-secret OAuth client ID copied from https://console.cloud.google.com/apis/credentials after opening APIs & Services > Credentials > OAuth 2.0 Client IDs; the value ends in .apps.googleusercontent.com and blank means authorization cannot start.
            required: true
          - name: oauth_client_secret
            goName: OAuthClientSecret
            type: secretString
            description: Secret OAuth client secret copied once from the selected Web application at https://console.cloud.google.com/apis/credentials; store it only in the credential form and blank means authorization cannot start.
            required: true
          - name: access_token
            goName: AccessToken
            type: secretString
            description: Secret short-lived access token returned by Google after consent; Dex derives it automatically and refreshes it before expiry, so never enter it manually.
            required: true
          - name: refresh_token
            goName: RefreshToken
            type: secretString
            description: Secret long-lived refresh token returned by Google because offline access is requested; Dex stores and rotates it automatically, and blank means reauthorization is required.
            required: true
          - name: primary_email
            goName: PrimaryEmail
            type: string
            description: Verified primary Google email derived automatically from https://openidconnect.googleapis.com/v1/userinfo after checking email_verified; this is read-only and never a free-text account selector.
            required: true
        guide:
          startURL: https://console.cloud.google.com/apis/credentials
          steps:
            - Select a Google Cloud project, open APIs & Services > Library, search Gmail API, and select Enable.
            - Open Google Auth Platform > Branding, Audience, and Data Access; add the displayed scopes and add test users while External apps remain in Testing.
            - Open APIs & Services > Credentials > Create credentials > OAuth client ID > Web application, add the exact Dex Redirect URI, then copy the client ID and client secret into their secret-safe fields.
            - Complete consent with the Gmail or Workspace account that owns the mailbox; Google Testing refresh tokens can expire after seven days, so publish the app or use an Internal Workspace audience for long-lived use.
        oauth2:
          authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth
          tokenEndpoint: https://oauth2.googleapis.com/token
          authorizationParameters: {access_type: offline, prompt: consent}
          clientIDCredential: oauth_client_id
          clientSecretCredential: oauth_client_secret
          scopes: [openid, https://www.googleapis.com/auth/userinfo.email, https://www.googleapis.com/auth/gmail.readonly, https://www.googleapis.com/auth/gmail.send]
          credentialMappings:
            - {credential: access_token, source: access_token}
            - {credential: refresh_token, source: refresh_token}
          credentialDerivations:
            - {credential: primary_email, endpoint: https://openidconnect.googleapis.com/v1/userinfo, source: email, verifiedBy: email_verified}
          pkce: true
      - id: workspace-domain-delegation
        displayName: Workspace domain-wide delegation
        description: Advanced administrator-only method for a Google Workspace domain; the service account mints delegated user tokens without interactive consent.
        type: serviceAccount
        connectionKind: gmail-workspace-domain-delegation
        fields:
          - name: service_account_key
            goName: ServiceAccountKey
            type: secretString
            description: Secret service-account JSON key downloaded from https://console.cloud.google.com/iam-admin/serviceaccounts after selecting the account > Keys > Add key > Create new key > JSON; blank means delegated token minting cannot start.
            required: true
          - name: delegated_user
            goName: DelegatedUser
            type: string
            description: Complete Workspace mailbox address selected by an administrator after authorizing the service account client ID at https://admin.google.com/ac/owl/domainwidedelegation; the value must be one user@example.com address and blank means no mailbox can be impersonated.
            required: true
          - name: access_token
            goName: AccessToken
            type: secretString
            description: Secret short-lived delegated access token minted automatically from the service-account assertion; never paste a token and blank causes Dex to mint one before the next call.
            required: false
          - name: primary_email
            goName: PrimaryEmail
            type: string
            description: Read-only mailbox identity copied automatically from delegated_user after the administrator-managed setup is validated; do not enter a different sender.
            required: false
        guide:
          startURL: https://console.cloud.google.com/iam-admin/serviceaccounts
          steps:
            - Select the Workspace-owned Google Cloud project, create a service account, open Details > Show advanced settings, and enable Google Workspace domain-wide delegation.
            - Open the service account > Keys > Add key > Create new key > JSON, download the one-time private key, and paste the complete JSON document into the secret field.
            - Copy the service account OAuth 2 Client ID, then open https://admin.google.com/ac/owl/domainwidedelegation and add that client ID with the displayed Gmail readonly and send scopes.
            - Enter one managed Workspace mailbox as delegated_user; personal @gmail.com accounts and Workspace users without administrator-approved delegation cannot use this method.
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [oauth.connection.manage, use.configuration.write]
      mockScenarios: [not-configured, authorization-pending, connected, insufficient-scope, revoked, broker-unavailable, ready]
      icon: icon.svg
    units:
      - id: searchQueryInput
        goName: SearchQueryInput
        description: Enter a Gmail search query using Gmail search operators; leave blank to inspect recent inbox messages without an additional query.
        outputs:
          - {name: query, goName: Query, type: string}
      - id: emailListInput
        goName: EmailListInput
        description: Enter one or more complete email addresses used to restrict matching senders.
        outputs:
          - {name: emails, goName: Emails, type: stringList}
      - id: textInput
        goName: TextInput
        description: Enter the literal email body to send, or plain text that an incoming message must contain, depending on the operation or Trigger label.
        outputs:
          - {name: text, goName: Text, type: string}
  triggers:
    - name: messageReceived
      goName: MessageReceived
      eventType: MessageEvent
      configurationType: MessageReceivedTriggerConfiguration
      description: Receive a matching message that begins a Gmail thread.
    - name: replyReceived
      goName: ReplyReceived
      eventType: MessageEvent
      configurationType: ReplyReceivedTriggerConfiguration
      description: Receive a matching reply in an existing Gmail thread.
  operations:
    - name: getMessage
      goName: GetMessage
      inputType: GetMessageInput
      outputType: Message
      kind: query
      description: Read one Gmail message with decoded text and HTML bodies.
      idempotency: none
      branches:
        - {id: read, goName: Read, description: The Gmail message was read.}
        - {id: notFound, goName: NotFound, description: The Gmail message does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Gmail conclusively rejected the message query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Gmail returned an invalid or oversized message response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &gmailQueryExecution
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m}
    - name: sendMessage
      goName: SendMessage
      inputType: SendMessageInput
      outputType: SendMessageOutput
      kind: mutation
      description: Send one MIME message from the authorized primary account.
      idempotency: required
      branches:
        - {id: sent, goName: Sent, description: Gmail accepted the message and returned its identity.}
        - {id: providerRejected, goName: ProviderRejected, description: Gmail conclusively rejected the message., optional: true}
        - {id: uncertain, goName: Uncertain, description: The dispatched send outcome cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m}
    - name: replyToMessage
      goName: ReplyToMessage
      inputType: ReplyToMessageInput
      outputType: SendMessageOutput
      kind: mutation
      description: Reply to one Gmail message in its existing thread.
      idempotency: required
      branches:
        - {id: sent, goName: Sent, description: Gmail accepted the reply and returned its identity.}
        - {id: providerRejected, goName: ProviderRejected, description: Gmail conclusively rejected the reply., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Gmail returned an invalid or oversized source message response before sending the reply., optional: true}
        - {id: uncertain, goName: Uncertain, description: The dispatched reply outcome cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m}
