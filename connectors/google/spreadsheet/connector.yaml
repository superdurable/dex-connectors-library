apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: google-sheets
  displayName: Google Sheets
  description: Manage spreadsheets, sheets, rows, and ranges, and start Flows when rows are added in Google Sheets.
  company: Google
  categories: [productivity]
  version: v0.27.0
spec:
  provider: google
  languages:
    python:
      version: v0.2.0
      package: dex-connector-google-spreadsheet
      operations: [getValues, findRow, upsertRow]
      triggers: [rowAdded]
    typescript:
      version: v0.2.0
      package: '@superdurable/connector-google-sheets'
      operations: [getValues, findRow, upsertRow]
      triggers: [rowAdded]
  codegen:
    go:
      package: spreadsheet
  configuration:
    fields:
      - name: driveBaseUrl
        goName: DriveBaseURL
        type: url
        description: Google Drive API HTTPS origin for deleting a spreadsheet file. Blank uses the displayed Google endpoint; override only for a trusted test gateway.
        default: https://www.googleapis.com
      - name: endpoint
        goName: Endpoint
        type: url
        description: Google Sheets API base URL; leave blank for Google's public v4 API. Enter an absolute HTTPS URL only for an explicitly supported compatible gateway.
        required: false
        default: https://sheets.googleapis.com/v4
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete Google API response in bytes; enter a positive integer only to change the safety limit. Oversized responses select invalidResponse.
        required: false
        default: 4194304
      - name: maxRows
        goName: MaxRows
        type: integer
        description: Positive maximum row count inspected by FindRow and UpsertRow; increase only when the target sheet can exceed the displayed safety limit.
        required: false
        default: 10000
      - name: pollInterval
        goName: PollInterval
        type: duration
        description: Delay between rowAdded Trigger polls of each picked tab, as a Go duration of at least 1s such as 15s or 2m; each poll normally makes one Sheets read request, and Google allows 60 read requests per minute per user per project across every binding of the account.
        required: false
        default: 30s
      - name: pollPageSize
        goName: PollPageSize
        type: integer
        description: Rows after the last processed row that one rowAdded poll request reads, from 1 to 500; a poll that finds only blank rows in this window waits there, so increase it when people leave runs of blank rows below the data, not for busy tabs, since further rows are read by an immediate follow-up request.
        required: false
        default: 100
  auth:
    refreshable: true
    type: oauth2
    connectionKind: google-sheets-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        description: Non-secret OAuth client ID copied from https://console.cloud.google.com/apis/credentials after opening APIs & Services > Credentials > OAuth 2.0 Client IDs; the value ends in .apps.googleusercontent.com and blank means authorization or refresh cannot start.
        required: true
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        description: Secret OAuth client secret copied from the selected Web application at https://console.cloud.google.com/apis/credentials; store it only in the credential form and blank means authorization or refresh cannot start.
        required: true
      - name: access_token
        goName: AccessToken
        type: secretString
        description: Secret short-lived Google OAuth access token produced automatically after authorization and refreshed before expiry; do not enter it manually.
        required: true
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        description: Secret long-lived refresh token returned by Google because offline access is requested; Dex stores and rotates it automatically, and blank means reauthorization is required.
        required: true
    guide:
      startURL: https://console.cloud.google.com/apis/credentials
      steps:
        - Select a Google Cloud project, open APIs & Services > Library, and enable both Google Sheets API and Google Drive API.
        - In Google Auth Platform, configure Branding, Audience, and Data Access for the drive.file scope; add test users while the app is in Testing.
        - Open Clients > Create client > Web application, add the exact Redirect URI shown below, then copy the client ID and one-time client secret.
        - Complete consent with the Google account that owns the spreadsheets; Google Testing refresh tokens can expire after seven days, so publish the app or use an Internal Workspace audience for long-lived use.
    oauth2:
      authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth
      tokenEndpoint: https://oauth2.googleapis.com/token
      authorizationParameters: {access_type: offline, prompt: consent}
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [https://www.googleapis.com/auth/drive.file]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      pkce: true
      refresh:
        tokenExchangeTimeout: 25s
        scopeSeparators: whitespaceAndComma
        missingExpiry: reject
        storedMissingExpiry: refresh
        terminalErrorCodes: [invalid_grant, invalid_client, unauthorized_client]
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [oauth.connection.manage, use.configuration.write, google.drive.spreadsheets-list, google.sheets.tabs-list]
      mockScenarios: [not-configured, authorization-pending, connected, insufficient-scope, revoked, broker-unavailable, ready]
      icon: icon.svg
    commands:
      - id: listSpreadsheets
        capability: google.drive.spreadsheets-list
        request:
          method: GET
          url: https://www.googleapis.com/drive/v3/files
          credential: {field: access_token, scheme: bearer}
          fixedQuery:
            q: "mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false"
            fields: "nextPageToken,files(id,name)"
            pageSize: "100"
          parameters:
            - {name: pageToken, location: query, target: pageToken}
      - id: listTabs
        capability: google.sheets.tabs-list
        request:
          method: GET
          url: https://sheets.googleapis.com/v4/spreadsheets/{spreadsheetId}
          credential: {field: access_token, scheme: bearer}
          fixedQuery: {fields: "sheets.properties.title"}
          parameters:
            - {name: spreadsheetId, location: path, target: spreadsheetId}
    units:
      - id: spreadsheetPicker
        goName: SpreadsheetPicker
        description: Select a spreadsheet returned by the authorized Google Drive account; the unit stores its provider spreadsheet ID and display name automatically.
        backendCapabilities: [google.drive.spreadsheets-list]
        outputs:
          - {name: spreadsheetId, goName: SpreadsheetID, type: string}
          - {name: spreadsheetName, goName: SpreadsheetName, type: string}
      - id: sheetTabPicker
        goName: SheetTabPicker
        description: Select a tab loaded from the chosen spreadsheet; choose the spreadsheet first so the unit can list its current tab titles.
        backendCapabilities: [google.sheets.tabs-list]
        inputs:
          - {name: spreadsheetId, goName: SpreadsheetID, type: string}
        outputs:
          - {name: tab, goName: Tab, type: string}
      - id: textInput
        goName: TextInput
        description: Enter the exact A1 range, lookup key, or cell value requested by the operation label; spreadsheet and tab IDs are selected by their dedicated units.
        outputs:
          - {name: text, goName: Text, type: string}
  triggers:
    - name: rowAdded
      goName: RowAdded
      eventType: RowAddedEvent
      configurationType: RowAddedTriggerConfiguration
      description: Receive each row appended below the last processed row of one picked spreadsheet tab.
  operations:
    - name: getSpreadsheet
      goName: GetSpreadsheet
      inputType: GetSpreadsheetInput
      outputType: SpreadsheetInfo
      kind: query
      description: Read spreadsheet title and sheet tabs without grid data.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Google returned spreadsheet metadata.}
        - {id: notFound, goName: NotFound, description: The spreadsheet is unavailable., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Google conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Google returned malformed metadata., optional: true}
        - {id: defect, goName: Defect, description: Local spreadsheet ID or credentials are invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: A Contacts spreadsheet is accessible., output: {spreadsheetId: sample-spreadsheet, title: Contacts, sheets: [{sheetId: 1, title: Contacts}]}}
    - name: createSpreadsheet
      goName: CreateSpreadsheet
      inputType: CreateSpreadsheetInput
      outputType: SpreadsheetInfo
      kind: mutation
      description: Create a spreadsheet with a title; duplicate creation is bounded by a send cap.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Google created the spreadsheet.}
        - {id: providerRejected, goName: ProviderRejected, description: Google conclusively rejected the create., optional: true}
        - {id: uncertain, goName: Uncertain, description: The send cap was reached without a returned spreadsheet ID., optional: true}
        - {id: defect, goName: Defect, description: Local title or credentials are invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: Google created a Contacts spreadsheet., output: {spreadsheetId: sample-spreadsheet, title: Contacts, sheets: [{sheetId: 1, title: Sheet1}]}}
    - name: deleteSpreadsheet
      goName: DeleteSpreadsheet
      inputType: DeleteSpreadsheetInput
      outputType: DeletedSpreadsheet
      kind: mutation
      description: Permanently delete an app-accessible spreadsheet file through Google Drive.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Google deleted the spreadsheet or it was already absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Google conclusively rejected the delete., optional: true}
        - {id: defect, goName: Defect, description: Local spreadsheet ID or credentials are invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: Google deleted the sample spreadsheet., output: {spreadsheetId: sample-spreadsheet}}
    - name: getValues
      goName: GetValues
      inputType: GetValuesInput
      outputType: GetValuesOutput
      kind: query
      description: Read one bounded A1 range.
      idempotency: none
      branches:
        - {id: read, goName: Read, description: The range was read.}
        - {id: notFound, goName: NotFound, description: The spreadsheet or range does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Google conclusively rejected the range read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Google returned an invalid or oversized range response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: contactsRange
          branch: read
          description: A contact range with its header and two rows.
          default: true
          output:
            range: Contacts!A1:C3
            majorDimension: ROWS
            values:
              - [email, name, status]
              - [ada@example.test, Ada Lovelace, active]
              - [grace@example.test, Grace Hopper, pending]
        - name: rangeNotFound
          branch: notFound
          description: The spreadsheet or range does not exist.
          failure: {kind: NOT_FOUND, message: The spreadsheet or range was not found.}
        - name: readRejected
          branch: providerRejected
          description: Google rejects a range read because the account lacks access.
          failure: {kind: AUTHORIZATION, message: Google Sheets rejected the range read.}
    - name: findRow
      goName: FindRow
      inputType: FindRowInput
      outputType: FindRowOutput
      kind: query
      description: Find exactly one row by a named key column and value.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: Exactly one matching row was found.}
        - {id: notFound, goName: NotFound, description: No matching row exists., optional: true}
        - {id: conflict, goName: Conflict, description: More than one matching row exists., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Google conclusively rejected the row query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Google returned an invalid or oversized row response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: contactFound
          branch: found
          description: One contact row matches the requested email key.
          default: true
          output:
            rowNumber: 2
            values: {email: ada@example.test, name: Ada Lovelace, status: active}
        - name: contactNotFound
          branch: notFound
          description: No contact row has the requested email key, and the answer carries no failure.
          output: {}
        - name: duplicateContacts
          branch: conflict
          description: Two rows have the same contact email key.
          output: {conflictingRows: [2, 4]}
          failure: {kind: CONFLICT, message: More than one contact row has the requested email key.}
        - name: findRejected
          branch: providerRejected
          description: Google rejects the row lookup because the account lacks access.
          failure: {kind: AUTHORIZATION, message: Google Sheets rejected the row lookup.}
    - name: upsertRow
      goName: UpsertRow
      inputType: UpsertRowInput
      outputType: UpsertRowOutput
      kind: mutation
      description: Query by a stable key and replace or append one row; synchronous durability persists the append dispatch fence before Google receives a non-repeatable write.
      idempotency: required
      branches:
        - {id: upserted, goName: Upserted, description: One row was inserted or updated.}
        - {id: conflict, goName: Conflict, description: Existing duplicate key rows prevent a safe write., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Google conclusively rejected the row write., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Google returned an invalid or oversized pre-write response., optional: true}
        - {id: uncertain, goName: Uncertain, description: The dispatched write outcome cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m, reason: {kind: duplicateWriteRisk, explanation: "A retry can append again when the preceding append is not yet visible to the key lookup, so bound upsertRow retries."}}
      mocks:
        - name: contactUpserted
          branch: upserted
          description: The contact already on row 2 of the Contacts tab is updated in place.
          default: true
          output: {action: updated, rowNumber: 2, updatedRange: "Contacts!A2:C2"}
        - name: duplicateKey
          branch: conflict
          description: Existing duplicate email keys prevent a safe upsert.
          failure: {kind: CONFLICT, message: More than one contact row has the requested email key.}
        - name: writeRejected
          branch: providerRejected
          description: Google rejects the contact upsert because the account lacks edit access.
          failure: {kind: AUTHORIZATION, message: Google Sheets rejected the contact upsert.}
