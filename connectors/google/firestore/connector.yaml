apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: google-firestore
  displayName: Cloud Firestore
  description: Read, query, create, replace, and delete Firestore documents and list root collections.
  company: Google
  categories: [databases-storage]
  version: v0.2.0
spec:
  provider: google-firestore
  languages:
    python:
      version: v0.1.0
      operations: [listDocuments]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-google-firestore'
      operations: [listDocuments]
      triggers: []
  codegen:
    go:
      package: firestore
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Firestore REST API HTTPS origin. Blank uses the displayed Google endpoint; override only for a trusted test gateway.
        default: https://firestore.googleapis.com
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; increase only for a slow gateway.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum complete JSON response in bytes. Blank uses the displayed default; increase only for unusually large document pages.
        default: 2097152
  auth:
    type: oauth2
    refreshable: true
    connectionKind: google-firestore-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        required: true
        description: Non-secret Client ID from https://console.cloud.google.com/apis/credentials > OAuth 2.0 Client IDs > your Web application. Blank prevents authorization or refresh.
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        required: true
        description: Secret Client Secret from the same Google Cloud Web application credentials page. Store only in Dex; blank prevents authorization or refresh.
      - name: access_token
        goName: AccessToken
        type: secretString
        required: true
        description: Secret Bearer token returned by Google consent and refreshed by Dex. Never enter it manually; blank requires authorization.
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        required: true
        description: Secret refresh token returned with offline consent. Dex rotates it on refresh; blank requires reauthorization.
    guide:
      startURL: https://console.cloud.google.com/apis/credentials
      steps:
        - Select a Google Cloud project and enable Cloud Firestore API in APIs & Services > Library. In Firestore > Databases > (default) > Documents, note the project ID and collection ID and confirm the Google account can view the collection.
        - In Google Auth Platform > Branding and Audience, configure consent and add test users if an External app remains in Testing. Under Data Access add the displayed datastore scope for document discovery.
        - Under Clients > Create client > Web application, register the exact redirect URI displayed by Dex Web. Copy the Client ID and one-time Client Secret into Dex Web, then authorize with offline access.
        - Supply the project ID and collection ID from Firestore > Databases > (default) > Documents to listDocuments. It returns full document names and nextPageToken; pass the latter for the next page.
        - For document writes, use the same project, collection, and document IDs. Enter Firestore REST Value JSON for fields, such as {"title":{"stringValue":"Hello"}}; never enter secrets. createDocument requires an unused document ID; putDocument replaces or creates that ID.
        - getDocument reads one document. runDocumentQuery accepts a Firestore structuredQuery JSON object from the Firestore REST reference. listRootCollections returns collection IDs under the default database.
        - Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults. Keep access and refresh tokens inside Dex.
    oauth2:
      authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth
      tokenEndpoint: https://oauth2.googleapis.com/token
      authorizationParameters: {access_type: offline, prompt: consent}
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [https://www.googleapis.com/auth/datastore]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      tokenEndpointAuthMethod: client_secret_post
      pkce: true
      refresh:
        tokenExchangeTimeout: 15s
        missingExpiry: reject
        storedMissingExpiry: refresh
        terminalErrorCodes: [invalid_grant, invalid_client, unauthorized_client]
  operations:
    - name: listDocumentDetails
      goName: ListDocumentDetails
      inputType: ListDocumentsInput
      outputType: DocumentDetailsPage
      kind: query
      description: List one page of documents with their Firestore field values.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Firestore returned a document content page.}
        - {id: providerRejected, goName: ProviderRejected, description: Firestore rejected the listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Firestore returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: The page input or connection is invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: Example document content is visible., output: {documents: [{name: 'projects/sample-project/databases/(default)/documents/events/sample-event', fieldsJson: '{"title":{"stringValue":"Hello"}}'}], nextPageToken: ''}}
    - name: getDocument
      goName: GetDocument
      inputType: GetDocumentInput
      outputType: FirestoreDocument
      kind: query
      description: Read one document in the default Firestore database.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Firestore returned the document.}
        - {id: notFound, goName: NotFound, description: The document does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Firestore rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Firestore returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: The document identity or connection is invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: Example document was found., output: {name: 'projects/sample-project/databases/(default)/documents/events/sample-event', fieldsJson: '{"title":{"stringValue":"Hello"}}'}}
    - name: createDocument
      goName: CreateDocument
      inputType: WriteDocumentInput
      outputType: FirestoreDocument
      kind: mutation
      description: Create a document with a chosen unused ID in the default database.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Firestore created the document.}
        - {id: alreadyExists, goName: AlreadyExists, description: The document ID is already in use., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Firestore rejected the create., optional: true}
        - {id: uncertain, goName: Uncertain, description: A prior create could not be confirmed after the send cap., optional: true}
        - {id: defect, goName: Defect, description: The document input or connection is invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: Example document was created., output: {name: 'projects/sample-project/databases/(default)/documents/events/sample-event', fieldsJson: '{"title":{"stringValue":"Hello"}}'}}
    - name: putDocument
      goName: PutDocument
      inputType: WriteDocumentInput
      outputType: FirestoreDocument
      kind: mutation
      description: Replace or create a document at a chosen ID with absolute field values.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: written, goName: Written, description: Firestore replaced or created the document.}
        - {id: providerRejected, goName: ProviderRejected, description: Firestore rejected the write., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Firestore returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: The document input or connection is invalid., optional: true}
      mocks:
        - {name: writtenDefault, branch: written, default: true, description: Example document was written., output: {name: 'projects/sample-project/databases/(default)/documents/events/sample-event', fieldsJson: '{"title":{"stringValue":"Hello"}}'}}
    - name: deleteDocument
      goName: DeleteDocument
      inputType: GetDocumentInput
      outputType: FirestoreDocument
      kind: mutation
      description: Delete a document at a chosen ID, treating absence as complete.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: The document is absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Firestore rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: The document identity or connection is invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: Example document is absent., output: {name: 'projects/sample-project/databases/(default)/documents/events/sample-event'}}
    - name: runDocumentQuery
      goName: RunDocumentQuery
      inputType: RunDocumentQueryInput
      outputType: QueriedDocuments
      kind: query
      description: Run a bounded structured query in the default database.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: queried, goName: Queried, description: Firestore returned query results.}
        - {id: providerRejected, goName: ProviderRejected, description: Firestore rejected the query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Firestore returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: The query input or connection is invalid., optional: true}
      mocks:
        - {name: queriedDefault, branch: queried, default: true, description: Example query returned one document., output: {documents: [{name: 'projects/sample-project/databases/(default)/documents/events/sample-event', fieldsJson: '{"title":{"stringValue":"Hello"}}'}]}}
    - name: listRootCollections
      goName: ListRootCollections
      inputType: ListRootCollectionsInput
      outputType: CollectionsPage
      kind: query
      description: List one page of root collection IDs in the default database.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Firestore returned collection IDs.}
        - {id: providerRejected, goName: ProviderRejected, description: Firestore rejected the listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Firestore returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: The project input or connection is invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: Example root collection exists., output: {collectionIds: [events], nextPageToken: ''}}
    - name: listDocuments
      goName: ListDocuments
      inputType: ListDocumentsInput
      outputType: DocumentsPage
      kind: query
      description: List one page of document resource names in a collection of the default Firestore database.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Firestore returned the selected document page.}
        - {id: providerRejected, goName: ProviderRejected, description: Firestore conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Firestore returned malformed or oversized document JSON., optional: true}
        - {id: defect, goName: Defect, description: 'Local project, collection, or page input or connection credentials are invalid.', optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One example document is visible.
          output: {documents: [{name: 'projects/sample-project/databases/(default)/documents/events/sample-event'}], nextPageToken: ''}
