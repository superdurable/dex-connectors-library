apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: google-youtube
  displayName: YouTube
  description: Read and manage YouTube channels, playlists, playlist items, and videos through the YouTube Data API v3.
  company: Google
  categories: [social-media]
  version: v0.5.0
spec:
  provider: google
  languages:
    python:
      version: v0.2.0
      package: dex-connector-google-youtube
      operations: [searchVideos, getVideo, getChannel, listPlaylistItems, addPlaylistItem]
      triggers: []
    typescript:
      version: v0.2.0
      package: "@superdurable/connector-google-youtube"
      operations: [searchVideos, getVideo, getChannel, listPlaylistItems, addPlaylistItem]
      triggers: []
  codegen:
    go:
      package: youtube
  configuration:
    fields:
      - name: endpoint
        goName: Endpoint
        type: url
        description: YouTube Data API base URL including the v3 path; leave blank for Google's public API. Enter an absolute HTTPS URL only for an explicitly supported compatible gateway, or a loopback HTTP URL for a local test server.
        required: false
        default: https://www.googleapis.com/youtube/v3
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete YouTube Data API response in bytes; leave blank to keep the safety limit, or enter a larger positive integer only when pages of 50 results carry very long descriptions. Oversized responses select invalidResponse.
        required: false
        default: 4194304
  auth:
    refreshable: true
    defaultMethod: google-oauth-readonly
    methods:
      - id: google-oauth-readonly
        displayName: Google OAuth, read-only
        description: "Recommended for Flows that only read; requests youtube.readonly for channel, playlist, playlist item, video, and category Queries. Mutations select providerRejected without calling YouTube."
        recommended: true
        type: oauth2
        connectionKind: google-youtube-readonly-oauth
        fields:
          - name: oauth_client_id
            goName: OAuthClientID
            type: string
            description: Non-secret OAuth client ID copied from https://console.cloud.google.com/apis/credentials after opening APIs & Services > Credentials > OAuth 2.0 Client IDs; the value ends in .apps.googleusercontent.com and blank means authorization or refresh cannot start.
            required: true
          - name: oauth_client_secret
            goName: OAuthClientSecret
            type: secretString
            description: Secret OAuth client secret copied from the selected Web application at https://console.cloud.google.com/apis/credentials; store it only in the credential form and blank means authorization or refresh cannot start.
            required: true
          - name: access_token
            goName: AccessToken
            type: secretString
            description: Secret short-lived Google OAuth access token produced automatically after authorization and refreshed before expiry; do not enter it manually, and blank means authorization has not completed.
            required: true
          - name: refresh_token
            goName: RefreshToken
            type: secretString
            description: Secret long-lived refresh token returned by Google because offline access is requested; Dex stores and rotates it automatically, and blank means reauthorization is required.
            required: true
        guide:
          startURL: https://console.cloud.google.com/apis/credentials
          steps:
            - Select a Google Cloud project, open APIs & Services > Library, search YouTube Data API v3, and choose Enable; its default quota is 10,000 units a day, and each search costs 100.
            - In Google Auth Platform, configure Branding, Audience, and Data Access for the youtube.readonly scope, which only reads the authorized account's YouTube data; add test users while the app is in Testing.
            - Open Clients > Create client > Web application, add the exact Redirect URI shown below, then copy the client ID and one-time client secret.
            - Complete consent with the Google account whose channel and private playlists the Flows read; Google Testing refresh tokens can expire after seven days, so publish the app for long-lived use.
        oauth2:
          authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth
          tokenEndpoint: https://oauth2.googleapis.com/token
          authorizationParameters: {access_type: offline, prompt: consent}
          clientIDCredential: oauth_client_id
          clientSecretCredential: oauth_client_secret
          scopes: [https://www.googleapis.com/auth/youtube.readonly]
          credentialMappings:
            - {credential: access_token, source: access_token}
            - {credential: refresh_token, source: refresh_token}
          pkce: true
          refresh:
            tokenExchangeTimeout: 25s
            missingExpiry: reject
            storedMissingExpiry: refresh
            acceptedScopeSets: [[https://www.googleapis.com/auth/youtube.readonly], [https://www.googleapis.com/auth/youtube]]
            scopeSeparators: whitespaceAndComma
            terminalErrorCodes: [invalid_grant, invalid_client, unauthorized_client]
      - id: google-oauth-manage
        displayName: Google OAuth, manage
        description: "Required for playlist, playlist item, channel, video, and rating Mutations; requests the youtube scope, which reads and manages the authorized account's YouTube data."
        type: oauth2
        connectionKind: google-youtube-oauth
        fields:
          - name: oauth_client_id
            goName: OAuthClientID
            type: string
            description: Non-secret OAuth client ID copied from https://console.cloud.google.com/apis/credentials after opening APIs & Services > Credentials > OAuth 2.0 Client IDs; the value ends in .apps.googleusercontent.com and blank means authorization or refresh cannot start.
            required: true
          - name: oauth_client_secret
            goName: OAuthClientSecret
            type: secretString
            description: Secret OAuth client secret copied from the selected Web application at https://console.cloud.google.com/apis/credentials; store it only in the credential form and blank means authorization or refresh cannot start.
            required: true
          - name: access_token
            goName: AccessToken
            type: secretString
            description: Secret short-lived Google OAuth access token produced automatically after authorization and refreshed before expiry; do not enter it manually, and blank means authorization has not completed.
            required: true
          - name: refresh_token
            goName: RefreshToken
            type: secretString
            description: Secret long-lived refresh token returned by Google because offline access is requested; Dex stores and rotates it automatically, and blank means reauthorization is required.
            required: true
        guide:
          startURL: https://console.cloud.google.com/apis/credentials
          steps:
            - Select a Google Cloud project, open APIs & Services > Library, search YouTube Data API v3, and choose Enable; its default quota is 10,000 units a day, and each search costs 100.
            - In Google Auth Platform, configure Branding, Audience, and Data Access for the youtube scope, which reads and manages the authorized account's YouTube data; add test users while the app is in Testing.
            - Open Clients > Create client > Web application, add the exact Redirect URI shown below, then copy the client ID and one-time client secret.
            - Complete consent with the Google account that owns the target playlists, choosing that channel if the account has several; Google Testing refresh tokens can expire after seven days, so publish the app for long-lived use.
        oauth2:
          authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth
          tokenEndpoint: https://oauth2.googleapis.com/token
          authorizationParameters: {access_type: offline, prompt: consent}
          clientIDCredential: oauth_client_id
          clientSecretCredential: oauth_client_secret
          scopes: [https://www.googleapis.com/auth/youtube]
          credentialMappings:
            - {credential: access_token, source: access_token}
            - {credential: refresh_token, source: refresh_token}
          pkce: true
          refresh:
            tokenExchangeTimeout: 25s
            scopeSeparators: whitespaceAndComma
            missingExpiry: reject
            storedMissingExpiry: refresh
            terminalErrorCodes: [invalid_grant, invalid_client, unauthorized_client]
  operations:
    - name: listChannels
      goName: ListChannels
      inputType: ListChannelsInput
      outputType: ChannelsPage
      kind: query
      description: List the connected account's channel identities.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: YouTube confirmed the channel listed result.}
        - {id: notFound, goName: NotFound, description: The selected channel is not visible., optional: true}
        - {id: quotaExhausted, goName: QuotaExhausted, description: YouTube daily quota is exhausted., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: YouTube definitively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: YouTube returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One example channel identity is returned.
          output: {"channels":[{"id":"UC1234567890123456789012","title":"Compiler Lab","description":"Compiler tutorials"}],"nextPageToken":""}
    - name: updateChannel
      goName: UpdateChannel
      inputType: UpdateChannelInput
      outputType: UpdatedChannelDescription
      kind: mutation
      description: Replace one owned channel's description while preserving its other branding settings.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: YouTube confirmed the channel updated result.}
        - {id: notFound, goName: NotFound, description: The selected channel is not visible., optional: true}
        - {id: quotaExhausted, goName: QuotaExhausted, description: YouTube daily quota is exhausted., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: YouTube definitively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: YouTube returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One example channel identity is returned.
          output: {"id":"UC1234567890123456789012","description":"Updated compiler tutorials"}
    - name: listVideos
      goName: ListVideos
      inputType: ListVideosInput
      outputType: VideosPage
      kind: query
      description: Read YouTube listVideos using the documented Data API v3 endpoint.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: YouTube confirmed the listVideos result.}
