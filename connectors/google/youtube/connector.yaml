    - name: addPlaylistItem
      goName: AddPlaylistItem
      inputType: AddPlaylistItemInput
      outputType: AddedPlaylistItem
      kind: mutation
      description: Add a video to a playlist the authorized account owns unless the playlist already holds it, and select uncertain instead of inserting again when an earlier insert may have taken effect.
      idempotency: required
      authorization: required
      agent:
        exposed: true
        approval: recommended
        # notFound, quotaExhausted, and providerRejected come from the pre-insert check or a definite refusal of the insert;
        # after a possible earlier insert the read-back selects only added or uncertain. defect precedes any send.
        # invalidResponse can follow a 2xx insert, so the video may be in the playlist.
        branches: {notFound: rejected, quotaExhausted: rejected, providerRejected: rejected, invalidResponse: unknown, uncertain: unknown, defect: rejected}
        description: Add one video to the end of a YouTube playlist that the authorized account owns. Give the playlist ID and the 11-character video ID. It skips the insert when the playlist listing already shows the video, but that listing can lag behind a recent insert, so do not call again for the same video to retry.
      branches:
        - {id: added, goName: Added, description: "The playlist holds the video, added now or found already present."}
        - {id: notFound, goName: NotFound, description: No playlist the account can manage or no visible video has the ID., optional: true}
        - {id: quotaExhausted, goName: QuotaExhausted, description: "The project's daily YouTube Data API quota is spent; it resets at midnight Pacific Time.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "YouTube conclusively rejected the insert, such as a playlist of another account, a full playlist, or a revoked grant.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "YouTube returned an invalid or oversized check response, or an invalid item after accepting the insert.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "An earlier insert may have added the video, but the playlist listing does not show it; check the playlist before adding it again.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        # The single-dispatch fence needs sync durability so the next attempt sees its insert checkpoint.
        durability: sync
        dispatchFence: true
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m, reason: {kind: duplicateWriteRisk, explanation: "playlistItems.insert has no idempotency key and its listing can lag, so only a retry that YouTube proved unprocessed may insert again; the bound keeps that window short."}}
      mocks:
        - name: compilerVideoAdded
          branch: added
          description: Adding video AbCdEfGhI12 to playlist PLcurated123 creates item PLITEM001.
          default: true
          output: {item: {id: PLITEM001, playlistId: PLcurated123, videoId: AbCdEfGhI12, title: Compiler release walkthrough, position: 0, addedAt: "2026-10-26T10:00:00Z", videoPublishedAt: "2026-10-20T10:00:00Z"}, wasAlreadyPresent: false}
        - name: notFoundFailure
          branch: notFound
          description: The addition of another video ID ZxYwVuTsR90 to playlist PLcurated123 names a resource the account cannot see.
          failure: {kind: NOT_FOUND, message: "No playlist the account can manage or no visible video has the ID."}
        - name: quotaExhaustedFailure
          branch: quotaExhausted
          description: The addition of AbCdEfGhI12 to playlist PLcurated123 exhausts the project daily YouTube quota.
          failure: {kind: QUOTA_EXHAUSTED, message: "The project's daily YouTube Data API quota is spent; it resets at midnight Pacific Time."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: YouTube denies the addition of AbCdEfGhI12 to playlist PLcurated123 because the grant lacks the required scope.
          failure: {kind: AUTHORIZATION, message: YouTube denied the request.}
        - name: insertOutcomeUnknown
          description: The insert of AbCdEfGhI12 into playlist PLcurated123 returned no usable response, and the read-back listing does not show the video yet.
          uncertain: {failure: {kind: TRANSPORT, message: "An earlier attempt may have added the video, and the playlist listing does not show it yet; check the playlist before adding the video again."}}
