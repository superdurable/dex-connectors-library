    - name: createPlaylist
      goName: CreatePlaylist
      inputType: CreatePlaylistInput
      outputType: Playlist
      kind: mutation
      description: Create one owned playlist with a title, description, and privacy setting.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3, dispatchFence: true}
      branches:
        - {id: created, goName: Created, description: YouTube confirmed the created playlist.}
        - {id: quotaExhausted, goName: QuotaExhausted, description: YouTube daily quota is exhausted., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: YouTube definitively rejected the request., optional: true}
        - {id: uncertain, goName: Uncertain, description: A prior create may have succeeded but could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Input or connection credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: One private example playlist is created.
          output: {id: PLcurated123, title: Compiler picks, description: Curated videos, privacyStatus: private}
