apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: front
  displayName: Front
  description: "Search, read, reply to, comment on, and update Front conversations and find contacts by email, keeping Front's own conversation statuses, ticket status IDs, and tag and teammate IDs."
  company: Front
  version: v0.22.0
spec:
  provider: front
  codegen:
    go:
      package: front
  configuration:
    fields:
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Largest complete Front API response, in bytes, that one request reads; a larger response selects invalidResponse. getConversation reads a conversation's newest messages as HTML and every comment, so raise it only when conversations with very long emails select invalidResponse; enter a positive integer. Blank keeps the displayed safety limit."
        required: false
        default: 4194304
  auth:
    type: apiKey
    connectionKind: front-api-token
    fields:
      - name: api_token
        goName: APIToken
        type: secretString
        description: "Secret Front API token. Sign in at https://app.frontapp.com/ as a company admin, open Settings > Developers > API Tokens, choose Create API token, and after it is created open the token and choose Copy; it is a long JSON Web Token of three dot-separated segments that begins with eyJ. It is sent only as an Authorization bearer token to https://api2.frontapp.com and stored only in this credential field. Required. Front tokens do not expire; after deleting a token in Front, create a new one and paste it here, which takes effect without a restart."
        required: true
    guide:
      startURL: https://app.frontapp.com/
      steps:
        - "Sign in at https://app.frontapp.com/ as a company admin; only admins can create or manage API tokens, and every admin sees the tokens of the company."
        - "Open Settings > Developers, select the API Tokens tab, choose Create API token, and give it a descriptive name such as Dex conversation triage."
        - "Under features select Access resources. Under namespaces select Shared resources with All shared workspaces, and Global resources for company tags and teammates; add Private resources only when Flows must reach teammates' personal inboxes, whose owners must also allow API access."
        - "Grant read on conversations, messages, comments, contacts, inboxes, tags, and teammates; write on conversations and comments; and send on messages, which replyToConversation needs for a reply to the customer. Choose Create."
        - "Open the new token, choose Copy, and paste it into api_token. To revoke access, open the token under Settings > Developers > API Tokens and choose Delete; requests using it stop at once."
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, front.inboxes-list, front.teammates-list, front.tags-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      - id: listInboxes
        capability: front.inboxes-list
        request:
          method: GET
          url: https://api2.frontapp.com/inboxes
          credential: {field: api_token, scheme: bearer}
      - id: listTeammates
        capability: front.teammates-list
        request:
          method: GET
          url: https://api2.frontapp.com/teammates
          credential: {field: api_token, scheme: bearer}
      - id: listTags
        capability: front.tags-list
        request:
          method: GET
          url: https://api2.frontapp.com/tags
          credential: {field: api_token, scheme: bearer}
          fixedQuery: {limit: "100"}
          parameters:
            - {name: pageToken, location: query, target: page_token}
    units:
      - id: inboxPicker
        goName: InboxPicker
        description: "Select one Front inbox, listed live from GET https://api2.frontapp.com/inboxes with the connection's API token, or enter its ID; the unit stores the stable inbox ID, such as inb_41w25, never the inbox name."
        backendCapabilities: [front.inboxes-list]
        outputs:
          - {name: inboxId, goName: InboxID, type: string}
      - id: teammatePicker
        goName: TeammatePicker
        description: "Select one Front teammate, listed live from GET https://api2.frontapp.com/teammates with the connection's API token, or enter the teammate ID; the unit stores the stable teammate ID, such as tea_2thf, never the email address."
        backendCapabilities: [front.teammates-list]
        outputs:
          - {name: teammateId, goName: TeammateID, type: string}
      - id: tagPicker
        goName: TagPicker
        description: "Select one Front tag, listed live from GET https://api2.frontapp.com/tags with the connection's API token, or enter the tag ID; the unit stores the stable tag ID, such as tag_13o8r1, because Front adds, removes, and searches tags by ID, never by name."
        backendCapabilities: [front.tags-list]
        outputs:
          - {name: tagId, goName: TagID, type: string}
  operations:
    - name: searchConversations
      goName: SearchConversations
      inputType: SearchConversationsInput
      outputType: SearchConversationsOutput
      kind: query
      description: "Search conversations by text, inbox, tag, Front status filters, recipient email, assignee, and recent activity, returning one bounded page newest activity first and a page token for the next."
      idempotency: none
      branches:
        - {id: searched, goName: Searched, description: "Front returned one page of matching conversations; it may be empty."}
        - {id: providerRejected, goName: ProviderRejected, description: "Front conclusively rejected the search, such as an invalid token, a token without conversation read access, or an expired page token.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Front returned a malformed or oversized page, or a next-page link outside Front's API hosts.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: matchingConversations
          branch: searched
          description: "The first search page for jane@acme.example.com contains cnv_100 and cnv_200 in the same inbox."
          default: true
          output:
            conversations:
              - {id: cnv_100, type: conversation, subject: "Order 88213", status: unassigned, createdAt: "2026-01-02T03:04:05Z"}
              - {id: cnv_200, type: conversation, subject: "Earlier order question", status: unassigned, createdAt: "2026-01-01T03:04:05Z"}
            totalCount: 2
            query: "inbox:inb_support is:open recipient:jane@acme.example.com"
        - name: invalidToken
          branch: providerRejected
          description: "The API token is invalid for a conversation search (HTTP 401)."
          failure: {kind: AUTHENTICATION, message: "Front rejected the API token (HTTP 401)."}
        - name: oversizedPage
          branch: invalidResponse
          description: "The matching conversation page exceeds maxResponseBytes."
          failure: {kind: RESPONSE_TOO_LARGE, message: "The Front response exceeds maxResponseBytes."}
    - name: getConversation
      goName: GetConversation
      inputType: GetConversationInput
      outputType: ConversationDetails
      kind: query
      description: "Read one conversation by ID with a bounded list of its newest messages and newest internal comments."
      idempotency: none
      branches:
        - {id: found, goName: Found, description: "Front returned the conversation with its newest messages and comments."}
        - {id: merged, goName: Merged, description: "The conversation was merged into another; mergedIntoConversationId names the conversation to read instead.", optional: true}
        - {id: notFound, goName: NotFound, description: "The conversation does not exist or is not visible to the API token.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Front conclusively rejected the read, such as an invalid token or a token without message or comment read access.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Front returned a malformed or oversized conversation, message page, or comment list.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 45s
        durability: async
      mocks:
        - name: triageConversation
          branch: found
          description: "cnv_100 contains Jane's newest inbound message and no earlier triage comment."
          default: true
          output:
            conversation: {id: cnv_100, type: conversation, subject: "Order 88213", status: unassigned, createdAt: "2026-01-02T03:04:05Z"}
            messages:
              - {id: msg_100, type: email, isInbound: true, body: "Any update on my refund?", createdAt: "2026-01-02T03:04:05Z", recipients: [{handle: "jane@acme.example.com", role: from}]}
            comments: []
        - name: mergedConversation
          branch: merged
          description: "cnv_100 was merged into cnv_200 (HTTP 301)."
          output: {mergedIntoConversationId: cnv_200}
          failure: {kind: NOT_FOUND, message: "The conversation was merged into cnv_200."}
        - name: missingConversation
          branch: notFound
          description: "cnv_100 does not exist or is hidden from the token (HTTP 404)."
          failure: {kind: NOT_FOUND, message: "Front found no such conversation (HTTP 404)."}
        - name: deniedConversationRead
          branch: providerRejected
          description: "The token cannot read cnv_100's messages (HTTP 403)."
          failure: {kind: AUTHORIZATION, message: "Front denied message read access (HTTP 403)."}
        - name: oversizedConversation
          branch: invalidResponse
          description: "cnv_100's message page exceeds maxResponseBytes."
          failure: {kind: RESPONSE_TOO_LARGE, message: "The Front response exceeds maxResponseBytes."}
    - name: replyToConversation
      goName: ReplyToConversation
      inputType: ReplyToConversationInput
      outputType: ConversationReply
      kind: mutation
      description: "Send one reply that Front delivers to the conversation's recipients, or add one internal comment that only teammates see. Front has no idempotency key or client-supplied lookup value, so the shared single-dispatch fence needs sync durability for visible heartbeat checkpoints across attempts."
      idempotency: required
      branches:
        - {id: replied, goName: Replied, description: "Front accepted the reply for delivery or created the comment."}
        - {id: notFound, goName: NotFound, description: "The conversation does not exist, was merged, or is not visible to the API token; nothing was sent.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Front conclusively rejected the reply or comment, such as a token without send permission or an unknown author; nothing was sent.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "The reply or comment may exist after a lost answer, ambiguous server error, late answer, or 409 conflict; an accepted comment may have been deleted before read-back. The connector never resends without proof of non-application.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection credentials that require reauthorization or are unusable, or the connector definition is invalid; transient credential failures Retry.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 5, totalDuration: 5m, reason: {kind: duplicateWriteRisk, explanation: "Front has no key or client-supplied lookup value to confirm a lost reply answer; keep retries bounded while the fence fails closed."}}
      mocks:
        - name: triageComment
          branch: replied
          description: "The internal triage comment on cnv_100 was created as com_100."
          default: true
          output: {conversationId: cnv_100, isInternalNote: true, commentId: com_100}
        - name: missingConversation
          branch: notFound
          description: "cnv_100 does not exist, so Front created no comment (HTTP 404)."
          failure: {kind: NOT_FOUND, message: "Front found no such conversation (HTTP 404)."}
        - name: deniedCommentWrite
          branch: providerRejected
          description: "The token lacks comments:write for cnv_100 (HTTP 403)."
          failure: {kind: AUTHORIZATION, message: "Front denied comment write access (HTTP 403)."}
    - name: updateConversation
      goName: UpdateConversation
      inputType: UpdateConversationInput
      outputType: UpdateConversationOutput
      kind: mutation
      description: "Set the Front status or ticket status, assignee, and tags of one conversation, then read it back; a repeated attempt finds the values already applied and writes nothing."
      idempotency: required
      branches:
        - {id: updated, goName: Updated, description: "The conversation holds the requested status, assignee, and tags, written now or by an earlier attempt."}
        - {id: notFound, goName: NotFound, description: "The conversation does not exist, was merged, or is not visible to the API token.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Front conclusively rejected a change, such as an unknown teammate, tag, or ticket status; changes sent before it stay applied.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Front returned a malformed or oversized conversation, so the change may have been applied.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 60s
        durability: async
      mocks:
        - name: routedConversation
          branch: updated
          description: "cnv_100 is assigned to tea_leela and tagged tag_triaged after routing."
          default: true
          output:
            conversation: {id: cnv_100, type: conversation, subject: "Order 88213", status: assigned, assignee: {id: tea_leela}, tags: [{id: tag_triaged, name: triaged}], createdAt: "2026-01-02T03:04:05Z"}
        - name: missingConversation
          branch: notFound
          description: "cnv_100 no longer exists when routing starts (HTTP 404)."
          failure: {kind: NOT_FOUND, message: "Front found no such conversation (HTTP 404)."}
        - name: invalidTag
          branch: providerRejected
          description: "Front rejected tag_missing in a routing update (HTTP 400)."
          failure: {kind: VALIDATION, message: "Front rejected the tag ID (HTTP 400)."}
        - name: oversizedReadBack
          branch: invalidResponse
          description: "The read-back of cnv_100 exceeds maxResponseBytes after routing."
          failure: {kind: RESPONSE_TOO_LARGE, message: "The Front response exceeds maxResponseBytes."}
    - name: findContactByEmail
      goName: FindContactByEmail
      inputType: FindContactByEmailInput
      outputType: FindContactByEmailOutput
      kind: query
      description: "Find the Front contact whose email handle equals one address; Front keeps each handle on at most one contact."
      idempotency: none
      branches:
        - {id: found, goName: Found, description: "A Front contact has the email handle."}
        - {id: notFound, goName: NotFound, description: "No Front contact has the email handle.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Front conclusively rejected the lookup, such as an invalid token or a token without contact read access.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Front returned a malformed or oversized contact.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: requesterContact
          branch: found
          description: "jane@acme.example.com belongs to crd_100, the requester on cnv_100."
          default: true
          output:
            contacts:
              - {id: crd_100, name: Jane Smith, handles: [{handle: "jane@acme.example.com", source: email}]}
        - name: missingContact
          branch: notFound
          description: "No contact owns the jane@acme.example.com email handle (HTTP 404)."
          failure: {kind: NOT_FOUND, message: "Front found no contact for this email (HTTP 404)."}
        - name: deniedContactRead
          branch: providerRejected
          description: "The token lacks contacts:read (HTTP 403)."
          failure: {kind: AUTHORIZATION, message: "Front denied contact read access (HTTP 403)."}
        - name: oversizedContact
          branch: invalidResponse
          description: "The jane@acme.example.com contact exceeds maxResponseBytes."
          failure: {kind: RESPONSE_TOO_LARGE, message: "The Front response exceeds maxResponseBytes."}
