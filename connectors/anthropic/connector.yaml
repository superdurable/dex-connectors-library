apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: claude
  displayName: Claude
  description: Anthropic Claude Messages API text generation with JSON Schema structured output, effort, token usage, and streamed text.
  company: Anthropic
  version: v0.1.0
spec:
  provider: anthropic
  codegen:
    go:
      package: claude
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "Claude model for this connection, such as claude-sonnet-5 or claude-opus-5-5. Blank uses claude-sonnet-5. A request that names a model overrides it."
        required: false
        default: claude-sonnet-5
      - name: workspaceId
        goName: WorkspaceID
        type: string
        description: "Claude workspace ID, such as wrkspc_01JwQvzr7rXLA5AGx3HKfFUJ, sent as the anthropic-workspace-id header. A multi-workspace API key requires it; leave it blank for a key scoped to one workspace."
        required: false
      - name: defaultMaxOutputTokens
        goName: DefaultMaxOutputTokens
        type: integer
        description: "Output token limit sent as max_tokens, which Claude requires, when a request leaves maxOutputTokens zero. It includes thinking tokens and must not exceed the model's maximum output. A limit above about 30000 can outlast the 870-second request timeout, which retries the whole generation instead of returning truncated text."
        required: false
        default: 16000
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete provider response in bytes; enter a positive integer only when a proxy needs a different safety limit. Larger responses select invalidResponse.
        required: false
        default: 8388608
  auth:
    type: apiKey
    connectionKind: claude-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: Secret Claude API key from Claude Console > Settings > API keys; copy the key when it is created. It is sent only as an Authorization bearer token.
        required: true
    guide:
      startURL: https://platform.claude.com/settings/keys
      steps:
        - In Claude Console, select the intended workspace, then open Settings > API keys.
        - Choose Create key, name it, set an expiration if required, and copy the secret displayed once.
        - Leave workspaceId blank for a key scoped to one workspace; otherwise copy the wrkspc_ identifier from Settings > Workspaces.
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, claude.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      # Dex Web cli-v0.13.8 and earlier drop fixedHeaders, so Claude rejects the
      # list there and the picker falls back to manual model entry.
      - id: listModels
        capability: claude.models-list
        request:
          method: GET
          url: https://api.anthropic.com/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedHeaders: {anthropic-version: "2023-06-01"}
          fixedQuery: {limit: "1000"}
          parameters:
            - {name: afterId, location: query, target: after_id}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: Choose one Step's Claude model from the Claude API's live model list.
        backendCapabilities: [claude.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: generateText
      goName: GenerateText
      inputType: GenerateTextRequest
      outputType: GenerateTextResponse
      kind: query
      description: Generate text or JSON Schema structured output with a Claude model through the stateless Messages API.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: The model finished normally and returned text.}
        - {id: truncated, goName: Truncated, description: The model stopped at the output token limit or the context window and returned any partial text., optional: true}
        - {id: blocked, goName: Blocked, description: "Claude's safety classifiers stopped the response with a refusal.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Claude conclusively rejected the request, such as invalid credentials, an unknown model, a billing issue, or a spend limit.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Claude returned a malformed, oversized, or unusable response, including structured output that does not match its schema.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      progress: [text]
      execution:
        # Requests stream, as Claude recommends for long generations, so the
        # streaming generateText budget applies.
        executeMethodTimeout: 900s
        heartbeatTimeout: 60s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 4, totalDuration: 30m}
