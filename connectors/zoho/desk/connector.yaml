    units:
      - id: organizationPicker
        goName: OrganizationPicker
        description: "Choose the Zoho Desk organization this connection works in from the organizations of the authorized user, listed in the connection's own data center only; the unit stores the organization's numeric orgId. Pick the organization chosen on the Zoho consent screen, and when the list cannot load, enter the orgId shown in Zoho Desk under Setup > Developer Space > API."
        backendCapabilities: [zohodesk.organizations-list]
        outputs:
          - {name: orgId, goName: OrgID, type: string}
  operations:
    - name: searchTickets
      goName: SearchTickets
      inputType: SearchTicketsInput
      outputType: SearchTicketsOutput
      kind: query
      description: Search one page of Zoho Desk tickets by status, status type, priority, contact email, department, and modified time, with from and limit paging of at most 100 tickets.
      idempotency: none
      authorization: required
      branches:
        - {id: searched, goName: Searched, description: "One page of matching tickets was returned; it may be empty."}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho Desk conclusively rejected the search, such as a revoked authorization, a missing scope, another organization, or an invalid filter value.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zoho Desk returned an invalid or oversized search page., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &zohoDeskReadExecution
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 6, totalDuration: 5m}
    - name: getTicket
      goName: GetTicket
      inputType: GetTicketInput
      outputType: TicketDetails
      kind: query
      description: Read one ticket by ID with its contact and bounded lists of its newest threads and newest comments.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "The ticket, its contact, and its newest threads and comments were read."}
        - {id: notFound, goName: NotFound, description: The ticket does not exist or is not visible to the connection's agent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Zoho Desk conclusively rejected the ticket read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Zoho Desk returned an invalid or oversized ticket, thread list, or comment list.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *zohoDeskReadExecution
    - name: createTicket
      goName: CreateTicket
      inputType: CreateTicketInput
      outputType: CreateTicketOutput
      kind: mutation
      description: Create one ticket in a department for a contact. Zoho Desk has no idempotency key, so the Step runs with sync durability and sends the request at most once per Step execution.
      idempotency: required
      authorization: required
      branches:
        - {id: created, goName: Created, description: Zoho Desk created the ticket and returned it.}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho Desk conclusively rejected the ticket, such as an unknown department, status, or assignee; no ticket was created.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "The request was sent but its outcome cannot be confirmed, so the ticket may exist; the connector never resends it.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &zohoDeskSingleDispatchExecution
        executeMethodTimeout: 30s
        durability: sync
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 5, totalDuration: 5m}
    - name: updateTicket
      goName: UpdateTicket
      inputType: UpdateTicketInput
      outputType: UpdateTicketOutput
      kind: mutation
      description: Set the status, priority, assignee, or department of one ticket; a repeated attempt finds the change already applied and writes nothing.
      idempotency: required
      authorization: required
      branches:
        - {id: updated, goName: Updated, description: "Zoho Desk accepted the requested values now or already held them; the returned ticket shows any change its automations made."}
        - {id: notFound, goName: NotFound, description: The ticket does not exist or is not visible to the connection's agent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho Desk conclusively rejected the change, such as an unknown status, an assignee outside the department, or a blueprint that forbids the transition.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Zoho Desk returned an invalid or oversized ticket, so the change may have been applied.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *zohoDeskReadExecution
    - name: addComment
      goName: AddComment
      inputType: AddCommentInput
      outputType: AddCommentOutput
      kind: mutation
      description: Add one public or private plain-text comment to a ticket. Zoho Desk has no idempotency key, so the Step runs with sync durability and sends the request at most once per Step execution.
      idempotency: required
      authorization: required
      branches:
        - {id: added, goName: Added, description: Zoho Desk added the comment and returned it.}
        - {id: notFound, goName: NotFound, description: "The ticket does not exist or is not visible to the connection's agent; nothing was added.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho Desk conclusively rejected the comment; nothing was added.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "The request was sent but its outcome cannot be confirmed, so the comment may exist; the connector never resends it.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *zohoDeskSingleDispatchExecution
