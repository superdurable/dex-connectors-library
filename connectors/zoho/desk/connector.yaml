  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [oauth.connection.manage, use.configuration.write, zohodesk.organizations-list]
      mockScenarios: [not-configured, authorization-pending, connected, insufficient-scope, revoked, broker-unavailable, ready]
      icon: icon.svg
    commands:
      - id: listOrganizationsUS
        capability: zohodesk.organizations-list
        request: {method: GET, url: "https://desk.zoho.com/api/v1/organizations", credential: {field: access_token, scheme: bearer}}
      - id: listOrganizationsEU
