apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: zoho-desk
  displayName: Zoho Desk
  description: Search, read, create, and update Zoho Desk tickets and add public or private comments in the connection's Zoho data center, keeping Zoho Desk's own status and priority names.
  company: Zoho
  version: v0.1.0
spec:
  provider: zoho
  codegen:
    go:
      package: desk
  configuration:
    fields:
      - name: orgId
        goName: OrgID
        type: string
        description: "Non-secret Zoho Desk organization ID (orgId), a number such as 2389290, that every request sends in Zoho Desk's orgId header. After Connect, once the connection is Ready, choose the organization with the Zoho Desk organization picker, which lists the organizations of the authorized user in the connection's data center; pick the organization you chose on the Zoho consent screen, because Zoho binds the token to it and rejects any other with OAUTH_ORG_MISMATCH. Where Dex Web shows a text field instead, sign in to Zoho Desk in your data center, such as https://desk.zoho.com, open Setup > Developer Space > API, and copy the organization ID. Blank is accepted only until the picker runs: the application refuses to start while orgId is blank. The value is read when the application starts."
        required: false
        studioUnit: {unit: organizationPicker, port: orgId}
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum complete Zoho Desk API response in bytes. Leave blank to keep the displayed safety limit; enter a positive integer only to change it, for example when ticket descriptions or comments are unusually large. An oversized read selects invalidResponse, and an oversized response to createTicket or addComment selects uncertain."
        required: false
        default: 4194304
  auth:
    methodLabel: Data center
    defaultMethod: zoho-us-oauth
    methods:
      - id: zoho-us-oauth
        displayName: United States (zoho.com)
        description: For Zoho Desk accounts at https://desk.zoho.com; Dex signs in through https://accounts.zoho.com and refreshes the hourly access token automatically.
        recommended: true
        type: oauth2
        connectionKind: zoho-desk-us-oauth
        fields: &zohoOAuthFields
          - name: oauth_client_id
            goName: OAuthClientID
            type: string
            description: "Non-secret Client ID of the Zoho API console server-based client, such as 1000.GMB0YULZHJK411248S8I5GZ4CHUEX0, copied from the client's Client Secret tab in the Zoho API console of this data center; one client ID serves every data center its Settings tab enables, and blank means authorization and refresh cannot start."
            required: true
          - name: oauth_client_secret
            goName: OAuthClientSecret
            type: secretString
            description: "Secret Client Secret for this data center, revealed beside the Client ID on the client's Client Secret tab in the Zoho API console; a client with multi-DC support enabled can have a different secret per data center, so copy the one shown for this data center. Dex stores it only in the credential store, and blank means authorization and refresh cannot start."
            required: true
          - name: access_token
            goName: AccessToken
            type: secretString
            description: "Secret Zoho access token produced automatically by authorization and replaced by every refresh before its one-hour expiry; never enter it manually, and blank means Connect has not completed."
            required: true
          - name: refresh_token
            goName: RefreshToken
            type: secretString
            description: "Secret Zoho refresh token returned automatically because Dex requests access_type=offline; Zoho keeps it until it is revoked and does not rotate it, so never enter it manually, and blank means reauthorization is required."
            required: true
        guide:
          startURL: https://api-console.zoho.com
          steps:
            - Sign in to https://api-console.zoho.com with the Zoho account that owns the integration, choose GET STARTED or ADD CLIENT, and create a Server-based Applications client with a Client Name and Homepage URL.
            - Add the exact Redirect URI shown by Dex Web under Authorized Redirect URIs, then choose CREATE; a client registered in another data center instead needs this data center turned on in its Settings tab.
            - Open the Client Secret tab and copy the Client ID and the Client Secret into the fields below.
            - Choose Connect and sign in at https://accounts.zoho.com as the Zoho Desk agent the connector acts as; tickets and comments it writes are authored by that agent, and the agent's profile limits what it can read and change.
            - On the Zoho consent screen, accept the scopes Desk.tickets.READ, Desk.tickets.CREATE, and Desk.tickets.UPDATE for tickets and comments, Desk.search.READ for searchTickets, and Desk.basic.READ for the organization picker; if the account belongs to several Zoho Desk organizations, pick the one this connection uses, because Zoho binds the token to it.
            - When the connection is Ready, choose the same organization in orgId; to revoke access, remove the connected app under Zoho Accounts > Sessions > Connected Apps or delete the client in the API console.
        oauth2:
          authorizationEndpoint: https://accounts.zoho.com/oauth/v2/auth
          tokenEndpoint: https://accounts.zoho.com/oauth/v2/token
          authorizationParameters: &zohoAuthorizationParameters {access_type: offline, prompt: consent}
          clientIDCredential: oauth_client_id
          clientSecretCredential: oauth_client_secret
          scopes: &zohoDeskScopes [Desk.tickets.READ, Desk.tickets.CREATE, Desk.tickets.UPDATE, Desk.search.READ, Desk.basic.READ]
          credentialMappings: &zohoCredentialMappings
            - {credential: access_token, source: access_token}
            - {credential: refresh_token, source: refresh_token}
          pkce: false
