  operations:
    - name: findRecords
      goName: FindRecords
      inputType: FindRecordsInput
      outputType: FindRecordsOutput
      kind: query
      description: Find up to 200 records of one module whose fields match every condition, such as a contact by email or an account by name, through a COQL query with typed, escaped values; results are immediate, with no search-index delay, and an offset cursor reads the next page.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "At least one record matched; the page holds the matches and reports whether more remain."}
        - {id: notFound, goName: NotFound, description: No record of the module matched every condition., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho CRM conclusively rejected the query, such as an unknown module or field, a value of the wrong type, a missing scope, or a revoked authorization.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zoho CRM returned an invalid or oversized page of records., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &zohoCRMExecution
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 6, totalDuration: 5m}
    - name: getRecord
      goName: GetRecord
      inputType: GetRecordInput
      outputType: Record
      kind: query
      description: Read one record of a module by record ID, with every field or the chosen fields, including lookups such as a contact's account and a deal's owner.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Zoho CRM returned the record.}
        - {id: notFound, goName: NotFound, description: "No record of the module has the ID, or the record was deleted or is not visible to the connection's user.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho CRM conclusively rejected the read, such as an unknown module or field, a missing scope, or a revoked authorization.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zoho CRM returned an invalid or oversized record., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *zohoCRMExecution
    - name: listModifiedRecords
      goName: ListModifiedRecords
      inputType: ListModifiedRecordsInput
      outputType: ListModifiedRecordsOutput
      kind: query
      description: List up to 200 records of one module modified at or after a time, oldest change first, and return a watermark cursor that reads the next page now or the next changes in a later poll.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "One page of changed records was returned with the cursor to continue from; the page may be empty."}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho CRM conclusively rejected the listing, such as an unknown module or field, a missing scope, or a revoked authorization.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Zoho CRM returned an invalid or oversized page, such as a record without its modified time.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, cursor, connection configuration, or connector definition is invalid.", optional: true}
      execution: *zohoCRMExecution
    - name: upsertRecord
      goName: UpsertRecord
      inputType: UpsertRecordInput
      outputType: UpsertRecordOutput
      kind: mutation
      description: Create one record, or update the record whose duplicate-check field, such as a contact's Email or a unique external ID field, already holds the value, so a retried Step updates the record an earlier attempt created instead of creating a duplicate.
      idempotency: required
      authorization: required
      branches:
        - {id: upserted, goName: Upserted, description: Zoho CRM created the record or updated the record that holds the duplicate-check value.}
        - {id: conflict, goName: Conflict, description: "Another record already holds a value of a unique field the upsert sets, after one resend; nothing was written.", optional: true}
        - {id: recordRejected, goName: RecordRejected, description: "Zoho CRM rejected the field values, such as MANDATORY_NOT_FOUND, INVALID_DATA, or RECORD_LOCKED; nothing was written.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho CRM conclusively refused the request, such as an unknown module, a user without create or edit permission, a missing scope, or a revoked authorization.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Zoho CRM answered with an invalid or oversized response, so the record may have been written.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *zohoCRMExecution
    - name: updateRecord
      goName: UpdateRecord
      inputType: UpdateRecordInput
      outputType: UpdateRecordOutput
      kind: mutation
      description: Set the named fields of one record by record ID, such as a deal's Stage or Owner, leaving every other field unchanged; repeating the update sets the same values again.
      idempotency: required
      authorization: required
      branches:
        - {id: updated, goName: Updated, description: Zoho CRM applied the field values to the record.}
        - {id: notFound, goName: NotFound, description: "No record of the module has the ID, or it is not visible to the connection's user; nothing was written.", optional: true}
        - {id: conflict, goName: Conflict, description: "Another record already holds a value of a unique field the update sets; nothing was written.", optional: true}
        - {id: recordRejected, goName: RecordRejected, description: "Zoho CRM rejected the field values, such as INVALID_DATA, RECORD_LOCKED, or a blueprint that forbids the change; nothing was written.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho CRM conclusively refused the request, such as an unknown module, a user without edit permission, a missing scope, or a revoked authorization.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Zoho CRM answered with an invalid or oversized response, so the update may have been applied.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *zohoCRMExecution
    - name: listModuleFields
      goName: ListModuleFields
      inputType: ListModuleFieldsInput
      outputType: ListModuleFieldsOutput
      kind: query
      description: List the fields of one module with their API names, data types, unique and custom flags, lookup modules, and picklist values, such as the stages a deal's Stage accepts.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: Zoho CRM returned the module's fields.}
        - {id: providerRejected, goName: ProviderRejected, description: "Zoho CRM conclusively rejected the request, such as an unknown module, a missing ZohoCRM.settings.fields.READ scope, or a revoked authorization.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zoho CRM returned an invalid or oversized field list., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *zohoCRMExecution
