apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: zoho-crm
  displayName: Zoho CRM
  description: Find, read, upsert, and update Zoho CRM records such as contacts, accounts, and deals in the connection's Zoho data center, list records changed since a watermark, and read a module's fields and picklist values, keeping Zoho CRM's own field names and stages.
  company: Zoho
  version: v0.21.0
spec:
  provider: zoho
  codegen:
    go:
      package: crm
  configuration:
    fields:
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum complete Zoho CRM API response in bytes. Leave blank to keep the displayed safety limit; enter a positive integer only to change it, for example when a module has unusually many fields or records carry long text. An oversized response selects invalidResponse and is never partly read."
        required: false
        default: 4194304
  auth:
    refreshable: true
    methodLabel: Data center
    defaultMethod: zoho-us-oauth
    methods:
      - id: zoho-us-oauth
        displayName: United States (zoho.com)
        description: For Zoho CRM accounts at https://crm.zoho.com; Dex signs in through https://accounts.zoho.com, calls the Zoho CRM API at https://www.zohoapis.com or the sandbox or developer host Zoho names at sign-in, and refreshes the hourly access token automatically.
        recommended: true
        type: oauth2
        connectionKind: zoho-crm-us-oauth
        fields: &zohoCRMOAuthFields
          - name: oauth_client_id
            goName: OAuthClientID
            type: string
            description: "Non-secret Client ID of the Zoho API console server-based client, such as 1000.GMB0YULZHJK411248S8I5GZ4CHUEX0, copied from the client's Client Secret tab in the Zoho API console of this data center; one client ID serves every data center its Settings tab enables, and blank means authorization and refresh cannot start."
            required: true
          - name: oauth_client_secret
            goName: OAuthClientSecret
            type: secretString
            description: "Secret Client Secret for this data center, revealed beside the Client ID on the client's Client Secret tab in the Zoho API console; a client with multi-DC support enabled can have a different secret per data center, so copy the one shown for this data center. Dex stores it only in the credential store, and blank means authorization and refresh cannot start."
            required: true
          - name: access_token
            goName: AccessToken
            type: secretString
            description: "Secret Zoho access token produced automatically by authorization and replaced by every refresh before its one-hour expiry; never enter it manually, and blank means Connect has not completed."
            required: true
          - name: refresh_token
            goName: RefreshToken
            type: secretString
            description: "Secret Zoho refresh token returned automatically because Dex requests access_type=offline; Zoho keeps it until it is revoked and does not rotate it, so never enter it manually, and blank means reauthorization is required."
            required: true
          - name: api_domain
            goName: APIDomain
            type: string
            description: "Non-secret Zoho CRM API host, such as https://www.zohoapis.com for production or https://sandbox.zohoapis.com for a sandbox, returned automatically as api_domain by authorization and by every refresh; never enter it manually. The connector accepts only the www, sandbox, or developer zohoapis host of this data center, and blank makes Dex refresh once to obtain it."
            required: false
        guide:
          startURL: https://api-console.zoho.com
          steps:
            - Sign in to https://api-console.zoho.com with the Zoho account that owns the integration, choose GET STARTED or ADD CLIENT, and create a Server-based Applications client with a Client Name and Homepage URL.
            - Add the exact Redirect URI shown by Dex Web under Authorized Redirect URIs, then choose CREATE; a client registered in another data center instead needs this data center turned on in its Settings tab.
            - Open the Client Secret tab and copy the Client ID and the Client Secret into the fields below.
            - Choose Connect and sign in at https://accounts.zoho.com as the Zoho CRM user the connector acts as; records it writes are created and modified by that user, and the user's profile and role limit which modules, fields, and records it can read and change.
            - On the Zoho consent screen, accept ZohoCRM.modules.READ for getRecord, ZohoCRM.modules.CREATE and ZohoCRM.modules.UPDATE for upsertRecord and updateRecord, ZohoCRM.coql.READ for findRecords and listModifiedRecords, and ZohoCRM.settings.fields.READ for listModuleFields; if the account belongs to several Zoho CRM organizations or a sandbox, pick the one this connection uses, because Zoho binds the token to it.
            - To revoke access, remove the connected app under Zoho Accounts > Sessions > Connected Apps or delete the client in the API console; every operation then reports an AUTHENTICATION failure until you choose Reconnect.
        oauth2:
          authorizationEndpoint: https://accounts.zoho.com/oauth/v2/auth
          tokenEndpoint: https://accounts.zoho.com/oauth/v2/token
          authorizationParameters: &zohoCRMAuthorizationParameters {access_type: offline, prompt: consent}
          clientIDCredential: oauth_client_id
          clientSecretCredential: oauth_client_secret
          scopes: &zohoCRMScopes [ZohoCRM.modules.READ, ZohoCRM.modules.CREATE, ZohoCRM.modules.UPDATE, ZohoCRM.coql.READ, ZohoCRM.settings.fields.READ]
          credentialMappings: &zohoCRMCredentialMappings
            - {credential: access_token, source: access_token}
            - {credential: refresh_token, source: refresh_token}
            - {credential: api_domain, source: api_domain}
          pkce: false
