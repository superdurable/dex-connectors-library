apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: opencsg
  displayName: OpenCSG AI Gateway
  description: List model IDs available through the OpenCSG community AI Gateway.
  company: OpenCSG
  categories: [ai, developer-tools]
  version: v0.1.0
spec:
  provider: opencsg
  codegen:
    go:
      package: opencsg
  configuration:
    fields:
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one gateway model-list HTTP request as a positive Go duration such as 5s or 1m. Blank uses the displayed default; increase only for a slow approved network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum model-list response size in bytes as a positive integer. Blank uses the displayed default; increase only if the provider adds more model metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: opencsg-api-key
    fields:
      - name: apiKey
        goName: APIKey
        type: secretString
        required: true
        description: Secret AI Gateway Key from https://hub.opencsg.com > account settings > API Keys, or organization settings > API Keys. Copy the gw-sk- prefixed Key at creation; blank prevents requests.
    guide:
      startURL: https://opencsg.com/docs/profile/api_keys
      steps:
        - Sign in at https://hub.opencsg.com and open account settings > API Keys for a personal gateway Key, or organization settings > API Keys for a team Key. Click 新建 API Key, set a name and optional quota/expiry, create it, and copy the secret gw-sk- value before closing the one-time dialog. Paste it into Dex Connections; blank prevents requests.
        - Start ListGatewayModels with {}. The connector calls the fixed OpenCSG community HTTPS gateway and returns at most the first 50 model IDs. It does not call inference or expose model metadata. Leave timeout and maxResponseBytes blank for displayed defaults.
        - Use an AI Gateway API Key, not the separate Git Access Token. The Key determines which models are available. Manage or revoke it from the same API Keys page if needed.
  operations:
    - name: listGatewayModels
      goName: ListGatewayModels
      inputType: ListGatewayModelsInput
      outputType: ListGatewayModelsOutput
      kind: query
      description: List up to 50 model IDs enabled for the gateway Key.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: OpenCSG returned the available model list.}
        - {id: providerRejected, goName: ProviderRejected, description: OpenCSG rejected the Key or request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: OpenCSG returned malformed or oversized model data., optional: true}
        - {id: defect, goName: Defect, description: The local API Key is invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: oneModel
          branch: found
          description: One available gateway model ID.
          default: true
          output: {total: 1, modelIDs: [OpenCSG/example-model]}
        - name: noModels
          branch: found
          description: No models are enabled for the Key.
          output: {total: 0, modelIDs: []}
