          description: One sample transaction is returned.
          output: {id: txn-1, status: SUBMITTED_FOR_SETTLEMENT}
    - name: captureTransaction
      goName: CaptureTransaction
      inputType: CaptureTransactionInput
      outputType: TransactionProfile
      kind: mutation
      description: Capture an authorized transaction.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: captured, goName: Captured, description: Braintree returned the requested result.}
        - {id: notFound, goName: NotFound, description: The selected resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Braintree definitively rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: capturedDefault
          branch: captured
          default: true
          description: One sample transaction is returned.
          output: {id: txn-1, status: SUBMITTED_FOR_SETTLEMENT}
    - name: voidTransaction
      goName: VoidTransaction
      inputType: GetTransactionInput
      outputType: TransactionProfile
      kind: mutation
      description: Void an unsettled transaction.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: voided, goName: Voided, description: Braintree returned the requested result.}
        - {id: notFound, goName: NotFound, description: The selected resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Braintree definitively rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
