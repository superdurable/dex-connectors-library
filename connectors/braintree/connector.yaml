        - {id: notFound, goName: NotFound, description: The selected payment method was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Braintree definitively rejected the mutation., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The outcome cannot be confirmed after the send cap., optional: true}
      mocks:
