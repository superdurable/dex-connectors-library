apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: cloudflare
  displayName: Cloudflare
  description: "Inspect zones and DNS records, maintain DNS records, and purge cache through typed Dex Steps."
  company: Cloudflare
  categories: [developer-tools]
  version: v0.3.0
spec:
  provider: cloudflare
  languages:
    typescript:
      version: v0.1.1
      operations: [purgeCacheByURLs, listZones]
      triggers: []
    python:
      version: v0.1.0
      operations: [purgeCacheByURLs, listZones]
      triggers: []
  codegen:
    go:
      package: cloudflare
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: "Cloudflare REST API base URL. Leave blank for the displayed provider endpoint; override only for a compatible HTTPS gateway or loopback test server."
        default: https://api.cloudflare.com/client/v4
      - name: timeout
        goName: Timeout
        type: duration
        description: "Positive Go duration bounding one HTTP request; leave blank for the displayed default, or override for a slower network."
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Positive byte limit for one response; leave blank for the displayed default, or override for larger pages."
        default: 2097152
  auth:
    type: apiKey
    connectionKind: cloudflare-api-key
    fields:
      - name: api_token
        goName: APIToken
        type: secretString
        description: "Secret Cloudflare API token from My Profile > API Tokens at https://dash.cloudflare.com/profile/api-tokens. Create a custom token with Zone > Zone > Read, Zone > Cache Purge, and Zone > DNS > Read/Edit permissions for intended zones, then copy it. Blank prevents requests."
        required: true
    guide:
      startURL: https://dash.cloudflare.com/profile/api-tokens
      steps:
        - "Open https://dash.cloudflare.com/profile/api-tokens and select My Profile > API Tokens > Create Token."
        - "Create a custom token with Zone > Zone > Read, Zone > Cache Purge, and Zone > DNS > Read/Edit for the zones you will use, then copy it into secret api_token. Leave baseUrl, timeout, and maxResponseBytes blank unless changing their displayed defaults."
  operations:
    - name: listZones
      goName: ListZones
      inputType: ListZonesInput
      outputType: ZonesPage
      kind: query
      description: "List the first page of Cloudflare zones."
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "List the first page of Cloudflare zones."}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        repeatOnUnknown: safe
      mocks:
        - name: listedDefault
          branch: listed
          description: "A Meridian example returns a representative ZonesPage."
          default: true
          output: {"success":true,"result":[{"id":"zone-meridian","name":"meridian.example","status":"active"}]}
    - name: purgeCacheByURLs
      goName: PurgeCacheByURLs
      inputType: PurgeCacheByURLsInput
      outputType: CachePurge
      kind: mutation
      description: "Purge specific URLs from a Cloudflare zone; repeating the same purge has the same cache-removal effect."
      idempotency: required
      authorization: required
      branches:
        - {id: purged, goName: Purged, description: "Purge specific URLs from a Cloudflare zone; repeating the same purge has the same cache-removal effect."}
        - {id: notFound, goName: NotFound, description: The requested resource does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        repeatOnUnknown: safe
      mocks:
        - name: purgedDefault
          branch: purged
          description: "A Meridian example returns a representative CachePurge."
          default: true
          output: {"success":true,"result":{"id":"purge-meridian"}}
    - name: purgeEntireCache
      goName: PurgeEntireCache
      inputType: PurgeEntireCacheInput
      outputType: CachePurge
      kind: mutation
      description: Purge all cached assets in one zone.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: purged, goName: Purged, description: Cloudflare accepted the zone-wide purge.}
        - {id: notFound, goName: NotFound, description: The zone does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Cloudflare conclusively rejected the purge., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Cloudflare returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: purgedDefault, branch: purged, default: true, description: Meridian zone cache was purged., output: {success: true, result: {id: purge-meridian}}}
    - name: listDNSRecords
      goName: ListDNSRecords
      inputType: ListDNSRecordsInput
      outputType: DNSRecordsPage
      kind: query
      description: List a bounded page of DNS records in one zone.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Cloudflare returned the DNS record page.}
        - {id: notFound, goName: NotFound, description: The zone does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Cloudflare conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Cloudflare returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: Meridian has one A record., output: {records: [{id: dns-meridian, type: A, name: meridian.example, content: 192.0.2.10, ttl: 3600, proxied: false}], page: 1, totalPages: 1}}
    - name: getDNSRecord
      goName: GetDNSRecord
      inputType: GetDNSRecordInput
      outputType: DNSRecord
      kind: query
      description: Fetch one DNS record in a zone.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Cloudflare returned the DNS record.}
        - {id: notFound, goName: NotFound, description: The DNS record does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Cloudflare conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Cloudflare returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: Meridian A record is returned., output: {id: dns-meridian, type: A, name: meridian.example, content: 192.0.2.10, ttl: 3600, proxied: false}}
    - name: updateDNSRecord
      goName: UpdateDNSRecord
      inputType: UpdateDNSRecordInput
      outputType: DNSRecord
      kind: mutation
      description: Overwrite an A, AAAA, CNAME, or TXT DNS record.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Cloudflare returned the updated DNS record.}
        - {id: notFound, goName: NotFound, description: The DNS record does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Cloudflare conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Cloudflare returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: Meridian A record was overwritten., output: {id: dns-meridian, type: A, name: meridian.example, content: 192.0.2.20, ttl: 3600, proxied: false}}
    - name: deleteDNSRecord
      goName: DeleteDNSRecord
      inputType: DeleteDNSRecordInput
      outputType: DeletedDNSRecord
      kind: mutation
      description: Delete one DNS record in a zone.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Cloudflare confirmed the DNS record is absent.}
        - {id: notFound, goName: NotFound, description: The DNS record was already absent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Cloudflare conclusively rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Cloudflare returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: Meridian A record was deleted., output: {id: dns-meridian}}
