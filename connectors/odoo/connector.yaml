apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: odoo
  displayName: Odoo
  description: Search and manage Odoo CRM records through the JSON-2 API.
  company: Odoo
  categories: [crm-sales, finance-payments]
  version: v0.2.0
spec:
  provider: odoo
  languages:
    python:
      version: v0.1.0
      package: dex-connector-odoo
      operations: [searchPartners]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-odoo'
      operations: [searchPartners]
      triggers: []
  codegen:
    go:
      package: odoo
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        required: true
        description: Non-secret HTTPS origin of your Odoo 19 or newer site, such as https://mycompany.odoo.com. Find it in your browser address bar after signing in; omit /json/2 and all paths. Blank prevents connection creation. HTTP is accepted only on loopback for development.
      - name: database
        goName: Database
        type: string
        required: true
        description: Non-secret Odoo database name from your Odoo administrator or the subdomain of your Odoo Online site before .odoo.com. Enter the exact database name for X-Odoo-Database. Blank prevents requests. This header selects the database on multi-database servers.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one JSON-2 request as a positive Go duration. Blank uses the displayed default; increase only for a slow Odoo instance.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete JSON-2 response in bytes as a positive integer. Blank uses the displayed default; increase only for a larger result page.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: odoo-api-key
    fields:
      - name: apiKey
        goName: APIKey
        type: secretString
        required: true
        description: Secret Odoo JSON-2 API key from your Odoo site > user avatar > My Profile or Preferences > Account Security > New API Key. Set a description and duration, generate, and copy the complete key once. Blank prevents requests; rotate before its expiry and never put it in Flow input.
    guide:
      startURL: https://www.odoo.com/documentation/19.0/developer/reference/external_api.html
      steps:
        - Confirm your Odoo 19 or newer deployment supports the JSON-2 API and that your plan permits external API access. Use a dedicated user with the contact or CRM permissions needed by the selected operations.
        - At the Odoo site open your user avatar > My Profile or Preferences > Account Security > New API Key. Set a description and expiration, generate the key, copy it once into secret apiKey, and rotate it before expiration. Blank prevents requests.
        - Enter the site origin as baseUrl without /json/2. Ask your administrator for the database name, or use the subdomain before .odoo.com on Odoo Online, as database. Blank values prevent requests. Leave timeout and maxResponseBytes blank for the displayed defaults.
  operations:
    - name: searchPartners
      goName: SearchPartners
      inputType: SearchPartnersInput
      outputType: PartnerSearchPage
      kind: query
      description: Search company partners by Odoo ilike name pattern and return only IDs and names.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Odoo returned a bounded list of matching company partners.}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo conclusively rejected the search., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Odoo returned malformed or oversized partner data., optional: true}
        - {id: defect, goName: Defect, description: Local search input or connection credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample company matches the name pattern.
          output: {partners: [{id: 42, name: Acme Company}]}
    - name: listContacts
      goName: ListContacts
      inputType: ListContactsInput
      outputType: ContactsPage
      kind: query
      description: List a bounded page of Odoo contacts.
      idempotency: none
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Odoo returned a contact page.}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the contact list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Odoo returned invalid contact data., optional: true}
        - {id: defect, goName: Defect, description: Invalid page or credentials., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: Example contact page., output: {contacts: [{id: 42, name: Acme Company, email: contact@example.com, phone: '4155550100'}]}}
    - name: getContact
      goName: GetContact
      inputType: GetContactInput
      outputType: Contact
      kind: query
      description: Read one Odoo contact by numeric ID.
      idempotency: none
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Odoo returned the contact.}
        - {id: notFound, goName: NotFound, description: Odoo did not find the contact., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Odoo returned invalid contact data., optional: true}
        - {id: defect, goName: Defect, description: Invalid ID or credentials., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: Example contact., output: {id: 42, name: Acme Company, email: contact@example.com, phone: '4155550100'}}
    - name: createContact
      goName: CreateContact
      inputType: CreateContactInput
      outputType: CreatedContact
      kind: mutation
      description: Create one Odoo contact.
      idempotency: required
      authorization: required
      execution: {repeatOnUnknown: limited, maxSends: 3, executeMethodTimeout: 30s, durability: sync}
      branches:
        - {id: created, goName: Created, description: Odoo created the contact.}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the create., optional: true}
        - {id: defect, goName: Defect, description: Invalid contact or credentials., optional: true}
        - {id: uncertain, goName: Uncertain, description: Contact creation may have succeeded but could not be confirmed., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: Example created contact., output: {id: 42}}
    - name: updateContact
      goName: UpdateContact
      inputType: UpdateContactInput
      outputType: UpdatedContact
      kind: mutation
      description: Set a contact's name, email, and phone.
      idempotency: required
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: updated, goName: Updated, description: Odoo updated the contact.}
        - {id: notFound, goName: NotFound, description: Odoo did not find the contact., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Odoo returned invalid update data., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or credentials., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: Example updated contact., output: {id: 42}}
    - name: deleteContact
      goName: DeleteContact
      inputType: DeleteContactInput
      outputType: DeletedContact
      kind: mutation
      description: Delete one Odoo contact.
      idempotency: required
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: deleted, goName: Deleted, description: Odoo deleted the contact.}
        - {id: notFound, goName: NotFound, description: Odoo did not find the contact., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the delete., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Odoo returned invalid delete data., optional: true}
        - {id: defect, goName: Defect, description: Invalid ID or credentials., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: Example deleted contact., output: {id: 42}}
    - name: listOpportunities
      goName: ListOpportunities
      inputType: ListOpportunitiesInput
      outputType: OpportunitiesPage
      kind: query
      description: List a bounded page of CRM opportunities.
      idempotency: none
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Odoo returned the opportunity outcome.}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Odoo returned invalid opportunity data., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or credentials., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: Example opportunity outcome., output: {opportunities: [{id: 73, name: Example opportunity, emailFrom: lead@example.com, phone: '4155550100'}]}}
    - name: getOpportunity
      goName: GetOpportunity
      inputType: GetOpportunityInput
      outputType: Opportunity
      kind: query
      description: Read one CRM opportunity.
      idempotency: none
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Odoo returned the opportunity outcome.}
        - {id: notFound, goName: NotFound, description: Odoo did not find the opportunity., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Odoo returned invalid opportunity data., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or credentials., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: Example opportunity outcome., output: {id: 73, name: Example opportunity, emailFrom: lead@example.com, phone: '4155550100'}}
    - name: createOpportunity
      goName: CreateOpportunity
      inputType: CreateOpportunityInput
      outputType: CreatedOpportunity
      kind: mutation
      description: Create one CRM opportunity.
      idempotency: required
      authorization: required
      execution: {repeatOnUnknown: limited, maxSends: 3, executeMethodTimeout: 30s, durability: sync}
      branches:
        - {id: created, goName: Created, description: Odoo returned the opportunity outcome.}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or credentials., optional: true}
        - {id: uncertain, goName: Uncertain, description: Odoo may have created the opportunity but it could not be confirmed., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: Example opportunity outcome., output: {id: 73}}
    - name: updateOpportunity
      goName: UpdateOpportunity
      inputType: UpdateOpportunityInput
      outputType: UpdatedOpportunity
      kind: mutation
      description: Set an opportunity's title, email, and phone.
      idempotency: required
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: updated, goName: Updated, description: Odoo returned the opportunity outcome.}
        - {id: notFound, goName: NotFound, description: Odoo did not find the opportunity., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Odoo returned invalid opportunity data., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or credentials., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: Example opportunity outcome., output: {id: 73}}
    - name: deleteOpportunity
      goName: DeleteOpportunity
      inputType: DeleteOpportunityInput
      outputType: DeletedOpportunity
      kind: mutation
      description: Delete one CRM opportunity.
      idempotency: required
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: deleted, goName: Deleted, description: Odoo returned the opportunity outcome.}
        - {id: notFound, goName: NotFound, description: Odoo did not find the opportunity., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Odoo rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Odoo returned invalid opportunity data., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or credentials., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: Example opportunity outcome., output: {id: 73}}
