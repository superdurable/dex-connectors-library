apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: supabase
  displayName: Supabase
  description: Supabase REST connector for bounded row reads and writes.
  company: Supabase
  categories: [databases-storage]
  version: v0.3.0
spec:
  provider: supabase
  languages:
    python:
      version: v0.1.0
      operations: [upsertRows, selectRows]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-supabase"
      operations: [upsertRows, selectRows]
      triggers: []
  codegen:
    go:
      package: supabase
  configuration:
    fields:
    - name: baseUrl
      goName: BaseURL
      type: url
      description: Supabase Data API URL, which is the Project URL from https://supabase.com/dashboard
        > your project > Connect with /rest/v1 appended, such as https://abcdefghijklmnop.supabase.co/rest/v1;
        HTTPS, no trailing slash. Required for this connection.
      required: true
    - name: timeout
      goName: Timeout
      type: duration
      description: Maximum time for one HTTP request as a positive Go duration such
        as 15s or 1m; blank uses the displayed default.
      default: 15s
    - name: maxResponseBytes
      goName: MaxResponseBytes
      type: integer
      description: Maximum response body size in bytes; enter a positive integer to
        raise the safety limit for large pages. Blank uses the displayed default.
      default: 2097152
  auth:
    type: apiKey
    connectionKind: supabase-api-key
    fields:
    - name: api_key
      goName: APIKey
      type: secretString
      description: Secret Supabase credential. Start at https://supabase.com/dashboard/projects
        and follow the authorization guide to create or find it; paste the token exactly,
        without Bearer. Blank prevents calls. It is sent only in a request header.
      required: true
    guide:
      startURL: https://supabase.com/dashboard/projects
      steps:
      - Open https://supabase.com/dashboard/projects, select your project, and open
        Connect to copy the Project URL.
      - Append /rest/v1 to that HTTPS project URL and enter it as baseUrl.
      - In Project Settings > API Keys, create or copy a server-side secret key with
        the table permissions you intend to use; paste it into secret api_key.
      - Leave timeout and maxResponseBytes blank for their displayed defaults.
  operations:
  - name: selectRows
    goName: SelectRows
    inputType: SelectRowsInput
    outputType: SelectRowsOutput
    kind: query
    description: Select a bounded page of table rows through PostgREST.
    idempotency: none
    authorization: required
    branches:
    - id: selected
      goName: Selected
      description: Select a bounded page of table rows through PostgREST.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request or credentials.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
      repeatOnUnknown: safe
    mocks:
    - name: defaultSelectRows
      branch: selected
      description: A representative provider response for the example resource.
      default: true
      output:
        data:
        - id: 1
          name: Meridian
  - name: upsertRows
    goName: UpsertRows
    inputType: UpsertRowsInput
    outputType: UpsertRowsOutput
    kind: mutation
    description: Upsert rows with a declared unique conflict key and merge duplicates.
    idempotency: required
    authorization: required
    branches:
    - id: upserted
      goName: Upserted
      description: Upsert rows with a declared unique conflict key and merge duplicates.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request or credentials.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
      repeatOnUnknown: safe
    mocks:
    - name: defaultUpsertRows
      branch: upserted
      description: A representative provider response for the example resource.
      default: true
      output:
        data:
        - id: 1
          name: Meridian
  - name: getRow
    goName: GetRow
    inputType: GetRowInput
    outputType: GetRowOutput
    kind: query
    description: Get one row by an equality filter on a table column.
    idempotency: none
    authorization: required
    branches:
    - id: found
      goName: Found
      description: The matching row was returned.
    - id: notFound
      goName: NotFound
      description: No row matched the equality filter.
      optional: true
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
      repeatOnUnknown: safe
    mocks:
    - name: defaultGetRow
      branch: found
      description: A representative row.
      default: true
      output:
        data: {id: 1, name: Meridian}
  - name: updateRow
    goName: UpdateRow
    inputType: UpdateRowInput
    outputType: UpdateRowOutput
    kind: mutation
    description: Set row columns by an equality filter, with replacement values.
    idempotency: required
    authorization: required
    branches:
    - id: updated
      goName: Updated
      description: Matching rows were updated.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
      repeatOnUnknown: safe
    mocks:
    - name: defaultUpdateRow
      branch: updated
      description: A representative updated row.
      default: true
      output:
        data: [{id: 1, name: Meridian}]
  - name: deleteRow
    goName: DeleteRow
    inputType: DeleteRowInput
    outputType: DeleteRowOutput
    kind: mutation
    description: Delete rows by a required equality filter.
    idempotency: required
    authorization: required
    branches:
    - id: deleted
      goName: Deleted
      description: Matching rows were deleted, or were already absent.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
      repeatOnUnknown: safe
    mocks:
    - name: defaultDeleteRow
      branch: deleted
      description: A representative deleted row.
      default: true
      output:
        data: [{id: 1, name: Meridian}]
  - name: createRow
    goName: CreateRow
    inputType: CreateRowInput
    outputType: CreateRowOutput
    kind: mutation
    description: Insert one row with a caller-declared unique key for retry reconciliation.
    idempotency: required
    authorization: required
    branches:
    - id: created
      goName: Created
      description: The row was inserted or confirmed by its unique key.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the insert.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    - id: uncertain
      goName: Uncertain
      description: The insert may have succeeded but could not be confirmed.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: sync
      dispatchFence: true
      repeatOnUnknown: limited
      maxSends: 3
    mocks:
    - name: defaultCreateRow
      branch: created
      description: A representative inserted row.
      default: true
      output:
        data: {id: 1, external_key: meridian, name: Meridian}
