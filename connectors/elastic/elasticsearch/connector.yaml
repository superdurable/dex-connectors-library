apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: elasticsearch
  displayName: Elasticsearch
  description: Get, search, replace, and delete documents and manage Elasticsearch indices.
  company: Elastic
  categories: [databases-storage, data-search]
  version: v0.2.0
spec:
  provider: elasticsearch
  languages:
    python:
      version: v0.1.0
      package: dex-connector-elasticsearch
      operations: [indexDocument, deleteDocument, searchDocuments]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-elasticsearch'
      operations: [indexDocument, deleteDocument, searchDocuments]
      triggers: []
  codegen:
    go:
      package: elasticsearch
  configuration:
    fields:
      - name: clusterUrl
        goName: ClusterURL
        type: url
        description: Non-secret absolute HTTPS Elasticsearch endpoint from https://cloud.elastic.co/ > deployment > Manage > Application endpoints > Elasticsearch > Direct endpoint, or your self-managed cluster HTTP settings. Do not append an index, query, or fragment. Blank prevents connection creation.
        required: true
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one Elasticsearch HTTP request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; raise only for slow searches.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete search response in bytes as a positive integer. Blank uses the displayed default; raise only for larger result pages. Oversized responses select invalidResponse.
        default: 4194304
      - name: maxDocumentBytes
        goName: MaxDocumentBytes
        type: integer
        description: Maximum complete document JSON request in bytes as a positive integer. Blank uses the displayed default; raise only when indexing a larger document.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: elasticsearch-basic-auth
    fields:
      - name: username
        goName: Username
        type: string
        description: Non-secret native username from https://cloud.elastic.co/ > deployment > Open Kibana > Stack Management > Security > Users > Create user, or the same page in self-managed Kibana. Enter the exact username with index read, index, or delete privileges. Blank prevents calls.
        required: true
      - name: password
        goName: Password
        type: secretString
        description: Secret password set at https://cloud.elastic.co/ > deployment > Open Kibana > Stack Management > Security > Users > Create user, or in self-managed Kibana. Copy the exact password into Dex credentials; blank prevents calls. Rotate it from the same Users page.
        required: true
    guide:
      startURL: https://cloud.elastic.co/
      steps:
        - Open https://cloud.elastic.co/, choose the Elastic Stack deployment, and open Kibana. For a self-managed Stack cluster, open its Kibana URL directly. This Basic-auth connection does not support Elastic Cloud Serverless.
        - In Kibana choose Stack Management > Security > Roles > Create role and grant read for searches, index for document replacement, delete for document deletion, view_index_metadata for index reads, create_index for index creation, and delete_index for index deletion on the target index pattern. Save the role.
        - Choose Stack Management > Security > Users > Create user, set a username and password, assign the new role, and save username plus secret password in Dex. Rotate the password on the same Users page.
        - In https://cloud.elastic.co/ choose deployment > Manage > Application endpoints > Elasticsearch > Direct endpoint, then save its HTTPS URL as clusterUrl without an index path. For self-managed clusters use the HTTPS HTTP endpoint. Leave timeout, maxResponseBytes, and maxDocumentBytes blank for their displayed defaults.
  operations:
    - name: createIndex
      goName: CreateIndex
      inputType: IndexNameInput
      outputType: IndexResult
      kind: mutation
      description: Ensure a concrete index exists using Elasticsearch defaults; an already existing index is success.
      idempotency: required
      authorization: required
      branches:
        - {id: present, goName: Present, description: The named index exists.}
        - {id: providerRejected, goName: ProviderRejected, description: Elasticsearch conclusively denied index creation., optional: true}
        - {id: defect, goName: Defect, description: The index name or credentials are invalid., optional: true}
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      mocks:
        - {name: createdProducts, branch: present, description: The products index exists., default: true, output: {index: products}}
    - name: deleteIndex
      goName: DeleteIndex
      inputType: IndexNameInput
      outputType: IndexResult
      kind: mutation
      description: Ensure a concrete index and all its documents are absent.
      idempotency: required
      authorization: required
      branches:
        - {id: absent, goName: Absent, description: The named index is absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Elasticsearch conclusively denied index deletion., optional: true}
        - {id: defect, goName: Defect, description: The index name or credentials are invalid., optional: true}
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      mocks:
        - {name: deletedProducts, branch: absent, description: The products index is absent., default: true, output: {index: products}}
    - name: getIndex
      goName: GetIndex
      inputType: IndexNameInput
      outputType: IndexDetails
      kind: query
      description: Read settings, mappings, and aliases for one concrete index.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Elasticsearch returned index metadata.}
        - {id: notFound, goName: NotFound, description: The named index does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Elasticsearch conclusively denied the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Elasticsearch returned malformed or oversized index metadata., optional: true}
        - {id: defect, goName: Defect, description: The index name or credentials are invalid., optional: true}
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      mocks:
        - {name: productsIndex, branch: found, description: The products index metadata was returned., default: true, output: {index: products, metadata: {settings: {}, mappings: {}, aliases: {}}}}
    - name: listIndices
      goName: ListIndices
      inputType: ListIndicesInput
      outputType: IndexList
      kind: query
      description: List accessible concrete indices and their metadata using the index API.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Elasticsearch returned accessible indices.}
        - {id: providerRejected, goName: ProviderRejected, description: Elasticsearch conclusively denied index listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Elasticsearch returned malformed or oversized index metadata., optional: true}
        - {id: defect, goName: Defect, description: Connection credentials are invalid., optional: true}
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      mocks:
        - {name: productIndices, branch: found, description: The accessible products index was returned., default: true, output: {indices: [{index: products, metadata: {settings: {}, mappings: {}, aliases: {}}}]}}
    - name: getDocument
      goName: GetDocument
      inputType: GetDocumentInput
      outputType: RetrievedDocument
      kind: query
      description: Read one document by its stable ID and return its complete source.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Elasticsearch returned the document source.}
        - {id: notFound, goName: NotFound, description: The document or index does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Elasticsearch conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Elasticsearch returned malformed or oversized document data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: retrievedProduct
          branch: found
          description: A sample product document was returned by ID.
          default: true
          output: {index: products, id: sku-42, source: {title: Meridian, category: release}}
    - name: indexDocument
      goName: IndexDocument
      inputType: IndexDocumentInput
      outputType: IndexedDocument
      kind: mutation
      description: Create or fully replace one document in an existing index under a stable ID. Use an index without nonrepeatable ingest pipeline effects so retries preserve the intended source.
      idempotency: required
      authorization: required
      branches:
        - {id: indexed, goName: Indexed, description: Elasticsearch stored the requested document at the stable ID.}
        - {id: providerRejected, goName: ProviderRejected, description: Elasticsearch conclusively rejected the document replacement., optional: true}
        - {id: defect, goName: Defect, description: Local document input or credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: indexedProduct
          branch: indexed
          description: A sample product document was stored under its SKU.
          default: true
          output: {index: products, id: sku-42}
    - name: updateDocument
      goName: UpdateDocument
      inputType: UpdateDocumentInput
      outputType: IndexedDocument
      kind: mutation
      description: Merge absolute JSON field values into an existing document; scripts and increments are not accepted.
      idempotency: required
      authorization: required
      branches:
        - {id: updated, goName: Updated, description: Elasticsearch merged the document fields.}
        - {id: notFound, goName: NotFound, description: The document or index does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Elasticsearch conclusively rejected the update., optional: true}
        - {id: defect, goName: Defect, description: "The index, document ID, fields, or credentials are invalid.", optional: true}
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      mocks:
        - {name: updatedProduct, branch: updated, description: Product fields were updated., default: true, output: {index: products, id: sku-42}}
    - name: deleteDocument
      goName: DeleteDocument
      inputType: DeleteDocumentInput
      outputType: DeletedDocument
      kind: mutation
      description: Ensure one document is absent by deleting its stable ID; repeating the request is safe.
      idempotency: required
      authorization: required
      branches:
        - {id: absent, goName: Absent, description: "The document is absent, whether deleted now or already missing."}
        - {id: indexNotFound, goName: IndexNotFound, description: The requested index does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Elasticsearch conclusively rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: Local document ID or credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: deletedProduct
          branch: absent
          description: A sample product document was removed from the index.
          default: true
          output: {index: products, id: sku-42, wasDeleted: true}
    - name: searchDocuments
      goName: SearchDocuments
      inputType: SearchDocumentsInput
      outputType: SearchPage
      kind: query
      description: Search one Elasticsearch index with a Lucene query string and bounded offset page.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "Elasticsearch returned a search page, possibly empty."}
        - {id: indexNotFound, goName: IndexNotFound, description: The requested index does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Elasticsearch conclusively rejected the search., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Elasticsearch returned malformed or oversized search data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: matchingDocument
          branch: found
          description: A sample product document matches the example search.
          default: true
          output: {total: 1, relation: eq, hits: [{index: products, id: sku-42, score: 1.25, source: {title: Meridian, category: release}}]}
