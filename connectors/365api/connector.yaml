apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: hby365
  displayName: 365 API Model Catalog
  description: List model IDs available to a 365 API API Key.
  company: 365 API
  categories: [ai, developer-tools]
  version: v0.1.0
spec:
  provider: hby365
  languages:
    python: {version: v0.1.0, operations: [listModels], triggers: []}
    typescript: {version: v0.1.0, operations: [listModels], triggers: []}
  codegen:
    go:
      package: hby365
  configuration:
    fields:
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one HTTPS model-list request as a positive Go duration such as 5s or 1m. Blank uses the displayed default; increase only for a slow approved network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum model-list response size in bytes as a positive integer. Blank uses the displayed default; increase only if the provider adds more model metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: hby365-api-key
    fields:
      - name: apiKey
        goName: APIKey
        type: secretString
        required: true
        description: Secret API Key from https://www.hby365.studio/console > API Keys. Create and copy the Key once into Dex Connections; blank prevents requests.
    guide:
      startURL: https://www.hby365.studio/developers
      steps:
        - Sign in at https://www.hby365.studio/console, open API Keys, create a secret API Key and copy it once into Dex Connections. The field is required; blank prevents requests.
        - Start ListModels with {}. The connector calls the current HTTPS www.hby365.studio domain and returns at most the first 50 model IDs visible to the Key. It does not call inference or expose model metadata.
        - Leave timeout and maxResponseBytes blank for their displayed defaults. The fixed production endpoint is www.hby365.studio; model availability follows the Key and provider catalog.
  operations:
    - name: listModels
      goName: ListModels
      inputType: ListModelsInput
      outputType: ListModelsOutput
      kind: query
      description: List up to 50 model IDs enabled for the API Key.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: 365 API returned the available model list.}
        - {id: providerRejected, goName: ProviderRejected, description: 365 API rejected the Key or request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: 365 API returned malformed or oversized model data., optional: true}
        - {id: defect, goName: Defect, description: The local API Key is invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: oneModel
          branch: found
          description: One available API model ID.
          default: true
          output: {total: 1, modelIDs: [example-model]}
        - name: noModels
          branch: found
          description: No models are enabled for the Key.
          output: {total: 0, modelIDs: []}
