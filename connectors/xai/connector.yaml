apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: grok
  displayName: xAI Grok
  description: xAI Grok text generation with JSON Schema structured output, reasoning effort, token usage, and streamed text.
  company: xAI
  version: v0.1.0
spec:
  provider: xai
  codegen:
    go:
      package: grok
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "Grok model for this connection, such as grok-4.3 or grok-4.7. Blank uses grok-4.3. A request that names a model overrides it."
        required: false
        default: grok-4.3
      - name: endpoint
        goName: Endpoint
        type: url
        description: "xAI API base endpoint: https://api.x.ai/v1 (global) or https://us.api.x.ai/v1 (US regional, currently grok-4.7 and grok-4.6 only). No other value is accepted."
        required: false
        default: https://api.x.ai/v1
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete provider response in bytes; enter a positive integer only when a gateway needs a different safety limit. Larger responses select invalidResponse.
        required: false
        default: 8388608
  auth:
    type: apiKey
    connectionKind: grok-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: Secret team API key from xAI Console > API Keys; copy the xai- value when it is created. It is sent only as an Authorization bearer token.
        required: true
    guide:
      startURL: https://console.x.ai/
      steps:
        - In xAI Console, select the team that should own billing, load credits if required, and open API Keys.
        - Choose Create API key, name the key, grant only the models and endpoints this connection needs, and copy the xai- secret shown once.
        - Use the US endpoint only for models available there; otherwise leave endpoint, model, and limit fields blank for displayed defaults.
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, grok.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      # The language-models list carries modalities, aliases, and reasoning
      # efforts; the US regional list is the fallback when it fails.
      - id: listModels
        capability: grok.models-list
        request:
          method: GET
          url: https://api.x.ai/v1/language-models
          credential: {field: api_key, scheme: bearer}
      - id: listModelsUS
        capability: grok.models-list
        request:
          method: GET
          url: https://us.api.x.ai/v1/models
          credential: {field: api_key, scheme: bearer}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: "Choose one Step's Grok model from xAI's live global model list. A connection on the US regional endpoint currently serves only grok-4.7 and grok-4.6."
        backendCapabilities: [grok.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: generateText
      goName: GenerateText
      inputType: GenerateTextRequest
      outputType: GenerateTextResponse
      kind: query
      description: Generate text or JSON Schema structured output with a Grok model through the stateless Chat Completions endpoint.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: The model finished normally and returned text.}
        - {id: truncated, goName: Truncated, description: The model stopped at the output token limit and returned any partial text., optional: true}
        - {id: blocked, goName: Blocked, description: "xAI stopped the response for a content policy, or the model refused.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "xAI conclusively rejected the request, such as an invalid API key, an unknown model, or missing permission.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "xAI returned a malformed, oversized, or unusable response, including structured output that does not match its schema.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      progress: [text]
      execution:
        # Requests stream, because xAI reasoning models can think for minutes
        # before the first token, so the streaming generateText budget applies.
        executeMethodTimeout: 900s
        heartbeatTimeout: 60s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 4, totalDuration: 30m}
