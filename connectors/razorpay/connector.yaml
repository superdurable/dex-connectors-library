apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: razorpay
  displayName: Razorpay
  description: Read payment status and create or inspect Razorpay orders.
  company: Razorpay
  categories: [finance-payments]
  version: v0.2.0
spec:
  provider: razorpay
  languages:
    python:
      version: v0.1.0
      package: dex-connector-razorpay
      operations: [getPayment]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-razorpay"
      operations: [getPayment]
      triggers: []
  codegen:
    go:
      package: razorpay
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Razorpay API root as an absolute HTTPS URL ending in /v1. Blank uses the displayed endpoint; override only for a trusted local test gateway. Test and Live keys use this URL.
        default: https://api.razorpay.com/v1
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow payment reads.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete payment response in bytes as a positive integer. Blank uses the displayed default; increase for unusually large payment metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: razorpay-api-keys
    fields:
      - name: key_id
        goName: KeyID
        type: secretString
        required: true
        description: Razorpay Key ID from Account & Settings > API Keys > Generate Key, beginning rzp_test_ or rzp_live_. Copy the complete value; blank prevents calls. Dex stores it with the secret credentials.
      - name: key_secret
        goName: KeySecret
        type: secretString
        required: true
        description: Secret paired with the Razorpay Key ID on the same Generate Key page. Copy the complete opaque value when shown; blank prevents calls. Dex uses both fields only in HTTP Basic authentication.
    guide:
      startURL: https://dashboard.razorpay.com
      steps:
        - Sign in to the Razorpay Dashboard, select Test or Live Mode, then open Account & Settings > API Keys > Generate Key. Copy the Key ID beginning rzp_test_ or rzp_live_ and its paired opaque Key Secret into Dex Web secret key_id and key_secret. Blank is invalid. Regenerate the pair on the same page to rotate it; Test and Live keys cannot be mixed.
        - Leave baseUrl, timeout, and maxResponseBytes blank for displayed defaults. Find the non-secret pay_ payment ID on the Dashboard Payments page or from an API response and pass it as paymentId; blank is invalid. The payment amount returned is in currency subunits.
  operations:
    - name: listRefunds
      goName: ListRefunds
      inputType: ListRefundsInput
      outputType: RefundPage
      kind: query
      description: List one bounded page of refund statuses.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Razorpay returned a refund page.}
        - {id: providerRejected, goName: ProviderRejected, description: Razorpay conclusively rejected the refund list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Razorpay returned unusable refund data., optional: true}
        - {id: defect, goName: Defect, description: The page input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample refund page was returned.
          output: {refunds: [{id: rfnd_FP8QHiV938haTz, paymentId: pay_DG4ZdRK8ZnXC3k, status: processed, amount: 100, currencyCode: INR}], count: 1}
    - name: getRefund
      goName: GetRefund
      inputType: GetRefundInput
      outputType: RefundStatus
      kind: query
      description: Read one refund by ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Razorpay returned the refund.}
        - {id: notFound, goName: NotFound, description: The refund was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Razorpay conclusively rejected the refund lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Razorpay returned unusable refund data., optional: true}
        - {id: defect, goName: Defect, description: The refund ID or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample processed refund was returned.
          output: {id: rfnd_FP8QHiV938haTz, paymentId: pay_DG4ZdRK8ZnXC3k, status: processed, amount: 100, currencyCode: INR}
    - name: createNormalRefund
      goName: CreateNormalRefund
      inputType: CreateNormalRefundInput
      outputType: RefundStatus
      kind: mutation
      description: Create a normal refund using Razorpay's idempotency header.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: created, goName: Created, description: Razorpay accepted the normal refund.}
        - {id: providerRejected, goName: ProviderRejected, description: Razorpay conclusively rejected the refund., optional: true}
        - {id: defect, goName: Defect, description: The refund input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: One normal refund was accepted.
          output: {id: rfnd_FP8QHiV938haTz, paymentId: pay_DG4ZdRK8ZnXC3k, status: processed, amount: 100, currencyCode: INR}
    - name: listPayments
      goName: ListPayments
      inputType: ListPaymentsInput
      outputType: PaymentPage
      kind: query
      description: List one bounded page of payment statuses.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Razorpay returned a payment page.}
        - {id: providerRejected, goName: ProviderRejected, description: Razorpay conclusively rejected the payment list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Razorpay returned unusable payment data., optional: true}
        - {id: defect, goName: Defect, description: The page input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample payment page was returned.
          output: {payments: [{id: pay_DG4ZdRK8ZnXC3k, status: captured, amount: 100, currencyCode: INR}], count: 1}
    - name: capturePayment
      goName: CapturePayment
      inputType: CapturePaymentInput
      outputType: PaymentStatus
      kind: mutation
      description: Capture one authorized payment for its full amount.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: captured, goName: Captured, description: The payment is captured for the requested amount.}
        - {id: providerRejected, goName: ProviderRejected, description: Razorpay conclusively rejected capture., optional: true}
        - {id: defect, goName: Defect, description: The payment input or credentials are invalid., optional: true}
      mocks:
        - name: capturedDefault
          branch: captured
          default: true
          description: One sample payment was captured.
          output: {id: pay_DG4ZdRK8ZnXC3k, status: captured, amount: 100, currencyCode: INR}
    - name: listOrders
      goName: ListOrders
      inputType: ListOrdersInput
      outputType: OrderPage
      kind: query
      description: List one bounded page of order summaries.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Razorpay returned an order page.}
        - {id: providerRejected, goName: ProviderRejected, description: Razorpay conclusively rejected the order list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Razorpay returned unusable order data., optional: true}
        - {id: defect, goName: Defect, description: The page input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample order page was returned.
          output: {orders: [{id: order_RB58MiP5SPFYyM, status: created, amount: 5000, currencyCode: INR, receipt: receipt-1}], count: 1}
    - name: getOrder
      goName: GetOrder
      inputType: GetOrderInput
      outputType: OrderSummary
      kind: query
      description: Read one order by ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Razorpay returned the order.}
        - {id: notFound, goName: NotFound, description: The order was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Razorpay conclusively rejected the order lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Razorpay returned unusable order data., optional: true}
        - {id: defect, goName: Defect, description: The order ID or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample order was returned.
          output: {id: order_RB58MiP5SPFYyM, status: created, amount: 5000, currencyCode: INR, receipt: receipt-1}
    - name: createOrder
      goName: CreateOrder
      inputType: CreateOrderInput
      outputType: OrderSummary
      kind: mutation
      description: Create an order with a call-derived unique receipt for safe retries.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: created, goName: Created, description: Razorpay created or confirmed this order.}
        - {id: providerRejected, goName: ProviderRejected, description: Razorpay conclusively rejected order creation., optional: true}
        - {id: defect, goName: Defect, description: The order input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: One sample INR order was created.
          output: {id: order_RB58MiP5SPFYyM, status: created, amount: 5000, currencyCode: INR, receipt: dex_0123456789abcdef0123456789abcdef}
    - name: getPayment
      goName: GetPayment
      inputType: GetPaymentInput
      outputType: PaymentStatus
      kind: query
      description: Read one payment's ID, status, amount in currency subunits, and currency code.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Razorpay returned the payment.}
        - {id: notFound, goName: NotFound, description: Razorpay did not expose the payment., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Razorpay conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Razorpay returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample captured payment is returned.
          output: {id: pay_DG4ZdRK8ZnXC3k, status: captured, amount: 100, currencyCode: INR}
