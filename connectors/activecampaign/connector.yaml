apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: activecampaign
  displayName: ActiveCampaign
  description: List contacts and lists, and inspect, upsert, and update contacts through the ActiveCampaign API.
  company: ActiveCampaign
  categories: [marketing, crm-sales]
  version: v0.3.0
spec:
  provider: activecampaign
  languages:
    python:
      version: v0.2.0
      operations: [listContacts, getContact]
      triggers: []
    typescript:
      version: v0.2.0
      package: '@superdurable/connector-activecampaign'
      operations: [listContacts, getContact]
      triggers: []
  codegen:
    go:
      package: activecampaign
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        required: true
        description: Non-secret account-specific API root copied from ActiveCampaign Settings > Developer at https://www.activecampaign.com/login. Enter the full HTTPS API URL ending in /api/3 without a trailing resource path, query, or token; blank prevents connection creation. It may have an account-specific domain and region.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; increase only for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum complete API response in bytes. Blank uses the displayed default; increase for known larger contact pages. Oversized responses select invalidResponse.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: activecampaign-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret user-specific API Key from ActiveCampaign Settings > Developer at https://www.activecampaign.com/login. Copy the full key into this secret field; blank makes calls select defect. Dex sends it only in the Api-Token header. Reset it on the same page to revoke an exposed key.
    guide:
      startURL: https://www.activecampaign.com/login
      steps:
        - Sign in to the ActiveCampaign account at https://www.activecampaign.com/login, click Settings (gear), then Developer.
        - Copy the account's full API URL into non-secret baseUrl; it ends in /api/3 and is unique to the account. Copy the current user's API Key into secret api_key and save the connection.
        - Ensure this API user can view the intended contacts and lists; tag creation, update, and deletion require tag management permission. Reset the API Key under Settings > Developer when rotating it, then update this Dex connection. Leave timeout and maxResponseBytes blank for their displayed defaults.
  operations:
    - name: listTags
      goName: ListTags
      inputType: ListTagsInput
      outputType: TagsPage
      kind: query
      description: List contact tag definitions by page.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: ActiveCampaign completed the tag operation.}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample tag result.
          output: {tags: [{id: '16', name: Newsletter, description: Monthly, tagType: contact}], offset: 0, limit: 20, total: 1}
    - name: getTag
      goName: GetTag
      inputType: GetTagInput
      outputType: TagMetadata
      kind: query
      description: Read one contact tag definition by ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: ActiveCampaign completed the tag operation.}
        - {id: notFound, goName: NotFound, description: The tag ID does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample tag result.
          output: {id: '16', name: Newsletter, description: Monthly, tagType: contact}
    - name: createTag
      goName: CreateTag
      inputType: CreateTagInput
      outputType: TagMetadata
      kind: mutation
      description: Create a contact tag definition by name; repeating returns the existing tag.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: created, goName: Created, description: ActiveCampaign completed the tag operation.}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: One sample tag result.
          output: {id: '16', name: Newsletter, description: Monthly, tagType: contact}
    - name: updateTag
      goName: UpdateTag
      inputType: UpdateTagInput
      outputType: TagMetadata
      kind: mutation
      description: Set a contact tag definition's name and description by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: ActiveCampaign updated the tag definition.}
        - {id: notFound, goName: NotFound, description: The tag ID does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One sample tag result.
          output: {id: '16', name: Newsletter, description: Monthly, tagType: contact}
    - name: deleteTag
      goName: DeleteTag
      inputType: DeleteTagInput
      outputType: TagDeletion
      kind: mutation
      description: Delete one tag definition and remove its effect from all contacts.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: ActiveCampaign deleted the tag definition.}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: One sample tag result.
          output: {tagId: '16', deleted: true}
    - name: listLists
      goName: ListLists
      inputType: ListListsInput
      outputType: ListsPage
      kind: query
      description: List one page of email contact lists and their subscriber counts.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: ActiveCampaign returned the selected list page.}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample email list is returned.
          output: {lists: [{id: '11', name: Newsletter, activeSubscribers: 7, nonDeletedSubscribers: 8}], offset: 0, limit: 20, total: 1}
    - name: getList
      goName: GetList
      inputType: GetListInput
      outputType: ListMetadata
      kind: query
      description: Read one contact list by numeric ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: ActiveCampaign returned list metadata.}
        - {id: notFound, goName: NotFound, description: No list with this ID is visible to the API user., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample email list is returned.
          output: {id: '11', name: Newsletter, activeSubscribers: 0, nonDeletedSubscribers: 0}
    - name: listContacts
      goName: ListContacts
      inputType: ListContactsInput
      outputType: ContactsPage
      kind: query
      description: List one page of contact IDs, email addresses, and names without embedded relationships.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: ActiveCampaign returned the selected contact page.}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample contact is listed.
          output: {contacts: [{id: '68', email: 'ada@example.com', firstName: Ada, lastName: Lovelace}], offset: 0, limit: 20, total: 1}
    - name: getContact
      goName: GetContact
      inputType: GetContactInput
      outputType: ContactMetadata
      kind: query
      description: Read one contact's ID, email address, and name without embedded relationships.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: ActiveCampaign returned contact metadata.}
        - {id: notFound, goName: NotFound, description: No contact with this ID is visible to the API user., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Metadata for one sample contact.
          output: {id: '68', email: 'ada@example.com', firstName: Ada, lastName: Lovelace}
    - name: syncContact
      goName: SyncContact
      inputType: SyncContactInput
      outputType: ContactMetadata
      kind: mutation
      description: Create or update one contact by email, returning its stable ID and names.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: synced, goName: Synced, description: ActiveCampaign created or updated the contact.}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the contact., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: syncedDefault
          branch: synced
          default: true
          description: One sample contact was synchronized.
          output: {id: '68', email: 'ada@example.com', firstName: Ada, lastName: Lovelace}
    - name: updateContact
      goName: UpdateContact
      inputType: UpdateContactInput
      outputType: ContactMetadata
      kind: mutation
      description: Set one contact's email or names by numeric contact ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: ActiveCampaign updated the contact.}
        - {id: notFound, goName: NotFound, description: No contact with this ID exists., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One sample contact was updated.
          output: {id: '68', email: 'ada@example.com', firstName: Ada, lastName: Lovelace}
