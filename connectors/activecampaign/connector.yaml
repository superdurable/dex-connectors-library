apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: activecampaign
  displayName: ActiveCampaign
  description: List contacts and lists, and inspect, upsert, and update contacts through the ActiveCampaign API.
  company: ActiveCampaign
  categories: [marketing, crm-sales]
  version: v0.3.0
spec:
  provider: activecampaign
  languages:
    python:
      version: v0.2.0
      operations: [listContacts, getContact]
      triggers: []
    typescript:
      version: v0.2.0
      package: '@superdurable/connector-activecampaign'
      operations: [listContacts, getContact]
      triggers: []
  codegen:
    go:
      package: activecampaign
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        required: true
        description: Non-secret account-specific API root copied from ActiveCampaign Settings > Developer at https://www.activecampaign.com/login. Enter the full HTTPS API URL ending in /api/3 without a trailing resource path, query, or token; blank prevents connection creation. It may have an account-specific domain and region.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; increase only for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum complete API response in bytes. Blank uses the displayed default; increase for known larger contact pages. Oversized responses select invalidResponse.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: activecampaign-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret user-specific API Key from ActiveCampaign Settings > Developer at https://www.activecampaign.com/login. Copy the full key into this secret field; blank makes calls select defect. Dex sends it only in the Api-Token header. Reset it on the same page to revoke an exposed key.
    guide:
      startURL: https://www.activecampaign.com/login
      steps:
        - Sign in to the ActiveCampaign account at https://www.activecampaign.com/login, click Settings (gear), then Developer.
        - Copy the account's full API URL into non-secret baseUrl; it ends in /api/3 and is unique to the account. Copy the current user's API Key into secret api_key and save the connection.
        - Ensure this API user can view and edit the intended contacts and lists; list subscriptions need contact edit permission and resubscribing an unsubscribed contact needs resubscribe permission. Existing contact-tag assignment needs contact edit permission, tag-definition writes need tag management permission, deal operations need Deals and pipeline management permission, CRM account writes need account management permission, and ecommerce connection writes need integration management permission. Reset the API Key under Settings > Developer when rotating it, then update this Dex connection. Leave timeout and maxResponseBytes blank for their displayed defaults.
  operations:
    - name: listEcommerceCustomers
      goName: ListEcommerceCustomers
      inputType: ListEcommerceCustomersInput
      outputType: EcommerceCustomersPage
      kind: query
      description: List Deep Data ecommerce customers.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: ActiveCampaign completed the ecommerce customer operation.}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample ecommerce customer result.
          output: {customers: [{id: '15', connectionId: '3', externalId: store-customer-1, email: 'person@example.com'}], total: 1}
    - name: getEcommerceCustomer
      goName: GetEcommerceCustomer
      inputType: GetEcommerceCustomerInput
      outputType: EcommerceCustomerMetadata
      kind: query
      description: Read one Deep Data ecommerce customer.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: ActiveCampaign completed the ecommerce customer operation.}
        - {id: notFound, goName: NotFound, description: No customer exists at the selected ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: ActiveCampaign returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Sample ecommerce customer result.
          output: {id: '15', connectionId: '3', externalId: store-customer-1, email: 'person@example.com'}
    - name: createEcommerceCustomer
      goName: CreateEcommerceCustomer
      inputType: CreateEcommerceCustomerInput
      outputType: EcommerceCustomerMetadata
      kind: mutation
      description: Create one ecommerce customer with bounded sends.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: ActiveCampaign completed the ecommerce customer operation.}
        - {id: uncertain, goName: Uncertain, description: Bounded customer creation could not be confirmed., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: ActiveCampaign conclusively rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
