apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: zendesk-support
  displayName: Zendesk Support
  description: Search, list, read, create, update, and delete Zendesk Support tickets and manage related users and organizations.
  company: Zendesk
  categories: [customer-support]
  version: v0.25.0
spec:
  provider: zendesk
  languages:
    python:
      version: v0.2.0
      package: dex-connector-zendesk-support
      operations: [searchTickets, getTicket, createTicket, updateTicket]
      triggers: [ticketChanged]
    typescript:
      version: v0.2.0
      package: "@superdurable/connector-zendesk-support"
      operations: [searchTickets, getTicket, createTicket, updateTicket]
      triggers: [ticketChanged]
  codegen:
    go:
      package: support
  configuration:
    fields:
      - name: subdomain
        goName: Subdomain
        type: string
        description: "Non-secret Zendesk account subdomain: the acme in https://acme.zendesk.com. Sign in at https://www.zendesk.com/login/ and copy the part before .zendesk.com from the Agent Workspace address bar, or from Admin Center > Account > Brand management > Brands for the default brand. Enter lowercase letters, digits, and hyphens only, without https:// or .zendesk.com; a host-mapped domain such as support.example.com does not work. Required: every API request is sent to this account."
        required: true
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum complete Zendesk API response in bytes. Leave blank to keep the displayed safety limit; enter a positive integer only to change it, for example when ticket descriptions are unusually large. An oversized response selects invalidResponse."
        required: false
        default: 4194304
      - name: pollInterval
        goName: PollInterval
        type: duration
        description: "Delay between ticketChanged Trigger polls of Zendesk's incremental ticket export, as a Go duration of at least 5s such as 30s or 5m. Leave blank to keep the displayed interval; a shorter interval delivers changes sooner but shares the export's 10 requests per minute per account with other bindings and integrations. Takes effect when the Worker restarts."
        required: false
        default: 1m
  auth:
    type: apiKey
    connectionKind: zendesk-support-api-token
    fields:
      - name: email
        goName: Email
        type: string
        description: "Non-secret email address of the Zendesk agent or administrator the connector acts as, listed at https://{subdomain}.zendesk.com/admin under People > Team > Team members; enter one bare address such as agent@example.com. Tickets and comments the connector writes are authored by this user, and it can only read and change tickets that user can. The ticketChanged Trigger reads Zendesk's incremental ticket export, which Zendesk allows only for administrators, so enter an administrator's address when an application uses it. It is stored with the API token, so replacing both takes effect without an application restart."
        required: true
      - name: api_token
        goName: APIToken
        type: secretString
        description: "Secret Zendesk API token created at https://{subdomain}.zendesk.com/admin under Apps and integrations > APIs > API tokens > Add API token; Zendesk shows the full token only once, when you select Save. It is an opaque string of letters and digits. Stored only in this credential field; after deactivating or replacing a token in Admin Center, paste the new token here."
        required: true
    guide:
      startURL: https://www.zendesk.com/login/
      steps:
        - Sign in to the Zendesk account as an administrator and open Admin Center at https://{subdomain}.zendesk.com/admin, where {subdomain} is the value entered in the subdomain field.
        - Open Apps and integrations > APIs > API configuration, check Allow API token access, and select Save; token access is off by default.
        - Open Apps and integrations > APIs > API tokens, select Add API token, enter a description such as Dex, select Save, and copy the token shown once into api_token.
        - Enter the email address of the agent the connector acts as; Zendesk authenticates it as {email}/token with the token, and that agent's role limits which tickets the connector can read and change.
        - Zendesk deletes tokens unused for 30 days and plans to stop accepting API tokens on April 30, 2027; to revoke access, open the token's options menu and choose Deactivate.
  triggers:
    - name: ticketChanged
      goName: TicketChanged
      eventType: TicketChangedEvent
      configurationType: TicketChangedTriggerConfiguration
      description: "Receive each ticket created, updated, or deleted in the account, read through Zendesk's cursor-based incremental ticket export; the first run records a baseline and delivers no existing tickets. Requires an admin connection."
  operations:
    - name: listTickets
      goName: ListTickets
      inputType: ListTicketsInput
      outputType: ListTicketsOutput
      kind: query
      description: List one bounded cursor page of tickets available to the agent.
      idempotency: none
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Zendesk returned one ticket page.}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zendesk returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Page input or credentials are invalid., optional: true}
      pagination: {inputField: cursor, nextField: nextCursor}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample ticket is listed.
          pages:
            - {tickets: [{id: 35436, agentUrl: "https://acme.zendesk.com/agent/tickets/35436", subject: Customer issue, status: open, requesterId: 7701, createdAt: "2026-10-21T08:00:00Z", updatedAt: "2026-10-22T08:00:00Z"}], nextCursor: cursor-1}
            - {tickets: [{id: 35437, agentUrl: "https://acme.zendesk.com/agent/tickets/35437", subject: Follow-up, status: pending, requesterId: 7701, createdAt: "2026-10-23T08:00:00Z", updatedAt: "2026-10-24T08:00:00Z"}], nextCursor: cursor-2}
            - {tickets: [], nextCursor: ""}
    - name: deleteTicket
      goName: DeleteTicket
      inputType: DeleteTicketInput
      outputType: DeleteTicketOutput
      kind: mutation
      description: Soft-delete one ticket by ID when the connection has delete permission.
      idempotency: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Zendesk accepted the ticket deletion.}
        - {id: notFound, goName: NotFound, description: The ticket does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the delete., optional: true}
        - {id: defect, goName: Defect, description: Ticket ID or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: One sample ticket is deleted.
          output: {ticketId: 35436}
    - name: recoverSuspendedTicket
      goName: RecoverSuspendedTicket
      inputType: RecoverSuspendedTicketInput
      outputType: RecoverSuspendedTicketOutput
      kind: mutation
      description: Recover one suspended ticket, assigning the authenticated agent as requester.
      idempotency: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: recovered, goName: Recovered, description: Zendesk recovered the suspended ticket.}
        - {id: notFound, goName: NotFound, description: The suspended ticket does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the recovery., optional: true}
        - {id: defect, goName: Defect, description: Suspended ticket ID or credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The recovery may have succeeded but could not be confirmed., optional: true}
      mocks:
        - name: recoveredDefault
          branch: recovered
          default: true
          description: One sample suspended ticket is recovered.
          output: {ticket: {id: 35436, agentUrl: "https://acme.zendesk.com/agent/tickets/35436", subject: Customer issue, status: open, requesterId: 7701, createdAt: "2026-10-21T08:00:00Z", updatedAt: "2026-10-22T08:00:00Z"}}
    - name: listTicketFields
      goName: ListTicketFields
      inputType: ListTicketFieldsInput
      outputType: ListTicketFieldsOutput
      kind: query
      description: List one cursor page of system and custom ticket fields visible to the agent.
      idempotency: none
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Zendesk returned one ticket-field page.}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zendesk returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Page input or credentials are invalid., optional: true}
      pagination: {inputField: cursor, nextField: nextCursor}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample ticket field is listed.
          pages:
            - {fields: [{id: 34, title: Subject, type: subject, active: true, required: true}], nextCursor: cursor-1}
            - {fields: [{id: 35, title: Priority, type: priority, active: true, required: false}], nextCursor: cursor-2}
            - {fields: [], nextCursor: ""}
    - name: getTicketField
      goName: GetTicketField
      inputType: GetTicketFieldInput
      outputType: GetTicketFieldOutput
      kind: query
      description: Read one ticket field by its numeric Zendesk ID.
      idempotency: none
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Zendesk returned the ticket field.}
        - {id: notFound, goName: NotFound, description: The ticket field does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zendesk returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Field ID or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample ticket field is read.
          output: {field: {id: 34, title: Subject, type: subject, active: true, required: true}}
    - name: listUsers
      goName: ListUsers
      inputType: ListUsersInput
      outputType: ListUsersOutput
      kind: query
      description: List one cursor page of users visible to the authenticated agent.
      idempotency: none
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Zendesk returned one user page.}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zendesk returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Page input or credentials are invalid., optional: true}
      pagination: {inputField: cursor, nextField: nextCursor}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample users are listed.
          pages:
            - {users: [{id: 7701, name: Jane Smith, email: jane@acme.example.com, role: end-user}], nextCursor: cursor-1}
            - {users: [{id: 7702, name: Alex Lee, email: alex@acme.example.com, role: end-user}], nextCursor: cursor-2}
            - {users: [], nextCursor: ""}
    - name: getUser
      goName: GetUser
      inputType: GetUserInput
      outputType: GetUserOutput
      kind: query
      description: Read one user by numeric Zendesk ID.
      idempotency: none
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Zendesk returned the user.}
        - {id: notFound, goName: NotFound, description: The user does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zendesk returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: User ID or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample end user is read.
          output: {user: {id: 7701, name: Jane Smith, email: jane@acme.example.com, role: end-user}}
    - name: searchUsers
      goName: SearchUsers
      inputType: SearchUsersInput
      outputType: SearchUsersOutput
      kind: query
      description: Search users by a nonempty Zendesk query using offset pagination.
      idempotency: none
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: searched, goName: Searched, description: Zendesk returned one matching user page.}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the search., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zendesk returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Search input or credentials are invalid., optional: true}
      mocks:
        - name: searchedDefault
          branch: searched
          default: true
          description: One sample user matches the search.
          output: {users: [{id: 7701, name: Jane Smith, email: jane@acme.example.com, role: end-user}], nextPage: 0}
    - name: createUser
      goName: CreateUser
      inputType: CreateUserInput
      outputType: CreateUserOutput
      kind: mutation
      description: Create an end user with an application-unique external ID for retry reconciliation.
      idempotency: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Zendesk created or confirmed this end user.}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk conclusively rejected the create., optional: true}
        - {id: defect, goName: Defect, description: User input or credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The create may have succeeded but could not be confirmed., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample end user is created.
          output: {user: {id: 7701, name: Jane Smith, email: jane@acme.example.com, externalId: dex-jane-1, role: end-user}}
    - name: updateUser
      goName: UpdateUser
      inputType: UpdateUserInput
      outputType: UpdateUserOutput
      kind: mutation
      description: Replace selected end-user profile fields by user ID.
      idempotency: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Zendesk returned the updated user.}
        - {id: notFound, goName: NotFound, description: The user does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the update., optional: true}
        - {id: defect, goName: Defect, description: User input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: A sample end user is updated.
          output: {user: {id: 7701, name: Jane Smith, email: jane@acme.example.com, role: end-user}}
    - name: deleteUser
      goName: DeleteUser
      inputType: DeleteUserInput
      outputType: DeleteUserOutput
      kind: mutation
      description: Delete one user by ID; Zendesk does not allow recovery.
      idempotency: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Zendesk accepted the user deletion.}
        - {id: notFound, goName: NotFound, description: The user does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: User ID or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: A sample end user is deleted.
          output: {userId: 7701}
    - name: searchTickets
      goName: SearchTickets
      inputType: SearchTicketsInput
      outputType: SearchTicketsOutput
      kind: query
      description: Search tickets by status, requester email, tag, update time, and keywords, returning one bounded page and a cursor for the next.
      idempotency: none
      branches:
        - {id: searched, goName: Searched, description: "One page of matching tickets was returned; it may be empty."}
        - {id: providerRejected, goName: ProviderRejected, description: "Zendesk conclusively rejected the search, such as invalid credentials, a missing permission, or an expired cursor.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zendesk returned an invalid or oversized search page., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      pagination: {inputField: cursor, nextField: nextCursor}
      mocks:
        - name: customerIssueTickets
          branch: searched
          description: "Searching Jane's billing-double-charge tickets returns two unsolved matches and a newer solved one, ordered by creation."
          default: true
          pages:
            - {tickets: [{id: 35435, agentUrl: "https://acme.zendesk.com/agent/tickets/35435", subject: Double charge on order 88213, status: pending, requesterId: 7701, tags: [billing-double-charge], createdAt: "2026-10-20T08:00:00Z", updatedAt: "2026-10-21T08:00:00Z"}, {id: 35436, agentUrl: "https://acme.zendesk.com/agent/tickets/35436", subject: Double charge on order 88213, status: pending, requesterId: 7701, tags: [billing-double-charge], createdAt: "2026-10-21T08:00:00Z", updatedAt: "2026-10-22T08:00:00Z"}], nextCursor: cursor-1}
            - {tickets: [{id: 35438, agentUrl: "https://acme.zendesk.com/agent/tickets/35438", subject: Double charge on order 88213, status: solved, requesterId: 7701, tags: [billing-double-charge], createdAt: "2026-10-22T09:00:00Z", updatedAt: "2026-10-23T09:00:00Z"}], nextCursor: cursor-2}
            - {tickets: [], nextCursor: ""}
        - name: accessDenied
          branch: providerRejected
          description: "searchTickets without agent permission returns HTTP 403."
          failure: {kind: AUTHORIZATION, message: Zendesk rejected the request with HTTP 403.}
    - name: getTicket
      goName: GetTicket
      inputType: GetTicketInput
      outputType: TicketDetails
      kind: query
      description: Read one ticket by ID with its requester and a bounded list of its latest comments.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: The ticket and its latest comments were read.}
        - {id: notFound, goName: NotFound, description: The ticket does not exist or is not visible to the connection's agent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Zendesk conclusively rejected the ticket read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Zendesk returned an invalid or oversized ticket or comment page., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: customerIssueTicket
          branch: found
          description: "Reading ticket 35436 returns Jane's pending double-charge issue and latest comment."
          default: true
          output:
            ticket: {id: 35436, agentUrl: "https://acme.zendesk.com/agent/tickets/35436", subject: Double charge on order 88213, status: pending, requesterId: 7701, tags: [billing-double-charge], createdAt: "2026-10-21T08:00:00Z", updatedAt: "2026-10-22T08:00:00Z"}
            requester: {id: 7701, name: Jane Smith, email: jane@acme.example.com, role: end-user}
            latestComments: [{id: 88001, authorId: 7701, isPublic: true, body: I was charged twice for order 88213., createdAt: "2026-10-21T08:00:00Z"}]
        - name: missingTicket
          branch: notFound
          description: "Reading nonexistent ticket 99999 returns HTTP 404."
          failure: {kind: NOT_FOUND, message: Zendesk found no such resource.}
        - name: accessDenied
          branch: providerRejected
          description: "getTicket without agent permission returns HTTP 403."
          failure: {kind: AUTHORIZATION, message: Zendesk rejected the request with HTTP 403.}
    - name: createTicket
      goName: CreateTicket
      inputType: CreateTicketInput
      outputType: CreateTicketOutput
      kind: mutation
      description: Create one ticket with its first comment under a Zendesk Idempotency-Key derived from the Step, so a retried or re-dispatched Step returns the same ticket.
      idempotency: required
      branches:
        - {id: created, goName: Created, description: "The ticket exists; a repeated attempt returns the ticket the first attempt created."}
        - {id: providerRejected, goName: ProviderRejected, description: "Zendesk conclusively rejected the ticket, such as an invalid requester, group, or assignee; no ticket was created.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Zendesk accepted the request but returned an invalid or oversized ticket, so the ticket may exist.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        # Every attempt sends the same Step-derived Zendesk Idempotency-Key, so a repeat returns the first ticket.
        repeatOnUnknown: safe
      mocks:
        - name: openedCustomerIssue
          branch: created
          description: "Opening Jane's double-charge issue after no match creates ticket 35437."
          default: true
          output: {ticket: {id: 35437, agentUrl: "https://acme.zendesk.com/agent/tickets/35437", subject: Double charge on order 88213, description: I was charged twice for order 88213., status: open, priority: normal, requesterId: 7701, tags: [billing-double-charge], createdAt: "2026-10-26T12:00:00Z", updatedAt: "2026-10-26T12:00:00Z"}}
        - name: accessDenied
          branch: providerRejected
          description: "createTicket without agent permission returns HTTP 403."
          failure: {kind: AUTHORIZATION, message: Zendesk rejected the request with HTTP 403.}
    - name: updateTicket
      goName: UpdateTicket
      inputType: UpdateTicketInput
      outputType: UpdateTicketOutput
      kind: mutation
      description: Change the status, priority, assignee, group, or tags of one ticket and optionally add one public reply or internal note, applied at most once per Step.
      idempotency: required
      branches:
        - {id: updated, goName: Updated, description: "The ticket holds the requested change; a repeated attempt finds its own earlier change instead of adding a second comment."}
        - {id: notFound, goName: NotFound, description: The ticket does not exist or is not visible to the connection's agent., optional: true}
        - {id: conflict, goName: Conflict, description: "The ticket changed after expectedUpdatedAt, so nothing was written.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Zendesk conclusively rejected the change, such as updating a closed ticket or assigning an unknown agent.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Zendesk returned an invalid or oversized ticket or audit response, so the change may have been applied.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 6, totalDuration: 5m, reason: {kind: duplicateWriteRisk, explanation: "Comment reconciliation scans only the latest audit page, so a later retry could miss its own audit and post the comment again."}}
      mocks:
        - name: followedUpCustomerIssue
          branch: updated
          description: "Updating ticket 35436 adds Jane's internal follow-up and repeat-contact tag."
          default: true
          output: {ticket: {id: 35436, agentUrl: "https://acme.zendesk.com/agent/tickets/35436", subject: Double charge on order 88213, status: open, requesterId: 7701, tags: [billing-double-charge, dex-repeat-contact], createdAt: "2026-10-21T08:00:00Z", updatedAt: "2026-10-26T12:00:00Z"}, wasAlreadyApplied: false}
        - name: missingTicket
          branch: notFound
          description: "Updating nonexistent ticket 99999 returns HTTP 404."
          failure: {kind: NOT_FOUND, message: Zendesk found no such resource.}
        - name: ticketChanged
          branch: conflict
          description: "Updating ticket 35436 with an older expectedUpdatedAt finds a newer ticket revision."
          output: {ticket: {id: 35436, agentUrl: "https://acme.zendesk.com/agent/tickets/35436", subject: Double charge on order 88213, status: pending, requesterId: 7701, tags: [billing-double-charge], createdAt: "2026-10-21T08:00:00Z", updatedAt: "2026-10-22T08:00:00Z"}}
          failure: {kind: CONFLICT, message: The ticket changed after expectedUpdatedAt.}
        - name: accessDenied
          branch: providerRejected
          description: "updateTicket without agent permission returns HTTP 403."
          failure: {kind: AUTHORIZATION, message: Zendesk rejected the request with HTTP 403.}
