        - {id: providerRejected, goName: ProviderRejected, description: Keap rejected the create request., optional: true}
        - {id: uncertain, goName: Uncertain, description: The create outcome cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
