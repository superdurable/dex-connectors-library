apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: brevo
  displayName: Brevo
  description: Create, update, delete, and discover contacts, attributes, and senders.
  company: Brevo
  categories: [marketing]
  version: v0.3.0
spec:
  provider: brevo
  languages:
    python:
      version: v0.1.0
      operations: [createOrUpdateContact, getContact]
      triggers: []
    typescript:
      package: '@superdurable/connector-brevo'
      version: v0.1.1
      operations: [createOrUpdateContact, getContact]
      triggers: []
  codegen:
    go:
      package: brevo
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Brevo v3 API base URL; leave blank for the public endpoint, or enter a compatible HTTPS gateway URL for a custom deployment.
        default: https://api.brevo.com/v3
      - name: timeout
        goName: Timeout
        type: duration
        description: Positive Go duration limiting each HTTP request; leave blank for the displayed default, or override for a slower network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum response bytes as a positive integer; leave blank for the displayed safety limit, or raise it for larger contact responses.
        default: 2097152
  auth:
    type: apiKey
    connectionKind: brevo-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret Brevo API key from https://app.brevo.com/settings/keys/api after Settings > SMTP & API > API keys > Generate a new API key; copy the displayed string once. Blank prevents requests.
    guide:
      startURL: https://app.brevo.com/settings/keys/api
      steps:
        - Sign in at https://app.brevo.com and open Settings > SMTP & API > API keys at https://app.brevo.com/settings/keys/api.
        - Select Generate a new API key, give it a name, and copy the displayed secret string once.
        - Paste the key into the secret api_key field; leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults.
  operations:
    - name: listContacts
      goName: ListContacts
      inputType: ListContactsInput
      outputType: ContactsList
      kind: query
      description: List one page of contact IDs and emails.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Brevo completed the operation.}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Brevo returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample Brevo result.
          output: {contacts: [{id: 21, email: member@meridian.example}], count: 1}
    - name: updateContact
      goName: UpdateContact
      inputType: UpdateContactInput
      outputType: ContactChangeResult
      kind: mutation
      description: Set absolute attributes on a contact identified by email.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Brevo completed the operation.}
        - {id: notFound, goName: NotFound, description: Brevo did not find the contact., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo conclusively rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: Sample Brevo result.
          output: {email: member@meridian.example}
    - name: deleteContact
      goName: DeleteContact
      inputType: DeleteContactInput
      outputType: ContactChangeResult
      kind: mutation
      description: Delete a contact identified by email.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Brevo completed the operation.}
        - {id: notFound, goName: NotFound, description: Brevo did not find the contact., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo conclusively rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: Sample Brevo result.
          output: {email: member@meridian.example}
    - name: listAttributes
      goName: ListAttributes
      inputType: ListAttributesInput
      outputType: AttributesList
      kind: query
      description: List contact attribute names, categories, and types.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Brevo completed the operation.}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Brevo returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample Brevo result.
          output: {attributes: [{name: FIRSTNAME, category: normal, type: text}]}
    - name: listSenders
      goName: ListSenders
      inputType: ListSendersInput
      outputType: SendersList
      kind: query
      description: List email sender IDs, names, addresses, and active status.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Brevo completed the operation.}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Brevo returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample Brevo result.
          output: {senders: [{id: 1, name: Support, email: support@example.com, active: true}]}
    - name: createSender
      goName: CreateSender
      inputType: CreateSenderInput
      outputType: SenderChangeResult
      kind: mutation
      description: Create an email sender; Brevo sends an address verification message.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Brevo created the sender.}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo conclusively rejected the sender., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The sender may have been created after the send cap., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: Sample created sender.
          output: {id: 1}
    - name: updateSender
      goName: UpdateSender
      inputType: UpdateSenderInput
      outputType: SenderChangeResult
      kind: mutation
      description: Set an existing sender's display name.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Brevo updated the sender.}
        - {id: notFound, goName: NotFound, description: Brevo did not find the sender., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo conclusively rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: Sample updated sender.
          output: {id: 1}
    - name: deleteSender
      goName: DeleteSender
      inputType: DeleteSenderInput
      outputType: SenderChangeResult
      kind: mutation
      description: Delete an email sender by numeric ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Brevo deleted the sender.}
        - {id: notFound, goName: NotFound, description: Brevo did not find the sender., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo conclusively rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: Sample deleted sender.
          output: {id: 1}
    - name: createOrUpdateContact
      goName: CreateOrUpdateContact
      inputType: CreateOrUpdateContactInput
      outputType: ContactWriteResult
      kind: mutation
      description: Create a contact by email or set its specified attributes when it already exists.
      idempotency: required
      authorization: required
      branches:
        - {id: saved, goName: Saved, description: Brevo created or updated the contact.}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo rejected the contact or credentials., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Brevo returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async}
      mocks:
        - name: savedDefaultContact
          branch: saved
          description: Meridian contact was created.
          default: true
          output: {id: 21, email: "member@meridian.example", created: true}
    - name: getContact
      goName: GetContact
      inputType: GetContactInput
      outputType: Contact
      kind: query
      description: Get a Brevo contact by email address.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Brevo returned the contact.}
        - {id: notFound, goName: NotFound, description: No contact has that email., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Brevo rejected the request or credentials., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Brevo returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async}
      mocks:
        - name: foundDefaultContact
          branch: found
          description: Meridian contact exists.
          default: true
          output: {id: 21, email: "member@meridian.example"}
