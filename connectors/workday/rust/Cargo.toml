[package]
name = "dex-connector-workday"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Workday worker directory queries for Dex Flows"
repository = "https://github.com/superdurable/dex-connectors-library"

[dependencies]
form_urlencoded = "1"
url = "2"
dex-connectors-sdk = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
