apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: spotify
  displayName: Spotify
  description: Read playlists and bounded pages of their tracks for the authenticated Spotify user.
  company: Spotify
  categories: [data-search]
  version: v0.25.0
spec:
  provider: spotify
  languages:
    python:
      version: v0.2.0
      package: dex-connector-spotify
      operations: [listPlaylistTracks]
      triggers: []
    typescript:
      version: v0.2.0
      package: '@superdurable/connector-spotify'
      operations: [listPlaylistTracks]
      triggers: []
  codegen:
    go:
      package: spotify
  configuration:
    fields:
      - name: endpoint
        goName: Endpoint
        type: url
        description: Spotify Web API base URL; leave blank for Spotify's public v1 API and change only when Spotify publishes a compatible replacement.
        required: false
        default: https://api.spotify.com/v1
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration for one Spotify HTTP request, using a positive Go duration such as 15s or 1m; leave blank for the displayed default.
        required: false
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum bytes accepted from one Spotify response; enter a positive integer only to change the safety limit. Oversized responses select invalidResponse.
        required: false
        default: 4194304
  auth:
    refreshable: true
    type: oauth2
    connectionKind: spotify-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        description: Non-secret Client ID copied from https://developer.spotify.com/dashboard after selecting the app > Settings; blank keeps an existing access token usable but authorization and refresh cannot start.
        required: false
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        description: Optional secret revealed at https://developer.spotify.com/dashboard after selecting the app > Settings > View client secret; Dex uses Basic authentication when present and PKCE client_id refresh when blank.
        required: false
      - name: access_token
        goName: AccessToken
        type: secretString
        description: Secret one-hour Spotify OAuth access token produced automatically after authorization; Dex refreshes it before expiry and it must not be entered manually.
        required: true
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        description: Secret six-month Spotify refresh token produced automatically after authorization; Dex preserves or replaces it after refresh, while blank means reauthorization is required when the access token expires.
        required: false
    guide:
      startURL: https://developer.spotify.com/dashboard
      steps:
        - In Spotify for Developers Dashboard, choose Create app or open the app used by this Dex connection.
        - Open Settings, add the exact Redirect URI shown below, select Web API, and save the application settings.
        - Copy Client ID from Settings; reveal and copy Client Secret only for a confidential server-side connection because PKCE refresh needs only Client ID.
        - Complete consent for playlist-read-private; Spotify access tokens last one hour and refresh tokens now expire after six months, when Dex requires reauthorization.
    oauth2:
      authorizationEndpoint: https://accounts.spotify.com/authorize
      tokenEndpoint: https://accounts.spotify.com/api/token
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [playlist-read-private]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      pkce: true
      tokenEndpointAuthMethod: client_secret_basic
      refresh:
        tokenExchangeTimeout: 15s
        missingExpiry: reject
        scopeSeparators: whitespaceAndComma
        allowsPublicClient: true
        exactScopes: true
        terminalErrorCodes: [invalid_grant, invalid_client, unauthorized_client, access_denied]
  operations:
    - name: listUserPlaylists
      goName: ListUserPlaylists
      inputType: ListUserPlaylistsInput
      outputType: PlaylistSummaryPage
      kind: query
      description: List one bounded page of playlists owned or followed by the authenticated Spotify user.
      idempotency: none
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: The playlist page was loaded.}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The Spotify OAuth grant is invalid or revoked., optional: true}
        - {id: accessDenied, goName: AccessDenied, description: The user cannot read this playlist collection., optional: true}
        - {id: notFound, goName: NotFound, description: Spotify could not find this playlist collection., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Spotify conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Spotify returned invalid or oversized playlist metadata., optional: true}
        - {id: defect, goName: Defect, description: "The page settings or local connection is invalid.", optional: true}
      pagination: {inputField: offset, nextField: nextOffset}
      mocks:
        - name: sampleUserPlaylists
          branch: listed
          default: true
          description: The authenticated user has three sample playlists across three pages.
          pages:
            - {playlists: [{id: 3cEYpjA9oz9GiPac4AsH4n, name: Example One, ownerUserId: sample-user, spotifyUrl: https://open.spotify.com/playlist/3cEYpjA9oz9GiPac4AsH4n, snapshotId: sample-snapshot-1, public: true}], limit: 1, offset: 0, total: 3, nextOffset: 1}
            - {playlists: [{id: 4iV5W9uYEdYUVa79Axb7Rh, name: Example Two, ownerUserId: sample-user, spotifyUrl: https://open.spotify.com/playlist/4iV5W9uYEdYUVa79Axb7Rh, snapshotId: sample-snapshot-2, public: true}], limit: 1, offset: 1, total: 3, nextOffset: 2}
            - {playlists: [{id: 7ouMYWpwJ422jRcDASZB7P, name: Example Three, ownerUserId: sample-user, spotifyUrl: https://open.spotify.com/playlist/7ouMYWpwJ422jRcDASZB7P, snapshotId: sample-snapshot-3, public: true}], limit: 1, offset: 2, total: 3}
    - name: searchPlaylists
      goName: SearchPlaylists
      inputType: SearchPlaylistsInput
      outputType: PlaylistSummaryPage
      kind: query
      description: Search Spotify's playlist catalog by a nonempty text query and return one bounded result page.
      idempotency: none
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: The search result page was loaded.}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The Spotify OAuth grant is invalid or revoked., optional: true}
        - {id: accessDenied, goName: AccessDenied, description: Spotify denied this search., optional: true}
        - {id: notFound, goName: NotFound, description: Spotify could not resolve this search., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Spotify conclusively rejected the search., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Spotify returned invalid or oversized search results., optional: true}
        - {id: defect, goName: Defect, description: "The query, page settings, or local connection is invalid.", optional: true}
      pagination: {inputField: offset, nextField: nextOffset}
      mocks:
        - name: samplePlaylistSearch
          branch: listed
          default: true
          description: The playlist catalog has three matching sample playlists across three pages.
          pages:
            - {playlists: [{id: 3cEYpjA9oz9GiPac4AsH4n, name: Example One, ownerUserId: sample-user, spotifyUrl: https://open.spotify.com/playlist/3cEYpjA9oz9GiPac4AsH4n, snapshotId: sample-snapshot-1, public: true}], limit: 1, offset: 0, total: 3, nextOffset: 1}
            - {playlists: [{id: 4iV5W9uYEdYUVa79Axb7Rh, name: Example Two, ownerUserId: sample-user, spotifyUrl: https://open.spotify.com/playlist/4iV5W9uYEdYUVa79Axb7Rh, snapshotId: sample-snapshot-2, public: true}], limit: 1, offset: 1, total: 3, nextOffset: 2}
            - {playlists: [{id: 7ouMYWpwJ422jRcDASZB7P, name: Example Three, ownerUserId: sample-user, spotifyUrl: https://open.spotify.com/playlist/7ouMYWpwJ422jRcDASZB7P, snapshotId: sample-snapshot-3, public: true}], limit: 1, offset: 2, total: 3}
    - name: getPlaylist
      goName: GetPlaylist
      inputType: GetPlaylistInput
      outputType: PlaylistSummary
      kind: query
      description: Read a playlist's identity, owner, name, description, visibility, and snapshot.
      idempotency: none
      authorization: required
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      branches:
        - {id: found, goName: Found, description: The playlist metadata was loaded.}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The Spotify OAuth grant is invalid or revoked., optional: true}
        - {id: accessDenied, goName: AccessDenied, description: The user cannot access this playlist., optional: true}
        - {id: notFound, goName: NotFound, description: Spotify could not find this playlist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Spotify conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Spotify returned invalid or oversized playlist metadata., optional: true}
        - {id: defect, goName: Defect, description: The playlist ID or local connection is invalid., optional: true}
      mocks:
        - name: samplePlaylist
          branch: found
          default: true
          description: A public example playlist is available to the current user.
          output: {id: 3cEYpjA9oz9GiPac4AsH4n, name: Example Playlist, ownerUserId: sample-user, spotifyUrl: https://open.spotify.com/playlist/3cEYpjA9oz9GiPac4AsH4n, snapshotId: sample-snapshot, public: true}
    - name: listPlaylistTracks
      goName: ListPlaylistTracks
      inputType: ListPlaylistTracksInput
      outputType: PlaylistTrackPage
      kind: query
      description: List one bounded page of tracks from a playlist owned by or shared with the authenticated Spotify user.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: One bounded page of playlist tracks was loaded.}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The Spotify OAuth grant is invalid or revoked., optional: true}
        - {id: accessDenied, goName: AccessDenied, description: The authenticated user cannot access the playlist items., optional: true}
        - {id: notFound, goName: NotFound, description: The requested Spotify playlist was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Spotify conclusively rejected the playlist query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Spotify returned an invalid or oversized playlist response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      agent:
        exposed: true
        # Each listed branch follows a Spotify 4xx or precedes the request; invalidResponse stays unlisted.
        branches: {authorizationRevoked: rejected, accessDenied: rejected, notFound: rejected, providerRejected: rejected, defect: rejected}
        description: List one page of tracks from a Spotify playlist the user owns or can access. Supply the 22-character playlist ID; optionally a page size from 1 through 50, a two-letter market code, and the offset from the previous page's nextOffset.
      execution:
        executeMethodTimeout: 30s
        durability: async
      pagination: {inputField: offset, nextField: nextOffset}
      mocks:
        - name: oneAvailableTrack
          branch: listed
          description: "Playlist 3cEYpjA9oz9GiPac4AsH4n has five items across three offset pages; each page includes one available track and the first two skip an unavailable item."
          default: true
          pages:
            - playlistId: 3cEYpjA9oz9GiPac4AsH4n
              tracks:
                - position: 0
                  id: 4iV5W9uYEdYUVa79Axb7Rh
                  uri: spotify:track:4iV5W9uYEdYUVa79Axb7Rh
                  spotifyUrl: https://open.spotify.com/track/4iV5W9uYEdYUVa79Axb7Rh
                  name: A Song
                  artists: [{id: 0OdUWJ0sBjDrqHygGUXeCF, name: An Artist}]
                  album: {id: 1ATL5GLyefJaxhQzSPVrLX, name: An Album, artists: [{id: 0OdUWJ0sBjDrqHygGUXeCF, name: An Artist}]}
                  durationMilliseconds: 213000
                  explicit: false
                  discNumber: 1
                  trackNumber: 2
              skippedItems: 1
              limit: 2
              offset: 0
              total: 5
              nextOffset: 2
            - playlistId: 3cEYpjA9oz9GiPac4AsH4n
              tracks:
                - position: 2
                  id: 7ouMYWpwJ422jRcDASZB7P
                  uri: spotify:track:7ouMYWpwJ422jRcDASZB7P
                  spotifyUrl: https://open.spotify.com/track/7ouMYWpwJ422jRcDASZB7P
                  name: Another Song
                  artists: [{id: 0OdUWJ0sBjDrqHygGUXeCF, name: An Artist}]
                  album: {id: 1ATL5GLyefJaxhQzSPVrLX, name: An Album, artists: [{id: 0OdUWJ0sBjDrqHygGUXeCF, name: An Artist}]}
                  durationMilliseconds: 213000
                  explicit: false
                  discNumber: 1
                  trackNumber: 3
              skippedItems: 1
              limit: 2
              offset: 2
              total: 5
              nextOffset: 4
            - playlistId: 3cEYpjA9oz9GiPac4AsH4n
              tracks:
                - position: 4
                  id: 3n3Ppam7vgaVa1iaRUc9Lp
                  uri: spotify:track:3n3Ppam7vgaVa1iaRUc9Lp
                  spotifyUrl: https://open.spotify.com/track/3n3Ppam7vgaVa1iaRUc9Lp
                  name: Final Song
                  artists: [{id: 0OdUWJ0sBjDrqHygGUXeCF, name: An Artist}]
                  album: {id: 1ATL5GLyefJaxhQzSPVrLX, name: An Album, artists: [{id: 0OdUWJ0sBjDrqHygGUXeCF, name: An Artist}]}
                  durationMilliseconds: 213000
                  explicit: false
                  discNumber: 1
                  trackNumber: 4
              skippedItems: 0
              limit: 2
              offset: 4
              total: 5
        - name: revokedGrant
          branch: authorizationRevoked
          description: "A playlist read with a revoked OAuth grant receives HTTP 401."
          failure: {kind: AUTHENTICATION, message: "Spotify revoked the authorization grant."}
        - name: inaccessiblePlaylist
          branch: accessDenied
          description: "A request for a private playlist unavailable to this user receives HTTP 403."
          failure: {kind: AUTHORIZATION, message: "The user cannot access this playlist."}
        - name: missingPlaylist
          branch: notFound
          description: "A request for a deleted playlist receives HTTP 404."
          failure: {kind: NOT_FOUND, message: "Spotify could not find the playlist."}
        - name: invalidPlaylistRequest
          branch: providerRejected
          description: "A playlist query with market ZZ, valid in local two-letter syntax but rejected by Spotify with HTTP 400, selects providerRejected."
          failure: {kind: PROVIDER_REJECTION, message: "Spotify rejected the playlist query."}
