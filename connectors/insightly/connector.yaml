apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: insightly
  displayName: Insightly CRM
  description: Read and manage Insightly contacts, leads, organisations, opportunities, projects, and tasks.
  company: Insightly
  categories: [crm-sales]
  version: v0.3.0
spec:
  languages:
    python:
      version: v0.2.0
      operations: [listContacts, getContact]
      triggers: []
    typescript:
      version: v0.2.0
      operations: [listContacts, getContact]
      triggers: []
  provider: insightly
  codegen:
    go:
      package: insightly
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: HTTPS Insightly CRM API v3.1 root. In Insightly CRM at https://login.insightly.com/, open the top-right user icon > User Settings > User Settings > API and copy your API URL including its pod; blank uses the displayed na1 default only for na1 accounts.
        default: https://api.na1.insightly.com/v3.1
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; increase for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum complete API response in bytes. Blank uses the displayed default; increase for large contact pages. Oversized responses select invalidResponse.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: insightly-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret Insightly CRM API key. At https://login.insightly.com/, open the top-right user icon > User Settings > User Settings > API and copy the full key; blank makes calls select defect. Generate New API Key there to revoke the previous key.
    guide:
      startURL: https://login.insightly.com/
      steps:
        - Sign in to Insightly CRM at https://login.insightly.com/ and open the top-right user icon > User Settings > User Settings > API. Copy the full personal API key into the Dex secret api_key field.
        - On the same API section, copy your pod-specific API URL into baseUrl when it differs from the displayed na1 default. Use the v3.1 URL; other configuration fields may stay blank for displayed defaults.
        - The key is the HTTP Basic username with a blank password. An Insightly administrator can disable API access; Generate New API Key revokes the previous key.
  operations:
    - name: listContacts
      goName: ListContacts
      inputType: ListContactsInput
      outputType: ContactsPage
      kind: query
      description: List contact IDs, names, and email addresses with a bounded page size and offset.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Insightly returned the requested contact page.}
        - {id: providerRejected, goName: ProviderRejected, description: Insightly conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Insightly returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Invalid page input or connection credentials., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample contact is listed.
          output: {contacts: [{id: 45678, firstName: Ada, lastName: Lovelace, emailAddress: 'ada@example.com'}]}
    - name: getContact
      goName: GetContact
      inputType: GetContactInput
      outputType: ContactMetadata
      kind: query
      description: Read a contact's ID, names, and email address by ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Insightly returned the selected contact.}
        - {id: notFound, goName: NotFound, description: No contact matches this ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Insightly conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Insightly returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Invalid contact ID or unavailable credentials., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample contact is returned.
          output: {id: 45678, firstName: Ada, lastName: Lovelace, emailAddress: 'ada@example.com'}
    - name: listRecords
      goName: ListRecords
      inputType: ListRecordsInput
      outputType: RecordsPage
      kind: query
      description: List one bounded page of contacts, leads, organisations, opportunities, projects, or tasks.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Insightly returned the record page.}
        - {id: providerRejected, goName: ProviderRejected, description: Insightly rejected the list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Insightly returned invalid record JSON., optional: true}
        - {id: defect, goName: Defect, description: The resource or page input is invalid., optional: true}
      mocks:
        - name: listedLeads
          branch: listed
          default: true
          description: One sample lead is listed.
          output: {records: [{recordType: leads, id: 1201, fields: {LEAD_ID: 1201, FIRST_NAME: Ada, LAST_NAME: Lovelace}}]}
    - name: getRecord
      goName: GetRecord
      inputType: GetRecordInput
      outputType: Record
      kind: query
      description: Read one primary CRM record by its numeric ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Insightly returned the record.}
        - {id: notFound, goName: NotFound, description: Insightly found no record with the ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Insightly rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Insightly returned invalid record JSON., optional: true}
        - {id: defect, goName: Defect, description: The resource or ID is invalid., optional: true}
      mocks:
        - name: foundLead
          branch: found
          default: true
          description: One sample lead was found.
          output: {recordType: leads, id: 1201, fields: {LEAD_ID: 1201, FIRST_NAME: Ada, LAST_NAME: Lovelace}}
    - name: searchRecords
      goName: SearchRecords
      inputType: SearchRecordsInput
      outputType: RecordsPage
      kind: query
      description: Search one primary CRM resource by a provider field and value.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: searched, goName: Searched, description: Insightly returned the matching record page.}
        - {id: providerRejected, goName: ProviderRejected, description: Insightly rejected the search., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Insightly returned invalid search JSON., optional: true}
        - {id: defect, goName: Defect, description: "The resource, search field, or page input is invalid.", optional: true}
      mocks:
        - name: matchingLead
          branch: searched
          default: true
          description: One lead matches the exact email address.
          output: {records: [{recordType: leads, id: 1201, fields: {LEAD_ID: 1201, EMAIL: 'ada@example.com'}}]}
    - name: createRecord
      goName: CreateRecord
      inputType: CreateRecordInput
      outputType: Record
      kind: mutation
      description: Create one primary CRM record using provider JSON fields.
      idempotency: required
      authorization: required
      execution: {repeatOnUnknown: limited, maxSends: 3, executeMethodTimeout: 30s, durability: sync, dispatchFence: true}
      branches:
        - {id: created, goName: Created, description: Insightly created the record.}
        - {id: providerRejected, goName: ProviderRejected, description: Insightly rejected the create., optional: true}
        - {id: defect, goName: Defect, description: "The resource, fields, or credentials are invalid.", optional: true}
        - {id: uncertain, goName: Uncertain, description: A bounded create could not be confirmed after its send cap., optional: true}
      mocks:
        - name: createdLead
          branch: created
          default: true
          description: Insightly created a lead.
          output: {recordType: leads, id: 1201, fields: {LEAD_ID: 1201, FIRST_NAME: Ada, LAST_NAME: Lovelace}}
    - name: updateRecord
      goName: UpdateRecord
      inputType: UpdateRecordInput
      outputType: Record
      kind: mutation
      description: Partially update one primary CRM record by its numeric ID.
      idempotency: required
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: updated, goName: Updated, description: Insightly updated the record.}
        - {id: notFound, goName: NotFound, description: Insightly found no record with the ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Insightly rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Insightly returned invalid updated JSON., optional: true}
        - {id: defect, goName: Defect, description: "The resource, ID, fields, or credentials are invalid.", optional: true}
      mocks:
        - name: updatedLead
          branch: updated
          default: true
          description: Insightly updated the lead surname.
          output: {recordType: leads, id: 1201, fields: {LEAD_ID: 1201, FIRST_NAME: Ada, LAST_NAME: Byron}}
    - name: deleteRecord
      goName: DeleteRecord
      inputType: DeleteRecordInput
      outputType: DeletedRecord
      kind: mutation
      description: Delete one primary CRM record by its numeric ID.
      idempotency: required
      authorization: required
      execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: deleted, goName: Deleted, description: The record was deleted or was already absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Insightly rejected the delete., optional: true}
        - {id: defect, goName: Defect, description: "The resource, ID, or credentials are invalid.", optional: true}
      mocks:
        - name: deletedLead
          branch: deleted
          default: true
          description: Insightly deleted the lead.
          output: {recordType: leads, id: 1201}
