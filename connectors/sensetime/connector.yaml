apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: sensetime
  displayName: SenseTime SenseNova
  description: List model IDs available through the SenseNova API.
  company: sensetime
  categories: [ai, developer-tools]
  version: v0.1.0
spec:
  provider: sensetime
  codegen:
    go:
      package: sensetime
  configuration:
    fields:
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API model-list HTTP request as a positive Go duration such as 5s or 1m. Blank uses the displayed default; increase only for a slow approved network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum model-list response size in bytes as a positive integer. Blank uses the displayed default; increase only if the provider adds more model metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: sensetime-api-key
    fields:
      - name: apiKey
        goName: APIKey
        type: secretString
        required: true
        description: Secret SenseNova API Key from https://console.sensecore.cn > ModelStudio Management Center > API Key Management. Create and copy a Key; blank prevents requests.
    guide:
      startURL: https://console.sensecore.cn/micro/help/docs/model-as-a-service/nova/overview/Authorization/
      steps:
        - Sign in at https://console.sensecore.cn, open ModelStudio Management Center > API Key Management, create an API Key and copy the secret into Dex Connections. Blank prevents requests. Activate the SenseNova service in the console first.
        - Start ListModels with {}. The connector calls the fixed SenseNova HTTPS API and returns at most the first 50 model IDs. It does not call inference or expose model metadata. Leave timeout and maxResponseBytes blank for displayed defaults.
        - The SenseNova API also supports a generated AK/SK JWT, but this connector uses the directly supported API Key. Manage or revoke it from ModelStudio Management Center > API Key Management.
  operations:
    - name: listModels
      goName: ListModels
      inputType: ListModelsInput
      outputType: ListModelsOutput
      kind: query
      description: List up to 50 model IDs enabled for the API Key.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: SenseTime returned the available model list.}
        - {id: providerRejected, goName: ProviderRejected, description: SenseTime rejected the Key or request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: SenseTime returned malformed or oversized model data., optional: true}
        - {id: defect, goName: Defect, description: The local API Key is invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: oneModel
          branch: found
          description: One available API model ID.
          default: true
          output: {total: 1, modelIDs: [SenseNova-V6-Pro]}
        - name: noModels
          branch: found
          description: No models are enabled for the Key.
          output: {total: 0, modelIDs: []}
