apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: zentao
  displayName: ZenTao
  description: List ZenTao product metadata without reading owners or user data.
  company: ZenTao
  categories: [productivity]
  version: v0.1.0
spec:
  provider: zentao
  codegen:
    go:
      package: zentao
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        required: true
        description: HTTPS root of your ZenTao installation, including an installation subpath such as /zentao if used, found from your browser's ZenTao login URL. Do not include /api.php, a query, or a fragment. Blank prevents requests because each installation has its own host.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one product-list request as a positive Go duration such as 30s or 1m. Leave blank for the displayed default; raise only for a slow approved network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum product-list response size in bytes as a positive integer. Leave blank for the displayed default; raise only for unusually large product catalogs.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: zentao-v1-token
    fields:
      - name: token
        goName: Token
        type: secretString
        description: Secret REST v1 token, following https://www.zentao.net/book/api/1397.html, from your HTTPS ZenTao installation's /api.php/v1/tokens endpoint; obtain it by POSTing JSON account and password in your own trusted client, then copy only the returned token. Enter no Token prefix. Blank prevents requests; refresh after expiry.
        required: true
    guide:
      startURL: https://www.zentao.net/book/api/1397.html
      steps:
        - In ZenTao 16.5 or later, find your HTTPS installation root from the browser login URL, including any /zentao subpath, and enter it as baseUrl. Ask an administrator for product-list view permission if needed.
        - Following https://www.zentao.net/book/api/1397.html, use a trusted client to POST JSON account and password to your own installation's /api.php/v1/tokens; copy the returned token into the secret token field without the Token prefix. Do not put account or password in Dex.
        - Leave timeout and maxResponseBytes blank for their displayed defaults. Replace the token after it expires; a blank token cannot authorize requests.
  operations:
    - name: listProducts
      goName: ListProducts
      inputType: ListProductsInput
      outputType: ProductList
      kind: query
      description: List product IDs, names, codes, types, and access-control flags from REST v1, omitting user records.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "ZenTao returned a product list, possibly empty."}
        - {id: providerRejected, goName: ProviderRejected, description: "ZenTao rejected the token or permissions.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "ZenTao returned malformed or oversized data.", optional: true}
        - {id: defect, goName: Defect, description: "Local connection configuration or credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: listedProduct
          branch: listed
          description: Synthetic product list for local Dex Flow verification.
          default: true
          output: {total: 1, products: [{id: 6, name: Example Product, code: example, type: normal, accessControl: private}]}
