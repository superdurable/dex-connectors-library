apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: adobe-marketo
  displayName: Adobe Marketo Engage
  description: Read activity metadata and create, read, update, and delete selected lead, company, and opportunity fields in a Marketo Engage subscription.
  company: Adobe
  categories: [marketing]
  version: v0.2.0
spec:
  provider: adobe
  languages:
    python:
      version: v0.1.0
      package: dex-connector-adobe-marketo
      operations: [getLead]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-adobe-marketo'
      operations: [getLead]
      triggers: []
  codegen:
    go:
      package: marketo
  configuration:
    fields:
      - name: restEndpoint
        goName: RESTEndpoint
        type: url
        required: true
        description: Non-secret subscription REST endpoint from https://app.marketo.com/ > Admin > Integration > Web Services > REST API > Endpoint. Copy the complete HTTPS URL ending in /rest, such as https://123-ABC-456.mktorest.com/rest; blank prevents requests.
      - name: tokenEndpoint
        goName: TokenEndpoint
        type: url
        required: true
        description: Non-secret Identity URL from https://app.marketo.com/ > Admin > Integration > Web Services > REST API > Identity, followed by /oauth/token. Enter a complete HTTPS URL ending in /identity/oauth/token on the same subscription host as restEndpoint; blank prevents token minting.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one Marketo API request as a positive Go duration. Leave blank for the displayed default; increase only for slow provider responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum bytes in one complete Marketo response as a positive integer. Leave blank for the displayed default; increase only for unusually large responses.
        default: 1048576
  auth:
    refreshable: true
    type: apiKey
    connectionKind: adobe-marketo-client-credentials
    fields:
      - name: client_id
        goName: ClientID
        type: string
        required: true
        description: Non-secret Client ID from https://app.marketo.com/ > Admin > Integration > LaunchPoint > your Custom service > View Details. Copy the complete value; blank prevents token minting.
      - name: client_secret
        goName: ClientSecret
        type: secretString
        required: true
        description: Secret Client Secret from https://app.marketo.com/ > Admin > Integration > LaunchPoint > your Custom service > View Details. Store only in Dex Web; blank prevents token minting.
      - name: access_token
        goName: AccessToken
        type: secretString
        description: Secret short-lived token derived from the custom service's Client ID and Client Secret. Leave blank for automatic minting; never paste a token.
    guide:
      startURL: https://app.marketo.com/
      steps:
        - Sign in to Marketo, open Admin > Users & Roles > Roles, and create an API role with Access API > Read-Only Lead. Grant Read-Write Lead for lead writes, Read-Only Activity for activity queries, Read-Only Company and Read-Write Company for company operations, and Read-Only Opportunity and Read-Write Opportunity for opportunity operations. Add an API-Only user assigned this role in Admin > Users & Roles > Users. No browser redirect URI or consent screen is needed for this client credentials grant.
        - Open Admin > Integration > LaunchPoint > New Service, choose Custom, select the API-Only user, and create the service. Open View Details to copy its Client ID and Client Secret; keep the secret in Dex Web only.
        - Open Admin > Integration > Web Services. Copy REST API > Endpoint into restEndpoint. Copy REST API > Identity and append /oauth/token into tokenEndpoint. Both HTTPS URLs must use the same subscription host ending in .mktorest.com.
        - Save the connection; Dex mints and refreshes the access token. Leave access_token, timeout, and maxResponseBytes blank. Revoke the Custom service in LaunchPoint to stop this connection.
    clientCredentials:
      tokenEndpoint: {fromSetting: tokenEndpoint}
      tokenEndpointAuthMethod: client_secret_post
      tokenExchangeTimeout: 8s
      missingExpiry: reject
      storedMissingExpiry: refresh
      clientIDCredential: client_id
      clientSecretCredential: client_secret
      credentialMappings:
        - {credential: access_token, source: access_token}
      terminalErrorCodes: [invalid_client, unauthorized_client, invalid_scope]
  operations:
    - name: getOpportunityByExternalID
      goName: GetOpportunityByExternalID
      inputType: GetOpportunityByExternalIDInput
      outputType: OpportunityProfile
      kind: query
      idempotency: none
      authorization: required
      description: Read one opportunity GUID and name by its external ID.
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Marketo returned the opportunity.}
        - {id: notFound, goName: NotFound, description: Marketo found no matching opportunity., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo rejected the opportunity lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed opportunity JSON., optional: true}
        - {id: defect, goName: Defect, description: The external opportunity ID is invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: A sample opportunity is returned., output: {marketoGUID: 'dff23271-f996-47d7-984f-f2676861b5fa', name: Sample Opportunity}}
    - name: createOpportunity
      goName: CreateOpportunity
      inputType: CreateOpportunityInput
      outputType: OpportunityWriteResult
      kind: mutation
      idempotency: required
      authorization: required
      description: Create one opportunity by external ID with bounded sends and read-back.
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Marketo created the opportunity.}
        - {id: alreadyExists, goName: AlreadyExists, description: An opportunity already uses the external ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo conclusively rejected the create., optional: true}
        - {id: uncertain, goName: Uncertain, description: A prior create may have succeeded but cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: The external opportunity ID or name is invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: A sample opportunity was created., output: {marketoGUID: 'dff23271-f996-47d7-984f-f2676861b5fa', status: created}}
    - name: upsertOpportunity
      goName: UpsertOpportunity
      inputType: UpsertOpportunityInput
      outputType: OpportunityWriteResult
      kind: mutation
      idempotency: required
      authorization: required
      description: Create or replace an opportunity name using its external ID.
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: synced, goName: Synced, description: Marketo created or updated the opportunity.}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo rejected the upsert., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed opportunity JSON., optional: true}
        - {id: defect, goName: Defect, description: The external opportunity ID or name is invalid., optional: true}
      mocks:
        - {name: syncedDefault, branch: synced, default: true, description: A sample opportunity was updated., output: {marketoGUID: 'dff23271-f996-47d7-984f-f2676861b5fa', status: updated}}
    - name: deleteOpportunity
      goName: DeleteOpportunity
      inputType: DeleteOpportunityInput
      outputType: DeletedOpportunity
      kind: mutation
      idempotency: required
      authorization: required
      description: Delete an opportunity by external ID; an already-absent opportunity converges to deleted.
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: The opportunity is absent after the call.}
        - {id: providerRejected, goName: ProviderRejected, description: "Marketo rejected deletion, including existing opportunity roles.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed deletion JSON., optional: true}
        - {id: defect, goName: Defect, description: The external opportunity ID is invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: A sample opportunity was deleted., output: {deleted: true}}
    - name: getCompanyByExternalID
      goName: GetCompanyByExternalID
      inputType: GetCompanyByExternalIDInput
      outputType: CompanyProfile
      kind: query
      idempotency: none
      authorization: required
      description: Read one company ID and name by its external company ID.
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Marketo returned the company.}
        - {id: notFound, goName: NotFound, description: Marketo found no matching company., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo rejected the company lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed company JSON., optional: true}
        - {id: defect, goName: Defect, description: The external company ID is invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: A sample company is returned., output: {id: 3433, company: Sample Company}}
    - name: createCompany
      goName: CreateCompany
      inputType: CreateCompanyInput
      outputType: CompanyWriteResult
      kind: mutation
      idempotency: required
      authorization: required
      description: Create one company by external ID with bounded sends and read-back.
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Marketo created the company.}
        - {id: alreadyExists, goName: AlreadyExists, description: A company already uses the external ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo conclusively rejected the create., optional: true}
        - {id: uncertain, goName: Uncertain, description: A prior create may have succeeded but cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: The external company ID or name is invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: A sample company was created., output: {id: 3433, status: created}}
    - name: upsertCompany
      goName: UpsertCompany
      inputType: UpsertCompanyInput
      outputType: CompanyWriteResult
      kind: mutation
      idempotency: required
      authorization: required
      description: Create or replace a company's name using its external ID.
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: synced, goName: Synced, description: Marketo created or updated the company.}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo rejected the upsert., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed company JSON., optional: true}
        - {id: defect, goName: Defect, description: The external company ID or name is invalid., optional: true}
      mocks:
        - {name: syncedDefault, branch: synced, default: true, description: A sample company was updated., output: {id: 3433, status: updated}}
    - name: deleteCompany
      goName: DeleteCompany
      inputType: DeleteCompanyInput
      outputType: DeletedCompany
      kind: mutation
      idempotency: required
      authorization: required
      description: Delete a company by external ID; an already-absent company converges to deleted.
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: The company is absent after the call.}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed deletion JSON., optional: true}
        - {id: defect, goName: Defect, description: The external company ID is invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: A sample company was deleted., output: {deleted: true}}
    - name: getActivityPagingToken
      goName: GetActivityPagingToken
      inputType: GetActivityPagingTokenInput
      outputType: ActivityPagingToken
      kind: query
      idempotency: none
      description: Get an activity cursor for an ISO 8601 date and time.
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Marketo returned an activity cursor.}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo rejected the date or activity permission., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed activity cursor JSON., optional: true}
        - {id: defect, goName: Defect, description: The date and time is invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: A sample activity cursor is returned., output: {nextPageToken: SAMPLE_ACTIVITY_CURSOR}}
    - name: listActivityTypes
      goName: ListActivityTypes
      inputType: ListActivityTypesInput
      outputType: ActivityTypes
      kind: query
      idempotency: none
      description: List activity type IDs and names without provider attributes.
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Marketo returned activity types.}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo rejected the activity type request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed activity type JSON., optional: true}
        - {id: defect, goName: Defect, description: The connection configuration is invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: One sample activity type is returned., output: {types: [{id: 2, name: Fill Out Form}]}}
    - name: listActivities
      goName: ListActivities
      inputType: ListActivitiesInput
      outputType: ActivityPage
      kind: query
      idempotency: none
      description: Read one page of activity IDs, lead IDs, types, and dates without activity attributes.
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Marketo returned an activity page.}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo rejected the cursor or activity type IDs., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed activity JSON., optional: true}
        - {id: defect, goName: Defect, description: The cursor or activity type IDs are invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: One sample activity is returned., output: {activities: [{marketoGUID: '102988', leadId: 318581, activityTypeId: 2, activityDate: '2026-01-01T00:00:00Z'}], nextPageToken: SAMPLE_NEXT_CURSOR, moreResult: false}}
    - name: createLead
      goName: CreateLead
      inputType: CreateLeadInput
      outputType: CreatedLead
      kind: mutation
      description: Create one lead by email with createOnly, refusing an existing lead and reading back after an unknown send.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Marketo created the lead.}
        - {id: alreadyExists, goName: AlreadyExists, description: Marketo found an existing lead for this email., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo conclusively rejected the create request., optional: true}
        - {id: uncertain, goName: Uncertain, description: A previous create may have succeeded but read-back cannot confirm it., optional: true}
        - {id: defect, goName: Defect, description: Local email or name fields are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: Marketo created a sample lead.
          output: {id: 318582, status: created}
    - name: upsertLeadByEmail
      goName: UpsertLeadByEmail
      inputType: UpsertLeadByEmailInput
      outputType: SyncedLead
      kind: mutation
      description: Create or replace selected names on the lead matching one email.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: synced, goName: Synced, description: Marketo created or updated the lead.}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo conclusively rejected the upsert or found multiple matches., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local email or name fields are invalid., optional: true}
      mocks:
        - name: syncedDefault
          branch: synced
          default: true
          description: Marketo updated a sample lead.
          output: {id: 318581, status: updated}
    - name: getLead
      goName: GetLead
      inputType: GetLeadInput
      outputType: LeadProfile
      kind: query
      description: Read one lead's ID and names by Marketo lead ID without returning email or other profile fields.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Marketo returned the selected lead.}
        - {id: notFound, goName: NotFound, description: Marketo returned no lead for the ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection configuration is invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample Marketo lead is returned.
          output: {id: 318581, firstName: Sample, lastName: Lead}
    - name: findLeadsByEmail
      goName: FindLeadsByEmail
      inputType: FindLeadsByEmailInput
      outputType: LeadProfilesPage
      kind: query
      description: Find a cursor page of leads by email, returning only IDs and names.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Marketo returned the matching lead page.}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo conclusively rejected the filter., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local email or connection configuration is invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample matching lead is returned.
          output: {leads: [{id: 318581, firstName: Sample, lastName: Lead}], nextPageToken: ''}
    - name: updateLead
      goName: UpdateLead
      inputType: UpdateLeadInput
      outputType: UpdatedLead
      kind: mutation
      description: Set one lead's selected names by ID using Marketo updateOnly.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Marketo updated the selected lead.}
        - {id: notFound, goName: NotFound, description: Marketo found no lead for the ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Marketo conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Marketo returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: "Local ID, name fields, or connection configuration is invalid.", optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One sample lead was updated.
          output: {id: 318581, status: updated}
