apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: qihoo360
  displayName: 360 智脑
  description: Generate bounded text with a Qihoo360 360GPT chat model.
  company: Qihoo360
  categories: [ai]
  version: v0.1.0
spec:
  provider: qihoo360
  codegen:
    go:
      package: qihoo360
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "360GPT model ID sent to POST /v1/chat/completions, from the model square at https://ai.360.com/open/zh/models. Blank uses the displayed default; override only if your API Key can access another listed model. This is not secret."
        default: 360zhinao/360zhinao-pro
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum time for one generation call as a positive Go duration such as 2m or 5m. Blank uses the displayed default; raise only for longer model responses.
        default: 120s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum nonstreaming response size in bytes as a positive integer. Blank uses the displayed default; raise only for a longer bounded model output.
        default: 2097152
  auth:
    type: apiKey
    connectionKind: qihoo360-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: "Secret API key from https://ai.360.com/open/zh/platform/account/keys (Console > API Key management); create or select a key for the project that owns billing, then copy its opaque value. Dex stores it as a credential and sends it only as a Bearer header to api.360.cn. Blank prevents requests."
        required: true
    guide:
      startURL: https://ai.360.com/open/zh/platform/account/keys
      steps:
        - Sign in to the 360 智脑 platform and open Console > API Key management at https://ai.360.com/open/zh/platform/account/keys.
        - Select the account and organization that should own usage, create an API key, and copy its opaque secret value into api_key. You can revoke or rotate it from the same page.
        - Leave model blank for the displayed model default or enter an ID from https://ai.360.com/open/zh/models that your organization can access. Leave timeout and maxResponseBytes blank for their displayed defaults.
  operations:
    - name: generateText
      goName: GenerateText
      inputType: GenerateTextInput
      outputType: GenerateTextOutput
      kind: query
      description: Generate one nonstreaming, text-only response from a 360 智脑 model.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: The model returned a complete text response.}
        - {id: truncated, goName: Truncated, description: The model stopped at the token limit and returned partial text., optional: true}
        - {id: blocked, goName: Blocked, description: The model refused or content filtering prevented a text answer., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Qihoo360 rejected the key, quota, model, or request.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Qihoo360 returned malformed, oversized, or unsupported content.", optional: true}
        - {id: defect, goName: Defect, description: Local request or connection settings are invalid., optional: true}
      execution:
        executeMethodTimeout: 180s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 3, totalDuration: 1h, reason: {kind: billedOperation, explanation: "A generation may be billed before its result reaches Dex, and a repeat can incur another charge without provider deduplication."}}
      mocks:
        - name: shortAnswer
          branch: generated
          description: "Sample data: a model answers a short prompt and reports token usage."
          default: true
          output: {text: The connector shipped on time., model: 360zhinao/360zhinao-pro, responseId: chatcmpl-mock-1, finishReason: stop, usage: {promptTokens: 12, completionTokens: 7, totalTokens: 19}}
