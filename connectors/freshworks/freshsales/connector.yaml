        - {id: providerRejected, goName: ProviderRejected, description: Freshsales rejected the note deletion., optional: true}
        - {id: defect, goName: Defect, description: The note input or connection is invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: Example deleted note., output: {id: 501, deleted: true}}
