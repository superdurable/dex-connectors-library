      outputType: CRMRecordsPage
      kind: query
      description: List one page of deals from a view.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Freshsales confirmed the listDeals outcome.}
        - {id: notFound, goName: NotFound, description: Freshsales could not complete the requested operation., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Freshsales could not complete the requested operation., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Freshsales could not complete the requested operation., optional: true}
        - {id: defect, goName: Defect, description: Freshsales could not complete the requested operation., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: Example listDeals result., output: {records: [{id: 401, name: Expansion Deal}], page: 1, total: 1}}
    - name: createDeal
      goName: CreateDeal
      inputType: CreateDealInput
      outputType: CRMRecordMetadata
      kind: mutation
      description: Create a deal with amount and sales account, with bounded duplicate sends.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Freshsales confirmed the createDeal outcome.}
        - {id: providerRejected, goName: ProviderRejected, description: Freshsales could not complete the requested operation., optional: true}
        - {id: uncertain, goName: Uncertain, description: The create may have succeeded without a confirmed ID., optional: true}
        - {id: defect, goName: Defect, description: Freshsales could not complete the requested operation., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: Example createDeal result., output: {id: 401, name: Expansion Deal}}
    - name: updateDeal
