      inputType: CreateNoteInput
      outputType: NoteMetadata
      kind: mutation
      description: Create a note on a contact, sales account, or deal with bounded duplicate sends.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Freshsales confirmed the createNote outcome.}
        - {id: providerRejected, goName: ProviderRejected, description: Freshsales rejected the note., optional: true}
        - {id: uncertain, goName: Uncertain, description: The note may exist without a confirmed ID., optional: true}
        - {id: defect, goName: Defect, description: The note input or connection is invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: Example created note., output: {id: 501, description: Example note}}
    - name: updateNote
      goName: UpdateNote
      inputType: UpdateNoteInput
      outputType: NoteMetadata
      kind: mutation
      description: Replace the text of an existing note.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
