apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: freshsales
  displayName: Freshsales
  description: Discover contact views and list, read, create, update, and delete Freshsales contacts.
  company: Freshworks
  categories: [crm-sales]
  version: v0.2.0
spec:
  languages:
    python:
      version: v0.1.0
      operations: [listContactViews, getContact]
      triggers: []
    typescript:
      version: v0.1.0
      operations: [listContactViews, getContact]
      triggers: []
  provider: freshsales
  codegen:
    go:
      package: freshsales
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        required: true
        description: Non-secret Freshsales API root copied from https://app.freshworks.com/ > your CRM account > profile picture > Profile Settings > API Settings > Bundle alias. Enter the full HTTPS alias ending in /crm/sales/api, such as https://example.myfreshworks.com/crm/sales/api; blank prevents connection creation.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; increase for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum complete API response in bytes. Blank uses the displayed default; increase for many contact views. Oversized responses select invalidResponse.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: freshsales-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret user API key from https://app.freshworks.com/ > CRM account > profile picture > Profile Settings > API Settings > Your API key. Copy the full key into this secret field; blank selects defect. Dex sends it only in the Authorization Token header. Reset Key on that page revokes it for every integration using it.
    guide:
      startURL: https://app.freshworks.com/
      steps:
        - Sign in to your Freshsales CRM account from https://app.freshworks.com/, click your profile picture, then Profile Settings > API Settings.
        - Copy Bundle alias, including your account domain and /crm/sales path, into non-secret baseUrl with /api appended. Copy Your API key into Dex secret api_key; API requests use the API user's permissions.
        - Reset Key on the same page revokes the previous key for all integrations using it. Leave timeout and maxResponseBytes blank for their displayed defaults.
  operations:
    - name: listContactViews
      goName: ListContactViews
      inputType: ListContactViewsInput
      outputType: ContactViews
      kind: query
      description: List available contact views and their stable IDs.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Freshsales returned the available contact views.}
        - {id: providerRejected, goName: ProviderRejected, description: Freshsales conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Freshsales returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Unavailable or invalid connection credentials., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample contact view is listed.
          output: {views: [{id: 1, name: All Contacts}]}
    - name: getContact
      goName: GetContact
      inputType: GetContactInput
      outputType: ContactMetadata
      kind: query
      description: Read one contact's ID, name, and email address by numeric ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Freshsales returned the selected contact.}
        - {id: notFound, goName: NotFound, description: No contact matches this ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Freshsales conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Freshsales returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Invalid contact ID or unavailable credentials., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample contact identity is returned.
          output: {id: 144, firstName: Ada, lastName: Lovelace, emailAddress: 'ada@example.com'}
    - name: listContacts
      goName: ListContacts
      inputType: ListContactsInput
      outputType: ContactsPage
      kind: query
      description: List one page of contacts from an accessible view.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Freshsales returned the contact page.}
        - {id: notFound, goName: NotFound, description: The contact view is unavailable., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Freshsales conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Freshsales returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: Example contact page., output: {contacts: [{id: 144, firstName: Ada, lastName: Lovelace, emailAddress: 'ada@example.com'}], page: 1, total: 1}}
    - name: createContact
      goName: CreateContact
      inputType: CreateContactInput
      outputType: ContactMetadata
      kind: mutation
      description: Create a contact with bounded duplicate sends.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Freshsales confirmed the new contact.}
        - {id: providerRejected, goName: ProviderRejected, description: Freshsales conclusively rejected the creation., optional: true}
        - {id: uncertain, goName: Uncertain, description: A prior create may have succeeded without a confirmed contact ID., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: Example created contact., output: {id: 144, firstName: Ada, lastName: Lovelace, emailAddress: 'ada@example.com'}}
    - name: updateContact
      goName: UpdateContact
      inputType: UpdateContactInput
      outputType: ContactMetadata
      kind: mutation
      description: Replace one contact's first and last names.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Freshsales confirmed the requested names.}
        - {id: notFound, goName: NotFound, description: The contact is unavailable., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Freshsales conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Freshsales returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: Example renamed contact., output: {id: 144, firstName: Ada, lastName: Byron, emailAddress: 'ada@example.com'}}
    - name: deleteContact
      goName: DeleteContact
      inputType: DeleteContactInput
      outputType: DeletedContact
      kind: mutation
      description: Delete a contact by ID; a missing contact is already deleted.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: The contact is absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Freshsales conclusively rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: Example deleted contact., output: {contactId: '144', deleted: true}}
