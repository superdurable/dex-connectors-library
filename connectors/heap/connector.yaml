apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: heap
  displayName: Heap
  description: Track events and set user or account properties through Heap's server-side API.
  company: Heap
  categories: [analytics]
  version: v0.2.0
spec:
  provider: heap
  languages:
    python:
      version: v0.1.0
      package: dex-connector-heap
      operations: [setUserProperties]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-heap'
      operations: [setUserProperties]
      triggers: []
  codegen:
    go:
      package: heap
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Heap server-side API HTTPS root. Blank uses the displayed US endpoint; for an EU project use https://c.eu.heap-api.com. Do not append an /api path.
        default: https://heapanalytics.com
      - name: appId
        goName: AppID
        type: string
        required: true
        description: Non-secret numeric environment ID from https://heapanalytics.com > Account > Manage > Projects > the chosen environment; copy its app ID as decimal digits. Blank prevents requests.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one request as a positive Go duration. Blank uses the displayed default; increase only for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete provider response in bytes as a positive integer. Blank uses the displayed default; increase only if Heap returns a larger response.
        default: 1048576
  auth:
    type: none
    connectionKind: none
    fields: []
  operations:
    - name: trackEvent
      goName: TrackEvent
      inputType: TrackEventInput
      outputType: EventTracked
      kind: mutation
      description: Track a server-side event with Heap's provider idempotency key.
      idempotency: required
      authorization: none
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: tracked, goName: Tracked, description: Heap accepted the event.}
        - {id: providerRejected, goName: ProviderRejected, description: Heap conclusively rejected the event., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Heap returned an oversized or unreadable confirmation., optional: true}
        - {id: defect, goName: Defect, description: Local event input or app ID is invalid., optional: true}
      mocks:
        - name: trackedDefault
          branch: tracked
          default: true
          description: One sample event was tracked.
          output: {accepted: true}
    - name: setAccountProperties
      goName: SetAccountProperties
      inputType: SetAccountPropertiesInput
      outputType: AccountPropertiesResult
      kind: mutation
      description: Overwrite selected properties for a Heap account.
      idempotency: required
      authorization: none
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: accepted, goName: Accepted, description: Heap accepted the account properties.}
        - {id: providerRejected, goName: ProviderRejected, description: Heap conclusively rejected the account update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Heap returned an oversized or unreadable confirmation., optional: true}
        - {id: defect, goName: Defect, description: Local account input or app ID is invalid., optional: true}
      mocks:
        - name: acceptedDefault
          branch: accepted
          default: true
          description: One sample account's plan was set.
          output: {accepted: true}
    - name: setUserProperties
      goName: SetUserProperties
      inputType: SetUserPropertiesInput
      outputType: UserPropertiesResult
      kind: mutation
      description: Overwrite selected string properties for one stable Heap identity; repeated identical requests are safe.
      idempotency: required
      authorization: none
      branches:
        - {id: accepted, goName: Accepted, description: Heap accepted the property updates.}
        - {id: providerRejected, goName: ProviderRejected, description: Heap conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Heap returned an oversized or unreadable confirmation., optional: true}
        - {id: defect, goName: Defect, description: "Local identity, property input, or app ID is invalid.", optional: true}
      execution: {executeMethodTimeout: 30s, durability: async}
      mocks:
        - name: acceptedDefault
          branch: accepted
          default: true
          description: One sample user's plan was set.
          output: {accepted: true}
