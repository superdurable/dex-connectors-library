apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: ashby
  displayName: Ashby
  description: Create, search, and read candidates, replace names, tags, and project membership in Ashby.
  company: Ashby
  categories: [hr-recruiting]
  version: v0.2.0
spec:
  provider: ashby
  languages:
    python:
      version: v0.1.0
      package: dex-connector-ashby
      operations: [getCandidate]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-ashby"
      operations: [getCandidate]
      triggers: []
  codegen:
    go:
      package: ashby
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Ashby API root as an absolute HTTPS URL. Blank uses the displayed endpoint; override only for a trusted local test gateway.
        default: https://api.ashbyhq.com
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow candidate reads.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete candidate response in bytes as a positive integer. Blank uses the displayed default; increase for candidates with large metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: ashby-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret Ashby API key from Admin > API Keys. Grant Candidates read/write permissions for the operations used; copy the complete opaque value once. Blank prevents calls. Dex uses it as the Basic username with an empty password.
    guide:
      startURL: https://app.ashbyhq.com
      steps:
        - In Ashby, open Admin > API Keys and create or select an API key with Candidates read/write permissions for these operations. Copy the complete opaque secret into Dex Web api_key; blank is invalid. Revoke or rotate it on the same page. Confidential candidates require the separate confidential jobs and projects permission.
        - Leave baseUrl, timeout, and maxResponseBytes blank for displayed defaults. Find the non-secret candidate UUID in Ashby or from candidate.list and pass it as candidateId; blank is invalid. For tag operations, find the non-secret tag UUID in Ashby Admin > Organization Settings > Candidate Tags or candidateTag.list (which additionally needs Hiring Process read permission) and pass it as tagId; blank is invalid. For project association, open Sourcing > Projects or use candidate.listProjects and pass the non-secret project UUID as projectId; blank is invalid. Results omit email, phone, and resume data.
  operations:
    - name: listCandidateProjects
      goName: ListCandidateProjects
      inputType: ListCandidateProjectsInput
      outputType: CandidateProjectPage
      kind: query
      description: List a bounded page of projects associated with one candidate.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Ashby returned the candidate's projects.}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby conclusively rejected the project list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Ashby returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Candidate ID or page fields or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample project is associated with the candidate.
          output: {projects: [{id: bcffca12-5b09-4a76-acf2-00a8e267b222, title: Senior Engineers, createdAt: '2024-01-15T10:30:00.000Z', isArchived: false}], moreDataAvailable: false}
    - name: addCandidateProject
      goName: AddCandidateProject
      inputType: CandidateProjectInput
      outputType: CandidateProfile
      kind: mutation
      description: Add a candidate to an existing Ashby project.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: added, goName: Added, description: Ashby returned the candidate after project association.}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby definitively rejected the project association., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Ashby returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Candidate or project ID or credentials are invalid., optional: true}
      mocks:
        - name: addedDefault
          branch: added
          default: true
          description: A sample candidate is associated with a project.
          output: {id: e9ed20fd-d45f-4aad-8a00-a19bfba0083e, name: Example Candidate, createdAt: '2024-01-15T10:30:00.000Z', updatedAt: '2024-01-16T10:30:00.000Z'}
    - name: removeCandidateProject
      goName: RemoveCandidateProject
      inputType: CandidateProjectInput
      outputType: CandidateProfile
      kind: mutation
      description: Remove a candidate from an Ashby project.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: removed, goName: Removed, description: Ashby returned the candidate after removal.}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby definitively rejected the project removal., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Ashby returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Candidate or project ID or credentials are invalid., optional: true}
      mocks:
        - name: removedDefault
          branch: removed
          default: true
          description: A sample candidate is removed from a project.
          output: {id: e9ed20fd-d45f-4aad-8a00-a19bfba0083e, name: Example Candidate, createdAt: '2024-01-15T10:30:00.000Z', updatedAt: '2024-01-16T10:30:00.000Z'}
    - name: searchCandidates
      goName: SearchCandidates
      inputType: SearchCandidatesInput
      outputType: CandidateSearchResults
      kind: query
      description: Search candidate identities by name or email, omitting contact information from results.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Ashby returned matching candidates.}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby definitively rejected the search., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Ashby returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Search fields or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample candidate matches the search.
          output: {candidates: [{id: e9ed20fd-d45f-4aad-8a00-a19bfba0083e, name: Example Candidate, createdAt: '2024-01-15T10:30:00.000Z', updatedAt: '2024-01-16T10:30:00.000Z'}]}
    - name: createCandidate
      goName: CreateCandidate
      inputType: CreateCandidateInput
      outputType: CandidateProfile
      kind: mutation
      description: Create a candidate with a display name; a duplicate after an ambiguous send may be acceptable.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Ashby returned the new candidate.}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby definitively rejected the create request., optional: true}
        - {id: uncertain, goName: Uncertain, description: Ashby may have created a candidate but the bounded send cap was reached., optional: true}
        - {id: defect, goName: Defect, description: Candidate name or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample candidate is created.
          output: {id: e9ed20fd-d45f-4aad-8a00-a19bfba0083e, name: Example Candidate, createdAt: '2024-01-15T10:30:00.000Z', updatedAt: '2024-01-16T10:30:00.000Z'}
    - name: addCandidateTag
      goName: AddCandidateTag
      inputType: CandidateTagInput
      outputType: CandidateProfile
      kind: mutation
      description: Add an existing tag to a candidate.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: added, goName: Added, description: Ashby returned the tagged candidate.}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby definitively rejected the tag addition., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Ashby returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Candidate or tag ID or credentials are invalid., optional: true}
      mocks:
        - name: addedDefault
          branch: added
          default: true
          description: A sample tag is added to one candidate.
          output: {id: e9ed20fd-d45f-4aad-8a00-a19bfba0083e, name: Example Candidate, createdAt: '2024-01-15T10:30:00.000Z', updatedAt: '2024-01-16T10:30:00.000Z'}
    - name: removeCandidateTag
      goName: RemoveCandidateTag
      inputType: CandidateTagInput
      outputType: CandidateProfile
      kind: mutation
      description: Remove an existing tag from a candidate.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: removed, goName: Removed, description: Ashby returned the untagged candidate.}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby definitively rejected the tag removal., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Ashby returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Candidate or tag ID or credentials are invalid., optional: true}
      mocks:
        - name: removedDefault
          branch: removed
          default: true
          description: A sample tag is removed from one candidate.
          output: {id: e9ed20fd-d45f-4aad-8a00-a19bfba0083e, name: Example Candidate, createdAt: '2024-01-15T10:30:00.000Z', updatedAt: '2024-01-16T10:30:00.000Z'}
    - name: listCandidates
      goName: ListCandidates
      inputType: ListCandidatesInput
      outputType: CandidatePage
      kind: query
      description: List a bounded page of candidate identities without contact information.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Ashby returned the candidate page.}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby conclusively rejected the list request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Ashby returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local page input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample candidate is listed.
          output: {candidates: [{id: e9ed20fd-d45f-4aad-8a00-a19bfba0083e, name: Example Candidate, createdAt: '2024-01-15T10:30:00.000Z', updatedAt: '2024-01-16T10:30:00.000Z'}], moreDataAvailable: false}
    - name: updateCandidate
      goName: UpdateCandidate
      inputType: UpdateCandidateInput
      outputType: CandidateProfile
      kind: mutation
      description: Replace a candidate's display name by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Ashby returned the updated candidate.}
        - {id: notFound, goName: NotFound, description: Ashby did not expose the candidate., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Ashby returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One sample candidate is renamed.
          output: {id: e9ed20fd-d45f-4aad-8a00-a19bfba0083e, name: Updated Candidate, createdAt: '2024-01-15T10:30:00.000Z', updatedAt: '2024-01-16T10:30:00.000Z'}
    - name: getCandidate
      goName: GetCandidate
      inputType: GetCandidateInput
      outputType: CandidateProfile
      kind: query
      description: Read one candidate's ID, name, and creation/update timestamps.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Ashby returned the candidate.}
        - {id: notFound, goName: NotFound, description: Ashby did not expose the candidate., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Ashby conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Ashby returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample candidate is returned.
          output: {id: e9ed20fd-d45f-4aad-8a00-a19bfba0083e, name: Example Candidate, createdAt: '2024-01-15T10:30:00.000Z', updatedAt: '2024-01-16T10:30:00.000Z'}
