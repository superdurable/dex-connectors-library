apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: opensearch
  displayName: OpenSearch
  description: Search, replace, and delete documents in an OpenSearch index.
  company: OpenSearch
  categories: [databases-storage, data-search]
  version: v0.1.0
spec:
  provider: opensearch
  languages:
    python:
      version: v0.1.0
      package: dex-connector-opensearch
      operations: [indexDocument, deleteDocument, searchDocuments]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-opensearch'
      operations: [indexDocument, deleteDocument, searchDocuments]
      triggers: []
  codegen:
    go:
      package: opensearch
  configuration:
    fields:
      - name: clusterUrl
        goName: ClusterURL
        type: url
        description: Non-secret HTTPS URL of your OpenSearch REST endpoint, typically https://your-cluster.example:9200; find it in your cluster deployment or managed-service console. Do not append an index, query, or fragment. Blank prevents connection creation.
        required: true
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one OpenSearch HTTP request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; raise only for slow searches.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete search response in bytes as a positive integer. Blank uses the displayed default; raise only for larger result pages. Oversized responses select invalidResponse.
        default: 4194304
      - name: maxDocumentBytes
        goName: MaxDocumentBytes
        type: integer
        description: Maximum complete document JSON request in bytes as a positive integer. Blank uses the displayed default; raise only when indexing a larger document.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: opensearch-basic-auth
    fields:
      - name: username
        goName: Username
        type: string
        description: Non-secret internal username from OpenSearch Dashboards at your cluster's Dashboards URL > Security > Internal users. Enter the exact user assigned search, index, or delete permission for the chosen index. Blank prevents calls.
        required: true
      - name: password
        goName: Password
        type: secretString
        description: Secret password set when creating the internal user in OpenSearch Dashboards > Security > Internal users > Create internal user. It is stored only in Dex credentials; blank prevents calls. Rotate it from the same page.
        required: true
    guide:
      startURL: https://docs.opensearch.org/latest/security-plugin/access-control/users-roles/
      steps:
        - Open your OpenSearch Dashboards URL and choose Security > Internal users > Create internal user. Set a username and password, then save them as username and password in this Dex connection.
        - Choose Security > Roles > Create role and grant indices:data/read/search for searches, indices:data/write/index for document replacement, and indices:data/write/delete for deletion on the target index pattern. Map the internal user under that role's Mapped users tab. Grant only the permissions used by your Flows.
        - Find the HTTPS REST endpoint in your cluster deployment or managed-service console and save it as clusterUrl without an index path. Leave timeout, maxResponseBytes, and maxDocumentBytes blank for their displayed defaults.
  operations:
    - name: indexDocument
      goName: IndexDocument
      inputType: IndexDocumentInput
      outputType: IndexedDocument
      kind: mutation
      description: Create or fully replace one document in an existing index under a stable ID. Use an index without nonrepeatable ingest pipeline effects so retries preserve the intended source.
      idempotency: required
      authorization: required
      branches:
        - {id: indexed, goName: Indexed, description: OpenSearch stored the requested document at the stable ID.}
        - {id: providerRejected, goName: ProviderRejected, description: OpenSearch conclusively rejected the document replacement., optional: true}
        - {id: defect, goName: Defect, description: Local document input or credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: indexedProduct
          branch: indexed
          description: A sample product document was stored under its SKU.
          default: true
          output: {index: products, id: sku-42}
    - name: deleteDocument
      goName: DeleteDocument
      inputType: DeleteDocumentInput
      outputType: DeletedDocument
      kind: mutation
      description: Ensure one document is absent by deleting its stable ID; repeating the request is safe.
      idempotency: required
      authorization: required
      branches:
        - {id: absent, goName: Absent, description: "The document is absent, whether deleted now or already missing."}
        - {id: indexNotFound, goName: IndexNotFound, description: The requested index does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: OpenSearch conclusively rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: Local document ID or credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: deletedProduct
          branch: absent
          description: A sample product document was removed from the index.
          default: true
          output: {index: products, id: sku-42, wasDeleted: true}
    - name: searchDocuments
      goName: SearchDocuments
      inputType: SearchDocumentsInput
      outputType: SearchPage
      kind: query
      description: Search one OpenSearch index with a Lucene query string and bounded offset page.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "OpenSearch returned a search page, possibly empty."}
        - {id: indexNotFound, goName: IndexNotFound, description: The requested index does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: OpenSearch conclusively rejected the search., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: OpenSearch returned malformed or oversized search data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: matchingDocument
          branch: found
          description: A sample product document matches the example search.
          default: true
          output: {total: 1, relation: eq, hits: [{index: products, id: sku-42, score: 1.25, source: {title: Meridian, category: release}}]}
