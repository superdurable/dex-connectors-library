[package]
name = "dex-connector-haimou"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "HAIMOU IP location queries for Dex Flows"
repository = "https://github.com/superdurable/dex-connectors-library"

[dependencies]
dex-connectors-sdk = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
form_urlencoded = "1.2.3"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
