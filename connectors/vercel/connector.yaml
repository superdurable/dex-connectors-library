apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: vercel
  displayName: Vercel
  description: "Inspect and manage Vercel deployments, projects, and project domains through typed Dex connector Steps."
  company: Vercel
  categories: [developer-tools]
  version: v0.3.0
spec:
  provider: vercel
  languages:
    python:
      version: v0.1.0
      operations: [listDeployments, getDeployment]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-vercel"
      operations: [listDeployments, getDeployment]
      triggers: []
  codegen:
    go:
      package: vercel
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: "Vercel REST API base URL. Leave blank for the displayed provider endpoint; override only for a compatible HTTPS gateway or loopback test server."
        default: https://api.vercel.com
      - name: timeout
        goName: Timeout
        type: duration
        description: "Positive Go duration bounding one HTTP request; leave blank for the displayed default, or override for a slower network."
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Positive byte limit for one response; leave blank for the displayed default, or override for larger pages."
        default: 2097152
  auth:
    type: apiKey
    connectionKind: vercel-api-key
    fields:
      - name: access_token
        goName: AccessToken
        type: secretString
        description: "Secret Vercel access token from Account Settings > Tokens at https://vercel.com/account/tokens. Create a token for the account or team that owns the deployments; copy it once. Blank prevents requests."
        required: true
    guide:
      startURL: https://vercel.com/account/tokens
      steps:
        - "Open https://vercel.com/account/tokens in Account Settings > Tokens and create a token scoped to the personal account or team whose deployments you will read."
        - "Copy the secret token into access_token; leave baseUrl, timeout, and maxResponseBytes blank unless changing their displayed defaults."
  operations:
    - name: listDeployments
      goName: ListDeployments
      inputType: ListDeploymentsInput
      outputType: DeploymentsPage
      kind: query
      description: "List deployments visible to a personal account or team."
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "List deployments visible to a personal account or team."}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: listedDefault
          branch: listed
          description: "A Meridian example returns a representative DeploymentsPage."
          default: true
          output: {"deployments":[{"uid":"dpl_meridian1","name":"meridian-web","url":"meridian-web.vercel.app","state":"READY","created":1761436800000}],"pagination":{"next":null}}
    - name: getDeployment
      goName: GetDeployment
      inputType: GetDeploymentInput
      outputType: Deployment
      kind: query
      description: "Read a deployment by Vercel deployment ID or hostname."
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "Read a deployment by Vercel deployment ID or hostname."}
        - {id: notFound, goName: NotFound, description: The requested resource does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: foundDefault
          branch: found
          description: "A Meridian example returns a representative Deployment."
          default: true
          output: {"uid":"dpl_meridian1","name":"meridian-web","url":"meridian-web.vercel.app","state":"READY","created":1761436800000}
    - name: cancelDeployment
      goName: CancelDeployment
      inputType: CancelDeploymentInput
      outputType: Deployment
      kind: mutation
      description: Cancel a deployment that has not completed.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: canceled, goName: Canceled, description: Vercel accepted the cancellation.}
        - {id: notFound, goName: NotFound, description: The deployment does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel conclusively rejected cancellation., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Vercel returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: The deployment ID or connection is invalid., optional: true}
      mocks:
        - name: canceledDefault
          branch: canceled
          default: true
          description: One example deployment was canceled.
          output: {uid: dpl_meridian1, name: meridian-web, readyState: CANCELED}
    - name: deleteDeployment
      goName: DeleteDeployment
      inputType: DeleteDeploymentInput
      outputType: DeletedDeployment
      kind: mutation
      description: Delete a deployment by ID; an already absent deployment counts as deleted.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: The deployment is now absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel conclusively rejected deletion., optional: true}
        - {id: defect, goName: Defect, description: The deployment ID or connection is invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: One example deployment was deleted.
          output: {deploymentId: dpl_meridian1}
    - name: listProjects
      goName: ListProjects
      inputType: ListProjectsInput
      outputType: ProjectsPage
      kind: query
      description: List projects visible to the token or selected team.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: A page of projects was returned.}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Vercel returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: The team ID or connection is invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: One example project is listed., output: {projects: [{id: prj_meridian1, name: meridian-web}], pagination: {next: null}}}
    - name: getProject
      goName: GetProject
      inputType: GetProjectInput
      outputType: Project
      kind: query
      description: Read one project by Vercel ID or name.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: The project was returned.}
        - {id: notFound, goName: NotFound, description: The project does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Vercel returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: The project ID or connection is invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: One example project is found., output: {id: prj_meridian1, name: meridian-web}}
    - name: createProject
      goName: CreateProject
      inputType: CreateProjectInput
      outputType: Project
      kind: mutation
      description: Create a named Vercel project with bounded sends; an unknown result cannot be confirmed by name and may be uncertain.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: The project was created.}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the create request., optional: true}
        - {id: uncertain, goName: Uncertain, description: The project may have been created but could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: The project name or connection is invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: One example project is created., output: {id: prj_meridian1, name: meridian-web}}
    - name: updateProject
      goName: UpdateProject
      inputType: UpdateProjectInput
      outputType: Project
      kind: mutation
      description: Replace the name of an existing Vercel project.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: The project has the requested name.}
        - {id: notFound, goName: NotFound, description: The project does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Vercel returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: "The project ID, name, or connection is invalid.", optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: One example project is renamed., output: {id: prj_meridian1, name: meridian-renamed}}
    - name: deleteProject
      goName: DeleteProject
      inputType: DeleteProjectInput
      outputType: DeletedProject
      kind: mutation
      description: Delete a Vercel project by ID; an already absent project counts as deleted.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: The project is now absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: The project ID or connection is invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: One example project is deleted., output: {projectId: prj_meridian1}}
    - name: listProjectDomains
      goName: ListProjectDomains
      inputType: ListProjectDomainsInput
      outputType: ProjectDomainsPage
      kind: query
      description: List the domains assigned to one project.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: The project domains were returned.}
        - {id: notFound, goName: NotFound, description: The project does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Vercel returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: One project domain is listed., output: {domains: [{name: meridian.example.com, projectId: prj_meridian1, verified: true}], pagination: {next: null}}}
    - name: getProjectDomain
      goName: GetProjectDomain
      inputType: ProjectDomainInput
      outputType: ProjectDomain
      kind: query
      description: Read a project's assigned domain.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: The project domain was returned.}
        - {id: notFound, goName: NotFound, description: The domain is not assigned to the project., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Vercel returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: One project domain is found., output: {name: meridian.example.com, projectId: prj_meridian1, verified: true}}
    - name: addProjectDomain
      goName: AddProjectDomain
      inputType: ProjectDomainInput
      outputType: ProjectDomain
      kind: mutation
      description: Assign a domain to a project with bounded sends; an unknown result cannot be confirmed by domain name and may be uncertain.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: added, goName: Added, description: The domain was assigned.}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the assignment., optional: true}
        - {id: uncertain, goName: Uncertain, description: The assignment may have succeeded but could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - {name: addedDefault, branch: added, default: true, description: One domain was assigned., output: {name: meridian.example.com, projectId: prj_meridian1, verified: false}}
    - name: updateProjectDomain
      goName: UpdateProjectDomain
      inputType: UpdateProjectDomainInput
      outputType: ProjectDomain
      kind: mutation
      description: Set the Git branch assigned to a project domain.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: The domain uses the requested branch.}
        - {id: notFound, goName: NotFound, description: The domain is not assigned to the project., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Vercel returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: One domain was assigned to a branch., output: {name: meridian.example.com, projectId: prj_meridian1, gitBranch: staging, verified: true}}
    - name: removeProjectDomain
      goName: RemoveProjectDomain
      inputType: ProjectDomainInput
      outputType: RemovedProjectDomain
      kind: mutation
      description: Remove a domain assignment from a project.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: removed, goName: Removed, description: The domain is no longer assigned.}
        - {id: providerRejected, goName: ProviderRejected, description: Vercel rejected the removal., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - {name: removedDefault, branch: removed, default: true, description: One domain assignment was removed., output: {name: meridian.example.com, projectId: prj_meridian1}}
    - name: verifyProjectDomain
      goName: VerifyProjectDomain
      inputType: ProjectDomainInput
      outputType: ProjectDomain
      kind: mutation
      description: Verify a project's domain after its DNS challenge is satisfied.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: verified, goName: Verified, description: The domain was verified.}
        - {id: notFound, goName: NotFound, description: The domain is not assigned to the project., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The challenge is incomplete or Vercel rejected it., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Vercel returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - {name: verifiedDefault, branch: verified, default: true, description: One domain was verified., output: {name: meridian.example.com, projectId: prj_meridian1, verified: true}}
