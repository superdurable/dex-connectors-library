apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: slack
  displayName: Slack
  description: Start and update Dex Flows from Slack threads and exchange thread messages.
  company: Slack
  version: v1.5.1
spec:
  provider: slack
  languages:
    python:
      version: v0.4.1
      package: dex-connector-slack
      operations: [listChannels, getWorkspaceIdentity, listThreadMessages, getThreadReply, postChannelMessage, postThreadReply]
      triggers: []
    typescript:
      version: v0.4.1
      package: "@superdurable/connector-slack"
      operations: [listChannels, getWorkspaceIdentity, listThreadMessages, getThreadReply, postChannelMessage, postThreadReply]
      triggers: []
  codegen:
    go:
      package: slack
  configuration:
    fields:
      - name: endpoint
        goName: Endpoint
        type: url
        description: Slack Web API base URL; leave blank for Slack's public API. Enter an absolute HTTPS URL only for an explicitly supported compatible gateway.
        required: false
        default: https://slack.com/api
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete Slack API response in bytes; enter a positive integer only to change the safety limit. Oversized responses select invalidResponse.
        required: false
        default: 4194304
      - name: maxMessageCharacters
        goName: MaxMessageCharacters
        type: integer
        description: Positive maximum Slack message text length in Unicode characters; keep it within Slack's current message limit unless a compatible gateway differs.
        required: false
        default: 40000
  auth:
    refreshable: true
    type: oauth2
    connectionKind: slack-socket-mode-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        description: Non-secret Client ID copied from https://api.slack.com/apps after selecting the app > Basic Information > App Credentials; blank means OAuth installation and token refresh cannot start.
        required: false
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        description: Secret copied from https://api.slack.com/apps after selecting the app > Basic Information > App Credentials > Client Secret; store it only in this credential field and blank means OAuth installation and refresh cannot start.
        required: false
      - name: bot_token
        goName: BotToken
        type: secretString
        description: Secret xoxb- or rotating xoxe.xoxb- bot token produced automatically by OAuth after installation; Dex refreshes it before expiry and it must not be entered manually.
        required: true
      - name: bot_refresh_token
        goName: BotRefreshToken
        type: secretString
        description: Secret one-use xoxe- refresh token for the bot token when Slack token rotation is enabled; Dex atomically replaces it after each refresh, while blank means the bot token is non-expiring or reauthorization is required after expiry.
        required: false
      - name: user_token
        goName: UserToken
        type: secretString
        description: Secret xoxp- or rotating xoxe.xoxp- user token produced automatically by OAuth for the displayed user scopes; Dex refreshes it before expiry and it must not be entered manually.
        required: true
      - name: user_refresh_token
        goName: UserRefreshToken
        type: secretString
        description: Secret one-use xoxe- refresh token for the user token when Slack token rotation is enabled; Dex atomically replaces it after each refresh, while blank means the user token is non-expiring or reauthorization is required after expiry.
        required: false
      - name: app_token
        goName: AppToken
        type: secretString
        description: Secret xapp- token from Slack app > Basic Information > App-Level Tokens; generate it with connections:write and copy the value shown once. Triggers receive events through Socket Mode with it; blank means a host that installed its own Slack app relays the events instead.
        required: false
    guide:
      startURL: https://api.slack.com/apps
      steps:
        - Create or select a Slack app; under OAuth & Permissions add the displayed bot and user token scopes, then add the exact Redirect URI shown below.
        - Under Socket Mode, enable Socket Mode; under Basic Information > App-Level Tokens, generate an xapp- token with connections:write.
        - Copy Client ID and Client Secret from Basic Information > App Credentials and paste them below; also paste the xapp- token in app_token, which Triggers need to receive events through Socket Mode.
        - Under OAuth & Permissions enable Token Rotation only after this release is deployed; rotating bot and user access tokens expire after 12 hours and each refresh token is one-use.
    oauth2:
      authorizationEndpoint: https://slack.com/oauth/v2/authorize
      tokenEndpoint: https://slack.com/api/oauth.v2.access
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [channels:history, groups:history, channels:read, groups:read, users:read, chat:write]
      userScopes: [channels:history, groups:history]
      credentialMappings:
        - {credential: bot_token, source: access_token}
        - {credential: bot_refresh_token, source: refresh_token}
        - {credential: user_token, source: authed_user.access_token}
        - {credential: user_refresh_token, source: authed_user.refresh_token}
      pkce: false
      tokenEndpointAuthMethod: client_secret_basic
      refresh:
        tokenExchangeTimeout: 25s
        missingExpiry: reject
        scopeSeparators: whitespaceAndComma
        terminalErrorCodes: [invalid_refresh_token, bad_client_secret, invalid_client_id, invalid_auth, token_revoked, account_inactive, access_denied]
        grants:
          - refreshTokenCredential: bot_refresh_token
            acceptedTokenTypes: [bot]
            exactScopes: true
            credentialMappings:
              - {credential: bot_token, source: access_token}
              - {credential: bot_refresh_token, source: refresh_token}
          - refreshTokenCredential: user_refresh_token
            acceptedTokenTypes: [user]
            exactScopes: true
            grantedScopes: userScopes
            credentialMappings:
              - {credential: user_token, source: access_token}
              - {credential: user_refresh_token, source: refresh_token}
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [oauth.connection.manage, use.configuration.write, slack.channels-list, slack.users-list]
      mockScenarios: [not-configured, authorization-pending, connected, insufficient-scope, revoked, broker-unavailable, ready]
      icon: icon.svg
    commands:
      - id: listChannels
        capability: slack.channels-list
        request:
          method: GET
          url: https://slack.com/api/conversations.list
          credential: {field: bot_token, scheme: bearer}
          fixedQuery: {exclude_archived: "true", limit: "200", types: "public_channel,private_channel"}
          parameters:
            - {name: cursor, location: query, target: cursor}
      - id: listUsers
        capability: slack.users-list
        request:
          method: GET
          url: https://slack.com/api/users.list
          credential: {field: bot_token, scheme: bearer}
          fixedQuery: {limit: "200"}
          parameters:
            - {name: cursor, location: query, target: cursor}
    units:
      - id: channelPicker
        goName: ChannelPicker
        description: Select one joined public or private channel loaded from the authorized workspace; the unit stores the stable Slack channel ID automatically.
        backendCapabilities: [slack.channels-list]
        outputs:
          - {name: channelId, goName: ChannelID, type: string}
      - id: memberPicker
        goName: MemberPicker
        description: Select one or more active workspace members loaded from Slack; the unit stores stable Slack member IDs automatically.
        backendCapabilities: [slack.users-list]
        outputs:
          - {name: memberIds, goName: MemberIDs, type: stringList}
      - id: textInput
        goName: TextInput
        description: Enter the literal message to post, or plain text an incoming Slack message must contain, depending on the operation or Trigger label.
        outputs:
          - {name: text, goName: Text, type: string}
  triggers:
    - name: channelThreadCreated
      goName: ChannelThreadCreated
      eventType: MessageEvent
      configurationType: ChannelThreadCreatedTriggerConfiguration
      description: Receive a matching top-level channel message.
    - name: threadReplyCreated
      goName: ThreadReplyCreated
      eventType: MessageEvent
      configurationType: ThreadReplyCreatedTriggerConfiguration
      description: Receive a matching thread reply.
  operations:
    - name: listChannels
      goName: ListChannels
      inputType: ListChannelsInput
      outputType: ListChannelsOutput
      kind: query
      description: Read one page of non-archived public and private Slack channels visible to the app, optionally filtered by name.
      idempotency: none
      branches:
        - {id: listed, goName: Listed, description: The channel page was read.}
        - {id: providerRejected, goName: ProviderRejected, description: Slack conclusively rejected the channel query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Slack returned an invalid or oversized channel response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      agent:
        exposed: true
        # providerRejected follows Slack's definite refusal; invalidResponse is unlisted because corrected input cannot fix it.
        branches: {providerRejected: rejected, defect: rejected}
        description: "Find Slack channels and their channel IDs. Call this first whenever the user names a channel, such as #general, and pass the returned channelId to other Slack tools instead of asking the user for an ID. Optionally supply part of the channel name (case-insensitive; a leading # is ignored), visibility public or private, memberOnly true to list only channels the app has joined, a limit from 1 through 999, and the cursor from the previous page. The name filter applies to each page separately, so a page can have no match: while nextCursor is present, call again with it. The app can post only where isMember is true, and a private channel appears only after the app is added to it."
      execution:
        executeMethodTimeout: 30s
        durability: async
      pagination: {inputField: cursor, nextField: nextCursor}
      mocks:
        - name: workspaceChannels
          branch: listed
          description: Three unordered channel pages with a repeated channel across a page boundary and a channel the app has not joined.
          default: true
          pages:
            - channels:
                - {channelId: C0345678901, name: support, isPrivate: false, isMember: true, topic: Customer questions, purpose: Answer customer questions within one business day.}
                - {channelId: C0123456789, name: general, isPrivate: false, isMember: true, topic: Company announcements, purpose: Company-wide announcements and work-based matters.}
              nextCursor: cursor-page-2
            - channels:
                - {channelId: C0123456789, name: general, isPrivate: false, isMember: true, topic: Company announcements, purpose: Company-wide announcements and work-based matters.}
                - {channelId: C0456789012, name: random, isPrivate: false, isMember: false, purpose: Non-work banter and water cooler conversation.}
              nextCursor: cursor-page-3
            - channels:
                - {channelId: G0234567890, name: order-approvals, isPrivate: true, isMember: true, topic: Orders awaiting approval, purpose: Approve or reject large orders.}
        - name: channelListRejected
          branch: providerRejected
          description: Slack rejects the channel listing because the app lacks the channel read scopes.
          failure: {kind: AUTHORIZATION, message: Slack rejected the channel listing because the app lacks a required scope.}
        - name: malformedChannelList
          branch: invalidResponse
          description: Slack returns an invalid channel list response.
          failure: {kind: PROTOCOL, message: Slack returned an invalid channel list response.}
        - name: channelLimitOutOfRange
          branch: defect
          description: The page limit is above 999, so no request is sent.
          failure: {kind: VALIDATION, message: The channel page limit must be from 1 through 999.}
    - name: getWorkspaceIdentity
      goName: GetWorkspaceIdentity
      inputType: GetWorkspaceIdentityInput
      outputType: GetWorkspaceIdentityOutput
      kind: query
      description: Read the Slack workspace and bot identity that the connection is authorized for.
      idempotency: none
      branches:
        - {id: read, goName: Read, description: The workspace and bot identity were read.}
        - {id: providerRejected, goName: ProviderRejected, description: Slack conclusively rejected the identity query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Slack returned an invalid or oversized identity response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      agent:
        exposed: true
        # providerRejected follows Slack's definite refusal; invalidResponse is unlisted because corrected input cannot fix it.
        branches: {providerRejected: rejected, defect: rejected}
        description: Show which Slack workspace this connection is connected to and which bot posts for it. Takes no input. Returns the workspace name, ID, and URL, the Enterprise Grid organization ID when there is one, and the bot's user ID, user name, and bot ID. Use it to tell the user which workspace a message will go to.
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: acmeWorkspace
          branch: read
          description: The bot identity in a standard workspace outside Enterprise Grid.
          default: true
          output: {teamId: T0123456789, teamName: Acme Corp, workspaceUrl: "https://acme.slack.com/", botUserId: U0BOT123456, botUserName: dex-bot, botId: B0123456789}
        - name: identityRejected
          branch: providerRejected
          description: Slack rejects the identity read because the connection was revoked.
          failure: {kind: AUTHENTICATION, message: Slack rejected the identity read because the connection was revoked.}
        - name: malformedIdentity
          branch: invalidResponse
          description: Slack returns an identity response without the bot user ID.
          failure: {kind: PROTOCOL, message: Slack returned an invalid identity response.}
        - name: missingBotToken
          branch: defect
          description: The connection has no bot token, so no request is sent.
          failure: {kind: AUTHENTICATION, message: Slack connection credentials are unavailable.}
    - name: listThreadMessages
      goName: ListThreadMessages
      inputType: ListThreadMessagesInput
      outputType: ListThreadMessagesOutput
      kind: query
      description: Read one bounded page of messages from a channel thread.
      idempotency: none
      branches:
        - {id: read, goName: Read, description: The thread page was read.}
        - {id: providerRejected, goName: ProviderRejected, description: Slack conclusively rejected the thread query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Slack returned an invalid or oversized thread response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      agent:
        exposed: true
        # providerRejected follows Slack's definite refusal; invalidResponse is unlisted because corrected input cannot fix it.
        branches: {providerRejected: rejected, defect: rejected}
        description: Read one page of messages from a Slack channel thread. Supply the channel ID, the parent message timestamp, a page size from 1 through 15, and the cursor from the previous page to continue.
      execution:
        executeMethodTimeout: 30s
        durability: async
      pagination: {inputField: cursor, nextField: nextCursor}
      mocks:
        - name: approvalThread
          branch: read
          description: Three pages of a channel thread with a repeated reply across page boundaries.
          default: true
          pages:
            - messages:
                - {channelId: C0123456789, timestamp: "1710000000.000100", userId: U0123456789, text: "Request approval for order 1042."}
                - {channelId: C0123456789, timestamp: "1710000001.000200", threadTimestamp: "1710000000.000100", userId: U0234567890, text: "Can you confirm the delivery date?"}
              nextCursor: cursor-page-2
            - messages:
                - {channelId: C0123456789, timestamp: "1710000001.000200", threadTimestamp: "1710000000.000100", userId: U0234567890, text: "Can you confirm the delivery date?"}
                - {channelId: C0123456789, timestamp: "1710000002.000300", threadTimestamp: "1710000000.000100", userId: U0345678901, text: "Delivery is scheduled for Thursday."}
              nextCursor: cursor-page-3
            - messages:
                - {channelId: C0123456789, timestamp: "1710000003.000400", threadTimestamp: "1710000000.000100", userId: U0456789012, text: "Approved for dispatch."}
        - name: readRejected
          branch: providerRejected
          description: Slack rejects the thread read because the app is not in the private channel.
          failure: {kind: AUTHORIZATION, message: Slack rejected the thread read because the app is not in the channel.}
        - name: malformedThread
          branch: invalidResponse
          description: Slack returns an invalid thread response.
          failure: {kind: PROTOCOL, message: Slack returned an invalid thread response.}
        - name: missingThreadTimestamp
          branch: defect
          description: The thread timestamp is missing, so no request is sent.
          failure: {kind: VALIDATION, message: The thread timestamp is required.}
    - name: getThreadReply
      goName: GetThreadReply
      inputType: GetThreadReplyInput
      outputType: GetThreadReplyOutput
      kind: query
      description: Read one reply from a channel thread by timestamp.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: The reply was found.}
        - {id: notFound, goName: NotFound, description: The reply does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Slack conclusively rejected the reply query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Slack returned an invalid or oversized reply response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      agent:
        exposed: true
        # notFound and providerRejected follow a complete Slack reply; invalidResponse stays unlisted.
        branches: {notFound: rejected, providerRejected: rejected, defect: rejected}
        description: Read one reply in a Slack channel thread. Supply the channel ID, the parent message timestamp, and the reply's own timestamp.
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: approvalReply
          branch: found
          description: A human approval reply in an existing channel thread.
          default: true
          output:
            message: {channelId: C0123456789, timestamp: "1710000003.000400", threadTimestamp: "1710000000.000100", userId: U0456789012, text: "Approved for dispatch."}
        - name: replyMissing
          branch: notFound
          description: The requested reply was deleted or never existed.
          failure: {kind: NOT_FOUND, message: The Slack thread reply does not exist.}
        - name: replyRejected
          branch: providerRejected
          description: Slack rejects the reply read because the app lacks channel access.
          failure: {kind: AUTHORIZATION, message: Slack rejected the reply read because the app cannot access the channel.}
        - name: malformedReply
          branch: invalidResponse
          description: Slack returns an invalid reply response.
          failure: {kind: PROTOCOL, message: Slack returned an invalid reply response.}
        - name: missingReplyTimestamp
          branch: defect
          description: The reply timestamp is missing, so no request is sent.
          failure: {kind: VALIDATION, message: The reply timestamp is required.}
    - name: postChannelMessage
      goName: PostChannelMessage
      inputType: PostChannelMessageInput
      outputType: PostMessageOutput
      kind: mutation
      description: Post one top-level message to a Slack channel. Synchronous durability preserves the shared single-dispatch fence after retry or Worker loss.
      idempotency: required
      branches: &postBranches
        - {id: sent, goName: Sent, description: Slack accepted the message.}
        - {id: providerRejected, goName: ProviderRejected, description: Slack conclusively rejected the message., optional: true}
        - {id: uncertain, goName: Uncertain, description: The dispatched message outcome cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: "Local input, terminal connection credentials, connection configuration, or connector definition is invalid.", optional: true}
      agent:
        exposed: true
        # No retry claim: client_msg_id dedupe is unverified and the fence relies on host checkpoints.
        approval: recommended
        # defect is raised before chat.postMessage is sent; every path that may have posted is uncertain.
        branches: {providerRejected: rejected, uncertain: unknown, defect: rejected}
        description: "Post one new top-level message to a Slack channel. Supply the channel ID and the message text. When the user names a channel, such as #general, first find its channelId with the Slack list_channels tool for the same connection; never ask the user for a channel ID that tool can find. The app must be a member of the channel."
      execution:
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m, reason: {kind: duplicateWriteRisk, explanation: "Only HTTP 429/503, complete HTTP 2xx rate-limit or service-unavailable refusals, HTTP 401 or complete HTTP 2xx credential refusals followed by successful refresh, proven-unsent, pre-dispatch, and read-back failures retry; client_msg_id replay is unverified, and a lost timestamp cannot be read back, so a broader replay could publish another message."}}
      mocks:
        - name: messageSent
          branch: sent
          description: Slack accepts a new top-level channel message.
          default: true
          output:
            message: {channelId: C0123456789, timestamp: "1710000010.000500", userId: U0BOT123456, text: "Order 1042 is ready for review."}
        - name: channelRejected
          branch: providerRejected
          description: Slack rejects the post because the bot cannot write to the channel.
          failure: {kind: AUTHORIZATION, message: Slack rejected the channel post because the bot cannot write to the channel.}
        - name: postOutcomeUnknown
          description: The connection closes after dispatch, so Slack acceptance cannot be confirmed.
          uncertain: {failure: {kind: TRANSPORT, message: The connection closed before Slack confirmed the channel post.}}
        - name: missingMessageText
          branch: defect
          description: The message text is empty, so no request is sent.
          failure: {kind: VALIDATION, message: The channel message text is required.}
    - name: postThreadReply
      goName: PostThreadReply
      inputType: PostThreadReplyInput
      outputType: PostMessageOutput
      kind: mutation
      description: Post one reply to an existing Slack channel thread. Synchronous durability preserves the shared single-dispatch fence after retry or Worker loss.
      idempotency: required
      branches: *postBranches
      agent:
        exposed: true
        # No retry claim: client_msg_id dedupe is unverified and the fence relies on host checkpoints.
        approval: recommended
        # defect is raised before chat.postMessage is sent; every path that may have posted is uncertain.
        branches: {providerRejected: rejected, uncertain: unknown, defect: rejected}
        description: "Post one reply to an existing Slack channel thread. Supply the channel ID, the parent message timestamp, and the reply text. When the user names a channel, such as #general, find its channelId with the Slack list_channels tool for the same connection; never ask the user for a channel ID that tool can find."
      execution:
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m, reason: {kind: duplicateWriteRisk, explanation: "Only HTTP 429/503, complete HTTP 2xx rate-limit or service-unavailable refusals, HTTP 401 or complete HTTP 2xx credential refusals followed by successful refresh, proven-unsent, pre-dispatch, and read-back failures retry; client_msg_id replay is unverified, and a lost timestamp cannot be read back, so a broader replay could publish another reply."}}
      mocks:
        - name: replySent
          branch: sent
          description: Slack accepts a reply in the existing channel thread.
          default: true
          output:
            message: {channelId: C0123456789, timestamp: "1710000011.000600", threadTimestamp: "1710000000.000100", userId: U0BOT123456, text: "Processing complete."}
        - name: threadRejected
          branch: providerRejected
          description: Slack rejects the reply because the thread is unavailable.
          failure: {kind: NOT_FOUND, message: Slack could not find the channel thread for this reply.}
        - name: replyOutcomeUnknown
          description: The connection closes after dispatch, so Slack acceptance cannot be confirmed.
          uncertain: {failure: {kind: TRANSPORT, message: The connection closed before Slack confirmed the thread reply.}}
        - name: missingReplyText
          branch: defect
          description: The reply text is empty, so no request is sent.
          failure: {kind: VALIDATION, message: The thread reply text is required.}
