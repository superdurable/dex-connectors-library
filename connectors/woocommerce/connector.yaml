apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: woocommerce
  displayName: WooCommerce
  description: "Read and manage WooCommerce orders, customers, and products through typed Dex Steps."
  company: WooCommerce
  categories: [ecommerce]
  version: v0.3.0
spec:
  provider: woocommerce
  languages:
    python:
      version: v0.1.0
      operations: [listOrders, getOrder]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-woocommerce"
      operations: [listOrders, getOrder]
      triggers: []
  codegen:
    go:
      package: woocommerce
  configuration:
    fields:
      - name: storeUrl
        goName: StoreURL
        type: url
        description: "Non-secret HTTPS Site Address (URL) from your WordPress admin > Settings > General, including any site path but without /wp-json/wc/v3. Required; blank cannot identify the store. The connector appends /wp-json/wc/v3."
        required: true
      - name: timeout
        goName: Timeout
        type: duration
        description: "Maximum duration of one provider HTTP request as a positive Go duration, such as 15s or 1m. Blank uses the displayed default; override for slow network paths."
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum provider JSON response size in bytes as a positive integer. Blank uses the displayed default; raise only for larger result pages."
        default: 2097152
  auth:
    type: apiKey
    connectionKind: woocommerce-api-key
    fields:
      - name: consumer_key
        goName: ConsumerKey
        type: secretString
        description: "Secret WooCommerce consumer key from your store admin at WooCommerce > Settings > Advanced > REST API > Add key. Choose Read/Write permission for mutations; key normally starts ck_. Pair with consumer_secret. Blank prevents calls."
        required: true
      - name: consumer_secret
        goName: ConsumerSecret
        type: secretString
        description: "Secret cs_ value generated beside consumer_key at your store admin > WooCommerce > Settings > Advanced > REST API. Stored only in Dex credentials; blank prevents calls."
        required: true
    guide:
      startURL: https://woocommerce.com/document/woocommerce-rest-api/
      steps:
        - "At your HTTPS WordPress store admin, open WooCommerce > Settings > Advanced > REST API > Add key, select a user and Read/Write permission for mutations, then generate the key. Copy the secret ck_ consumer key into consumer_key and cs_ consumer secret into consumer_secret; both are stored only as Dex credentials. Set storeUrl to the Site Address (URL) from WordPress > Settings > General; blank credentials prevent calls."
        - "Set storeUrl, timeout, and maxResponseBytes only as described below; defaults appear in parentheses in Dex Web."
  operations:
    - name: listOrders
      goName: ListOrders
      inputType: ListOrdersInput
      outputType: OrderPage
      kind: query
      description: "List one page of WooCommerce orders."
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "List one page of WooCommerce orders."}
        - {id: notFound, goName: NotFound, description: The requested resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: listed
          description: "A realistic read-only listOrders response for a Meridian account."
          default: true
          output: {"orders":[{"id":101,"status":"processing","total":"29.00","currency":"USD"}]}
    - name: getOrder
      goName: GetOrder
      inputType: GetOrderInput
      outputType: Order
      kind: query
      description: "Read one WooCommerce order."
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "Read one WooCommerce order."}
        - {id: notFound, goName: NotFound, description: The requested resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: found
          description: "A realistic read-only getOrder response for a Meridian account."
          default: true
          output: {"id":101,"status":"processing","total":"29.00","currency":"USD"}
    - name: createOrder
      goName: CreateOrder
      inputType: CreateOrderInput
      outputType: Order
      kind: mutation
      description: "Create an order with product line items."
      idempotency: required
      authorization: required
      branches:
        - {id: created, goName: Created, description: "The order was created."}
        - {id: providerRejected, goName: ProviderRejected, description: "The provider conclusively rejected the order.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "The provider returned malformed or oversized JSON.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "The capped create outcome could not be confirmed.", optional: true}
        - {id: defect, goName: Defect, description: "Local input or connection credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: sync
        repeatOnUnknown: limited
        maxSends: 3
      mocks:
        - name: defaultAnswer
          branch: created
          description: "A newly created sample order."
          default: true
          output: {"id":102,"status":"pending","total":"29.00","currency":"USD"}
    - name: updateOrder
      goName: UpdateOrder
      inputType: UpdateOrderInput
      outputType: Order
      kind: mutation
      description: "Replace an order status."
      idempotency: required
      authorization: required
      branches:
        - {id: updated, goName: Updated, description: "The order status was updated."}
        - {id: notFound, goName: NotFound, description: "The order was not found.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "The provider conclusively rejected the update.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "The provider returned malformed or oversized JSON.", optional: true}
        - {id: defect, goName: Defect, description: "Local input or connection credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        repeatOnUnknown: safe
      mocks:
        - name: defaultAnswer
          branch: updated
          description: "An updated sample order."
          default: true
          output: {"id":101,"status":"completed","total":"29.00","currency":"USD"}
