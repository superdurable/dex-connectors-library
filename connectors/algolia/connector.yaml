apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: algolia
  displayName: Algolia
  description: Search and manage indexed records, and list indices.
  company: Algolia
  categories: [databases-storage, data-search]
  version: v0.4.0
spec:
  provider: algolia
  languages:
    typescript:
      version: v0.2.0
      operations: [saveObject, search]
      triggers: []
    python:
      version: v0.2.0
      operations: [saveObject, search]
      triggers: []
  codegen:
    go:
      package: algolia
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Algolia host template; the connector prefixes your application ID to the displayed host for public calls. Leave blank normally; enter a compatible HTTPS gateway URL only for a custom deployment.
        default: https://algolia.net/1
      - name: timeout
        goName: Timeout
        type: duration
        description: Positive Go duration limiting each HTTP request; leave blank for the displayed default, or override for a slower network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum response bytes as a positive integer; leave blank for the displayed safety limit, or raise it for larger hit pages.
        default: 2097152
  auth:
    type: apiKey
    connectionKind: algolia-api-key
    fields:
      - name: application_id
        goName: ApplicationID
        type: string
        required: true
        description: Public uppercase alphanumeric Algolia Application ID from https://www.algolia.com/account/api-keys/all under Settings > Team and Access > API Keys; blank prevents requests.
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret Algolia API key from https://www.algolia.com/account/api-keys/restricted under Settings > Team and Access > API Keys > Restricted API Keys > Create API Key; grant search, addObject, deleteObject, and listIndexes ACLs for the operations you use. Blank prevents requests.
    guide:
      startURL: https://www.algolia.com/account/api-keys/all
      steps:
        - Sign in at https://www.algolia.com and open Settings > Team and Access > API Keys at https://www.algolia.com/account/api-keys/all; copy the Application ID string.
        - Open Restricted API Keys at https://www.algolia.com/account/api-keys/restricted, choose Create API Key, grant search, addObject, deleteObject, and listIndexes ACLs for the intended operations and indices, and copy the secret key string.
        - Enter application_id and secret api_key; leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults.
  operations:
    - name: getObject
      goName: GetObject
      inputType: ObjectInput
      outputType: ObjectRecord
      kind: query
      description: Retrieve one record by its stable object ID.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Algolia returned the record.}
        - {id: missing, goName: Missing, description: No record has the specified object ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Algolia rejected the lookup or key., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Algolia returned malformed or oversized record data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - name: foundDefaultObject
          branch: found
          default: true
          description: Meridian notebook record exists.
          output: {objectID: "product-1", name: "Meridian notebook"}
    - name: listIndices
      goName: ListIndices
      inputType: ListIndicesInput
      outputType: IndexPage
      kind: query
      description: List one bounded page of indices in the Algolia application.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: Algolia returned an index page.}
        - {id: providerRejected, goName: ProviderRejected, description: Algolia rejected the listing or key., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Algolia returned malformed or oversized index data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - name: listedDefaultIndices
          branch: listed
          default: true
          description: Product index has example records.
          output: {items: [{name: products, entries: 42}], nbPages: 1}
    - name: search
      goName: Search
      inputType: SearchInput
      outputType: SearchPage
      kind: query
      description: Search one Algolia index by query phrase.
      idempotency: none
      authorization: required
      branches:
        - {id: searched, goName: Searched, description: "Algolia returned a hit page, possibly empty."}
        - {id: providerRejected, goName: ProviderRejected, description: Algolia rejected the search or key., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Algolia returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async}
      mocks:
        - name: searchedDefaultIndex
          branch: searched
          description: Meridian catalog search finds one product.
          default: true
          output: {nbHits: 1, hits: [{objectID: "product-1", name: "Meridian notebook"}]}
    - name: saveObject
      goName: SaveObject
      inputType: SaveObjectInput
      outputType: SavedObject
      kind: mutation
      description: Replace one record by stable objectID; Algolia queues indexing asynchronously.
      idempotency: required
      authorization: required
      branches:
        - {id: saved, goName: Saved, description: Algolia accepted the replacement task.}
        - {id: providerRejected, goName: ProviderRejected, description: Algolia rejected the record or key., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Algolia returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async}
      mocks:
        - name: savedDefaultObject
          branch: saved
          description: Meridian notebook record is queued for indexing.
          default: true
          output: {objectID: "product-1", taskID: 1514562690001}
    - name: partialUpdateObject
      goName: PartialUpdateObject
      inputType: PartialUpdateObjectInput
      outputType: SavedObject
      kind: mutation
      description: Set selected string attributes of an existing record without replacing other attributes.
      idempotency: required
      authorization: required
      branches:
        - {id: updated, goName: Updated, description: Algolia queued the attribute update.}
        - {id: providerRejected, goName: ProviderRejected, description: Algolia rejected the update or key., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Algolia returned malformed or oversized task data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - name: updatedDefaultObject
          branch: updated
          default: true
          description: One record update is queued.
          output: {objectID: "product-1", taskID: 1514562690002}
    - name: deleteObject
      goName: DeleteObject
      inputType: ObjectInput
      outputType: SavedObject
      kind: mutation
      description: Delete one record by stable object ID; repeated deletion has the same final state.
      idempotency: required
      authorization: required
      branches:
        - {id: deleted, goName: Deleted, description: Algolia queued the deletion task.}
        - {id: providerRejected, goName: ProviderRejected, description: Algolia rejected the deletion or key., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Algolia returned malformed or oversized task data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - name: deletedDefaultObject
          branch: deleted
          default: true
          description: One record deletion is queued.
          output: {objectID: "product-1", taskID: 1514562690003}
