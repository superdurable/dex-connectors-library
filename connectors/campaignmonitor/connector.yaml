apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: campaignmonitor
  displayName: Campaign Monitor
  description: Discover Campaign Monitor clients, lists, subscribers, segments, and campaigns; manage marketing content.
  company: Campaign Monitor
  categories: [marketing]
  version: v0.2.0
spec:
  provider: campaignmonitor
  languages:
    python:
      version: v0.1.0
      operations: [listClients]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-campaignmonitor'
      operations: [listClients]
      triggers: []
  codegen:
    go:
      package: campaignmonitor
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: HTTPS Campaign Monitor API v3.3 root. Blank uses the displayed default; override only for a compatible private test endpoint.
        default: https://api.createsend.com/api/v3.3
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; increase for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum complete API response in bytes. Blank uses the displayed default; increase for accounts with many clients. Oversized responses select invalidResponse.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: campaignmonitor-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret API key. Sign in at https://login.createsend.com/l, then open Profile image > Account settings > API keys. Generate or show and copy the full key; blank makes calls select defect. Rotate it on that page when retired.
    guide:
      startURL: https://login.createsend.com/l
      steps:
        - Sign in to Campaign Monitor at https://login.createsend.com/l as a user with full access and a verified email, open the profile image > Account settings > API keys, then click Show API key or Generate API key. Copy the full value.
        - Save the key in secret api_key. Dex sends it as the HTTP Basic username with a blank password. Rotate it on the same page when access should end.
        - This key is for an account you control. Public integrations should use Campaign Monitor OAuth. Leave baseUrl, timeout, and maxResponseBytes blank for the displayed defaults.
  operations:
    - name: listCampaigns
      goName: ListCampaigns
      inputType: ListCampaignsInput
      outputType: CampaignsPage
      kind: query
      description: List draft, scheduled, or sent campaigns for one client.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Campaign Monitor returned the campaigns.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample draft campaign.
          output: {campaigns: [{id: campaign-1, name: Autumn newsletter, subject: New issue, status: draft}], pageNumber: 1, pageSize: 1, totalRecords: 1, numberOfPages: 1}
    - name: getCampaignSummary
      goName: GetCampaignSummary
      inputType: GetCampaignSummaryInput
      outputType: CampaignSummary
      kind: query
      description: Read sent campaign result counts.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Campaign Monitor returned the summary.}
        - {id: notFound, goName: NotFound, description: Campaign Monitor did not find the campaign., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Sample sent campaign metrics.
          output: {name: Autumn newsletter, recipients: 100, totalOpened: 20, clicks: 5, unsubscribed: 1}
    - name: createDraftCampaign
      goName: CreateDraftCampaign
      inputType: CreateDraftCampaignInput
      outputType: CampaignIdentity
      kind: mutation
      description: Create a draft campaign with hosted HTML and selected recipients.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Campaign Monitor created the draft.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected draft creation., optional: true}
        - {id: uncertain, goName: Uncertain, description: A draft may have been created but cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: Sample draft campaign.
          output: {id: campaign-2, name: Autumn issue}
    - name: sendCampaign
      goName: SendCampaign
      inputType: SendCampaignInput
      outputType: CampaignIdentity
      kind: mutation
      description: Send or schedule an existing draft campaign in the client's timezone.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: sent, goName: Sent, description: Campaign Monitor accepted the campaign send.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the send., optional: true}
        - {id: uncertain, goName: Uncertain, description: The campaign may have sent but cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: sentDefault
          branch: sent
          default: true
          description: Sample accepted campaign send.
          output: {id: campaign-1, name: ""}
    - name: sendCampaignPreview
      goName: SendCampaignPreview
      inputType: SendCampaignPreviewInput
      outputType: CampaignIdentity
      kind: mutation
      description: Send a draft campaign preview to selected addresses.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: sent, goName: Sent, description: Campaign Monitor accepted the preview.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the preview., optional: true}
        - {id: uncertain, goName: Uncertain, description: A preview may have sent but cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: sentDefault
          branch: sent
          default: true
          description: Sample accepted preview.
          output: {id: campaign-1, name: ""}
    - name: unscheduleCampaign
      goName: UnscheduleCampaign
      inputType: UnscheduleCampaignInput
      outputType: CampaignIdentity
      kind: mutation
      description: Move a scheduled campaign back to drafts.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: unscheduled, goName: Unscheduled, description: Campaign Monitor unscheduled the campaign.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected unscheduling., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned an oversized response., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: unscheduledDefault
          branch: unscheduled
          default: true
          description: Sample unscheduled campaign.
          output: {id: campaign-1, name: ""}
    - name: deleteCampaign
      goName: DeleteCampaign
      inputType: DeleteCampaignInput
      outputType: CampaignIdentity
      kind: mutation
      description: Delete a campaign by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Campaign Monitor deleted the campaign.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned an oversized response., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: Sample deleted campaign.
          output: {id: campaign-1, name: ""}
    - name: listSegments
      goName: ListSegments
      inputType: ListSegmentsInput
      outputType: SegmentsList
      kind: query
      description: List segment IDs and names for one subscriber list.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Campaign Monitor returned the list's segments.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected segment discovery., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample segment list.
          output: {segments: [{id: segment-1, listId: list-1, title: Recent readers}]}
    - name: getSegment
      goName: GetSegment
      inputType: GetSegmentInput
      outputType: SegmentProfile
      kind: query
      description: Read a segment's title, list, rules, and active count.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Campaign Monitor returned the segment.}
        - {id: notFound, goName: NotFound, description: Campaign Monitor did not find the segment., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Sample segment.
          output: {id: segment-1, listId: list-1, title: Recent readers, activeSubscribers: 1, ruleGroups: [{rules: [{ruleType: EmailAddress, clause: 'CONTAINS @example.com'}]}]}
    - name: createSegment
      goName: CreateSegment
      inputType: CreateSegmentInput
      outputType: SegmentIdentity
      kind: mutation
      description: Create a segment with optional rule groups.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Campaign Monitor created the segment.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected segment creation., optional: true}
        - {id: uncertain, goName: Uncertain, description: A segment may have been created but cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: Sample created segment.
          output: {id: segment-2, listId: list-1, title: Campaign readers}
    - name: updateSegment
      goName: UpdateSegment
      inputType: UpdateSegmentInput
      outputType: SegmentIdentity
      kind: mutation
      description: Replace a segment's title and optionally its complete rule groups.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Campaign Monitor updated the segment.}
        - {id: notFound, goName: NotFound, description: Campaign Monitor did not find the segment., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned an oversized response., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: Sample updated segment.
          output: {id: segment-1, listId: "", title: Updated readers}
    - name: deleteSegment
      goName: DeleteSegment
      inputType: DeleteSegmentInput
      outputType: SegmentIdentity
      kind: mutation
      description: Delete one segment by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Campaign Monitor deleted the segment.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned an oversized response., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: Sample deleted segment.
          output: {id: segment-1, listId: "", title: ""}
    - name: getList
      goName: GetList
      inputType: GetListInput
      outputType: ListProfile
      kind: query
      description: Read one subscriber list's settings.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Campaign Monitor returned the list.}
        - {id: notFound, goName: NotFound, description: Campaign Monitor did not find the list., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Sample subscriber list settings.
          output: {id: list-1, title: Newsletter, unsubscribeSetting: AllClientLists, confirmedOptIn: false}
    - name: createList
      goName: CreateList
      inputType: CreateListInput
      outputType: ListIdentity
      kind: mutation
      description: Create a subscriber list for one client.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Campaign Monitor created the list.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected list creation., optional: true}
        - {id: uncertain, goName: Uncertain, description: A list may have been created but cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: Sample created list.
          output: {id: list-2, title: Campaign updates}
    - name: updateList
      goName: UpdateList
      inputType: UpdateListInput
      outputType: ListIdentity
      kind: mutation
      description: Replace one list's basic settings without suppression-list scrubbing.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Campaign Monitor updated the list.}
        - {id: notFound, goName: NotFound, description: Campaign Monitor did not find the list., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned an oversized response., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: Sample updated list.
          output: {id: list-1, title: Updated newsletter}
    - name: deleteList
      goName: DeleteList
      inputType: DeleteListInput
      outputType: ListIdentity
      kind: mutation
      description: Delete one subscriber list by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Campaign Monitor deleted the list.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned an oversized response., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: Sample deleted list.
          output: {id: list-1, title: ""}
    - name: listSubscribers
      goName: ListSubscribers
      inputType: ListSubscribersInput
      outputType: SubscribersPage
      kind: query
      description: List one page of subscribers in a selected list state.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Campaign Monitor returned a subscriber page.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the page lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample page of active subscribers.
          output: {subscribers: [{email: subscriber@example.com, name: Sample Subscriber, state: Active}], pageNumber: 1, pageSize: 100, totalRecords: 1, numberOfPages: 1}
    - name: listSubscriberLists
      goName: ListSubscriberLists
      inputType: ListSubscriberListsInput
      outputType: SubscriberLists
      kind: query
      description: List subscriber list IDs and names for one client.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Campaign Monitor returned the client's lists.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the list lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample subscriber list.
          output: {lists: [{id: list-1, name: Newsletter}]}
    - name: getSubscriber
      goName: GetSubscriber
      inputType: GetSubscriberInput
      outputType: SubscriberProfile
      kind: query
      description: Read one subscriber's email, name, and state.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Campaign Monitor returned the subscriber.}
        - {id: notFound, goName: NotFound, description: Campaign Monitor did not find the subscriber., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Sample active subscriber.
          output: {email: member@example.com, name: Member, state: Active}
    - name: upsertSubscriber
      goName: UpsertSubscriber
      inputType: UpsertSubscriberInput
      outputType: SubscriberIdentity
      kind: mutation
      description: Add a subscriber or replace the existing subscriber's name.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: saved, goName: Saved, description: Campaign Monitor queued the subscriber upsert.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the upsert., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: savedDefault
          branch: saved
          default: true
          description: Sample subscriber identity.
          output: {email: member@example.com}
    - name: updateSubscriber
      goName: UpdateSubscriber
      inputType: UpdateSubscriberInput
      outputType: SubscriberIdentity
      kind: mutation
      description: Replace one existing subscriber's name without resubscribing.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Campaign Monitor updated the subscriber.}
        - {id: notFound, goName: NotFound, description: Campaign Monitor did not find the subscriber., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: Sample updated subscriber.
          output: {email: member@example.com}
    - name: deleteSubscriber
      goName: DeleteSubscriber
      inputType: DeleteSubscriberInput
      outputType: SubscriberIdentity
      kind: mutation
      description: Mark one active subscriber deleted in a list.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Campaign Monitor accepted the deletion.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned an oversized response., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: Sample deleted subscriber.
          output: {email: member@example.com}
    - name: listClients
      goName: ListClients
      inputType: ListClientsInput
      outputType: ClientsList
      kind: query
      description: List IDs and names of clients accessible to the Campaign Monitor account.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Campaign Monitor returned the account's clients.}
        - {id: providerRejected, goName: ProviderRejected, description: Campaign Monitor conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Campaign Monitor returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample client is listed.
          output: {clients: [{id: sample-client-id, name: Sample Client}]}
