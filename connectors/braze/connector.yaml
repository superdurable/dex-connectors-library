apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: braze
  displayName: Braze
  description: Manage Braze users, discover marketing objects, and trigger targeted campaign or Canvas sends.
  company: Braze
  categories: [marketing]
  version: v0.2.0
spec:
  provider: braze
  languages:
    python:
      version: v0.1.0
      package: dex-connector-braze
      operations: [getUserProfile]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-braze"
      operations: [getUserProfile]
      triggers: []
  codegen:
    go:
      package: braze
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        required: true
        description: Your account's HTTPS REST endpoint from Braze Dashboard > Settings > APIs and Identifiers > API Keys > REST Endpoint, such as https://rest.iad-01.braze.com. This non-secret endpoint is required; blank prevents calls.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow profile exports.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete response in bytes as a positive integer. Blank uses the displayed default; increase for known larger selected profiles.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: braze-rest-api-key
    fields:
      - name: rest_api_key
        goName: RESTAPIKey
        type: secretString
        required: true
        description: Secret REST API key from Braze Dashboard > Settings > APIs and Identifiers > API Keys. Select permissions for the operations you use; targeted sends also require campaigns.trigger.send or canvas.trigger.send. Blank prevents calls. Dex sends it only as a Bearer token.
    guide:
      startURL: https://www.braze.com/docs/api/basics
      steps:
        - Sign in to your Braze Dashboard and open Settings > APIs and Identifiers > API Keys. Create or select a REST API key with users.export.ids, users.track, users.delete, campaigns.list, canvas.list, segments.list, campaigns.trigger.send, or canvas.trigger.send permissions for the operations you use; copy its secret value into rest_api_key. Restrict and revoke it on that page.
        - On the same API Keys page, find the account REST Endpoint and enter its complete HTTPS URL in baseUrl. Each Braze account has its own endpoint. Leave timeout and maxResponseBytes blank for their displayed defaults.
        - Find an external user ID in Braze Dashboard > Audience > Search Users or your application's user ID records. Enter that non-secret ID as externalId; blank is invalid. The query exports only external_id, braze_id, first_name, last_name, and email.
  operations:
    - name: triggerCampaignSend
      goName: TriggerCampaignSend
      inputType: TriggerCampaignSendInput
      outputType: TargetedSendResult
      kind: mutation
      description: Trigger an API-enabled campaign for one existing external user ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: sent, goName: Sent, description: Braze accepted the targeted campaign dispatch.}
        - {id: providerRejected, goName: ProviderRejected, description: Braze conclusively rejected the dispatch., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The campaign may have been dispatched after the send cap., optional: true}
      mocks:
        - name: sentDefault
          branch: sent
          default: true
          description: Sample campaign dispatch.
          output: {dispatchId: sample-dispatch-1}
    - name: triggerCanvasSend
      goName: TriggerCanvasSend
      inputType: TriggerCanvasSendInput
      outputType: TargetedSendResult
      kind: mutation
      description: Trigger an API-enabled Canvas for one existing external user ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: sent, goName: Sent, description: Braze accepted the targeted Canvas dispatch.}
        - {id: providerRejected, goName: ProviderRejected, description: Braze conclusively rejected the dispatch., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The Canvas may have been dispatched after the send cap., optional: true}
      mocks:
        - name: sentDefault
          branch: sent
          default: true
          description: Sample Canvas dispatch.
          output: {dispatchId: sample-dispatch-2}
    - name: updateUserProfile
      goName: UpdateUserProfile
      inputType: UpdateUserProfileInput
      outputType: UserWriteResult
      kind: mutation
      description: Set selected absolute profile attributes for an external user ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: accepted, goName: Accepted, description: Braze queued the profile update.}
        - {id: providerRejected, goName: ProviderRejected, description: Braze conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Braze returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: acceptedDefault
          branch: accepted
          default: true
          description: Braze queued the profile update.
          output: {externalId: sample-user-1}
    - name: deleteUserProfile
      goName: DeleteUserProfile
      inputType: DeleteUserProfileInput
      outputType: UserDeleteResult
      kind: mutation
      description: Queue deletion of one profile by external user ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Braze queued the user deletion.}
        - {id: providerRejected, goName: ProviderRejected, description: Braze conclusively rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Braze returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: Braze queued the deletion.
          output: {externalId: sample-user-1, deleted: 1}
    - name: listCampaigns
      goName: ListCampaigns
      inputType: ListCampaignsInput
      outputType: CampaignsList
      kind: query
      description: List one page of campaign IDs and names.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Braze returned campaign identities.}
        - {id: providerRejected, goName: ProviderRejected, description: Braze conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Braze returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample campaign page is returned.
          output: {campaigns: [{id: sample-campaign-1, name: Sample campaign}]}
    - name: listCanvases
      goName: ListCanvases
      inputType: ListCanvasesInput
      outputType: CanvasesList
      kind: query
      description: List one page of Canvas IDs and names.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Braze returned Canvas identities.}
        - {id: providerRejected, goName: ProviderRejected, description: Braze conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Braze returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample Canvas page is returned.
          output: {canvases: [{id: sample-canvas-1, name: Sample Canvas}]}
    - name: listSegments
      goName: ListSegments
      inputType: ListSegmentsInput
      outputType: SegmentsList
      kind: query
      description: List one page of segment IDs, names, and analytics tracking settings.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Braze returned segment identities.}
        - {id: providerRejected, goName: ProviderRejected, description: Braze conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Braze returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample segment page is returned.
          output: {segments: [{id: sample-segment-1, name: Sample segment, analyticsTrackingEnabled: true}]}
    - name: getUserProfile
      goName: GetUserProfile
      inputType: GetUserProfileInput
      outputType: UserProfile
      kind: query
      description: Read one user's external ID, Braze ID, name, and email if present.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Braze returned the user profile.}
        - {id: notFound, goName: NotFound, description: Braze returned no user for the external ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Braze conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Braze returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample user profile is returned.
          output: {externalId: sample-user-1, brazeId: sample-braze-1, firstName: Avery, lastName: Reader, email: reader@example.com}
        - name: userMissing
          branch: notFound
          description: The requested user is absent.
          failure: {kind: NOT_FOUND, message: Braze did not find the user.}
