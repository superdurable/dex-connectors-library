apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: drip
  displayName: Drip
  description: Discover Drip accounts and subscribers, and inspect or manage email series campaigns.
  company: Drip
  categories: [marketing]
  version: v0.2.0
spec:
  provider: drip
  languages:
    python:
      version: v0.1.0
      operations: [listAccounts, getSubscriber]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-drip'
      operations: [listAccounts, getSubscriber]
      triggers: []
  codegen:
    go:
      package: drip
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: HTTPS Drip API v2 root. Blank uses the displayed default; override only for a compatible private test endpoint.
        default: https://api.getdrip.com/v2
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; increase for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum complete API response in bytes. Blank uses the displayed default; increase for accounts with many records. Oversized responses select invalidResponse.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: drip-personal-api-token
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret personal API Token from https://www.getdrip.com/user/edit after signing in. Copy the full token into this field; blank makes calls select defect. Revoke or rotate the token in Drip account settings.
    guide:
      startURL: https://www.getdrip.com/user/edit
      steps:
        - Sign in to Drip and open your user profile at https://www.getdrip.com/user/edit. Find the personal API Token and copy its full value.
        - Save the token in secret api_key. Dex sends it as the HTTP Basic username with a blank password. Revoke or rotate the token in Drip when retired.
        - This token is for a private integration you control. Public integrations use Drip OAuth. Leave baseUrl, timeout, and maxResponseBytes blank for displayed defaults.
  operations:
    - name: listCampaigns
      goName: ListCampaigns
      inputType: ListCampaignsInput
      outputType: CampaignsPage
      kind: query
      description: List one page of email series campaign names and statuses.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Drip returned a campaign page.}
        - {id: providerRejected, goName: ProviderRejected, description: Drip conclusively denied campaign listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Drip returned malformed or oversized campaign data., optional: true}
        - {id: defect, goName: Defect, description: Invalid account or list options or credentials., optional: true}
      mocks:
        - {name: listedCampaigns, branch: listed, description: One email series campaign was listed., default: true, output: {campaigns: [{id: '123456', name: Welcome Series, status: active}], page: 1, totalPages: 1, totalCount: 1}}
    - name: getCampaign
      goName: GetCampaign
      inputType: CampaignIdentityInput
      outputType: CampaignMetadata
      kind: query
      description: Read one email series campaign's identity, name, and status.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Drip returned the campaign.}
        - {id: notFound, goName: NotFound, description: No campaign has this ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Drip conclusively denied campaign retrieval., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Drip returned malformed or oversized campaign data., optional: true}
        - {id: defect, goName: Defect, description: Invalid account or campaign ID or credentials., optional: true}
      mocks:
        - {name: foundCampaign, branch: found, description: One email series campaign was returned., default: true, output: {id: '123456', name: Welcome Series, status: active}}
    - name: activateCampaign
      goName: ActivateCampaign
      inputType: CampaignIdentityInput
      outputType: CampaignState
      kind: mutation
      description: Ensure an email series campaign is active; a repeated activation confirms state by reading the campaign.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: active, goName: Active, description: The campaign is active.}
        - {id: providerRejected, goName: ProviderRejected, description: Drip conclusively rejected activation., optional: true}
        - {id: defect, goName: Defect, description: Invalid account or campaign ID or credentials., optional: true}
      mocks:
        - {name: activeCampaign, branch: active, description: The email series campaign is active., default: true, output: {id: '123456', status: active}}
    - name: pauseCampaign
      goName: PauseCampaign
      inputType: CampaignIdentityInput
      outputType: CampaignState
      kind: mutation
      description: Ensure an email series campaign is paused; a repeated pause confirms state by reading the campaign.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: paused, goName: Paused, description: The campaign is paused.}
        - {id: providerRejected, goName: ProviderRejected, description: Drip conclusively rejected pausing., optional: true}
        - {id: defect, goName: Defect, description: Invalid account or campaign ID or credentials., optional: true}
      mocks:
        - {name: pausedCampaign, branch: paused, description: The email series campaign is paused., default: true, output: {id: '123456', status: paused}}
    - name: listAccounts
      goName: ListAccounts
      inputType: ListAccountsInput
      outputType: AccountsList
      kind: query
      description: List IDs and names of Drip accounts accessible to the token.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Drip returned accessible accounts.}
        - {id: providerRejected, goName: ProviderRejected, description: Drip conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Drip returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample account is listed.
          output: {accounts: [{id: '9999999', name: Sample Account}]}
    - name: getSubscriber
      goName: GetSubscriber
      inputType: GetSubscriberInput
      outputType: SubscriberMetadata
      kind: query
      description: Read one subscriber's ID, email, first name, last name, and status from a Drip account.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Drip returned the selected subscriber.}
        - {id: notFound, goName: NotFound, description: No active subscriber matches this ID or email in the selected account., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Drip conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Drip returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or unavailable credentials., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample subscriber is returned.
          output: {id: sample-subscriber-id, email: 'ada@example.com', firstName: Ada, lastName: Lovelace, status: active}
    - name: listSubscribers
      goName: ListSubscribers
      inputType: ListSubscribersInput
      outputType: SubscribersPage
      kind: query
      description: Read one bounded page of subscriber identities and statuses.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Drip returned a subscriber page.}
        - {id: providerRejected, goName: ProviderRejected, description: Drip conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Drip returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or unavailable credentials., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample subscriber is listed.
          output: {subscribers: [{id: sample-subscriber-id, email: 'ada@example.com', firstName: Ada, lastName: Lovelace, status: active}]}
    - name: upsertSubscriber
      goName: UpsertSubscriber
      inputType: UpsertSubscriberInput
      outputType: SubscriberMetadata
      kind: mutation
      description: Create or update one subscriber by email using Drip's upsert endpoint.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: upserted, goName: Upserted, description: Drip returned the created or updated subscriber.}
        - {id: providerRejected, goName: ProviderRejected, description: Drip conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Drip returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or unavailable credentials., optional: true}
      mocks:
        - name: upsertedDefault
          branch: upserted
          default: true
          description: One sample subscriber is upserted.
          output: {id: sample-subscriber-id, email: 'ada@example.com', firstName: Ada, lastName: Lovelace, status: active}
    - name: deleteSubscriber
      goName: DeleteSubscriber
      inputType: DeleteSubscriberInput
      outputType: DeletedSubscriber
      kind: mutation
      description: Permanently delete one subscriber by ID or email.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Drip deleted the subscriber or it was already absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Drip conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Drip returned an oversized response., optional: true}
        - {id: defect, goName: Defect, description: Invalid input or unavailable credentials., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: One sample subscriber is deleted.
          output: {deleted: true}
