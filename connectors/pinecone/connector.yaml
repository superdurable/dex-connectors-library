apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: pinecone
  displayName: Pinecone
  description: Pinecone REST connector for bounded vector and namespace operations.
  company: Pinecone
  categories: [ai, databases-storage]
  version: v0.3.0
spec:
  provider: pinecone
  languages:
    python:
      version: v0.1.0
      operations: [upsertVectors, queryVectors]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-pinecone'
      operations: [upsertVectors, queryVectors]
      triggers: []
  codegen:
    go:
      package: pinecone
  configuration:
    fields:
    - name: baseUrl
      goName: BaseURL
      type: url
      description: Index host from https://app.pinecone.io > your project > Indexes
        > the index's HOST value, prefixed with https://, such as https://docs-example-abc123.svc.us-east1-gcp.pinecone.io;
        no trailing slash. Required for this connection.
      required: true
    - name: timeout
      goName: Timeout
      type: duration
      description: Maximum time for one HTTP request as a positive Go duration such
        as 15s or 1m; blank uses the displayed default.
      default: 15s
    - name: maxResponseBytes
      goName: MaxResponseBytes
      type: integer
      description: Maximum response body size in bytes; enter a positive integer to
        raise the safety limit for large pages. Blank uses the displayed default.
      default: 2097152
  auth:
    type: apiKey
    connectionKind: pinecone-api-key
    fields:
    - name: api_key
      goName: APIKey
      type: secretString
      description: Secret Pinecone credential. Start at https://app.pinecone.io and
        follow the authorization guide to create or find it; paste the token exactly,
        without Bearer. Blank prevents calls. It is sent only in a request header.
      required: true
    guide:
      startURL: https://app.pinecone.io
      steps:
      - Open https://app.pinecone.io, select your project, then open API keys and
        create or copy a key.
      - Open Indexes, select the target index, and copy its unique HTTPS host into
        baseUrl; do not use the control-plane API host.
      - Paste the key into secret api_key; leave timeout and maxResponseBytes blank
        for their displayed defaults.
  operations:
  - name: fetchVectors
    goName: FetchVectors
    inputType: FetchVectorsInput
    outputType: FetchedVectors
    kind: query
    description: Fetch selected vector IDs from one namespace.
    idempotency: none
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: fetched, goName: Fetched, description: Selected vectors were fetched.}
    - {id: providerRejected, goName: ProviderRejected, description: Pinecone rejected the fetch., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Pinecone returned invalid JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    mocks:
    - {name: defaultFetch, branch: fetched, description: One sample fetched vector., default: true, output: {vectors: [{id: vec-meridian, values: [0.1, 0.2]}], namespace: example}}
  - name: listVectorIDs
    goName: ListVectorIDs
    inputType: ListVectorIDsInput
    outputType: VectorIDPage
    kind: query
    description: List one page of vector IDs in a serverless index namespace.
    idempotency: none
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: listed, goName: Listed, description: Vector IDs were listed.}
    - {id: providerRejected, goName: ProviderRejected, description: Pinecone rejected the list., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Pinecone returned invalid JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    mocks:
    - {name: defaultList, branch: listed, description: One sample ID page., default: true, output: {ids: [vec-meridian], nextToken: ''}}
  - name: describeIndexStats
    goName: DescribeIndexStats
    inputType: DescribeIndexStatsInput
    outputType: IndexStats
    kind: query
    description: Read vector counts and dimension for the configured index.
    idempotency: none
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: described, goName: Described, description: Index statistics were read.}
    - {id: providerRejected, goName: ProviderRejected, description: Pinecone rejected the read., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Pinecone returned invalid JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    mocks:
    - {name: defaultStats, branch: described, description: Sample index statistics., default: true, output: {dimension: 2, totalVectorCount: 1}}
  - name: updateVector
    goName: UpdateVector
    inputType: UpdateVectorInput
    outputType: VectorAction
    kind: mutation
    description: Replace one vector's values and set named metadata fields.
    idempotency: required
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: updated, goName: Updated, description: The vector was updated.}
    - {id: providerRejected, goName: ProviderRejected, description: Pinecone rejected the update., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Pinecone returned invalid JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    mocks:
    - {name: defaultUpdate, branch: updated, description: One sample vector was updated., default: true, output: {ids: [vec-meridian], namespace: example}}
  - name: deleteVectors
    goName: DeleteVectors
    inputType: DeleteVectorsInput
    outputType: VectorAction
    kind: mutation
    description: Delete selected vector IDs from one namespace.
    idempotency: required
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: deleted, goName: Deleted, description: Selected vectors were deleted.}
    - {id: providerRejected, goName: ProviderRejected, description: Pinecone rejected the deletion., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Pinecone returned invalid JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    mocks:
    - {name: defaultDelete, branch: deleted, description: Sample vector IDs were deleted., default: true, output: {ids: [vec-meridian], namespace: example}}
  - name: clearNamespace
    goName: ClearNamespace
    inputType: ClearNamespaceInput
    outputType: VectorAction
    kind: mutation
    description: Delete all vectors from an explicitly named namespace.
    idempotency: required
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: cleared, goName: Cleared, description: The namespace was cleared.}
    - {id: providerRejected, goName: ProviderRejected, description: Pinecone rejected the clear., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Pinecone returned invalid JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    mocks:
    - {name: defaultClear, branch: cleared, description: A sample namespace was cleared., default: true, output: {namespace: example}}
  - name: upsertVectors
    goName: UpsertVectors
    inputType: UpsertVectorsInput
    outputType: UpsertVectorsOutput
    kind: mutation
    description: Upsert vector IDs by absolute replacement in one namespace.
    idempotency: required
    authorization: required
    branches:
    - id: upserted
      goName: Upserted
      description: Upsert vector IDs by absolute replacement in one namespace.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request or credentials.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: defaultUpsertVectors
      branch: upserted
      description: A representative provider response for the example resource.
      default: true
      output:
        upsertedCount: 1
  - name: queryVectors
    goName: QueryVectors
    inputType: QueryVectorsInput
    outputType: QueryVectorsOutput
    kind: query
    description: Find nearest vectors in one namespace.
    idempotency: none
    authorization: required
    branches:
    - id: queried
      goName: Queried
      description: Find nearest vectors in one namespace.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request or credentials.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: defaultQueryVectors
      branch: queried
      description: A representative provider response for the example resource.
      default: true
      output:
        data:
          matches:
          - id: vec-meridian
            score: 0.98
          namespace: example
