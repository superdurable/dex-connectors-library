          branch: found
          description: "A sample user found result."
          default: true
          output: {id: 7, name: Sample Editor, slug: sample-editor}
    - name: listUsers
      goName: ListUsers
      inputType: ListUsersInput
      outputType: UserPage
      kind: query
      description: "ListUsers through the WordPress REST API."
      idempotency: none
      authorization: required
      branches:
