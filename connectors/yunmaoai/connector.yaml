apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: yunmaoai
  displayName: YunMao AI
  description: List model IDs available through the YunMao AI API.
  company: YunMao AI
  categories: [ai, developer-tools]
  version: v0.1.0
spec:
  provider: yunmaoai
  codegen:
    go:
      package: yunmaoai
  configuration:
    fields:
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API model-list HTTP request as a positive Go duration such as 5s or 1m. Blank uses the displayed default; increase only for a slow approved network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum model-list response size in bytes as a positive integer. Blank uses the displayed default; increase only if the provider adds more model metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: yunmaoai-api-key
    fields:
      - name: apiKey
        goName: APIKey
        type: secretString
        required: true
        description: Secret 云猫 Key from https://api.yunmaoai.com/sign-up. Register, open the console 令牌 or API 密钥 page, create and copy a Key into Dex Connections; blank prevents requests.
    guide:
      startURL: https://yunmaoai.com/docs.html
      steps:
        - Register at https://api.yunmaoai.com/sign-up, open the console 令牌 or API 密钥 page, create a Key, and copy its secret into Dex Connections. Blank prevents requests.
        - Start ListModels with {}. The connector calls the fixed 云猫 HTTPS API and returns at most the first 50 model IDs. It does not call inference or expose model metadata. Leave timeout and maxResponseBytes blank for displayed defaults.
        - The Key controls which models are listed. Manage or revoke it in the same console 令牌 or API 密钥 page. The list does not guarantee each model is currently callable.
  operations:
    - name: listModels
      goName: ListModels
      inputType: ListModelsInput
      outputType: ListModelsOutput
      kind: query
      description: List up to 50 model IDs enabled for the API Key.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: YunMaoAI returned the available model list.}
        - {id: providerRejected, goName: ProviderRejected, description: YunMaoAI rejected the Key or request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: YunMaoAI returned malformed or oversized model data., optional: true}
        - {id: defect, goName: Defect, description: The local API Key is invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: oneModel
          branch: found
          description: One available API model ID.
          default: true
          output: {total: 1, modelIDs: [deepseek-v4.1-flash]}
        - name: noModels
          branch: found
          description: No models are enabled for the Key.
          output: {total: 0, modelIDs: []}
