apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: oppo
  displayName: OPPO Push
  description: Read today's OPPO Push sending quota for an application.
  company: oppo
  categories: [developer-tools]
  version: v0.1.0
spec:
  provider: oppo
  codegen:
    go:
      package: oppo
  configuration:
    fields:
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of each OPPO Push HTTP request as a positive Go duration such as 5s or 1m. Blank uses the displayed default; increase only for a slow approved network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum auth or quota response size in bytes as a positive integer. Blank uses the displayed default; increase only if provider metadata grows.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: oppo-push-secret
    fields:
      - name: appKey
        goName: AppKey
        type: secretString
        required: true
        description: Secret AppKey from https://push.oppo.com/ > Applications > select the application > AppKey. Copy its exact value; blank prevents requests.
      - name: masterSecret
        goName: MasterSecret
        type: secretString
        required: true
        description: Secret MasterSecret from https://push.oppo.com/ > Applications > select the application > MasterSecret. Copy its exact value; blank prevents requests.
    guide:
      startURL: https://open.oppomobile.com/newservice/capability?pagename=push
      steps:
        - Sign in at https://push.oppo.com/, open Applications and select your approved Push application. Copy its AppKey and MasterSecret into Dex Connections; both are secrets and blank prevents requests.
        - Run GetPushQuota to read today's total, sent, and remaining push counts. The operation has no input. A Push application with no quota may return zero counts.
        - The connector signs a short-lived auth request with SHA-256 and exchanges it for an auth_token, then uses that token only in the quota request header. Leave timeout and maxResponseBytes blank for the displayed defaults.
  operations:
    - name: getPushQuota
      goName: GetPushQuota
      inputType: GetPushQuotaInput
      outputType: GetPushQuotaOutput
      kind: query
      description: Read today's total, sent, and remaining OPPO Push message counts.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: OPPO returned today's quota.}
        - {id: providerRejected, goName: ProviderRejected, description: OPPO rejected authentication or quota query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: OPPO returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local credentials are missing or invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: quota
          branch: found
          description: An example daily Push quota.
          default: true
          output: {totalCount: 100000, pushCount: 10000, remainCount: 90000}
