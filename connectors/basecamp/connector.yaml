          output: {id: '789', subject: Example Message, status: active}
    - name: createMessage
      goName: CreateMessage
      inputType: CreateMessageInput
      outputType: Message
      kind: mutation
      description: Create a message as a draft or published post.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Basecamp returned the requested result.}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp rejected the request., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: Creation cannot be confirmed after the send cap., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: Basecamp returned the requested result.
          output: {id: '789', subject: Example Message, status: drafted}
    - name: updateMessage
      goName: UpdateMessage
      inputType: UpdateMessageInput
      outputType: Message
      kind: mutation
      description: Replace a message's subject and content.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Basecamp returned the requested result.}
        - {id: notFound, goName: NotFound, description: The message does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Basecamp returned invalid message JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: Basecamp returned the requested result.
          output: {id: '789', subject: Example Message, status: active}
    - name: publishMessage
      goName: PublishMessage
      inputType: GetMessageInput
      outputType: Message
      kind: mutation
      description: Publish a draft message once.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: published, goName: Published, description: Basecamp returned the requested result.}
        - {id: notFound, goName: NotFound, description: The message does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Basecamp returned invalid message JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
