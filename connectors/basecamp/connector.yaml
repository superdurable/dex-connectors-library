apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: basecamp
  displayName: Basecamp
  description: Read and manage Basecamp projects and to-dos.
  company: Basecamp
  categories: [project-management]
  version: v0.3.0
spec:
  provider: basecamp
  languages:
    python:
      version: v0.2.0
      operations: [listAccounts]
      triggers: []
    typescript:
      version: v0.2.0
      package: '@superdurable/connector-basecamp'
      operations: [listAccounts]
      triggers: []
  codegen:
    go:
      package: basecamp
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Basecamp authorization API HTTPS origin. Blank uses the displayed provider endpoint; override only for a trusted test gateway.
        default: https://launchpad.37signals.com
      - name: apiBaseUrl
        goName: APIBaseURL
        type: url
        description: Basecamp 3 API HTTPS origin. Blank uses the displayed provider endpoint; override only for a trusted test gateway.
        default: https://3.basecampapi.com
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; increase only for a slow gateway.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum complete JSON response in bytes. Blank uses the displayed default; increase only for unusually large people or resource pages.
        default: 1048576
  auth:
    type: oauth2
    refreshable: true
    connectionKind: basecamp-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        required: true
        description: Non-secret Client ID from https://launchpad.37signals.com/integrations > your integration. Blank prevents authorization or refresh.
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        required: true
        description: Secret Client Secret from https://launchpad.37signals.com/integrations > your integration. Save only in Dex; blank prevents authorization or refresh.
      - name: access_token
        goName: AccessToken
        type: secretString
        required: true
        description: Secret Bearer token supplied by Basecamp consent and rotated by Dex. Never enter it manually; blank requires authorization.
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        required: true
        description: Secret refresh token supplied by Basecamp consent and rotated by Dex. Never enter it manually; blank requires reauthorization.
    guide:
      startURL: https://launchpad.37signals.com/integrations
      steps:
        - Sign in at https://launchpad.37signals.com/integrations and register or select an integration for the Basecamp account you will manage.
        - Register the exact OAuth Redirect URL displayed by Dex Web. Dex requests read scope; Launchpad uses account consent and may ignore that scope parameter.
        - Copy the Client ID and secret into Dex Web and authorize an identity with access to the desired accounts. Dex stores access and refresh tokens; do not paste them into fields.
        - Leave baseUrl, apiBaseUrl, timeout, and maxResponseBytes blank for their displayed defaults. First list accounts, then use an account ID for projects and to-dos.
        - For project changes, open https://3.basecamp.com > your account > Projects. Use the numeric account ID from listAccounts and project ID from a project's URL or listProjects. Supply a non-blank project name; description is non-secret text and blank clears it on update. Archive, restore, and trash use the selected project ID. Trashing may permanently delete a project on plans without an archive/trash period.
        - For to-dos, open https://3.basecamp.com > your account > project > To-dos > to-do list. Use the numeric account ID from listAccounts and the to-do list or to-do ID in the selected page URL or API result. A non-blank content title is required; description is rich text, dates are YYYY-MM-DD, and person IDs come from People. Blank optional dates or description clear them on replacement; empty assignee and subscriber lists clear them. Basecamp PUT replaces all editable fields, so supply the full current state from getTodo when updating. Completion and trash actions use the to-do ID; reposition requires a positive position and optional same-project parent ID.
        - For to-do lists, open https://3.basecamp.com > your account > project > To-dos. Use the numeric to-do set ID from getProject's dock or the Basecamp API, and the selected list ID from its URL or listTodoLists. Name is non-blank; description is non-secret rich text and blank clears it on update. Position is one-based among incomplete lists. Trashing uses the list's recording ID.
        - For people, open https://3.basecamp.com > your account > People or a project > People. Use the numeric account, project, and person IDs from listAccounts, listProjects, and listPeople or their page URLs. Project grant and revoke require an existing person ID; enrollment requires a non-blank name and email address, optionally project IDs, and can send an invitation email. Blank project IDs enroll only at account level; notify omitted uses Basecamp's invitation default, and false suppresses new invitation emails. Email is personal data, not a credential; some profiles redact it for non-admin callers.
        - For messages, open https://3.basecamp.com > your account > project > Message Board. Use the numeric message board ID from getProject's dock and message ID from the selected message URL or listMessages. Subject is a non-blank title; content is non-secret rich text and blank clears it on update. Create defaults to a draft; publish true posts immediately. Omitted subscribers use Basecamp's all-project default, while an explicit empty list subscribes no one. Publishing a draft notifies its subscribers once; pin, unpin, and trash use the message recording ID.
    oauth2:
      authorizationEndpoint: https://launchpad.37signals.com/authorization/new
      tokenEndpoint: https://launchpad.37signals.com/authorization/token
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [read]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      tokenEndpointAuthMethod: client_secret_post
      pkce: false
      refresh:
        tokenExchangeTimeout: 15s
        missingExpiry: reject
        storedMissingExpiry: refresh
        terminalErrorCodes: [invalid_grant, invalid_client, unauthorized_client]
  operations:
    - name: createProject
      goName: CreateProject
      inputType: CreateProjectInput
      outputType: Project
      kind: mutation
      description: Create a Basecamp project with a name and optional description.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Basecamp created the project.}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp conclusively rejected creation., optional: true}
        - {id: defect, goName: Defect, description: Project input or credentials are invalid., optional: true}
        - {id: uncertain, goName: Uncertain, description: The outcome cannot be confirmed after the send cap., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: A project was created., output: {id: '123', name: Example Project}}
    - name: updateProject
      goName: UpdateProject
      inputType: UpdateProjectInput
      outputType: Project
      kind: mutation
      description: Replace a project's name and description.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Basecamp updated the project.}
        - {id: notFound, goName: NotFound, description: The project does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Basecamp returned unusable project JSON., optional: true}
        - {id: defect, goName: Defect, description: Project input or credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: A project was updated., output: {id: '123', name: Example Project}}
    - name: archiveProject
      goName: ArchiveProject
      inputType: GetProjectInput
      outputType: ProjectActionResult
      kind: mutation
      description: Archive a Basecamp project.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: archived, goName: Archived, description: Basecamp archived the project.}
        - {id: notFound, goName: NotFound, description: The project does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp conclusively rejected archiving., optional: true}
        - {id: defect, goName: Defect, description: IDs or credentials are invalid., optional: true}
      mocks:
        - {name: archivedDefault, branch: archived, default: true, description: A project was archived., output: {projectId: '123', status: archived}}
    - name: unarchiveProject
      goName: UnarchiveProject
      inputType: GetProjectInput
      outputType: ProjectActionResult
      kind: mutation
      description: Restore a Basecamp project to active status.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: active, goName: Active, description: Basecamp restored the project.}
        - {id: notFound, goName: NotFound, description: The project does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp conclusively rejected restoring., optional: true}
        - {id: defect, goName: Defect, description: IDs or credentials are invalid., optional: true}
      mocks:
        - {name: activeDefault, branch: active, default: true, description: A project is active., output: {projectId: '123', status: active}}
    - name: trashProject
      goName: TrashProject
      inputType: GetProjectInput
      outputType: ProjectActionResult
      kind: mutation
      description: Trash a Basecamp project.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: trashed, goName: Trashed, description: Basecamp trashed the project.}
        - {id: notFound, goName: NotFound, description: The project does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp conclusively rejected trashing., optional: true}
        - {id: defect, goName: Defect, description: IDs or credentials are invalid., optional: true}
      mocks:
        - {name: trashedDefault, branch: trashed, default: true, description: A project was trashed., output: {projectId: '123', status: trashed}}
    - name: listProjects
      goName: ListProjects
      inputType: ListProjectsInput
      outputType: ProjectsPage
      kind: query
      description: List active projects visible in one Basecamp account.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Basecamp returned the projects.}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Basecamp returned malformed or oversized project JSON., optional: true}
        - {id: defect, goName: Defect, description: Account ID or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One project is visible.
          output: {projects: [{id: '123', name: Example Project}]}
    - name: getProject
      goName: GetProject
      inputType: GetProjectInput
      outputType: Project
      kind: query
      description: Read one Basecamp project.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Basecamp returned the project.}
        - {id: notFound, goName: NotFound, description: The project does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Basecamp returned malformed or oversized project JSON., optional: true}
        - {id: defect, goName: Defect, description: IDs or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One project exists.
          output: {id: '123', name: Example Project}
    - name: listMessages
      goName: ListMessages
      inputType: ListMessagesInput
      outputType: MessagesPage
      kind: query
      description: List active messages on one message board.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Basecamp returned the requested result.}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Basecamp returned invalid message JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Basecamp returned the requested result.
          output: {messages: [{id: '789', subject: Example Message, status: active}]}
    - name: getMessage
      goName: GetMessage
      inputType: GetMessageInput
      outputType: Message
      kind: query
      description: Read one Basecamp message.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Basecamp returned the requested result.}
        - {id: notFound, goName: NotFound, description: The message does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Basecamp rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Basecamp returned invalid message JSON., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
