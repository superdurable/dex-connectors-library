apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: iterable
  displayName: Iterable
  description: Read and manage Iterable users, events, and list membership.
  company: Iterable
  categories: [marketing]
  version: v0.2.0
spec:
  provider: iterable
  languages:
    python:
      version: v0.1.0
      package: dex-connector-iterable
      operations: [getUser]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-iterable"
      operations: [getUser]
      triggers: []
  codegen:
    go:
      package: iterable
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Iterable API root as an absolute HTTPS URL. Blank uses the displayed US data center endpoint; choose https://api.eu.iterable.com/api for an EU project. Override only for the matching data center or a trusted local test gateway.
        default: https://api.iterable.com/api
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow user reads.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete user response in bytes as a positive integer. Blank uses the displayed default; increase for large user profiles.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: iterable-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret Iterable Server-side API key from Integrations > API Keys > New API Key in the selected project. Copy the complete opaque value when shown; blank prevents calls. Dex sends it only in the Api-Key header. Match the key's data center to baseUrl.
    guide:
      startURL: https://app.iterable.com
      steps:
        - Sign in to the Iterable project as an org admin or member with Manage Integrations permission. Open Integrations > API Keys > New API Key, name the key, choose Server-side, and click Create. Copy the complete opaque key from Copy Your New API Key, which is shown only once, into the secret api_key field in Dex Web. To revoke it later, use Integrations > API Keys > Disable Key or Delete Key. Blank is invalid.
        - Match baseUrl to the project's data center. Leave it blank for US or enter https://api.eu.iterable.com/api for EU. Leave timeout and maxResponseBytes blank for their displayed defaults. Find the user's non-secret email in Iterable Audience > Users and enter it as the getUser email; blank is invalid.
  operations:
    - name: trackEvent
      goName: TrackEvent
      inputType: TrackEventInput
      outputType: UserWriteResult
      kind: mutation
      description: Track one Iterable custom event with a stable event ID for retry deduplication.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: tracked, goName: Tracked, description: Iterable accepted the event.}
        - {id: providerRejected, goName: ProviderRejected, description: Iterable conclusively rejected the event., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Iterable returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: trackedDefault, branch: tracked, default: true, description: An event was accepted., output: {accepted: true}}
    - name: subscribeUserToList
      goName: SubscribeUserToList
      inputType: SubscribeUserToListInput
      outputType: UserWriteResult
      kind: mutation
      description: Add an Iterable user to a static list.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: subscribed, goName: Subscribed, description: Iterable accepted the list subscription.}
        - {id: providerRejected, goName: ProviderRejected, description: Iterable conclusively rejected the subscription., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Iterable returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: subscribedDefault, branch: subscribed, default: true, description: A user was subscribed., output: {accepted: true}}
    - name: unsubscribeUserFromList
      goName: UnsubscribeUserFromList
      inputType: UnsubscribeUserFromListInput
      outputType: UserWriteResult
      kind: mutation
      description: Remove an Iterable user from a static list.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: unsubscribed, goName: Unsubscribed, description: Iterable accepted the list unsubscription.}
        - {id: providerRejected, goName: ProviderRejected, description: Iterable conclusively rejected the unsubscription., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Iterable returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: unsubscribedDefault, branch: unsubscribed, default: true, description: A user was unsubscribed., output: {accepted: true}}
    - name: upsertUser
      goName: UpsertUser
      inputType: UpsertUserInput
      outputType: UserWriteResult
      kind: mutation
      description: Create or update an Iterable user by email or user ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Iterable accepted the user update.}
        - {id: providerRejected, goName: ProviderRejected, description: Iterable conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Iterable returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: A user profile was updated., output: {accepted: true}}
    - name: deleteUser
      goName: DeleteUser
      inputType: DeleteUserInput
      outputType: UserWriteResult
      kind: mutation
      description: Delete an Iterable user identified by email or user ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Iterable accepted the deletion.}
        - {id: notFound, goName: NotFound, description: Iterable did not find the user., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Iterable conclusively rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Iterable returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: A user was deleted., output: {accepted: true}}
    - name: getUserByID
      goName: GetUserByID
      inputType: GetUserByIDInput
      outputType: UserIdentity
      kind: query
      description: Read one user's email and ID by their stable Iterable user ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Iterable returned the user.}
        - {id: notFound, goName: NotFound, description: Iterable did not expose the user., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Iterable conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Iterable returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: A user was found by ID., output: {email: user@example.com, userId: example-user-id}}
    - name: getUser
      goName: GetUser
      inputType: GetUserInput
      outputType: UserIdentity
      kind: query
      description: Read one user's email and optional user ID without returning profile data fields.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Iterable returned the user.}
        - {id: notFound, goName: NotFound, description: Iterable did not expose the user., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Iterable conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Iterable returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One example user is returned.
          output: {email: user@example.com, userId: example-user-id}
