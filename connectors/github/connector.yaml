    - name: createIssue
      goName: CreateIssue
      inputType: CreateIssueInput
      outputType: CreatedIssue
      kind: mutation
      description: Create one issue in a public or private repository with a title, Markdown body, labels, and assignees, on a github-oauth-repository connection. GitHub has no idempotency key, so the body carries a hidden marker derived from the Call ID; after an unknown outcome a retry lists the repository's newest issues by the connection's account and returns the marked issue instead of creating another, and resends only while the send cap allows.
      idempotency: required
      authorization: required
      branches:
        - {id: created, goName: Created, description: "GitHub created the issue, or an earlier attempt of this Step already had and read-back found it."}
        - {id: insufficientScope, goName: InsufficientScope, description: "The connection does not use the github-oauth-repository method, or GitHub forbade the write, such as an archived repository, missing issue access, or an organization's OAuth App restriction; nothing was created.", optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked; nothing was created., optional: true}
        - {id: notFound, goName: NotFound, description: The repository was not found or the connection cannot reach it; nothing was created., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "GitHub conclusively rejected the issue, such as a repository with issues disabled or an invalid assignee; nothing was created.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "The issue may exist but read-back could not confirm it after the send cap was reached; the Value echoes the requested repository and title for reconciliation.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      # GitHub has no idempotency key; the shared fence needs durable sync heartbeats across attempts.
      execution:
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
        repeatOnUnknown: limited
        maxSends: 3
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 0, totalDuration: 65m}
      mocks:
        - name: bugReportCreated
          branch: created
          description: GitHub creates a labeled, assigned bug report issue.
          default: true
          output: {owner: octocat, repository: hello-world, title: Crash when saving an empty draft, number: 42, id: 2876543210, nodeId: I_kwDOAbCdEs6rdmCq, url: "https://github.com/octocat/hello-world/issues/42", state: open, createdAt: "2026-03-07T10:15:00Z", labels: [bug], assignees: [octocat]}
        - name: rateLimited
