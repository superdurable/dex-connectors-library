          description: "The repository was not found or the connection cannot reach it."
          output: {owner: octocat, repository: missing-repository, title: Crash when saving an empty draft}
          failure: {kind: NOT_FOUND, message: "The repository was not found or the connection cannot reach it."}
        - name: issuesDisabledRejection
          branch: providerRejected
          description: "GitHub rejects the issue because the repository has issues disabled."
          output: {owner: octocat, repository: hello-world, title: Crash when saving an empty draft}
          failure: {kind: PROVIDER_REJECTION, message: "GitHub rejected the issue with HTTP 410."}
        - name: createOutcomeUnknown
          description: Every possible send ended without a confirmed issue, so read-back could not find the marked issue.
          uncertain: {output: {owner: octocat, repository: hello-world, title: Crash when saving an empty draft}, failure: {kind: AVAILABILITY, message: GitHub issue creation outcome is unknown.}}
