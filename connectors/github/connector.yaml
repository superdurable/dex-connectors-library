apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: github
  displayName: GitHub
  description: Read an authenticated GitHub profile, verified primary email, bounded public repositories, and bounded public repository changes.
  company: GitHub
  version: v0.9.0
spec:
  provider: github
  codegen:
    go:
      package: githubconnector
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: GitHub REST API base URL; leave blank for GitHub.com. Enter the absolute HTTPS API URL only when this connector explicitly supports the selected GitHub Enterprise host.
        required: false
        default: https://api.github.com
      - name: apiVersion
        goName: APIVersion
        type: string
        description: YYYY-MM-DD value sent as the X-GitHub-Api-Version header; leave blank for the connector-tested version and change only after verifying provider compatibility.
        required: false
        default: "2026-03-10"
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration for one GitHub HTTP request, using a positive Go duration such as 15s or 1m; leave blank for the displayed default.
        required: false
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum bytes accepted from one GitHub response; enter a positive integer only to change the safety limit. Oversized responses select invalidResponse.
        required: false
        default: 2097152
      - name: defaultRepositoryLimit
        goName: DefaultRepositoryLimit
        type: integer
        description: Positive repository count used when an invocation omits its limit; leave blank for the displayed default and keep it no greater than maxRepositories.
        required: false
        default: 100
      - name: maxRepositories
        goName: MaxRepositories
        type: integer
        description: Positive hard limit on public repositories returned by one invocation; increase only after accounting for provider pagination and Flow payload size.
        required: false
        default: 500
      - name: maxPullRequestBodyCharacters
        goName: MaxPullRequestBodyCharacters
        type: integer
        description: Positive number of Unicode characters retained from each merged pull request body; longer bodies are truncated to this safety limit.
        required: false
        default: 4000
      - name: maxPatchCharacters
        goName: MaxPatchCharacters
        type: integer
        description: Positive number of Unicode characters retained from each changed-file patch; longer patches are truncated to this safety limit.
        required: false
        default: 4000
      - name: maxCommitMessageCharacters
        goName: MaxCommitMessageCharacters
        type: integer
        description: Positive number of Unicode characters retained from each commit message; longer messages are truncated to this safety limit.
        required: false
        default: 4000
  auth:
    type: oauth2
    connectionKind: github-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        description: Non-secret OAuth App client ID copied from https://github.com/settings/developers after opening OAuth Apps > the selected app; blank means authorization and refresh cannot start.
        required: true
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        description: Secret copied or regenerated under https://github.com/settings/developers > OAuth Apps > the selected app > Client secrets; store it only in this credential field and blank means authorization and refresh cannot start.
        required: true
      - name: access_token
        goName: AccessToken
        type: secretString
        description: Secret GitHub OAuth access token produced automatically after authorization and refreshed before expiry when GitHub returns expiration metadata; do not copy or enter a personal access token here.
        required: true
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        description: Secret rotating refresh token returned when GitHub supports the requested offline_access capability; Dex stores each replacement atomically, and blank means the provider issued a non-expiring token or reauthorization is required after an expiring token fails.
        required: false
    guide:
      startURL: https://github.com/settings/developers
      steps:
        - Open Settings > Developer settings > OAuth Apps and choose New OAuth App or select the existing app for this Dex connection.
        - Set Authorization callback URL to the exact Redirect URI shown below, then register or update the OAuth app.
        - Copy Client ID, generate a new client secret if needed, and paste both below; the client secret is sensitive.
        - Dex requests offline_access with read:user and user:email so GitHub.com returns an eight-hour access token and rotating refresh token; GitHub Enterprise Server may instead return a non-expiring token without refresh material.
    oauth2:
      protocol: oauth2
      authorizationEndpoint: https://github.com/login/oauth/authorize
      tokenEndpoint: https://github.com/login/oauth/access_token
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [read:user, user:email, offline_access]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      pkce: true
  operations:
    - name: getAuthenticatedProfile
      goName: GetAuthenticatedProfile
      inputType: GetAuthenticatedProfileInput
      outputType: AuthenticatedProfile
      kind: query
      description: Read the authenticated account and its primary verified email.
      idempotency: none
      authorization: required
      branches:
        - {id: profileLoaded, goName: ProfileLoaded, description: The authenticated profile and primary verified email were loaded.}
        - {id: verifiedEmailRequired, goName: VerifiedEmailRequired, description: A primary verified email was not available., optional: true}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The authenticated account was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: GitHub conclusively rejected the profile query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized profile response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &githubQueryExecution
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m}
    - name: listPublicRepositories
      goName: ListPublicRepositories
      inputType: ListPublicRepositoriesInput
      outputType: PublicRepositories
      kind: query
      description: List a bounded, recent-first set of public repositories owned by one login.
      idempotency: none
      authorization: required
      branches:
        - {id: repositoriesLoaded, goName: RepositoriesLoaded, description: Public repositories were loaded and bounded.}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The requested GitHub account was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: GitHub conclusively rejected the repository query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized repository response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *githubQueryExecution
    - name: listMergedPullRequests
      goName: ListMergedPullRequests
      inputType: ListMergedPullRequestsInput
      outputType: MergedPullRequestPage
      kind: query
      description: List one bounded page of pull requests merged into a public repository within a time window.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: One bounded page of merged pull requests was loaded.}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The requested GitHub resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "GitHub conclusively rejected the search, including a repository it cannot search.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized search response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &githubChangeQueryExecution
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 65m}
    - name: listPullRequestFiles
      goName: ListPullRequestFiles
      inputType: ListPullRequestFilesInput
      outputType: PullRequestFilePage
      kind: query
      description: List one bounded page of files changed by a public repository pull request.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: One bounded page of changed files was loaded.}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The repository or pull request was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: GitHub conclusively rejected the changed-file query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized changed-file response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *githubChangeQueryExecution
    - name: listCommits
      goName: ListCommits
      inputType: ListCommitsInput
      outputType: CommitPage
      kind: query
      description: List one bounded page of public repository commits within a time window.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "One bounded page of commits was loaded; an empty repository has no commits."}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The repository or starting ref was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: GitHub conclusively rejected the commit query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized commit response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *githubChangeQueryExecution
