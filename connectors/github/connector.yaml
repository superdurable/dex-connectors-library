apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: github
  displayName: GitHub
  description: Read an authenticated GitHub profile, verified primary email, bounded public repositories, releases, and repository changes.
  company: GitHub
  version: v0.21.0
spec:
  provider: github
  codegen:
    go:
      package: github
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: GitHub REST API base URL; leave blank for GitHub.com. Enter the absolute HTTPS API URL only when this connector explicitly supports the selected GitHub Enterprise host.
        required: false
        default: https://api.github.com
      - name: apiVersion
        goName: APIVersion
        type: string
        description: YYYY-MM-DD value sent as the X-GitHub-Api-Version header; leave blank for the connector-tested version and change only after verifying provider compatibility.
        required: false
        default: "2026-03-10"
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration for one GitHub HTTP request, using a positive Go duration such as 15s or 1m; leave blank for the displayed default.
        required: false
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum bytes accepted from one GitHub response; enter a positive integer only to change the safety limit. Oversized responses select invalidResponse.
        required: false
        default: 2097152
      - name: defaultRepositoryLimit
        goName: DefaultRepositoryLimit
        type: integer
        description: Positive repository count used when an invocation omits its limit; leave blank for the displayed default and keep it no greater than maxRepositories.
        required: false
        default: 100
      - name: maxRepositories
        goName: MaxRepositories
        type: integer
        description: Positive hard limit on public repositories returned by one invocation; increase only after accounting for provider pagination and Flow payload size.
        required: false
        default: 500
      - name: maxPullRequestBodyCharacters
        goName: MaxPullRequestBodyCharacters
        type: integer
        description: Positive number of Unicode characters retained from each merged pull request body; longer bodies are truncated to this safety limit.
        required: false
        default: 4000
      - name: maxPatchCharacters
        goName: MaxPatchCharacters
        type: integer
        description: Positive number of Unicode characters retained from each changed-file patch; longer patches are truncated to this safety limit.
        required: false
        default: 4000
      - name: maxCommitMessageCharacters
        goName: MaxCommitMessageCharacters
        type: integer
        description: Positive number of Unicode characters retained from each commit message; longer messages are truncated to this safety limit.
        required: false
        default: 4000
  auth:
    refreshable: true
    type: oauth2
    connectionKind: github-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        description: Non-secret OAuth App client ID copied from https://github.com/settings/developers after opening OAuth Apps > the selected app; blank means authorization and refresh cannot start.
        required: true
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        description: Secret copied or regenerated under https://github.com/settings/developers > OAuth Apps > the selected app > Client secrets; store it only in this credential field and blank means authorization and refresh cannot start.
        required: true
      - name: access_token
        goName: AccessToken
        type: secretString
        description: Secret GitHub OAuth access token produced automatically after authorization and refreshed before expiry when GitHub returns expiration metadata; do not copy or enter a personal access token here.
        required: true
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        description: Secret rotating refresh token returned when GitHub supports the requested offline_access capability; Dex stores each replacement atomically, and blank means the provider issued a non-expiring token or reauthorization is required after an expiring token fails.
        required: false
    guide:
      startURL: https://github.com/settings/developers
      steps:
        - Open Settings > Developer settings > OAuth Apps and choose New OAuth App or select the existing app for this Dex connection.
        - Set Authorization callback URL to the exact Redirect URI shown below, then register or update the OAuth app.
        - Copy Client ID, generate a new client secret if needed, and paste both below; the client secret is sensitive.
        - Dex requests offline_access with read:user and user:email so GitHub.com returns an eight-hour access token and rotating refresh token; GitHub Enterprise Server may instead return a non-expiring token without refresh material.
    oauth2:
      protocol: oauth2
      authorizationEndpoint: https://github.com/login/oauth/authorize
      tokenEndpoint: https://github.com/login/oauth/access_token
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [read:user, user:email, offline_access]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      pkce: true
  operations:
    - name: getAuthenticatedProfile
      goName: GetAuthenticatedProfile
      inputType: GetAuthenticatedProfileInput
      outputType: AuthenticatedProfile
      kind: query
      description: Read the authenticated account and its primary verified email.
      idempotency: none
      authorization: required
      branches:
        - {id: profileLoaded, goName: ProfileLoaded, description: The authenticated profile and primary verified email were loaded.}
        - {id: verifiedEmailRequired, goName: VerifiedEmailRequired, description: A primary verified email was not available., optional: true}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The authenticated account was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: GitHub conclusively rejected the profile query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized profile response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &githubQueryExecution
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m}
      mocks:
        - name: octocatProfile
          branch: profileLoaded
          description: The authenticated account with a primary verified email and every optional profile field.
          default: true
          output: {subject: "583231", login: octocat, name: The Octocat, verifiedEmail: octocat@example.com, avatarUrl: "https://avatars.example.com/u/583231", profileUrl: "https://github.com/octocat", company: "@github", blogUrl: "https://github.blog", location: San Francisco, bio: Mascot, twitterUsername: github, publicRepos: 8, followers: 9000, following: 9, createdAt: "2011-01-25T18:44:36Z", updatedAt: "2026-02-01T10:00:00Z"}
        - name: rateLimited
          description: GitHub's secondary rate limit throttles the read once.
          retry: {failure: {kind: RATE_LIMIT, message: GitHub rate limit was reached.}, after: 1s}
        - name: verifiedEmailRequiredFailure
          branch: verifiedEmailRequired
          description: "A primary verified email was not available."
          failure: {kind: AUTHENTICATION, message: "A primary verified email was not available."}
        - name: insufficientScopeFailure
          branch: insufficientScope
          description: "The OAuth grant does not match the required scopes."
          failure: {kind: AUTHORIZATION, message: "The OAuth grant does not match the required scopes."}
        - name: authorizationRevokedFailure
          branch: authorizationRevoked
          description: "The OAuth grant is invalid or revoked."
          failure: {kind: AUTHENTICATION, message: "The OAuth grant is invalid or revoked."}
        - name: notFoundFailure
          branch: notFound
          description: "The authenticated account was not found."
          failure: {kind: NOT_FOUND, message: "The authenticated account was not found."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "GitHub conclusively rejected the profile query."
          failure: {kind: PROVIDER_REJECTION, message: "GitHub conclusively rejected the profile query."}
        - name: invalidResponseFailure
          branch: invalidResponse
          description: "GitHub returned an invalid or oversized profile response."
          failure: {kind: PROTOCOL, message: "GitHub returned an invalid or oversized profile response."}
        - name: defectFailure
          branch: defect
          description: "Local input, connection configuration, or connector definition is invalid."
          failure: {kind: VALIDATION, message: "Local input, connection configuration, or connector definition is invalid."}
    - name: listPublicRepositories
      goName: ListPublicRepositories
      inputType: ListPublicRepositoriesInput
      outputType: PublicRepositories
      kind: query
      description: List a bounded, recent-first set of public repositories owned by one login.
      idempotency: none
      authorization: required
      branches:
        - {id: repositoriesLoaded, goName: RepositoriesLoaded, description: Public repositories were loaded and bounded.}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The requested GitHub account was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: GitHub conclusively rejected the repository query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized repository response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *githubQueryExecution
      mocks:
        - name: mixedRepositories
          branch: repositoriesLoaded
          description: A truncated recent-first set with a fork, an archived repository, and a disabled one that applications usually filter out.
          default: true
          output: {repositories: [{id: 1296269, name: hello-world, fullName: octocat/hello-world, description: My first repository., profileUrl: "https://github.com/octocat/hello-world", language: Go, topics: [example, dex], fork: false, archived: false, disabled: false, stargazersCount: 80, forksCount: 9, openIssuesCount: 2, pushedAt: "2026-03-01T12:00:00Z"}, {id: 1300192, name: spoon-knife, fullName: octocat/spoon-knife, fork: true, archived: false, disabled: false, stargazersCount: 12, forksCount: 0, openIssuesCount: 0, pushedAt: "2026-02-20T08:30:00Z"}, {id: 1400300, name: old-site, fullName: octocat/old-site, fork: false, archived: true, disabled: false, stargazersCount: 3, forksCount: 1, openIssuesCount: 0, pushedAt: "2019-05-04T00:00:00Z"}, {id: 1500400, name: suspended, fullName: octocat/suspended, fork: false, archived: false, disabled: true, stargazersCount: 0, forksCount: 0, openIssuesCount: 0}], truncated: true}
        - name: noRepositories
          branch: repositoriesLoaded
          description: The login owns no public repositories.
          output: {repositories: [], truncated: false}
        - name: rateLimited
          description: GitHub's secondary rate limit throttles the listing once.
          retry: {failure: {kind: RATE_LIMIT, message: GitHub rate limit was reached.}, after: 1s}
        - name: insufficientScopeFailure
          branch: insufficientScope
          description: "The OAuth grant does not match the required scopes."
          failure: {kind: AUTHORIZATION, message: "The OAuth grant does not match the required scopes."}
        - name: authorizationRevokedFailure
          branch: authorizationRevoked
          description: "The OAuth grant is invalid or revoked."
          failure: {kind: AUTHENTICATION, message: "The OAuth grant is invalid or revoked."}
        - name: notFoundFailure
          branch: notFound
          description: "The requested GitHub account was not found."
          failure: {kind: NOT_FOUND, message: "The requested GitHub account was not found."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "GitHub conclusively rejected the repository query."
          failure: {kind: PROVIDER_REJECTION, message: "GitHub conclusively rejected the repository query."}
        - name: invalidResponseFailure
          branch: invalidResponse
          description: "GitHub returned an invalid or oversized repository response."
          failure: {kind: PROTOCOL, message: "GitHub returned an invalid or oversized repository response."}
        - name: defectFailure
          branch: defect
          description: "Local input, connection configuration, or connector definition is invalid."
          failure: {kind: VALIDATION, message: "Local input, connection configuration, or connector definition is invalid."}
    - name: listMergedPullRequests
      goName: ListMergedPullRequests
      inputType: ListMergedPullRequestsInput
      outputType: MergedPullRequestPage
      kind: query
      description: List one bounded page of pull requests merged into a public repository within a time window.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: One bounded page of merged pull requests was loaded.}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The requested GitHub resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "GitHub conclusively rejected the search, including a repository it cannot search.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized search response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &githubChangeQueryExecution
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 65m}
      pagination: {inputField: page, nextField: nextPage}
      mocks:
        - name: threeUnorderedPages
          branch: listed
          description: Three pages in GitHub search order, not merge order, with a pull request repeated across a page boundary and merges exactly at both window edges.
          default: true
          pages:
            - {pullRequests: [{number: 42, title: Add release notes, bodyTruncated: false, url: "https://github.com/octocat/hello-world/pull/42", authorLogin: octocat, mergedAt: "2026-03-03T10:00:00Z", labels: [docs]}, {number: 40, title: Fix flaky test, body: The retry waited too long., bodyTruncated: false, authorLogin: hubot, mergedAt: "2026-03-01T00:00:00Z"}], totalCount: 5, incompleteResults: false, nextPage: 2}
            - {pullRequests: [{number: 40, title: Fix flaky test, body: The retry waited too long., bodyTruncated: false, authorLogin: hubot, mergedAt: "2026-03-01T00:00:00Z"}, {number: 45, title: Bump dependencies, bodyTruncated: false, authorLogin: dependabot, mergedAt: "2026-03-07T23:59:59Z", labels: [dependencies]}], totalCount: 5, incompleteResults: false, nextPage: 3}
            - {pullRequests: [{number: 38, title: Rewrite the README, body: A long body, bodyTruncated: true, authorLogin: octocat, mergedAt: "2026-03-05T16:20:00Z"}], totalCount: 5, incompleteResults: false, nextPage: 0}
        - name: noMerges
          branch: listed
          description: No pull request merged in the window.
          output: {pullRequests: [], totalCount: 0, incompleteResults: false, nextPage: 0}
        - name: incompleteSearch
          branch: listed
          description: GitHub search timed out and returned a partial page.
          output: {pullRequests: [{number: 42, title: Add release notes, bodyTruncated: false, mergedAt: "2026-03-03T10:00:00Z"}], totalCount: 7, incompleteResults: true, nextPage: 0}
        - name: rateLimited
          description: GitHub's search rate limit throttles the listing and asks for a wait.
          retry: {failure: {kind: RATE_LIMIT, message: GitHub search rate limit was reached.}, after: 30s}
        - name: insufficientScopeFailure
          branch: insufficientScope
          description: "The OAuth grant does not match the required scopes."
          failure: {kind: AUTHORIZATION, message: "The OAuth grant does not match the required scopes."}
        - name: authorizationRevokedFailure
          branch: authorizationRevoked
          description: "The OAuth grant is invalid or revoked."
          failure: {kind: AUTHENTICATION, message: "The OAuth grant is invalid or revoked."}
        - name: notFoundFailure
          branch: notFound
          description: "The requested GitHub resource was not found."
          failure: {kind: NOT_FOUND, message: "The requested GitHub resource was not found."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "GitHub conclusively rejected the search, including a repository it cannot search."
          failure: {kind: PROVIDER_REJECTION, message: "GitHub conclusively rejected the search, including a repository it cannot search."}
        - name: invalidResponseFailure
          branch: invalidResponse
          description: "GitHub returned an invalid or oversized search response."
          failure: {kind: PROTOCOL, message: "GitHub returned an invalid or oversized search response."}
        - name: defectFailure
          branch: defect
          description: "Local input, connection configuration, or connector definition is invalid."
          failure: {kind: VALIDATION, message: "Local input, connection configuration, or connector definition is invalid."}
    - name: listPullRequestFiles
      goName: ListPullRequestFiles
      inputType: ListPullRequestFilesInput
      outputType: PullRequestFilePage
      kind: query
      description: List one bounded page of files changed by a public repository pull request.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: One bounded page of changed files was loaded.}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The repository or pull request was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: GitHub conclusively rejected the changed-file query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized changed-file response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *githubChangeQueryExecution
      pagination: {inputField: page, nextField: nextPage}
      mocks:
        - name: threePagesOfChanges
          branch: listed
          description: Three pages of added, modified, renamed, and removed files, with a truncated patch and a binary file without a patch.
          default: true
          pages:
            - {files: [{filename: README.md, status: modified, additions: 3, deletions: 1, changes: 4, patch: "@@ -1 +1,3 @@", patchTruncated: false}, {filename: docs/guide.md, previousFilename: docs/old-guide.md, status: renamed, additions: 0, deletions: 0, changes: 0, patchTruncated: false}], nextPage: 2}
            - {files: [{filename: logo.png, status: added, additions: 0, deletions: 0, changes: 0, patchTruncated: false}, {filename: main.go, status: modified, additions: 400, deletions: 120, changes: 520, patch: "@@ -1,120 +1,400 @@", patchTruncated: true}], nextPage: 3}
            - {files: [{filename: legacy.go, status: removed, additions: 0, deletions: 80, changes: 80, patchTruncated: false}], nextPage: 0}
        - name: rateLimited
          description: GitHub's rate limit throttles the listing once.
          retry: {failure: {kind: RATE_LIMIT, message: GitHub rate limit was reached.}, after: 1s}
        - name: insufficientScopeFailure
          branch: insufficientScope
          description: "The OAuth grant does not match the required scopes."
          failure: {kind: AUTHORIZATION, message: "The OAuth grant does not match the required scopes."}
        - name: authorizationRevokedFailure
          branch: authorizationRevoked
          description: "The OAuth grant is invalid or revoked."
          failure: {kind: AUTHENTICATION, message: "The OAuth grant is invalid or revoked."}
        - name: notFoundFailure
          branch: notFound
          description: "The repository or pull request was not found."
          failure: {kind: NOT_FOUND, message: "The repository or pull request was not found."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "GitHub conclusively rejected the changed-file query."
          failure: {kind: PROVIDER_REJECTION, message: "GitHub conclusively rejected the changed-file query."}
        - name: invalidResponseFailure
          branch: invalidResponse
          description: "GitHub returned an invalid or oversized changed-file response."
          failure: {kind: PROTOCOL, message: "GitHub returned an invalid or oversized changed-file response."}
        - name: defectFailure
          branch: defect
          description: "Local input, connection configuration, or connector definition is invalid."
          failure: {kind: VALIDATION, message: "Local input, connection configuration, or connector definition is invalid."}
    - name: listReleases
      goName: ListReleases
      inputType: ListReleasesInput
      outputType: ReleasePage
      kind: query
      description: List one bounded page of repository releases with publication dates, notes, draft and prerelease flags, and a next-page cursor. GitHub does not support a publication-date filter; callers filter PublishedAt and follow pagination without assuming publication order.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "One bounded page of releases was loaded, possibly empty."}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The repository was not found or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: GitHub conclusively rejected the releases query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized releases response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *githubChangeQueryExecution
      pagination: {inputField: page, nextField: nextPage}
      mocks:
        - name: threeUnorderedPages
          branch: listed
          description: Three pages in GitHub order, not publication order, with a draft, a prerelease, a release repeated across a page boundary, and one published outside a typical window.
          default: true
          pages:
            - {releases: [{id: 300, tagName: v1.3.0, name: v1.3.0, url: "https://github.com/octocat/hello-world/releases/tag/v1.3.0", body: Faster startup., bodyTruncated: false, isDraft: false, isPrerelease: false, createdAt: "2026-03-05T09:00:00Z", publishedAt: "2026-03-05T09:30:00Z"}, {id: 310, tagName: v1.4.0-rc.1, bodyTruncated: false, isDraft: false, isPrerelease: true, createdAt: "2026-03-06T09:00:00Z", publishedAt: "2026-03-06T09:05:00Z"}], nextPage: 2}
            - {releases: [{id: 310, tagName: v1.4.0-rc.1, bodyTruncated: false, isDraft: false, isPrerelease: true, createdAt: "2026-03-06T09:00:00Z", publishedAt: "2026-03-06T09:05:00Z"}, {id: 320, tagName: v1.4.0, bodyTruncated: false, isDraft: true, isPrerelease: false, createdAt: "2026-03-07T09:00:00Z"}], nextPage: 3}
            - {releases: [{id: 200, tagName: v1.2.0, name: v1.2.0, body: A long list of changes, bodyTruncated: true, isDraft: false, isPrerelease: false, createdAt: "2025-11-01T09:00:00Z", publishedAt: "2025-11-02T09:00:00Z"}, {id: 290, tagName: v1.2.9, bodyTruncated: false, isDraft: false, isPrerelease: false, createdAt: "2026-03-01T00:00:00Z", publishedAt: "2026-03-01T00:00:00Z"}], nextPage: 0}
        - name: noReleases
          branch: listed
          description: The repository has no releases.
          output: {releases: [], nextPage: 0}
        - name: rateLimited
          description: GitHub's rate limit throttles the listing once.
          retry: {failure: {kind: RATE_LIMIT, message: GitHub rate limit was reached.}, after: 1s}
        - name: insufficientScopeFailure
          branch: insufficientScope
          description: "The OAuth grant does not match the required scopes."
          failure: {kind: AUTHORIZATION, message: "The OAuth grant does not match the required scopes."}
        - name: authorizationRevokedFailure
          branch: authorizationRevoked
          description: "The OAuth grant is invalid or revoked."
          failure: {kind: AUTHENTICATION, message: "The OAuth grant is invalid or revoked."}
        - name: notFoundFailure
          branch: notFound
          description: "The repository was not found or is inaccessible."
          failure: {kind: NOT_FOUND, message: "The repository was not found or is inaccessible."}
        - name: providerRejectedFailure
          branch: providerRejected
          description: "GitHub conclusively rejected the releases query."
          failure: {kind: PROVIDER_REJECTION, message: "GitHub conclusively rejected the releases query."}
        - name: invalidResponseFailure
          branch: invalidResponse
          description: "GitHub returned an invalid or oversized releases response."
          failure: {kind: PROTOCOL, message: "GitHub returned an invalid or oversized releases response."}
        - name: defectFailure
          branch: defect
          description: "Local input, connection configuration, or connector definition is invalid."
          failure: {kind: VALIDATION, message: "Local input, connection configuration, or connector definition is invalid."}
    - name: listCommits
      goName: ListCommits
      inputType: ListCommitsInput
      outputType: CommitPage
      kind: query
      description: List one bounded page of public repository commits within a time window.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "One bounded page of commits was loaded; an empty repository has no commits."}
        - {id: insufficientScope, goName: InsufficientScope, description: The OAuth grant does not match the required scopes., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OAuth grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The repository or starting ref was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: GitHub conclusively rejected the commit query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: GitHub returned an invalid or oversized commit response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *githubChangeQueryExecution
      pagination: {inputField: page, nextField: nextPage}
      mocks:
        - name: threePagesNewestFirst
          branch: listed
          description: Three pages newest first, with a commit repeated across a page boundary as new commits shift pages, a truncated message, and a commit without a GitHub author.
