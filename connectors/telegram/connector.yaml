      outputType: ChatActionResult
      kind: mutation
      description: Replace a chat's title.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Telegram confirmed the title.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the action., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: "Local chat ID, title, or credentials are invalid.", optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: The chat title was updated.
          output: {chatId: "-1001234567890"}
    - name: sendAnimation
      goName: SendAnimation
      inputType: SendAnimationInput
      outputType: SentMessage
      kind: mutation
      description: Send animation to one bot-accessible chat with a bounded resend cap.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: sent, goName: Sent, description: Telegram confirmed the sent message identity.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the send., optional: true}
        - {id: uncertain, goName: Uncertain, description: The send outcome remained unknown after the cap., optional: true}
        - {id: defect, goName: Defect, description: "Input, bot token, or dispatch checkpoint is invalid.", optional: true}
      mocks:
        - name: sentDefault
          branch: sent
          default: true
          description: Example animation was sent.
          output: {chatId: -1001234567890, messageId: 53, date: 1794110000}
    - name: sendAudio
      goName: SendAudio
      inputType: SendAudioInput
      outputType: SentMessage
      kind: mutation
      description: Send audio to one bot-accessible chat with a bounded resend cap.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: sent, goName: Sent, description: Telegram confirmed the sent message identity.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the send., optional: true}
        - {id: uncertain, goName: Uncertain, description: The send outcome remained unknown after the cap., optional: true}
        - {id: defect, goName: Defect, description: "Input, bot token, or dispatch checkpoint is invalid.", optional: true}
      mocks:
        - name: sentDefault
          branch: sent
          default: true
          description: Example audio was sent.
          output: {chatId: -1001234567890, messageId: 53, date: 1794110000}
    - name: sendDocument
      goName: SendDocument
