apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: telegram
  displayName: Telegram Bot
  description: Read and manage chats, and send text messages through a Telegram bot.
  company: Telegram
  categories: [communication]
  version: v0.2.0
spec:
  provider: telegram
  languages:
    python:
      version: v0.1.0
      operations: [sendMessage, getChat]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-telegram'
      operations: [sendMessage, getChat]
      triggers: []
  codegen:
    go:
      package: telegram
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Telegram Bot API HTTPS base URL, normally https://api.telegram.org. Blank uses the displayed default; override only for a trusted local Bot API server.
        default: https://api.telegram.org
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one Bot API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; raise only for a slow local Bot API server.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum Telegram JSON response in bytes as a positive integer. Blank uses the displayed default; raise only if chat metadata exceeds it.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: telegram-bot-token
    fields:
      - name: bot_token
        goName: BotToken
        type: secretString
        description: Secret bot token from https://t.me/BotFather > /newbot or /mybots > your bot > API Token; use the full numeric-ID:secret token. Blank prevents calls. Store only in Dex credentials and revoke through BotFather if exposed.
        required: true
    guide:
      startURL: https://core.telegram.org/bots/tutorial
      steps:
        - Open https://t.me/BotFather in Telegram, send /newbot, choose a bot name and username ending in bot, and copy the full numeric-ID:secret token shown once.
        - For an existing bot, open BotFather > /mybots > your bot > API Token. Save the token only in bot_token, never in Flow input. Use BotFather to revoke and replace a leaked token.
        - Add the bot to the target chat and grant access needed to read its metadata or send text. Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults.
  operations:
    - name: answerCallbackQuery
      goName: AnswerCallbackQuery
      inputType: AnswerCallbackQueryInput
      outputType: AnsweredQuery
      kind: mutation
      description: Acknowledge a callback query and optionally show a notification.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: answered, goName: Answered, description: Telegram confirmed the callback answer.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the answer., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: "Local query ID, text, or credentials are invalid.", optional: true}
      mocks:
        - name: answeredDefault
          branch: answered
          default: true
          description: The callback was acknowledged.
          output: {answered: true}
    - name: answerInlineQuery
      goName: AnswerInlineQuery
      inputType: AnswerInlineQueryInput
      outputType: AnsweredQuery
      kind: mutation
      description: Send up to 50 JSON inline results for an inline query.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: answered, goName: Answered, description: Telegram confirmed the inline answer.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the answer., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: "Local query ID, results JSON, or credentials are invalid.", optional: true}
      mocks:
        - name: answeredDefault
          branch: answered
          default: true
          description: The inline query was answered.
          output: {answered: true}
    - name: getFile
      goName: GetFile
      inputType: GetFileInput
      outputType: TelegramFile
      kind: query
      description: Read Telegram file metadata without constructing a token-bearing download URL.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Telegram returned file metadata.}
        - {id: notFound, goName: NotFound, description: Telegram did not recognize the file ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local file ID or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Telegram returned one file's metadata.
          output: {fileId: "ABC123", fileUniqueId: "UNIQUE123", fileSize: 1024, filePath: "documents/example.pdf"}
    - name: getChatAdministrators
      goName: GetChatAdministrators
      inputType: GetChatInput
      outputType: ChatAdministrators
      kind: query
      description: Read administrator user IDs and statuses without profile details.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Telegram returned the administrators.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local chat ID or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One administrator is returned.
          output: {administrators: [{userId: 42, status: administrator}]}
    - name: getChatMember
      goName: GetChatMember
      inputType: GetChatMemberInput
      outputType: ChatMemberSummary
      kind: query
      description: Read a member's numeric user ID and status.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Telegram returned the member.}
        - {id: notFound, goName: NotFound, description: Telegram could not find the member., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local chat or member ID or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One member is returned.
          output: {userId: 42, status: member}
    - name: leaveChat
      goName: LeaveChat
      inputType: GetChatInput
      outputType: ChatActionResult
      kind: mutation
      description: Leave a group, supergroup, or channel accessible to the bot.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: left, goName: Left, description: Telegram confirmed the bot left the chat.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the action., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local chat ID or credentials are invalid., optional: true}
      mocks:
        - name: leftDefault
          branch: left
          default: true
          description: The bot left the chat.
          output: {chatId: "-1001234567890"}
    - name: setChatDescription
      goName: SetChatDescription
      inputType: SetChatDescriptionInput
      outputType: ChatActionResult
      kind: mutation
      description: Replace a chat's description.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Telegram confirmed the description.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the action., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: "Local chat ID, description, or credentials are invalid.", optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: The chat description was updated.
          output: {chatId: "-1001234567890"}
    - name: setChatTitle
      goName: SetChatTitle
      inputType: SetChatTitleInput
      outputType: ChatActionResult
      kind: mutation
      description: Replace a chat's title.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Telegram confirmed the title.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the action., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: "Local chat ID, title, or credentials are invalid.", optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: The chat title was updated.
          output: {chatId: "-1001234567890"}
    - name: sendMessage
      goName: SendMessage
      inputType: SendMessageInput
      outputType: SentMessage
      kind: mutation
      description: Send one text message to a chat. If Telegram does not confirm the outcome, check the chat before sending again.
      idempotency: required
      authorization: required
      branches:
        - {id: sent, goName: Sent, description: Telegram created the message and returned its ID.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the send before creating a message., optional: true}
        - {id: uncertain, goName: Uncertain, description: The request may have reached Telegram but no message ID was confirmed; do not resend automatically., optional: true}
        - {id: defect, goName: Defect, description: "Local input, bot token, or dispatch checkpoint is invalid.", optional: true}
      # Sync exposes the single-dispatch heartbeat to retries; Telegram has no send idempotency key.
      execution:
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
      mocks:
        - name: sentText
          branch: sent
          description: The example bot sent one text message to the Meridian team chat.
          default: true
          output: {chatId: -1001234567890, messageId: 52, date: 1794110000}
    - name: getChat
      goName: GetChat
      inputType: GetChatInput
      outputType: Chat
      kind: query
      description: Read metadata for a chat accessible to the bot.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Telegram returned the chat metadata.}
        - {id: notFound, goName: NotFound, description: Telegram could not find the chat., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram rejected the chat lookup or bot credentials., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Telegram returned malformed or oversized chat data., optional: true}
        - {id: defect, goName: Defect, description: Local input or bot token is invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: accessibleChat
          branch: found
          description: A Telegram group chat is accessible to the example bot.
          default: true
          output: {id: -1001234567890, type: supergroup, title: Meridian Team, username: meridian_team}
