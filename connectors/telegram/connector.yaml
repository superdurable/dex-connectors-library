      goName: SendPhoto
      inputType: SendPhotoInput
      outputType: SentMessage
      kind: mutation
      description: Send photo to one bot-accessible chat with a bounded resend cap.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: sent, goName: Sent, description: Telegram confirmed the sent message identity.}
        - {id: providerRejected, goName: ProviderRejected, description: Telegram conclusively rejected the send., optional: true}
        - {id: uncertain, goName: Uncertain, description: The send outcome remained unknown after the cap., optional: true}
        - {id: defect, goName: Defect, description: "Input, bot token, or dispatch checkpoint is invalid.", optional: true}
      mocks:
        - name: sentDefault
          branch: sent
          default: true
          description: Example photo was sent.
          output: {chatId: -1001234567890, messageId: 53, date: 1794110000}
    - name: sendSticker
      goName: SendSticker
      inputType: SendStickerInput
      outputType: SentMessage
      kind: mutation
      description: Send sticker to one bot-accessible chat with a bounded resend cap.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
