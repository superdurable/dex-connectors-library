apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: openai
  displayName: OpenAI
  description: OpenAI Responses API with structured output, usage, and recovery metadata.
  company: OpenAI
  version: v0.5.0
spec:
  provider: openai
  codegen:
    go:
      package: openai
  configuration:
    fields:
      - name: endpoint
        goName: Endpoint
        type: url
        description: OpenAI Responses API endpoint.
        required: false
        default: https://api.openai.com/v1
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum total response size.
        required: false
        default: 8388608
      - name: maxSseEventBytes
        goName: MaxSSEEventBytes
        type: integer
        description: Maximum size of one server-sent event.
        required: false
        default: 1048576
  auth:
    type: apiKey
    connectionKind: openai-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: OpenAI API key.
        required: true
  operations:
    - name: createResponse
      goName: CreateResponse
      inputType: CreateRequest
      outputType: Response
      kind: mutation
      description: Create an ordinary or structured model response.
      idempotency: required
      branches:
        - {id: completed, goName: Completed, description: OpenAI completed the response.}
        - {id: failed, goName: Failed, description: OpenAI returned a terminal failed or incomplete response.}
        - {id: providerRejected, goName: ProviderRejected, description: OpenAI conclusively rejected the response request.}
        - {id: uncertain, goName: Uncertain, description: The dispatched response outcome cannot be confirmed.}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid."}
      progress: [structured, text]
      execution: &openaiExecution
        executeMethodTimeout: 150s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 5m}
    - name: retrieveResponse
      goName: RetrieveResponse
      inputType: RetrieveRequest
      outputType: Response
      kind: query
      description: Retrieve a response by provider response ID.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: The response exists and was returned.}
        - {id: notFound, goName: NotFound, description: The requested response does not exist.}
        - {id: providerRejected, goName: ProviderRejected, description: OpenAI conclusively rejected the response query.}
        - {id: invalidResponse, goName: InvalidResponse, description: OpenAI returned an invalid or oversized response.}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid."}
      execution: *openaiExecution
