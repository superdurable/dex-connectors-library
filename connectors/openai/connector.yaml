apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: openai
  displayName: OpenAI
  description: "OpenAI Responses API stored responses: create a model response with JSON Schema structured output, streamed text and progress, token usage, and explicit uncertainty, and retrieve it by ID for recovery. Text generation Steps use the llm connector."
  company: OpenAI
  version: v0.21.0
spec:
  provider: openai
  codegen:
    go:
      package: openai
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "OpenAI model that createResponse sends when its request names none, such as gpt-6-luna or a fine-tuned ft: model ID from Platform > Fine-tuning; a request's model overrides it. Blank uses the displayed default. Use the llm connector's generateText for text generation Steps."
        required: false
        default: gpt-6-sol
      - name: endpoint
        goName: Endpoint
        type: url
        description: "OpenAI API base URL that each operation appends its path to, such as /responses; leave blank for the displayed public v1 default. Enter an absolute HTTPS URL only for a trusted compatible gateway, except for loopback test servers. The Studio model list always uses api.openai.com."
        required: false
        default: https://api.openai.com/v1
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Positive maximum total response size in bytes, counting every byte of a stream. Each streamed text delta carries about 260 bytes of event framing, so the displayed default holds roughly 30,000 streamed output tokens; raise it only for longer outputs. A larger createResponse response selects uncertain, and a larger retrieveResponse response selects invalidResponse."
        required: false
        default: 8388608
      - name: maxSseEventBytes
        goName: MaxSSEEventBytes
        type: integer
        description: Positive maximum size of one server-sent event in bytes. The final Responses event repeats the whole response, so raise it only for very long outputs. Oversized events select invalidResponse.
        required: false
        default: 1048576
  auth:
    type: apiKey
    connectionKind: openai-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: Secret OpenAI project API key from Platform > API keys; copy the sk- value when it is created. It is sent only as an Authorization bearer token.
        required: true
    guide:
      startURL: https://platform.openai.com/api-keys
      steps:
        - Select the OpenAI project that should own usage, then open API keys.
        - Choose Create new secret key, set the project permissions required by this connector, and copy the sk- secret shown once.
        - Store the value here as a secret; leave endpoint and limit fields blank to use their displayed defaults.
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, openai.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      # Pinned to api.openai.com: a custom endpoint does not move the list.
      - id: listModels
        capability: openai.models-list
        request:
          method: GET
          url: https://api.openai.com/v1/models
          credential: {field: api_key, scheme: bearer}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: Select this Step's OpenAI model; the picker loads OpenAI's live api.openai.com model list and stores the selected model ID.
        backendCapabilities: [openai.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: createResponse
      goName: CreateResponse
      inputType: CreateRequest
      outputType: Response
      kind: mutation
      description: Create an ordinary or structured model response.
      idempotency: required
      branches:
        - {id: completed, goName: Completed, description: OpenAI completed the response.}
        - {id: failed, goName: Failed, description: OpenAI returned a terminal failed or incomplete response., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: OpenAI conclusively rejected the response request., optional: true}
        - {id: uncertain, goName: Uncertain, description: The dispatched response outcome cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      progress: [structured, text]
      execution: &openaiExecution
        executeMethodTimeout: 150s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 5m}
    - name: retrieveResponse
      goName: RetrieveResponse
      inputType: RetrieveRequest
      outputType: Response
      kind: query
      description: Retrieve a response by provider response ID.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: The response exists and was returned.}
        - {id: notFound, goName: NotFound, description: The requested response does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: OpenAI conclusively rejected the response query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: OpenAI returned an invalid or oversized response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m}
