apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: chargebee
  displayName: Chargebee
  description: Read Chargebee subscriptions, customers, and invoices through the v2 API.
  company: Chargebee
  categories: [finance-payments]
  version: v0.2.0
spec:
  provider: chargebee
  languages:
    python:
      version: v0.1.0
      package: dex-connector-chargebee
      operations: [getSubscription]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-chargebee"
      operations: [getSubscription]
      triggers: []
  codegen:
    go:
      package: chargebee
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        required: true
        description: Non-secret site-specific API root https://{site}.chargebee.com/api/v2, using the site subdomain shown in the Chargebee console. Match the Test or Live site for the API key. Blank prevents connection creation; use a trusted local gateway only for tests.
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete API response in bytes as a positive integer. Blank uses the displayed default; increase for unusually large list pages.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: chargebee-api-token
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret Chargebee Read-Only API key from Settings > Configure Chargebee > API Keys and Webhooks > API Keys > Add API Key at https://app.chargebee.com. Copy the complete opaque key; blank prevents calls. Dex sends it only as the HTTP Basic username with an empty password. Match the Test or Live site in baseUrl.
    guide:
      startURL: https://app.chargebee.com
      steps:
        - Sign in to the Chargebee Test or Live site, open Settings > Configure Chargebee > API Keys and Webhooks > API Keys > Add API Key, select Read-Only, name the key, and copy the complete opaque secret into Dex Web api_key. Blank is invalid. Rotate it on the same page.
        - Copy the site's subdomain from its Chargebee console and enter the full non-secret https://{site}.chargebee.com/api/v2 into baseUrl; blank is invalid. Leave timeout and maxResponseBytes blank for their displayed defaults. Find the non-secret subscription ID in Subscriptions or an API response and pass it as subscriptionId; blank is invalid.
  operations:
    - name: listSubscriptions
      goName: ListSubscriptions
      inputType: ListSubscriptionsInput
      outputType: SubscriptionPage
      kind: query
      description: List subscription IDs, statuses, and currencies in one page.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Chargebee returned a subscription page.}
        - {id: providerRejected, goName: ProviderRejected, description: Chargebee rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Chargebee returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample subscription page.
          output: {subscriptions: [{id: sub_123456, status: active, currencyCode: USD}], nextOffset: next-page}
    - name: getCustomer
      goName: GetCustomer
      inputType: GetCustomerInput
      outputType: CustomerIdentity
      kind: query
      description: Read a customer's ID and email without payment data.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Chargebee returned the customer.}
        - {id: notFound, goName: NotFound, description: Chargebee did not find the customer., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Chargebee rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Chargebee returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Sample customer identity.
          output: {id: customer-1, email: member@example.com}
    - name: listCustomers
      goName: ListCustomers
      inputType: ListCustomersInput
      outputType: CustomerPage
      kind: query
      description: List customer IDs and email addresses in one page.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Chargebee returned a customer page.}
        - {id: providerRejected, goName: ProviderRejected, description: Chargebee rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Chargebee returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample customer page.
          output: {customers: [{id: customer-1, email: member@example.com}], nextOffset: next-page}
    - name: getInvoice
      goName: GetInvoice
      inputType: GetInvoiceInput
      outputType: InvoiceStatus
      kind: query
      description: Read invoice ID, status, currency, and total without payment details.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Chargebee returned the invoice.}
        - {id: notFound, goName: NotFound, description: Chargebee did not find the invoice., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Chargebee rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Chargebee returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Sample invoice status.
          output: {id: invoice-1, status: paid, currencyCode: USD, total: 1000}
    - name: listInvoices
      goName: ListInvoices
      inputType: ListInvoicesInput
      outputType: InvoicePage
      kind: query
      description: List invoice status and total in one page.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Chargebee returned an invoice page.}
        - {id: providerRejected, goName: ProviderRejected, description: Chargebee rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Chargebee returned invalid JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Sample invoice page.
          output: {invoices: [{id: invoice-1, status: paid, currencyCode: USD, total: 1000}], nextOffset: next-page}
    - name: getSubscription
      goName: GetSubscription
      inputType: GetSubscriptionInput
      outputType: SubscriptionStatus
      kind: query
      description: Read one subscription's ID, status, and currency code without customer or payment details.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Chargebee returned the subscription.}
        - {id: notFound, goName: NotFound, description: Chargebee did not expose the subscription., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Chargebee conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Chargebee returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample active subscription is returned.
          output: {id: sub_123456, status: active, currencyCode: USD}
