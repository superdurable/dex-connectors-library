apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: agora
  displayName: Agora Conversational AI
  description: List recently running Conversational AI agents in an Agora project.
  company: Agora
  categories: [communication]
  version: v0.1.0
spec:
  provider: agora
  codegen:
    go:
      package: agora
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: HTTPS Agora REST API host root. Blank uses the displayed production endpoint; override only for a trusted compatible test gateway. Do not include project paths or credentials.
        default: https://api.agora.io
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one agent list request as a positive Go duration such as 20s. Blank uses the displayed default; increase only for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete agents JSON response in bytes as a positive integer. Blank uses the displayed default; increase only if a project has a larger agent page.
        default: 65536
  auth:
    type: apiKey
    connectionKind: agora-rest-basic
    fields:
      - name: appId
        goName: AppID
        type: string
        required: true
        description: Agora project App ID from https://console.agora.io under Projects > select project > Credentials. Copy its 32-character hexadecimal App ID; this is a nonsecret URL path value. Blank prevents calls.
      - name: customerId
        goName: CustomerID
        type: string
        required: true
        description: Agora Customer ID from https://console.agora.io under account menu > RESTful API Keys > Create API Key > Download. The downloaded Key is the nonsecret HTTP Basic username; copy its full value. Blank prevents calls.
      - name: customerSecret
        goName: CustomerSecret
        type: secretString
        required: true
        description: Secret Agora Customer Secret paired with the Customer ID at https://console.agora.io under account menu > RESTful API Keys > Create API Key > Download. The downloaded Secret is the HTTP Basic password and can be downloaded only once; copy its full value into this secret field. Blank prevents calls.
    guide:
      startURL: https://console.agora.io
      steps:
        - Sign in at https://console.agora.io, open Projects, select the project, and copy its App ID from Credentials. The App ID is a 32-character hexadecimal project identifier.
        - Open the account menu at the bottom of the sidebar, choose RESTful API Keys, create an API key, and download it once. Enter its Key as customerId and Secret as customerSecret. The secret stays in Dex credentials and is sent only in an HTTPS Basic Authorization header.
        - Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults. listRunningAgents reads one page of currently running agents from the preceding two hours and never changes the project.
  operations:
    - name: listRunningAgents
      goName: ListRunningAgents
      inputType: ListRunningAgentsInput
      outputType: RunningAgents
      kind: query
      description: Read one page of currently running Conversational AI agents from the preceding two hours.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Agora returned the running agent page.}
        - {id: providerRejected, goName: ProviderRejected, description: Agora conclusively rejected the query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Agora returned malformed or oversized agents JSON., optional: true}
        - {id: defect, goName: Defect, description: The local Agora credentials or App ID are missing or invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One sample running agent is listed.
          output:
            count: 1
            agents:
              - {agentId: 1234567890ABCDE1CVGZNU80BEIN56XF, status: RUNNING, startTimestamp: 1735035893}
            total: 1
            cursor: ""
