    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the batch., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: sendBatchEmailsDefault, branch: sent, default: true, description: Two emails were queued., output: {data: [{id: email-1}, {id: email-2}]}}
  - name: getEmail
    goName: GetEmail
    inputType: GetEmailInput
    outputType: Email
    kind: query
    description: GetEmail through the Resend public JSON API.
    idempotency: none
    authorization: required
    branches:
    - id: found
      goName: Found
      description: Resend returned the requested result.
    - id: notFound
      goName: NotFound
      description: The requested resource does not exist.
      optional: true
    - id: providerRejected
      goName: ProviderRejected
      description: The provider definitively rejected the request.
      optional: true
    - id: invalidResponse
