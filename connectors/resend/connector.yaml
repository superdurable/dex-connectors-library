    - {id: notFound, goName: NotFound, description: The topic does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned an invalid response., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection is invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: getTopicDefault, branch: found, default: true, description: Resend found the topic., output: {"id":"topic-1","name":"News","default_subscription":"opt_in","visibility":"public"}}
  - name: listTopics
    goName: ListTopics
    inputType: ListTopicsInput
    outputType: TopicPage
    kind: query
    description: List subscription topics with cursor pagination.
    idempotency: none
    authorization: required
    branches:
