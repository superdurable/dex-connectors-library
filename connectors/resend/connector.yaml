apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: resend
  displayName: Resend
  description: Send and manage emails, contacts, and verified domains through the Resend API.
  company: Resend
  categories: [communication, developer-tools]
  version: v0.3.0
spec:
  provider: resend
  languages:
    python:
      version: v0.1.0
      operations: [sendEmail, getEmail]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-resend'
      operations: [sendEmail, getEmail]
      triggers: []
  codegen:
    go:
      package: resend
  configuration:
    fields:
    - name: baseUrl
      goName: BaseURL
      type: url
      description: Resend API base URL. Leave blank for the displayed public endpoint;
        override only for a compatible gateway or local test server.
      default: https://api.resend.com
    - name: timeout
      goName: Timeout
      type: duration
      description: Maximum time for one HTTP request, as a positive Go duration such
        as 15s or 1m. Leave blank for the displayed default; override for slower gateways.
      default: 15s
    - name: maxResponseBytes
      goName: MaxResponseBytes
      type: integer
      description: Maximum accepted response size in bytes. Leave blank for the displayed
        default; increase only for larger legitimate pages.
      default: 2097152
  auth:
    type: apiKey
    connectionKind: resend-api-key
    fields:
    - name: api_key
      goName: APIKey
      type: secretString
      required: true
      description: Secret Resend token. Start at https://resend.com/api-keys, follow
        API Keys > Create API Key. Create a full access API key for all operations, then
        copy its secret value. It is an opaque secret string; blank prevents requests.
        It is sent only in the Authorization header.
    guide:
      startURL: https://resend.com/api-keys
      steps:
      - Open https://resend.com/api-keys and sign in or create an account.
      - Follow API Keys > Create API Key. Create a full access API key for email, contact, and domain reads; a sending-only key still supports sendEmail but cannot use every operation.
        then copy its secret value. It is an opaque secret string; blank prevents
        requests.
      - Paste the token into the secret api_key field and save the connection; leave
        baseUrl, timeout, and maxResponseBytes blank to use their displayed defaults.
  operations:
  - name: createContact
    goName: CreateContact
    inputType: CreateContactInput
    outputType: ContactReference
    kind: mutation
    description: Create one global contact by email address.
    idempotency: required
    authorization: required
    branches:
    - {id: created, goName: Created, description: Resend created or confirmed the contact.}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected creation., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    - {id: uncertain, goName: Uncertain, description: The send cap was reached without confirming creation., optional: true}
    execution: {repeatOnUnknown: limited, maxSends: 3, executeMethodTimeout: 30s, durability: sync}
    mocks:
    - {name: createContactDefault, branch: created, default: true, description: One contact was created., output: {id: contact-1}}
  - name: createDomain
    goName: CreateDomain
    inputType: CreateDomainInput
    outputType: DomainReference
    kind: mutation
    description: Create one sending domain by DNS name.
    idempotency: required
    authorization: required
    branches:
    - {id: created, goName: Created, description: Resend created or confirmed the domain.}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected creation., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    - {id: uncertain, goName: Uncertain, description: The send cap was reached without confirming creation., optional: true}
    execution: {repeatOnUnknown: limited, maxSends: 3, executeMethodTimeout: 30s, durability: sync}
    mocks:
    - {name: createDomainDefault, branch: created, default: true, description: One domain was created., output: {id: domain-1}}
  - name: updateContact
    goName: UpdateContact
    inputType: UpdateContactInput
    outputType: ContactReference
    kind: mutation
    description: Replace a global contact's name and subscription state.
    idempotency: required
    authorization: required
    branches:
    - {id: updated, goName: Updated, description: Resend updated the contact.}
    - {id: notFound, goName: NotFound, description: The contact does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the update., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: updateContactDefault, branch: updated, default: true, description: One contact was updated., output: {id: contact-1}}
  - name: deleteContact
    goName: DeleteContact
    inputType: DeleteContactInput
    outputType: DeletedContact
    kind: mutation
    description: Delete a global contact by ID or email address.
    idempotency: required
    authorization: required
    branches:
    - {id: deleted, goName: Deleted, description: Resend deleted the contact.}
    - {id: notFound, goName: NotFound, description: The contact does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the deletion., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: deleteContactDefault, branch: deleted, default: true, description: One contact was deleted., output: {contact: contact-1, deleted: true}}
  - name: deleteDomain
    goName: DeleteDomain
    inputType: DeleteDomainInput
    outputType: DeletedDomain
    kind: mutation
    description: Delete a sending domain by ID.
    idempotency: required
    authorization: required
    branches:
    - {id: deleted, goName: Deleted, description: Resend deleted the domain.}
    - {id: notFound, goName: NotFound, description: The domain does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the deletion., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: deleteDomainDefault, branch: deleted, default: true, description: One domain was deleted., output: {id: domain-1, deleted: true}}
  - name: updateScheduledEmail
    goName: UpdateScheduledEmail
    inputType: UpdateScheduledEmailInput
    outputType: EmailReference
    kind: mutation
    description: Replace the delivery time of a scheduled email.
    idempotency: required
    authorization: required
    branches:
    - {id: updated, goName: Updated, description: Resend updated the scheduled email.}
    - {id: notFound, goName: NotFound, description: The email does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the update., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: updateScheduledEmailDefault, branch: updated, default: true, description: One schedule was updated., output: {id: email-1}}
  - name: cancelScheduledEmail
    goName: CancelScheduledEmail
    inputType: CancelScheduledEmailInput
    outputType: EmailReference
    kind: mutation
    description: Cancel a scheduled email before delivery.
    idempotency: required
    authorization: required
    branches:
    - {id: cancelled, goName: Cancelled, description: Resend cancelled the scheduled email.}
    - {id: notFound, goName: NotFound, description: The email does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected cancellation., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: cancelScheduledEmailDefault, branch: cancelled, default: true, description: One schedule was cancelled., output: {id: email-1}}
  - name: sendEmail
    goName: SendEmail
    inputType: SendEmailInput
    outputType: SentEmail
    kind: mutation
    description: SendEmail through the Resend public JSON API.
    idempotency: required
    authorization: required
    branches:
    - id: sent
      goName: Sent
      description: Resend returned the requested result.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider definitively rejected the request.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input or connection credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: sendEmailDefault
      branch: sent
      description: A representative Resend response.
      default: true
      output:
        id: 5f9f777d-04e0-482a-bb65-088bb5bd44a4
  - name: getEmail
    goName: GetEmail
    inputType: GetEmailInput
    outputType: Email
    kind: query
    description: GetEmail through the Resend public JSON API.
    idempotency: none
    authorization: required
    branches:
    - id: found
      goName: Found
      description: Resend returned the requested result.
    - id: notFound
      goName: NotFound
      description: The requested resource does not exist.
      optional: true
    - id: providerRejected
      goName: ProviderRejected
      description: The provider definitively rejected the request.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input or connection credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: getEmailDefault
      branch: found
      description: A representative Resend response.
      default: true
      output:
        id: 5f9f777d-04e0-482a-bb65-088bb5bd44a4
        from: Acme <hello@example.test>
        to:
        - reader@example.test
        subject: Welcome
        created_at: '2026-10-26T12:00:00Z'
  - name: listEmails
    goName: ListEmails
    inputType: ListEmailsInput
    outputType: EmailPage
    kind: query
    description: List sent emails with bounded cursor pagination.
    idempotency: none
    authorization: required
    branches:
    - {id: listed, goName: Listed, description: Resend returned sent email references.}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: listEmailsDefault
      branch: listed
      default: true
      description: One sent email appears on the page.
      output: {data: [{id: 5f9f777d-04e0-482a-bb65-088bb5bd44a4, from: 'Acme <hello@example.test>', to: [reader@example.test], subject: Welcome, created_at: '2026-10-26T12:00:00Z'}], has_more: false}
  - name: getContact
    goName: GetContact
    inputType: GetContactInput
    outputType: Contact
    kind: query
    description: Retrieve a global contact by ID or email address.
    idempotency: none
    authorization: required
    branches:
    - {id: found, goName: Found, description: Resend returned the contact.}
    - {id: notFound, goName: NotFound, description: No contact has this ID or email., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: getContactDefault
      branch: found
      default: true
      description: One contact is found.
      output: {id: contact-1, email: reader@example.test, unsubscribed: false}
  - name: listContacts
    goName: ListContacts
    inputType: ListContactsInput
    outputType: ContactPage
    kind: query
    description: List global contacts with bounded cursor pagination.
    idempotency: none
    authorization: required
    branches:
    - {id: listed, goName: Listed, description: Resend returned a contact page.}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: listContactsDefault
      branch: listed
      default: true
      description: One contact appears on the page.
      output: {data: [{id: contact-1, email: reader@example.test, unsubscribed: false}], has_more: false}
  - name: getDomain
    goName: GetDomain
    inputType: GetDomainInput
    outputType: Domain
    kind: query
    description: Retrieve a sending domain and its verification status.
    idempotency: none
    authorization: required
    branches:
    - {id: found, goName: Found, description: Resend returned the domain.}
    - {id: notFound, goName: NotFound, description: No domain has this ID., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: getDomainDefault
      branch: found
      default: true
      description: One domain is found.
      output: {id: domain-1, name: example.test, status: verified}
  - name: listDomains
    goName: ListDomains
    inputType: ListDomainsInput
    outputType: DomainPage
    kind: query
    description: List sending domains with bounded cursor pagination.
    idempotency: none
    authorization: required
    branches:
    - {id: listed, goName: Listed, description: Resend returned a domain page.}
    - {id: providerRejected, goName: ProviderRejected, description: Resend definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Resend returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: listDomainsDefault
      branch: listed
      default: true
      description: One domain appears on the page.
      output: {data: [{id: domain-1, name: example.test, status: verified}], has_more: false}
