apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: smartsheet
  displayName: Smartsheet
  description: Read and change Smartsheet sheets, rows, columns, folders, and workspaces with a connection-owned API key.
  company: Smartsheet
  categories: [project-management, productivity]
  version: v0.3.0
spec:
  provider: smartsheet
  languages:
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-smartsheet'
      operations: [listSheets, getSheet]
      triggers: []
    python:
      version: v0.1.0
      operations: [listSheets, getSheet]
      triggers: []
  codegen:
    go:
      package: smartsheet
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: "Public Smartsheet HTTPS API root; blank uses the displayed default. Override only for a trusted compatible gateway or loopback test server, and never include a key in the URL."
        default: https://api.smartsheet.com/2.0
      - name: timeout
        goName: Timeout
        type: duration
        description: "Maximum duration of one Smartsheet HTTP read, as a positive Go duration such as 15s or 1m. Blank uses the displayed default; raise it only for slow large reads."
        default: 30s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum bytes accepted from one Smartsheet JSON response, as a positive integer. Blank uses the displayed default; raise it for large pages or files. Oversized data selects invalidResponse."
        default: 4194304
  auth:
    type: apiKey
    connectionKind: smartsheet-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: "Secret Smartsheet API token from https://app.smartsheet.com (Account icon > Personal Settings > API Access > Generate new access token); copy the token when generated, paste it here, and keep it secret. Blank makes every operation select defect before a request."
        required: true
    guide:
      startURL: https://app.smartsheet.com
      steps:
        - "Open https://app.smartsheet.com and sign in; navigate to Account icon > Personal Settings > API Access > Generate new access token."
        - "Create a token for the identity that may read the desired resources and copy the secret value when shown."
        - "Paste it into secret api_key. Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults."
        - "To revoke access, delete the token on the same provider page."
  operations:
    - name: listSheets
      goName: ListSheets
      inputType: ListSheetsInput
      outputType: SheetPage
      kind: query
      description: Read Smartsheet data from the documented listSheets endpoint.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "Smartsheet returned the requested data."}
        - {id: providerRejected, goName: ProviderRejected, description: "Smartsheet conclusively rejected the read.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Smartsheet returned malformed or oversized JSON.", optional: true}
        - {id: defect, goName: Defect, description: "Local input or connection credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 45s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: listed
          description: "One Meridian sample record from the same example world."
          default: true
          output: {sheets: [{id: 1001, name: Meridian Planning}], pageNumber: 1, totalCount: 1}
        - name: invalidKey
          branch: providerRejected
          description: "The connection token is invalid."
          failure: {kind: AUTHENTICATION, message: "Smartsheet rejected the token."}
    - name: getSheet
      goName: GetSheet
      inputType: GetSheetInput
      outputType: Sheet
      kind: query
      description: Read Smartsheet data from the documented getSheet endpoint.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "Smartsheet returned the requested data."}
        - {id: notFound, goName: NotFound, description: "Smartsheet does not have the requested resource.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Smartsheet conclusively rejected the read.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Smartsheet returned malformed or oversized JSON.", optional: true}
        - {id: defect, goName: Defect, description: "Local input or connection credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 45s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: found
          description: "One Meridian sample record from the same example world."
          default: true
          output: {id: 1001, name: Meridian Planning, columns: [{id: 2001, title: Task}], rows: []}
        - name: invalidKey
          branch: providerRejected
          description: "The connection token is invalid."
          failure: {kind: AUTHENTICATION, message: "Smartsheet rejected the token."}
    - name: getRow
      goName: GetRow
      inputType: GetRowInput
      outputType: SheetRow
      kind: query
      description: Read one row and its cells from a sheet.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Smartsheet returned the row.}
        - {id: notFound, goName: NotFound, description: Smartsheet did not find the row., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Smartsheet returned malformed row JSON., optional: true}
        - {id: defect, goName: Defect, description: Row ID or credentials are invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: One sample row is returned., output: {id: 3001, cells: ['{"columnId":2001,"value":"Planning"}']}}
    - name: addRow
      goName: AddRow
      inputType: AddRowInput
      outputType: SheetRow
      kind: mutation
      description: Append one text-cell row to a sheet.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: added, goName: Added, description: Smartsheet added the row.}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet rejected the row., optional: true}
        - {id: uncertain, goName: Uncertain, description: The row create outcome cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Row input or credentials are invalid., optional: true}
      mocks:
        - {name: addedDefault, branch: added, default: true, description: One sample row is added., output: {id: 3001, cells: ['{"columnId":2001,"value":"Planning"}']}}
    - name: updateRow
      goName: UpdateRow
      inputType: UpdateRowInput
      outputType: SheetRow
      kind: mutation
      description: Replace text values in one row's cells.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Smartsheet updated the row.}
        - {id: notFound, goName: NotFound, description: Smartsheet did not find the row., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Smartsheet returned malformed row JSON., optional: true}
        - {id: defect, goName: Defect, description: Row input or credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: One sample row is updated., output: {id: 3001, cells: ['{"columnId":2001,"value":"Planning"}']}}
    - name: deleteRow
      goName: DeleteRow
      inputType: DeleteRowInput
      outputType: DeleteRowOutput
      kind: mutation
      description: Remove one row from a sheet.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Smartsheet deleted the row.}
        - {id: notFound, goName: NotFound, description: Smartsheet did not find the row., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet rejected the delete., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Smartsheet returned malformed delete confirmation., optional: true}
        - {id: defect, goName: Defect, description: Row ID or credentials are invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: One sample row is deleted., output: {rowId: 3001}}
    - name: createSheetInWorkspace
      goName: CreateSheetInWorkspace
      inputType: CreateSheetInWorkspaceInput
      outputType: SheetSummary
      kind: mutation
      description: Create a sheet with one primary text column at a workspace top level.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Smartsheet created the sheet.}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet providerRejected outcome for the sheet., optional: true}
        - {id: uncertain, goName: Uncertain, description: The sheet create outcome cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Sheet input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: One sample sheet is created.
          output: {"id":1001,"name":"Meridian Planning"}
    - name: createSheetInFolder
      goName: CreateSheetInFolder
      inputType: CreateSheetInFolderInput
      outputType: SheetSummary
      kind: mutation
      description: Create a sheet with one primary text column in a folder.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Smartsheet created the sheet.}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet providerRejected outcome for the sheet., optional: true}
        - {id: uncertain, goName: Uncertain, description: The sheet create outcome cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Sheet input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: One sample sheet is created.
          output: {"id":1001,"name":"Meridian Planning"}
    - name: updateSheet
      goName: UpdateSheet
      inputType: UpdateSheetInput
      outputType: SheetSummary
      kind: mutation
      description: Replace a sheet's display name.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Smartsheet updated the sheet.}
        - {id: notFound, goName: NotFound, description: Smartsheet notFound outcome for the sheet., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet providerRejected outcome for the sheet., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Smartsheet invalidResponse outcome for the sheet., optional: true}
        - {id: defect, goName: Defect, description: Sheet input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One sample sheet is updated.
          output: {"id":1001,"name":"Meridian Planning"}
    - name: deleteSheet
      goName: DeleteSheet
      inputType: DeleteSheetInput
      outputType: DeleteSheetOutput
      kind: mutation
      description: Delete one sheet by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Smartsheet deleted the sheet.}
        - {id: notFound, goName: NotFound, description: Smartsheet notFound outcome for the sheet., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet providerRejected outcome for the sheet., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Smartsheet invalidResponse outcome for the sheet., optional: true}
        - {id: defect, goName: Defect, description: Sheet input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: One sample sheet is deleted.
          output: {"sheetId":1001}
    - name: listColumns
      goName: ListColumns
      inputType: ListColumnsInput
      outputType: ColumnPage
      kind: query
      description: List a sheet's columns one page at a time.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Smartsheet returned the column page.}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Smartsheet returned invalid column JSON., optional: true}
        - {id: defect, goName: Defect, description: Sheet ID or credentials are invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: One sample column is returned., output: {columns: [{id: 2001, title: Task, type: TEXT_NUMBER}], pageNumber: 1, totalCount: 1}}
    - name: getColumn
      goName: GetColumn
      inputType: GetColumnInput
      outputType: ColumnSummary
      kind: query
      description: Get one column definition from a sheet.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Smartsheet returned the column.}
        - {id: notFound, goName: NotFound, description: Smartsheet did not find the column., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Smartsheet returned invalid column JSON., optional: true}
        - {id: defect, goName: Defect, description: Sheet or column ID is invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: One sample column is returned., output: {id: 2001, title: Task, type: TEXT_NUMBER}}
    - name: addColumn
      goName: AddColumn
      inputType: AddColumnInput
      outputType: ColumnSummary
      kind: mutation
      description: Add one text/number column to a sheet.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: added, goName: Added, description: Smartsheet added the column.}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet rejected the column., optional: true}
        - {id: uncertain, goName: Uncertain, description: Column creation cannot be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Column input or credentials are invalid., optional: true}
      mocks:
        - {name: addedDefault, branch: added, default: true, description: One sample column is added., output: {id: 2001, title: Task, type: TEXT_NUMBER}}
    - name: updateColumn
      goName: UpdateColumn
      inputType: UpdateColumnInput
      outputType: ColumnSummary
      kind: mutation
      description: Rename one column without changing its type.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Smartsheet renamed the column.}
        - {id: notFound, goName: NotFound, description: Smartsheet did not find the column., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet rejected the rename., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Smartsheet returned invalid column JSON., optional: true}
        - {id: defect, goName: Defect, description: Column input or credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: One sample column is renamed., output: {id: 2001, title: Task, type: TEXT_NUMBER}}
    - name: deleteColumn
      goName: DeleteColumn
      inputType: DeleteColumnInput
      outputType: DeleteColumnOutput
      kind: mutation
      description: Delete one column from a sheet.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Smartsheet deleted the column.}
        - {id: notFound, goName: NotFound, description: Smartsheet did not find the column., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Smartsheet rejected the delete., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Smartsheet returned invalid delete confirmation., optional: true}
        - {id: defect, goName: Defect, description: Column ID or credentials are invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: One sample column is deleted., output: {columnId: 2001}}
    - name: getFolder
      goName: GetFolder
      inputType: GetFolderInput
      outputType: FolderSummary
      kind: query
      description: Get one folder's metadata.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Smartsheet found the folder.}
        - {id: notFound, goName: NotFound, description: Folder notFound outcome., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Folder providerRejected outcome., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Folder invalidResponse outcome., optional: true}
        - {id: defect, goName: Defect, description: Folder defect outcome., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: Sample folder found outcome., output: {id: 5001, name: Meridian Folder} }
    - name: createFolderInWorkspace
      goName: CreateFolderInWorkspace
      inputType: CreateFolderInWorkspaceInput
      outputType: FolderSummary
      kind: mutation
      description: Create one folder in a workspace.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Smartsheet created the folder.}
        - {id: providerRejected, goName: ProviderRejected, description: Folder providerRejected outcome., optional: true}
        - {id: uncertain, goName: Uncertain, description: Folder uncertain outcome., optional: true}
        - {id: defect, goName: Defect, description: Folder defect outcome., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: Sample folder created outcome., output: {id: 5001, name: Meridian Folder} }
    - name: createFolderInFolder
      goName: CreateFolderInFolder
      inputType: CreateFolderInFolderInput
      outputType: FolderSummary
      kind: mutation
      description: Create one nested folder.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Smartsheet created the folder.}
        - {id: providerRejected, goName: ProviderRejected, description: Folder providerRejected outcome., optional: true}
        - {id: uncertain, goName: Uncertain, description: Folder uncertain outcome., optional: true}
        - {id: defect, goName: Defect, description: Folder defect outcome., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: Sample folder created outcome., output: {id: 5001, name: Meridian Folder} }
    - name: updateFolder
      goName: UpdateFolder
      inputType: UpdateFolderInput
      outputType: FolderSummary
      kind: mutation
      description: Rename one folder.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Smartsheet updated the folder.}
        - {id: notFound, goName: NotFound, description: Folder notFound outcome., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Folder providerRejected outcome., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Folder invalidResponse outcome., optional: true}
        - {id: defect, goName: Defect, description: Folder defect outcome., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: Sample folder updated outcome., output: {id: 5001, name: Meridian Folder} }
    - name: deleteFolder
      goName: DeleteFolder
      inputType: DeleteFolderInput
      outputType: DeleteFolderOutput
      kind: mutation
      description: Delete one folder.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Smartsheet deleted the folder.}
        - {id: notFound, goName: NotFound, description: Folder notFound outcome., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Folder providerRejected outcome., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Folder invalidResponse outcome., optional: true}
        - {id: defect, goName: Defect, description: Folder defect outcome., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: Sample folder deleted outcome., output: {folderId: 5001} }
