apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: datadog
  displayName: Datadog
  description: "Query Datadog metrics and create, list, read, update, and delete monitors through typed Dex Steps."
  company: Datadog
  categories: [developer-tools]
  version: v0.4.0
spec:
  provider: datadog
  languages:
    python:
      version: v0.2.0
      operations: [queryMetrics, listMonitors]
      triggers: []
    typescript:
      version: v0.2.0
      package: "@superdurable/connector-datadog"
      operations: [queryMetrics, listMonitors]
      triggers: []
  codegen:
    go:
      package: datadog
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: "Datadog REST API base URL. Leave blank for the displayed US site endpoint; use the HTTPS API host of your Datadog region (such as https://api.datadoghq.eu), a compatible gateway, or a loopback test server."
        default: https://api.datadoghq.com
      - name: timeout
        goName: Timeout
        type: duration
        description: "Positive Go duration bounding one HTTP request; leave blank for the displayed default, or override for a slower network."
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Positive byte limit for one response; leave blank for the displayed default, or override for larger pages."
        default: 2097152
  auth:
    type: apiKey
    connectionKind: datadog-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: "Secret Datadog API key from Organization Settings > API Keys at https://app.datadoghq.com/organization-settings/api-keys. Create API Key and copy it; blank prevents requests."
        required: true
      - name: application_key
        goName: ApplicationKey
        type: secretString
        description: "Secret Datadog application key from Organization Settings > Application Keys at https://app.datadoghq.com/organization-settings/application-keys. Select New Key with timeseries_query, monitors_read, and monitors_write permissions; copy the key at creation; blank prevents requests."
        required: true
    guide:
      startURL: https://app.datadoghq.com/organization-settings/api-keys
      steps:
        - "Open https://app.datadoghq.com/organization-settings/api-keys and create or select an API key in Organization Settings > API Keys."
        - "Open https://app.datadoghq.com/organization-settings/application-keys, select New Key in Organization Settings > Application Keys, and grant timeseries_query, monitors_read, and monitors_write permissions."
        - "Copy both secret values into api_key and application_key; leave baseUrl, timeout, and maxResponseBytes blank unless changing their displayed defaults."
  operations:
    - name: createMonitor
      goName: CreateMonitor
      inputType: CreateMonitorInput
      outputType: Monitor
      kind: mutation
      description: Create a Datadog metric alert monitor.
      idempotency: required
      authorization: required
      branches:
        - {id: created, goName: Created, description: Datadog created the monitor and returned its ID.}
        - {id: providerRejected, goName: ProviderRejected, description: Datadog definitively rejected creation., optional: true}
        - {id: uncertain, goName: Uncertain, description: A monitor may have been created without a confirmed ID after bounded sends., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 2}
      mocks:
        - name: latencyMonitorCreated
          branch: created
          description: Create a metric alert monitor for the example.
          default: true
          output: {id: 12345, name: "Dex latency alert", type: "metric alert", overall_state: "OK"}
    - name: queryMetrics
      goName: QueryMetrics
      inputType: QueryMetricsInput
      outputType: MetricsQuery
      kind: query
      description: "Query Datadog timeseries points over an explicit Unix-second interval."
      idempotency: none
      authorization: required
      branches:
        - {id: queried, goName: Queried, description: "Query Datadog timeseries points over an explicit Unix-second interval."}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        repeatOnUnknown: safe
      mocks:
        - name: queriedDefault
          branch: queried
          description: "A Meridian example returns a representative MetricsQuery."
          default: true
          output: {"status":"ok","series":[{"metric":"system.cpu.user","pointlist":[[1761436800000,0.23]]}]}
    - name: listMonitors
      goName: ListMonitors
      inputType: ListMonitorsInput
      outputType: MonitorsPage
      kind: query
      description: "List one page of Datadog monitors."
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "List one page of Datadog monitors."}
        - {id: providerRejected, goName: ProviderRejected, description: The provider rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        repeatOnUnknown: safe
      mocks:
        - name: listedDefault
          branch: listed
          description: "A Meridian example returns a representative MonitorsPage."
          default: true
          output: {"monitors":[{"id":12345,"name":"Meridian API latency","type":"metric alert","overall_state":"OK"}]}
    - name: getMonitor
      goName: GetMonitor
      inputType: GetMonitorInput
      outputType: Monitor
      kind: query
      description: Read one Datadog monitor summary by numeric ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Datadog returned the monitor.}
        - {id: notFound, goName: NotFound, description: Datadog did not expose the monitor., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Datadog rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Datadog returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One example monitor is returned.
          output: {id: 12345, name: Meridian API latency, type: metric alert, overall_state: OK}
    - name: updateMonitor
      goName: UpdateMonitor
      inputType: UpdateMonitorInput
      outputType: Monitor
      kind: mutation
      description: Replace a monitor's name and message with absolute values.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Datadog returned the updated monitor.}
        - {id: notFound, goName: NotFound, description: Datadog did not expose the monitor., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Datadog rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Datadog returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One example monitor is updated.
          output: {id: 12345, name: Meridian API latency, type: metric alert, overall_state: OK}
    - name: deleteMonitor
      goName: DeleteMonitor
      inputType: DeleteMonitorInput
      outputType: DeletedMonitor
      kind: mutation
      description: Delete a monitor by ID without forcing deletion of dependent resources.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Datadog confirmed monitor deletion.}
        - {id: notFound, goName: NotFound, description: Datadog did not expose the monitor., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Datadog rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Datadog returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: One example monitor is deleted.
          output: {monitorId: 12345}
