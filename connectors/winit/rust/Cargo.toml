[package]
name = "dex-connector-winit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Winit warehouse catalog queries for Dex Flows"
repository = "https://github.com/superdurable/dex-connectors-library"

[dependencies]
md-5="0.11"
hex="0.4"
chrono={version="0.4",default-features=false,features=["std"]}
dex-connectors-sdk = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }

[dev-dependencies]
form_urlencoded = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
