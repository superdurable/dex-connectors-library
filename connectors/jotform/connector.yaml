apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: jotform
  displayName: Jotform
  description: Manage Jotform forms and submissions through the Jotform API.
  company: Jotform
  categories: [productivity]
  version: v0.3.0
spec:
  provider: jotform
  languages:
    python:
      version: v0.2.0
      operations: [listForms, getSubmission]
      triggers: []
    typescript:
      version: v0.2.0
      package: '@superdurable/connector-jotform'
      operations: [listForms, getSubmission]
      triggers: []
  codegen:
    go:
      package: jotform
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Jotform API endpoint, as an absolute HTTPS URL. Leave blank for the displayed US default; use https://eu-api.jotform.com for an EU account or https://hipaa-api.jotform.com for HIPAA. Override only for your account region or a trusted test gateway.
        default: https://api.jotform.com
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s or 1m. Blank uses the displayed default; increase only for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum complete API response in bytes. Blank uses the displayed default; increase for known larger form lists. Oversized responses select invalidResponse.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: jotform-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret provider-issued API key from Jotform My Account > API at https://www.jotform.com/myaccount/api. Select read-only access for Queries or Full Access for form and submission writes; copy the full opaque string. Blank makes calls select defect. Dex stores it as a secret and sends it only in the APIKEY header.
    guide:
      startURL: https://www.jotform.com/myaccount/api
      steps:
        - Sign in at https://www.jotform.com/myaccount/api, then open My Account > API.
        - Create a read-only API key for Queries or choose Full Access for create, update, and delete operations. Copy the complete opaque string into secret api_key in Dex Web, save the connection, and revoke the key from the same Jotform page when retired. Blank is invalid.
        - Use the API endpoint for your account region (US, EU, or HIPAA). Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults only when the US endpoint applies.
  operations:
    - name: createForm
      goName: CreateForm
      inputType: CreateFormInput
      outputType: WriteResult
      kind: mutation
      description: Create a form with a title and one header question.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Jotform created the form.}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform conclusively rejected the form., optional: true}
        - {id: uncertain, goName: Uncertain, description: A possibly created form could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: A form was created., output: {id: "123", accepted: true}}
    - name: updateFormTitle
      goName: UpdateFormTitle
      inputType: UpdateFormTitleInput
      outputType: WriteResult
      kind: mutation
      description: Set a form's title to a selected value.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Jotform accepted the title update.}
        - {id: notFound, goName: NotFound, description: The form does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform rejected the title update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Jotform returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: A form title was updated., output: {id: "123", accepted: true}}
    - name: deleteForm
      goName: DeleteForm
      inputType: GetFormInput
      outputType: WriteResult
      kind: mutation
      description: Delete one form by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Jotform deleted the form.}
        - {id: notFound, goName: NotFound, description: The form does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Jotform returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: A form was deleted., output: {id: "123", accepted: true}}
    - name: createSubmission
      goName: CreateSubmission
      inputType: CreateSubmissionInput
      outputType: WriteResult
      kind: mutation
      description: Submit non-secret answers to one form.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Jotform created the submission.}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform conclusively rejected the submission., optional: true}
        - {id: uncertain, goName: Uncertain, description: A possibly created submission could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: A submission was created., output: {id: "456", accepted: true}}
    - name: updateSubmission
      goName: UpdateSubmission
      inputType: UpdateSubmissionInput
      outputType: WriteResult
      kind: mutation
      description: Set selected answers on an existing submission.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Jotform accepted the answer update.}
        - {id: notFound, goName: NotFound, description: The submission does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform rejected the answer update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Jotform returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: A submission was updated., output: {id: "456", accepted: true}}
    - name: deleteSubmission
      goName: DeleteSubmission
      inputType: GetSubmissionInput
      outputType: WriteResult
      kind: mutation
      description: Delete one submission by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Jotform deleted the submission.}
        - {id: notFound, goName: NotFound, description: The submission does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Jotform returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: A submission was deleted., output: {id: "456", accepted: true}}
    - name: getForm
      goName: GetForm
      inputType: GetFormInput
      outputType: FormMetadata
      kind: query
      description: Read one form's identity, title, and status.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Jotform returned the form.}
        - {id: notFound, goName: NotFound, description: Jotform did not find the form., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform rejected the form lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Jotform returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: One example form was found., output: {id: "241234567890123", title: Contact request, status: ENABLED}}
    - name: listFormSubmissions
      goName: ListFormSubmissions
      inputType: ListFormSubmissionsInput
      outputType: SubmissionsPage
      kind: query
      description: List one bounded page of submission metadata for a form.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Jotform returned the submission page.}
        - {id: notFound, goName: NotFound, description: Jotform did not find the form., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform rejected the submission list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Jotform returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: One example submission was listed., output: {submissions: [{id: "456", formId: "123", status: ACTIVE, createdAt: "2026-01-01 00:00:00"}], offset: 0, limit: 20}}
    - name: listForms
      goName: ListForms
      inputType: ListFormsInput
      outputType: FormsPage
      kind: query
      description: List one page of form titles and IDs without submission answers.
      idempotency: none
      authorization: required
      execution:
        executeMethodTimeout: 30s
        durability: async
      branches:
        - {id: listed, goName: Listed, description: Jotform returned the selected form page.}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Jotform returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One example form is listed.
          output: {forms: [{id: "241234567890123", title: "Contact request", status: "ENABLED"}], offset: 0, limit: 20}
    - name: getSubmission
      goName: GetSubmission
      inputType: GetSubmissionInput
      outputType: SubmissionMetadata
      kind: query
      description: Read one submission's ID, form ID, status, and creation timestamp; answers are intentionally excluded.
      idempotency: none
      authorization: required
      execution:
        executeMethodTimeout: 30s
        durability: async
      branches:
        - {id: found, goName: Found, description: Jotform returned the submission metadata.}
        - {id: notFound, goName: NotFound, description: The submission does not exist or is inaccessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Jotform conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Jotform returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Metadata for one example submission.
          output: {id: "241234567890123456", formId: "241234567890123", status: "ACTIVE", createdAt: "2026-11-07 10:00:00"}
