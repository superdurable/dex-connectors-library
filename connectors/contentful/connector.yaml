apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: contentful
  displayName: Contentful
  description: Read published Contentful entries, assets, content types, spaces, and locales.
  company: Contentful
  categories: [marketing, developer-tools]
  version: v0.3.0
spec:
  provider: contentful
  languages:
    python:
      version: v0.1.0
      operations: [getEntry, listEntries]
      triggers: []
    typescript:
      version: v0.1.1
      package: '@superdurable/connector-contentful'
      operations: [getEntry, listEntries]
      triggers: []
  codegen:
    go:
      package: contentful
  configuration:
    fields:
    - name: baseUrl
      goName: BaseURL
      type: url
      description: Provider REST base URL; leave blank for the displayed public endpoint.
        Override only for a compatible gateway or loopback test server.
      default: https://cdn.contentful.com
    - name: timeout
      goName: Timeout
      type: duration
      description: Maximum time for one HTTP request as a positive Go duration such
        as 15s or 1m; blank uses the displayed default.
      default: 15s
    - name: maxResponseBytes
      goName: MaxResponseBytes
      type: integer
      description: Maximum response body size in bytes; enter a positive integer to
        raise the safety limit for large pages. Blank uses the displayed default.
      default: 2097152
  auth:
    type: apiKey
    connectionKind: contentful-api-key
    fields:
    - name: delivery_token
      goName: DeliveryToken
      type: secretString
      description: Secret Contentful credential. Start at https://app.contentful.com
        and follow the authorization guide to create or find it; paste the token exactly,
        without Bearer. Blank prevents calls. It is sent only in a request header.
      required: true
    guide:
      startURL: https://app.contentful.com
      steps:
      - Open https://app.contentful.com, select a space, then open Settings > API
        keys.
      - Create or select a Content Delivery API key, copy its access token, and paste
        it into secret delivery_token.
      - Find the Space ID on that key page; supply the space and environment IDs in
        each operation input.
      - Find an environment under Settings > Environments, an entry or asset under
        Content or Media, and a content type under Content model. Use their non-secret
        alphanumeric IDs in operation inputs; blank IDs are invalid. For collection
        calls, limit is 1 to 1000 results and skip is a zero-based offset; blank
        values use provider defaults.
      - Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults.
  operations:
  - name: getEntry
    goName: GetEntry
    inputType: GetEntryInput
    outputType: GetEntryOutput
    kind: query
    description: Get one published Contentful entry.
    idempotency: none
    authorization: required
    branches:
    - id: found
      goName: Found
      description: Get one published Contentful entry.
    - id: notFound
      goName: NotFound
      description: The requested provider resource does not exist or is not visible.
      optional: true
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request or credentials.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: defaultGetEntry
      branch: found
      description: A representative provider response for the example resource.
      default: true
      output:
        data:
          sys:
            id: entry-meridian
            type: Entry
          fields:
            title: Meridian
  - name: listEntries
    goName: ListEntries
    inputType: ListEntriesInput
    outputType: ListEntriesOutput
    kind: query
    description: List one page of published entries in a space and environment.
    idempotency: none
    authorization: required
    branches:
    - id: listed
      goName: Listed
      description: List one page of published entries in a space and environment.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request or credentials.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: defaultListEntries
      branch: listed
      description: A representative provider response for the example resource.
      default: true
      output:
        data:
          items:
          - sys:
              id: entry-meridian
              type: Entry
            fields:
              title: Meridian
          total: 1
          skip: 0
          limit: 100
  - name: getAsset
    goName: GetAsset
    inputType: GetAssetInput
    outputType: ContentfulReadOutput
    kind: query
    description: Read one published asset from the Content Delivery API.
    idempotency: none
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: found, goName: Found, description: Contentful returned one published asset.}
    - {id: notFound, goName: NotFound, description: The resource does not exist or is not published., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Contentful rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Contentful returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: "Local input, configuration, or credentials are invalid.", optional: true}
    mocks:
    - name: defaultGetAsset
      branch: found
      default: true
      description: A representative getAsset response.
      output: {"data":{"sys":{"id":"asset-meridian","type":"Asset"},"fields":{"title":"Meridian logo"}}}
  - name: listAssets
    goName: ListAssets
    inputType: ContentfulPageInput
    outputType: ContentfulReadOutput
    kind: query
    description: Read a page of published assets from the Content Delivery API.
    idempotency: none
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: listed, goName: Listed, description: Contentful returned a page of published assets.}
    - {id: providerRejected, goName: ProviderRejected, description: Contentful rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Contentful returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: "Local input, configuration, or credentials are invalid.", optional: true}
    mocks:
    - name: defaultListAssets
      branch: listed
      default: true
      description: A representative listAssets response.
      output: {"data":{"items":[{"sys":{"id":"asset-meridian","type":"Asset"}}],"total":1,"skip":0,"limit":100}}
  - name: getContentType
    goName: GetContentType
    inputType: GetContentTypeInput
    outputType: ContentfulReadOutput
    kind: query
    description: Read one published content type from the Content Delivery API.
    idempotency: none
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: found, goName: Found, description: Contentful returned one published content type.}
    - {id: notFound, goName: NotFound, description: The resource does not exist or is not published., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Contentful rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Contentful returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: "Local input, configuration, or credentials are invalid.", optional: true}
    mocks:
    - name: defaultGetContentType
      branch: found
      default: true
      description: A representative getContentType response.
      output: {"data":{"sys":{"id":"article","type":"ContentType"},"name":"Article","fields":[]}}
  - name: listContentTypes
    goName: ListContentTypes
    inputType: ContentfulPageInput
    outputType: ContentfulReadOutput
    kind: query
    description: Read a page of published content types from the Content Delivery API.
    idempotency: none
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: listed, goName: Listed, description: Contentful returned a page of published content types.}
    - {id: providerRejected, goName: ProviderRejected, description: Contentful rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Contentful returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: "Local input, configuration, or credentials are invalid.", optional: true}
    mocks:
    - name: defaultListContentTypes
      branch: listed
      default: true
      description: A representative listContentTypes response.
      output: {"data":{"items":[{"sys":{"id":"article","type":"ContentType"}}],"total":1,"skip":0,"limit":100}}
  - name: getSpace
    goName: GetSpace
    inputType: GetSpaceInput
    outputType: ContentfulReadOutput
    kind: query
    description: Read one space and its locales from the Content Delivery API.
    idempotency: none
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: found, goName: Found, description: Contentful returned one space and its locales.}
    - {id: notFound, goName: NotFound, description: The resource does not exist or is not published., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Contentful rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Contentful returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: "Local input, configuration, or credentials are invalid.", optional: true}
    mocks:
    - name: defaultGetSpace
      branch: found
      default: true
      description: A representative getSpace response.
      output: {"data":{"sys":{"id":"space-meridian","type":"Space"},"name":"Meridian","locales":[{"code":"en-US","default":true,"name":"English"}]}}
  - name: listLocales
    goName: ListLocales
    inputType: ContentfulPageInput
    outputType: ContentfulReadOutput
    kind: query
    description: Read the locales of one environment from the Content Delivery API.
    idempotency: none
    authorization: required
    execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
    branches:
    - {id: listed, goName: Listed, description: Contentful returned the locales of one environment.}
    - {id: providerRejected, goName: ProviderRejected, description: Contentful rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Contentful returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: "Local input, configuration, or credentials are invalid.", optional: true}
    mocks:
    - name: defaultListLocales
      branch: listed
      default: true
      description: A representative listLocales response.
      output: {"data":{"items":[{"code":"en-US","default":true,"name":"English"}],"total":1,"skip":0,"limit":100}}
