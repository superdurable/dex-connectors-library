apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: contentful
  displayName: Contentful
  description: Contentful REST connector with two bounded operations.
  company: Contentful
  version: v0.2.0
spec:
  provider: contentful
  codegen:
    go:
      package: contentful
  configuration:
    fields:
    - name: baseUrl
      goName: BaseURL
      type: url
      description: Provider REST base URL; leave blank for the displayed public endpoint.
        Override only for a compatible gateway or loopback test server.
      default: https://cdn.contentful.com
    - name: timeout
      goName: Timeout
      type: duration
      description: Maximum time for one HTTP request as a positive Go duration such
        as 15s or 1m; blank uses the displayed default.
      default: 15s
    - name: maxResponseBytes
      goName: MaxResponseBytes
      type: integer
      description: Maximum response body size in bytes; enter a positive integer to
        raise the safety limit for large pages. Blank uses the displayed default.
      default: 2097152
  auth:
    type: apiKey
    connectionKind: contentful-api-key
    fields:
    - name: delivery_token
      goName: DeliveryToken
      type: secretString
      description: Secret Contentful credential. Start at https://app.contentful.com
        and follow the authorization guide to create or find it; paste the token exactly,
        without Bearer. Blank prevents calls. It is sent only in a request header.
      required: true
    guide:
      startURL: https://app.contentful.com
      steps:
      - Open https://app.contentful.com, select a space, then open Settings > API
        keys.
      - Create or select a Content Delivery API key, copy its access token, and paste
        it into secret delivery_token.
      - Find the Space ID on that key page; supply the space and environment IDs in
        each operation input.
      - Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults.
  operations:
  - name: getEntry
    goName: GetEntry
    inputType: GetEntryInput
    outputType: GetEntryOutput
    kind: query
    description: Get one published Contentful entry.
    idempotency: none
    authorization: required
    branches:
    - id: found
      goName: Found
      description: Get one published Contentful entry.
    - id: notFound
      goName: NotFound
      description: The requested provider resource does not exist or is not visible.
      optional: true
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request or credentials.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: defaultGetEntry
      branch: found
      description: A representative provider response for the example resource.
      default: true
      output:
        data:
          sys:
            id: entry-meridian
            type: Entry
          fields:
            title: Meridian
  - name: listEntries
    goName: ListEntries
    inputType: ListEntriesInput
    outputType: ListEntriesOutput
    kind: query
    description: List one page of published entries in a space and environment.
    idempotency: none
    authorization: required
    branches:
    - id: listed
      goName: Listed
      description: List one page of published entries in a space and environment.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider conclusively rejected the request or credentials.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input, configuration, or credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: defaultListEntries
      branch: listed
      description: A representative provider response for the example resource.
      default: true
      output:
        data:
          items:
          - sys:
              id: entry-meridian
              type: Entry
            fields:
              title: Meridian
          total: 1
          skip: 0
          limit: 100
