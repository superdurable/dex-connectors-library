apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: amazon-s3
  displayName: Amazon S3
  description: Manage buckets and bounded objects in Amazon S3 or an S3-compatible store such as Cloudflare R2 or MinIO.
  company: Amazon
  categories: [databases-storage, files-documents]
  version: v0.24.0
spec:
  provider: amazon-s3
  languages:
    python:
      version: v0.1.0
      package: dex-connector-amazon-s3
      operations: [listObjects, headObject, getObjectText, putObject]
      triggers: []
    typescript:
      version: v0.1.1
      operations: [listObjects, headObject, getObjectText, putObject]
      triggers: []
  codegen:
    go:
      package: s3
  configuration:
    fields:
      - name: region
        goName: Region
        type: string
        description: "Signing Region of the bucket, written as a Region code such as eu-west-1. Amazon S3: open https://console.aws.amazon.com/s3/buckets and read the AWS Region column beside the bucket. Cloudflare R2 uses auto. MinIO uses its configured server Region, which a default server does not change. Not secret. A wrong Region selects providerRejected, and an Amazon S3 rejection names the bucket's Region when S3 reports it. Blank uses the displayed default."
        required: false
        default: us-east-1
      - name: endpoint
        goName: Endpoint
        type: url
        description: "Base URL of an S3-compatible API, for a store other than Amazon S3. Cloudflare R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com with the Account ID shown under https://dash.cloudflare.com > R2 object storage > Account Details. MinIO: the server API address, such as https://minio.example.com or http://127.0.0.1:9000 for a server on the Worker's own host. Use HTTPS except for a loopback host; a path is kept as a prefix. The access key is used to sign requests to whatever host this names. Blank uses the Amazon S3 Regional endpoint for region."
        required: false
      - name: addressingStyle
        goName: AddressingStyle
        type: enum
        enum: [auto, virtualHosted, path]
        description: "How a request names its bucket. virtualHosted puts the bucket in the host name, as https://bucket.s3.eu-west-1.amazonaws.com; path puts it first in the path, as https://minio.example.com/bucket. auto uses virtualHosted for Amazon S3 and path for a custom endpoint, and uses path for a bucket name that contains a dot, because the Amazon S3 wildcard certificate cannot match it. Choose virtualHosted for a custom endpoint only when its documentation requires bucket host names. Blank uses the displayed default."
        required: false
        default: auto
      - name: defaultBucket
        goName: DefaultBucket
        type: string
        description: "Bucket an operation uses when its input leaves bucket blank, written as the plain name, such as acme-reports, without s3:// or a path. Amazon S3: copy the name from https://console.aws.amazon.com/s3/buckets. Cloudflare R2: https://dash.cloudflare.com > R2 object storage. MinIO: the server console's Buckets page. Not secret. Blank means every operation input must name its bucket."
        required: false
      - name: listPageSize
        goName: ListPageSize
        type: integer
        description: "Number of keys and common prefixes listObjects requests per page when its input leaves maxKeys at zero, as a whole number from 1 up to the Amazon S3 page limit of 1,000. Smaller pages keep each Result small; larger pages need fewer Steps. Blank uses the displayed default."
        required: false
        default: 100
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum complete listObjects/listFolders/deleteFolder page or getObjectBytes payload in bytes, as a positive integer. A larger list page selects invalidResponse; a larger binary object selects tooLarge. Lower maxKeys or use smaller objects before raising this, because content is stored in Dex Flow state. Blank uses the displayed default."
        required: false
        default: 4194304
      - name: maxTextBytes
        goName: MaxTextBytes
        type: integer
        description: "Maximum object size in bytes that getObjectText returns as text, as a positive integer. A larger object selects tooLarge without reading its content. Text is stored in Dex Flow state, so raise it cautiously. Blank uses the displayed default."
        required: false
        default: 1048576
      - name: maxUploadBytes
        goName: MaxUploadBytes
        type: integer
        description: "Maximum object content in bytes that putObject sends in one request, as a positive integer no larger than 5242880. Larger content selects defect before any request. The content travels through Dex Flow state, so the connector caps it well below the Amazon S3 single-request limit. Blank uses the displayed default."
        required: false
        default: 1048576
  auth:
    type: apiKey
    connectionKind: amazon-s3-access-key
    fields:
      - name: access_key_id
        goName: AccessKeyID
        type: secretString
        description: "Secret-stored access key ID that names the key pair. Amazon S3: https://console.aws.amazon.com/iam > Users > the user > Security credentials > Access keys > Create access key; long-term IDs start with AKIA and temporary IDs with ASIA. Cloudflare R2: the Access Key ID shown once after https://dash.cloudflare.com > R2 object storage > Account Details > API Tokens > Manage > Create Account API token. MinIO: the access key of a user or service account. Dex Web stores it as a secret because it identifies the account; blank means no request can be signed."
        required: true
      - name: secret_access_key
        goName: SecretAccessKey
        type: secretString
        description: "Secret access key paired with access_key_id, shown only once when the key is created: Amazon S3 shows it on the Retrieve access keys page (choose Show or Download .csv file), and Cloudflare R2 shows the Secret Access Key on the token's confirmation page. It signs every request and never leaves the Worker; Dex keeps it out of Flow state, logs, and Results. Blank means no request can be signed."
        required: true
      - name: session_token
        goName: SessionToken
        type: secretString
        description: "Secret session token, only for temporary AWS credentials whose access key ID starts with ASIA, such as the output of aws sts get-session-token or aws sts assume-role (https://docs.aws.amazon.com/STS/latest/APIReference/API_GetSessionToken.html). Temporary credentials expire, usually within hours, and this connector cannot renew them: replace all three values before they expire, or an expired token selects providerRejected. Blank means long-term credentials, which Amazon S3 IAM user keys, Cloudflare R2, and MinIO use."
        required: false
    guide:
      startURL: https://console.aws.amazon.com/iam
      steps:
        - "Amazon S3: open IAM > Users > Create user and create a user only for Dex; do not use the account's root user. On Permissions, attach an inline policy that allows s3:ListBucket on arn:aws:s3:::your-bucket and s3:GetObject, s3:PutObject, and s3:DeleteObject on arn:aws:s3:::your-bucket/*, so the key reaches nothing else. putObject's create-only mode also needs s3:GetObject to recognize its own earlier attempt, and headObject reads a missing key as notFound only with s3:ListBucket."
        - "Open the user > Security credentials > Access keys > Create access key, choose Other > Next, then Create access key. On the Retrieve access keys page choose Show, paste the Access key into access_key_id and the Secret access key into secret_access_key; AWS never shows the secret again. Leave session_token blank for these long-term keys."
        - "Set region to the bucket's AWS Region from https://console.aws.amazon.com/s3/buckets and leave endpoint blank. Optionally set defaultBucket so operations can leave bucket blank."
        - "For listBuckets, optionally grant s3:ListAllMyBuckets on arn:aws:s3:::*. For createBucket and deleteBucket, optionally grant s3:CreateBucket and s3:DeleteBucket on the intended bucket ARNs; deletion requires an empty bucket. These grants are additional to the report-archive example's object permissions. Review the globally unique bucket name before creation."
        - "For copyObject, grant s3:GetObject on the source object ARN and s3:PutObject on the destination object ARN. Its contentType and metadata replace source metadata; sourceETag may pin the source version. getObjectBytes needs s3:GetObject and keeps at most maxResponseBytes in Flow state."
        - "createFolder writes an empty object under a slash-ending prefix and needs s3:PutObject. listFolders needs s3:ListBucket. deleteFolder recursively removes every current key beneath the chosen prefix and needs both s3:ListBucket and s3:DeleteObject; use a narrowly scoped temporary prefix for the example Flow."
        - "Cloudflare R2: open https://dash.cloudflare.com > R2 object storage > Account Details > API Tokens > Manage, choose Create Account API token with Object Read & Write scoped to the bucket, and copy the Access Key ID and Secret Access Key shown once. Set endpoint to https://<ACCOUNT_ID>.r2.cloudflarestorage.com and region to auto."
        - "MinIO: create a user or service account with a policy limited to the bucket, then set endpoint to the server's API address, keep addressingStyle at auto so requests use path addressing, and set region to the server's Region, which a default server leaves at us-east-1."
        - "To rotate, create a second access key, save it here, run a Flow, then open Actions > Deactivate and Actions > Delete on the old key. This release does not use IAM roles, instance profiles, or SSO; temporary credentials pasted with session_token stop working when they expire."
  operations:
    - name: listBuckets
      goName: ListBuckets
      inputType: ListBucketsInput
      outputType: ListBucketsOutput
      kind: query
      description: List one bounded page of buckets owned by the signing account.
      idempotency: none
      authorization: required
      pagination: {inputField: continuationToken, nextField: nextContinuationToken}
      branches:
        - {id: listed, goName: Listed, description: S3 returned a page of buckets.}
        - {id: providerRejected, goName: ProviderRejected, description: S3 conclusively rejected the bucket list., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: S3 returned an invalid or oversized bucket list., optional: true}
        - {id: defect, goName: Defect, description: Local input or configuration is invalid., optional: true}
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: ownedBuckets
          branch: listed
          default: true
          description: The AWS account owns several report and archive buckets.
          pages:
            - {buckets: [{name: acme-reports, creationDate: "2026-10-25T09:00:00Z", region: eu-west-1}], nextContinuationToken: bucket-page-2}
            - {buckets: [{name: acme-archive, creationDate: "2026-10-24T09:00:00Z", region: eu-west-1}], nextContinuationToken: bucket-page-3}
            - {buckets: [{name: acme-backups, creationDate: "2026-10-23T09:00:00Z", region: eu-west-1}]}
    - name: createBucket
      goName: CreateBucket
      inputType: CreateBucketInput
      outputType: CreatedBucket
      kind: mutation
      description: Create a general purpose bucket in the connection Region, with bounded sends and read-back after an unknown outcome.
      idempotency: required
      authorization: required
      branches:
        - {id: created, goName: Created, description: S3 accepted creation or a previous attempt was confirmed.}
        - {id: providerRejected, goName: ProviderRejected, description: S3 refused the bucket name or permission., optional: true}
        - {id: defect, goName: Defect, description: The bucket name or connection is invalid., optional: true}
      execution:
        repeatOnUnknown: limited
        maxSends: 3
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
      mocks:
        - name: createdBucket
          branch: created
          default: true
          description: A new reports bucket was accepted.
          output: {bucket: acme-reports, region: eu-west-1}
    - name: deleteBucket
      goName: DeleteBucket
      inputType: DeleteBucketInput
      outputType: DeletedBucket
      kind: mutation
      description: Delete an empty bucket; an already absent bucket is considered deleted.
      idempotency: required
      authorization: required
      branches:
        - {id: deleted, goName: Deleted, description: The empty bucket is absent.}
        - {id: providerRejected, goName: ProviderRejected, description: "S3 refused deletion, including when the bucket is not empty.", optional: true}
        - {id: defect, goName: Defect, description: The bucket name or connection is invalid., optional: true}
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: deletedBucket
          branch: deleted
          default: true
          description: An empty reports bucket was removed.
          output: {bucket: acme-reports}
    - name: createFolder
      goName: CreateFolder
      inputType: CreateFolderInput
      outputType: CreatedFolder
      kind: mutation
      description: Create or replace a zero-byte folder marker at a key ending in a slash.
      idempotency: required
      authorization: required
      branches:
        - {id: created, goName: Created, description: The folder marker was stored.}
        - {id: providerRejected, goName: ProviderRejected, description: S3 conclusively refused the marker write., optional: true}
        - {id: defect, goName: Defect, description: The bucket or folder prefix is invalid., optional: true}
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: createdFolder
          branch: created
          default: true
          description: A reports folder marker was stored.
          output: {bucket: acme-reports, prefix: reports/2026/}
    - name: deleteFolder
      goName: DeleteFolder
      inputType: DeleteFolderInput
      outputType: DeletedFolder
      kind: mutation
      description: Repeatedly list and delete all current objects under a folder prefix in bounded pages.
      idempotency: required
      authorization: required
      branches:
        - {id: deleted, goName: Deleted, description: No current object remains under the prefix.}
        - {id: providerRejected, goName: ProviderRejected, description: S3 conclusively refused a list or delete., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: S3 returned an invalid or oversized list page., optional: true}
        - {id: defect, goName: Defect, description: The bucket or folder prefix is invalid., optional: true}
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: deletedFolder
          branch: deleted
          default: true
          description: All current objects under reports/2026/ are absent.
          output: {bucket: acme-reports, prefix: reports/2026/}
    - name: listFolders
      goName: ListFolders
      inputType: ListFoldersInput
      outputType: ListFoldersOutput
      kind: query
      description: List one bounded page of immediate child folder prefixes beneath a parent prefix.
      idempotency: none
      authorization: required
      pagination: {inputField: continuationToken, nextField: nextContinuationToken}
      branches:
        - {id: listed, goName: Listed, description: One or more child folders or another page exists.}
        - {id: notFound, goName: NotFound, description: No child folder matched and no page remains., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: S3 conclusively refused the listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: S3 returned an invalid or oversized page., optional: true}
        - {id: defect, goName: Defect, description: The bucket or prefix is invalid., optional: true}
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: childFolders
          branch: listed
          default: true
          description: Three pages of report child folders are available.
          pages:
            - {bucket: acme-reports, parentPrefix: reports/, folders: [reports/2024/], isTruncated: true, nextContinuationToken: folders-page-2}
            - {bucket: acme-reports, parentPrefix: reports/, folders: [reports/2025/], isTruncated: true, nextContinuationToken: folders-page-3}
            - {bucket: acme-reports, parentPrefix: reports/, folders: [reports/2026/], isTruncated: false}
    - name: listObjects
      goName: ListObjects
      inputType: ListObjectsInput
      outputType: ListObjectsOutput
      kind: query
      description: List one bounded page of a bucket's object keys and common prefixes under an optional prefix and delimiter, in key order, continuing with an opaque continuation token.
      idempotency: none
      authorization: required
      pagination: {inputField: continuationToken, nextField: nextContinuationToken}
      branches:
        - {id: found, goName: Found, description: "The page holds objects or common prefixes, or more pages remain."}
        - {id: notFound, goName: NotFound, description: No object matched the prefix and no further page remains., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "The store conclusively rejected the list, such as a missing bucket, a wrong Region, invalid credentials, or missing s3:ListBucket permission.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The store returned an invalid or oversized list page., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: archivedReports
          branch: found
          description: Listing reports/ in acme-reports returns three ordered pages including ops-weekly.md.
          default: true
          pages:
            - {bucket: acme-reports, prefix: reports/, objects: [{key: reports/ops-weekly.md, sizeBytes: 72, eTag: '"eccaf41434e0ed82b7154a7fd586cc58"', lastModified: "2026-10-25T09:00:00Z"}], isTruncated: true, nextContinuationToken: page-2}
            - {bucket: acme-reports, prefix: reports/, objects: [{key: reports/q1.md, sizeBytes: 31, lastModified: "2026-09-01T09:00:00Z"}], isTruncated: true, nextContinuationToken: page-3}
            - {bucket: acme-reports, prefix: reports/, objects: [{key: reports/team.md, sizeBytes: 48, lastModified: "2026-08-01T09:00:00Z"}], isTruncated: false}
        - name: noReports
          branch: notFound
          description: Listing reports/missing/ in acme-reports finds no objects or further pages.
          output: {bucket: acme-reports, prefix: reports/missing/, isTruncated: false}
          failure: {kind: NOT_FOUND, message: No objects matched the prefix.}
        - name: listDenied
          branch: providerRejected
          description: "Listing reports/ without s3:ListBucket permission is denied."
          failure: {kind: AUTHORIZATION, message: S3 denied the bucket listing.}
    - name: headObject
      goName: HeadObject
      inputType: HeadObjectInput
      outputType: ObjectMetadata
      kind: query
      description: Read one object's size, ETag, content type, modification time, version, storage class, and user-defined metadata without reading its content.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: The store returned the object's metadata.}
        - {id: notFound, goName: NotFound, description: "The object, or its bucket, does not exist; a HEAD response cannot say which.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "The store conclusively rejected the read, such as a wrong Region, invalid credentials, or missing s3:GetObject permission.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The store returned metadata without a valid size or modification time., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: archivedReportMetadata
          branch: found
          description: Reading metadata for reports/ops-weekly.md returns its saved size, ETag, and content type.
          default: true
          output: {bucket: acme-reports, key: reports/ops-weekly.md, sizeBytes: 72, eTag: '"eccaf41434e0ed82b7154a7fd586cc58"', contentType: text/markdown; charset=utf-8, lastModified: "2026-10-25T09:00:00Z", metadata: {report-id: ops-weekly, generator: dex-s3-report-archive, dex-idempotency-key: 8a62f575-7f36-5370-af29-4aadf17e894c}}
        - name: missingReportMetadata
          branch: notFound
          description: Reading metadata for reports/missing.md finds no object.
          output: {bucket: acme-reports, key: reports/missing.md}
          failure: {kind: NOT_FOUND, message: The object was not found.}
        - name: metadataDenied
          branch: providerRejected
          description: "Reading reports/ops-weekly.md metadata without s3:GetObject permission is denied."
          failure: {kind: AUTHORIZATION, message: S3 denied the metadata read.}
    - name: getObjectText
      goName: GetObjectText
      inputType: GetObjectTextInput
      outputType: ObjectText
      kind: query
      description: Read one small text object as bounded UTF-8 text, refusing binary, compressed, and oversized objects without returning their content.
      idempotency: none
      authorization: required
      branches:
        - {id: read, goName: Read, description: The object's complete text was read within maxTextBytes.}
        - {id: notFound, goName: NotFound, description: The object does not exist., optional: true}
        - {id: unsupportedContent, goName: UnsupportedContent, description: "The object's content type is not text, its content is encoded such as gzip, or its bytes are not valid UTF-8 text.", optional: true}
        - {id: tooLarge, goName: TooLarge, description: The object is larger than maxTextBytes., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "The store conclusively rejected the read, such as a missing bucket, a wrong Region, invalid credentials, or missing s3:GetObject permission.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The store returned a response without a valid size or with content that contains the connection's credentials., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: archivedReportText
          branch: read
          description: Reading reports/ops-weekly.md returns the generated Ops weekly Markdown report.
          default: true
          output: {bucket: acme-reports, key: reports/ops-weekly.md, contentType: text/markdown; charset=utf-8, eTag: '"eccaf41434e0ed82b7154a7fd586cc58"', lastModified: "2026-10-25T09:00:00Z", sizeBytes: 72, text: "# Ops weekly\n\nReport ID: ops-weekly\n\n- Refunds above 500 need approval.\n"}
        - name: missingReportText
          branch: notFound
          description: Reading reports/missing.md finds no object.
          output: {bucket: acme-reports, key: reports/missing.md}
          failure: {kind: NOT_FOUND, message: The object was not found.}
        - name: binaryReport
          branch: unsupportedContent
          description: Reading reports/diagram.pdf refuses its application/pdf content type.
          output: {bucket: acme-reports, key: reports/diagram.pdf, contentType: application/pdf, sizeBytes: 2048}
          failure: {kind: VALIDATION, message: The object is not UTF-8 text.}
        - name: oversizedReport
          branch: tooLarge
          description: Reading reports/archive-large.md refuses an object larger than maxTextBytes.
          output: {bucket: acme-reports, key: reports/archive-large.md, contentType: text/markdown, sizeBytes: 5242880}
          failure: {kind: RESPONSE_TOO_LARGE, message: The object exceeds maxTextBytes.}
        - name: textReadDenied
          branch: providerRejected
          description: "Reading reports/ops-weekly.md without s3:GetObject permission is denied."
          failure: {kind: AUTHORIZATION, message: S3 denied the object read.}
    - name: getObjectBytes
      goName: GetObjectBytes
      inputType: GetObjectBytesInput
      outputType: ObjectBytes
      kind: query
      description: Read one complete bounded object as bytes, including non-text media types, storing base64-encoded bytes in Flow state.
      idempotency: none
      authorization: required
      branches:
        - {id: read, goName: Read, description: The complete object fits maxResponseBytes.}
        - {id: notFound, goName: NotFound, description: The object does not exist., optional: true}
        - {id: tooLarge, goName: TooLarge, description: The object exceeds maxResponseBytes., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: S3 returned incomplete or secret-bearing bytes., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: S3 conclusively refused the read., optional: true}
        - {id: defect, goName: Defect, description: The object location or connection is invalid., optional: true}
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: reportBytes
          branch: read
          default: true
          description: A bounded Markdown report is returned as bytes.
          output: {bucket: acme-reports, key: reports/ops-weekly.md, contentType: text/markdown, sizeBytes: 6, bytes: d2Vla2x5}
        - name: bytesTooLarge
          branch: tooLarge
          description: An object beyond the response limit is refused.
          output: {bucket: acme-reports, key: reports/large.bin, sizeBytes: 10485760}
          failure: {kind: RESPONSE_TOO_LARGE, message: The object exceeds maxResponseBytes.}
    - name: putObject
      goName: PutObject
      inputType: PutObjectInput
      outputType: StoredObject
      kind: mutation
      description: Store one object from bounded text or bytes with its content type and user-defined metadata, either replacing any object at the key or, in create-only mode, only when the key is free; a repeated attempt of the same Step converges on the same object.
      idempotency: required
      authorization: required
      branches:
        - {id: stored, goName: Stored, description: The store holds the object this Step execution wrote.}
        - {id: alreadyExists, goName: AlreadyExists, description: "Create-only mode found an object at the key that this Step execution did not write; nothing was written.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "The store conclusively rejected the write, such as a missing bucket, a wrong Region, invalid credentials, missing s3:PutObject permission, or a store that does not support create-only writes.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: storedOpsReport
          branch: stored
          description: Storing reports/ops-weekly.md in acme-reports saves the generated Ops weekly report.
          default: true
          output: {bucket: acme-reports, key: reports/ops-weekly.md, eTag: '"eccaf41434e0ed82b7154a7fd586cc58"', sizeBytes: 72, contentType: text/markdown; charset=utf-8}
        - name: reportAlreadyExists
          branch: alreadyExists
          description: Creating reports/ops-weekly.md when another report already occupies the key returns that object.
          output: {bucket: acme-reports, key: reports/ops-weekly.md, eTag: '"existing-report"', sizeBytes: 43, contentType: text/markdown; charset=utf-8, lastModified: "2026-10-24T09:00:00Z"}
          failure: {kind: CONFLICT, message: Another object already occupies the key.}
        - name: storeDenied
          branch: providerRejected
          description: "Storing reports/ops-weekly.md without s3:PutObject permission is denied."
          failure: {kind: AUTHORIZATION, message: S3 denied the object write.}
    - name: copyObject
      goName: CopyObject
      inputType: CopyObjectInput
      outputType: CopiedObject
      kind: mutation
      description: Copy an object to a destination key with bounded sends, replacement metadata, and read-back by a Dex marker after an unknown result.
      idempotency: required
      authorization: required
      branches:
        - {id: copied, goName: Copied, description: S3 accepted the copy or read-back confirmed an earlier send.}
        - {id: providerRejected, goName: ProviderRejected, description: S3 conclusively refused the source or destination., optional: true}
        - {id: defect, goName: Defect, description: The object locations or copy metadata are invalid., optional: true}
      execution:
        repeatOnUnknown: limited
        maxSends: 3
        executeMethodTimeout: 30s
        durability: sync
        dispatchFence: true
      mocks:
        - name: copiedReport
          branch: copied
          default: true
