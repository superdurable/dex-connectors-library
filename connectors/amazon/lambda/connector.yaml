apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: amazon-lambda
  displayName: Amazon Lambda
  description: Read Lambda function configuration with AWS Signature Version 4.
  company: Amazon
  version: v0.1.0
spec:
  provider: amazon-lambda
  languages:
    python:
      version: v0.1.0
      package: dex-connector-amazon-lambda
      operations: [getFunction]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-amazon-lambda'
      operations: [getFunction]
      triggers: []
  codegen:
    go:
      package: lambda
  configuration:
    fields:
      - name: region
        goName: Region
        type: string
        default: us-east-1
        description: AWS Region of the Lambda function, as a Region code such as eu-west-1. In https://console.aws.amazon.com/lambda > Functions, use the console Region selector and the function ARN. Blank uses the displayed default; change it when your function is elsewhere.
      - name: endpoint
        goName: Endpoint
        type: url
        description: Optional Lambda-compatible API root. Blank derives the regional AWS endpoint from region. Override only for a trusted compatible endpoint; local tests may use loopback HTTP.
      - name: timeout
        goName: Timeout
        type: duration
        default: 15s
        description: Maximum duration of one GetFunction request as a positive Go duration such as 15s. Blank uses the displayed default; increase only for a slow network.
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        default: 2097152
        description: Maximum complete function metadata response in bytes. Blank uses the displayed default; increase only for unusually large responses.
  auth:
    type: apiKey
    connectionKind: amazon-lambda-access-key
    fields:
      - name: access_key_id
        goName: AccessKeyID
        type: secretString
        required: true
        description: Secret-stored AWS access key ID from https://console.aws.amazon.com/iam > Users > selected user > Security credentials > Access keys > Create access key. Long-term IDs start AKIA and temporary IDs start ASIA. Blank prevents signing. Dex stores it as a secret.
      - name: secret_access_key
        goName: SecretAccessKey
        type: secretString
        required: true
        description: Secret access key paired with access_key_id, shown once on the IAM Retrieve access keys page. Copy the Value, never the key ID. Blank prevents signing; rotate by creating another key and deleting the old one after verification.
      - name: session_token
        goName: SessionToken
        type: secretString
        description: Secret session token for temporary ASIA credentials, from AWS STS. Blank means long-term IAM user credentials. Temporary credentials expire; replace all three fields before expiry.
    guide:
      startURL: https://console.aws.amazon.com/iam
      steps:
        - Open IAM > Users > Create user for Dex. Give it only lambda:GetFunction on the function ARN; do not use the root user. A function's ARN is visible at https://console.aws.amazon.com/lambda > Functions > selected function > Function overview.
        - Open the IAM user > Security credentials > Access keys > Create access key > Other. Copy the Access key ID to secret access_key_id and the one-time Secret access key Value to secret_access_key. Leave session_token blank for long-term keys; include it for temporary ASIA keys.
        - Open https://console.aws.amazon.com/lambda > Functions, choose the Region in the console selector, and set region to that Region code. Leave endpoint blank for AWS. Supply the function name, 1 to 64 letters, digits, underscores, or hyphens, to getFunction; blank is invalid.
        - Rotate the key under IAM > Users > selected user > Security credentials > Access keys by creating a second key, updating this connection, verifying a Flow, then deactivating and deleting the old key.
  operations:
    - name: getFunction
      goName: GetFunction
      inputType: GetFunctionInput
      outputType: FunctionDetails
      kind: query
      description: Read the function name and ARN from AWS Lambda GetFunction.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: AWS returned the function configuration.}
        - {id: missing, goName: Missing, description: The function does not exist in the selected Region., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: AWS conclusively rejected the request or credentials., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: AWS returned malformed or oversized function metadata., optional: true}
        - {id: defect, goName: Defect, description: "The function name, endpoint, Region, or credentials are invalid.", optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One example function exists.
          output: {name: example-function, arn: 'arn:aws:lambda:us-east-1:123456789012:function:example-function'}
