apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: amazon-sns
  displayName: Amazon SNS
  description: List SNS topics with AWS Signature Version 4.
  company: Amazon
  version: v0.1.0
spec:
  provider: amazon-sns
  languages:
    python:
      version: v0.1.0
      package: dex-connector-amazon-sns
      operations: [listTopics]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-amazon-sns'
      operations: [listTopics]
      triggers: []
  codegen:
    go:
      package: sns
  configuration:
    fields:
      - name: region
        goName: Region
        type: string
        default: us-east-1
        description: AWS Region code for the topics, such as eu-west-1. In https://console.aws.amazon.com/sns > Topics, use the console Region selector; blank uses the displayed default.
      - name: endpoint
        goName: Endpoint
        type: url
        description: Optional SNS-compatible API root. Blank derives the regional AWS endpoint from region. Override only for a trusted compatible endpoint; local tests may use loopback HTTP.
      - name: timeout
        goName: Timeout
        type: duration
        default: 15s
        description: Maximum duration of one ListTopics request as a positive Go duration such as 15s. Blank uses the displayed default; increase only for a slow network.
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        default: 2097152
        description: Maximum complete topic list response in bytes. Blank uses the displayed default; increase only for unusually large responses.
  auth:
    type: apiKey
    connectionKind: amazon-sns-access-key
    fields:
      - name: access_key_id
        goName: AccessKeyID
        type: secretString
        required: true
        description: Secret-stored AWS access key ID from https://console.aws.amazon.com/iam > Users > selected user > Security credentials > Access keys > Create access key. Long-term IDs start AKIA and temporary IDs start ASIA. Blank prevents signing.
      - name: secret_access_key
        goName: SecretAccessKey
        type: secretString
        required: true
        description: Secret access key paired with access_key_id, shown once on the IAM Retrieve access keys page. Copy the Value, never the key ID. Blank prevents signing; rotate through IAM.
      - name: session_token
        goName: SessionToken
        type: secretString
        description: Secret session token for temporary ASIA credentials, from AWS STS. Blank means long-term IAM user credentials. Temporary credentials expire; replace all three fields before expiry.
    guide:
      startURL: https://console.aws.amazon.com/iam
      steps:
        - Open IAM > Users > Create user for Dex. Grant sns:ListTopics; do not use the root user. Topics are visible at https://console.aws.amazon.com/sns > Topics in the selected Region.
        - Open the IAM user > Security credentials > Access keys > Create access key > Other. Copy the Access key ID to secret access_key_id and the one-time Secret access key Value to secret_access_key. Leave session_token blank for long-term keys; include it for temporary ASIA keys.
        - Open https://console.aws.amazon.com/sns > Topics, choose the Region in the console selector, and set region to that Region code. Leave endpoint blank for AWS. Leave nextToken blank for the first page; pass the returned token to listTopics for the next page.
        - Rotate the key under IAM > Users > selected user > Security credentials > Access keys by creating a second key, updating this connection, verifying a Flow, then deactivating and deleting the old key.
  operations:
    - name: listTopics
      goName: ListTopics
      inputType: ListTopicsInput
      outputType: TopicPage
      kind: query
      description: Read one page of SNS topic ARNs and its next-page token.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: page, goName: Page, description: "AWS returned one topic page, which may be empty."}
        - {id: providerRejected, goName: ProviderRejected, description: AWS conclusively rejected the request or credentials., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: AWS returned malformed or oversized topic XML., optional: true}
        - {id: defect, goName: Defect, description: "The pagination token, endpoint, Region, or credentials are invalid.", optional: true}
      mocks:
        - name: pageDefault
          branch: page
          default: true
          description: One example topic is in the first page.
          output: {topicARNs: ['arn:aws:sns:us-east-1:123456789012:example-topic'], nextToken: ''}
