apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: amazon-sns
  displayName: Amazon SNS
  description: Manage SNS topics and subscriptions, and publish messages with AWS Signature Version 4.
  company: Amazon
  categories: [developer-tools, communication]
  version: v0.2.0
spec:
  provider: amazon-sns
  languages:
    python:
      version: v0.1.0
      package: dex-connector-amazon-sns
      operations: [listTopics]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-amazon-sns'
      operations: [listTopics]
      triggers: []
  codegen:
    go:
      package: sns
  configuration:
    fields:
      - name: region
        goName: Region
        type: string
        default: us-east-1
        description: AWS Region code for the topics, such as eu-west-1. In https://console.aws.amazon.com/sns > Topics, use the console Region selector; blank uses the displayed default.
      - name: endpoint
        goName: Endpoint
        type: url
        description: Optional SNS-compatible API root. Blank derives the regional AWS endpoint from region. Override only for a trusted compatible endpoint; local tests may use loopback HTTP.
      - name: timeout
        goName: Timeout
        type: duration
        default: 15s
        description: Maximum duration of one SNS API request as a positive Go duration such as 15s. Blank uses the displayed default; increase only for a slow network.
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        default: 2097152
        description: Maximum complete SNS API response in bytes. Blank uses the displayed default; increase only for unusually large responses.
  auth:
    type: apiKey
    connectionKind: amazon-sns-access-key
    fields:
      - name: access_key_id
        goName: AccessKeyID
        type: secretString
        required: true
        description: Secret-stored AWS access key ID from https://console.aws.amazon.com/iam > Users > selected user > Security credentials > Access keys > Create access key. Long-term IDs start AKIA and temporary IDs start ASIA. Blank prevents signing.
      - name: secret_access_key
        goName: SecretAccessKey
        type: secretString
        required: true
        description: Secret access key paired with access_key_id, shown once on the IAM Retrieve access keys page. Copy the Value, never the key ID. Blank prevents signing; rotate through IAM.
      - name: session_token
        goName: SessionToken
        type: secretString
        description: Secret session token for temporary ASIA credentials, from AWS STS. Blank means long-term IAM user credentials. Temporary credentials expire; replace all three fields before expiry.
    guide:
      startURL: https://console.aws.amazon.com/iam
      steps:
        - Open IAM > Users > Create user for Dex. Grant sns:ListTopics and the operation permissions you use (sns:CreateTopic, sns:DeleteTopic, sns:SetTopicAttributes, sns:Publish, sns:Subscribe, sns:Unsubscribe, sns:ListSubscriptionsByTopic, sns:ListSubscriptions, sns:GetSubscriptionAttributes, sns:SetSubscriptionAttributes); do not use the root user. Topics and subscriptions are visible at https://console.aws.amazon.com/sns in the selected Region.
        - Open the IAM user > Security credentials > Access keys > Create access key > Other. Copy the Access key ID to secret access_key_id and the one-time Secret access key Value to secret_access_key. Leave session_token blank for long-term keys; include it for temporary ASIA keys.
        - Open https://console.aws.amazon.com/sns > Topics, choose the Region in the console selector, and set region to that Region code. Leave endpoint blank for AWS. Copy the full Topic ARN from a selected topic for deleteTopic, setTopicAttribute, or publishMessage. Leave nextToken blank for the first listTopics page; pass the returned token for the next page.
        - Rotate the key under IAM > Users > selected user > Security credentials > Access keys by creating a second key, updating this connection, verifying a Flow, then deactivating and deleting the old key.
  operations:
    - name: createTopic
      goName: CreateTopic
      inputType: CreateTopicInput
      outputType: TopicIdentity
      kind: mutation
      description: Create or return a standard SNS topic with the supplied name.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: created, goName: Created, description: AWS created or found the named topic.}
        - {id: providerRejected, goName: ProviderRejected, description: AWS conclusively rejected the topic name or permissions., optional: true}
        - {id: defect, goName: Defect, description: The topic name or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: The named topic exists.
          output: {topicARN: 'arn:aws:sns:us-east-1:123456789012:example-topic'}
    - name: deleteTopic
      goName: DeleteTopic
      inputType: TopicARNInput
      outputType: TopicIdentity
      kind: mutation
      description: Delete a topic and its subscriptions by ARN; repeated deletion succeeds.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: AWS deleted the topic or it was already absent.}
        - {id: providerRejected, goName: ProviderRejected, description: AWS conclusively rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: The topic ARN or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: The topic is absent.
          output: {topicARN: 'arn:aws:sns:us-east-1:123456789012:example-topic'}
    - name: setTopicAttribute
      goName: SetTopicAttribute
      inputType: SetTopicAttributeInput
      outputType: TopicIdentity
      kind: mutation
      description: Replace one SNS topic attribute with an absolute value.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: AWS replaced the attribute.}
        - {id: providerRejected, goName: ProviderRejected, description: AWS conclusively rejected the attribute update., optional: true}
        - {id: defect, goName: Defect, description: "The topic ARN, attribute, or credentials are invalid.", optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: The display name was replaced.
          output: {topicARN: 'arn:aws:sns:us-east-1:123456789012:example-topic'}
    - name: publishMessage
      goName: PublishMessage
      inputType: PublishMessageInput
      outputType: PublishedMessage
      kind: mutation
      description: Publish one UTF-8 message to a topic; duplicate delivery is possible after an unknown outcome.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3, dispatchFence: true}
      branches:
        - {id: published, goName: Published, description: AWS accepted the message.}
        - {id: providerRejected, goName: ProviderRejected, description: AWS conclusively rejected the message., optional: true}
        - {id: uncertain, goName: Uncertain, description: AWS may have accepted the message but did not return a usable ID., optional: true}
        - {id: defect, goName: Defect, description: "The topic ARN, message, or credentials are invalid.", optional: true}
      mocks:
        - name: publishedDefault
          branch: published
          default: true
          description: SNS accepted one message.
          output: {messageID: 'example-message-id'}
    - name: listTopics
      goName: ListTopics
      inputType: ListTopicsInput
      outputType: TopicPage
      kind: query
      description: Read one page of SNS topic ARNs and its next-page token.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: page, goName: Page, description: "AWS returned one topic page, which may be empty."}
        - {id: providerRejected, goName: ProviderRejected, description: AWS conclusively rejected the request or credentials., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: AWS returned malformed or oversized topic XML., optional: true}
        - {id: defect, goName: Defect, description: "The pagination token, endpoint, Region, or credentials are invalid.", optional: true}
      mocks:
        - name: pageDefault
          branch: page
          default: true
          description: One example topic is in the first page.
          output: {topicARNs: ['arn:aws:sns:us-east-1:123456789012:example-topic'], nextToken: ''}
    - name: subscribeEndpoint
      goName: SubscribeEndpoint
      inputType: SubscribeEndpointInput
      outputType: SubscriptionIdentity
      kind: mutation
      description: Subscribe one HTTPS, email, SQS, or Lambda endpoint to a topic with bounded possible requests.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3, dispatchFence: true}
      branches:
        - {id: subscribed, goName: Subscribed, description: SNS accepted or read-back confirmed the subscription.}
        - {id: providerRejected, goName: ProviderRejected, description: SNS conclusively rejected the endpoint or topic., optional: true}
        - {id: uncertain, goName: Uncertain, description: The subscription may exist but read-back could not confirm it., optional: true}
        - {id: defect, goName: Defect, description: "The topic, protocol, endpoint, or credentials are invalid.", optional: true}
      mocks:
        - {name: subscribedDefault, branch: subscribed, default: true, description: SNS accepted one HTTPS subscription., output: {subscriptionARN: 'arn:aws:sns:us-east-1:123456789012:example-topic:11111111-1111-4111-8111-111111111111', topicARN: 'arn:aws:sns:us-east-1:123456789012:example-topic', protocol: https, endpoint: 'https://example.com/sns'}}
    - name: listSubscriptionsByTopic
      goName: ListSubscriptionsByTopic
      inputType: ListSubscriptionsByTopicInput
      outputType: SubscriptionPage
      kind: query
      description: List one page of subscriptions for a topic.
      idempotency: none
      authorization: required
      pagination: {inputField: nextToken, nextField: nextToken}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: page, goName: Page, description: SNS returned one page of subscriptions.}
        - {id: providerRejected, goName: ProviderRejected, description: SNS refused the listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: SNS returned malformed subscription XML., optional: true}
        - {id: defect, goName: Defect, description: The topic ARN or token is invalid., optional: true}
      mocks:
        - name: topicSubscriptionPages
          branch: page
          default: true
          description: Three pages of topic subscriptions.
          pages:
            - {subscriptions: [{subscriptionARN: 'arn:aws:sns:us-east-1:123456789012:example-topic:11111111-1111-4111-8111-111111111111', topicARN: 'arn:aws:sns:us-east-1:123456789012:example-topic', protocol: https, endpoint: 'https://example.com/sns', owner: '123456789012'}], nextToken: subscription-page-2}
            - {subscriptions: [{subscriptionARN: 'arn:aws:sns:us-east-1:123456789012:example-topic:22222222-2222-4222-8222-222222222222', topicARN: 'arn:aws:sns:us-east-1:123456789012:example-topic', protocol: email, endpoint: 'reader@example.net', owner: '123456789012'}], nextToken: subscription-page-3}
            - {subscriptions: [{subscriptionARN: 'arn:aws:sns:us-east-1:123456789012:example-topic:33333333-3333-4333-8333-333333333333', topicARN: 'arn:aws:sns:us-east-1:123456789012:example-topic', protocol: sqs, endpoint: 'arn:aws:sqs:us-east-1:123456789012:queue', owner: '123456789012'}]}
    - name: listSubscriptions
      goName: ListSubscriptions
      inputType: ListSubscriptionsInput
      outputType: SubscriptionPage
      kind: query
      description: List one page of account subscriptions.
      idempotency: none
      authorization: required
      pagination: {inputField: nextToken, nextField: nextToken}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: page, goName: Page, description: SNS returned one page of account subscriptions.}
        - {id: providerRejected, goName: ProviderRejected, description: SNS refused the listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: SNS returned malformed subscription XML., optional: true}
        - {id: defect, goName: Defect, description: The token or credentials are invalid., optional: true}
      mocks:
        - name: accountSubscriptionPages
          branch: page
          default: true
          description: Three pages of account subscriptions.
          pages:
            - {subscriptions: [{subscriptionARN: 'arn:aws:sns:us-east-1:123456789012:example-topic:11111111-1111-4111-8111-111111111111', topicARN: 'arn:aws:sns:us-east-1:123456789012:example-topic', protocol: https, endpoint: 'https://example.com/sns', owner: '123456789012'}], nextToken: account-page-2}
            - {subscriptions: [{subscriptionARN: 'arn:aws:sns:us-east-1:123456789012:example-topic:22222222-2222-4222-8222-222222222222', topicARN: 'arn:aws:sns:us-east-1:123456789012:example-topic', protocol: email, endpoint: 'reader@example.net', owner: '123456789012'}], nextToken: account-page-3}
            - {subscriptions: []}
    - name: getSubscriptionAttributes
      goName: GetSubscriptionAttributes
      inputType: SubscriptionARNInput
      outputType: SubscriptionAttributes
      kind: query
      description: Read non-secret SNS subscription attributes.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: SNS returned subscription attributes.}
        - {id: missing, goName: Missing, description: The subscription is absent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: SNS refused the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: SNS returned invalid attributes., optional: true}
        - {id: defect, goName: Defect, description: The subscription ARN or credentials are invalid., optional: true}
      mocks:
        - {name: foundAttributes, branch: found, default: true, description: SNS returned one confirmed subscription., output: {subscriptionARN: 'arn:aws:sns:us-east-1:123456789012:example-topic:11111111-1111-4111-8111-111111111111', attributes: {PendingConfirmation: 'false', RawMessageDelivery: 'false'}}}
    - name: setSubscriptionAttribute
      goName: SetSubscriptionAttribute
      inputType: SetSubscriptionAttributeInput
      outputType: SubscriptionIdentity
      kind: mutation
      description: Replace one subscription delivery or filter attribute.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: SNS accepted the absolute replacement.}
        - {id: providerRejected, goName: ProviderRejected, description: SNS refused the update., optional: true}
        - {id: defect, goName: Defect, description: The subscription ARN or attribute is invalid., optional: true}
      mocks:
        - {name: updatedSubscription, branch: updated, default: true, description: SNS enabled raw delivery., output: {subscriptionARN: 'arn:aws:sns:us-east-1:123456789012:example-topic:11111111-1111-4111-8111-111111111111'}}
    - name: unsubscribeEndpoint
      goName: UnsubscribeEndpoint
      inputType: SubscriptionARNInput
      outputType: SubscriptionIdentity
      kind: mutation
      description: Delete a subscription; absence is success.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: unsubscribed, goName: Unsubscribed, description: The subscription is absent.}
        - {id: providerRejected, goName: ProviderRejected, description: SNS refused the deletion., optional: true}
        - {id: defect, goName: Defect, description: The subscription ARN is invalid., optional: true}
      mocks:
        - {name: unsubscribedDefault, branch: unsubscribed, default: true, description: SNS removed one subscription., output: {subscriptionARN: 'arn:aws:sns:us-east-1:123456789012:example-topic:11111111-1111-4111-8111-111111111111'}}
