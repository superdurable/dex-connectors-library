apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: kimi
  displayName: Kimi API
  description: List model IDs available through the Kimi API.
  company: moonshot
  categories: [ai, developer-tools]
  version: v0.1.0
spec:
  provider: kimi
  codegen:
    go:
      package: kimi
  configuration:
    fields:
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one Kimi model-list HTTP request as a positive Go duration such as 5s or 1m. Blank uses the displayed default; increase only for a slow approved network.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum model-list response size in bytes as a positive integer. Blank uses the displayed default; increase only if the provider adds more model metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: kimi-api-key
    fields:
      - name: apiKey
        goName: APIKey
        type: secretString
        required: true
        description: Secret Kimi API Key from https://platform.kimi.com/console/api-keys. Sign in, create an API Key, copy its value into Dex Connections; blank prevents requests.
    guide:
      startURL: https://platform.kimi.com/docs/get-api-key.md
      steps:
        - Sign in at https://platform.kimi.com, open Console > API Keys at https://platform.kimi.com/console/api-keys, create an API Key, and copy the secret value into Dex Connections. The field is required; blank prevents requests.
        - Start ListModels with {}. The connector calls the fixed China-region Kimi HTTPS API and returns at most the first 50 model IDs. It does not call inference or expose model metadata. Leave timeout and maxResponseBytes blank for displayed defaults.
        - Use a Key from platform.kimi.com, not platform.kimi.ai; the two platforms have separate Keys. The Key determines model visibility. Manage it from Console > API Keys.
  operations:
    - name: listModels
      goName: ListModels
      inputType: ListModelsInput
      outputType: ListModelsOutput
      kind: query
      description: List up to 50 model IDs enabled for the API Key.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Kimi returned the available model list.}
        - {id: providerRejected, goName: ProviderRejected, description: Kimi rejected the Key or request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Kimi returned malformed or oversized model data., optional: true}
        - {id: defect, goName: Defect, description: The local API Key is invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: oneModel
          branch: found
          description: One available API model ID.
          default: true
          output: {total: 1, modelIDs: [kimi-k3.1-pro]}
        - name: noModels
          branch: found
          description: No models are enabled for the Key.
          output: {total: 0, modelIDs: []}
