apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: sentry
  displayName: Sentry
  description: Inspect Sentry issues, events, projects, and organizations and update issue status.
  company: Sentry
  categories: [developer-tools]
  version: v0.3.0
spec:
  provider: sentry
  languages:
    python:
      version: v0.1.0
      operations: [listIssues, getIssue, updateIssueStatus]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-sentry'
      operations: [listIssues, getIssue, updateIssueStatus]
      triggers: []
  codegen:
    go:
      package: sentry
  configuration:
    fields:
    - name: baseUrl
      goName: BaseURL
      type: url
      description: Sentry API base URL. Leave blank for the displayed public endpoint;
        override only for a compatible gateway or local test server.
      default: https://sentry.io/api/0
    - name: timeout
      goName: Timeout
      type: duration
      description: Maximum time for one HTTP request, as a positive Go duration such
        as 15s or 1m. Leave blank for the displayed default; override for slower gateways.
      default: 15s
    - name: maxResponseBytes
      goName: MaxResponseBytes
      type: integer
      description: Maximum accepted response size in bytes. Leave blank for the displayed
        default; increase only for larger legitimate pages.
      default: 2097152
  auth:
    type: apiKey
    connectionKind: sentry-api-key
    fields:
    - name: api_key
      goName: APIKey
      type: secretString
      required: true
      description: Secret Sentry token. Start at https://sentry.io/settings/account/api/auth-tokens/,
        follow User Settings > Auth Tokens > Create New Token. Create an auth token
        with event:read and event:write for issue reads and updates, event:admin
        for issue deletion, project:read, project:write, and project:admin for
        project reads and writes, and org:read for organization reads. Copy the opaque
        secret; blank prevents requests. It is sent only in the Authorization header.
    guide:
      startURL: https://sentry.io/settings/account/api/auth-tokens/
      steps:
      - Open https://sentry.io/settings/account/api/auth-tokens/ and sign in or create
        an account.
      - Follow User Settings > Auth Tokens > Create New Token. Create an auth token
        with event:read and event:write for issue reads and updates, event:admin
        for issue deletion, project:read, project:write, and project:admin for
        project reads and writes, org:read for organization reads, and org:write
        when the organization restricts project creation. Copy the opaque
        secret; blank prevents requests.
      - Paste the token into the secret api_key field and save the connection; leave
        baseUrl, timeout, and maxResponseBytes blank to use their displayed defaults.
  operations:
  - name: createRelease
    goName: CreateRelease
    inputType: CreateReleaseInput
    outputType: Release
    kind: mutation
    description: Create a versioned release for one organization project.
    idempotency: required
    authorization: required
    branches:
    - {id: created, goName: Created, description: Sentry created or confirmed the release.}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected creation., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    - {id: uncertain, goName: Uncertain, description: The send cap was reached without confirming creation., optional: true}
    execution: {repeatOnUnknown: limited, maxSends: 3, executeMethodTimeout: 30s, durability: sync}
    mocks:
    - {name: createReleaseDefault, branch: created, default: true, description: One release was created., output: {version: app@1.0.0, status: open}}
  - name: getRelease
    goName: GetRelease
    inputType: GetReleaseInput
    outputType: Release
    kind: query
    description: Retrieve one organization release by version.
    idempotency: none
    authorization: required
    branches:
    - {id: found, goName: Found, description: Sentry returned the release.}
    - {id: notFound, goName: NotFound, description: The release does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected retrieval., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: getReleaseDefault, branch: found, default: true, description: One release was found., output: {version: app@1.0.0, status: open}}
  - name: listReleases
    goName: ListReleases
    inputType: ListReleasesInput
    outputType: ReleasePage
    kind: query
    description: List one organization's releases with a cursor and query filter.
    idempotency: none
    authorization: required
    branches:
    - {id: listed, goName: Listed, description: Sentry returned the release page.}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected listing., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: listReleasesDefault, branch: listed, default: true, description: One release was listed., output: {releases: [{version: app@1.0.0, status: open}]}}
  - name: updateRelease
    goName: UpdateRelease
    inputType: UpdateReleaseInput
    outputType: Release
    kind: mutation
    description: Replace selected release metadata and status by version.
    idempotency: required
    authorization: required
    branches:
    - {id: updated, goName: Updated, description: Sentry updated the release.}
    - {id: notFound, goName: NotFound, description: The release does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected the update., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: updateReleaseDefault, branch: updated, default: true, description: One release was updated., output: {version: app@1.0.0, status: archived}}
  - name: deleteRelease
    goName: DeleteRelease
    inputType: DeleteReleaseInput
    outputType: DeletedRelease
    kind: mutation
    description: Permanently delete one release by version.
    idempotency: required
    authorization: required
    branches:
    - {id: deleted, goName: Deleted, description: Sentry accepted release deletion.}
    - {id: notFound, goName: NotFound, description: The release does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected deletion., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned unexpected deletion content., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: deleteReleaseDefault, branch: deleted, default: true, description: One release was deleted., output: {version: app@1.0.0}}
  - name: createProject
    goName: CreateProject
    inputType: CreateProjectInput
    outputType: Project
    kind: mutation
    description: Create a project under one Sentry team with a stable slug.
    idempotency: required
    authorization: required
    branches:
    - {id: created, goName: Created, description: Sentry created or confirmed the project.}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected creation., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    - {id: uncertain, goName: Uncertain, description: The send cap was reached without confirming creation., optional: true}
    execution: {repeatOnUnknown: limited, maxSends: 3, executeMethodTimeout: 30s, durability: sync}
    mocks:
    - {name: createProjectDefault, branch: created, default: true, description: One project was created., output: {id: '43', slug: app, name: Application}}
  - name: assignIssue
    goName: AssignIssue
    inputType: AssignIssueInput
    outputType: Issue
    kind: mutation
    description: Set an issue's assignee to a Sentry user or team.
    idempotency: required
    authorization: required
    branches:
    - {id: assigned, goName: Assigned, description: Sentry assigned the issue.}
    - {id: notFound, goName: NotFound, description: The issue does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected assignment., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: assignIssueDefault, branch: assigned, default: true, description: One issue was assigned., output: {id: '42', shortId: APP-42, title: Example, status: unresolved}}
  - name: deleteIssue
    goName: DeleteIssue
    inputType: DeleteIssueInput
    outputType: DeletedIssue
    kind: mutation
    description: Queue a Sentry issue for deletion.
    idempotency: required
    authorization: required
    branches:
    - {id: deleted, goName: Deleted, description: Sentry queued issue deletion.}
    - {id: notFound, goName: NotFound, description: The issue does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected deletion., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned unexpected response content., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: deleteIssueDefault, branch: deleted, default: true, description: One issue deletion was queued., output: {id: '42'}}
  - name: renameProject
    goName: RenameProject
    inputType: RenameProjectInput
    outputType: Project
    kind: mutation
    description: Replace a Sentry project's display name.
    idempotency: required
    authorization: required
    branches:
    - {id: renamed, goName: Renamed, description: Sentry renamed the project.}
    - {id: notFound, goName: NotFound, description: The project does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected the rename., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: renameProjectDefault, branch: renamed, default: true, description: One project was renamed., output: {id: '43', slug: app, name: New name}}
  - name: deleteProject
    goName: DeleteProject
    inputType: DeleteProjectInput
    outputType: DeletedProject
    kind: mutation
    description: Queue a Sentry project for deletion.
    idempotency: required
    authorization: required
    branches:
    - {id: deleted, goName: Deleted, description: Sentry queued project deletion.}
    - {id: notFound, goName: NotFound, description: The project does not exist., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected deletion., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned unexpected response content., optional: true}
    - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - {name: deleteProjectDefault, branch: deleted, default: true, description: One project deletion was queued., output: {slug: app}}
  - name: listIssues
    goName: ListIssues
    inputType: ListIssuesInput
    outputType: IssuePage
    kind: query
    description: ListIssues through the Sentry public JSON API.
    idempotency: none
    authorization: required
    branches:
    - id: listed
      goName: Listed
      description: Sentry returned the requested result.
    - id: providerRejected
      goName: ProviderRejected
      description: The provider definitively rejected the request.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input or connection credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: listIssuesDefault
      branch: listed
      description: A representative Sentry response.
      default: true
      output:
        issues:
        - id: '123'
          shortId: APP-1
          title: ExampleError
          status: unresolved
  - name: getIssue
    goName: GetIssue
    inputType: GetIssueInput
    outputType: Issue
    kind: query
    description: GetIssue through the Sentry public JSON API.
    idempotency: none
    authorization: required
    branches:
    - id: found
      goName: Found
      description: Sentry returned the requested result.
    - id: notFound
      goName: NotFound
      description: The requested resource does not exist.
      optional: true
    - id: providerRejected
      goName: ProviderRejected
      description: The provider definitively rejected the request.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input or connection credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: getIssueDefault
      branch: found
      description: A representative Sentry response.
      default: true
      output:
        id: '123'
        shortId: APP-1
        title: ExampleError
        status: unresolved
  - name: updateIssueStatus
    goName: UpdateIssueStatus
    inputType: UpdateIssueStatusInput
    outputType: Issue
    kind: mutation
    description: UpdateIssueStatus through the Sentry public JSON API.
    idempotency: required
    authorization: required
    branches:
    - id: updated
      goName: Updated
      description: Sentry returned the requested result.
    - id: notFound
      goName: NotFound
      description: The requested resource does not exist.
      optional: true
    - id: providerRejected
      goName: ProviderRejected
      description: The provider definitively rejected the request.
      optional: true
    - id: invalidResponse
      goName: InvalidResponse
      description: The provider returned malformed or oversized JSON.
      optional: true
    - id: defect
      goName: Defect
      description: Local input or connection credentials are invalid.
      optional: true
    execution:
      executeMethodTimeout: 30s
      durability: async
    mocks:
    - name: updateIssueStatusDefault
      branch: updated
      description: A representative Sentry response.
      default: true
      output:
        id: '123'
        shortId: APP-1
        title: ExampleError
        status: resolved
  - name: listIssueEvents
    goName: ListIssueEvents
    inputType: ListIssueEventsInput
    outputType: IssueEventPage
    kind: query
    description: List recorded events for one issue.
    idempotency: none
    authorization: required
    branches:
    - {id: listed, goName: Listed, description: Sentry returned the requested result.}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: listIssueEventsDefault
      branch: listed
      description: A representative Sentry response.
      default: true
      output: {events: [{id: event-1, title: ExampleError}]}
  - name: getIssueEvent
    goName: GetIssueEvent
    inputType: GetIssueEventInput
    outputType: IssueEvent
    kind: query
    description: Retrieve a recorded issue event by ID or latest selector.
    idempotency: none
    authorization: required
    branches:
    - {id: found, goName: Found, description: Sentry returned the requested result.}
    - {id: notFound, goName: NotFound, description: Sentry did not find the requested resource., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: getIssueEventDefault
      branch: found
      description: A representative Sentry response.
      default: true
      output: {id: event-1, title: ExampleError}
  - name: listProjects
    goName: ListProjects
    inputType: ListProjectsInput
    outputType: ProjectPage
    kind: query
    description: List projects in one organization.
    idempotency: none
    authorization: required
    branches:
    - {id: listed, goName: Listed, description: Sentry returned the requested result.}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: listProjectsDefault
      branch: listed
      description: A representative Sentry response.
      default: true
      output: {projects: [{id: '456', slug: example, name: Example}]}
  - name: getProject
    goName: GetProject
    inputType: GetProjectInput
    outputType: Project
    kind: query
    description: Retrieve one organization project.
    idempotency: none
    authorization: required
    branches:
    - {id: found, goName: Found, description: Sentry returned the requested result.}
    - {id: notFound, goName: NotFound, description: Sentry did not find the requested resource., optional: true}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: getProjectDefault
      branch: found
      description: A representative Sentry response.
      default: true
      output: {id: '456', slug: example, name: Example}
  - name: listOrganizations
    goName: ListOrganizations
    inputType: ListOrganizationsInput
    outputType: OrganizationPage
    kind: query
    description: List organizations available to the token.
    idempotency: none
    authorization: required
    branches:
    - {id: listed, goName: Listed, description: Sentry returned the requested result.}
    - {id: providerRejected, goName: ProviderRejected, description: Sentry definitively rejected the request., optional: true}
    - {id: invalidResponse, goName: InvalidResponse, description: Sentry returned malformed or oversized JSON., optional: true}
    - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
    execution: {repeatOnUnknown: safe, executeMethodTimeout: 30s, durability: async}
    mocks:
    - name: listOrganizationsDefault
      branch: listed
      description: A representative Sentry response.
      default: true
      output: {organizations: [{id: '789', slug: acme, name: Acme}]}
