apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: gorgias
  displayName: Gorgias
  description: "Search, read, create, and update Gorgias tickets, find customers by email, and add internal notes or public email replies, keeping Gorgias's own open and closed statuses and priorities; a retried create or message first looks for the earlier write by its external ID."
  company: Gorgias
  version: v0.21.0
spec:
  provider: gorgias
  codegen:
    go:
      package: gorgias
  configuration:
    fields:
      - name: domain
        goName: Domain
        type: string
        description: "Non-secret Gorgias helpdesk subdomain: the acme in https://acme.gorgias.com. Sign in to your helpdesk from https://www.gorgias.com/login, open Settings > Account > REST API as https://docs.gorgias.com/en-US/rest-api-208286 describes, and copy the part between https:// and .gorgias.com from the Base API URL. Enter lowercase letters, digits, and hyphens only, without https://, .gorgias.com, or /api/. Required: every API request is sent to https://{domain}.gorgias.com/api/."
        required: true
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum complete Gorgias API response in bytes. Leave blank to keep the displayed safety limit; enter a positive integer only to change it, for example when ticket messages carry unusually large HTML bodies. An oversized response selects invalidResponse, or is reconciled and may select uncertain for a write."
        required: false
        default: 4194304
  auth:
    type: apiKey
    connectionKind: gorgias-api-key
    fields:
      - name: email
        goName: Email
        type: string
        description: "Non-secret email address of the Gorgias user whose API key this is: the Username shown under Settings > Account > REST API at https://{domain}.gorgias.com, as https://docs.gorgias.com/en-US/rest-api-208286 describes, such as agent@example.com. The connector sends it as the HTTP Basic user name and as the sender of every internal note and reply, so they are authored by this user, whose role limits what the connector can read and change. It is stored with the API key, so replacing both takes effect without an application restart. Required: Gorgias rejects every request without it."
        required: true
      - name: api_key
        goName: APIKey
        type: secretString
        description: "Secret Gorgias API key created under Settings > Account > REST API > Password (API Key) > Create API Key at https://{domain}.gorgias.com, as https://docs.gorgias.com/en-US/rest-api-208286 describes; Gorgias shows it once. It is an opaque string of letters and digits, sent only as the HTTP Basic password. Stored only in this credential field; after resetting the key in Gorgias, paste the new key here. Required: Gorgias rejects every request without it."
        required: true
    guide:
      startURL: https://www.gorgias.com/login
      steps:
        - "On the Gorgias login page, enter your helpdesk's subdomain, the {domain} in https://{domain}.gorgias.com, and sign in as the account owner or an admin; only they can see the REST API credentials and create a key."
        - "Select the Settings icon at the bottom left, then Account > REST API; the Base API URL is https://{domain}.gorgias.com/api/, so enter the {domain} part in the domain field."
        - "Copy the Username, the email address of your Gorgias user, into email; the connector acts as that user, so internal notes and replies are authored by it and its role limits which tickets it can read and change."
        - "Under Password (API Key) select Create API Key and copy the key, shown once, into api_key; it grants the same access as that user."
        - "To revoke access, reset the API key on the same page; resetting invalidates the old key immediately, so paste the new key here. Public Gorgias apps must use OAuth2 instead, which this connector does not offer."
  operations:
    - name: searchTickets
      goName: SearchTickets
      inputType: SearchTicketsInput
      outputType: SearchTicketsOutput
      kind: query
      description: "List one page of tickets, most recently updated first, for a customer email or ID and an optional Gorgias view, keeping only the requested statuses, priorities, tags, and update time, with a cursor for the next page."
      idempotency: none
      branches:
        - {id: searched, goName: Searched, description: "One page of matching tickets was returned; it may be empty while a next cursor is set."}
        - {id: providerRejected, goName: ProviderRejected, description: "Gorgias conclusively rejected the list, such as invalid credentials, a missing permission, an unknown view, or an expired cursor.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Gorgias returned an invalid or oversized customer or ticket page., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &gorgiasReadExecution
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 6, totalDuration: 5m}
    - name: getTicket
      goName: GetTicket
      inputType: GetTicketInput
      outputType: TicketDetails
      kind: query
      description: Read one ticket by ID with its customer and a bounded list of its latest messages, internal notes included.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: The ticket and its latest messages were read.}
        - {id: notFound, goName: NotFound, description: The ticket does not exist or is not visible to the connection's user., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Gorgias conclusively rejected the ticket read, such as for a merged ticket.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Gorgias returned an invalid or oversized ticket or message page., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *gorgiasReadExecution
    - name: findCustomerByEmail
      goName: FindCustomerByEmail
      inputType: FindCustomerByEmailInput
      outputType: CustomerMatches
      kind: query
      description: Find the Gorgias customer whose primary email address is the given address.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: A customer with this primary email address was found.}
        - {id: notFound, goName: NotFound, description: No customer has this primary email address., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Gorgias conclusively rejected the customer lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Gorgias returned an invalid or oversized customer page., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *gorgiasReadExecution
    - name: createTicket
      goName: CreateTicket
      inputType: CreateTicketInput
      outputType: CreateTicketOutput
      kind: mutation
      description: "Create one ticket with the customer's first message. Gorgias has no idempotency key, so the Step runs with sync durability, records a Dex checkpoint before sending, and finds an unconfirmed ticket by the external ID it wrote instead of sending again. A Worker lost before Dex stores the checkpoint can still send twice when the first ticket is not yet visible."
      idempotency: required
      branches:
        - {id: created, goName: Created, description: "The ticket exists: Gorgias created it now, or a retried attempt found the ticket an earlier attempt of this Step created."}
        - {id: providerRejected, goName: ProviderRejected, description: "Gorgias conclusively rejected the ticket, such as an unknown assignee or an over-long subject; no ticket was created.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "The request was sent but Gorgias did not confirm a ticket for it, so the ticket may still appear; the connector never resends it.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &gorgiasSingleDispatchExecution
        executeMethodTimeout: 30s
        durability: sync
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 5, totalDuration: 5m}
    - name: updateTicket
      goName: UpdateTicket
      inputType: UpdateTicketInput
      outputType: UpdateTicketOutput
      kind: mutation
      description: "Set the status, priority, assigned user, or assigned team of one ticket and add or remove tags; a repeated attempt finds the change already applied and writes nothing."
      idempotency: required
      branches:
        - {id: updated, goName: Updated, description: "The ticket holds the requested values, written now or by an earlier attempt."}
        - {id: notFound, goName: NotFound, description: The ticket does not exist or is not visible to the connection's user., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Gorgias conclusively rejected the change, such as an unknown user or team, or a merged ticket; a tag change made before the rejection stays applied, and the Ticket shows it when it can be read again.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Gorgias returned an invalid or oversized ticket, so the change may have been applied.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 45s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 6, totalDuration: 5m}
    - name: addNote
      goName: AddNote
      inputType: AddNoteInput
      outputType: AddNoteOutput
      kind: mutation
      description: "Add one internal note or one public email reply to a ticket. Gorgias has no idempotency key, so the Step runs with sync durability, records a Dex checkpoint before sending, and finds an unconfirmed message by the external ID it wrote instead of sending again. A Worker lost before Dex stores the checkpoint can still send twice when the first message is not yet visible."
      idempotency: required
      branches:
        - {id: added, goName: Added, description: "The note or reply exists: Gorgias added it now, or a retried attempt found the message an earlier attempt of this Step added."}
        - {id: notFound, goName: NotFound, description: "The ticket does not exist or is not visible to the connection's user; nothing was added.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Gorgias conclusively rejected the note or reply, or a reply's ticket could not be read, has no customer email to answer, or shows no address known to be the helpdesk's; nothing was added.", optional: true}
        - {id: uncertain, goName: Uncertain, description: "The request was sent but Gorgias did not confirm a message for it, so the note or reply may still appear; the connector never resends it.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *gorgiasSingleDispatchExecution
