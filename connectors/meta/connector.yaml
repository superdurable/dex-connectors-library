apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: meta
  displayName: Meta Model API
  description: Meta Model API text generation with Muse Spark models, JSON Schema structured output, reasoning effort, token usage, and streamed text.
  company: Meta
  version: v0.2.0
spec:
  provider: meta
  codegen:
    go:
      package: meta
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "Muse Spark model for this connection, such as muse-spark-1.3 or muse-spark-1.3-contributor. Blank uses muse-spark-1.3. A request that names a model overrides it."
        required: false
        default: muse-spark-1.3
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete provider response in bytes; enter a positive integer only when a proxy needs a different safety limit. Larger responses select invalidResponse.
        required: false
        default: 8388608
  auth:
    type: apiKey
    connectionKind: meta-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: Secret Meta Model API team key from Model API dashboard > API keys; expected format is LLM|<id>|<secret>. It is sent only as an Authorization bearer token.
        required: true
    guide:
      startURL: https://dev.meta.ai/
      steps:
        - Sign in to the Meta Model API dashboard and open API keys.
        - Choose Create API key, give the team key a descriptive name, and copy the LLM|<id>|<secret> value shown once.
        - Store the value here as a secret; leave model and response-limit fields blank to use their displayed defaults.
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, meta.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      - id: listModels
        capability: meta.models-list
        request:
          method: GET
          url: https://api.meta.ai/v1/models
          credential: {field: api_key, scheme: bearer}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: Choose one Step's Meta model from Meta Model API's live model list.
        backendCapabilities: [meta.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: generateText
      goName: GenerateText
      inputType: GenerateTextRequest
      outputType: GenerateTextResponse
      kind: query
      description: Generate text or JSON Schema structured output with a Muse Spark model through the stateless Chat Completions endpoint.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: The model finished normally and returned text.}
        - {id: truncated, goName: Truncated, description: The model stopped at the output token limit and returned any partial text., optional: true}
        - {id: blocked, goName: Blocked, description: "Meta stopped the response for a content policy, or the model refused.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Meta conclusively rejected the request, such as invalid credentials, an unknown model, or a billing issue.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Meta returned a malformed, oversized, or unusable response, including structured output that does not match its schema.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      progress: [text]
      execution:
        # Requests stream, which Meta exempts from its non-streaming time
        # limit, so the streaming generateText budget applies.
        executeMethodTimeout: 900s
        heartbeatTimeout: 60s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 4, totalDuration: 30m}
