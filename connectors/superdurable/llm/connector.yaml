apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: llm
  displayName: LLM
  description: "The text generation connector for applications: one generateText Step runs a model of the provider that the connection names, OpenAI, Claude, Gemini, Qwen, DeepSeek, Meta, Mistral, Kimi, or xAI Grok, with that provider's API key and its own model IDs."
  company: Super Durable
  version: v0.21.0
spec:
  provider: llm
  codegen:
    go:
      package: llm
  configuration:
    fields:
      - name: provider
        goName: Provider
        type: enum
        enum: [openai, anthropic, gemini, qwen, deepseek, meta, mistral, kimi, xai]
        description: "Model provider whose API serves every generateText Step of this connection and whose key api_key holds: openai (OpenAI Platform), anthropic (Claude Console), gemini (Google AI Studio), qwen (Alibaba Cloud Model Studio), deepseek (DeepSeek Platform), meta (Meta Model API), mistral (Mistral AI Studio), kimi (Moonshot AI Kimi Platform), or xai (xAI Console). The authorization guide links each provider's API key page. Required; use one connection per provider, and replace api_key and model when you change it."
        required: true
      - name: model
        goName: Model
        type: string
        description: "Model ID for Steps that pick none, written exactly as the provider names it and never prefixed with the provider, such as gpt-6-sol or claude-opus-5-5. Blank uses the provider's default model: gpt-6-sol for openai, claude-sonnet-5 for anthropic, gemini-3.5-flash-lite for gemini, qwen3.7-plus for qwen, deepseek-flash for deepseek, muse-spark-1.3 for meta, mistral-large-2512 for mistral, kimi-k2.6 for kimi, and grok-4.3 for xai. Save the connection first to choose it from the provider's live model list. A Step pick or a request model overrides it."
        required: false
        studioUnit: {unit: modelPicker, port: model}
      - name: region
        goName: Region
        type: enum
        enum: [global, us, eu, china, hong-kong]
        description: "Regional API platform of the key, chosen where the key was created. global is each provider's public API; for qwen it is Model Studio Singapore. Only four providers serve another region: qwen keys created in China (Hong Kong) need hong-kong and keys created in China (Beijing) need china; kimi keys from platform.kimi.com need china; mistral offers eu and us regional inference; xai offers us regional inference, which currently serves only grok-4.7 and grok-4.6. Any other provider and region pair stops the application at startup."
        required: false
        default: global
      - name: anthropicWorkspaceId
        goName: AnthropicWorkspaceID
        type: string
        description: "Claude workspace ID from Claude Console (https://platform.claude.com) > Settings > Workspaces, such as wrkspc_01JwQvzr7rXLA5AGx3HKfFUJ, sent as anthropic-workspace-id on every Claude generation request. Only provider anthropic with a key that spans several workspaces requires it; leave it blank for a key scoped to one workspace and for every other provider, where a value stops the application at startup. It is not secret, and the model list does not send it."
        required: false
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum complete provider response in bytes, counting every byte of a stream; enter a positive integer. Blank uses 64 MiB for deepseek, whose streams carry keep-alive comments and reasoning chunks, and 8 MiB for every other provider. OpenAI adds about 260 bytes of event framing per streamed text delta, so 8 MiB holds roughly 30,000 openai output tokens; raise it for longer outputs. Larger responses select invalidResponse."
        required: false
  auth:
    type: apiKey
    connectionKind: llm-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: "Secret API key of the provider chosen in provider, created on that provider's API key page that the guide lists: an sk- key for OpenAI, Qwen, DeepSeek, or Kimi, sk-ant- for Claude, AIza for Gemini, LLM|<id>|<secret> for Meta, an opaque key for Mistral, or xai- for xAI. It is stored only as this connection's secret and sent only to the chosen provider's API host, in x-goog-api-key for Gemini and as an Authorization bearer token for every other provider. Required."
        required: true
    guide:
      startURL: https://github.com/superdurable/dex-connectors-library/blob/main/connectors/superdurable/llm/README.md#connection
      steps:
        - "Choose the provider, then open its API key page: OpenAI https://platform.openai.com/api-keys, Claude https://platform.claude.com/settings/keys, Gemini https://aistudio.google.com/api-keys, Qwen https://bailian.console.aliyun.com/ (Model Studio > API Key), DeepSeek https://platform.deepseek.com/api_keys, Meta https://dev.meta.ai/ (API keys), Mistral https://console.mistral.ai/api-keys, Kimi https://platform.kimi.ai/ (Console > API Keys), or xAI https://console.x.ai/ (API Keys)."
        - "Select the project, workspace, or team that should own usage and billing, choose the page's create-key action, limit the key to text generation where the page allows it, and copy the secret shown once into api_key."
        - "Set region only for a Qwen or Kimi key created in a China region, or for Mistral or xAI regional inference; for a Claude key that spans several workspaces, copy its wrkspc_ ID from Claude Console > Settings > Workspaces into anthropicWorkspaceId."
        - "Leave model blank for the provider's default model, or save the connection and pick a model from the provider's live list."
        - "To revoke access, delete the key on the same provider page; a replacement key saved here takes effect without restarting the application."
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, llm.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      # Every command sends api_key, so the bundle runs only the commands of the
      # connection's own provider and region, never another provider's.
      - id: listOpenAIModels
        capability: llm.models-list
        request:
          method: GET
          url: https://api.openai.com/v1/models
          credential: {field: api_key, scheme: bearer}
      # Dex Web releases before cli-v0.13.10 drop fixedHeaders, so Claude
      # rejects this list there and the picker offers manual entry.
      - id: listAnthropicModels
        capability: llm.models-list
        request:
          method: GET
          url: https://api.anthropic.com/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedHeaders: {anthropic-version: "2023-06-01"}
          fixedQuery: {limit: "1000"}
          parameters:
            - {name: afterId, location: query, target: after_id}
      # Dex Web releases before cli-v0.13.10 reject the header scheme before
      # sending, so the bundle falls back to the OpenAI-compatible list below.
      - id: listGeminiModels
        capability: llm.models-list
        request:
          method: GET
          url: https://generativelanguage.googleapis.com/v1beta/models
          credential: {field: api_key, scheme: header, header: x-goog-api-key}
          fixedQuery: {pageSize: "1000"}
          parameters:
            - {name: pageToken, location: query, target: pageToken}
      - id: listGeminiOpenAICompatibleModels
        capability: llm.models-list
        request:
          method: GET
          url: https://generativelanguage.googleapis.com/v1beta/openai/models
          credential: {field: api_key, scheme: bearer}
      # Thinking-only Qwen models may lack TG, and fixedQuery cannot repeat
      # capabilities, so each Model Studio region has two lists.
      - id: listQwenModels
        capability: llm.models-list
        request:
          method: GET
          url: https://dashscope-intl.aliyuncs.com/api/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedQuery: {capabilities: TG, language: en-US, page_size: "100"}
          parameters:
            - {name: pageNumber, location: query, target: page_no}
      - id: listQwenReasoningModels
        capability: llm.models-list
        request:
          method: GET
          url: https://dashscope-intl.aliyuncs.com/api/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedQuery: {capabilities: Reasoning, language: en-US, page_size: "100"}
          parameters:
            - {name: pageNumber, location: query, target: page_no}
      - id: listQwenModelsHongKong
        capability: llm.models-list
        request:
          method: GET
          url: https://cn-hongkong.dashscope.aliyuncs.com/api/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedQuery: {capabilities: TG, language: en-US, page_size: "100"}
          parameters:
            - {name: pageNumber, location: query, target: page_no}
      - id: listQwenReasoningModelsHongKong
        capability: llm.models-list
        request:
          method: GET
          url: https://cn-hongkong.dashscope.aliyuncs.com/api/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedQuery: {capabilities: Reasoning, language: en-US, page_size: "100"}
          parameters:
            - {name: pageNumber, location: query, target: page_no}
      - id: listDeepSeekModels
        capability: llm.models-list
        request:
          method: GET
          url: https://api.deepseek.com/models
          credential: {field: api_key, scheme: bearer}
      - id: listMetaModels
        capability: llm.models-list
        request:
          method: GET
          url: https://api.meta.ai/v1/models
          credential: {field: api_key, scheme: bearer}
      # The global catalog also lists the models of the eu and us regions,
      # which each serve only their regional subset of it.
      - id: listMistralModels
        capability: llm.models-list
        request:
          method: GET
          url: https://api.mistral.ai/v1/models
          credential: {field: api_key, scheme: bearer}
      - id: listKimiModels
        capability: llm.models-list
        request:
          method: GET
          url: https://api.moonshot.ai/v1/models
          credential: {field: api_key, scheme: bearer}
      - id: listKimiModelsChina
        capability: llm.models-list
        request:
          method: GET
          url: https://api.moonshot.cn/v1/models
          credential: {field: api_key, scheme: bearer}
      # The language-models list carries modalities, aliases, and reasoning
      # efforts; the US regional list carries only model IDs.
      - id: listXAIModels
        capability: llm.models-list
        request:
          method: GET
          url: https://api.x.ai/v1/language-models
          credential: {field: api_key, scheme: bearer}
      - id: listXAIModelsUS
        capability: llm.models-list
        request:
          method: GET
          url: https://us.api.x.ai/v1/models
          credential: {field: api_key, scheme: bearer}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: "Choose a model ID from the live model list of the connection's provider and region, or type one the provider serves. On a Step, blank keeps the connection's model; on the connection, blank uses the provider's default model."
        backendCapabilities: [llm.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: generateText
      goName: GenerateText
      inputType: GenerateTextRequest
      outputType: GenerateTextResponse
      kind: query
      description: Generate text or JSON Schema structured output with a model of the connection's provider through that provider's stateless text generation API.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: The model finished normally and returned text.}
        - {id: truncated, goName: Truncated, description: "The model stopped at the output token limit or the context window and returned any partial text.", optional: true}
        - {id: blocked, goName: Blocked, description: "The provider stopped the request or response for a content policy, or the model refused.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "The provider conclusively rejected the request, such as an invalid key, an unknown model, or exhausted quota or balance.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "The provider returned a malformed, oversized, or unusable response, including structured output that does not match its schema.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, a request field the model does not accept, connection configuration, or connector definition is invalid.", optional: true}
      progress: [text]
      execution:
        # DeepSeek queues requests up to 10 minutes with keep-alives, so its
        # queued streaming budget covers every provider.
        executeMethodTimeout: 1200s
        heartbeatTimeout: 60s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 4, totalDuration: 30m}
