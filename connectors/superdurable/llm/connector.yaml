apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: llm
  displayName: LLM
  description: "One generateText Step for OpenAI, Claude, and Gemini models chosen as provider/model. Add each provider you use to the connection with its API key; each key is sent only to its own provider. Steps may pick any model from the added providers."
  company: Super Durable
  version: v0.2.0
spec:
  provider: llm
  codegen:
    go:
      package: llmrouter
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "Optional default model for Steps that pick none, written provider/model, such as anthropic/claude-sonnet-5, openai/gpt-6-sol, or gemini/gemini-3.5-flash-lite, or a provider alone (openai, anthropic, or gemini) for that provider connector's default model. Its provider must be one the connection adds. Blank uses the first added provider's default model. Save the connection first to choose it from the live model lists. A Step pick or a request model overrides it."
        required: false
        studioUnit: {unit: modelPicker, port: model}
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum complete provider response in bytes for every provider, counting every byte of a stream; enter a positive integer. OpenAI adds about 260 bytes of event framing per streamed text delta, so the default holds roughly 30,000 openai/ output tokens; raise it for longer outputs. Larger responses select invalidResponse."
        required: false
        default: 8388608
  auth:
    selection: multiple
    methodLabel: Provider
    defaultMethod: openai
    methods:
      - id: openai
        displayName: OpenAI
        description: "Run openai/ models, such as openai/gpt-6-sol, with an OpenAI project API key."
        type: apiKey
        connectionKind: llm-api-keys
        fields:
          - name: openai_api_key
            goName: OpenAIAPIKey
            type: secretString
            description: "Secret OpenAI project API key from Platform > API keys, starting sk-, sent only to api.openai.com as a bearer token. Required while OpenAI is added."
            required: true
        guide:
          startURL: https://platform.openai.com/api-keys
          steps:
            - "Select the OpenAI project that should own usage, open API keys, and choose Create new secret key."
            - "Copy the sk- secret shown once into openai_api_key."
      - id: anthropic
        displayName: Claude
        description: "Run anthropic/ models, such as anthropic/claude-sonnet-5, with a Claude Console API key."
        type: apiKey
        connectionKind: llm-api-keys
        fields:
          - name: anthropic_api_key
            goName: AnthropicAPIKey
            type: secretString
            description: "Secret Claude API key from Claude Console > Settings > API keys, starting sk-ant-, sent only to api.anthropic.com as a bearer token. Required while Claude is added."
            required: true
        configuration:
          fields:
            - name: anthropicWorkspaceId
              goName: AnthropicWorkspaceID
              type: string
              description: "Claude workspace ID from Claude Console > Settings > Workspaces, such as wrkspc_01JwQvzr7rXLA5AGx3HKfFUJ, sent as anthropic-workspace-id on Claude generation requests. A multi-workspace Anthropic key requires it; leave it blank for a key scoped to one workspace. The model lists do not send it."
              required: false
        guide:
          startURL: https://platform.claude.com/settings/keys
          steps:
            - "Select the workspace that should own usage, choose Create key, and copy the sk-ant- secret shown once into anthropic_api_key."
            - "Only for a key that spans several workspaces, copy the wrkspc_ ID from Settings > Workspaces into anthropicWorkspaceId."
      - id: gemini
        displayName: Gemini
        description: "Run gemini/ models, such as gemini/gemini-3.5-flash-lite, with a Google AI Studio API key."
        type: apiKey
        connectionKind: llm-api-keys
        fields:
          - name: gemini_api_key
            goName: GeminiAPIKey
            type: secretString
            description: "Secret Gemini API key from Google AI Studio > API keys, starting AIza, sent only to generativelanguage.googleapis.com. Required while Gemini is added."
            required: true
        guide:
          startURL: https://aistudio.google.com/api-keys
          steps:
            - "Select the Google Cloud project that should own usage and choose Create API key."
            - "Copy the AIza key into gemini_api_key."
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, llm.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      # Each command equals the pinned provider's released list command except
      # its ID, capability, and credential field; manifest_test.go checks this.
      - id: listOpenAIModels
        capability: llm.models-list
        request:
          method: GET
          url: https://api.openai.com/v1/models
          credential: {field: openai_api_key, scheme: bearer}
      # Dex Web releases before cli-v0.13.10 drop fixedHeaders, so Claude
      # rejects this list there and the picker offers the default and manual entry.
      - id: listAnthropicModels
        capability: llm.models-list
        request:
          method: GET
          url: https://api.anthropic.com/v1/models
          credential: {field: anthropic_api_key, scheme: bearer}
          fixedHeaders: {anthropic-version: "2023-06-01"}
          fixedQuery: {limit: "1000"}
          parameters:
            - {name: afterId, location: query, target: after_id}
      # Dex Web releases before cli-v0.13.10 reject the header scheme before
      # sending, so the bundle falls back to the OpenAI-compatible list below.
      - id: listGeminiModels
        capability: llm.models-list
        request:
          method: GET
          url: https://generativelanguage.googleapis.com/v1beta/models
          credential: {field: gemini_api_key, scheme: header, header: x-goog-api-key}
          fixedQuery: {pageSize: "1000"}
          parameters:
            - {name: pageToken, location: query, target: pageToken}
      - id: listGeminiOpenAICompatibleModels
        capability: llm.models-list
        request:
          method: GET
          url: https://generativelanguage.googleapis.com/v1beta/openai/models
          credential: {field: gemini_api_key, scheme: bearer}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: "Choose a model as provider/model from the live lists of the providers this connection adds, a provider's default model, or a typed provider/model ID. On a Step, blank keeps the connection's default model; on the connection, blank uses the first added provider's default model."
        backendCapabilities: [llm.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: generateText
      goName: GenerateText
      inputType: GenerateTextRequest
      outputType: GenerateTextResponse
      kind: query
      description: Generate text or JSON Schema structured output with the OpenAI, Claude, or Gemini model that provider/model selects, through that provider connector's stateless generateText Query.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: The model finished normally and returned text.}
        - {id: truncated, goName: Truncated, description: The model stopped at the output token limit and returned any partial text., optional: true}
        - {id: blocked, goName: Blocked, description: "The selected provider stopped the response for a content policy, or the model refused.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "The selected provider conclusively rejected the request, such as an invalid key, an unknown model, or exhausted quota.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "The selected provider returned a malformed, oversized, or unusable response, including structured output that does not match its schema.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, the model selection, a provider the connection has not added, a missing or mismatched provider key, connection configuration, or connector definition is invalid.", optional: true}
      progress: [text]
      execution:
        # Covers every routed provider's generateText budget; New rejects a
        # linked provider that needs a longer Execute timeout.
        executeMethodTimeout: 900s
        heartbeatTimeout: 60s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 4, totalDuration: 30m}
