apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: customerio
  displayName: Customer.io
  description: Look up Customer.io workspace customers by email address.
  company: Customer.io
  version: v0.1.0
spec:
  provider: customerio
  languages:
    python:
      version: v0.1.0
      package: dex-connector-customerio
      operations: [getCustomersByEmail]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-customerio"
      operations: [getCustomersByEmail]
      triggers: []
  codegen:
    go:
      package: customerio
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Customer.io App API HTTPS root. Blank uses the displayed US-region default; override with https://api-eu.customer.io for an EU workspace. Do not include path, query, or credentials.
        default: https://api.customer.io
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one customer lookup as a positive Go duration. Blank uses the displayed default; increase only for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete customer-lookup JSON response in bytes as a positive integer. Blank uses the displayed default; increase if an email has many matching profiles.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: customerio-app-private-key
    fields:
      - name: privateKey
        goName: PrivateKey
        type: secretString
        required: true
        description: Secret App API private key from Customer.io > Settings > API Credentials > App API > Create API Key. Copy the complete sk_ key or existing App API key, not its label; blank prevents calls. Dex sends it only as a Bearer credential.
    guide:
      startURL: https://fly.customer.io
      steps:
        - In Customer.io open Settings > API Credentials > App API and create or select a private key with profile-read access. Copy the complete sk_ value into secret privateKey; an existing App API key also works. Blank prevents calls. Do not put the key in Flow input.
        - Leave baseUrl blank for the US region, or use https://api-eu.customer.io for an EU workspace. Leave timeout and maxResponseBytes blank for their displayed defaults. Find a non-secret customer email on the workspace People page, then pass its full email address as email; blank is invalid.
  operations:
    - name: getCustomersByEmail
      goName: GetCustomersByEmail
      inputType: GetCustomersByEmailInput
      outputType: CustomerLookupPage
      kind: query
      description: Return Customer.io profile IDs matching one exact email address.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: "Customer.io returned matching customer IDs, possibly empty."}
        - {id: providerRejected, goName: ProviderRejected, description: Customer.io conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Customer.io returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample customer matches the email address.
          output: {email: person@example.com, customerIDs: [a3000001]}
