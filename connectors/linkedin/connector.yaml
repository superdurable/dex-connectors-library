apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: linkedin
  displayName: LinkedIn
  description: Read the authenticated member's OpenID Connect UserInfo profile and verified email.
  company: LinkedIn
  version: v0.21.0
spec:
  provider: linkedin
  codegen:
    go:
      package: linkedin
  configuration:
    fields:
      - name: userInfoUrl
        goName: UserInfoURL
        type: url
        description: LinkedIn OpenID Connect UserInfo URL; leave blank for the documented v2 endpoint and change only when LinkedIn publishes a compatible replacement.
        required: false
        default: https://api.linkedin.com/v2/userinfo
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration for one LinkedIn HTTP request, using a positive Go duration such as 15s or 1m; leave blank for the displayed default.
        required: false
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum bytes accepted from the LinkedIn UserInfo response; enter a positive integer only to change the safety limit. Oversized responses select invalidResponse.
        required: false
        default: 1048576
  auth:
    refreshable: true
    type: oauth2
    connectionKind: linkedin-oidc
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        description: Non-secret Client ID copied from https://www.linkedin.com/developers/apps after selecting the app > Auth > Application credentials; blank keeps an existing non-renewable access token usable but authorization and programmatic refresh cannot start.
        required: false
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        description: Secret copied from https://www.linkedin.com/developers/apps after selecting the app > Auth > Application credentials; store it only in this credential field, and blank keeps an existing token usable but programmatic refresh cannot start.
        required: false
      - name: access_token
        goName: AccessToken
        type: secretString
        description: Secret LinkedIn OpenID Connect access token produced automatically after authorization; Dex refreshes it when LinkedIn grants programmatic refresh, otherwise expiry requires reauthorization, and it must not be entered manually.
        required: true
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        description: Secret programmatic refresh token returned only for LinkedIn-approved products; Dex preserves or replaces it from each response, while blank means this app must use interactive reauthorization when the access token expires.
        required: false
    guide:
      startURL: https://www.linkedin.com/developers/apps
      steps:
        - Create or select a LinkedIn developer app, then open Products and request Sign in with LinkedIn using OpenID Connect.
        - Open Auth, add the exact Redirect URI shown below under Authorized redirect URLs for your app, and save.
        - Copy Client ID and Client Secret from the Auth credentials section; the client secret is sensitive.
        - Complete consent for openid, profile, and email; ordinary Sign in with LinkedIn apps may not receive refresh_token, while approved programmatic-refresh products can refresh until LinkedIn's refresh-token expiry.
    oauth2:
      protocol: oidc
      authorizationEndpoint: https://www.linkedin.com/oauth/v2/authorization
      tokenEndpoint: https://www.linkedin.com/oauth/v2/accessToken
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [openid, profile, email]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      pkce: true
      oidc:
        issuer: https://www.linkedin.com
        discoveryEndpoint: https://www.linkedin.com/oauth/.well-known/openid-configuration
        userInfoEndpoint: https://api.linkedin.com/v2/userinfo
        nonceRequired: true
  operations:
    - name: getAuthenticatedProfile
      goName: GetAuthenticatedProfile
      inputType: GetAuthenticatedProfileInput
      outputType: AuthenticatedProfile
      kind: query
      description: Read bounded signup identity claims from LinkedIn OpenID Connect UserInfo.
      idempotency: none
      authorization: required
      branches:
        - {id: profileLoaded, goName: ProfileLoaded, description: The authenticated profile and verified email were loaded.}
        - {id: verifiedEmailRequired, goName: VerifiedEmailRequired, description: A verified email was not available., optional: true}
        - {id: insufficientScope, goName: InsufficientScope, description: The OpenID Connect grant lacks required authorization., optional: true}
        - {id: authorizationRevoked, goName: AuthorizationRevoked, description: The OpenID Connect grant is invalid or revoked., optional: true}
        - {id: notFound, goName: NotFound, description: The authenticated member was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: LinkedIn conclusively rejected the profile query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: LinkedIn returned an invalid or oversized profile response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m}
