apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: microsoft-advertising
  displayName: Microsoft Advertising
  description: Read and manage campaigns and ad groups in a Microsoft Advertising account through the v13 REST API.
  company: Microsoft
  categories: [marketing]
  version: v0.2.0
spec:
  provider: microsoft-advertising
  languages:
    python:
      version: v0.1.0
      package: dex-connector-microsoft-advertising
      operations: [listCampaigns]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-microsoft-advertising'
      operations: [listCampaigns]
      triggers: []
  codegen:
    go:
      package: microsoftadvertising
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        default: https://campaign.api.bingads.microsoft.com
        description: Microsoft Advertising Campaign Management v13 HTTPS origin. Blank uses the displayed production origin; override only for the documented sandbox or a trusted local fixture.
      - name: customerId
        goName: CustomerID
        type: string
        required: true
        description: Non-secret numeric manager customer ID from https://ui.ads.microsoft.com > Campaigns; copy the cid URL parameter, not the account number. Blank prevents campaign queries.
      - name: timeout
        goName: Timeout
        type: duration
        default: 15s
        description: Maximum duration of one Campaign Management request as a positive Go duration such as 15s. Blank uses the displayed default; increase only for slow accounts.
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        default: 4194304
        description: Maximum complete Campaign Management JSON response in bytes. Blank uses the displayed default; increase only for unusually large accounts.
  auth:
    type: oauth2
    refreshable: true
    connectionKind: microsoft-advertising-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        required: true
        description: Non-secret Application (client) ID from https://entra.microsoft.com > Entra ID > App registrations > your app > Overview. Blank prevents authorization and refresh.
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        required: true
        description: Secret Value from https://entra.microsoft.com > Entra ID > App registrations > your app > Certificates & secrets > Client secrets. Save only in Dex; blank prevents authorization and refresh.
      - name: developer_token
        goName: DeveloperToken
        type: secretString
        required: true
        description: Secret API developer token from https://developers.ads.microsoft.com > Account tab > Developer Token. Save only in Dex; blank prevents campaign queries.
      - name: access_token
        goName: AccessToken
        type: secretString
        required: true
        description: Secret OAuth access token returned by Microsoft consent and rotated by Dex. Never enter manually; blank requires authorization.
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        required: true
        description: Secret OAuth refresh token returned by Microsoft consent and rotated by Dex. Never enter manually; blank requires reauthorization.
    guide:
      startURL: https://entra.microsoft.com/
      steps:
        - At https://entra.microsoft.com > Entra ID > App registrations > New registration, create a Web application supporting organizational and personal Microsoft accounts. Register the exact redirect URI displayed by Dex Web under Authentication > Web.
        - Under API permissions add Microsoft Advertising delegated msads.manage; offline_access is requested for renewable access. Configure consent for the intended audience; an administrator may need to approve the application.
        - Under Certificates & secrets > Client secrets, copy the secret Value once and copy the Application (client) ID from Overview. Enter both in Dex Web; keep the Value secret.
        - At https://developers.ads.microsoft.com > Account tab > Developer Token, obtain the production token and enter it in Dex Web. A sandbox token must be paired with the sandbox API origin and sandbox account.
        - At https://ui.ads.microsoft.com > Campaigns, copy cid from the URL as customerId and aid as the numeric accountId for Flow input. Neither is a secret. Connect in Dex Web; Dex derives access_token and refresh_token automatically.
    oauth2:
      authorizationEndpoint: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
      tokenEndpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [offline_access, https://ads.microsoft.com/msads.manage]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      tokenEndpointAuthMethod: client_secret_post
      pkce: true
      refresh:
        tokenExchangeTimeout: 15s
        caseInsensitiveScopes: true
        missingExpiry: reject
        storedMissingExpiry: refresh
        terminalErrorCodes: [invalid_grant, invalid_client, unauthorized_client, interaction_required, consent_required]
  operations:
    - name: listAdGroups
      goName: ListAdGroups
      inputType: ListAdGroupsInput
      outputType: AdGroupsPage
      kind: query
      description: List ad groups in one campaign.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Microsoft Advertising returned the ad groups.}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The ad group response was invalid., optional: true}
        - {id: defect, goName: Defect, description: The account or campaign ID is invalid., optional: true}
      mocks:
        - {name: listedDefault, branch: listed, default: true, description: One ad group is listed., output: {adGroups: [{id: '33', name: Example, status: Paused}]}}
    - name: getAdGroup
      goName: GetAdGroup
      inputType: GetAdGroupInput
      outputType: AdGroupSummary
      kind: query
      description: Read one ad group in a campaign by ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Microsoft Advertising returned the ad group.}
        - {id: notFound, goName: NotFound, description: No ad group has the requested ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The ad group response was invalid., optional: true}
        - {id: defect, goName: Defect, description: "The account, campaign, or ad group ID is invalid.", optional: true}
      mocks:
        - {name: foundDefault, branch: found, default: true, description: One ad group is found., output: {id: '33', name: Example, status: Paused}}
    - name: createAdGroup
      goName: CreateAdGroup
      inputType: CreateAdGroupInput
      outputType: AdGroupMutationResult
      kind: mutation
      description: Create a paused ad group with a unique name within its campaign.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Microsoft Advertising created the ad group.}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising rejected the create., optional: true}
        - {id: defect, goName: Defect, description: "The account, campaign, or name is invalid.", optional: true}
      mocks:
        - {name: createdDefault, branch: created, default: true, description: One ad group was created., output: {adGroupId: '33'}}
    - name: updateAdGroup
      goName: UpdateAdGroup
      inputType: UpdateAdGroupInput
      outputType: AdGroupMutationResult
      kind: mutation
      description: Replace an ad group's name or status.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Microsoft Advertising updated the ad group.}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The update response was invalid., optional: true}
        - {id: defect, goName: Defect, description: "The account, campaign, ad group, or replacement is invalid.", optional: true}
      mocks:
        - {name: updatedDefault, branch: updated, default: true, description: One ad group was updated., output: {adGroupId: '33'}}
    - name: deleteAdGroup
      goName: DeleteAdGroup
      inputType: DeleteAdGroupInput
      outputType: AdGroupMutationResult
      kind: mutation
      description: Delete one ad group in its campaign.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Microsoft Advertising deleted the ad group.}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising rejected the delete., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The delete response was invalid., optional: true}
        - {id: defect, goName: Defect, description: "The account, campaign, or ad group ID is invalid.", optional: true}
      mocks:
        - {name: deletedDefault, branch: deleted, default: true, description: One ad group was deleted., output: {adGroupId: '33'}}
    - name: getCampaign
      goName: GetCampaign
      inputType: GetCampaignInput
      outputType: CampaignSummary
      kind: query
      description: Read one campaign by ID in an account.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Microsoft Advertising returned the campaign.}
        - {id: notFound, goName: NotFound, description: The campaign is absent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Microsoft Advertising returned invalid campaign JSON., optional: true}
        - {id: defect, goName: Defect, description: The ID or connection is invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One search campaign is found.
          output: {id: '98765', name: Sample Search, campaignType: Search, status: Active}
    - name: createCampaign
      goName: CreateCampaign
      inputType: CreateCampaignInput
      outputType: CampaignMutationResult
      kind: mutation
      description: Create one paused search campaign with its daily budget.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: Microsoft Advertising returned the new campaign ID.}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising rejected the campaign., optional: true}
        - {id: uncertain, goName: Uncertain, description: The create outcome could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: One paused search campaign was created.
          output: {campaignId: '98765'}
    - name: updateCampaign
      goName: UpdateCampaign
      inputType: UpdateCampaignInput
      outputType: CampaignMutationResult
      kind: mutation
      description: Set a campaign name, status, or daily budget.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Microsoft Advertising accepted the campaign changes.}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising rejected the changes., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Microsoft Advertising returned invalid update JSON., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One campaign was updated.
          output: {campaignId: '98765'}
    - name: deleteCampaign
      goName: DeleteCampaign
      inputType: DeleteCampaignInput
      outputType: CampaignMutationResult
      kind: mutation
      description: Delete one campaign by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Microsoft Advertising accepted the deletion.}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Microsoft Advertising returned invalid deletion JSON., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: One campaign was deleted.
          output: {campaignId: '98765'}
    - name: listCampaigns
      goName: ListCampaigns
      inputType: ListCampaignsInput
      outputType: CampaignsPage
      kind: query
      description: List campaign IDs, names, types, and statuses in one account.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: listed, goName: Listed, description: Microsoft Advertising returned the account's campaigns.}
        - {id: providerRejected, goName: ProviderRejected, description: Microsoft Advertising conclusively rejected the query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Microsoft Advertising returned malformed or oversized campaign JSON., optional: true}
        - {id: defect, goName: Defect, description: The account ID or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One example search campaign is returned.
          output: {campaigns: [{id: '123456789', name: Sample Search, campaignType: Search, status: Active}]}
