apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: microsoft-azure-blob
  displayName: Azure Blob Storage
  description: Manage Azure Storage containers and list, download, upload, and delete bounded blobs with Shared Key authorization.
  company: Microsoft
  categories: [databases-storage, files-documents]
  version: v0.2.0
spec:
  provider: microsoft-azure-blob
  languages:
    python:
      version: v0.1.0
      package: dex-connector-microsoft-azure-blob
      operations: [getBlob]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-microsoft-azure-blob'
      operations: [getBlob]
      triggers: []
  codegen:
    go:
      package: azureblob
  configuration:
    fields:
      - name: accountName
        goName: AccountName
        type: string
        required: true
        description: Non-secret lowercase storage account name of 3 to 24 letters or digits. At https://portal.azure.com > Storage accounts > selected account > Overview, copy the Storage account name. Blank prevents signing.
      - name: endpoint
        goName: Endpoint
        type: url
        description: Optional Blob service URL. Blank derives https://<accountName>.blob.core.windows.net from accountName. Override only for a trusted compatible endpoint; local tests may use loopback HTTP.
      - name: timeout
        goName: Timeout
        type: duration
        default: 15s
        description: Maximum duration of one Azure Storage request as a positive Go duration such as 15s. Blank uses the displayed default; increase only for a slow network.
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        default: 1048576
        description: Maximum complete blob body or list XML in bytes. Blank uses the displayed default; increase only for a known larger result that the Flow can safely store.
      - name: listPageSize
        goName: ListPageSize
        type: integer
        default: 100
        description: Positive maximum number of blob or container names per list page. Blank uses the displayed default; increase for a large account when the returned XML fits maxResponseBytes.
  auth:
    type: apiKey
    connectionKind: microsoft-azure-blob-shared-key
    fields:
      - name: account_key
        goName: AccountKey
        type: secretString
        required: true
        description: Secret base64 storage account key from https://portal.azure.com > Storage accounts > selected account > Security + networking > Access keys > Show keys. Copy a key value, not the connection string. Blank prevents signing; rotate through the other key.
    guide:
      startURL: https://portal.azure.com
      steps:
        - Open Storage accounts > selected account > Overview and copy its lowercase account name into accountName. The account must allow Shared Key access; accounts configured to disallow Shared Key need a different authorization method and cannot use this connector release.
        - Open Security + networking > Access keys > Show keys. Copy one base64 key value into the secret account_key field. Grant the connection only to trusted Workers; this key authorizes the storage account. Never put the key in Flow input.
        - Open Data storage > Containers > selected container and note its lowercase name and blob path. Use those values as Flow input. Leave endpoint, timeout, maxResponseBytes, and listPageSize blank for their displayed defaults.
        - Rotate by selecting the other access key, updating this connection, verifying a Flow, then regenerating the old key under Access keys. Remove the connection when access should end.
  operations:
    - name: listContainers
      goName: ListContainers
      inputType: ListContainersInput
      outputType: ContainersPage
      kind: query
      description: List one bounded page of container names in the storage account.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Azure returned one container page.}
        - {id: providerRejected, goName: ProviderRejected, description: Azure rejected the list request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Azure returned invalid or oversized XML., optional: true}
        - {id: defect, goName: Defect, description: The marker or connection is invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One example container is listed.
          output: {names: [docs], nextMarker: ''}
    - name: getContainer
      goName: GetContainer
      inputType: GetContainerInput
      outputType: ContainerProperties
      kind: query
      description: Read one container's ETag and last modified date.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Azure returned container properties.}
        - {id: missing, goName: Missing, description: The container does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Azure rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Azure returned invalid response metadata., optional: true}
        - {id: defect, goName: Defect, description: The container or connection is invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One example container is found.
          output: {etag: '"0x1"', lastModified: 'Mon, 02 Jan 2006 15:04:05 GMT'}
    - name: createContainer
      goName: CreateContainer
      inputType: CreateContainerInput
      outputType: ContainerWriteResult
      kind: mutation
      description: Create a container with a unique lowercase name.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: created, goName: Created, description: Azure created the named container.}
        - {id: alreadyExists, goName: AlreadyExists, description: Azure reports the named container already exists., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Azure rejected container creation., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Azure returned invalid response metadata., optional: true}
        - {id: defect, goName: Defect, description: The container or connection is invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: One example container was created.
          output: {container: docs}
    - name: deleteContainer
      goName: DeleteContainer
      inputType: DeleteContainerInput
      outputType: ContainerDeleteResult
      kind: mutation
      description: Delete a container and all blobs within it.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Azure accepted deletion or the container was already missing.}
        - {id: providerRejected, goName: ProviderRejected, description: Azure rejected container deletion., optional: true}
        - {id: defect, goName: Defect, description: The container or connection is invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: One example container was deleted.
          output: {deleted: true}
    - name: listBlobs
      goName: ListBlobs
      inputType: ListBlobsInput
      outputType: BlobsPage
      kind: query
      description: List one page of blob names in a container, optionally by prefix.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Azure returned one blob page.}
        - {id: missing, goName: Missing, description: The container does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Azure rejected the list request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Azure returned invalid or oversized XML., optional: true}
        - {id: defect, goName: Defect, description: The container or connection is invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One example blob is listed.
          output: {names: [example.txt], nextMarker: ''}
    - name: putBlob
      goName: PutBlob
      inputType: PutBlobInput
      outputType: BlobWriteResult
      kind: mutation
      description: Create or replace one bounded block blob from base64 bytes.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: stored, goName: Stored, description: Azure stored the complete block blob.}
        - {id: providerRejected, goName: ProviderRejected, description: Azure rejected the write., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Azure returned invalid response metadata., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - name: storedDefault
          branch: stored
          default: true
          description: One example blob was stored.
          output: {etag: '"0x1"'}
    - name: deleteBlob
      goName: DeleteBlob
      inputType: DeleteBlobInput
      outputType: BlobDeleteResult
      kind: mutation
      description: Delete one blob and its snapshots by name.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Azure accepted the deletion or the blob was already missing.}
        - {id: providerRejected, goName: ProviderRejected, description: Azure rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: The input or connection is invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: One example blob was deleted.
          output: {deleted: true}
    - name: getBlob
      goName: GetBlob
      inputType: GetBlobInput
      outputType: BlobDownload
      kind: query
      description: Download one bounded blob and return its bytes as base64 with content type and ETag.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: downloaded, goName: Downloaded, description: Azure returned the complete blob.}
        - {id: missing, goName: Missing, description: The container or blob does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Azure conclusively rejected the download or credentials., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Azure returned an oversized body or invalid response metadata., optional: true}
        - {id: defect, goName: Defect, description: "The account, container, blob path, endpoint, or key is invalid.", optional: true}
      mocks:
        - name: downloadedDefault
          branch: downloaded
          default: true
          description: One example text blob was downloaded.
          output: {dataBase64: aGVsbG8=, contentType: text/plain, etag: '"0x1"'}
