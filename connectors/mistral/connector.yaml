apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: mistral
  displayName: Mistral AI
  description: Mistral AI text generation with Mistral Large, Medium, Small, and Ministral models, JSON Schema structured output, reasoning effort, token usage, and streamed text.
  company: Mistral
  version: v0.1.0
spec:
  provider: mistral
  codegen:
    go:
      package: mistral
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "Mistral model for this connection, such as mistral-large-2512 or mistral-small-2603. Blank uses mistral-large-2512. A request that names a model overrides it."
        required: false
        default: mistral-large-2512
      - name: endpoint
        goName: Endpoint
        type: url
        description: "Mistral API base endpoint: https://api.mistral.ai/v1 (global), https://api.eu.mistral.ai/v1 (EU regional inference), or https://api.us.mistral.ai/v1 (US regional inference). Blank uses the global endpoint. A regional endpoint serves only the models hosted in its region."
        required: false
        default: https://api.mistral.ai/v1
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete provider response in bytes; enter a positive integer only when a gateway needs a different safety limit. Larger responses select invalidResponse.
        required: false
        default: 8388608
  auth:
    type: apiKey
    connectionKind: mistral-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: Secret workspace API key from Mistral AI Studio > API Keys; copy the key when it is created. It is sent only as an Authorization bearer token.
        required: true
    guide:
      startURL: https://console.mistral.ai/api-keys
      steps:
        - In Mistral AI Studio, select the workspace that should own usage and open API Keys.
        - Choose Create new key, set its name and optional expiration, then copy the secret displayed once.
        - Keep a regional endpoint paired with models available in that region; otherwise leave endpoint and limits blank for the displayed defaults.
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, mistral.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      # The picker cannot read the connection's endpoint, so it lists the global
      # catalog; a regional endpoint serves only its region's subset.
      - id: listModels
        capability: mistral.models-list
        request:
          method: GET
          url: https://api.mistral.ai/v1/models
          credential: {field: api_key, scheme: bearer}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: Choose one Step's Mistral model from Mistral AI's live model list.
        backendCapabilities: [mistral.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: generateText
      goName: GenerateText
      inputType: GenerateTextRequest
      outputType: GenerateTextResponse
      kind: query
      description: Generate text or JSON Schema structured output with a Mistral model through the stateless Chat Completions endpoint.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: The model finished normally and returned text.}
        - {id: truncated, goName: Truncated, description: "The model stopped at the output token limit or the model's context length and returned any partial text.", optional: true}
        - {id: blocked, goName: Blocked, description: "The provider stopped the response for a content policy, or the model refused.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Mistral AI conclusively rejected the request, such as invalid credentials, an unknown or retired model, or a model the endpoint's region does not serve.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Mistral AI returned a malformed, oversized, or unusable response, including structured output that does not match its schema.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      progress: [text]
      execution:
        # Requests stream, so a long generation sends tokens instead of holding a
        # silent request open, and the streaming generateText budget applies.
        executeMethodTimeout: 900s
        heartbeatTimeout: 60s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 4, totalDuration: 30m}
