apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: meistertask
  displayName: MeisterTask
  description: Read a task's name and status from MeisterTask.
  company: MeisterTask
  version: v0.1.0
spec:
  provider: meistertask
  languages:
    python:
      version: v0.1.0
      package: dex-connector-meistertask
      operations: [getTask]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-meistertask"
      operations: [getTask]
      triggers: []
  codegen:
    go:
      package: meistertask
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: MeisterTask API root as an absolute HTTPS URL. Blank uses the displayed endpoint; override only for a trusted local test gateway.
        default: https://www.meistertask.com/api
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow task reads.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete task response in bytes as a positive integer. Blank uses the displayed default; increase for unusually large task metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: meistertask-personal-token
    fields:
      - name: api_token
        goName: APIToken
        type: secretString
        required: true
        description: Secret personal access token from MindMeister API page > Add personal access token. Select userinfo.profile, userinfo.email, and meistertask scopes. Copy the complete opaque value; blank prevents calls. Dex sends it only in the Authorization Bearer header.
    guide:
      startURL: https://www.mindmeister.com/api
      steps:
        - Sign in at MindMeister API page > Add personal access token, select userinfo.profile, userinfo.email, and meistertask scopes, and copy the secret opaque token into Dex Web api_token. Blank is invalid. Revoke it on the same page. A MindMeister Basic account and team-admin approval may be required to access that page.
        - Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults. Find the non-secret positive numeric task ID in MeisterTask task details or GET /tasks and pass it as taskId; blank is invalid. The token owner needs access to the task.
  operations:
    - name: getTask
      goName: GetTask
      inputType: GetTaskInput
      outputType: TaskSummary
      kind: query
      description: Read one task's ID, status code, and name.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: MeisterTask returned the task.}
        - {id: notFound, goName: NotFound, description: MeisterTask did not expose the task., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: MeisterTask returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample task is returned.
          output: {id: "15", status: "1", name: Task Name}
