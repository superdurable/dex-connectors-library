apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: meistertask
  displayName: MeisterTask
  description: Read and manage MeisterTask tasks and project work.
  company: MeisterTask
  categories: [project-management]
  version: v0.2.0
spec:
  provider: meistertask
  languages:
    python:
      version: v0.1.0
      package: dex-connector-meistertask
      operations: [getTask]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-meistertask"
      operations: [getTask]
      triggers: []
  codegen:
    go:
      package: meistertask
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: MeisterTask API root as an absolute HTTPS URL. Blank uses the displayed endpoint; override only for a trusted local test gateway.
        default: https://www.meistertask.com/api
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow task reads.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete task response in bytes as a positive integer. Blank uses the displayed default; increase for unusually large task metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: meistertask-personal-token
    fields:
      - name: api_token
        goName: APIToken
        type: secretString
        required: true
        description: Secret personal access token from MindMeister API page > Add personal access token. Select userinfo.profile, userinfo.email, and meistertask scopes. Copy the complete opaque value; blank prevents calls. Dex sends it only in the Authorization Bearer header.
    guide:
      startURL: https://www.mindmeister.com/api
      steps:
        - Sign in at MindMeister API page > Add personal access token, select userinfo.profile, userinfo.email, and meistertask scopes, and copy the secret opaque token into Dex Web api_token. Blank is invalid. Revoke it on the same page. A MindMeister Basic account and team-admin approval may be required to access that page.
        - Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults. Find the non-secret positive numeric task ID in MeisterTask task details or GET /tasks and pass it as taskId; blank is invalid. The token owner needs access to the task.
        - Find non-secret positive project IDs in MeisterTask Projects or GET /projects. Pass one as projectId for getProject or updateProject; blank is invalid. ListProjects page and items are positive integers, with zero selecting the provider first page or size; blank status uses active projects.
        - Find non-secret positive section IDs in a MeisterTask project board or GET /sections. Pass one as sectionId for getSection or updateSection; createSection needs its parent projectId. Blank IDs or names are invalid; blank list status uses active sections.
        - For updateTask, find assignedToId in the project member list (GET /projects/{projectId}/members), sectionId in the project board or GET /sections, and provide due as an RFC 3339 timestamp such as 2026-11-18T00:00:00Z. Omit each field to leave its current value unchanged.
        - For comments, open a task's Comments view or GET /tasks/{taskId}/comments to find positive taskId and commentId values; blank IDs are invalid. CreateComment text is nonempty Markdown, not a secret; blank is invalid. Page and items are positive integers with zero selecting provider defaults.
        - For labels, open a project's Tags view or GET /projects/{projectId}/labels for positive projectId and labelId values. GET /tasks/{taskId}/task_labels returns the distinct positive taskLabelId attachment ID for removal. Blank IDs are invalid; the task must belong to the label's project.
        - For task checklists, open a task's checklist view or GET /tasks/{taskId}/checklists for positive taskId and checklistId values. Blank IDs or names are invalid. Page and items are positive integers with zero selecting provider defaults; updateChecklist name replaces the current name.
  operations:
    - name: listTaskChecklists
      goName: ListTaskChecklists
      inputType: ListTaskChecklistsInput
      outputType: TaskChecklistsPage
      kind: query
      description: Read one page of checklists attached to a task.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: MeisterTask returned the checklist outcome.}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: MeisterTask returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample checklist outcome is available.
          output: {checklists: [{id: '20', taskId: '15', name: Steps}], page: 1}
    - name: getChecklist
      goName: GetChecklist
      inputType: GetChecklistInput
      outputType: ChecklistSummary
      kind: query
      description: Read one task checklist's identity and name.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: MeisterTask returned the checklist outcome.}
        - {id: notFound, goName: NotFound, description: MeisterTask did not expose the checklist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: MeisterTask returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample checklist outcome is available.
          output: {id: '20', taskId: '15', name: Steps}
    - name: updateChecklist
      goName: UpdateChecklist
      inputType: UpdateChecklistInput
      outputType: ChecklistSummary
      kind: mutation
      description: Rename one task checklist.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: MeisterTask returned the checklist outcome.}
        - {id: notFound, goName: NotFound, description: MeisterTask did not expose the checklist., optional: true}
