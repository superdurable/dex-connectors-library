apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: meistertask
  displayName: MeisterTask
  description: Read and manage MeisterTask tasks and project work.
  company: MeisterTask
  categories: [project-management]
  version: v0.2.0
spec:
  provider: meistertask
  languages:
    python:
      version: v0.1.0
      package: dex-connector-meistertask
      operations: [getTask]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-meistertask"
      operations: [getTask]
      triggers: []
  codegen:
    go:
      package: meistertask
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: MeisterTask API root as an absolute HTTPS URL. Blank uses the displayed endpoint; override only for a trusted local test gateway.
        default: https://www.meistertask.com/api
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow task reads.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete task response in bytes as a positive integer. Blank uses the displayed default; increase for unusually large task metadata.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: meistertask-personal-token
    fields:
      - name: api_token
        goName: APIToken
        type: secretString
        required: true
        description: Secret personal access token from MindMeister API page > Add personal access token. Select userinfo.profile, userinfo.email, and meistertask scopes. Copy the complete opaque value; blank prevents calls. Dex sends it only in the Authorization Bearer header.
    guide:
      startURL: https://www.mindmeister.com/api
      steps:
        - Sign in at MindMeister API page > Add personal access token, select userinfo.profile, userinfo.email, and meistertask scopes, and copy the secret opaque token into Dex Web api_token. Blank is invalid. Revoke it on the same page. A MindMeister Basic account and team-admin approval may be required to access that page.
        - Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults. Find the non-secret positive numeric task ID in MeisterTask task details or GET /tasks and pass it as taskId; blank is invalid. The token owner needs access to the task.
        - Find non-secret positive project IDs in MeisterTask Projects or GET /projects. Pass one as projectId for getProject or updateProject; blank is invalid. ListProjects page and items are positive integers, with zero selecting the provider first page or size; blank status uses active projects.
  operations:
    - name: listProjects
      goName: ListProjects
      inputType: ListProjectsInput
      outputType: ProjectsPage
      kind: query
      description: Read one page of projects visible to the token owner.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: MeisterTask returned the projects.}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: MeisterTask returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample project is available.
          output: {projects: [{id: '123', name: Example Project, status: '1'}], page: 1}
    - name: getProject
      goName: GetProject
      inputType: GetProjectInput
      outputType: ProjectSummary
      kind: query
      description: Read one project's identity and status.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: MeisterTask returned the project.}
        - {id: notFound, goName: NotFound, description: MeisterTask did not expose the project., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: MeisterTask returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample project is available.
          output: {id: '123', name: Example Project, status: '1'}
    - name: updateProject
      goName: UpdateProject
      inputType: UpdateProjectInput
      outputType: ProjectSummary
      kind: mutation
      description: Set a project's name, notes, or status to absolute values.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: MeisterTask returned the project.}
        - {id: notFound, goName: NotFound, description: MeisterTask did not expose the project., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: MeisterTask returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: A sample project is available.
          output: {id: '123', name: Updated Project, status: '1'}
    - name: createProject
      goName: CreateProject
      inputType: CreateProjectInput
      outputType: ProjectSummary
      kind: mutation
      description: Create a named project.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, dispatchFence: true, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: MeisterTask returned the project.}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the request., optional: true}
        - {id: uncertain, goName: Uncertain, description: Creation may have succeeded; inspect projects before manual retry., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample project is available.
          output: {id: '123', name: Example Project, status: '1'}
    - name: listTasks
      goName: ListTasks
      inputType: ListTasksInput
      outputType: TasksPage
      kind: query
      description: List available tasks with optional status and page filters.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: MeisterTask returned a page of tasks.}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the list request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: MeisterTask returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: One task is available.
          output: {tasks: [{id: "15", status: "1", name: Task Name}], page: 1}
    - name: getTask
      goName: GetTask
      inputType: GetTaskInput
      outputType: TaskSummary
      kind: query
      description: Read one task's ID, status code, and name.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: MeisterTask returned the task.}
        - {id: notFound, goName: NotFound, description: MeisterTask did not expose the task., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: MeisterTask returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample task is returned.
          output: {id: "15", status: "1", name: Task Name}
    - name: updateTask
      goName: UpdateTask
      inputType: UpdateTaskInput
      outputType: TaskSummary
      kind: mutation
      description: Set a task's name, notes, or status to absolute values.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: MeisterTask returned the updated task.}
        - {id: notFound, goName: NotFound, description: MeisterTask did not expose the task., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: MeisterTask returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: One task name is updated.
          output: {id: "15", status: "1", name: Updated Task Name}
    - name: createTask
      goName: CreateTask
      inputType: CreateTaskInput
      outputType: TaskSummary
      kind: mutation
      description: Create a named task in a project section.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, dispatchFence: true, repeatOnUnknown: limited, maxSends: 3}
      branches:
        - {id: created, goName: Created, description: MeisterTask returned the created task.}
        - {id: providerRejected, goName: ProviderRejected, description: MeisterTask conclusively rejected creation., optional: true}
        - {id: uncertain, goName: Uncertain, description: Creation may have succeeded; inspect the section before manual retry., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: One task is created in a section.
          output: {id: "15", status: "1", name: Task Name}
