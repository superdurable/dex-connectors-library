        - {id: invalidResponse, goName: InvalidResponse, description: Close returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: A Meridian Labs call note was updated.
          output: {id: acti_call_meridian1, leadId: lead_meridian1, direction: outbound, status: completed, durationSeconds: 120, note: Follow-up agreed}
    - name: deleteCall
      goName: DeleteCall
      inputType: DeleteCallInput
      outputType: DeletedCall
      kind: mutation
      description: Delete a call activity by ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Close accepted deletion or the call is already absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Close conclusively rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Close returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
