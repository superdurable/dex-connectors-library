apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: close
  displayName: Close
  description: Read and maintain Close leads with a connection-owned API key.
  company: Close
  categories: [crm-sales]
  version: v0.3.0
spec:
  provider: close
  languages:
    python:
      version: v0.1.0
      operations: [listLeads, getLead]
      triggers: []
    typescript:
      version: v0.1.1
      package: '@superdurable/connector-close'
      operations: [listLeads, getLead]
      triggers: []
  codegen:
    go:
      package: close
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: "Public Close HTTPS API root; blank uses the displayed default. Override only for a trusted compatible gateway or loopback test server, and never include a key in the URL."
        default: https://api.close.com/api/v1
      - name: timeout
        goName: Timeout
        type: duration
        description: "Maximum duration of one Close HTTP read, as a positive Go duration such as 15s or 1m. Blank uses the displayed default; raise it only for slow large reads."
        default: 30s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum bytes accepted from one Close JSON response, as a positive integer. Blank uses the displayed default; raise it for large pages or files. Oversized data selects invalidResponse."
        default: 4194304
  auth:
    type: apiKey
    connectionKind: close-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: "Secret Close API token from https://app.close.com/settings/api/ (Settings > Developer > API Keys); copy the token when generated, paste it here, and keep it secret. Blank makes every operation select defect before a request."
        required: true
    guide:
      startURL: https://app.close.com/settings/api/
      steps:
        - "Open https://app.close.com/settings/api/ and sign in; navigate to Settings > Developer > API Keys."
        - "Create a token for the identity that may read and maintain the desired leads and contacts, then copy the secret value when shown."
        - "Paste it into secret api_key. Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults."
        - "To revoke access, delete the token on the same provider page."
  operations:
    - name: listLeads
      goName: ListLeads
      inputType: ListLeadsInput
      outputType: LeadPage
      kind: query
      description: Read Close data from the documented listLeads endpoint.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "Close returned the requested data."}
        - {id: providerRejected, goName: ProviderRejected, description: "Close conclusively rejected the read.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Close returned malformed or oversized JSON.", optional: true}
        - {id: defect, goName: Defect, description: "Local input or connection credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 45s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: listed
          description: "One Meridian sample record from the same example world."
          default: true
          output: {leads: [{id: lead_meridian1, name: Meridian Labs}], hasMore: false}
        - name: invalidKey
          branch: providerRejected
          description: "The connection token is invalid."
          failure: {kind: AUTHENTICATION, message: "Close rejected the token."}
    - name: updateLead
      goName: UpdateLead
      inputType: UpdateLeadInput
      outputType: Lead
      kind: mutation
      description: Replace selected lead name or description fields.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Close returned the updated lead.}
        - {id: notFound, goName: NotFound, description: The lead does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Close conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Close returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: Meridian Labs was renamed.
          output: {id: lead_meridian1, name: Meridian Research}
    - name: deleteLead
      goName: DeleteLead
      inputType: DeleteLeadInput
      outputType: DeletedLead
      kind: mutation
      description: Delete a lead and its child records.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Close accepted deletion or the lead is already absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Close conclusively rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Close returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: Meridian Labs was deleted.
          output: {leadId: lead_meridian1}
    - name: listContacts
      goName: ListContacts
      inputType: ListContactsInput
      outputType: ContactPage
      kind: query
      description: List a bounded page of contacts for one lead.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Close returned the contact page.}
        - {id: providerRejected, goName: ProviderRejected, description: Close conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Close returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: Meridian Labs has one sample contact.
          output: {contacts: [{id: cont_meridian1, name: Ada, leadId: lead_meridian1}], hasMore: false}
    - name: getContact
      goName: GetContact
      inputType: GetContactInput
      outputType: Contact
      kind: query
      description: Fetch one contact by its Close identifier.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Close returned the contact.}
        - {id: notFound, goName: NotFound, description: The contact does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Close conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Close returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: Meridian Labs contact Ada is returned.
          output: {id: cont_meridian1, name: Ada, leadId: lead_meridian1}
    - name: updateContact
      goName: UpdateContact
      inputType: UpdateContactInput
      outputType: Contact
      kind: mutation
      description: Replace selected contact name or title fields.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: Close returned the updated contact.}
        - {id: notFound, goName: NotFound, description: The contact does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Close conclusively rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Close returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: Meridian Labs contact Ada has a new title.
          output: {id: cont_meridian1, name: Ada, leadId: lead_meridian1}
    - name: deleteContact
      goName: DeleteContact
      inputType: DeleteContactInput
      outputType: DeletedContact
      kind: mutation
      description: Delete one contact from its lead.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 45s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Close accepted deletion or the contact is already absent.}
        - {id: providerRejected, goName: ProviderRejected, description: Close conclusively rejected the deletion., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Close returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: Meridian Labs contact Ada was deleted.
          output: {contactId: cont_meridian1}
    - name: getLead
      goName: GetLead
      inputType: GetLeadInput
      outputType: Lead
      kind: query
      description: Read Close data from the documented getLead endpoint.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "Close returned the requested data."}
        - {id: notFound, goName: NotFound, description: "Close does not have the requested resource.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Close conclusively rejected the read.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Close returned malformed or oversized JSON.", optional: true}
        - {id: defect, goName: Defect, description: "Local input or connection credentials are invalid.", optional: true}
      execution:
        executeMethodTimeout: 45s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: found
          description: "One Meridian sample record from the same example world."
          default: true
          output: {id: lead_meridian1, name: Meridian Labs}
        - name: invalidKey
          branch: providerRejected
          description: "The connection token is invalid."
          failure: {kind: AUTHENTICATION, message: "Close rejected the token."}
