apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: recurly
  displayName: Recurly
  description: Read and manage Recurly accounts, subscriptions, plans, and invoices through the Subscriptions API.
  company: Recurly
  categories: [finance-payments]
  version: v0.2.0
spec:
  provider: recurly
  languages:
    python:
      version: v0.1.0
      package: dex-connector-recurly
      operations: [getAccount]
      triggers: []
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-recurly"
      operations: [getAccount]
      triggers: []
  codegen:
    go:
      package: recurly
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Recurly Subscriptions API v3 root as an absolute HTTPS URL. Blank uses the displayed default; override only for a trusted local test gateway.
        default: https://v3.recurly.com
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one API request as a positive Go duration such as 15s. Blank uses the displayed default; increase for slow account reads.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete account response in bytes as a positive integer. Blank uses the displayed default; increase for unusually large accounts.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: recurly-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        required: true
        description: Secret Recurly Private API Key from Integrations > API Credentials > Add Private API Key. Copy the complete unencoded key; blank prevents calls. Dex sends it as HTTP Basic username with an empty password. Recurly keys grant full account access.
    guide:
      startURL: https://app.recurly.com
      steps:
        - Sign in to the Recurly site with Integration permission. Open Integrations > API Credentials, scroll to Add Private API Key, name the integration and click Save Changes. Copy the complete unencoded secret key into Dex Web secret api_key; blank is invalid. Regenerate or revoke it later under Developers > API Keys. Do not paste the Base64 example shown under Need help using the API Key.
        - Leave baseUrl, timeout, and maxResponseBytes blank for their displayed defaults. Find the non-secret account ID in Recurly account details or the API account response and enter it as accountId; blank is invalid. Account codes require a code- prefix, for example code-acme. IDs and codes each have at most 50 characters.
  operations:
    - name: listInvoices
      goName: ListInvoices
      inputType: ListInvoicesInput
      outputType: InvoicePage
      kind: query
      description: List one bounded page of invoice states.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Recurly returned a page of invoices.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected invoice listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Recurly returned unusable invoice list data., optional: true}
        - {id: defect, goName: Defect, description: Invalid page size or credentials., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample invoice page is returned.
          output: {invoices: [{id: e28zov4fw0v2, state: open}], hasMore: false}
    - name: getInvoice
      goName: GetInvoice
      inputType: GetInvoiceInput
      outputType: InvoiceSummary
      kind: query
      description: Read one invoice state by ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Recurly returned the invoice.}
        - {id: notFound, goName: NotFound, description: The invoice was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected invoice lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Recurly returned unusable invoice data., optional: true}
        - {id: defect, goName: Defect, description: Invalid ID or credentials., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample invoice is returned.
          output: {id: e28zov4fw0v2, state: open}
    - name: listPlans
      goName: ListPlans
      inputType: ListPlansInput
      outputType: PlanPage
      kind: query
      description: List one bounded page of plan identities.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Recurly returned a page of plans.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected plan listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Recurly returned unusable plan list data., optional: true}
        - {id: defect, goName: Defect, description: Invalid page size or credentials., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample plan page is returned.
          output: {plans: [{id: e28zov4fw0v2, code: standard, name: Standard}], hasMore: false}
    - name: getPlan
      goName: GetPlan
      inputType: GetPlanInput
      outputType: PlanSummary
      kind: query
      description: Read one plan identity by ID or code.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Recurly returned the plan.}
        - {id: notFound, goName: NotFound, description: The plan was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected plan lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Recurly returned unusable plan data., optional: true}
        - {id: defect, goName: Defect, description: Invalid ID or credentials., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample plan is returned.
          output: {id: e28zov4fw0v2, code: standard, name: Standard}
    - name: createPlan
      goName: CreatePlan
      inputType: CreatePlanInput
      outputType: PlanSummary
      kind: mutation
      description: Create a fixed-price plan with a call-derived unique code.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: created, goName: Created, description: Recurly created or confirmed the plan.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected plan creation., optional: true}
        - {id: defect, goName: Defect, description: Invalid plan input or credentials., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample fixed-price plan is created.
          output: {id: e28zov4fw0v2, code: standard_0123456789abcdef0123456789abcdef, name: Standard}
    - name: renamePlan
      goName: RenamePlan
      inputType: RenamePlanInput
      outputType: PlanSummary
      kind: mutation
      description: Replace a plan's displayed name.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: renamed, goName: Renamed, description: Recurly renamed the plan.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected plan rename., optional: true}
        - {id: defect, goName: Defect, description: Invalid plan ID or name or credentials., optional: true}
      mocks:
        - name: renamedDefault
          branch: renamed
          default: true
          description: A sample plan was renamed.
          output: {id: e28zov4fw0v2, code: standard, name: Standard Plus}
    - name: deletePlan
      goName: DeletePlan
      inputType: DeletePlanInput
      outputType: DeletedPlan
      kind: mutation
      description: Remove a plan from future use.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: Recurly removed or confirmed the plan.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected plan deletion., optional: true}
        - {id: defect, goName: Defect, description: Invalid plan ID or credentials., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: A sample plan was removed.
          output: {id: e28zov4fw0v2}
    - name: listSubscriptions
      goName: ListSubscriptions
      inputType: ListSubscriptionsInput
      outputType: SubscriptionPage
      kind: query
      description: List one bounded page of subscription states.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Recurly returned a page of subscriptions.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected subscription listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Recurly returned unusable subscription list data., optional: true}
        - {id: defect, goName: Defect, description: Invalid page size or credentials., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample subscription page is returned.
          output: {subscriptions: [{id: e28zov4fw0v2, state: active}], hasMore: false}
    - name: getSubscription
      goName: GetSubscription
      inputType: GetSubscriptionInput
      outputType: SubscriptionSummary
      kind: query
      description: Read one subscription state by ID.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: Recurly returned the subscription.}
        - {id: notFound, goName: NotFound, description: The subscription was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected subscription lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Recurly returned unusable subscription data., optional: true}
        - {id: defect, goName: Defect, description: Invalid ID or credentials., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample active subscription is returned.
          output: {id: e28zov4fw0v2, state: active}
    - name: cancelSubscription
      goName: CancelSubscription
      inputType: CancelSubscriptionInput
      outputType: SubscriptionSummary
      kind: mutation
      description: Cancel a subscription at its term end.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: cancelled, goName: Cancelled, description: Recurly cancelled or confirmed the subscription.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected subscription cancellation., optional: true}
        - {id: defect, goName: Defect, description: Invalid ID or credentials., optional: true}
      mocks:
        - name: cancelledDefault
          branch: cancelled
          default: true
          description: A sample subscription was cancelled.
          output: {id: e28zov4fw0v2, state: canceled}
    - name: reactivateSubscription
      goName: ReactivateSubscription
      inputType: ReactivateSubscriptionInput
      outputType: SubscriptionSummary
      kind: mutation
      description: Reactivate a cancelled subscription before expiration.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: reactivated, goName: Reactivated, description: Recurly reactivated or confirmed the subscription.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected subscription reactivation., optional: true}
        - {id: defect, goName: Defect, description: Invalid ID or credentials., optional: true}
      mocks:
        - name: reactivatedDefault
          branch: reactivated
          default: true
          description: A sample subscription is active.
          output: {id: e28zov4fw0v2, state: active}
    - name: listAccounts
      goName: ListAccounts
      inputType: ListAccountsInput
      outputType: AccountPage
      kind: query
      description: List one bounded page of account identities.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: Recurly returned a page of accounts.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected account listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Recurly returned unusable account list data., optional: true}
        - {id: defect, goName: Defect, description: Invalid account page size or credentials., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample account page is returned.
          output: {accounts: [{id: e28zov4fw0v2, code: acme-corp}], hasMore: false}
    - name: createAccount
      goName: CreateAccount
      inputType: CreateAccountInput
      outputType: AccountIdentity
      kind: mutation
      description: Create an account with a call-derived unique code.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: created, goName: Created, description: Recurly created or confirmed the account.}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly rejected account creation., optional: true}
        - {id: defect, goName: Defect, description: Invalid code prefix or credentials., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample account is created.
          output: {id: e28zov4fw0v2, code: dex_0123456789abcdef0123456789abcdef}
    - name: getAccount
      goName: GetAccount
      inputType: GetAccountInput
      outputType: AccountIdentity
      kind: query
      description: Read one account's ID and code without contact, billing, or payment details.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async}
      branches:
        - {id: found, goName: Found, description: Recurly returned the account.}
        - {id: notFound, goName: NotFound, description: Recurly did not expose the account., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Recurly conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Recurly returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: One sample account is returned.
          output: {id: e28zov4fw0v2, code: acme-corp}
