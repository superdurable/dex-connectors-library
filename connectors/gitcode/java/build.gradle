plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories { mavenCentral() }

dependencies {
    implementation 'nu.validator:htmlparser:1.4.16'
    api "io.superdurable:dex-connectors-sdk:${dexConnectorsSdkVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        connector(MavenPublication) {
            from components.java
            pom {
                name = project.name
                description = 'Read GitCode repository metadata from a Dex Flow.'
                url = 'https://github.com/superdurable/dex-connectors-library'
                licenses { license { name = 'MIT'; url = 'https://opensource.org/licenses/MIT' } }
                developers { developer { name = 'Super Durable' } }
                scm {
                    url = 'https://github.com/superdurable/dex-connectors-library'
                    connection = 'scm:git:https://github.com/superdurable/dex-connectors-library.git'
                    developerConnection = 'scm:git:ssh://git@github.com/superdurable/dex-connectors-library.git'
                }
            }
        }
    }
}

sourceSets {
    example {
        java.srcDir 'examples'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    test {
        java.srcDir '../../../conformance/runners/java'
        compileClasspath += sourceSets.example.output
        runtimeClasspath += sourceSets.example.output
    }
}

tasks.register('repositoryWorker', JavaExec) {
    classpath = sourceSets.example.runtimeClasspath
    mainClass = 'io.superdurable.dexconnectors.gitcode.RepositoryWorker'
}

test {
    inputs.file(providers.environmentVariable('CONNECTOR_CONFORMANCE_FIXTURE')
            .orElse('../../../conformance/connectors/gitcode/scenarios.json'))
    useJUnitPlatform { excludeTags 'dex-dev' }
}
tasks.register('dexDevTest', Test) {
    useJUnitPlatform { includeTags 'dex-dev' }
    outputs.upToDateWhen { false }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}
