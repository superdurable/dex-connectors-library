apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: shopify
  displayName: Shopify
  description: "Read and count Shopify orders through typed Dex Query Steps."
  company: Shopify
  categories: [ecommerce]
  version: v0.3.0
spec:
  provider: shopify
  languages:
    typescript:
      version: v0.1.0
      package: "@superdurable/connector-shopify"
      operations: [listOrders, getOrder]
      triggers: []
    python:
      version: v0.1.0
      operations: [listOrders, getOrder]
      triggers: []
  codegen:
    go:
      package: shopify
  configuration:
    fields:
      - name: shopSubdomain
        goName: ShopSubdomain
        type: string
        description: "Non-secret Shopify shop subdomain: the acme in https://acme.myshopify.com. At https://admin.shopify.com > Settings > Domains, find the myshopify.com domain and enter only the part before .myshopify.com, using lowercase letters, digits, and hyphens. Required; blank cannot identify a store. The connector appends /admin/api/2026-10."
        required: true
      - name: timeout
        goName: Timeout
        type: duration
        description: "Maximum duration of one provider HTTP request as a positive Go duration, such as 15s or 1m. Blank uses the displayed default; override for slow network paths."
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: "Maximum provider JSON response size in bytes as a positive integer. Blank uses the displayed default; raise only for larger result pages."
        default: 2097152
  auth:
    type: apiKey
    connectionKind: shopify-api-key
    fields:
      - name: access_token
        goName: AccessToken
        type: secretString
        description: "Secret Admin API access token of an existing admin-created custom app at https://admin.shopify.com > Settings > Apps and sales channels > Develop apps > the app > API credentials. It is an opaque token sent only in X-Shopify-Access-Token. Blank prevents calls. New admin-created custom apps are unavailable."
        required: true
    guide:
      startURL: https://admin.shopify.com/
      steps:
        - "This static-token connector is for an existing admin-created custom app; Shopify no longer allows creating new ones. In https://admin.shopify.com open Settings > Apps and sales channels > Develop apps > the existing app > Configuration > Admin API access scopes, verify read_orders for reads or write_orders for order writes; in API credentials copy its secret Admin API access token into access_token. Enter the matching shop subdomain in shopSubdomain; blank credentials prevent calls."
        - "Set shopSubdomain, timeout, and maxResponseBytes only as described below; defaults appear in parentheses in Dex Web."
  operations:
    - name: getOrder
      goName: GetOrder
      inputType: GetOrderInput
      outputType: Order
      kind: query
      description: "Read one Shopify order."
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "Read one Shopify order."}
        - {id: notFound, goName: NotFound, description: The requested resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: found
          description: "A realistic read-only getOrder response for a Meridian account."
          default: true
          output: {"id":101,"name":"#101","financial_status":"paid","total_price":"29.00","currency":"USD"}
    - name: listOrders
      goName: ListOrders
      inputType: ListOrdersInput
      outputType: OrderPage
      kind: query
      description: "List one page of Shopify orders across all order statuses, subject to Shopify's order history access."
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "List one page of Shopify orders."}
        - {id: notFound, goName: NotFound, description: The requested resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: listed
          description: "A realistic read-only listOrders response for a Meridian account."
          default: true
          output: {"orders":[{"id":101,"name":"#101","financial_status":"paid","total_price":"29.00","currency":"USD"}]}
    - name: countOrders
      goName: CountOrders
      inputType: CountOrdersInput
      outputType: OrderCount
      kind: query
      description: "Count Shopify orders with an optional status filter."
      idempotency: none
      authorization: required
      branches:
        - {id: counted, goName: Counted, description: "Count matching Shopify orders."}
        - {id: notFound, goName: NotFound, description: The requested resource was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      execution:
        repeatOnUnknown: safe
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: defaultAnswer
          branch: counted
          description: "A realistic countOrders response for a Meridian account."
          default: true
          output: {"count": 1}
    - name: createOrder
      goName: CreateOrder
      inputType: CreateOrderInput
      outputType: Order
      kind: mutation
      description: "Create an order without charging payment or sending a receipt. Requires write_orders."
      idempotency: required
      authorization: required
      branches:
        - {id: created, goName: Created, description: Shopify created the order.}
        - {id: providerRejected, goName: ProviderRejected, description: Shopify conclusively rejected the order., optional: true}
        - {id: uncertain, goName: Uncertain, description: An order may have been created but could not be confirmed., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3}
      mocks:
        - {name: createdOrder, branch: created, description: Shopify created an order., default: true, output: {id: 102, name: "#102", financial_status: pending, total_price: "29.00", currency: USD}}
    - name: updateOrder
      goName: UpdateOrder
      inputType: UpdateOrderInput
      outputType: Order
      kind: mutation
      description: "Replace an order note and tags. Requires write_orders."
      idempotency: required
      authorization: required
      branches:
        - {id: updated, goName: Updated, description: Shopify updated the order.}
        - {id: notFound, goName: NotFound, description: The order was not found., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Shopify rejected the update., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Shopify returned invalid order JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - {name: updatedOrder, branch: updated, description: Shopify updated the order., default: true, output: {id: 101, name: "#101", financial_status: paid, total_price: "29.00", currency: USD}}
    - name: deleteOrder
      goName: DeleteOrder
      inputType: DeleteOrderInput
      outputType: DeletedOrder
      kind: mutation
      description: "Delete one order. Requires write_orders."
      idempotency: required
      authorization: required
      branches:
        - {id: deleted, goName: Deleted, description: Shopify deleted the order.}
        - {id: notFound, goName: NotFound, description: The order was already absent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Shopify rejected deletion., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      mocks:
        - {name: deletedOrder, branch: deleted, description: Shopify deleted the order., default: true, output: {orderId: 101}}
