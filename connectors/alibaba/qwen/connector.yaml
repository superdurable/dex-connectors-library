apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: qwen
  displayName: Alibaba Cloud Model Studio Qwen
  description: Alibaba Cloud Model Studio text generation with Qwen models, JSON object structured output validated against a schema, Qwen3.8 reasoning effort, token usage, and streamed text.
  company: Alibaba
  version: v0.1.1
spec:
  provider: alibaba
  codegen:
    go:
      package: qwen
  configuration:
    fields:
      - name: model
        goName: Model
        type: string
        description: "Model Studio model for this connection, such as qwen3.7-plus or qwen3.8-flash. Blank uses qwen3.7-plus. A request that names a model overrides it."
        required: false
        default: qwen3.7-plus
      - name: endpoint
        goName: Endpoint
        type: url
        description: "OpenAI-compatible DashScope endpoint of the region the key belongs to: https://dashscope-intl.aliyuncs.com/compatible-mode/v1 (Singapore), https://cn-hongkong.dashscope.aliyuncs.com/compatible-mode/v1 (China (Hong Kong)), or https://dashscope.aliyuncs.com/compatible-mode/v1 (China (Beijing)). Workspace-dedicated endpoints are not accepted."
        required: false
        default: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete provider response in bytes; enter a positive integer only when a gateway needs a different safety limit. Larger responses select invalidResponse.
        required: false
        default: 8388608
  auth:
    type: apiKey
    connectionKind: qwen-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: Secret Model Studio API key for the same region as endpoint; copy the sk- value shown once after creation at Model Studio > API Key. It is sent only as an Authorization bearer token.
        required: true
    guide:
      startURL: https://bailian.console.aliyun.com/
      steps:
        - Select the region that will serve requests, then open Model Studio > API Key.
        - Choose Create API Key, select the workspace and permitted models, and copy the sk- secret shown after creation.
        - Keep endpoint in the same region as the key; leave fixed endpoint and limit fields blank unless the deployment requires an override.
  studio:
    setup:
      entrypoint: index.html
      hostApiRange: ">=0.2.0 <0.3.0"
      backendCapabilities: [use.configuration.write, qwen.models-list]
      mockScenarios: [not-configured, connected]
      icon: icon.svg
    commands:
      # Keys are region-bound, so the bundle tries Singapore, then China (Hong Kong).
      - id: listModels
        capability: qwen.models-list
        request:
          method: GET
          url: https://dashscope-intl.aliyuncs.com/api/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedQuery: {capabilities: TG, language: en-US, page_size: "100"}
          parameters:
            - {name: pageNumber, location: query, target: page_no}
      - id: listModelsHongKong
        capability: qwen.models-list
        request:
          method: GET
          url: https://cn-hongkong.dashscope.aliyuncs.com/api/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedQuery: {capabilities: TG, language: en-US, page_size: "100"}
          parameters:
            - {name: pageNumber, location: query, target: page_no}
      # Thinking-only models may lack TG, and fixedQuery cannot repeat capabilities.
      - id: listReasoningModels
        capability: qwen.models-list
        request:
          method: GET
          url: https://dashscope-intl.aliyuncs.com/api/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedQuery: {capabilities: Reasoning, language: en-US, page_size: "100"}
          parameters:
            - {name: pageNumber, location: query, target: page_no}
      - id: listReasoningModelsHongKong
        capability: qwen.models-list
        request:
          method: GET
          url: https://cn-hongkong.dashscope.aliyuncs.com/api/v1/models
          credential: {field: api_key, scheme: bearer}
          fixedQuery: {capabilities: Reasoning, language: en-US, page_size: "100"}
          parameters:
            - {name: pageNumber, location: query, target: page_no}
    units:
      - id: modelPicker
        goName: ModelPicker
        description: Choose one Step's Qwen model from Alibaba Cloud Model Studio's live text generation model list.
        backendCapabilities: [qwen.models-list]
        outputs:
          - {name: model, goName: Model, type: string}
  operations:
    - name: generateText
      goName: GenerateText
      inputType: GenerateTextRequest
      outputType: GenerateTextResponse
      kind: query
      description: Generate text or schema-validated JSON output with a Qwen model through the stateless OpenAI-compatible Chat Completions endpoint.
      idempotency: none
      branches:
        - {id: generated, goName: Generated, description: The model finished normally and returned text.}
        - {id: truncated, goName: Truncated, description: The model stopped at the output token limit and returned any partial text., optional: true}
        - {id: blocked, goName: Blocked, description: "Model Studio content moderation stopped the request or response, or the model refused.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Model Studio conclusively rejected the request, such as invalid credentials, an unknown model, or an overdue account.", optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: "Model Studio returned a malformed, oversized, or unusable response, including structured output that does not match its schema.", optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      progress: [text]
      execution:
        # Requests stream, which Model Studio recommends to avoid its
        # non-streaming timeout, so the streaming generateText budget applies.
        executeMethodTimeout: 900s
        heartbeatTimeout: 60s
        durability: sync
        retry: {initialInterval: 2s, backoffCoefficient: 2, maximumInterval: 60s, maximumAttempts: 4, totalDuration: 30m}
