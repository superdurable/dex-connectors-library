apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: oracle-netsuite
  displayName: Oracle NetSuite
  description: Read and manage customer and vendor records through NetSuite REST Web Services.
  company: Oracle
  categories: [finance-payments, crm-sales]
  version: v0.2.0
spec:
  provider: oracle-netsuite
  languages:
    python:
      version: v0.1.0
      package: dex-connector-oracle-netsuite
      operations: [getCustomer]
      triggers: []
    typescript:
      version: v0.1.0
      package: '@superdurable/connector-oracle-netsuite'
      operations: [getCustomer]
      triggers: []
  codegen:
    go:
      package: oraclenetsuite
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        required: true
        description: Non-secret account REST origin from https://system.netsuite.com > Setup > Company > Company Information > Account ID, formatted https://ACCOUNT.suitetalk.api.netsuite.com. Blank prevents record operations.
      - name: authorizationEndpoint
        goName: AuthorizationEndpoint
        type: url
        required: true
        description: Non-secret OAuth authorization URL https://ACCOUNT.app.netsuite.com/app/login/oauth2/authorize.nl for the same Account ID. Blank prevents authorization.
      - name: tokenEndpoint
        goName: TokenEndpoint
        type: url
        required: true
        description: Non-secret OAuth token URL https://ACCOUNT.app.netsuite.com/services/rest/auth/oauth2/v1/token for the same Account ID. Blank prevents authorization and refresh.
      - name: timeout
        goName: Timeout
        type: duration
        default: 15s
        description: Maximum duration of one record request as a positive Go duration such as 20s. Blank uses the displayed default; increase only for a slow account.
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        default: 1048576
        description: Maximum complete record JSON response in bytes. Blank uses the displayed default; increase only for unusually large records.
  auth:
    type: oauth2
    refreshable: true
    connectionKind: oracle-netsuite-oauth
    fields:
      - name: oauth_client_id
        goName: OAuthClientID
        type: string
        required: true
        description: Non-secret Client ID from https://ACCOUNT.app.netsuite.com > Setup > Integration > Manage Integrations > your OAuth 2.0 integration. Blank prevents authorization.
      - name: oauth_client_secret
        goName: OAuthClientSecret
        type: secretString
        required: true
        description: Secret shown once when saving the integration at https://ACCOUNT.app.netsuite.com > Setup > Integration > Manage Integrations. Save only in Dex; blank prevents authorization.
      - name: access_token
        goName: AccessToken
        type: secretString
        required: true
        description: Secret Bearer token returned by Oracle NetSuite consent and rotated by Dex. Never enter manually; blank requires authorization.
      - name: refresh_token
        goName: RefreshToken
        type: secretString
        required: true
        description: Secret refresh token returned by Oracle NetSuite consent and rotated by Dex. Never enter manually; blank requires reauthorization.
    guide:
      startURL: https://system.netsuite.com/
      steps:
        - At https://system.netsuite.com > Setup > Company > Enable Features > SuiteCloud, enable REST Web Services and OAuth 2.0. Record the Account ID from Setup > Company > Company Information; use its account-specific domains for all three URLs.
        - Under Setup > Integration > Manage Integrations > New, enable OAuth 2.0 Authorization Code Grant and REST Web Services scope. Add the exact Dex Web redirect URI. Give the consenting role permission to read customer and vendor records and the required create, edit, and delete permissions for management operations; complete any administrator approval.
        - Save the integration, then copy the Client ID and one-time Client Secret into Dex Web. Keep the secret private. Enter the account REST origin, authorization URL, and token URL using the same account ID.
        - Authorize in Dex Web with the rest_webservices scope. Dex stores access and refresh tokens outside Flow state; leave their fields blank. In Lists > Relationships > Customers or Lists > Relationships > Vendors, open a record and use its numeric internal ID as customerId or vendorId in the relevant operation. The ID is not secret; blank is invalid.
    oauth2:
      authorizationEndpoint: {fromSetting: authorizationEndpoint}
      tokenEndpoint: {fromSetting: tokenEndpoint}
      clientIDCredential: oauth_client_id
      clientSecretCredential: oauth_client_secret
      scopes: [rest_webservices]
      credentialMappings:
        - {credential: access_token, source: access_token}
        - {credential: refresh_token, source: refresh_token}
      tokenEndpointAuthMethod: client_secret_basic
      pkce: true
      refresh:
        tokenExchangeTimeout: 15s
        missingExpiry: reject
        storedMissingExpiry: refresh
        terminalErrorCodes: [invalid_grant, invalid_client, unauthorized_client]
  operations:
    - name: listCustomers
      goName: ListCustomers
      inputType: ListCustomersInput
      outputType: CustomerList
      kind: query
      description: List customer records with offset pagination.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: NetSuite returned a page of customers.}
        - {id: providerRejected, goName: ProviderRejected, description: NetSuite rejected the listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: NetSuite returned an invalid list., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample customer page is returned.
          output: {items: [{id: '107'}], totalResults: 1, hasMore: false}
    - name: getCustomer
      goName: GetCustomer
      inputType: GetCustomerInput
      outputType: CustomerSummary
      kind: query
      description: Read one customer internal ID and entity name.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: NetSuite returned the customer.}
        - {id: notFound, goName: NotFound, description: No accessible customer has this internal ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Oracle NetSuite conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: NetSuite returned malformed or oversized customer JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample customer is returned.
          output: {id: '107', entityId: CUST107}
    - name: createCustomer
      goName: CreateCustomer
      inputType: CreateCustomerInput
      outputType: CustomerSummary
      kind: mutation
      description: Create a company customer.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3, dispatchFence: true}
      branches:
        - {id: created, goName: Created, description: NetSuite created the customer.}
        - {id: uncertain, goName: Uncertain, description: Customer creation may have succeeded but cannot be confirmed., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: NetSuite rejected customer creation., optional: true}
        - {id: defect, goName: Defect, description: Customer input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample customer is created.
          output: {id: '107', entityId: CUST107}
    - name: updateCustomer
      goName: UpdateCustomer
      inputType: UpdateCustomerInput
      outputType: CustomerSummary
      kind: mutation
      description: Replace a customer's displayed entity ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: NetSuite updated the customer.}
        - {id: notFound, goName: NotFound, description: Customer is absent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: NetSuite rejected the update., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: A sample customer is updated.
          output: {id: '107', entityId: CUST107}
    - name: deleteCustomer
      goName: DeleteCustomer
      inputType: GetCustomerInput
      outputType: CustomerSummary
      kind: mutation
      description: Delete a customer by internal ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: NetSuite deleted the customer.}
        - {id: notFound, goName: NotFound, description: Customer is absent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: NetSuite rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: A sample customer is deleted.
          output: {id: '107', entityId: CUST107}
    - name: listVendors
      goName: ListVendors
      inputType: ListVendorsInput
      outputType: VendorList
      kind: query
      description: List vendor records with offset pagination.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: listed, goName: Listed, description: NetSuite returned a page of vendors.}
        - {id: providerRejected, goName: ProviderRejected, description: NetSuite rejected the listing., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: NetSuite returned an invalid list., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      mocks:
        - name: listedDefault
          branch: listed
          default: true
          description: A sample vendor page is returned.
          output: {items: [{id: '107'}], totalResults: 1, hasMore: false}
    - name: getVendor
      goName: GetVendor
      inputType: GetVendorInput
      outputType: VendorSummary
      kind: query
      description: Read one vendor internal ID and entity name.
      idempotency: none
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: found, goName: Found, description: NetSuite returned the vendor.}
        - {id: notFound, goName: NotFound, description: No accessible vendor has this internal ID., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Oracle NetSuite conclusively rejected the lookup., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: NetSuite returned malformed or oversized vendor JSON., optional: true}
        - {id: defect, goName: Defect, description: Local input or connection credentials are invalid., optional: true}
      mocks:
        - name: foundDefault
          branch: found
          default: true
          description: A sample vendor is returned.
          output: {id: '107', entityId: VEND107}
    - name: createVendor
      goName: CreateVendor
      inputType: CreateVendorInput
      outputType: VendorSummary
      kind: mutation
      description: Create a company vendor.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: sync, repeatOnUnknown: limited, maxSends: 3, dispatchFence: true}
      branches:
        - {id: created, goName: Created, description: NetSuite created the vendor.}
        - {id: uncertain, goName: Uncertain, description: Vendor creation may have succeeded but cannot be confirmed., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: NetSuite rejected vendor creation., optional: true}
        - {id: defect, goName: Defect, description: Vendor input or credentials are invalid., optional: true}
      mocks:
        - name: createdDefault
          branch: created
          default: true
          description: A sample vendor is created.
          output: {id: '107', entityId: VEND107}
    - name: updateVendor
      goName: UpdateVendor
      inputType: UpdateVendorInput
      outputType: VendorSummary
      kind: mutation
      description: Replace a vendor's displayed entity ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: updated, goName: Updated, description: NetSuite updated the vendor.}
        - {id: notFound, goName: NotFound, description: Vendor is absent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: NetSuite rejected the update., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: updatedDefault
          branch: updated
          default: true
          description: A sample vendor is updated.
          output: {id: '107', entityId: VEND107}
    - name: deleteVendor
      goName: DeleteVendor
      inputType: GetVendorInput
      outputType: VendorSummary
      kind: mutation
      description: Delete a vendor by internal ID.
      idempotency: required
      authorization: required
      execution: {executeMethodTimeout: 30s, durability: async, repeatOnUnknown: safe}
      branches:
        - {id: deleted, goName: Deleted, description: NetSuite deleted the vendor.}
        - {id: notFound, goName: NotFound, description: Vendor is absent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: NetSuite rejected the deletion., optional: true}
        - {id: defect, goName: Defect, description: Input or credentials are invalid., optional: true}
      mocks:
        - name: deletedDefault
          branch: deleted
          default: true
          description: A sample vendor is deleted.
          output: {id: '107', entityId: VEND107}
