apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: todoist
  displayName: Todoist
  description: List, read, create, update, and delete Todoist tasks through typed Dex Steps.
  company: Doist
  version: v0.4.0
spec:
  provider: todoist
  codegen:
    go:
      package: todoist
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Todoist API base URL. Leave blank for the public API; override only for a compatible HTTPS gateway or a loopback test server.
        default: https://api.todoist.com/api/v1
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one HTTP request, as a positive Go duration such as 15s. Blank uses the displayed default.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum response size in bytes, as a positive integer. Blank uses the displayed safety limit; increase only for unusually large task responses.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: todoist-personal-api-token
    fields:
      - name: api_token
        goName: APIToken
        type: secretString
        description: Secret personal API token. Open https://app.todoist.com/app/settings/integrations/developer, then Settings > Integrations > Developer and copy API token. Paste the opaque token without a Bearer prefix. Stored only as a connection credential and sent in the Authorization header; blank prevents requests.
        required: true
    guide:
      startURL: https://app.todoist.com/app/settings/integrations/developer
      steps:
        - Sign in to Todoist as the account whose tasks this connection should list, read, create, update, and delete.
        - Open Settings > Integrations > Developer and copy the personal API token under API token. This secret grants access to that account; never put it in Flow input.
        - Paste the token without a Bearer prefix into api_token and save the connection. Leave the non-secret HTTP settings blank for their displayed defaults.
        - To revoke the token, use the API token replacement control on the same Developer settings page. Save the replacement here; credentials are resolved on each operation attempt without restarting the Worker.
  operations:
    - name: getTask
      goName: GetTask
      inputType: GetTaskInput
      outputType: Task
      kind: query
      description: Read one active, non-completed task by its opaque Todoist task ID.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: Todoist returned the active task.}
        - {id: notFound, goName: NotFound, description: The active task does not exist or is not accessible., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Todoist conclusively rejected the read., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Todoist returned malformed or oversized task data., optional: true}
        - {id: defect, goName: Defect, description: "Local input is invalid, or the connection credentials are invalid, missing, or need reauthorization.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: createdTask
          branch: found
          description: "Reading task created-task just after creation finds its original title and description."
          default: true
          output: {id: created-task, projectId: inbox-project, content: Original title, description: Original description, isCompleted: false}
        - name: deletedTaskMissing
          branch: notFound
          description: "Reading task created-task after deletion receives Todoist's HTTP 404."
          failure: {kind: NOT_FOUND, message: "Todoist found no active task with that ID."}
        - name: taskReadDenied
          branch: providerRejected
          description: "Reading task denied-task without permission receives Todoist's HTTP 403."
          failure: {kind: AUTHORIZATION, message: "Todoist denied the task read."}
    - name: updateTaskContent
      goName: UpdateTask
      inputType: UpdateTaskInput
      outputType: Task
      kind: mutation
      description: Update only specified content or description fields; omitted fields are unchanged. Empty description clears it. Project moves are not supported.
      idempotency: required
      authorization: required
      branches:
        - {id: updated, goName: Updated, description: Todoist confirmed every specified field and returned the task.}
        - {id: notFound, goName: NotFound, description: "Todoist reports that the task does not exist, or the read-back after an unusable answer found no active task.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: "Todoist conclusively rejected the update, or rejected the read-back that would confirm an unusable answer.", optional: true}
        - {id: defect, goName: Defect, description: "Local input is invalid, or the connection credentials are invalid, missing, or need reauthorization.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: lifecycleTitleUpdated
          branch: updated
          description: "Updating created-task content to Original title - updated keeps its description and project."
          default: true
          output: {id: created-task, projectId: inbox-project, content: Original title - updated, description: Original description, isCompleted: false}
        - name: taskMissingDuringUpdate
          branch: notFound
          description: "Updating task missing-task receives Todoist's HTTP 404 before any change."
          failure: {kind: NOT_FOUND, message: "Todoist found no active task to update."}
        - name: taskUpdateDenied
          branch: providerRejected
          description: "Updating task denied-task without permission receives Todoist's HTTP 403."
          failure: {kind: AUTHORIZATION, message: "Todoist denied the task update."}
    - name: listTasks
      goName: ListTasks
      inputType: ListTasksInput
      outputType: TaskPage
      kind: query
      description: Read one cursor-paginated page of active tasks, optionally filtered by project.
      idempotency: none
      authorization: required
      branches:
        - {id: listed, goName: Listed, description: "Todoist returned a page of active tasks, possibly empty."}
        - {id: providerRejected, goName: ProviderRejected, description: Todoist conclusively rejected the list request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Todoist returned malformed or oversized page data., optional: true}
        - {id: defect, goName: Defect, description: "Local input is invalid, or the connection credentials are invalid, missing, or need reauthorization.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      pagination: {inputField: cursor, nextField: nextCursor}
      mocks:
        - name: inboxTasksAcrossPages
          branch: listed
          description: "Listing inbox-project tasks from a blank cursor finds unrelated tasks before created-task on page three."
          default: true
          pages:
            - {tasks: [{id: other-2, projectId: inbox-project, content: Prepare report, description: "", isCompleted: false}, {id: other-1, projectId: inbox-project, content: Check draft, description: "", isCompleted: false}], nextCursor: inbox-page-2}
            - {tasks: [{id: other-1, projectId: inbox-project, content: Check draft, description: "", isCompleted: false}], nextCursor: inbox-page-3}
            - {tasks: [{id: created-task, projectId: inbox-project, content: Original title - updated, description: Original description, isCompleted: false}]}
        - name: taskListDenied
          branch: providerRejected
          description: "Listing denied-project tasks without permission receives Todoist's HTTP 403."
          failure: {kind: AUTHORIZATION, message: "Todoist denied the task listing."}
    - name: createTask
      goName: CreateTask
      inputType: CreateTaskInput
      outputType: Task
      kind: mutation
      description: Create a task with content and optional description or project; omitted project uses Inbox. Sends a stable X-Request-ID.
      idempotency: required
      authorization: required
      branches:
        - {id: created, goName: Created, description: Todoist confirmed creation and returned the task ID.}
        - {id: providerRejected, goName: ProviderRejected, description: Todoist conclusively rejected creation., optional: true}
        - {id: uncertain, goName: Uncertain, description: "A creation that may have been sent may have applied, but Todoist returned no usable task and the request ID has no documented replay guarantee.", optional: true}
        - {id: defect, goName: Defect, description: "Local input is invalid, or the connection credentials are invalid, missing, or need reauthorization.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m, reason: {kind: duplicateWriteRisk, explanation: "Todoist does not state how long it deduplicates X-Request-ID, so bound createTask retries while that provider guarantee is unknown."}}
      mocks:
        - name: disposableTaskCreated
          branch: created
          description: "Creating Original title with Original description in Inbox returns task created-task."
          default: true
          output: {id: created-task, projectId: inbox-project, content: Original title, description: Original description, isCompleted: false}
        - name: taskCreationDenied
          branch: providerRejected
          description: "Creating a task in denied-project without permission receives Todoist's HTTP 403."
          failure: {kind: AUTHORIZATION, message: "Todoist denied task creation."}
    - name: deleteTask
      goName: DeleteTask
      inputType: DeleteTaskInput
      outputType: DeleteTaskOutcome
      kind: mutation
      description: Delete a task and its subtasks by immutable task ID. Retried deletion may observe that the task is already absent.
      idempotency: required
      authorization: required
      branches:
        - {id: deleted, goName: Deleted, description: Todoist acknowledged the deletion.}
        - {id: alreadyAbsent, goName: AlreadyAbsent, description: "Todoist returned 404; the task is missing or inaccessible, possibly after an earlier successful attempt.", optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Todoist conclusively rejected deletion., optional: true}
        - {id: defect, goName: Defect, description: "Local input is invalid, or the connection credentials are invalid, missing, or need reauthorization.", optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: disposableTaskDeleted
          branch: deleted
          description: "Deleting created-task after its update removes the disposable task."
          default: true
          output: {taskId: created-task}
        - name: taskAlreadyAbsent
          branch: alreadyAbsent
          description: "Deleting missing-task after an earlier attempt receives Todoist's HTTP 404."
          output: {taskId: missing-task}
          failure: {kind: NOT_FOUND, message: "Todoist found no active task to delete."}
        - name: taskDeletionDenied
          branch: providerRejected
          description: "Deleting denied-task without permission receives Todoist's HTTP 403."
          failure: {kind: AUTHORIZATION, message: "Todoist denied task deletion."}
