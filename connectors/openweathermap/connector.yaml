apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: openweathermap
  displayName: OpenWeatherMap
  description: Read current weather and a five-day forecast by coordinates.
  company: OpenWeatherMap
  version: v0.1.0
spec:
  provider: openweathermap
  codegen:
    go:
      package: openweathermap
  configuration:
    fields:
      - name: baseUrl
        goName: BaseURL
        type: url
        description: Public OpenWeatherMap API base URL. Leave blank for the displayed default; override only for a trusted compatible gateway or a loopback test server.
        default: https://api.openweathermap.org
      - name: timeout
        goName: Timeout
        type: duration
        description: Maximum duration of one provider HTTP request, as a positive Go duration such as 15s or 1m. Leave blank for the displayed default; increase only for slow responses.
        default: 15s
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Positive maximum response size in bytes. Leave blank for the displayed default; increase only for a known larger response. Oversized replies select invalidResponse.
        default: 1048576
  auth:
    type: apiKey
    connectionKind: openweathermap-api-key
    fields:
      - name: api_key
        goName: APIKey
        type: secretString
        description: Secret API key from OpenWeather account > API keys > Generate at https://home.openweathermap.org/api_keys. Copy the provider-issued string into this field; blank makes calls select defect. It is stored as a secret and sent in the required appid URL query parameter.
        required: true
    guide:
      startURL: https://home.openweathermap.org/api_keys
      steps:
        - Open https://home.openweathermap.org/api_keys and sign in or create an account.
        - Navigate to OpenWeather account > API keys > Generate; create or select a key with permission for the listed read or generation operations, and copy its provider-issued string.
        - Paste it into the secret api_key field and save the connection. Leave baseUrl, timeout, and maxResponseBytes blank to use their displayed defaults.
  operations:
    - name: getCurrentWeather
      goName: GetCurrentWeather
      inputType: WeatherInput
      outputType: CurrentWeatherOutput
      kind: query
      description: GetCurrentWeather through the documented OpenWeatherMap API.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "OpenWeatherMap returned the requested result."}
        - {id: notFound, goName: NotFound, description: The requested coordinates have no weather data., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: foundDefault
          branch: found
          description: A representative OpenWeatherMap result for the example Flow.
          default: true
          output: {"city":"Meridian","temperature":21.5,"description":"clear sky"}
    - name: getForecast
      goName: GetForecast
      inputType: WeatherInput
      outputType: ForecastOutput
      kind: query
      description: GetForecast through the documented OpenWeatherMap API.
      idempotency: none
      authorization: required
      branches:
        - {id: found, goName: Found, description: "OpenWeatherMap returned the requested result."}
        - {id: notFound, goName: NotFound, description: The requested coordinates have no weather data., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: The provider conclusively rejected the request., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: The provider returned malformed or oversized data., optional: true}
        - {id: defect, goName: Defect, description: Local input or credentials are invalid., optional: true}
      execution:
        executeMethodTimeout: 30s
        durability: async
      mocks:
        - name: foundDefault
          branch: found
          description: A representative OpenWeatherMap result for the example Flow.
          default: true
          output: {"city":"Meridian","entries":[{"timestamp":1793210400,"temperature":20.1}]}
