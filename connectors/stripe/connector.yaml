apiVersion: connectors.dex.dev/v1alpha1
kind: Connector
metadata:
  name: stripe
  displayName: Stripe
  description: Create and reconcile hosted card or ACH Checkout Sessions, read PaymentIntents, refund payments, and receive signed Checkout Session events.
  company: Stripe
  version: v0.24.1
spec:
  provider: stripe
  codegen:
    go:
      package: stripe
  configuration:
    fields:
      - name: endpoint
        goName: Endpoint
        type: url
        description: Stripe API base URL; leave blank for Stripe's public v1 API. Enter an absolute HTTPS URL only for an explicitly supported compatible gateway.
        required: false
        default: https://api.stripe.com/v1
      - name: maxResponseBytes
        goName: MaxResponseBytes
        type: integer
        description: Maximum complete Stripe API response in bytes; enter a positive integer only to change the safety limit. Oversized responses select invalidResponse.
        required: false
        default: 1048576
      - name: webhookMaxBodyBytes
        goName: WebhookMaxBodyBytes
        type: integer
        description: Maximum raw signed webhook request body in bytes; enter a positive integer only to change the safety limit. Larger bodies are rejected before signature verification.
        required: false
        default: 1048576
      - name: webhookSignatureTolerance
        goName: WebhookSignatureTolerance
        type: duration
        description: Maximum accepted Stripe-Signature timestamp age, using a positive Go duration such as 5m; reduce only when clocks are synchronized and replay tolerance can be stricter.
        required: false
        default: 5m
  auth:
    defaultMethod: api-key-with-webhook
    methodLabel: Connection type
    methods:
      - id: api-key-with-webhook
        displayName: API key and webhook
        description: Use Stripe API operations and receive signed Checkout Session events.
        type: apiKey
        connectionKind: stripe-secret-key-webhook
        fields:
          - name: secret_key
            goName: SecretKey
            type: secretString
            description: Secret Stripe key from Developers > API keys; use an rk_test_/rk_live_ restricted key with the permissions required by your operations, otherwise an sk_test_/sk_live_ key.
            required: true
          - name: webhook_secret
            goName: WebhookSecret
            type: secretString
            description: Secret whsec_ signing secret from Developers > Webhooks > select the Dex endpoint > Signing secret > Reveal; this is different from an API key.
            required: true
        guide:
          startURL: https://dashboard.stripe.com/apikeys
          steps:
            - Choose Test mode or Live mode, open Developers > API keys, and create a restricted key with the permissions required by your operations (CreateRefund needs Refund read and write) or reveal the matching secret key.
            - Open Developers > Webhooks, create or select the endpoint that sends Checkout Session events to the application, then reveal and copy its whsec_ signing secret.
            - Keep the API key and webhook endpoint in the same Stripe mode; paste rk_/sk_ into secret_key and whsec_ into webhook_secret.
      - id: api-key-only
        displayName: API key only
        description: Use Stripe API operations without a webhook or signing secret.
        recommended: true
        type: apiKey
        connectionKind: stripe-secret-key-only
        fields:
          - name: secret_key
            goName: SecretKey
            type: secretString
            description: Secret rk_test_/rk_live_ restricted or sk_test_/sk_live_ key from Developers > API keys. Grant only the permissions needed by the chosen operations.
            required: true
        guide:
          startURL: https://dashboard.stripe.com/apikeys
          steps:
            - Choose Test mode or Live mode, open Developers > API keys, and create a restricted key with permissions for the selected API operations (CreateRefund needs Refund read and write) or reveal the matching secret key.
            - Paste the key into secret_key. No webhook endpoint or signing secret is needed for API operations alone.
  triggers:
    - name: checkoutSessionUpdated
      goName: CheckoutSessionUpdated
      eventType: CheckoutSessionEvent
      configurationType: CheckoutSessionUpdatedTriggerConfiguration
      description: Receive a verified Checkout Session completion, delayed-payment, or expiration event.
  operations:
    - name: createCardCheckoutSession
      goName: CreateCardCheckoutSession
      inputType: CreateCardCheckoutSessionInput
      outputType: CheckoutSession
      kind: mutation
      description: Create one Stripe-hosted Checkout Session for a card payment; keep any overridden retry window within the 24 hours that Stripe keeps idempotency keys.
      idempotency: required
      branches:
        - {id: created, goName: Created, description: Stripe created the Checkout Session.}
        - {id: providerRejected, goName: ProviderRejected, description: Stripe conclusively rejected the Checkout Session request., optional: true}
        - {id: uncertain, goName: Uncertain, description: A Stripe 500 or non-retryable server response left the Checkout Session outcome unconfirmed., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Stripe returned an invalid or oversized Checkout Session response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: &stripeExecution
        executeMethodTimeout: 30s
        durability: async
        retry: {initialInterval: 1s, backoffCoefficient: 2, maximumInterval: 30s, maximumAttempts: 5, totalDuration: 2m}
      mocks:
        - name: createdCardSession
          branch: created
          description: Stripe created an open hosted card Checkout Session.
          default: true
          output: {id: cs_test_card123, url: "https://checkout.stripe.com/c/pay/cs_test_card123", clientReferenceId: registration-card-42, paymentStatus: unpaid, status: open, currency: usd, amountTotal: 7500, metadata: {registration_id: registration-card-42}}
        - name: invalidCardRequest
          branch: providerRejected
          description: Stripe rejected the card Checkout Session parameters.
          failure: {kind: PROVIDER_REJECTION, message: Stripe rejected the request}
        - name: unconfirmedCardSession
          description: Stripe cached a 500 for the card request and the created Session cannot be confirmed.
          uncertain: {failure: {kind: AVAILABILITY, message: Stripe Checkout Session outcome cannot be confirmed after a server error}}
        - name: malformedCardSession
          branch: invalidResponse
          description: Stripe returned a body that is not a Checkout Session.
          failure: {kind: PROTOCOL, message: "Stripe response is invalid: Stripe returned an invalid Checkout Session"}
        - name: invalidCardCurrency
          branch: defect
          description: The currency is not a lowercase three-letter code.
          failure: {kind: VALIDATION, message: currency must be a lowercase three-letter code}
    - name: createACHCheckoutSession
      goName: CreateACHCheckoutSession
      inputType: CreateACHCheckoutSessionInput
      outputType: CheckoutSession
      kind: mutation
      description: Create one Stripe-hosted Checkout Session for a US bank account payment; keep any overridden retry window within the 24 hours that Stripe keeps idempotency keys.
      idempotency: required
      branches:
        - {id: created, goName: Created, description: Stripe created the Checkout Session.}
        - {id: providerRejected, goName: ProviderRejected, description: Stripe conclusively rejected the Checkout Session request., optional: true}
        - {id: uncertain, goName: Uncertain, description: A Stripe 500 or non-retryable server response left the Checkout Session outcome unconfirmed., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Stripe returned an invalid or oversized Checkout Session response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *stripeExecution
      mocks:
        - name: createdSession
          branch: created
          description: Stripe created an open hosted Checkout Session.
          default: true
          output: {id: cs_test_a1b2c3, url: "https://checkout.stripe.com/c/pay/cs_test_a1b2c3", clientReferenceId: registration-42, paymentStatus: unpaid, status: open, currency: usd, amountTotal: 7500, metadata: {registration_id: registration-42}}
        - name: invalidRequest
          branch: providerRejected
          description: Stripe rejected the Checkout Session parameters.
          failure: {kind: PROVIDER_REJECTION, message: Stripe rejected the request}
        - name: unconfirmedSession
          description: Stripe cached a 500 for the bank payment request and the created Session cannot be confirmed.
          uncertain: {failure: {kind: AVAILABILITY, message: Stripe Checkout Session outcome cannot be confirmed after a server error}}
        - name: malformedSession
          branch: invalidResponse
          description: Stripe returned a body that is not a Checkout Session.
          failure: {kind: PROTOCOL, message: "Stripe response is invalid: Stripe returned an invalid Checkout Session"}
        - name: invalidCurrency
          branch: defect
          description: The currency is not a lowercase three-letter code.
          failure: {kind: VALIDATION, message: currency must be a lowercase three-letter code}
    - name: getCheckoutSession
      goName: GetCheckoutSession
      inputType: GetCheckoutSessionInput
      outputType: CheckoutSession
      kind: query
      description: Retrieve one Checkout Session by Stripe ID.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: The Checkout Session exists and was returned.}
        - {id: notFound, goName: NotFound, description: The Checkout Session does not exist., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Stripe conclusively rejected the Checkout Session query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Stripe returned an invalid or oversized Checkout Session response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *stripeExecution
      mocks:
        - name: paidSession
          branch: found
          description: A completed Checkout Session whose payment is paid.
          default: true
          output: {id: cs_test_a1b2c3, paymentStatus: paid, status: complete, paymentIntentId: pi_3Pabc123, currency: usd, amountTotal: 7500}
        - name: missingSession
          branch: notFound
          description: Stripe reports no such Checkout Session.
          failure: {kind: NOT_FOUND, message: Stripe Checkout Session was not found}
        - name: unauthorizedKey
          branch: providerRejected
          description: Stripe rejected the API key.
          failure: {kind: AUTHENTICATION, message: Stripe rejected the request}
        - name: malformedSession
          branch: invalidResponse
          description: Stripe returned a body that is not a Checkout Session.
          failure: {kind: PROTOCOL, message: "Stripe response is invalid: Stripe returned an invalid Checkout Session"}
        - name: invalidSessionID
          branch: defect
          description: The Checkout Session ID is empty or not a cs_ identifier.
          failure: {kind: VALIDATION, message: Stripe Checkout Session ID is required}
    - name: getPaymentIntent
      goName: GetPaymentIntent
      inputType: GetPaymentIntentInput
      outputType: PaymentIntent
      kind: query
      description: Retrieve one PaymentIntent with its refunded amount and customer email.
      idempotency: none
      branches:
        - {id: found, goName: Found, description: The PaymentIntent exists and was returned.}
        - {id: notFound, goName: NotFound, description: Stripe reported resource_missing for the PaymentIntent., optional: true}
        - {id: providerRejected, goName: ProviderRejected, description: Stripe conclusively rejected the PaymentIntent query., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Stripe returned an invalid or oversized PaymentIntent response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *stripeExecution
      mocks:
        - name: partiallyRefundedPayment
          branch: found
          description: A succeeded PaymentIntent with part of its amount already refunded.
          default: true
          output: {id: pi_3Pabc123, amount: 7500, currency: usd, status: succeeded, amountRefunded: 2500, customerEmail: person@example.com, latestChargeId: ch_3Pabc123}
        - name: missingPaymentIntent
          branch: notFound
          description: Stripe reports no such PaymentIntent.
          failure: {kind: NOT_FOUND, message: "Stripe PaymentIntent was not found: resource_missing"}
        - name: unauthorizedKey
          branch: providerRejected
          description: Stripe rejected the API key.
          failure: {kind: AUTHENTICATION, message: Stripe rejected the request}
        - name: malformedPaymentIntent
          branch: invalidResponse
          description: Stripe returned a body that is not a PaymentIntent.
          failure: {kind: PROTOCOL, message: "Stripe response is invalid: Stripe returned an invalid PaymentIntent"}
        - name: invalidPaymentIntentID
          branch: defect
          description: The PaymentIntent ID is empty or not a pi_ identifier.
          failure: {kind: VALIDATION, message: Stripe PaymentIntent ID must be a pi_ identifier}
    - name: createRefund
      goName: CreateRefund
      inputType: CreateRefundInput
      outputType: Refund
      kind: mutation
      description: Refund part or all of one PaymentIntent in minor currency units; keep any overridden retry window within the 24 hours that Stripe keeps idempotency keys.
      idempotency: required
      branches:
        - {id: refunded, goName: Refunded, description: Stripe accepted the refund; read its status to tell succeeded from pending.}
        - {id: providerRejected, goName: ProviderRejected, description: Stripe conclusively rejected the refund with a 4xx error such as charge_already_refunded or an amount that is too large., optional: true}
        - {id: uncertain, goName: Uncertain, description: A non-retryable Stripe server response left the refund outcome unconfirmed after bounded read-back., optional: true}
        - {id: invalidResponse, goName: InvalidResponse, description: Stripe returned an invalid or oversized refund response., optional: true}
        - {id: defect, goName: Defect, description: "Local input, connection configuration, or connector definition is invalid.", optional: true}
      execution: *stripeExecution
      mocks:
        - name: succeededRefund
          branch: refunded
          description: Stripe created a refund that has already succeeded.
          default: true
          output: {refundId: re_3Pabc123, status: succeeded, amount: 2500, currency: usd}
        - name: alreadyRefunded
          branch: providerRejected
          description: Stripe rejected the refund because the charge is already fully refunded.
          failure: {kind: PROVIDER_REJECTION, message: "Stripe rejected the refund: charge_already_refunded: Charge ch_3Pabc123 has already been refunded."}
        - name: unconfirmedRefund
          description: Stripe cached a 500 and bounded refund read-back found no matching call ID.
          uncertain: {failure: {kind: AVAILABILITY, message: Stripe refund outcome cannot be confirmed after a server error}}
        - name: malformedRefund
          branch: invalidResponse
          description: Stripe returned a body that is not a refund.
          failure: {kind: PROTOCOL, message: "Stripe response is invalid: Stripe returned an invalid refund"}
        - name: invalidAmount
          branch: defect
          description: The refund amount is not positive.
          failure: {kind: VALIDATION, message: refund amount must be positive}
