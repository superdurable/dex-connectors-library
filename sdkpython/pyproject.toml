[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dex-connectors-sdk"
version = "0.1.0"
description = "Python core for Dex-native provider connectors"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["dex-python-sdk>=1.26.0", "httpx>=0.27", "boto3>=1.35", "cryptography>=43"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.7", "types-boto3[s3]>=1.35"]

[tool.hatch.build.targets.wheel]
packages = ["src/dex_connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
