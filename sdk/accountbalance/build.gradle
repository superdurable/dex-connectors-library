plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories { mavenCentral() }

dependencies {
    api "io.superdurable:dex-connectors-sdk:${dexConnectorsSdkVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        connector(MavenPublication) {
            from components.java
            pom {
                name = project.name
                description = 'Read account balances from a Dex Flow.'
                url = 'https://github.com/superdurable/dex-connectors-library'
                licenses { license { name = 'MIT'; url = 'https://opensource.org/licenses/MIT' } }
                developers { developer { name = 'Super Durable' } }
                scm {
                    url = 'https://github.com/superdurable/dex-connectors-library'
                    connection = 'scm:git:https://github.com/superdurable/dex-connectors-library.git'
                    developerConnection = 'scm:git:ssh://git@github.com/superdurable/dex-connectors-library.git'
                }
            }
        }
    }
}

def connectorPath = findProperty('connectorPath') ?: projectDir.parentFile.name
def conformanceDir = file('../' * (connectorPath.tokenize('/').size() + 2) + 'conformance')

sourceSets {
    example {
        java.srcDir 'examples'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    test {
        java.srcDir new File(conformanceDir, 'runners/java')
        compileClasspath += sourceSets.example.output
        runtimeClasspath += sourceSets.example.output
    }
}

def workerClass = findProperty('accountWorkerClass') ?: 'AccountBalanceWorker'
tasks.register(workerClass.uncapitalize(), JavaExec) {
    classpath = sourceSets.example.runtimeClasspath
    mainClass = "io.superdurable.dexconnectors.${projectDir.parentFile.name}.${workerClass}"
}

test {
    inputs.file(providers.environmentVariable('CONNECTOR_CONFORMANCE_FIXTURE')
            .orElse(new File(conformanceDir, "connectors/${connectorPath}/scenarios.json").absolutePath))
    useJUnitPlatform { excludeTags 'dex-dev' }
}
tasks.register('dexDevTest', Test) {
    useJUnitPlatform { includeTags 'dex-dev' }
    outputs.upToDateWhen { false }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}
